clam lady","ver":"Libros etiquetados \"Art History A-Z\" junto al cuadro de la mujer en la concha marina.","clinica":"La azitromicina trata la uretritis y cervicitis causadas por Chlamydia trachomatis.","sketchy":"La dama de la concha (\"clam\") marca Chlamydia, y \"A-Z\" es la clave fija de azitromicina.","literal":"Azithromycin treats urethritis and cervicitis caused by Chlamydia trachomatis"},{"n":"18","nombre":"Red crow goop + baby","ver":"Un cuervo rojo sobre un cuadro que muestra a una mujer sosteniendo un bebé.","clinica":"La eritromicina previene la oftalmía neonatal.","sketchy":"El cuervo \"rojo\" (erythro- = rojo) marca la eritromicina, y el bebé señala la profilaxis ocular del recién nacido.","literal":"Erythromycin prevents ophthalmia neonatorum"},{"n":"19","nombre":"Crow + \"Keep Clear\" + helicopter model","ver":"Un cuervo junto a un cartel que dice \"Keep Clear\" y un modelo de helicóptero colgando del techo.","clinica":"La claritromicina es parte del régimen de tratamiento de primera línea contra las infecciones por Helicobacter pylori.","sketchy":"\"Clear\" es la clave de claritromicina y el \"helicóptero\" la de Helicobacter, combinando fármaco y bacteria.","literal":"Clarithromycin is part of the first-line treatment regimen against Helicobacter pylori infections"},{"n":"20","nombre":"Fiddle + dilapidated colon tunnel","ver":"Un violín (fiddle) colgado en la pared, junto a un túnel deteriorado con forma de colon.","clinica":"La fidaxomicina es un potente antibiótico oral usado en el tratamiento de la colitis por C. difficile.","sketchy":"El violín (\"fiddle\") es la clave de fidaxomicina y el túnel-colon deteriorado señala la colitis.","literal":"Fidaxomicin is a potent oral antibiotic used in the treatment of C. difficile colitis"},{"n":"21","nombre":"Injured liver","ver":"Un plato con trozos de hígado crudo y lastimado sobre la mesa.","clinica":"Los macrólidos son hepatotóxicos (incluye desde daño leve del conducto biliar intrahepático hasta lesión hepatocelular severa e insuficiencia hepática).","sketchy":"El hígado dañado en el plato es la representación literal de la hepatotoxicidad.","literal":"Macrolides are hepatotoxic (includes mild damage to intrahepatic bile duct or severe hepatocellular injury and liver failure)"},{"n":"22","nombre":"Yellow skin","ver":"El personaje sentado a la mesa (Edgar Allan Poe) con la piel de un tono amarillento marcado.","clinica":"Los macrólidos pueden causar lesión del conducto biliar intrahepático → obstrucción biliar → hepatitis colestásica aguda → ictericia.","sketchy":"La piel amarilla es la representación literal directa de la ictericia.","literal":"Macrolides can cause intrahepatic biliary duct injury → biliary obstruction → acute cholestatic hepatitis → jaundice"},{"n":"23","nombre":"Telltale heart + EKG strip","ver":"Un corazón latiendo bajo las tablas del suelo, con una tira de electrocardiograma saliendo de él.","clinica":"Los macrólidos prolongan el intervalo Q-T, lo que aumenta el riesgo de arritmia fatal (ej. torsades de pointes).","sketchy":"El \"corazón delator\" de Poe con la tira de ECG representa directamente la prolongación del QT y el riesgo de arritmia.","literal":"Macrolides prolong the Q-T interval, which increases the risk for fatal dysrhythmia (e.g., torsades de pointes)"},{"n":"24","nombre":"Red mask","ver":"Una máscara roja de demonio colgando cerca de la ventana.","clinica":"Los macrólidos pueden causar reacciones cutáneas de hipersensibilidad retardada, raras pero severas (DRESS, SJS).","sketchy":"La máscara roja alude a \"La máscara de la muerte roja\" de Poe y representa las reacciones cutáneas graves.","literal":"Macrolides can cause rare severe delayed hypersensitivity skin reactions (DRESS, SJS)"},{"n":"25","nombre":"Broken chrome bumper","ver":"Un parachoques cromado roto de un automóvil antiguo, a la derecha de la escena.","clinica":"Los macrólidos inhiben el citocromo P450.","sketchy":"\"Chrome\" es la clave de \"citocromo\", el parachoques lleva la etiqueta P450 y el hecho de estar roto marca la inhibición.","literal":"Macrolides inhibit cytochrome P450"},{"n":"26","nombre":"Broken bike pump","ver":"Una bomba de bicicleta rota junto al automóvil.","clinica":"Los macrólidos son inhibidores potentes de la bomba de eflujo Pgp en humanos (la Pgp se expresa abundantemente en las células epiteliales intestinales).","sketchy":"La bomba rota representa literalmente la bomba de eflujo Pgp inhibida.","literal":"Macrolides are strong inhibitors of Pgp efflux pump in humans (Pgp is highly expressed on intestinal epithelial cells)"}],"mapa":"imagenes/macrolidos-mapa.webp","texto":"imagenes/macrolidos-texto.webp"},{"slug":"vancomicina","titulo":"Vancomicina","items":[{"n":"1","nombre":"Purple coccoid temples","ver":"Estructuras redondeadas de color púrpura, como cúpulas o templos, coronando las colinas del fondo.","clinica":"Actividad contra bacterias gram-positivas (ej. Staph, Strep).","sketchy":"La forma redondeada (coccoide) y el color púrpura combinan las dos claves: cocos y tinción gram-positiva.","literal":"Activity against gram positive bacteria (e.g. Staph, Strep)"},{"n":"2","nombre":"No mercy pharaoh","ver":"Una gran esfinge/faraón de piedra con expresión severa, junto a un cartel que dice \"NO MERCY\".","clinica":"La vancomicina tiene actividad contra Staphylococcus aureus resistente a meticilina (MRSA).","sketchy":"El faraón \"merciful\" es el símbolo de meticilina en toda la serie; aquí aparece como \"NO MERCY\", indicando que la vancomicina sí vence al MRSA.","literal":"Vancomycin has activity against Methicillin-resistant Staph aureus (MRSA)"},{"n":"3","nombre":"Golden staff","ver":"Un bastón dorado sostenido en alto por el explorador que se columpia.","clinica":"Staphylococcus aureus (cocos gram-positivos).","sketchy":"\"Golden staff\" es el símbolo mnemotécnico fijo de Staphylococcus aureus (\"aureus\" = dorado).","literal":"Staphylococcus aureus (gram-positive cocci)"},{"n":"4","nombre":"Van","ver":"Una furgoneta verde grande estacionada en el centro-derecha de la escena.","clinica":"Vancomicina (antibiótico glicopéptido).","sketchy":"\"Van\" (furgoneta) es la clave mnemotécnica fija de \"vancomycin\" en toda la serie.","literal":"Vancomycin (glycopeptide antibiotic)"},{"n":"5","nombre":"Temple wall hieroglyphs","ver":"Jeroglíficos que dicen \"D-ALA\" repetidos por todo el muro del templo.","clinica":"Inhibición de la síntesis de la pared celular al unirse directamente a los oligopéptidos D-alanil-D-alanina.","sketchy":"Los bloques \"D-ALA\" que forman literalmente la pared del templo representan los oligopéptidos D-Ala-D-Ala de la pared celular bacteriana.","literal":"inhibition of cell wall synthesis by directly binding D-alanyl-Dalanine oligopeptides"},{"n":"6","nombre":"Altered wall builder","ver":"Un constructor de apariencia alterada trabajando en la pared del templo, a la izquierda.","clinica":"Proteínas de unión a penicilina (PBPs) alteradas, resistentes a los beta-lactámicos.","sketchy":"El \"constructor alterado\" es el símbolo recurrente de las PBPs modificadas, ya visto en MRSA.","literal":"altered penicillin binding proteins (PBPs) resistant to beta-lactams"},{"n":"7","nombre":"Ineffective altered wall builder","ver":"El constructor alterado derribado en el suelo, incapaz de seguir construyendo.","clinica":"Las PBPs alteradas del MRSA son ineficaces contra la vancomicina.","sketchy":"El constructor caído representa que ese mecanismo de resistencia no le sirve al MRSA frente a la vancomicina, porque ésta no actúa sobre las PBPs.","literal":"MRSA's altered PBPs are ineffective against vancomycin"},{"n":"8","nombre":"Ineffective beta guard","ver":"Un guardia con casco derrotado, dándose la vuelta, incapaz de detener el ataque.","clinica":"Las beta-lactamasas son ineficaces contra la vancomicina.","sketchy":"El guardia vencido representa la beta-lactamasa inútil, ya que la vancomicina no es un beta-lactámico y no tiene ese anillo que romper.","literal":"Beta-lactamases are ineffective against vancomycin"},{"n":"9","nombre":"Ivy","ver":"Hiedra verde (ivy) trepando por la columna del templo.","clinica":"Administración IV (intravenosa).","sketchy":"\"Ivy\" suena idéntico a \"IV\" en inglés, siendo la clave mnemotécnica de la vía intravenosa.","literal":"IV administration"},{"n":"10","nombre":"Meningitis mohawk","ver":"Un casco con cresta roja tipo mohawk sobre la cabeza de un personaje.","clinica":"La vancomicina (con cefepime, ceftazidima o meropenem) puede usarse como tratamiento empírico de la meningitis adquirida en el hospital (ej. Strep pneumo resistente a penicilina - PRSP).","sketchy":"El casco/cresta sobre la cabeza es el símbolo recurrente de meningitis en toda la serie.","literal":"vancomycin (with cefepime, ceftazidime, or meropenem) can be used as empiric treatment of healthcare-acquired meningitis (e.g. penicillin-resistant Strep pneumo - PRSP)"},{"n":"11","nombre":"Fish bones","ver":"Esqueletos de pescado esparcidos en el suelo arenoso.","clinica":"La vancomicina trata la osteomielitis por MRSA.","sketchy":"Las espinas de pescado representan el hueso, símbolo fijo de osteomielitis en toda la serie.","literal":"Vancomycin treats MRSA osteomyelitis"},{"n":"12","nombre":"Coughing nurse","ver":"Una enfermera con uniforme blanco y cofia, tosiendo junto a la furgoneta.","clinica":"La vancomicina tiene actividad contra infecciones nosocomiales por MRSA (ej. neumonía adquirida en el hospital).","sketchy":"La enfermera representa el ambiente hospitalario (nosocomial) y la tos señala la neumonía.","literal":"Vancomycin has activity against nosocomial MRSA infections (e.g. hospital acquired pneumonia)"},{"n":"13","nombre":"Biofilm on lines and valves","ver":"Un trabajador tendido bajo la furgoneta, junto a mangueras y válvulas cubiertas de una sustancia pegajosa.","clinica":"La vancomicina tiene actividad contra infecciones por Staphylococcus epidermidis (ej. endocarditis).","sketchy":"El biofilm sobre líneas y válvulas es el símbolo fijo de S. epidermidis, que se adhiere a catéteres y válvulas protésicas.","literal":"Vancomycin has activity against Staph epidermidis infections (e.g. endocarditis)"},{"n":"14","nombre":"Heart shaped headpiece","ver":"Un tocado dorado con una gema roja en forma de corazón en lo alto del bastón.","clinica":"La vancomicina se usa como tratamiento empírico de la endocarditis.","sketchy":"La forma de corazón señala directamente la afectación cardíaca (endocarditis).","literal":"Vancomycin is used as an empiric treatment of endocarditis"},{"n":"15","nombre":"Diplococcus rock drums","ver":"Un personaje sentado en lo alto del templo golpeando dos rocas púrpuras emparejadas, como tambores.","clinica":"La vancomicina tiene actividad contra infecciones por Enterococcus.","sketchy":"Las dos rocas emparejadas representan la disposición en pares (diplococos) de los enterococos.","literal":"Vancomycin has activity against Enterococcus infections"},{"n":"16","nombre":"D-LAC hieroglyph","ver":"Un bloque de piedra suelto grabado con \"D-LAC\", separado del resto del muro \"D-ALA\".","clinica":"D-ALA-D-LAC confiere resistencia a la vancomicina (ej. VRE).","sketchy":"El cambio de \"D-ALA\" a \"D-LAC\" en los bloques es la representación literal de la mutación que impide que la vancomicina se una a la pared.","literal":"D-ALA-D-LAC confers resistance to vancomycin (e.g. VRE)"},{"n":"17","nombre":"Temple of flowing chocolate","ver":"Una estatua de piedra de cuya boca brota chocolate líquido hacia una fuente circular.","clinica":"La vancomicina oral trata las infecciones por Clostridioides difficile (ej. colitis pseudomembranosa).","sketchy":"El chocolate que fluye desde la boca es el símbolo fijo de la diarrea de C. difficile, y el hecho de salir por la boca marca la vía oral del tratamiento.","literal":"Oral vancomycin treats Clostridioides difficile infections (e.g. pseudomembranous colitis)"},{"n":"18","nombre":"Red statue","ver":"Una gran estatua de Anubis de color rojo intenso a la derecha de la escena.","clinica":"La vancomicina puede causar rubor por liberación de histamina, conocido como síndrome de rubor por vancomicina (antes llamado \"síndrome del hombre rojo\").","sketchy":"La estatua completamente roja es la representación literal del enrojecimiento generalizado de este efecto adverso.","literal":"Vancomycin can cause flushing due to histamine release, known as vancomycin flushing syndrome (formerly \"red man syndrome\")"},{"n":"19","nombre":"Beehive","ver":"Una colmena de abejas colgando cerca de la estatua roja.","clinica":"La activación de mastocitos por la vancomicina desencadena la liberación de histamina.","sketchy":"La abeja/colmena es el símbolo fijo de histamina en toda la serie (por la reacción a la picadura).","literal":"Mast cell activation from vancomycin triggers histamine release"},{"n":"20","nombre":"Blue venous vines","ver":"Enredaderas azules recorriendo la base de la fuente, como venas.","clinica":"La administración de vancomicina puede causar tromboflebitis.","sketchy":"Las enredaderas azules representan las venas inflamadas por la infusión del fármaco.","literal":"Vancomycin administration can cause thrombophlebitis"},{"n":"21","nombre":"Ototoxic gong","ver":"Un personaje golpeando un gong dorado en la parte alta derecha de la escena.","clinica":"La vancomicina puede causar ototoxicidad.","sketchy":"El estruendo del gong representa directamente el daño al oído (ototoxicidad).","literal":"Vancomycin can cause ototoxicity"},{"n":"22","nombre":"Falling kidney","ver":"Un objeto dorado con forma de riñón cayendo desde la estatua roja.","clinica":"La vancomicina puede causar nefrotoxicidad.","sketchy":"El riñón cayendo representa directamente el deterioro de la función renal.","literal":"Vancomycin can cause nephrotoxicity"},{"n":"23","nombre":"Slingshot native in dress","ver":"Una persona con vestido de lunares sosteniendo una honda (slingshot), en la esquina inferior derecha.","clinica":"Reacción a fármaco con eosinofilia y síntomas sistémicos (síndrome DRESS).","sketchy":"\"Dress\" (vestido) es la clave mnemotécnica literal del síndrome DRESS, y la honda alude al ataque sistémico eosinofílico.","literal":"drug reaction with eosinophilia and systemic symptoms (DRESS) syndrome"}],"mapa":"imagenes/vancomicina-mapa.webp","texto":"imagenes/vancomicina-texto.webp"}]},{"nombre":"Neurología","codigo":"ne","temas":[{"slug":"enfermedad-cjd-parkinson-huntington","titulo":"Enfermedad de Creutzfeldt-Jakob, Parkinson y Huntington","items":[{"n":"1","nombre":"\"MAD COW\" tattoo","ver":"Un tatuaje que dice \"MAD COW\" en el brazo de un personaje dentro del auto.","clinica":"La enfermedad de Creutzfeldt-Jakob (CJD) es una encefalopatía espongiforme que TÉCNICAMENTE es una enfermedad infecciosa (similar a comer carne de res contaminada con encefalopatía espongiforme bovina).","sketchy":"\"MAD COW\" (vaca loca) es la clave literal directa de la enfermedad de las \"vacas locas\" (encefalopatía espongiforme bovina).","literal":"CJD is a spongiform encephalopathy that is TECHNICALLY an infectious disease (similar to eating beef tainted with bovine spongiform encephalopathy)"},{"n":"2","nombre":"Spiral lanyard by beta key","ver":"Un cordón/llavero en espiral cerca de una llave marcada \"beta\".","clinica":"La CJD es causada por la acumulación de la proteína priónica mal plegada (PrP), la cual sufre transformación desde la conformación normal alfa-hélice (PrPc) hacia láminas beta-plegadas (PrPsc).","sketchy":"El cordón \"en espiral\" representa la alfa-hélice normal, y la llave \"beta\" la transformación hacia lámina beta-plegada.","literal":"CJD is caused by accumulation of misfolded prion protein (PrP), which undergoes transformation from the normal alpha-helix conformation (PrPc) to beta-pleated sheets (PrPsc)"},{"n":"3","nombre":"Beta key next to beta key","ver":"Dos llaves \"beta\" idénticas juntas.","clinica":"El PrPsc convierte al PrPc normal en más PrPsc anormal, amplificando el proceso de acumulación priónica.","sketchy":"Las \"dos llaves beta idénticas\" representan la conversión de una proteína normal en otra copia anormal (efecto dominó de propagación).","literal":"PrPsc turns normal PrPc into more abnormal PrPsc, amplifying the process of prion accumulation"},{"n":"4","nombre":"Bubbly pink hat","ver":"Un gorro rosado con textura de burbujas que lleva puesto un personaje en el auto.","clinica":"En histología, la CJD causa formación de vacuolas en estructuras de sustancia gris (como el núcleo caudado y el putamen) que se desarrollan en quistes (SIN inflamación en la enfermedad priónica).","sketchy":"El gorro \"burbujeante y rosado\" representa las vacuolas formándose en la sustancia gris.","literal":"histologically, CJD causes vacuole formation in grey matter structures (such as the caudate nucleus and putamen) that develop into cysts (NO inflammation in prion disease)"},{"n":"5","nombre":"Spongy seat headrest","ver":"Un reposacabezas de aspecto esponjoso (spongy) en el asiento del auto.","clinica":"La vacuolización y formación de quistes causan degradación del parénquima cerebral, dándole una apariencia \"esponjosa\".","sketchy":"El reposacabezas \"esponjoso\" (spongy) es la representación literal directa de la apariencia espongiforme.","literal":"vacuolization and cyst formation cause degradation of brain parenchyma giving it a \"spongy\" appearance"},{"n":"6","nombre":"Questionable antenna","ver":"Una antena cuestionable/dañada en la parte trasera del auto.","clinica":"La demencia progresando RÁPIDAMENTE en semanas a meses se ve en la CJD.","sketchy":"La antena \"cuestionable\" (con señal deteriorándose rápidamente) representa la demencia de progresión rápida.","literal":"dementia progressing RAPIDLY over weeks to months is seen in CJD"},{"n":"7","nombre":"Startled arm jerking","ver":"Un personaje con el brazo sacudiéndose de forma súbita (startled/jerking).","clinica":"Un hallazgo motor clásico en la CJD es el mioclono (contracciones musculares súbitas e involuntarias).","sketchy":"El brazo \"sacudiéndose súbitamente\" es la representación literal directa del mioclono.","literal":"a classic motor finding in CJD is myoclonus (sudden, involuntary muscle contractions)"},{"n":"8","nombre":"Sharp wave auto decal","ver":"Una calcomanía con un trazado de onda puntiaguda (sharp wave) en el costado del auto.","clinica":"Los cambios en el electroencefalograma (EEG) vistos con la CJD incluyen complejos de onda aguda periódicos.","sketchy":"El trazado \"de onda aguda\" (sharp wave) es la representación literal directa del hallazgo en el EEG.","literal":"electroencephalogram (EEG) changes seen with CJD include periodic sharp wave complexes"},{"n":"9","nombre":"Autosomal domino Hunting Town column","ver":"Una columna decorada con fichas de dominó, junto al letrero \"Hunting Town\".","clinica":"La enfermedad de Huntington se hereda de forma autosómica dominante con 100% de penetrancia.","sketchy":"Las fichas de \"dominó\" son el símbolo fijo de \"autosomal dominant\", y \"Hunting Town\" suena fonéticamente como \"Huntington\".","literal":"Huntington disease is inherited in an autosomal dominant fashion with 100% penetrance"},{"n":"10","nombre":"Repeating CArGo pockets","ver":"Un personaje con múltiples bolsillos tipo cargo repetidos en su ropa militar.","clinica":"La enfermedad de Huntington es causada por expansión de repeticiones trinucleotídicas CAG en el cromosoma 4.","sketchy":"\"CArGo\" con \"CAG\" resaltado y los bolsillos \"repetidos\" representan la repetición trinucleotídica CAG.","literal":"Huntington disease is caused by CAG trinucleotide repeat expansion on chromosome 4"},{"n":"11","nombre":"\"4\"","ver":"El letrero \"Hunting Town\" con un número \"4\" visible en la escena.","clinica":"La enfermedad de Huntington es causada por expansión de repeticiones CAG en el CROMOSOMA 4.","sketchy":"El número \"4\" es la clave numérica literal directa del cromosoma afectado.","literal":"Huntington disease is caused by CAG trinucleotide repeat expansion on CHROMOSOME 4"},{"n":"12","nombre":"\"Anticipate Great Savings\" by wearing more pockets","ver":"Un cartel que dice \"Anticipate Great Savings\" junto a personajes con más bolsillos cargo.","clinica":"El número de copias de repeticiones CAG aumenta a través de generaciones, llevando a una enfermedad más temprana y severa (llamado \"anticipación\").","sketchy":"\"Anticipate\" en el cartel es la clave literal directa del fenómeno de \"anticipation\" (anticipación genética).","literal":"copy number of CAG repeats increases through generations, leading to earlier and more severe disease (termed anticipation)"},{"n":"13","nombre":"\"CArGo pants father\"","ver":"Una figura paterna vistiendo pantalones cargo con muchos bolsillos.","clinica":"El número de copias CAG aumenta mucho más durante la espermatogénesis que la oogénesis → enfermedad más severa si el alelo mutado proviene del padre.","sketchy":"El \"padre con pantalones cargo\" (repeticiones CAG) representa directamente la vía paterna de herencia más severa.","literal":"CAG copy number increases much more during spermatogenesis than oogenesis→ more severe disease if mutated allele is from father"},{"n":"14","nombre":"\"Straight up, cod fishing, pull 'em in!\"","ver":"Un cartel que dice \"Straight Up, Cod Fishing, Pull 'em in!\" con peces.","clinica":"La enfermedad de Huntington causa atrofia del ESTRIADO, con el núcleo CAUDADO más afectado que el PUTAMEN.","sketchy":"\"COD fishing\" con \"COD\" resaltado suena fonéticamente similar a \"CAUDate\", y \"pull 'em in\" (jalar hacia adentro) representa la atrofia (encogimiento).","literal":"HD causes atrophy of the STRIATUM, with the CAUDATE nucleus affected more than the PUTAMEN"},{"n":"15","nombre":"EXCAVATOR","ver":"Una excavadora (excavator) grande cavando en la escena.","clinica":"La pérdida de parénquima cerebral en la HD puede llevar a la APARIENCIA de ventrículos agrandados (hidrocefalia ex-vacuo) aunque son normales.","sketchy":"La excavadora \"cavando\" (excavando espacio) representa el vaciamiento aparente que crea la apariencia de ventrículos agrandados.","literal":"loss of brain parenchyma in HD can lead to the APPEARANCE of enlarged ventricles (hydrocephalus ex-vacuo) though they are normal"},{"n":"16","nombre":"Hiding in CAB-A","ver":"Un personaje escondiéndose dentro de un taxi etiquetado \"CAB-A\".","clinica":"La pérdida del neurotransmisor inhibitorio GABA es el cambio bioquímico más común visto en la HD.","sketchy":"\"CAB-A\" con \"GAB-A\" fonéticamente similar es la clave literal directa de \"GABA\", y \"hiding\" (escondiéndose) representa su pérdida/ausencia.","literal":"loss of the inhibitory neurotransmitter GABA is the most common biochemical change seen in HD"},{"n":"17","nombre":"Middle-aged father","ver":"Un hombre de mediana edad de pie en la escena de \"Hunting Town\".","clinica":"La enfermedad de Huntington típicamente se presenta entre los 30-50 años de edad.","sketchy":"El hombre \"de mediana edad\" (middle-aged) representa directamente el rango etario típico de presentación.","literal":"Huntington disease typically presents between age 30-50"},{"n":"18","nombre":"Rapid dodging skills","ver":"Un personaje esquivando (dodging) rápidamente balas o ataques en la calle.","clinica":"La afectación motora en la HD lleva a corea (movimiento rápido, involuntario y arrítmico que involucra cara, tronco y extremidades).","sketchy":"Los \"movimientos rápidos de esquivar\" representan literalmente la corea (movimientos involuntarios rápidos).","literal":"motor involvement in HD leads to chorea (rapid, involuntary or arrhythmic movement involving the face, trunk, and extremities)"},{"n":"19","nombre":"Angry clown mask","ver":"Una máscara de payaso con expresión enojada.","clinica":"Los pacientes con HD a menudo tienen cambios psicoconductuales (agresión, apatía, depresión) años antes del inicio de los síntomas motores.","sketchy":"La máscara de \"payaso enojado\" representa los cambios psicoconductuales (agresión) previos a los síntomas motores.","literal":"patients with HD often have psychobehavioral changes (aggression, apathy, depression) years before the onset of motor symptoms"},{"n":"20","nombre":"\"Slow Park and Son\"","ver":"Una señal de tránsito que dice \"SLOW, Park & Son\" con figuras caminando.","clinica":"La enfermedad de Parkinson es una enfermedad neurodegenerativa que comúnmente presenta bradicinesia (movimiento lento).","sketchy":"\"SLOW\" (lento) junto a \"Park\" (Parkinson) representa directamente la bradicinesia característica.","literal":"Parkinson Disease is a neurodegenerative disease commonly featuring bradykinesia (slow movement)"},{"n":"21","nombre":"Bill rubbing bribe","ver":"Un personaje frotando un billete entre los dedos (soborno).","clinica":"Una característica común del Parkinsonismo es el temblor \"en rodamiento de píldoras\" (pill-rolling) (un movimiento circular involuntario de los dedos).","sketchy":"El gesto de \"frotar el billete\" entre los dedos representa literalmente el temblor de rodamiento de píldoras.","literal":"a common feature of Parkinsonism is \"pill-rolling\" tremor (an involuntary circular movement of the fingers)"},{"n":"22","nombre":"Rigid safe cogwheel","ver":"Un engranaje rígido de una caja fuerte (safe) en el banco.","clinica":"Una característica común del Parkinsonismo es la rigidez \"en rueda dentada\" (cogwheel).","sketchy":"El engranaje \"rígido\" (cogwheel) es la representación literal directa de la rigidez en rueda dentada.","literal":"a common feature of Parkinsonism is \"cogwheel\" rigidity (ratchety pattern of resistance and relaxation on passive movement of extremities)"},{"n":"23","nombre":"Instable lifting posture","ver":"Un personaje siendo cargado/levantado en una postura inestable.","clinica":"Una característica común del Parkinsonismo es la inestabilidad postural → sensación de desequilibrio y aumento de la tendencia a caer.","sketchy":"La postura \"inestable al ser levantado\" representa directamente la inestabilidad postural.","literal":"a common feature of Parkinsonism is postural instability→ feeling unbalanced and increased tendency to fall"},{"n":"24","nombre":"Shuffling back to car","ver":"Un personaje arrastrando los pies (shuffling) de regreso al auto.","clinica":"Una característica común del Parkinsonismo es la marcha \"arrastrada\" (shuffling gait) (debido a bradicinesia e inestabilidad postural).","sketchy":"El \"arrastrar los pies\" (shuffling) es la representación literal directa de la marcha característica.","literal":"a common feature of Parkinsonism is shuffling gait (due to bradykinesia and postural instability)"},{"n":"25","nombre":"Dangling double ropes","ver":"Dos cuerdas colgando junto al cartel de farmacia.","clinica":"Los antipsicóticos de primera generación (antagonistas D2 de dopamina) pueden causar síntomas de Parkinsonismo.","sketchy":"Las \"dos cuerdas colgando\" representan el bloqueo doble del receptor D2 por los antipsicóticos.","literal":"first-generation antipsychotics (D2 dopamine antagonists) may cause symptoms of Parkinsonism"},{"n":"26","nombre":"Accumulating copper pennies","ver":"Monedas de cobre (copper pennies) acumulándose cerca de la farmacia.","clinica":"La acumulación de cobre en el estriado (así como la unión directa de dopamina por el cobre libre) puede causar Parkinsonismo en la enfermedad de Wilson (defecto del metabolismo del cobre que lleva a cirrosis).","sketchy":"Las \"monedas de cobre acumulándose\" son la representación literal directa de la acumulación de cobre en la enfermedad de Wilson.","literal":"accumulation of copper in the striatum (as well as direct binding of dopamine by free copper) can cause Parkinsonism in Wilson's disease (copper metabolism defect leading to cirrhosis)"},{"n":"27","nombre":"Dope-rope pulled out of black bag","ver":"Una cuerda oscura siendo extraída de una bolsa negra en la escena del banco.","clinica":"La enfermedad de Parkinson es causada por la pérdida de neuronas dopaminérgicas en la sustancia nigra (pars compacta) → niveles bajos de dopamina.","sketchy":"\"Dope-rope\" (cuerda de dopamina) siendo \"extraída\" (pulled out) representa la pérdida de dopamina, y la bolsa \"negra\" evoca la sustancia nigra (nigra = negro).","literal":"Parkinson disease is caused by a loss of dopaminergic neurons in the substantia nigra (pars compacta) → low dopamine levels"},{"n":"28","nombre":"Pale mask by rope bag","ver":"Una máscara pálida cerca de la bolsa/cuerda oscura.","clinica":"Las neuronas dopaminérgicas de la sustancia nigra contienen neuromelanina oscuramente pigmentada → apariencia PÁLIDA de la sustancia nigra con pérdida de neuronas en el Parkinson.","sketchy":"La \"máscara pálida\" representa directamente la apariencia pálida de la sustancia nigra con pérdida neuronal.","literal":"dopaminergic neurons of the substantia nigra contain dark pigmented neuromelanin→ pale appearance of substantia nigra with loss of neurons in PD"},{"n":"29","nombre":"King Lewy with alpha scepter","ver":"Una figura estatuaria tipo rey (\"King Lewy\") sosteniendo un cetro marcado con \"alpha\".","clinica":"Los cuerpos de Lewy pueden encontrarse en la sustancia nigra (inclusiones citoplasmáticas eosinofílicas redondas compuestas de agregados de alfa-sinucleína).","sketchy":"\"King Lewy\" es la clave literal directa de \"Lewy bodies\", y el cetro \"alpha\" representa la alfa-sinucleína.","literal":"Lewy bodies can be found in the substantia nigra (round eosinophilic, cytoplasmic inclusions composed of aggregates of alpha synuclein)"},{"n":"30","nombre":"Villainous pinSTRIpe robber with SUBmachine gun","ver":"Un ladrón con traje de rayas (pinstripe) sosteniendo una subametralladora dentro de la bóveda del banco.","clinica":"La pérdida de función de la sustancia nigra → DESINHIBICIÓN del estriado → ACTIVACIÓN del núcleo subtalámico → INHIBICIÓN del tálamo (disminuyendo la función motora).","sketchy":"\"pinSTRIpe\" con \"STRI\" resaltado representa el \"striatum\" (estriado), y \"SUBmachine gun\" con \"SUB\" resaltado representa el núcleo \"subtalámico\".","literal":"loss of substantia nigra function → DISINHIBITION of striatum→ ACTIVATION of subthalamic nucleus→ INHIBITION of thalamus (decreasing motor function)"},{"n":"31","nombre":"Frozen thalamic switchboard operator","ver":"Un operador de conmutador telefónico (\"switchboard\") congelado/inmóvil en la bóveda.","clinica":"La disfunción de la sustancia nigra → activación del estriado → activación del núcleo subtalámico → INHIBICIÓN del tálamo (resultando en disfunción motora).","sketchy":"El operador de conmutador \"congelado\" (thalamic switchboard) representa la inhibición del tálamo, que actúa como una central de conmutación para las señales motoras.","literal":"substantia nigra dysfunction→ activation of the striatum→ activation of subthalamic nucleus→ INHIBITION of thalamus (resulting in motor dysfunction)"},{"n":"32","nombre":"Tazing submachine gun","ver":"Un policía usando una pistola taser contra el ladrón con la subametralladora.","clinica":"La estimulación cerebral profunda se usa a veces para inhibir el núcleo subtalámico y mejorar los síntomas en la EP.","sketchy":"El \"taser\" (estimulación eléctrica) usado contra el núcleo subtalámico (representado por la subametralladora) representa literalmente la estimulación cerebral profunda inhibitoria.","literal":"deep brain stimulation is sometimes used to inhibit the subthalamic nucleus and improve symptoms in PD"}]},{"slug":"hidrocefalia","titulo":"Hidrocefalia","items":[{"n":"1","nombre":"Pipes pumping in water","ver":"Tuberías bombeando agua hacia las piscinas de rafting.","clinica":"El plexo coroideo es donde se produce el LCR.","sketchy":"Las \"tuberías bombeando agua\" representan literalmente la producción de LCR por el plexo coroideo.","literal":"choroid plexus is where CSF is made"},{"n":"2","nombre":"Lateral lakes","ver":"Dos lagos laterales (lateral lakes) con forma de riñón en la escena.","clinica":"Ventrículos laterales (ubicados en cada hemisferio cerebral).","sketchy":"Los \"lagos laterales\" representan literalmente los ventrículos laterales.","literal":"lateral ventricles (located in each cerebral hemisphere)"},{"n":"3","nombre":"Later lake passage","ver":"Un pasaje/canal (passage) conectando los dos lagos.","clinica":"Forámenes interventriculares (conectan los ventrículos laterales con el tercer ventrículo).","sketchy":"El \"pasaje entre lagos\" representa literalmente los forámenes interventriculares.","literal":"interventricular foramina (connect the lateral ventricles to the third ventricle)"},{"n":"4","nombre":"Third central lake","ver":"Un tercer lago central (third central lake) en el medio de la escena.","clinica":"Tercer ventrículo (ubicado en el mesencéfalo entre los dos tálamos).","sketchy":"El \"tercer lago central\" es la clave literal directa del tercer ventrículo.","literal":"third ventricle (located in the midbrain between the two thalami)"},{"n":"5","nombre":"Straight river with silver fish","ver":"Un río recto (straight river) con peces plateados (silver fish) nadando.","clinica":"El acueducto cerebral (acueducto de Silvio) conecta el tercer y cuarto ventrículos.","sketchy":"Los \"peces plateados/silver\" son la clave fonética directa de \"SYLVIUS\" (Silvio).","literal":"cerebral aqueduct (aqueduct of Sylvius) connects the third and fourth ventricles"},{"n":"6","nombre":"Lower 4th diamond lake","ver":"Un lago inferior con forma de diamante (diamond lake) en la parte baja de la escena.","clinica":"Cuarto ventrículo (con forma de diamante) (ubicado anterior al cerebelo).","sketchy":"El \"lago en forma de diamante\" es la representación literal directa de la forma del cuarto ventrículo.","literal":"fourth ventricle (diamond shaped) (located anterior to the cerebellum)"},{"n":"7","nombre":"Medial diamond lake outlet","ver":"Una salida medial (medial outlet) del lago en forma de diamante.","clinica":"Foramen de Magendie (conecta el cuarto ventrículo con el espacio subaracnoideo).","sketchy":"La \"salida medial\" representa literalmente la posición medial del foramen de Magendie.","literal":"foramen of Magendie (connects fourth ventricle to subarachnoid space)"},{"n":"8","nombre":"Lateral diamond lake outlet","ver":"Salidas laterales (lateral outlets) del lago en forma de diamante.","clinica":"Forámenes de Luschka (conectan el cuarto ventrículo con el espacio subaracnoideo).","sketchy":"Las \"salidas laterales\" representan literalmente la posición lateral de los forámenes de Luschka.","literal":"foramina of Luschka (connect fourth ventricle to subarachnoid space)"},{"n":"9","nombre":"Spiderweb on drain pipe","ver":"Una telaraña (spiderweb) sobre una tubería de drenaje (drain pipe).","clinica":"El LCR retorna a la circulación sistémica vía las granulaciones aracnoideas (proyecciones de la aracnoides hacia los senos venosos durales).","sketchy":"La \"telaraña\" (spider = arachnoid) representa literalmente las granulaciones aracnoideas.","literal":"CSF returns to systemic circulation via arachnoid granulations (projections of arachnoid mater into the dural venous sinuses)"},{"n":"10","nombre":"Large ventricle helmet","ver":"Un casco grande (large helmet) que lleva puesto un personaje sobre las tuberías.","clinica":"HIDROCEFALIA (agrandamiento de los ventrículos [ventriculomegalia] debido al aumento del volumen de LCR).","sketchy":"El \"casco grande\" (sobre la cabeza) representa literalmente el agrandamiento ventricular.","literal":"HYDROCEPHALUS (enlargement of the ventricles [ventriculomegaly] due to increased CSF volume)"},{"n":"11","nombre":"Broken drainage pipe","ver":"Una tubería de drenaje rota (broken drainage pipe).","clinica":"La disfunción de las granulaciones aracnoideas → disminución del drenaje de LCR → hidrocefalia COMUNICANTE.","sketchy":"La \"tubería rota\" representa literalmente el drenaje disminuido de LCR.","literal":"dysfunction of the arachnoid granulations→ decreased CSF drainage → COMMUNICATING hydrocephalus"},{"n":"12","nombre":"Walkie-talkie and ventricle helmet","ver":"Un walkie-talkie sostenido cerca del casco de ventrículo.","clinica":"Hidrocefalia COMUNICANTE.","sketchy":"El \"walkie-talkie\" (comunicación) es la clave literal directa de \"COMMUNICATING\" hydrocephalus.","literal":"COMMUNICATING hydrocephalus"},{"n":"13","nombre":"Mohawk","ver":"Un peinado tipo mohawk que lleva puesto un personaje.","clinica":"La meningitis puede causar fibrosis de las granulaciones aracnoideas → hidrocefalia COMUNICANTE.","sketchy":"El \"mohawk\" representa la inflamación de las meninges (meningitis).","literal":"meningitis can cause fibrosis of the arachnoid granulations → COMMUNICATING hydrocephalus"},{"n":"14","nombre":"Fibrous plants around pipes","ver":"Plantas fibrosas (fibrous plants) enredadas alrededor de las tuberías.","clinica":"La inflamación puede causar FIBROSIS de las granulaciones aracnoideas → hidrocefalia COMUNICANTE.","sketchy":"Las \"plantas fibrosas\" representan literalmente la fibrosis de las granulaciones.","literal":"inflammation can cause FIBROSIS of the arachnoid granulations → COMMUNICATING hydrocephalus"},{"n":"15","nombre":"Blood dripping from spider web","ver":"Sangre goteando (dripping) de la telaraña.","clinica":"La hemorragia subaracnoidea puede causar fibrosis de las granulaciones aracnoideas → hidrocefalia COMUNICANTE.","sketchy":"La \"sangre goteando de la telaraña\" (aracnoides) representa la hemorragia subaracnoidea.","literal":"subarachnoid hemorrhage can cause fibrosis of the arachnoid granulations → COMMUNICATING hydrocephalus"},{"n":"16","nombre":"High raft pressure","ver":"Una balsa (raft) bajo alta presión en la corriente de rafting.","clinica":"La acumulación de LCR debido a hidrocefalia comunicante → HIPERTENSIÓN INTRACRANEAL.","sketchy":"La \"balsa a alta presión\" representa literalmente la hipertensión intracraneal.","literal":"CSF accumulation due to communicating hydrocephalus→ INTRACRANIAL HYPERTENSION"},{"n":"17","nombre":"Obstructed river","ver":"Un río obstruido (obstructed) en la escena de rafting.","clinica":"La obstrucción del flujo de LCR fuera de los ventrículos → hidrocefalia NO COMUNICANTE (OBSTRUCTIVA).","sketchy":"El \"río obstruido\" es la representación literal directa de la hidrocefalia obstructiva.","literal":"obstruction of CSF flow out of ventricles → noncommunicating (OBSTRUCTIVE) hydrocephalus"},{"n":"18","nombre":"Lost cell-phone","ver":"Un teléfono celular perdido (lost) en el agua.","clinica":"Hidrocefalia NO COMUNICANTE (obstructiva).","sketchy":"El \"teléfono perdido\" (sin comunicación) representa \"NONCOMMUNICATING\" hydrocephalus.","literal":"NONCOMMUNICATING (obstructive) hydrocephalus"},{"n":"19","nombre":"2 cherries","ver":"Dos cerezas (cherries) en la escena de rafting.","clinica":"La malformación de Chiari (especialmente tipo II) puede causar hidrocefalia NO COMUNICANTE.","sketchy":"Las \"2 cerezas\" representan literalmente el tipo II de la malformación de Chiari.","literal":"Chiari malformation (especially type II) can cause NONCOMMUNICATING hydrocephalus"},{"n":"20","nombre":"Tiki torches","ver":"Antorchas tiki (tiki torches) encendidas a los lados del río.","clinica":"Las infecciones TORCH congénitas (ej. toxoplasmosis, rubéola, CMV) pueden causar cicatrización de las meninges → hidrocefalia NO COMUNICANTE.","sketchy":"Las \"antorchas tiki\" son la clave fonética directa del acrónimo \"TORCH\".","literal":"congenital ToRCH infections (e.g. toxoplasmosis, rubella, CMV) can cause scarring of the meninges→ NONCOMMUNICATING hydrocephalus"},{"n":"21","nombre":"Cystic #3 buoy","ver":"Una boya (buoy) quística marcada con el número \"3\".","clinica":"Un quiste coloide formándose en el techo del 3er ventrículo puede bloquear los forámenes interventriculares → hidrocefalia NO COMUNICANTE.","sketchy":"La \"boya quística #3\" representa literalmente el quiste coloide en el tercer ventrículo.","literal":"colloid cyst forming in the roof of the 3rd ventricle can block the interventricular foramina→ NONCOMMUNICATING hydrocephalus"},{"n":"22","nombre":"Pine Trees Germinating","ver":"Un cartel que dice \"Pine Trees Germinating\" junto a un bosque de pinos.","clinica":"Los tumores de células germinales extra-gonadales pueden surgir en la glándula pineal (pinealoma) → compresión del acueducto cerebral → hidrocefalia NO COMUNICANTE.","sketchy":"\"Pine Trees\" es la clave fonética directa de \"PINEal\", y \"Germinating\" representa el tumor de células germinales.","literal":"extra-gonadal germ cell tumors can arise in the pineal gland (pinealoma)→ compression of cerebral aqueduct→ NONCOMMUNICATING hydrocephalus"},{"n":"23","nombre":"Cancer crab","ver":"Un cangrejo (crab) en el agua del río.","clinica":"Los tumores en la fosa posterior y el cuarto ventrículo pueden causar hidrocefalia NO COMUNICANTE.","sketchy":"El cangrejo (símbolo de cáncer) representa los tumores de la fosa posterior.","literal":"tumors in the posterior fossa and 4th ventricle can cause NONCOMMUNICATING hydrocephalus"},{"n":"24","nombre":"High raft pressure","ver":"Otra balsa bajo alta presión en la corriente.","clinica":"La acumulación de LCR debido a hidrocefalia no comunicante → HIPERTENSIÓN INTRACRANEAL.","sketchy":"Repite la \"balsa a alta presión\" para la hipertensión intracraneal, ahora en el contexto obstructivo.","literal":"CSF accumulation due to noncommunicating hydrocephalus→ INTRACRANIAL HYPERTENSION"},{"n":"25","nombre":"High pressure head balloon","ver":"Una cabeza con forma de globo (head balloon) bajo alta presión, flotando en un globo aerostático.","clinica":"La hidrocefalia (comunicante y no comunicante) puede causar HIPERTENSIÓN INTRACRANEAL.","sketchy":"La \"cabeza-globo bajo presión\" representa directamente la hipertensión intracraneal.","literal":"hydrocephalus (communicating and noncommunicating) can cause INTRACRANIAL HYPERTENSION"},{"n":"26","nombre":"Dilated hot air cylinder underneath retina balloon","ver":"Un cilindro de aire caliente dilatado (dilated) debajo de un globo con forma de retina.","clinica":"La hipertensión intracraneal → papiledema (disco óptico hinchado).","sketchy":"El \"cilindro dilatado bajo la retina\" representa literalmente el papiledema (disco óptico hinchado).","literal":"intracranial hypertension→ papilledema (swollen optic disc)"},{"n":"27","nombre":"ProTECTed area","ver":"Un cartel que dice \"Protected Area\" cerca de la maquinaria excavadora.","clinica":"El acueducto cerebral recorre el TECTUM del mesencéfalo (afectado en hidrocefalia).","sketchy":"\"ProTECTed\" con \"TECT\" resaltado es la clave literal directa del \"tectum\".","literal":"cerebral aqueduct runs along the TECTUM of the midbrain (affected in hydrocephalus)"},{"n":"28","nombre":"CALL US","ver":"Un cartel que dice \"Call us!\" en un anuncio publicitario.","clinica":"El daño al COLÍCULO SUPERIOR (en el tectum) lleva a parálisis de la mirada vertical (síndrome de Parinaud) (debido a hidrocefalia, tumor, accidente cerebrovascular).","sketchy":"\"CALL US\" suena fonéticamente similar a \"COLLICULUS\" (colículo).","literal":"damage to the SUPERIOR COLLICULUS (in the tectum) leads to vertical gaze palsy (Parinaud's syndrome) (due to hydrocephalus, tumor, stroke)"},{"n":"29","nombre":"Setting sun","ver":"Un sol poniéndose (setting sun) en la escena.","clinica":"El síndrome de Parinaud, también conocido como \"signo del sol poniente\", es una parálisis de la mirada vertical (incapacidad de mirar hacia arriba) causada por compresión del colículo superior en el tectum.","sketchy":"El \"sol poniéndose\" es la representación literal directa del \"setting-sun sign\".","literal":"Parinaud syndrome aka \"setting-sun sign\" is a vertical gaze palsy (unable to look upwards) caused by compression of the superior colliculus in the tectum"},{"n":"30","nombre":"Dilated pupils","ver":"Pupilas dilatadas (dilated pupils) en un personaje.","clinica":"En el síndrome de Parinaud, las pupilas NO se contraen bien con la luz (disociación luz-cerca bilateral).","sketchy":"Las \"pupilas dilatadas\" (que no responden a la luz) representan la disociación luz-cerca.","literal":"in Parinaud syndrome pupils DO NOT constrict well with light (bilateral light-near dissociation)"},{"n":"31","nombre":"Accommodations available sign","ver":"Un cartel que dice \"Accommodations Available\" en la escena.","clinica":"En el síndrome de Parinaud, las pupilas SÍ se contraen con la acomodación (disociación luz-cerca bilateral).","sketchy":"\"Accommodations\" es la clave literal directa de \"accommodation\" (acomodación del cristalino).","literal":"in Parinaud syndrome pupils WILL constrict with accommodation (bilateral light-near dissociation)"},{"n":"32","nombre":"Large helmet on child","ver":"Un casco grande (large helmet) que lleva puesto un niño.","clinica":"La hidrocefalia congénita lleva a macrocefalia y una fontanela abultada.","sketchy":"El \"casco grande en el niño\" representa literalmente la macrocefalia congénita.","literal":"congenital hydrocephalus leads to macrocephaly and a bulging fontanelle"},{"n":"33","nombre":"Crying baby dropping the bottle","ver":"Un bebé llorando (crying) que deja caer su biberón (dropping the bottle).","clinica":"Los síntomas de hipertensión intracraneal en infantes incluyen irritabilidad, mala alimentación y retraso del desarrollo.","sketchy":"El \"bebé llorando dejando caer el biberón\" representa la irritabilidad y la mala alimentación.","literal":"symptoms of intracranial hypertension in infants include irritability, poor feeding, and developmental delay"},{"n":"34","nombre":"Normal Pressure Pool","ver":"Un cartel que dice \"Normal Pressure Pool\" en una piscina de la escena.","clinica":"Hidrocefalia normotensiva (NPH).","sketchy":"\"Normal Pressure Pool\" es la clave literal directa de \"Normal Pressure Hydrocephalus\" (NPH).","literal":"normal pressure hydrocephalus (NPH)"},{"n":"35","nombre":"Broken drain with spiderwebs","ver":"Un drenaje roto (broken drain) cubierto de telarañas (spiderwebs).","clinica":"La NPH puede ser causada por absorción alterada de LCR por las granulaciones aracnoideas.","sketchy":"El \"drenaje roto con telarañas\" representa la absorción alterada de LCR por las granulaciones aracnoideas.","literal":"NPH may be caused by impaired CSF absorption by the arachnoid granulations"},{"n":"36","nombre":"Walkie-talkie","ver":"Otro walkie-talkie en la escena de la piscina.","clinica":"La NPH puede ser un tipo de hidrocefalia COMUNICANTE.","sketchy":"Repite el símbolo del \"walkie-talkie\" para hidrocefalia comunicante.","literal":"NPH may be a type of communicating hydrocephalus"},{"n":"37","nombre":"Old man","ver":"Un hombre mayor (old man) de pie cerca de la piscina.","clinica":"La NPH ocurre más comúnmente en personas ancianas.","sketchy":"El \"hombre mayor\" representa directamente el grupo etario de mayor incidencia.","literal":"NPH most commonly occurs in elderly people"},{"n":"38","nombre":"Chronic grandfather clock","ver":"Un reloj de pie (grandfather clock) en la escena, marcando el paso del tiempo.","clinica":"La NPH es una condición CRÓNICA que se desarrolla a lo largo de años → los ventrículos se agrandan lentamente → hidrocefalia y presión NORMAL de LCR.","sketchy":"El \"reloj de pie\" (que marca el paso lento del tiempo) representa la naturaleza crónica de la condición.","literal":"NPH is a chronic condition developing over years→ ventricles slowly enlarge→ hydrocephalus and NORMAL CSF pressure"},{"n":"39","nombre":"Rafting for Idiots","ver":"Un libro titulado \"Rafting for Idiots\" en la escena.","clinica":"La NPH es frecuentemente idiopática.","sketchy":"\"Idiots\" suena fonéticamente similar a \"idiopathic\" (idiopática).","literal":"NPH is often idiopathic"},{"n":"40","nombre":"Pulling on chin straps","ver":"Un personaje tirando (pulling) de las correas del casco (chin straps).","clinica":"El agrandamiento lento de los ventrículos → estiramiento de las fibras nerviosas alrededor de los ventrículos cerebrales → interrumpe la transducción de señales.","sketchy":"\"Tirar de las correas\" representa literalmente el estiramiento de las fibras nerviosas periventriculares.","literal":"slow enlargement of ventricles→ stretching of nerve fibers around cerebral ventricles→ interrupts signal transduction"},{"n":"41","nombre":"Leg stretched out in boat","ver":"Una pierna estirada (stretched out) dentro de un bote.","clinica":"La NPH causa inestabilidad de la marcha (marcha de base amplia, \"magnética\") debido a daño de las fibras motoras sacras (\"BAMBOLEANTE\"/WOBBLY).","sketchy":"La \"pierna estirada\" representa el daño a las fibras motoras que causa la marcha inestable.","literal":"NPH causes gait instability (wide-based, \"magnetic\" gait) due to damage to the sacral motor fibers (\"WOBBLY\")"},{"n":"42","nombre":"Wet pants","ver":"Pantalones mojados (wet pants) en un personaje.","clinica":"La NPH causa incontinencia urinaria al interrumpir la comunicación entre la corteza y el centro de micción sacro (\"MOJADO\"/WET).","sketchy":"Los \"pantalones mojados\" son la representación literal directa de la incontinencia urinaria.","literal":"NPH causes urinary incontinence by disrupting communication between cortex and sacral micturition center (\"WET\")"},{"n":"43","nombre":"\"?\" on book","ver":"Un signo de interrogación (\"?\") en un libro que sostiene un personaje.","clinica":"La NPH causa demencia y disminución de la función ejecutiva al estirar las fibras límbicas periventriculares (\"LOCO\"/WACKY).","sketchy":"El \"signo de interrogación\" representa la confusión/demencia y la función ejecutiva alterada.","literal":"NPH causes dementia and decreased executive functioning by stretching the periventricular limbic fibers (\"WACKY\")"},{"n":"44","nombre":"Big ventricle helmet","ver":"Un casco grande de ventrículo (big ventricle helmet) en la escena.","clinica":"La NPH se asocia con ventriculomegalia (agrandamiento de los ventrículos) (SIN agrandamiento de los surcos) y presión de LCR normal.","sketchy":"El \"casco grande\" representa la ventriculomegalia asociada a la NPH.","literal":"NPH is associated with ventriculomegaly (enlargement of the ventricles) (WITHOUT enlargement of the sulci) and normal CSF pressure"},{"n":"45","nombre":"EXCAVATOR truck","ver":"Un camión excavador (excavator truck) trabajando en la escena.","clinica":"La hidrocefalia ex-vacuo es un agrandamiento ventricular con un aumento proporcional de los surcos (debido a la pérdida de tejido cerebral por envejecimiento normal o enfermedad neurodegenerativa).","sketchy":"El \"excavador\" (que remueve/vacía tierra) representa literalmente \"ex-vacuo\" (vaciamiento).","literal":"hydrocephalus ex vacuo is ventricular enlargement with a proportionate increase in the sulci (due to loss of brain tissue from normal aging or neurodegenerative disease)"},{"n":"46","nombre":"Wrinkly brain helmet","ver":"Un casco arrugado (wrinkly) con forma de cerebro.","clinica":"La atrofia cerebral hace que los ventrículos parezcan agrandados → hidrocefalia ex vacuo.","sketchy":"El \"casco de cerebro arrugado\" representa literalmente la atrofia cerebral.","literal":"cerebral atrophy makes the ventricles appear enlarged → hydrocephalus ex vacuo"},{"n":"47","nombre":"Large grooves","ver":"Surcos/ranuras grandes (large grooves) visibles en la escena.","clinica":"Los surcos están agrandados en la hidrocefalia ex vacuo.","sketchy":"Las \"ranuras grandes\" son la representación literal directa de los surcos agrandados.","literal":"sulci are enlarged in hydrocephalus ex vacuo"}]},{"slug":"nervios-craneales-i-ii","titulo":"Nervios craneales I y II (Olfatorio y Óptico)","items":[{"n":"1","nombre":"Odin's \"1\"-shaped staff","ver":"Una lanza/bastón con forma de \"1\" que sostiene el personaje tipo Odín.","clinica":"El NC I es el nervio olfatorio.","sketchy":"El bastón con forma de \"1\" es la clave numérica literal directa del nervio craneal I.","literal":"CN I is the olfactory nerve"},{"n":"2","nombre":"Odin smelling the scents","ver":"Odín oliendo los vapores/aromas que salen del caldero.","clinica":"El NC I detecta el olfato.","sketchy":"El gesto de \"oler\" representa directamente la función del nervio olfatorio.","literal":"CN I senses smell"},{"n":"3","nombre":"Odin's special feather","ver":"Una pluma especial (de pavo real) en el casco de Odín.","clinica":"El NC I lleva fibras sensitivas especiales desde la mucosa nasal.","sketchy":"La pluma \"especial\" representa las fibras sensitivas especiales del nervio.","literal":"CN I carries special sensory fibers from the nasal mucosa"},{"n":"4","nombre":"Cribriform crib","ver":"Un bebé sentado en una cuna (crib) con textura tipo hueso.","clinica":"Las raicillas olfatorias entran al cráneo a través de la lámina cribiforme en el hueso etmoides.","sketchy":"\"Crib\" (cuna) suena fonéticamente similar al inicio de \"CRIBriform\".","literal":"Olfactory rootlets enter the skull through the cribriform plate in the ethmoid bone"},{"n":"5","nombre":"\"Ethics for Gods\"","ver":"Un libro titulado \"Ethics for Gods\" que lee el bebé.","clinica":"Las raicillas olfatorias entran al cráneo a través de la lámina cribiforme en el hueso etmoides.","sketchy":"\"Ethics\" suena fonéticamente similar al inicio de \"ETHmoid\".","literal":"Olfactory rootlets enter the skull through the cribriform plate in the ethmoid bone"},{"n":"6","nombre":"Bulbous nose","ver":"La nariz bulbosa y prominente de Odín.","clinica":"Las raicillas olfatorias hacen sinapsis en el bulbo olfatorio, que lleva información sensorial hacia la corteza vía el tracto olfatorio.","sketchy":"La nariz \"bulbosa\" (bulbous) es la clave literal directa del \"bulbo olfatorio\".","literal":"Olfactory rootlets synapse in the olfactory bulb, which carries sensory information to the cortex via the olfactory tract"},{"n":"7","nombre":"\"Extra Flavorless\"","ver":"Una caja de cereal \"Grendel's Gruel\" con la etiqueta \"Extra Flavorless\" (extra sin sabor).","clinica":"La pérdida de la función del nervio olfatorio resulta en pérdida del olfato (anosmia); los pacientes pueden interpretar esto como pérdida del sabor.","sketchy":"\"Extra Flavorless\" (sin sabor) representa directamente cómo el paciente percibe la anosmia como pérdida del sabor.","literal":"Loss of olfactory nerve function results in loss of smell (anosmia); patients may interpret this as a loss of flavor"},{"n":"8","nombre":"Meteor hitting tree","ver":"Un meteoro impactando un árbol en el tapiz colgante.","clinica":"La avulsión o cizallamiento de las raicillas debido a fuerzas de aceleración o desaceleración en el nervio olfatorio puede llevar a anosmia.","sketchy":"El impacto del \"meteoro\" representa la fuerza traumática de aceleración/desaceleración.","literal":"Avulsion or shearing of rootlets due to acceleration or deceleration forces on the olfactory nerve may lead to anosmia"},{"n":"9","nombre":"Ripping rootlets","ver":"Raíces del árbol desgarrándose/arrancándose en el tapiz.","clinica":"La avulsión o cizallamiento de las raicillas debido a fuerzas de aceleración/desaceleración en el nervio olfatorio puede llevar a anosmia.","sketchy":"Las raíces \"desgarrándose\" (ripping rootlets) representan literalmente la avulsión de las raicillas olfatorias.","literal":"Avulsion or shearing of rootlets due to acceleration/deceleration forces on the olfactory nerve may lead to anosmia"},{"n":"10","nombre":"Fractured helmet","ver":"Un casco vikingo fracturado/agrietado.","clinica":"Las fracturas de cráneo a través del hueso etmoides pueden desgarrar las raicillas olfatorias y causar anosmia.","sketchy":"El casco \"fracturado\" representa literalmente la fractura de cráneo.","literal":"Skull fractures through the ethmoid bone may tear the olfactory rootlets to cause anosmia"},{"n":"11","nombre":"Running watery nose","ver":"Un personaje con la nariz goteando líquido acuoso.","clinica":"La rinorrea clara (líquido claro saliendo de la nariz) es un signo de fuga de LCR por una fractura de cráneo.","sketchy":"La nariz \"goteando\" (running) es la representación literal directa de la rinorrea.","literal":"Clear rhinorrhea (clear fluid running out of the nose) is a sign of leaking CSF from a skull fracture"},{"n":"12","nombre":"\"II\" shaped perch","ver":"Un soporte/percha con forma de \"II\" donde está posado el búho.","clinica":"El NC II es el nervio óptico.","sketchy":"La percha con forma de \"II\" es la clave numérica literal directa del nervio craneal II.","literal":"CN II is the optic nerve"},{"n":"13","nombre":"Owl-y eyes","ver":"Los grandes ojos amarillos del búho.","clinica":"El NC II detecta la vista.","sketchy":"Los ojos grandes del búho representan directamente la función visual.","literal":"CN II senses sight"},{"n":"14","nombre":"Extra feathery feathers","ver":"Plumas extra prominentes/decorativas en la cabeza del búho.","clinica":"El NC II lleva fibras sensitivas especiales desde la retina.","sketchy":"Las plumas \"extra\" representan las fibras sensitivas especiales del nervio óptico.","literal":"CN II carries special sensory fibers from the retina"},{"n":"15","nombre":"Constricted pupils","ver":"Las pupilas del búho contraídas, con un rayo de luz dirigido hacia un ojo.","clinica":"El NC II es el brazo aferente del reflejo fotomotor pupilar (la luz en un ojo causa constricción de ambas pupilas).","sketchy":"Las pupilas \"constreñidas\" representan directamente el reflejo fotomotor.","literal":"CN II is the afferent limb of the pupillary light reflex (light in one eye causes constriction of both pupils)"},{"n":"16","nombre":"Grand canal to the brain","ver":"Un gran canal de agua conduciendo hacia una imagen del cerebro, en el segundo tapiz.","clinica":"El nervio óptico entra al cráneo a través del canal óptico en la pared posterior de la órbita (en el hueso esfenoides).","sketchy":"El \"gran canal\" hacia el cerebro representa literalmente el canal óptico.","literal":"Optic nerve enters the skull through the optic canal in the posterior wall of the orbit (in the sphenoid bone)"},{"n":"17","nombre":"Vascular branching perch","ver":"La percha del búho con ramificaciones tipo vasos sanguíneos.","clinica":"La arteria oftálmica viaja a través del canal óptico junto con el nervio óptico para irrigar el ojo, incluyendo la retina vía la arteria central de la retina.","sketchy":"La percha \"ramificada vascular\" representa la arteria oftálmica acompañando al nervio en su trayecto.","literal":"Ophthalmic artery travels through the optic canal with the optic nerve to supply the eye, including the retina via the central retinal artery"},{"n":"18","nombre":"X-shaped foot","ver":"Una de las patas del búho con forma de \"X\".","clinica":"Los nervios ópticos bilaterales forman el quiasma óptico donde algunas (no todas) las fibras visuales se intercambian, antes de salir como los tractos ópticos.","sketchy":"La forma de \"X\" de la pata es la representación literal directa del quiasma óptico (cruce en X).","literal":"Bilateral optic nerves form the optic chiasm where some (not all) visual fibers are exchanged, before exiting as the optic tracts"}]}]},{"nombre":"Neumología","codigo":"nu","temas":[{"slug":"sindrome-dificultad-respiratoria-aguda","titulo":"Síndrome de dificultad respiratoria aguda (ARDS)","items":[{"n":"1","nombre":"Wet life vest","ver":"Un buzo con un chaleco salvavidas (life vest) empapado, nadando en el acuario.","clinica":"Edema pulmonar (resultado de aumento de la presión hidrostática capilar o daño capilar).","sketchy":"El chaleco \"mojado\" (wet) representa literalmente el edema (acumulación de líquido).","literal":"Pulmonary edema (result of increased capillary hydrostatic pressure or capillary injury)"},{"n":"2","nombre":"High-pressure leaky pipes","ver":"Tuberías con fugas bajo alta presión en la estructura del acuario.","clinica":"El aumento de la presión hidrostática causa fuga de líquido a través de los capilares pulmonares → edema pulmonar.","sketchy":"Las tuberías \"de alta presión con fugas\" representan literalmente el mecanismo de la presión hidrostática aumentada.","literal":"Increased hydrostatic pressure causes leakage of fluid through pulmonary capillaries → pulmonary edema"},{"n":"3","nombre":"Failing heart balloon","ver":"Un globo con forma de corazón fallando/desinflándose.","clinica":"La insuficiencia cardíaca izquierda causa aumento de la presión en el corazón izquierdo, transmitida a las venas pulmonares → aumento de la presión hidrostática capilar pulmonar → edema pulmonar.","sketchy":"El \"globo cardíaco fallando\" representa directamente la insuficiencia cardíaca izquierda.","literal":"Left-sided heart failure causes increased pressure in left heart, transmitted to pulmonary veins → increased pulmonary capillary hydrostatic pressure → pulmonary edema"},{"n":"4","nombre":"TRANSatlantic ship","ver":"Un barco transatlántico visible en la escena submarina.","clinica":"Un transudado consiste de líquido pobre en células y pobre en proteínas que se acumula debido al aumento de la presión hidrostática.","sketchy":"\"TRANSatlantic\" con \"TRANS\" resaltado es la clave literal directa de \"transudate\" (transudado).","literal":"A transudate consists of cell-poor, protein-poor fluid accumulating due to increased hydrostatic pressure"},{"n":"5","nombre":"Stenotic bicuspid clam","ver":"Una almeja bicúspide (bicuspid clam) estenótica en el fondo marino.","clinica":"La estenosis mitral causa aumento de la presión auricular izquierda → aumento de la presión capilar pulmonar → edema pulmonar.","sketchy":"La \"almeja bicúspide\" (con dos valvas) representa la válvula mitral, y su forma \"estenótica\" (estrecha) la estenosis mitral.","literal":"Mitral stenosis causes increased left atrial pressure → increased pulmonary capillary pressure → pulmonary edema"},{"n":"6","nombre":"Regurgitating bicuspid clam","ver":"La misma almeja bicúspide \"regurgitando\" líquido.","clinica":"La regurgitación mitral aguda causa aumento de la presión auricular izquierda → aumento de la presión capilar pulmonar → edema pulmonar.","sketchy":"La almeja \"regurgitando\" representa literalmente la regurgitación mitral.","literal":"Acute mitral regurgitation causes increased left atrial pressure → increased pulmonary capillary pressure → pulmonary edema"},{"n":"7","nombre":"Overflowing tank","ver":"Un tanque de acuario desbordándose, marcado \"OVERLOAD\" y \"MAX\".","clinica":"La sobrecarga de volumen (ej. exacerbación de ICC, falla renal) causa aumento de las presiones venosas pulmonares → edema pulmonar.","sketchy":"El tanque \"desbordándose\" (overflowing) marcado \"OVERLOAD\" es la representación literal directa de la sobrecarga de volumen.","literal":"Volume overload (e.g., CHF exacerbation, renal failure) causes increased pulmonary venous pressures → pulmonary edema"},{"n":"8","nombre":"Breaking pipes","ver":"Tuberías rompiéndose en la estructura del acuario.","clinica":"El daño capilar pulmonar (ej., ARDS) causa fuga de suero rico en células y proteínas (exudado) → edema pulmonar.","sketchy":"Las tuberías \"rompiéndose\" representan el daño capilar directo, a diferencia de la fuga por presión de los símbolos anteriores.","literal":"Pulmonary capillary damage (e.g., ARDS) causes leakage of cell- and protein-rich serum (exudate) → pulmonary edema"},{"n":"9","nombre":"Emergency exit","ver":"Una señal de \"Emergency Exit\" en la estructura del acuario, con un buzo escalando hacia ella.","clinica":"Un exudado consiste de líquido rico en células y rico en proteínas resultante del aumento de la permeabilidad capilar.","sketchy":"La \"salida de emergencia\" representa la fuga anormal (escape) de líquido rico en proteínas por el aumento de permeabilidad.","literal":"An exudate consists of cell-rich, protein-rich fluid resulting from increased capillary permeability"},{"n":"10","nombre":"Great white ARDS shark","ver":"Un gran tiburón blanco (great white) nadando en la escena principal del acuario.","clinica":"El síndrome de dificultad respiratoria aguda (ARDS) se caracteriza por edema pulmonar bilateral e hipoxia → falla respiratoria.","sketchy":"El \"gran tiburón blanco\" es el personaje ancla de toda la escena, representando el ARDS.","literal":"Acute respiratory distress syndrome (ARDS) is characterized by bilateral pulmonary edema and hypoxia → respiratory failure"},{"n":"11","nombre":"Cracked alveolar abalone","ver":"Un abulón (abalone) agrietado con forma de alvéolo en el fondo marino.","clinica":"El ARDS es causado por lesión alveolar difusa.","sketchy":"El \"abulón agrietado\" con forma de alvéolo representa literalmente la lesión alveolar difusa.","literal":"ARDS is caused by diffuse alveolar injury"},{"n":"12","nombre":"\"Septic\" bag","ver":"Una bolsa etiquetada \"SEPTIC\" que lleva una buzo nadando.","clinica":"La sepsis es la causa más común de ARDS.","sketchy":"La bolsa \"SEPTIC\" es la clave literal directa de la sepsis como causa más común.","literal":"Sepsis is the most common cause of ARDS"},{"n":"13","nombre":"Fish aspirating shark vomit","ver":"Un pez aspirando/tragando vómito expulsado por el tiburón.","clinica":"La aspiración de contenido gástrico puede causar neumonitis, que puede llevar a ARDS.","sketchy":"El \"pez aspirando el vómito\" representa literalmente la aspiración de contenido gástrico.","literal":"Aspiration of gastric contents can cause pneumonitis, which may lead to ARDS"},{"n":"14","nombre":"Rusty diving chestplate","ver":"Un traje de buceo antiguo con peto oxidado (rusty chestplate).","clinica":"La neumonía puede causar ARDS.","sketchy":"El peto \"oxidado\" sobre el pecho representa la infección pulmonar (neumonía), mismo símbolo usado en otras series.","literal":"Pneumonia can cause ARDS"},{"n":"15","nombre":"Traumatic bone","ver":"Un hueso con aspecto traumático/dañado en el fondo del acuario.","clinica":"El trauma severo (contusión pulmonar, émbolos de grasa) puede causar ARDS.","sketchy":"El \"hueso traumático\" representa directamente el trauma severo (fracturas, émbolos grasos).","literal":"Severe trauma (lung contusion, fat emboli) can cause ARDS"},{"n":"16","nombre":"Pancreatic sea sponge","ver":"Una esponja marina con forma de páncreas en el fondo del acuario.","clinica":"La pancreatitis puede causar ARDS (las enzimas pancreáticas dañan el epitelio alveolar).","sketchy":"La \"esponja con forma de páncreas\" representa directamente la pancreatitis como causa.","literal":"Pancreatitis can cause ARDS (pancreatic enzymes damage alveolar epithelium)"},{"n":"17","nombre":"\"TRALI\" car with IV bags","ver":"Un vagón/carrito etiquetado \"TRALI\" con bolsas de suero (IV bags) colgando.","clinica":"La lesión pulmonar aguda relacionada con transfusión (TRALI) puede causar ARDS.","sketchy":"El carrito \"TRALI\" con bolsas IV es la clave literal directa de la lesión pulmonar por transfusión.","literal":"Transfusion-related acute lung injury (TRALI) can cause ARDS"},{"n":"18","nombre":"Cyto-coins","ver":"Monedas (\"cyto-coins\") sostenidas por un niño donando en una caja de \"Donations\".","clinica":"La lesión alveolar inicial → liberación de citoquinas por macrófagos (fase EXUDATIVA del ARDS).","sketchy":"Las \"monedas cito-\" son la clave fonética directa de \"cytokine\" (citoquina), mismo símbolo usado en otras series.","literal":"Initial alveolar injury → cytokine release by macrophages (ARDS EXUDATIVE phase)"},{"n":"19","nombre":"First responders damaging epithelial floor","ver":"Personal de emergencia (first responders) corriendo y dañando el piso del acuario (epitelio).","clinica":"Los neutrófilos liberan especies reactivas de oxígeno (ROS) y proteasas → lesión del epitelio alveolar (neumocitos tipo I y II) (fase EXUDATIVA del ARDS).","sketchy":"Los \"primeros respondedores dañando el piso\" (epitelio) representan a los neutrófilos causando lesión epitelial.","literal":"Neutrophils release reactive oxygen species (ROS) and proteases → injury to alveolar epithelium (type I & II pneumocytes) (ARDS EXUDATIVE phase)"},{"n":"20","nombre":"First responders damaging capillary pipes","ver":"Los mismos personajes de emergencia dañando las tuberías (capilares) del acuario.","clinica":"Los neutrófilos liberan ROS y proteasas → lesión del endotelio capilar alveolar (fase EXUDATIVA del ARDS).","sketchy":"Las \"tuberías dañadas\" (capilares) representan la lesión del endotelio capilar.","literal":"Neutrophils release ROS and proteases → injury to alveolar capillary endothelium (ARDS EXUDATIVE phase)"},{"n":"21","nombre":"Collapsing alveolar anemones","ver":"Anémonas marinas (con forma de alvéolo) colapsando en el arrecife.","clinica":"La lesión de los neumocitos tipo II causa disminución del surfactante → colapso alveolar (atelectasia) (fase EXUDATIVA del ARDS).","sketchy":"Las \"anémonas colapsando\" representan literalmente el colapso alveolar (atelectasia).","literal":"Injury to type II pneumocytes causes decreased surfactant → alveolar collapse (atelectasis) (ARDS EXUDATIVE phase)"},{"n":"22","nombre":"Bloody steak","ver":"Un trozo de carne sangrante (bloody steak) en el fondo del acuario.","clinica":"El daño al endotelio capilar causa exudado sanguinolento, celular y rico en proteínas llenando los alvéolos (fase EXUDATIVA del ARDS).","sketchy":"El \"filete sangrante\" representa el exudado sanguinolento y celular llenando los alvéolos.","literal":"Damage to capillary endothelium causes bloody, cellular, protein-rich exudate filling alveoli (ARDS EXUDATIVE phase)"},{"n":"23","nombre":"Overgrowth of pink algae","ver":"Un crecimiento excesivo de algas rosadas cubriendo las vías respiratorias pequeñas.","clinica":"Las membranas hialinas (material rosado del exudado y desechos celulares) revisten las vías aéreas pequeñas (fase EXUDATIVA del ARDS).","sketchy":"Las \"algas rosadas\" representan literalmente las membranas hialinas de color rosado.","literal":"Hyaline membranes (pink material from exudate + cell debris) line small airways (ARDS EXUDATIVE phase)"},{"n":"24","nombre":"\"DELAYED\"","ver":"Un cartel que dice \"DELAYED\" en el horario de alimentación del acuario.","clinica":"Las manifestaciones clínicas del ARDS aparecen entre 6 y 72 horas después del evento desencadenante.","sketchy":"\"DELAYED\" (retrasado) representa directamente el retraso temporal entre el evento y las manifestaciones clínicas.","literal":"Clinical manifestations of ARDS appear 6 to 72 hours after inciting event"},{"n":"25","nombre":"Sputtering bilateral snorkel","ver":"Un esnórquel bilateral chisporroteando/burbujeando de forma irregular.","clinica":"El ARDS se presenta con crepitantes difusos bilaterales.","sketchy":"El \"esnórquel bilateral chisporroteando\" representa los crepitantes bilaterales difusos auscultados.","literal":"ARDS presents with bilateral diffuse crackles"},{"n":"26","nombre":"Struggling for air","ver":"Un buzo luchando por respirar (struggling for air) en el agua.","clinica":"El ARDS se presenta con disnea, taquipnea, uso de músculos accesorios.","sketchy":"El buzo \"luchando por aire\" representa directamente la disnea y el esfuerzo respiratorio.","literal":"ARDS presents with dyspnea, tachypnea, accessory muscle use"},{"n":"27","nombre":"Hypoxic blue face","ver":"El rostro azulado (cianótico) de un buzo por falta de oxígeno.","clinica":"El ARDS se presenta con hipoxemia y gradiente A-a aumentado.","sketchy":"El \"rostro azul hipóxico\" es la representación literal directa de la hipoxemia.","literal":"ARDS presents with hypoxemia and increased A-a gradient"},{"n":"28","nombre":"O2 tank drifting away","ver":"Un tanque de oxígeno (O2 tank) flotando/alejándose en el agua.","clinica":"El ARDS causa hipoxemia que NO se corrige fácilmente con suplementación de oxígeno.","sketchy":"El \"tanque de oxígeno alejándose\" representa literalmente la falta de corrección con oxígeno suplementario.","literal":"ARDS causes hypoxemia that is NOT easily corrected with oxygen supplementation"},{"n":"29","nombre":"White life vest","ver":"Un chaleco salvavidas de color blanco en la escena.","clinica":"En radiografía de tórax (CXR), el ARDS muestra opacidades bilaterales → apariencia de \"opacificación total\" (\"white out\").","sketchy":"El \"chaleco blanco\" es la representación literal directa del hallazgo radiológico de \"white out\" bilateral.","literal":"On CXR, ARDS shows bilateral opacities → \"white out\" appearance"},{"n":"30","nombre":"\"Help sharks proliferate\"","ver":"Un cartel que dice \"Help Sharks Proliferate\" en el tanque inferior con tiburones pequeños.","clinica":"La etapa PROLIFERATIVA del ARDS ocurre después de la etapa EXUDATIVA.","sketchy":"\"PROLIFERATE\" es la clave literal directa de la fase \"PROLIFERATIVE\" del ARDS.","literal":"PROLIFERATIVE stage of ARDS occurs after EXUDATIVE stage"},{"n":"31","nombre":"Mopping up the damage","ver":"Un trabajador limpiando/trapeando (mopping) el daño en el suelo del acuario.","clinica":"En la fase PROLIFERATIVA, el edema pulmonar se resuelve.","sketchy":"\"Trapear el daño\" representa literalmente la resolución/limpieza del edema pulmonar.","literal":"In PROLIFERATIVE phase, pulmonary edema resolves"},{"n":"32","nombre":"Repairing epithelial tile","ver":"Un trabajador reparando/instalando azulejos (tile) en el suelo del acuario.","clinica":"Los neumocitos tipo II se replican → resíntesis de surfactante y diferenciación en neumocitos tipo I → epitelio restaurado (fase PROLIFERATIVA).","sketchy":"La \"reparación del azulejo epitelial\" representa literalmente la restauración del epitelio alveolar.","literal":"Type II pneumocytes replicate → resynthesis of surfactant and differentiation into type I pneumocytes → epithelium replenished (PROLIFERATIVE phase)"},{"n":"33","nombre":"Cartilaginous sharks","ver":"Tiburones con estructura cartilaginosa visible en el tanque.","clinica":"Los miofibroblastos depositan colágeno a lo largo del pulmón → fibrosis pulmonar crónica (complicación del ARDS).","sketchy":"Los \"tiburones cartilaginosos\" (tejido conectivo rígido) representan el depósito de colágeno y la fibrosis resultante.","literal":"Myofibroblasts deposit collagen throughout lung → chronic pulmonary fibrosis (ARDS complication)"},{"n":"34","nombre":"Fibrotic lung coral","ver":"Un coral con forma de pulmón y textura fibrótica.","clinica":"El ARDS puede llevar a fibrosis pulmonar crónica.","sketchy":"El \"coral fibrótico con forma de pulmón\" es la representación literal directa de la fibrosis pulmonar crónica.","literal":"ARDS can lead to chronic pulmonary fibrosis"},{"n":"35","nombre":"Blimp fish","ver":"Un pez con forma de dirigible (blimp) inflado, nadando en la escena.","clinica":"El BNP sérico está elevado (↑) en la insuficiencia cardíaca (ayuda a distinguir la ICC del ARDS).","sketchy":"\"Blimp\" (dirigible) suena fonéticamente similar a \"BNP\", y su forma \"inflada\" representa la elevación del marcador.","literal":"↑ Serum BNP in heart failure (helps distinguish CHF from ARDS)"},{"n":"36","nombre":"Slushi3","ver":"Una bebida tipo granizado (\"Slushi3\") con el número \"3\" resaltado.","clinica":"Los galopes S3/S4 son comunes en la insuficiencia cardíaca (distingue la ICC del ARDS).","sketchy":"\"Slushi3\" con el \"3\" resaltado es la clave literal directa del galope S3/S4.","literal":"S3/S4 gallops common in heart failure (distinguishes CHF from ARDS)"},{"n":"37","nombre":"Distended blue jugs","ver":"Jarras azules distendidas/hinchadas en la escena.","clinica":"La distensión venosa yugular (JVD) está elevada en la insuficiencia cardíaca (distingue la ICC del ARDS).","sketchy":"Las \"jarras azules distendidas\" (jugs) representan literalmente la distensión venosa yugular (jugular venous distension).","literal":"Jugular venous distension (JVD) elevated in heart failure (distinguishes CHF from ARDS)"},{"n":"38","nombre":"Wedge fish","ver":"Un pez con forma de cuña (wedge) en la escena final del acuario.","clinica":"La presión de enclavamiento pulmonar (wedge pressure) está elevada (≥18 mmHg) en la insuficiencia cardíaca (rara vez usada para distinguir la ICC del ARDS).","sketchy":"El \"pez cuña\" (wedge fish) es la clave literal directa de la \"presión de enclavamiento\" (wedge pressure).","literal":"Pulmonary wedge pressure elevated (≥18 mmHg) in heart failure (rarely used to distinguish CHF from ARDS)"}]}]},{"nombre":"Inmunología","codigo":"im","temas":[{"slug":"trastornos-combinados-celulas-b-t","titulo":"Trastornos combinados de células B y T","items":[{"n":"1","nombre":"PRIMARY school kid with crutches","ver":"Un niño de escuela primaria (primary school) caminando con muletas frente a una tienda.","clinica":"PRIMARIA (inmunodeficiencia heredada).","sketchy":"La \"escuela primaria\" (primary school) es la clave literal directa de \"PRIMARY immunodeficiency\".","literal":"PRIMARY (inherited) immunodeficiency"},{"n":"2","nombre":"Fallen comic books (with B-cell archer & T-cell knight)","ver":"Cómics caídos en la calle, mostrando un arquero (B-cell archer) y un caballero (T-cell knight).","clinica":"Deficiencia combinada de células B y T.","sketchy":"Los personajes \"arquero\" (B-cell) y \"caballero\" (T-cell) caídos juntos representan la deficiencia combinada de ambos linajes.","literal":"combined B-cell & T-cell deficiency"},{"n":"3","nombre":"Wasps","ver":"Avispas (wasps) volando cerca de la tienda \"E.A.T.\".","clinica":"Síndrome de Wiskott-Aldrich (inmunodeficiencia primaria combinada de células B y T → infecciones virales, fúngicas y bacterianas encapsuladas).","sketchy":"Las \"avispas\" (wasps) son la clave fonética directa de \"Wiskott\".","literal":"Wiskott-Aldrich syndrome (combined B and T cell primary immunodeficiency → viral, fungal, encapsulated bacterial infections)"},{"n":"4","nombre":"Boy receding behind \"X\" door","ver":"Un niño retrocediendo/escondiéndose detrás de una puerta marcada con una \"X\".","clinica":"El síndrome de Wiskott-Aldrich es X-linked recesivo.","sketchy":"La puerta marcada \"X\" y el niño \"retrocediendo\" (recessive = recesivo) representan el patrón de herencia X-linked recesivo.","literal":"Wiskott-Aldrich syndrome is X-linked recessive"},{"n":"5","nombre":"Wasp stings","ver":"Picaduras de avispa visibles en la piel de un niño.","clinica":"El síndrome de Wiskott-Aldrich se presenta con eczema.","sketchy":"Las \"picaduras de avispa\" (ronchas rojas) representan literalmente el eczema.","literal":"Wiskott-Aldrich syndrome presents with eczema"},{"n":"6","nombre":"Broken plates","ver":"Platos rotos cayendo/esparcidos en la escena.","clinica":"El síndrome de Wiskott-Aldrich se presenta con trombocitopenia.","sketchy":"Los \"platos rotos\" (plates = platelets, plaquetas) representan la trombocitopenia.","literal":"Wiskott-Aldrich syndrome presents with thrombocytopenia"},{"n":"7","nombre":"Disorganized cytoskeleton nest","ver":"Un nido desorganizado con estructura tipo citoesqueleto en la escena.","clinica":"Las mutaciones en la proteína del síndrome de Wiskott-Aldrich llevan a reorganización ANORMAL del citoesqueleto de actina → función alterada de células T (incluyendo regulación anormal de células B) → disfunción de células B.","sketchy":"El \"nido desorganizado\" con forma de citoesqueleto representa literalmente la reorganización anormal de actina.","literal":"mutations in Wiskott-Aldrich Syndrome Protein lead to ABNORMAL actin CYTOSKELETON reorganization → impaired T cell function (including abnormal regulation of B cells) → B cell dysfunction"},{"n":"8","nombre":"Bacterial lanterns with encapsulated pizza","ver":"Linternas con forma de bacteria y una pizza \"encapsulada\" en la tienda de la esquina.","clinica":"El síndrome de Wiskott-Aldrich aumenta la susceptibilidad a bacterias ENCAPSULADAS (Strep pneumo, H. influenzae, N. meningitidis) porque la eliminación requiere anticuerpos (→ otitis media recurrente, sinusitis, neumonía, meningitis).","sketchy":"La \"pizza encapsulada\" representa literalmente las bacterias enca
