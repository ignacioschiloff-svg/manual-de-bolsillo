inica":"Los pólipos HAMARTOMATOSOS son maduros y benignos.","sketchy":"El anciano \"feliz\" (benigno en carácter) representa la naturaleza benigna y madura de estos pólipos.","literal":"HAMARTOMATOUS polyps are MATURE and BENIGN"},{"n":"5","nombre":"Peutz-pop","ver":"Un gnomo sosteniendo una paleta/dulce (pop).","clinica":"El síndrome de Peutz-Jeghers se presenta con pólipos hamartomatosos en el tracto GI (más común en duodeno, también puede ocurrir en colon).","sketchy":"\"Peutz-pop\" (paleta) es la clave mnemotécnica fonética directa para \"Peutz-Jeghers\".","literal":"Peutz-Jeghers syndrome presents with hamartomatous polyps in the GI tract (most common in duodenum, can also occur in colon)"},{"n":"6","nombre":"Domino","ver":"Una ficha de dominó grande apoyada en el camino del pueblo.","clinica":"El síndrome de Peutz-Jeghers y el síndrome de poliposis juvenil (causas familiares de pólipos HAMARTOMATOSOS) son autosómicos dominantes.","sketchy":"El dominó es la clave mnemotécnica fonética fija de Sketchy para \"autosomal dominant\".","literal":"Peutz-Jeghers and juvenile polyposis syndromes (familial causes of HAMARTOMATOUS polyps) are autosomal dominant"},{"n":"7","nombre":"Pigmented juice spots","ver":"Un gnomo con manchas pigmentadas alrededor de la boca.","clinica":"El síndrome de Peutz-Jeghers se presenta con máculas pigmentadas alrededor de boca, labios, palmas y genitales (hiperpigmentación mucocutánea).","sketchy":"Las manchas de \"jugo\" pigmentado alrededor de la boca representan directamente la hiperpigmentación mucocutánea.","literal":"Peutz-Jeghers syndrome presents with pigmented macules around mouth, lips, palms, and genitalia (mucocutaneous hyperpigmentation)"},{"n":"8","nombre":"Infant with hammer","ver":"Un gnomo bebé sosteniendo un martillo, cerca del grupo de hongos.","clinica":"El síndrome de POLIPOSIS JUVENIL (más común en niños menores de 5 años) se presenta con pólipos HAMARTOMATOSOS.","sketchy":"El bebé sosteniendo el martillo (hamartomatoso) representa directamente el grupo etario pediátrico afectado.","literal":"JUVENILE POLYPOSIS syndrome (most common in children < 5 years of age) presents with HAMARTOMATOUS polyps"},{"n":"9","nombre":"Mushroom emerging from the behind","ver":"Un pequeño hongo emergiendo detrás de uno de los gnomos.","clinica":"Los pólipos JUVENILES son más comunes en el recto y pueden prolapsar a través del esfínter anal.","sketchy":"El hongo emergiendo \"por detrás\" representa directamente la localización rectal y el prolapso a través del esfínter anal.","literal":"JUVENILE polyps are most common in the RECTUM and may prolapse through the anal sphincter"},{"n":"10","nombre":"Bleeding mushroom","ver":"Un hongo con manchas rojas de sangre en el suelo cerca de él.","clinica":"Los pólipos JUVENILES se presentan con sangrado GI bajo (hematoquecia).","sketchy":"El hongo \"sangrante\" es la representación literal directa de la hematoquecia.","literal":"JUVENILE polyps present with lower GI bleeding (hematochezia)"},{"n":"11","nombre":"Little mushroom spots","ver":"Pequeñas manchas/puntos en la superficie de un hongo pequeño.","clinica":"Los pólipos JUVENILES muestran pequeños espacios quísticos (glándulas llenas de mucina y detritos).","sketchy":"Las pequeñas manchas puntiformes representan los espacios quísticos vistos en histología.","literal":"JUVENILE polyps display small cystic spaces (glands filled with mucin and debris)"},{"n":"12","nombre":"Creeping crab beetle","ver":"Un escarabajo grande arrastrándose cerca del grupo de hongos.","clinica":"El síndrome de POLIPOSIS JUVENIL se asocia con un riesgo aumentado de cáncer de colon (a pesar de que los pólipos son benignos).","sketchy":"El escarabajo \"arrastrándose\" (símbolo de cáncer en Sketchy) representa el riesgo maligno asociado.","literal":"JUVENILE POLYPOSIS syndrome is associated with an increased risk of colon cancer (despite polyps being benign)"},{"n":"13","nombre":"Big hyperplastic mushroom","ver":"Un hongo grande de color púrpura con manchas blancas.","clinica":"Pólipo HIPERPLÁSICO (proliferación epitelial no neoplásica).","sketchy":"El tamaño \"grande\" del hongo representa la proliferación epitelial (hiperplasia = crecimiento aumentado).","literal":"HYPERPLASTIC polyp (non-neoplastic epithelial proliferation)"},{"n":"14","nombre":"Happy lilipolyps","ver":"Pequeños gnomos-hongo de aspecto feliz alrededor del hongo grande.","clinica":"Los pólipos HIPERPLÁSICOS son BENIGNOS.","sketchy":"Los gnomos \"felices\" representan la naturaleza benigna de estos pólipos.","literal":"HYPERPLASTIC polyps are BENIGN"},{"n":"15","nombre":"Mucous-y goblet shrooms","ver":"Hongos delgados y alargados con aspecto viscoso/mucoso.","clinica":"Los pólipos HIPERPLÁSICOS son proliferaciones epiteliales que contienen abundantes células caliciformes (goblet cells).","sketchy":"El aspecto \"mucoso\" de los hongos representa las células caliciformes productoras de moco.","literal":"HYPERPLASTIC polyps are epithelial proliferations that contain abundant goblet cells"},{"n":"16","nombre":"Sawing near the surface","ver":"Un gnomo serruchando cerca de la superficie de un hongo, sin cortar profundo.","clinica":"Los pólipos HIPERPLÁSICOS tienen arquitectura serrada solo en la SUPERFICIE (las criptas mantienen forma lisa).","sketchy":"El serruchado \"solo cerca de la superficie\" representa literalmente que el patrón serrado se limita a la superficie.","literal":"HYPERPLASTIC polyps have serrated architecture only at the SURFACE (crypts retain smooth shape)"},{"n":"17","nombre":"Sawing on stalk-less mushroom cap","ver":"Un gnomo serruchando un hongo que no tiene tallo (stalk-less).","clinica":"Pólipo SESIL SERRADO (lesión plana premaligna del colon).","sketchy":"El hongo \"sin tallo\" (stalk-less) representa literalmente la naturaleza sésil (plana, sin pedúnculo) de este pólipo.","literal":"SESSILE SERRATED polyp (premalignant flat lesion of the colon)"},{"n":"18","nombre":"Sawing all the way through","ver":"El gnomo serruchando completamente a través del hongo sésil.","clinica":"Los pólipos SÉSILES SERRADOS tienen arquitectura serrada A TRAVÉS DE TODO (incluyendo las criptas).","sketchy":"El serruchado \"a través de todo\" representa que el patrón serrado incluye las criptas, no solo la superficie.","literal":"SESSILE SERRATED polyps have serrated architecture THROUGHOUT (crypts included)"},{"n":"19","nombre":"Creeping crab beetle","ver":"Un escarabajo grande arrastrándose cerca de los hongos serrados.","clinica":"Los PÓLIPOS SERRADOS Y ADENOMAS tienen el potencial de transformarse en cáncer.","sketchy":"El escarabajo (símbolo de cáncer) representa el potencial de transformación maligna.","literal":"SERRATED POLYPS & ADENOMAS have the potential to transform into cancer"},{"n":"20","nombre":"ADDing shingles to mushroom house","ver":"Un gnomo añadiendo tejas a una casa-hongo.","clinica":"Los pólipos ADENOMATOSOS (ADENOMAS) son el tipo más común de pólipo de colon.","sketchy":"\"ADDing\" (añadiendo) suena fonéticamente como el inicio de \"ADenoma\".","literal":"ADENOMATOUS polyps (ADENOMAS) are the most common type of colon polyp"},{"n":"21","nombre":"Creeping crab beetle","ver":"Otro escarabajo arrastrándose cerca de la casa-hongo.","clinica":"Los PÓLIPOS SERRADOS Y ADENOMAS tienen el potencial de transformarse en cáncer.","sketchy":"El escarabajo repite el símbolo de riesgo de malignización.","literal":"SERRATED POLYPS & ADENOMAS have the potential to transform into cancer"},{"n":"22","nombre":"Oversized mushroom next to crab beetle","ver":"Un hongo de gran tamaño junto al escarabajo.","clinica":"Los ADENOMAS más grandes tienen mayor probabilidad de transformarse en cáncer.","sketchy":"El tamaño \"sobredimensionado\" del hongo representa directamente el mayor tamaño del adenoma.","literal":"larger ADENOMAS are more likely to transform into cancer"},{"n":"23","nombre":"\"1\" horn","ver":"Un cuerno con el número \"1\" grabado.","clinica":"Los adenomas mayores de 1 cm tienen más probabilidad de transformarse en cáncer que los pólipos más pequeños.","sketchy":"El \"1\" en el cuerno es la clave numérica directa del umbral de 1 cm.","literal":"adenomas >1 cm are more likely to transform into cancer than smaller polyps"},{"n":"24","nombre":"Increasingly disorganized purple weeds next to crab beetle","ver":"Hierbas moradas cada vez más desordenadas junto al escarabajo.","clinica":"Los ADENOMAS con mayor grado de displasia (epitelio más hipercromático, elongado y estratificado) tienen más probabilidad de transformarse en cáncer.","sketchy":"Las hierbas \"cada vez más desordenadas\" representan el aumento progresivo del grado de displasia.","literal":"ADENOMAS with a greater degree of dysplasia (more hyperchromatic, elongated, and stratified epithelium) are more likely to transform into cancer"},{"n":"25","nombre":"TUBULAR horn","ver":"Un cuerno con forma tubular sostenido por un gnomo.","clinica":"ADENOMAS TUBULARES (pólipos pequeños pedunculados compuestos de células mucosas displásicas que forman glándulas con forma de tubo).","sketchy":"La forma \"tubular\" del cuerno es la representación literal directa del adenoma tubular.","literal":"TUBULAR ADENOMAS (small pedunculated polyps composed of dysplastic mucosal cells that form tube-shaped glands)"},{"n":"26","nombre":"Tubular perforations","ver":"Perforaciones/agujeros redondos en una de las casas-hongo.","clinica":"Los ADENOMAS TUBULARES muestran secciones transversales de glándulas tubulares redondas en histología.","sketchy":"Las perforaciones redondas representan los cortes transversales de las glándulas tubulares vistas al microscopio.","literal":"TUBULAR ADENOMAS display round tubular gland cross sections on histology"},{"n":"27","nombre":"Finger-like stalk-less fungus","ver":"Hongos delgados con forma de dedos, sin tallo definido.","clinica":"ADENOMAS VELLOSOS (sésiles, más grandes que los adenomas tubulares, con glándulas largas con proyecciones tipo vellosidades).","sketchy":"Las proyecciones \"en forma de dedo\" representan literalmente las vellosidades del adenoma velloso.","literal":"VILLOUS ADENOMAS (sessile, larger than tubular adenomas, long glands with villi-like projections)"},{"n":"28","nombre":"Villus fungus next to crab beetle","ver":"Un hongo con proyecciones vellosas junto al escarabajo.","clinica":"Los ADENOMAS VELLOSOS tienen más probabilidad de transformarse en cáncer (comparados con los adenomas tubulares).","sketchy":"El hongo velloso junto al escarabajo de cáncer representa el mayor riesgo relativo de malignización.","literal":"VILLOUS ADENOMAS are more likely to transform into cancer (compared to TUBULAR ADENOMAS)"},{"n":"29","nombre":"Polyp family","ver":"Una familia completa de gnomos-hongo agrupados frente a una casa.","clinica":"Poliposis Adenomatosa Familiar (FAP) (síndrome hereditario que causa miles de pólipos adenomatosos desde temprana edad).","sketchy":"La \"familia\" de pólipos representa literalmente el carácter familiar y múltiple de la FAP.","literal":"Familial adenomatous polyposis (FAP) (inherited syndrome that causes thousands of adenomatous polyps early in life)"},{"n":"30","nombre":"Domino","ver":"Una ficha de dominó negra apoyada cerca de la casa familiar.","clinica":"La FAP es autosómica DOMINANTE.","sketchy":"El dominó es el símbolo fijo de Sketchy para \"autosomal dominant\".","literal":"FAP is autosomal DOMINANT"},{"n":"31","nombre":"\"A Pulled Carrot\"","ver":"Una zanahoria siendo arrancada del suelo por un gnomo.","clinica":"La poliposis adenomatosa familiar (FAP) es causada por una mutación germinal en el gen APC.","sketchy":"\"A Pulled\" suena fonéticamente como \"APC\", y la zanahoria \"arrancada\" representa la mutación del gen.","literal":"familial adenomatous polyposis (FAP) is caused by a germline mutation in the APC gene"},{"n":"32","nombre":"Cancer-fighting ribbon","ver":"Un lazo rosado (cancer-fighting ribbon) atado cerca de la zanahoria.","clinica":"APC es un gen supresor tumoral.","sketchy":"El lazo \"de lucha contra el cáncer\" representa el papel protector/supresor tumoral del gen APC.","literal":"APC is a tumor suppressor gene"},{"n":"33","nombre":"A single pulled carrot stalk","ver":"Un solo tallo de zanahoria siendo arrancado por un gnomo.","clinica":"En la FAP, solo un alelo APC tiene una mutación germinal (la segunda mutación ocurre durante la vida de la persona) (\"segundo golpe\").","sketchy":"El \"único\" tallo arrancado representa el primer alelo mutado, dejando el segundo intacto hasta el \"segundo hit\".","literal":"in FAP, only one APC allele has a germline mutation (the second mutation occurs during person's lifetime) (\"second hit\")"},{"n":"34","nombre":"Abundant mushrooms","ver":"Una abundancia de pequeños hongos agrupados en el suelo.","clinica":"La FAP puede presentarse con miles de pólipos en el colon (visualizados por colonoscopía).","sketchy":"La \"abundancia\" de hongos representa literalmente los miles de pólipos característicos de la FAP.","literal":"FAP can present with thousands of polyps in the colon (as visualized by colonoscopy)"},{"n":"35","nombre":"Family crab beetle","ver":"Un gran escarabajo cerca de la casa familiar de hongos.","clinica":"La FAP progresa a cáncer de colon en casi el 100% de los casos (el tratamiento es colectomía profiláctica).","sketchy":"El escarabajo (cáncer) ubicado junto a la familia representa la progresión casi segura a malignidad.","literal":"FAP progresses to colon cancer in nearly 100% of cases (treatment is prophylactic colectomy)"},{"n":"36","nombre":"Gardner within mushroom field","ver":"Una figura tipo jardinero (gardener) dentro de un campo cercado de hongos pequeños.","clinica":"El síndrome de GARDNER (variante de FAP) (trastorno hereditario que se presenta con pólipos adenomatosos y tumores de TEJIDO BLANDO).","sketchy":"\"Gardner\" (jardinero) es la clave mnemotécnica fonética directa del síndrome de Gardner.","literal":"GARDNER syndrome (FAP variant) (inherited disorder presenting with adenomatous polyps and SOFT TISSUE TUMORS)"},{"n":"37","nombre":"Bone garden fence","ver":"Una cerca hecha de huesos alrededor del campo del jardinero.","clinica":"El síndrome de GARDNER se presenta con osteomas (tumores óseos benignos).","sketchy":"La cerca \"de hueso\" representa directamente los osteomas.","literal":"GARDNER syndrome presents with osteomas (benign bone tumor)"},{"n":"38","nombre":"Skin rash on gardner","ver":"Una erupción cutánea visible en la piel del jardinero.","clinica":"El síndrome de GARDNER se presenta con lesiones cutáneas.","sketchy":"La erupción cutánea representa directamente las lesiones dermatológicas asociadas.","literal":"GARDNER syndrome presents with cutaneous lesions"},{"n":"39","nombre":"Overgrown sunglasses on gardner","ver":"Unas gafas de sol sobrecrecidas/agrandadas que lleva puestas el jardinero.","clinica":"El síndrome de GARDNER se presenta con hipertrofia del epitelio pigmentario retiniano.","sketchy":"Las gafas \"sobrecrecidas\" (overgrown) representan la hipertrofia ocular.","literal":"GARDNER syndrome presents with hypertrophy of retinal pigment epithelium"},{"n":"40","nombre":"Tooth gardening stool","ver":"Un banco de jardinería con forma de diente.","clinica":"El síndrome de GARDNER se presenta con anormalidades dentales (dientes impactados y supernumerarios).","sketchy":"El banco con forma de \"diente\" (tooth) representa directamente las anormalidades dentales.","literal":"GARDNER syndrome presents with dental abnormalities (impacted and supernumerary teeth)"},{"n":"41","nombre":"Elder lilipolyp wearing turban","ver":"Un gnomo mayor con turbante, cerca de una casa-hongo grande.","clinica":"El síndrome de TURCOT (variante de FAP) se presenta con adenomas de colon y tumores CEREBRALES (meduloblastomas).","sketchy":"El \"turbante\" (turban) suena fonéticamente similar al inicio de \"TURCOT\".","literal":"TURCOT syndrome (FAP variant) presents with colon adenomas and BRAIN tumors (medulloblastomas)"},{"n":"42","nombre":"Crab beetle attacking Lilipolyp Village","ver":"Un gran escarabajo negro atacando la aldea de gnomos-hongo (Lilipolyp Village).","clinica":"Cáncer colorrectal (más comúnmente adenocarcinoma; 3er cáncer más común y 2da causa más común de muerte por cáncer).","sketchy":"El escarabajo \"atacando\" toda la aldea representa el cáncer colorrectal invadiendo el colon (representado por el pueblo entero).","literal":"colorectal cancer (most commonly adenocarcinoma - 3rd most common cancer and 2nd most common cause of cancer death)"},{"n":"43","nombre":"Old man lilipolyp riding crab beetle","ver":"Un gnomo mayor montado sobre el escarabajo negro.","clinica":"La incidencia máxima del cáncer colorrectal es entre los 60-70 años de edad, con los hombres afectados ligeramente más que las mujeres.","sketchy":"El gnomo \"mayor\" montando el escarabajo de cáncer representa el grupo etario de mayor incidencia.","literal":"peak incidence of colorectal cancer is 60-70 years of age, with men affected slightly more than women"},{"n":"44","nombre":"Family photo","ver":"Un marco de fotografía con una niña y un niño, en el fondo de la escena.","clinica":"La historia familiar es un factor de riesgo para el cáncer colorrectal (incluso en ausencia de un síndrome familiar conocido).","sketchy":"La \"foto familiar\" representa directamente el factor de riesgo de historia familiar.","literal":"family history is a risk factor for colorectal cancer (even in the absence of a known familial syndrome)"},{"n":"45","nombre":"Smoker","ver":"Brotes/hierbas cerca de la corriente de agua, con aspecto de humo cercano.","clinica":"El tabaquismo es un factor de riesgo para el cáncer colorrectal.","sketchy":"El elemento \"fumador\" representa directamente el factor de riesgo del tabaquismo.","literal":"smoking is a risk factor for colorectal cancer"},{"n":"46","nombre":"Alcohol bottle","ver":"Un tocón de árbol con una marca \"XX\" (etiqueta de alcohol).","clinica":"El consumo de alcohol es un factor de riesgo para el cáncer colorrectal.","sketchy":"La marca \"XX\" (símbolo clásico de licor fuerte) representa el consumo de alcohol.","literal":"alcohol use is a risk factor for colorectal cancer"},{"n":"47","nombre":"Round lilipolyp","ver":"Un gnomo-hongo de forma redondeada montado sobre el escarabajo.","clinica":"La obesidad es un factor de riesgo para el cáncer colorrectal.","sketchy":"La forma \"redonda\" del gnomo representa directamente la obesidad.","literal":"obesity is a risk factor for colorectal cancer"},{"n":"48","nombre":"Fiery intestines","ver":"Una fogata ardiendo con forma de intestino retorcido.","clinica":"La enfermedad inflamatoria intestinal es un factor de riesgo para el cáncer colorrectal.","sketchy":"El \"intestino en llamas\" representa directamente la inflamación intestinal crónica.","literal":"inflammatory bowel disease is a risk factor for colorectal cancer"},{"n":"49","nombre":"\"A Pulled Carrot\"","ver":"Otra zanahoria siendo arrancada, cerca del rollo de listón rosado.","clinica":"Las mutaciones en el gen APC llevan al crecimiento inicial de pequeños pólipos ADENOMATOSOS (ADENOMAS).","sketchy":"La zanahoria arrancada repite el símbolo de la mutación de APC, ahora en el contexto de la secuencia adenoma-carcinoma.","literal":"mutations in the APC gene lead to the initial growth of small ADENOMATOUS POLYPS (ADENOMAS)"},{"n":"50","nombre":"Carrots","ver":"Un montón de zanahorias apiladas junto al lazo rosado.","clinica":"El producto del gen APC controla las concentraciones de beta-catenina e interactúa con E-caderina.","sketchy":"Las zanahorias representan el producto proteico del gen APC en su función reguladora normal.","literal":"the APC gene product controls the concentrations of beta-CATENIN and interacts with E-CADHERIN"},{"n":"51","nombre":"Cancer-fighting ribbon","ver":"Un rollo de listón rosado (cancer-fighting ribbon) junto a las zanahorias.","clinica":"APC es un gen supresor tumoral.","sketchy":"El listón repite el símbolo del gen supresor tumoral APC.","literal":"APC is a tumor suppressor gene"},{"n":"52","nombre":"Cancerous rat","ver":"Una rata grande en el camino del pueblo.","clinica":"Las mutaciones en el protooncogén K-RAS llevan a división celular imparable (K-RAS codifica una proteína que regula el ciclo celular).","sketchy":"\"Rat\" suena fonéticamente similar al final de \"K-RAS\", siendo la rata la clave mnemotécnica.","literal":"mutations in the K-RAS proto-oncogene leads to unstoppable cell division (K-RAS encodes for a protein that regulates the cell cycle)"},{"n":"53","nombre":"Mushrooms increasing in size","ver":"Un gnomo montado sobre la rata, con hongos que aumentan de tamaño alrededor.","clinica":"Los ADENOMAS aumentan de tamaño como resultado de mutaciones en K-RAS.","sketchy":"El aumento de tamaño de los hongos representa directamente el crecimiento del adenoma tras la mutación de K-RAS.","literal":"ADENOMAS increase in size as a result of mutations in K-RAS"},{"n":"54","nombre":"Broken city wall","ver":"Una estructura tipo muralla rota junto al camino.","clinica":"La invasión de la membrana basal marca la transformación maligna de un adenoma en un adenocarcinoma.","sketchy":"La \"muralla rota\" es la representación literal directa de la invasión de la membrana basal.","literal":"basement membrane invasion marks malignant transformation of an ADENOMA into an ADENOCARCINOMA"},{"n":"55","nombre":"Broken checkpoint","ver":"Un bastón de caramelo (candy cane) roto, tipo barrera de control.","clinica":"La mutación en el gen p53 (gen supresor tumoral que controla la transición de fase G1 a S) contribuye a la transformación maligna de pólipos en cáncer colorrectal.","sketchy":"El \"checkpoint roto\" (punto de control roto) representa directamente la falla del punto de control del ciclo celular regulado por p53.","literal":"mutation in the p53 gene (tumor suppressor gene that controls G1 to S phase transitioning) contributes to malignant transformation of polyps into colorectal cancer"},{"n":"56","nombre":"Broken \"Don't CCross\"","ver":"Un cartel roto que dice \"Don't CCross\".","clinica":"La pérdida del gen Deleted in Colon Cancer (DCC) (gen supresor tumoral que normalmente induce apoptosis) contribuye a la transformación maligna de pólipos en cáncer colorrectal.","sketchy":"\"CCross\" con las letras \"CC\" resaltadas es la clave literal directa para \"DCC\" (Deleted in Colon Cancer), y el cartel roto marca su pérdida funcional.","literal":"loss of the Deleted in Colon Cancer (DCC) gene (tumor suppressor gene that normally induces apoptosis) contributes to malignant transformation of polyps into colorectal cancer"},{"n":"57","nombre":"Cauliflower on the RIGHT","ver":"Una coliflor grande de color blanco en el lado derecho de la escena.","clinica":"El cáncer de colon del lado DERECHO (colon ascendente proximal) se presenta como una masa exofítica (usualmente NO obstructiva a pesar de la extensión hacia el lumen).","sketchy":"La coliflor \"exofítica\" (con forma de masa protuberante) ubicada a la \"derecha\" representa la masa exofítica del cáncer derecho.","literal":"RIGHT-sided colon cancer (proximal ascending colon) presents as an exophytic mass (usually NON-obstructive despite extension into the lumen)"},{"n":"58","nombre":"Occult watchman dropping iron tools","ver":"Un gnomo dejando caer herramientas de hierro cerca de la coliflor.","clinica":"El cáncer del lado DERECHO a menudo se presenta con anemia ferropénica (por sangrado GI oculto).","sketchy":"Las herramientas \"de hierro\" cayendo representan directamente la anemia ferropénica (deficiencia de hierro).","literal":"RIGHT-sided colon cancer often presents with iron deficiency anemia (from occult GI bleeding)"},{"n":"59","nombre":"\"Path Obstructed\" on LEFT","ver":"Un cartel que dice \"Path Obstructed\" en el lado izquierdo de la escena.","clinica":"El cáncer de colon del lado IZQUIERDO (colon descendente) puede presentarse con obstrucción colónica (por estrechamiento luminal por lesiones ulcerativas infiltrantes) llevando a cambios en el hábito intestinal.","sketchy":"El cartel \"camino obstruido\" es la clave literal directa de la obstrucción colónica del cáncer izquierdo.","literal":"LEFT-sided colon cancer (descending colon) may present with colonic obstruction (due to luminal narrowing from infiltrative ulcerative lesions) leading to changes in bowel habits"},{"n":"60","nombre":"Apple core on left","ver":"Una forma tipo hoja/almohadón roja, con aspecto de \"corazón de manzana\" mordido, en el lado izquierdo.","clinica":"El cáncer del lado IZQUIERDO puede presentarse con una lesión \"en corazón de manzana\" (apple core) en estudios de imagen (por estrechamiento luminal).","sketchy":"La forma \"mordida\" es la representación literal directa de la lesión en corazón de manzana.","literal":"LEFT-sided colon cancer can present with an \"apple core\" lesion on imaging (due to luminal narrowing)"},{"n":"61","nombre":"Sitting in red puddle","ver":"Un gnomo bebé sentado en un charco rojo.","clinica":"El cáncer del lado IZQUIERDO se presenta con hematoquecia.","sketchy":"El \"charco rojo\" representa directamente la hematoquecia (sangre en heces).","literal":"LEFT-sided colon cancer presents with hematochezia"},{"n":"62","nombre":"Periscope","ver":"Un periscopio sostenido por un gnomo guerrero.","clinica":"La colonoscopía es el estándar de oro para el tamizaje y diagnóstico del cáncer de colon (la detección temprana y remoción de ADENOMAS puede prevenir el cáncer).","sketchy":"El periscopio (instrumento para \"ver dentro\") representa directamente la colonoscopía.","literal":"colonoscopy is the gold standard for screening and diagnosis of colon cancer (early detection and removal of ADENOMAS can prevent cancer)"},{"n":"63","nombre":"Fibrous hat","ver":"Un sombrero fibroso que lleva puesto uno de los gnomos guerreros.","clinica":"Una dieta alta en fibra disminuye el riesgo de cáncer de colon.","sketchy":"El sombrero \"fibroso\" representa literalmente la dieta alta en fibra.","literal":"a high-fiber diet decreases the risk of colon cancer"},{"n":"64","nombre":"Aspirin umpire guard","ver":"Un gnomo guerrero con armadura tipo árbitro (umpire), sosteniendo una lanza.","clinica":"El uso regular de aspirina disminuye el riesgo de cáncer de colon.","sketchy":"El \"guardia árbitro\" con protección representa el efecto protector regular de la aspirina.","literal":"regular aspirin use decreases the risk of colon cancer"},{"n":"65","nombre":"\"CEA\"","ver":"Un objeto etiquetado \"CEA\" sostenido por el gnomo guerrero.","clinica":"El antígeno carcinoembrionario (CEA) puede usarse para monitorear la progresión o recurrencia del cáncer de colon (demasiado inespecífico para el diagnóstico de cáncer).","sketchy":"Las letras \"CEA\" son la clave literal directa del marcador tumoral.","literal":"carcinoembryonic antigen (CEA) can be used to monitor progression or recurrence of colon cancer (too nonspecific for cancer diagnosis)"},{"n":"66","nombre":"Lynch inchworm","ver":"Una oruga/gusano verde con forma de serpiente (inchworm), enroscada en la escena.","clinica":"El síndrome de Lynch (cáncer colorrectal hereditario no polipósico [HNPCC]) es la causa familiar más común de cáncer colorrectal (SIN pólipos adenomatosos).","sketchy":"\"Inchworm\" (gusano medidor) es el símbolo mnemotécnico fijo de Sketchy para \"Lynch syndrome\".","literal":"Lynch syndrome (hereditary non-polyposis colorectal cancer [HNPCC]) is the most common familial cause of colorectal cancer (NO adenomatous polyps)"},{"n":"67","nombre":"Domino bridge","ver":"Fichas de dominó formando un puente cerca del gusano.","clinica":"El síndrome de Lynch es autosómico DOMINANTE.","sketchy":"El dominó vuelve a representar \"autosomal dominant\".","literal":"Lynch syndrome is autosomal DOMINANT"},{"n":"68","nombre":"Mismatched colors","ver":"Fichas de dominó con colores que no coinciden (mismatched) entre sí.","clinica":"El síndrome de Lynch es causado por mutaciones germinales en genes de reparación de emparejamiento erróneo (mismatch repair) (MSH2 y MLH1).","sketchy":"Los colores \"no coincidentes\" (mismatched) representan literalmente los genes \"mismatch repair\".","literal":"Lynch syndrome is caused by germline mutations in mismatch repair genes (MSH2 and MLH1)"},{"n":"69","nombre":"Cancer fighting ribbon","ver":"Un listón rosado de lucha contra el cáncer cerca del gusano.","clinica":"Los genes de reparación de emparejamiento erróneo (MSH2, MLH1) son genes supresores tumorales.","sketchy":"El listón representa el papel de estos genes como supresores tumorales.","literal":"mismatch repair genes (MSH2, MLH1) are tumor suppressor genes"},{"n":"70","nombre":"One falling antennae","ver":"Una sola antena cayendo del gusano.","clinica":"El síndrome de Lynch es causado por la herencia de una mutación germinal (la segunda mutación se adquiere durante la vida de la persona).","sketchy":"La \"única\" antena cayendo representa la primera mutación heredada, análogo al \"single pulled carrot\" de la FAP.","literal":"Lynch syndrome is caused by inheritance of one germline mutation (second mutation is acquired during person's lifetime)"},{"n":"71","nombre":"Crab belt buckle","ver":"Una hebilla de cinturón con forma de cangrejo.","clinica":"El síndrome de Lynch también se asocia con un riesgo aumentado de otros cánceres abdominales/pélvicos (endometrial, ovárico, gástrico, intestino delgado, hepatobiliar).","sketchy":"La hebilla con forma de cangrejo (cáncer), ubicada en la zona abdominal/pélvica del cinturón, representa el riesgo de cánceres en esa región.","literal":"Lynch syndrome is also associated with increased risk of other abdominal/pelvic cancers (endometrial, ovarian, stomach, small bowel, hepatobiliary)"}]}]},{"nombre":"Farmacología","codigo":"fa","temas":[{"slug":"antagonistas-muscarinicos","titulo":"Antagonistas muscarínicos","items":[{"n":"1","nombre":"Motorcycle parking spots","ver":"Espacios de estacionamiento para motocicletas marcados M1, M2, M3.","clinica":"Los receptores muscarínicos de acetilcolina (M1, M2, M3).","sketchy":"Los espacios \"M1, M2, M3\" son la clave literal directa de los tres subtipos de receptor muscarínico.","literal":"muscarinic acetylcholine receptors (M1, M2, M3)"},{"n":"2","nombre":"Reversing into motorcycle parking spot","ver":"Un vehículo retrocediendo (reversing) hacia el espacio de estacionamiento.","clinica":"Los antagonistas muscarínicos bloquean reversiblemente los receptores muscarínicos.","sketchy":"El acto de \"retroceder\" (reversing) representa el bloqueo reversible de los receptores.","literal":"muscarinic antagonists reversibly block muscarinic receptors"},{"n":"3","nombre":"Blocked tweedleDUMBBELLS","ver":"Un personaje levantando pesas (dumbbells) bloqueado en su movimiento.","clinica":"Los antagonistas muscarínicos bloquean los efectos muscarínicos de diarrea, micción, miosis, broncoespasmo, bradicardia, lagrimeo y salivación.","sketchy":"\"tweedleDUMBBELLS\" con las letras resaltadas D-U-M-B-B-E-L-S deletrea el acrónimo mnemotécnico DUMBBELS (diarrea, urination, miosis, bradicardia, bronchospasm, excitation, lacrimation, salivation).","literal":"muscarinic antagonists block the muscarinic effects of diarrhea, urination, miosis, bradycardia, bronchospasm, lacrimation, salivation"},{"n":"4","nombre":"Blocked acetyl-cola bottle","ver":"Una botella de refresco \"Acetyl-Cola\" bloqueada.","clinica":"Los antagonistas muscarínicos bloquean la acción de la acetilcolina en los receptores M.","sketchy":"\"Acetyl-Cola\" suena como \"acetylcholine\", siendo la botella bloqueada la clave mnemotécnica.","literal":"antimuscarinics block the action of acetylcholine at M receptors"},{"n":"5","nombre":"Alice","ver":"El personaje de Alicia sentada en la mesa del té.","clinica":"Atropina (antimuscarínico).","sketchy":"\"Alice\" es el nombre elegido como clave mnemotécnica del personaje central de Alicia en el País de las Maravillas, escenario base de \"atropina\" (relacionada con Atropa belladonna).","literal":"atropine (antimuscarinic)"},{"n":"6","nombre":"Alice holding belladonna flower","ver":"Alicia sosteniendo una flor.","clinica":"La atropina y alcaloides antimuscarínicos relacionados se encuentran en la flor Atropa belladonna (\"Deadly Nightshade\").","sketchy":"La flor sostenida por Alicia representa literalmente la planta Atropa belladonna, origen de la atropina.","literal":"Atropine and related antimuscarinic alkaloids are found in the flower Atropa belladonna ('Deadly Nightshade')"},{"n":"7","nombre":"Jimson Weed Tea","ver":"Una etiqueta de té que dice \"Jimson Weed Tea\" sobre la mesa.","clinica":"La atropina y alcaloides antimuscarínicos relacionados se encuentran en la planta Datura stramonium (\"Jimsonweed\").","sketchy":"La etiqueta \"Jimson Weed\" es la clave literal directa de la planta Datura stramonium.","literal":"Atropine and related antimuscarinic alkaloids are found in the plant Datura stramonium ('Jimsonweed')"},{"n":"8","nombre":"Large pupil gazing into the distance","ver":"Un personaje con una pupila muy dilatada mirando a la distancia.","clinica":"Los antimuscarínicos causan dilatación pupilar (midriasis) y cicloplejia (incapacidad de acomodar el cristalino para visión cercana).","sketchy":"La pupila grande \"mirando a la distancia\" (incapaz de enfocar cerca) representa la midriasis y cicloplejia.","literal":"antimuscarinics cause pupillary dilation (mydriasis) and cycloplegia (inability to accommodate the lens for near vision)"},{"n":"9","nombre":"TeleSCOPE","ver":"Un telescopio (SCOPE) sostenido por un personaje.","clinica":"Escopolamina (antimuscarínico).","sketchy":"\"TeleSCOPE\" con \"SCOPE\" resaltado es la clave literal directa de \"SCOPolamine\".","literal":"scopolamine (antimuscarinic)"},{"n":"10","nombre":"Seasick sailor outfit","ver":"Un traje de marinero mareado (seasick).","clinica":"La escopolamina se usa para tratar el mareo por movimiento (náusea vestibular).","sketchy":"El traje de \"marinero mareado\" representa directamente la náusea vestibular tratada.","literal":"scopolamine is used to treat motion sickness (vestibular nausea)"},{"n":"11","nombre":"Eyepatch","ver":"Un parche colocado detrás de la oreja de un personaje.","clinica":"El parche transdérmico de escopolamina se usa para tratar el mareo por movimiento.","sketchy":"El parche detrás de la oreja representa directamente la vía transdérmica de administración.","literal":"scopolamine transdermal patch is used to treat motion sickness"},{"n":"12","nombre":"CNS hat","ver":"Un sombrero etiquetado \"CNS\" que lleva puesto un personaje.","clinica":"Los antimuscarínicos (ej. escopolamina) cruzan la barrera hematoencefálica e inhiben los receptores M1 centrales.","sketchy":"El sombrero \"CNS\" (sobre la cabeza) representa directamente el sistema nervioso central.","literal":"antimuscarinics (e.g., scopolamine) cross the blood-brain barrier and inhibits central M1 receptors"},{"n":"13","nombre":"Heart with jewel nodes","ver":"Un corazón con nodos brillantes tipo joya.","clinica":"Los antimuscarínicos bloquean la activación parasimpática de los receptores M2 en los nodos SA y AV (aumento de frecuencia cardíaca, aumento de conducción AV).","sketchy":"Los nodos brillantes en el corazón representan los nodos SA y AV, sitios de acción de los receptores M2.","literal":"antimuscarinics block parasympathetic activation of M2 receptors on the SA and AV nodes (increased heart rate, increased AV conduction)"},{"n":"14","nombre":"Elevated heart watch","ver":"Un reloj con forma de corazón elevado.","clinica":"Los antimuscarínicos (ej. atropina) aumentan la frecuencia cardíaca (útil en el tratamiento de bradicardia).","sketchy":"El reloj \"elevado\" representa el aumento de la frecuencia cardíaca (medida en el tiempo).","literal":"antimuscarinics (e.g. atropine) increase heart rate (useful in the treatment of bradycardia)"},{"n":"15","nombre":"Heart shield","ver":"Un escudo con forma de corazón.","clinica":"Bloqueo cardíaco (bloqueo auriculoventricular).","sketchy":"El \"escudo\" (shield) sobre el corazón representa literalmente el \"heart block\".","literal":"heart block (atrioventricular block)"},{"n":"16","nombre":"Falling heart shields","ver":"Escudos con forma de corazón cayendo.","clinica":"Los antimuscarínicos (ej. atropina) aumentan la conducción AV (útil en el tratamiento del bloqueo cardíaco).","sketchy":"Los escudos \"cayendo\" representan la resolución del bloqueo cardíaco.","literal":"antimuscarinics (e.g. atropine) increase AV conduction (useful in the treatment of heart block)"},{"n":"17","nombre":"Cat-ipra-tio-tropillar","ver":"Una oruga (caterpillar) fumando una pipa de agua, sentada en un hongo.","clinica":"Ipratropio y tiotropio (antagonistas muscarínicos M3).","sketchy":"\"Cat-IPRA-TIO-tropillar\" combina \"caterpillar\" (oruga) con las sílabas \"IPRA\" y \"TIO\", deletreando ambos fármacos: ipratropIO y tiotropIO.","literal":"ipratropium and tiotropium (M3 muscarinic antagonists)"},{"n":"18","nombre":"Puffing","ver":"La oruga expulsando humo/vapor de la pipa.","clinica":"El ipratropio y el tiotropio son broncodilatadores antimuscarínicos inhalados.","sketchy":"El \"soplar/inhalar\" (puffing) humo representa directamente la vía inhalada de administración.","literal":"ipratropium and tiotropium are inhaled antimuscarinic bronchodilators"},{"n":"19","nombre":"Blue bloater with pink puffer","ver":"Dos personajes: uno azulado e hinchado, otro rosado con dificultad respiratoria.","clinica":"El ipratropio y el tiotropio son útiles en el manejo de la EPOC (antagonizan receptores M3 → broncodilatación, secreciones disminuidas).","sketchy":"\"Blue bloater\" y \"pink puffer\" son los apodos clásicos de los dos fenotipos de EPOC.","literal":"ipratropium and tiotropium are useful in the management of COPD (antagonize M3 receptors → bronchodilation, decreased secretions)"},{"n":"20","nombre":"Long lasting TIO smoke rings","ver":"Anillos de humo (smoke rings) etiquetados \"TIO\" que duran mucho tiempo en el aire.","clinica":"El tiotropio se disocia más lentamente del receptor M3 (acción broncodilatadora más prolongada).","sketchy":"Los anillos de humo \"de larga duración\" representan la disociación más lenta y el efecto prolongado del tiotropio.","literal":"tiotropium dissociates more slowly from the M3 receptor (longer bronchodilator action)"},{"n":"21","nombre":"Ox butler","ver":"Un buey vestido de mayordomo (butler) sirviendo en la mesa.","clinica":"Oxibutinina (antagonista muscarínico M3).","sketchy":"\"Ox butler\" (buey mayordomo) suena fonéticamente como \"oxybutynin\".","literal":"oxybutynin (M3 muscarinic antagonist)"},{"n":"22","nombre":"Turning off bladder","ver":"Un mayordomo apagando/cerrando un recipiente con forma de vejiga.","clinica":"La oxibutinina y la tolterodina tratan la incontinencia (antagonizan receptores M3 → relajan el músculo liso en uréteres y pared vesical).","sketchy":"\"Apagar la vejiga\" representa la relajación del músculo liso vesical que trata la incontinencia.","literal":"oxybutynin and tolterodine treat incontinence (antagonize M3 receptors → relax smooth muscle in ureters and bladder wall)"},{"n":"23","nombre":"Turtle butler","ver":"Una tortuga vestida de mayordomo sirviendo en la mesa.","clinica":"Tolterodina (antagonista muscarínico M3).","sketchy":"\"Turtle\" (tortuga) suena fonéticamente similar al inicio de \"tolterodine\".","literal":"tolterodine (M3 muscarinic antagonist)"},{"n":"24","nombre":"CENTER over M1","ver":"Un cartel \"Parking Center\" ubicado sobre el espacio marcado M1.","clinica":"Los receptores M1 muscarínicos se encuentran en el sistema nervioso central (SNC).","sketchy":"\"CENTER\" sobre el espacio M1 representa el sistema nervioso \"central\".","literal":"M1 muscarinic receptors are found in the CNS"},{"n":"25","nombre":"PARKING over M1","ver":"El cartel \"Parking Center\" completo sobre el espacio M1.","clinica":"Los antagonistas del receptor M1 pueden reducir el temblor y la rigidez en la enfermedad de Parkinson.","sketchy":"\"PARKING\" suena fonéticamente como \"Parkinson\", clave mnemotécnica directa.","literal":"M1 receptor antagonists can reduce tremors and rigidity in Parkinson's disease"},{"n":"26","nombre":"Benz parked in M1","ver":"Un auto marca \"BENZ\" estacionado en el espacio M1.","clinica":"Benztropina (antagonista muscarínico M1 de acción central).","sketchy":"\"Benz\" es la clave fonética directa para \"benztropine\".","literal":"benztropine (centrally acting M1 muscarinic antagonist)"},{"n":"27","nombre":"Tri-hex car parked in M1","ver":"Un auto etiquetado \"TRI HEX\" estacionado en el espacio M1.","clinica":"Trihexifenidilo (antagonista muscarínico M1 de acción central).","sketchy":"\"Tri-Hex\" es la clave fonética directa para \"triHEXyphenidyl\".","literal":"trihexyphenidyl (centrally acting M1 muscarinic antagonist)"},{"n":"28","nombre":"Shaking antenna","ver":"Una antena temblorosa sobre uno de los vehículos.","clinica":"Los antimuscarínicos de acción central (ej. benztropina, trihexifenidilo) tratan el temblor y la rigidez en el Parkinson (bloquean la actividad colinérgica excesiva).","sketchy":"La antena \"temblando\" representa directamente el temblor parkinsoniano.","literal":"centrally acting antimuscarinics (e.g., benztropine, trihexyphenidyl) treat tremor and rigidity in Parkinson's (block excess cholinergic activity)"},{"n":"29","nombre":"Cogwheel","ver":"Un engranaje/rueda dentada (cogwheel) en el cartel del estacionamiento.","clinica":"La activación excesiva de M1 se asocia con rigidez en rueda dentada (cogwheel rigidity) en el Parkinson.","sketchy":"La rueda dentada es la representación literal directa de la \"cogwheel rigidity\".","literal":"excessive M1 activation is associated with cogwheel rigidity in Parkinson's disease"},{"n":"30","nombre":"Falling \"extra parking\" cone","ver":"Un cono de \"Extra Parking\" cayendo.","clinica":"Los antimuscarínicos tratan los efectos secundarios extrapiramidales causados por antipsicóticos (ej. distonía, acatisia, parkinsonismo; reestablecen el balance dopaminérgico-colinérgico).","sketchy":"\"EXTRA\" en el cono es la clave literal directa para \"EXTRApyramidal\", y su caída marca la resolución del efecto adverso.","literal":"antimuscarinics treat extrapyramidal side effects caused by antipsychotics: e.g. dystonia, akathisia, parkinsonism (re-establish dopaminergic-cholinergic balance)"},{"n":"31","nombre":"Hot as a hare","ver":"Un conejo (hare) con aspecto acalorado en la mesa del té.","clinica":"Los antimuscarínicos inhiben los receptores M3 en las glándulas sudoríparas → disminución de la sudoración → hipertermia.","sketchy":"\"Hot as a hare\" es la mnemotecnia clásica del toxíndrome anticolinérgico, representada literalmente por la liebre acalorada.","literal":"antimuscarinics inhibit M3 receptors on sweat glands → decreased sweating → hyperthermia"},{"n":"32","nombre":"Dry as a cracker","ver":"Galletas secas (crackers) sobre la mesa del té.","clinica":"Los antimuscarínicos disminuyen la salivación y el lagrimeo → boca y ojos secos.","sketchy":"\"Dry as a cracker\" (seco como una galleta) es la variante mnemotécnica de \"dry as a bone\", representada por las galletas secas.","literal":"antimuscarinics decrease salivation and lacrimation → dry mouth and eyes"},{"n":"33","nombre":"Blind as a bat","ver":"Un murciélago (bat) volando cerca de la mesa del té.","clinica":"Los antimuscarínicos causan midriasis y cicloplejia → visión borrosa.","sketchy":"\"Blind as a bat\" (ciego como un murciélago) es la mnemotecnia clásica del toxíndrome anticolinérgico.","literal":"antimuscarinics cause mydriasis and cycloplegia → blurred vision"},{"n":"34","nombre":"High-pressure as a kettle","ver":"Una tetera (kettle) hirviendo bajo presión sobre la mesa.","clinica":"Los antimuscarínicos causan midriasis → disminución del drenaje del humor acuoso → glaucoma agudo de ángulo cerrado.","sketchy":"La tetera \"a alta presión\" representa el aumento de presión intraocular del glaucoma de ángulo cerrado.","literal":"antimuscarinics cause mydriasis → decreased outflow of aqueous humor → acute angle closure glaucoma"},{"n":"35","nombre":"Mad as a hatter","ver":"El Sombrerero Loco (Mad Hatter) en la mesa del té.","clinica":"Los antimuscarínicos cruzan la barrera hematoencefálica y antagonizan los receptores M1 centrales → sedación, agitación, alucinaciones, coma (especialmente en pacientes ancianos).","sketchy":"\"Mad as a hatter\" (loco como un sombrerero) es la mnemotecnia clásica final del toxíndrome anticolinérgico, personificada literalmente.","literal":"antimuscarinics cross the BBB and antagonize central M1 receptors → sedation, agitation, hallucination, coma (especially in elderly patients)"}]},{"slug":"anticuerpos-monoclonales","titulo":"Terapia con anticuerpos monoclonales","items":[{"n":"1","nombre":"Coronation ritual","ver":"Un obispo coronando a un rey arrodillado en el centro del salón medieval.","clinica":"Rituximab (anticuerpo monoclonal antitumoral).","sketchy":"El \"ritual\" de coronación suena como el inicio de \"rituximab\", siendo la ceremonia la clave mnemotécnica del fármaco.","literal":"rituximab (antitumor monoclonal antibody)"},{"n":"2","nombre":"Chimera sigil","ver":"Un estandarte con el emblema de una quimera (león mezclado con otras bestias) sobre la capa del rey.","clinica":"El rituximab y el cetuximab son anticuerpos monoclonales quiméricos.","sketchy":"La quimera, criatura hecha de partes de distintos animales, representa literalmente el anticuerpo quimérico (parte ratón, parte humano).","literal":"rituximab and cetuximab are chimeric monoclonal antibodies"},{"n":"3","nombre":"Pulling down antibody archer","ver":"Un soldado tirando hacia abajo a un arquero que lleva el símbolo de anticuerpo en su uniforme.","clinica":"El rituximab depleta células B (se une a CD20).","sketchy":"Los arqueros (que disparan flechas = anticuerpos) representan las células B; derribarlos marca la depleción.","literal":"rituximab depletes B cells (binds CD20)"},{"n":"4","nombre":"Grabbing \"XX\" straps","ver":"Un soldado agarrando las correas cruzadas en forma de \"XX\" del pecho del arquero.","clinica":"El rituximab se une a CD20 en las células B.","sketchy":"\"XX\" son 20 en números romanos, siendo la clave numérica directa de CD20.","literal":"rituximab binds CD20 on B-cells"},{"n":"5","nombre":"Chronic tapestry with antibody archers and T knights","ver":"Un tapiz colgado que muestra arqueros con símbolo de anticuerpo y caballeros con cruces en el escudo.","clinica":"El rituximab trata la leucemia linfocítica crónica (LLC).","sketchy":"El tapiz antiguo representa lo \"crónico\", y los arqueros (células B) junto a los caballeros T marcan los linfocitos implicados.","literal":"rituximab treats chronic lymphocytic leukemia (CLL)"},{"n":"6","nombre":"Rheumatic lantern","ver":"Una linterna roja colgante con la forma de una articulación deformada.","clinica":"El rituximab trata la artritis reumatoide (fármaco antirreumático modificador de la enfermedad - DMARD).","sketchy":"La articulación deformada e inflamada en la linterna representa directamente la artritis reumatoide.","literal":"rituximab treats rheumatoid arthritis (disease modifying antirheumatic drug - DMARD)"},{"n":"7","nombre":"Torn antibody","ver":"Una linterna con el símbolo de anticuerpo (Y) roto o desgarrado.","clinica":"El rituximab es útil para terapia inmunosupresora (ej. poliangeítis microscópica, granulomatosis de Wegener).","sketchy":"El anticuerpo roto representa la supresión de la respuesta inmune mediada por anticuerpos.","literal":"Rituximab is useful for immunosuppressive therapy (e.g. microscopic polyangiitis, Wegener's granulomatosis)"},{"n":"8","nombre":"Immunosuppressed cane","ver":"Un bastón sostenido por una figura encorvada junto al rey.","clinica":"El rituximab puede causar inmunosupresión y aumento del riesgo de infección.","sketchy":"El bastón es el símbolo fijo de Sketchy para el paciente inmunocomprometido.","literal":"Rituximab can cause immunosuppression and increased risk of infection"},{"n":"9","nombre":"White laurel leaves","ver":"Una corona de laurel blanca sobre la cabeza del rey coronado.","clinica":"El rituximab puede asociarse con un riesgo aumentado de leucoencefalopatía multifocal progresiva (PML).","sketchy":"El laurel blanco sobre la cabeza es el mismo símbolo usado en el Sketchy de poliomavirus JC para las lesiones blancas cerebrales de la PML.","literal":"rituximab may be associated with a higher risk of progressive multifocal leukoencephalopathy (PML)"},{"n":"10","nombre":"Swollen cherub with ivy","ver":"Un querubín hinchado y enrojecido, rodeado de hiedra, en el vitral de la ventana.","clinica":"Los anticuerpos monoclonales pueden causar reacción a la infusión (ej. cefalea, fiebre, rash cutáneo, prurito, disnea, hipotensión).","sketchy":"La hiedra (\"ivy\") suena como \"IV\" y el querubín hinchado y rojo representa la reacción a la infusión intravenosa.","literal":"monoclonal antibodies can cause an infusion reaction (e.g. headache, fever, skin rash, pruritus, dyspnea, hypotension)"},{"n":"11","nombre":"Delayed onset poisoning","ver":"El rey tocándose el pecho con gesto de malestar tardío tras beber.","clinica":"Los anticuerpos quiméricos (ej. rituximab) pueden causar enfermedad del suero (ej. fiebre, rash, artralgia dentro de 7-10 días).","sketchy":"El envenenamiento \"de inicio tardío\" representa la latencia de 7-10 días de la enfermedad del suero.","literal":"chimeric antibodies (e.g. rituximab) can cause serum sickness (e.g. fever, rash, arthralgia within 7-10 days)"},{"n":"12","nombre":"Tusks","ver":"Un elefante grande con colmillos prominentes en el centro-derecha de la escena.","clinica":"Cetuximab (anticuerpo monoclonal antitumoral).","sketchy":"\"Tusks\" (colmillos) suena como el final de \"cetuximab\", siendo el elefante la clave mnemotécnica.","literal":"cetuximab (monoclonal antitumor antibody)"},{"n":"13","nombre":"Giraffe","ver":"Jirafas bordadas en la manta que cubre el lomo del elefante.","clinica":"El cetuximab se une al receptor del factor de crecimiento epidérmico (EGFR).","sketchy":"La jirafa, con su cuello largo que \"crece\", es el símbolo fijo de Sketchy para el factor de crecimiento epidérmico (EGFR).","literal":"cetuximab binds the epidermal growth factor receptor (EGFR)"},{"n":"14","nombre":"Tire swing","ver":"Un columpio hecho con una llanta colgando de una cuerda, junto al elefante.","clinica":"El EGFR es un receptor tirosina quinasa.","sketchy":"\"Tire\" (llanta) suena como el inicio de \"tyrosine\", siendo el columpio la clave mnemotécnica de la tirosina quinasa.","literal":"EGFR is a receptor tyrosine kinase"},{"n":"15","nombre":"Cracked crab","ver":"Un cangrejo cocido y agrietado servido en un plato sobre la mesa del banquete.","clinica":"El cetuximab trata tumores sólidos (ej. cáncer colorrectal, carcinoma de células escamosas).","sketchy":"El cangrejo es el símbolo universal de cáncer en Sketchy, y estar \"agrietado/roto\" marca el tumor tratado.","literal":"cetuximab treats solid tumors (e.g. colorectal cancer, squamous cell carcinoma)"},{"n":"16","nombre":"Red spots","ver":"Manchas rojas salpicadas sobre la manta de jirafas del elefante.","clinica":"El cetuximab puede causar un rash acneiforme papulopustular.","sketchy":"Las manchas rojas representan directamente el rash acneiforme característico de este fármaco.","literal":"cetuximab can cause a papulopustular acneiform rash"},{"n":"17","nombre":"Delayed onset poisoning","ver":"Una copa dorada siendo servida junto al elefante, con gesto de malestar posterior.","clinica":"Los anticuerpos quiméricos (raramente el cetuximab) pueden causar enfermedad del suero (ej. fiebre, rash, artralgia dentro de 7-10 días).","sketchy":"El mismo símbolo del envenenamiento tardío se repite aquí para el cetuximab, por ser también quimérico.","literal":"chimeric antibodies (rarely cetuximab) can cause serum sickness (e.g. fever, rash, arthralgia within 7-10 days)"},{"n":"18","nombre":"Beverage lady","ver":"Una mujer revolviendo un caldero de líquido rojo en la cocina, a la izquierda.","clinica":"Bevacizumab (anticuerpo monoclonal antitumoral).","sketchy":"\"Beverage\" (bebida) suena como el inicio de \"bevacizumab\", siendo la mujer de las bebidas la clave mnemotécnica.","literal":"bevacizumab (monoclonal antitumor antibody)"},{"n":"19","nombre":"Chopped vegetables","ver":"Verduras picadas sobre una tabla de cortar en la cocina.","clinica":"El bevacizumab se une a VEGF.","sketchy":"\"Vegetables\" (verduras) suena como el inicio de \"VEGF\", siendo el picado la clave mnemotécnica.","literal":"bevacizumab binds VEGF"},{"n":"20","nombre":"Chopping vessels","ver":"Un cocinero cortando alimentos con forma de vasos sanguíneos tubulares.","clinica":"El bevacizumab inhibe el crecimiento de vasos sanguíneos en los tumores (se une a VEGF).","sketchy":"Cortar los \"vasos\" representa literalmente la inhibición de la formación de vasos sanguíneos tumorales.","literal":"bevacizumab inhibits growth of blood vessels in tumors (binds VEGF)"},{"n":"21","nombre":"Cracked crab","ver":"Un cangrejo rojo agrietado sobre la mesa de la cocina.","clinica":"El bevacizumab trata tumores metastásicos (ej. cáncer colorrectal, cáncer de pulmón).","sketchy":"El cangrejo, símbolo de cáncer, marca los tumores tratados por este fármaco.","literal":"bevacizumab treats metastatic tumors (e.g. colorectal cancer, lung cancer)"},{"n":"22","nombre":"Wet center of retina pillow","ver":"Una persona sosteniendo un pan/almohada redonda con el centro húmedo y hundido.","clinica":"El bevacizumab trata la degeneración macular húmeda.","sketchy":"El centro húmedo de la forma redonda (retina) representa la degeneración macular \"húmeda\" (wet).","literal":"bevacizumab treats wet macular degeneration"},{"n":"23","nombre":"Blood spatter","ver":"Salpicaduras de sangre sobre el delantal blanco del cocinero.","clinica":"El bevacizumab puede causar sangrado.","sketchy":"Las salpicaduras de sangre son la representación literal del efecto adverso hemorrágico.","literal":"bevacizumab can cause bleeding"},{"n":"24","nombre":"Ice clots","ver":"Una jarra con líquido rosado y trozos de hielo flotando dentro.","clinica":"El bevacizumab aumenta el riesgo de eventos trombóticos.","sketchy":"Los trozos de hielo dentro del líquido representan los coágulos formándose en el torrente sanguíneo.","literal":"bevacizumab increases the risk for thrombotic events"},{"n":"25","nombre":"Perforating colon bag","ver":"Una ristra de embutidos con forma de colon, perforada y goteando.","clinica":"El bevacizumab puede causar perforación gastrointestinal.","sketchy":"El embutido-colon perforado es la representación literal de la perforación GI.","literal":"bevacizumab can cause GI perforation"},{"n":"26","nombre":"Alms","ver":"Un mendigo sosteniendo un cuenco con la palabra \"ALMS\" (limosnas) escrita.","clinica":"Alemtuzumab (anticuerpo monoclonal antitumoral).","sketchy":"\"Alms\" suena como el inicio de \"alemtuzumab\", siendo el cuenco de limosnas la clave mnemotécnica.","literal":"alemtuzumab (monoclonal antitumor antibody)"},{"n":"27","nombre":"Pulling down antibody archer and T knight","ver":"Un soldado derribando tanto a un arquero con símbolo de anticuerpo como a un caballero con cruz.","clinica":"El alemtuzumab depleta células B y T (se une a CD52).","sketchy":"A diferencia del rituximab (solo arqueros/células B), aquí caen ambos: arquero y caballero T, marcando la depleción doble.","literal":"alemtuzumab depletes B and T cells (binds CD52)"},{"n":"28","nombre":"52 pattern","ver":"Un patrón de naipes con el número 52 en el uniforme del soldado.","clinica":"El alemtuzumab se une a CD52 en células B y T.","sketchy":"El 52 (como las cartas de una baraja) es la clave numérica directa de CD52.","literal":"alemtuzumab binds CD52 on B and T cells"},{"n":"29","nombre":"Chronic tapestry with antibody archers and T knights","ver":"Un segundo tapiz colgado a la derecha con arqueros de anticuerpo y caballeros T.","clinica":"El alemtuzumab trata la leucemia linfocítica crónica (LLC).","sketchy":"El mismo tapiz \"crónico\" del rituximab se repite, marcando que ambos fármacos tratan la LLC.","literal":"alemtuzumab treats chronic lymphocytic leukemia (CLL)"},{"n":"30","nombre":"Tapestry weaver","ver":"Una mujer sentada tejiendo un tapiz en un telar, a la derecha de la escena.","clinica":"Trastuzumab (anticuerpo monoclonal antitumoral).","sketchy":"\"Tapestry\" (tapiz) suena como el inicio de \"trastuzumab\", siendo la tejedora la clave mnemotécnica.","literal":"trastuzumab (monoclonal antitumor antibody)"},{"n":"31","nombre":"Her 2 babies","ver":"Dos bebés asomando dentro de un columpio de llanta, junto a la tejedora.","clinica":"El trastuzumab se une al receptor 2 del factor de crecimiento epidérmico (HER2, c-erbB2).","sketchy":"\"Her 2 babies\" (sus 2 bebés) es la clave mnemotécnica literal de HER2.","literal":"trastuzumab binds epidermal growth factor receptor 2 (HER2, c-erbB2)"},{"n":"32","nombre":"Tire swing","ver":"El columpio de llanta del que cuelgan los dos bebés.","clinica":"El HER2 es un receptor tirosina quinasa.","sketchy":"La llanta (\"tire\") vuelve a marcar \"tyrosine kinase\", igual que con el EGFR.","literal":"HER2 is a receptor tyrosine kinase"},{"n":"33","nombre":"Crab bra","ver":"La tejedora vistiendo un corpiño con forma de cangrejo sobre el pecho.","clinica":"El trastuzumab trata el cáncer de mama HER2 positivo.","sketchy":"El cangrejo (cáncer) situado sobre el pecho marca directamente el cáncer de mama.","literal":"trastuzumab treats HER2 positive breast cancer"},{"n":"34","nombre":"Unraveling heart","ver":"Un corazón tejido deshilachándose y desarmándose en el borde del tapiz.","clinica":"El trastuzumab puede causar cardiotoxicidad (ej. disminución de la FEVI, insuficiencia cardíaca).","sketchy":"El corazón que se deshace representa directamente el deterioro de la función cardíaca.","literal":"trastuzumab can cause cardiotoxicity (e.g. decreased LVEF, heart failure)"}],"mapa":"imagenes/anticuerpos-monoclonales-mapa.webp","texto":"imagenes/anticuerpos-monoclonales-texto.webp"},{"slug":"antiemeticos","titulo":"Antieméticos","items":[{"n":"1","nombre":"Solitary track runner","ver":"Un corredor solitario en la pista de atletismo.","clinica":"El núcleo del tracto solitario (NTS, o centro del vómito) se ubica en el bulbo raquídeo, y recibe entradas del tracto GI, el sistema vestibular y el área postrema.","sketchy":"\"Solitary\" (solitario) es la clave mnemotécnica literal para \"nucleus tractus SOLITARIUS\".","literal":"the nucleus tractus solitarius (NTS, or vomiting center) located in the medulla, receives inputs from the GI tract, vestibular system, and area postrema"},{"n":"2","nombre":"Vomiting on track","ver":"Un corredor vomitando sobre la pista.","clinica":"El NTS proyecta neuronas hacia otros núcleos bulbares para coordinar la respuesta del vómito.","sketchy":"El vómito literal sobre la pista representa la respuesta emética coordinada por el NTS.","literal":"the NTS projects neurons to other medullary nuclei to coordinate the vomiting response"},{"n":"3","nombre":"Stomach hammer throw area","ver":"El área de lanzamiento de martillo, con forma de estómago.","clinica":"El tracto GI se comunica directamente con el núcleo del tracto solitario (NTS) vía el nervio vago (nervio craneal X), sin cruzar la barrera hematoencefálica, a través de vías neurales.","sketchy":"El área con forma de \"estómago\" en la zona de lanzamiento de martillo (vago = \"vagabundo\" que recorre distancia) representa la comunicación directa vía el nervio vago.","literal":"GI tract communicates directly with the nucleus tractus solitarius (NTS) via the vagus nerve (cranial nerve X), bypassing the blood-brain barrier through neural pathways"},{"n":"4","nombre":"Vegas sign at the stomach area","ver":"El cartel de \"Welcome to Fabulous Las Vegas\" ubicado en la zona del estómago.","clinica":"Las aferencias vagales desde el tracto GI se comunican con el NTS.","sketchy":"\"Vegas\" suena fonéticamente como \"vagal\", siendo el cartel la clave mnemotécnica directa.","literal":"vagal afferents from the GI tract communicate with the NTS"},{"n":"5","nombre":"Smiley hammer at the stomach area","ver":"Un grupo de pelotas con caritas felices (smiley) apiladas cerca del área de lanzamiento de martillo.","clinica":"La irritación GI (debido a infección, quimioterapia, distensión) causa liberación de serotonina de la mucosa.","sketchy":"Las caritas \"felices\" (smiley) representan la serotonina, hormona asociada a la felicidad, símbolo recurrente de Sketchy.","literal":"GI irritation (due to infection, chemotherapy, distension) causes mucosal serotonin release"},{"n":"6","nombre":"\"1-2-3\" Hammer Throw!","ver":"Un cartel que dice \"1-2-3 Hammer Throws\" junto al atleta lanzando el martillo.","clinica":"La serotonina activa los receptores 5HT-3 en las aferencias vagales.","sketchy":"El conteo \"1-2-3\" es la clave numérica directa para el receptor \"5HT-3\".","literal":"serotonin activates 5HT-3 receptors on the vagal afferents"},{"n":"7","nombre":"Semicircular canal","ver":"Un cartel elevado que dice \"Semicircular Canal\".","clinica":"Los canales semicirculares del sistema vestibular envían información vía el nervio vestibular (una rama del nervio craneal VIII) hacia los núcleos vestibulares en el tronco encefálico.","sketchy":"El cartel literal \"Semicircular Canal\" nombra directamente la estructura vestibular.","literal":"semicircular canals of the vestibular system send information via the vestibular nerve (a branch of CN VIII) to the vestibular nuclei in the brainstem"},{"n":"8","nombre":"Vests at the semicircular canal","ver":"Remeros con chalecos (vests) navegando bajo el cartel del canal semicircular.","clinica":"El nervio vestibulococlear (CN VIII) desde el sistema vestibular se comunica con el NTS.","sketchy":"Los \"vests\" (chalecos) suenan como \"vestibular/vestibulococlear\", clave fonética del nervio craneal VIII.","literal":"the vestibulocochlear nerve (CN VIII) from the vestibular system communicates with the NTS"},{"n":"9","nombre":"Seasick at the canal","ver":"Los remeros con aspecto de mareo (seasick) navegando por el canal.","clinica":"El sistema vestibular es responsable del vértigo y la náusea por movimiento (motion sickness).","sketchy":"El \"mareo marino\" (seasick) de los remeros representa directamente la náusea vestibular.","literal":"the vestibular system is responsible for vertigo and motion sickness (vestibular nausea)"},{"n":"10","nombre":"Extreme postures on the pommel horse next to the track","ver":"Un gimnasta en posturas extremas sobre un potro con forma de estómago, junto a un cartel \"Extreme Posture\".","clinica":"El área postrema (zona gatillo quimiorreceptora) se ubica adyacente al NTS (fuera de la barrera hematoencefálica en el cuarto ventrículo) y responde a sustancias emetógenas (agentes quimioterapéuticos).","sketchy":"Las posturas \"extremas\" fuera de lo normal representan estar \"fuera\" de la barrera hematoencefálica.","literal":"the area postrema (chemoreceptor trigger zone) is located adjacent to the NTS (outside the BBB in the 4th ventricle) and responds to emetogenic substances (chemotherapeutic agents)"},{"n":"11","nombre":"Ribbon dancer blocking the hammer throw","ver":"Una gimnasta con cinta (ribbon) bloqueando el área de lanzamiento de martillo.","clinica":"El ondansetrón antagoniza el receptor 5-HT3 en las aferencias vagales del tracto GI (trata el vómito inducido por quimioterapia o posoperatorio).","sketchy":"La cinta \"bloqueando\" el lanzamiento representa el antagonismo del receptor 5-HT3.","literal":"Ondansetron antagonizes 5-HT3 receptor on vagal afferents in the GI tract (treats chemo-induced or post-op vomiting)"},{"n":"12","nombre":"Hammer tightening gut","ver":"Un martillo apretando/estrechando una estructura con forma de intestino.","clinica":"El ondansetrón puede causar estreñimiento.","sketchy":"El \"apretar\" el intestino con el martillo representa directamente el estreñimiento.","literal":"ondansetron can cause constipation"},{"n":"13","nombre":"Hammer hitting head","ver":"Un martillo golpeando la cabeza de un personaje.","clinica":"El ondansetrón puede causar cefalea y mareo.","sketchy":"El golpe del martillo en la cabeza representa directamente la cefalea.","literal":"Ondansetron can cause headache and dizziness"},{"n":"14","nombre":"Twisted torsade's streamer","ver":"Una cinta/serpentina retorcida ondeando en el aire.","clinica":"El ondansetrón puede prolongar el intervalo QT e inducir torsades de pointes.","sketchy":"La cinta \"retorcida\" (twisted) es la representación literal de \"torsades\" (torsión).","literal":"ondansetron can prolong the QT interval and induce torsades"},{"n":"15","nombre":"Pile of smiley faces","ver":"Un montón de pelotas con caritas felices apiladas.","clinica":"El ondansetrón puede causar síndrome serotoninérgico (síntomas incluyen rigidez, temblor, hipertermia, confusión).","sketchy":"El montón de \"caritas felices\" (serotonina) representa el exceso serotoninérgico causante del síndrome.","literal":"Ondansetron can cause serotonin syndrome (symptoms include rigidity, tremor, hyperthermia, confusion)"},{"n":"16","nombre":"Allergy inducing, Q shaped dandelions","ver":"Dientes de león con forma de \"Q\" que provocan alergia (estornudos).","clinica":"El sistema vestibular contiene receptores de histamina H1 (acoplados a Gq).","sketchy":"Los dientes de león \"que provocan alergia\" representan la histamina, y la forma \"Q\" marca la proteína Gq acoplada.","literal":"the vestibular system contains H1 histamine receptors (coupled to Gq)"},{"n":"17","nombre":"Bee swatters","ver":"Matamoscas usados contra abejas.","clinica":"Los bloqueadores H1 de primera generación (difenhidramina, meclizina) tratan la náusea vestibular (mareo por movimiento).","sketchy":"\"Bee\" (abeja = histamina) siendo \"golpeada/bloqueada\" (swatter) representa el bloqueo de los receptores H1.","literal":"1st generation H1 receptor blockers (diphenhydramine, meclizine) treat vestibular nausea (motion sickness)"},{"n":"18","nombre":"M1 motorcycle parking","ver":"Motocicletas estacionadas en un espacio marcado \"M1\".","clinica":"El sistema vestibular contiene receptores muscarínicos M1.","sketchy":"El estacionamiento marcado \"M1\" es la clave directa del receptor muscarínico M1.","literal":"the vestibular system contains M1 muscarinic receptors"},{"n":"19","nombre":"Telescope","ver":"Un catalejo/telescopio sostenido por uno de los atletas.","clinica":"La escopolamina (agonista muscarínico) trata la náusea vestibular (mareo por movimiento).","sketchy":"\"Telescope\" suena fonéticamente similar al inicio de \"scopolamine\".","literal":"scopolamine (muscarinic agonist) treats vestibular nausea (motion sickness)"},{"n":"20","nombre":"Seasick Sailor outfits","ver":"Trajes de marinero mareado que visten los remeros.","clinica":"El mareo por movimiento (náusea vestibular) se trata con antagonistas H1 de primera generación (difenhidramina) y escopolamina.","sketchy":"El traje de \"marinero mareado\" representa directamente el mareo por movimiento tratado.","literal":"motion sickness (vestibular nausea) is treated with 1st generation H1 antagonists (diphenhydramine) and scopolamine"},{"n":"21","nombre":"Extreme posture 2 D-Ring ropes","ver":"Dos cuerdas con anillas en forma de \"D\" en el área de posturas extremas.","clinica":"El área postrema contiene receptores D2.","sketchy":"Las anillas en forma de \"D\" son la clave literal directa del receptor D2.","literal":"the area postrema contains D2 receptors"},{"n":"22","nombre":"Tickler blocking the D-rings","ver":"Un objeto/personaje bloqueando las anillas en forma de D.","clinica":"La metoclopramida antagoniza los receptores D2 en el área postrema (trata el vómito inducido por quimioterapia).","sketchy":"El bloqueo de las anillas \"D\" representa directamente el antagonismo del receptor D2.","literal":"metoclopramide antagonizes D2 receptors in the area postrema (treats chemotherapy induced vomiting)"},{"n":"23","nombre":"Contracted stomach","ver":"Un estómago contraído/apretado en la escena.","clinica":"La metoclopramida tiene efectos procinéticos en el tracto GI superior (aumento de peristalsis esofágica, disminución de presión del esfínter esofágico inferior y vaciamiento gástrico mejorado) (útil en tratamiento de vaciamiento gástrico retardado por trastornos posquirúrgicos y gastroparesia diabética).","sketchy":"El estómago \"contraído\" representa el efecto procinético que aumenta la motilidad gástrica.","literal":"metoclopramide has upper GI prokinetic effects (increased esophageal peristalsis, decreased lower esophagus sphincter pressure, and enhanced gastric emptying) (useful for treatment of delayed gastric emptying due to post-surgical disorders and diabetic gastroparesis)"},{"n":"24","nombre":"\"Do not obstruct\"","ver":"Un cartel que dice \"Do not obstruct\" (Landing Area).","clinica":"La metoclopramida (antagonista D2) está contraindicada en obstrucción de intestino delgado.","sketchy":"El cartel \"no obstruir\" es la clave literal directa de la contraindicación.","literal":"metoclopramide (D2 Antagonist) is contraindicated in small bowel obstruction"},{"n":"25","nombre":"Mud puddle","ver":"Un charco de lodo en el suelo.","clinica":"La metoclopramida puede causar diarrea (efectos procinéticos).","sketchy":"El \"charco de lodo\" representa directamente la diarrea.","literal":"metoclopramide can cause diarrhea (prokinetic effects)"},{"n":"26","nombre":"Sleeping judge","ver":"Un juez durmiendo en el área de \"judging\" (jueces).","clinica":"La metoclopramida puede causar somnolencia, especialmente en ancianos.","sketchy":"El juez \"durmiendo\" representa la somnolencia como efecto adverso.","literal":"Metoclopramide can cause drowsiness, especially in the elderly"},{"n":"27","nombre":"Crying coach","ver":"Un entrenador/juez llorando en la escena.","clinica":"La metoclopramida puede causar depresión (bloqueo D2 central).","sketchy":"El llanto representa directamente la depresión.","literal":"metoclopramide can cause depression (central D2 blockade)"},{"n":"28","nombre":"EXTRA pyramidal newspaper hat","ver":"Un sombrero de papel periódico con la etiqueta \"EXTRA\" en la cabeza de uno de los personajes.","clinica":"La metoclopramida puede causar efectos extrapiramidales debido al bloqueo D2 central (distonía, acatisia, parkinsonismo).","sketchy":"\"EXTRA\" en el sombrero es la clave literal directa para \"EXTRApyramidal\".","literal":"metoclopramide can cause extrapyramidal effects due to central D2 blockade (dystonia, akathisia, parkinsonian features)"},{"n":"29","nombre":"Sticking out tongue","ver":"Un personaje sacando la lengua de forma involuntaria y repetitiva.","clinica":"La metoclopramida puede causar discinesia tardía con uso crónico (bloqueo D2 central), especialmente en ancianos.","sketchy":"El movimiento involuntario de la lengua representa directamente la discinesia tardía.","literal":"metoclopramide can cause tardive dyskinesia with chronic use (central D2 blockade), especially in the elderly"},{"n":"30","nombre":"Now More Spicy chicken","ver":"Un cartel de comida rápida \"Now More Spicy\" con un pollo.","clinica":"La metoclopramida (agonista D2, sic) puede causar síndrome neuroléptico maligno (síntomas incluyen fiebre, rigidez, cambios de estado mental, inestabilidad autonómica, rabdomiólisis).","sketchy":"Lo \"picante\" (spicy) representa la fiebre del síndrome neuroléptico maligno.","literal":"metoclopramide (D2 agonist) can cause neuroleptic malignant syndrome (symptoms include fever, rigidity, mental status changes, autonomic instability, rhabdomyolysis)"},{"n":"31","nombre":"Elevated milk release","ver":"Leche derramándose/elevándose en la escena.","clinica":"La metoclopramida puede causar niveles elevados de prolactina (bloqueo D2 central), llevando a ginecomastia, amenorrea y disminución del deseo sexual.","sketchy":"La \"leche\" elevada representa directamente la hiperprolactinemia.","literal":"metoclopramide can cause elevated prolactin levels (central D2 blockade), leading to gynecomastia, amenorrhea, and decreased sexual drive"},{"n":"32","nombre":"Twisted torsade's streamer","ver":"Una segunda cinta retorcida ondeando en el aire.","clinica":"La metoclopramida puede causar prolongación del QT e inducir torsades de pointes.","sketchy":"Mismo símbolo de la cinta retorcida usado para el ondansetrón, ahora aplicado a metoclopramida.","literal":"metoclopramide can cause QT prolongation and induce torsades"},{"n":"33","nombre":"plaNK1 pommel horse","ver":"Un potro de gimnasia con la etiqueta \"plaNK1\".","clinica":"El área postrema contiene receptores de neurokinina 1 (NK1) (activados por sustancia P).","sketchy":"\"NK1\" resaltado en \"plaNK1\" es la clave literal directa del receptor NK1.","literal":"the area postrema contains neurokinin 1 (NK1) receptors (activated by substance P)"},{"n":"34","nombre":"Substance Pee check","ver":"Un cartel que dice \"All Participants Substance Pee Check\".","clinica":"La sustancia P se une a los receptores NK1 en el área postrema.","sketchy":"\"Substance Pee\" suena como \"Substance P\", clave fonética directa.","literal":"substance P binds to the NK1 receptors in the area postrema"},{"n":"35","nombre":"\"participants\"","ver":"El grupo de \"participantes\" reunidos en la zona de control de sustancias.","clinica":"El aprepitant antagoniza los receptores NK1 en el área postrema (trata el vómito inducido por quimioterapia).","sketchy":"\"Participants\" (participantes) suena fonéticamente similar a \"aprepitant\".","literal":"aprepitant antagonizes the NK1 receptors in the area postrema (treats chemotherapy induced vomiting)"}]},{"slug":"macrolidos","titulo":"Macrólidos","items":[{"n":"1","nombre":"Crow","ver":"Un cuervo negro posado sobre la armadura, en el centro de la escena gótica.","clinica":"Macrólidos (ej. eritromicina, azitromicina, claritromicina y fidaxomicina).","sketchy":"El cuervo (\"crow\") es el símbolo fijo de los macrólidos en toda la serie, y la escena entera es un homenaje a Edgar Allan Poe.","literal":"Macrolides (e.g., erythromycin, azithromycin, clarithromycin, and fidaxomicin)"},{"n":"2","nombre":"Ribosomal typewriters","ver":"Máquinas de escribir antiguas colocadas sobre la mesa y cajas de la escena.","clinica":"Los macrólidos se unen a la subunidad ribosomal 50S → previenen la translocación ribosomal → inhiben la síntesis proteica.","sketchy":"La máquina de escribir representa el ribosoma \"escribiendo\" proteínas; bloquearla detiene la síntesis proteica.","literal":"Macrolides bind the 50S ribosomal subunit → prevent ribosomal translocation → inhibit protein synthesis"},{"n":"3","nombre":"Paper jam","ver":"Papel atascado y arrugado saliendo de la máquina de escribir.","clinica":"Los macrólidos son antibióticos bacterioSTÁTICOS (excepto la fidaxomicina, que es bactericida).","sketchy":"El atasco de papel detiene la máquina sin destruirla: representa el efecto bacteriostático (frena el crecimiento, no mata).","literal":"Macrolides are bacterioSTATIC antibiotics (except for fidaxomicin, which is bactericidal)"},{"n":"4","nombre":"Candle snuffer","ver":"Un apagavelas dorado sobre la mesa, apagando la llama de una vela.","clinica":"Los macrólidos disminuyen la inflamación respiratoria, lo que los hace agentes útiles para prevenir exacerbaciones y/o infecciones en enfermedad pulmonar crónica (ej. EPOC, fibrosis quística y bronquiectasias).","sketchy":"Apagar la llama representa apagar la inflamación (el fuego es el símbolo fijo de inflamación en Sketchy).","literal":"Macrolides decrease respiratory inflammation, which makes them useful agents for preventing flare-ups and/or infections in chronic lung disease (e.g., COPD, CF, and bronchiectasis)"},{"n":"5","nombre":"Poopy puddle","ver":"Un charco marrón en el suelo de madera, cerca de la silla.","clinica":"Los macrólidos aumentan la motilidad gastrointestinal (es decir, son agentes procinéticos GI).","sketchy":"El charco representa el efecto procinético: aceleran el tránsito intestinal, con diarrea como efecto adverso.","literal":"Macrolides increase gastrointestinal motility (i.e., GI prokinetic agent)"},{"n":"6","nombre":"Rainbow spectrum","ver":"Un arcoíris entrando por la ventana gótica e iluminando la habitación.","clinica":"Los macrólidos son antimicrobianos de amplio espectro (incluyendo gram-positivos, gram-negativos y atípicos).","sketchy":"El arcoíris (\"spectrum\") es la representación literal del amplio espectro de cobertura.","literal":"Macrolides are broad spectrum antimicrobials (including gram-positives, gram-negatives, and atypicals)"},{"n":"7","nombre":"Rusty chest plate","ver":"Una armadura medieval con el peto oxidado y manchado, de pie junto a la ventana.","clinica":"La azitromicina y la claritromicina tratan la neumonía adquirida en la comunidad (causada por Streptococcus pneumoniae, Haemophilus influenzae, Moraxella catarrhalis).","sketchy":"El peto (chest plate) oxidado sobre el tórax representa la infección pulmonar (neumonía).","literal":"Azithromycin and clarithromycin treat community acquired pneumonia (caused by Streptococcus pneumoniae, Haemophilus influenzae, Moraxella catarrhalis)"},{"n":"8","nombre":"Legion of ships + Clam Lady","ver":"Barcos visibles a través de la ventana y una mujer de pie sobre una concha marina, tipo el nacimiento de Venus.","clinica":"La azitromicina trata la neumonía atípica causada por Legionella y Chlamydia.","sketchy":"La \"legión\" de barcos es la clave de Legionella, y la dama de la concha (\"clam\") la de Chlamydia.","literal":"Azithromycin treats atypical pneumonia caused by Legionella and Chlamydia"},{"n":"9","nombre":"Mycoplasma mic","ver":"Un hombre sosteniendo un micrófono antiguo cerca de la ventana.","clinica":"La azitromicina trata Mycoplasma pneumoniae (neumonía atípica o \"walking pneumonia\").","sketchy":"\"Mic\" (micrófono) es la clave mnemotécnica fija de Mycoplasma.","literal":"Azithromycin treats Mycoplasma pneumonia (walking pneumonia)"},{"n":"10","nombre":"Pertussi board","ver":"Un tablero de juego sobre la mesa etiquetado \"Pertussi\".","clinica":"Los macrólidos están indicados para el tratamiento de Bordetella pertussis (tos ferina).","sketchy":"El nombre \"Pertussi\" en el tablero es la clave literal de Bordetella pertussis.","literal":"Macrolides are indicated for treatment of Bordetella pertussis (whooping cough)"},{"n":"11","nombre":"PPX shield on pertussi board","ver":"Un escudo con las letras \"PPX\" en el centro del tablero de Pertussi.","clinica":"Los macrólidos pueden usarse como profilaxis para Bordetella pertussis en contactos cercanos.","sketchy":"\"PPX\" es la abreviatura de \"prophylaxis\", y el escudo refuerza la idea de protección preventiva.","literal":"Macrolides can be used for prophylaxis for Bordetella pertussis in close contacts"},{"n":"12","nombre":"Bart the leopard","ver":"Un leopardo disecado junto a la chimenea, a la izquierda de la escena.","clinica":"La azitromicina se usa para tratar infecciones por Bartonella henselae (enfermedad por arañazo de gato).","sketchy":"\"Bart\" (el leopardo) es la clave de Bartonella, y al ser un felino recuerda el arañazo de gato.","literal":"Azithromycin is used to treat Bartonella henselae infections (cat-scratch fever)"},{"n":"13","nombre":"Babe the vampiress ghost","ver":"Un fantasma femenino con colmillos de vampiro flotando en el centro de la escena.","clinica":"La azitromicina se usa con atovacuona para tratar la infección por Babesia.","sketchy":"\"Babe\" es la clave de Babesia, y los colmillos de vampiro aluden a que este parásito destruye glóbulos rojos.","literal":"Azithromycin is used with atovaquone to treat Babesia infection"},{"n":"14","nombre":"Minotaur bull","ver":"Un mi
