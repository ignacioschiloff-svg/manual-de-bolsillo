psuladas.","literal":"Wiskott-Aldrich syndrome increases susceptibility to ENCAPSULATED BACTERIA (Strep pneumo, H. influenzae, N. meningitidis) because clearance requires antibodies (→ recurrent otitis media, sinusitis, pneumonia, meningitis)"},{"n":"9","nombre":"Viral lanterns","ver":"Linternas con forma viral colgando de las telarañas cerca de la puerta verde.","clinica":"El síndrome de Wiskott-Aldrich aumenta la susceptibilidad a infecciones VIRALES (CMV, varicela zóster).","sketchy":"Las \"linternas virales\" representan directamente las infecciones virales.","literal":"Wiskott-Aldrich syndrome increases susceptibility to VIRAL infections (CMV, Varicella zoster)"},{"n":"10","nombre":"Fungal mushrooms","ver":"Hongos (mushrooms) creciendo en la escena.","clinica":"El síndrome de Wiskott-Aldrich aumenta la susceptibilidad a infecciones FÚNGICAS (candida, PJP).","sketchy":"Los \"hongos\" representan directamente las infecciones fúngicas.","literal":"Wiskott-Aldrich syndrome increases susceptibility to FUNGAL infections (candida, PJP)"},{"n":"11","nombre":"Small \"GaMes\" sign","ver":"Un letrero pequeño que dice \"GaMes\" en la tienda.","clinica":"En el síndrome de Wiskott-Aldrich, la IgG y la IgM séricas están BAJAS a NORMALES.","sketchy":"\"GaMes\" con \"G\" y \"M\" resaltadas es la clave literal directa de IgG e IgM.","literal":"in Wiskott-Aldrich syndrome, serum IgG & IgM are LOW to NORMAL"},{"n":"12","nombre":"Elevated \"EAt\" sign","ver":"El letrero grande \"EAT\" elevado sobre la tienda.","clinica":"En el síndrome de Wiskott-Aldrich, la IgA e IgE séricas están ELEVADAS.","sketchy":"\"EAt\" con \"A\" y \"E\" resaltadas es la clave literal directa de IgA e IgE, y su posición \"elevada\" representa los niveles aumentados.","literal":"in Wiskott-Aldrich syndrome, serum IgA & IgE are ELEVATED"},{"n":"13","nombre":"\"Hyper coMics\"","ver":"El letrero de la tienda \"Hyper coMics\" con \"M\" resaltada.","clinica":"Síndrome de Hiper-IgM (inmunodeficiencia primaria combinada de células B y T → infecciones virales, fúngicas, bacterianas encapsuladas).","sketchy":"\"Hyper coMics\" con \"M\" resaltada es la clave literal directa de \"Hyper-IgM\".","literal":"Hyper-IgM syndrome (combined B and T cell primary immunodeficiency → viral, fungal, encapsulated bacterial infections)"},{"n":"14","nombre":"Raised \"M\" cards with fallen \"A\" \"G\" \"E\"","ver":"Un niño levantando cartas marcadas \"M\", mientras otras letras \"A\", \"G\", \"E\" caen al suelo.","clinica":"En el síndrome de Hiper-IgM, las células B producen IgM pero NO IgG, IgA, o IgE (porque las células B son incapaces de cambiar de isotipo).","sketchy":"La carta \"M\" levantada (producida) y las cartas \"A\", \"G\", \"E\" cayendo (no producidas) representan directamente el defecto de cambio de isotipo.","literal":"in Hyper-IgM syndrome, B cells produce IgM but NOT IgA, IgG, or IgE (because B cells are unable to switch isotypes)"},{"n":"15","nombre":"Cracked glass over \"40 thieves\" poster","ver":"Vidrio agrietado sobre un póster de \"Alibaba and the 40 Thieves\".","clinica":"El síndrome de Hiper-IgM es causado por una mutación en el gen que codifica el LIGANDO CD40 en las células T ayudadoras → las células B son incapaces de unirse a las células T ayudadoras (requiere CD40) → sin cambio de isotipo de células B.","sketchy":"\"40 thieves\" con \"40\" resaltado es la clave literal directa de \"CD40\", y el vidrio \"agrietado\" representa la mutación/falla en la unión.","literal":"Hyper-IgM syndrome is caused by a mutation in the gene encoding CD40 LIGAND on helper T cells → B cells unable to bind helper T cells (requires CD40) → no B cell isotype switching"},{"n":"16","nombre":"Boy receding behind \"X\" door","ver":"El mismo niño retrocediendo detrás de la puerta marcada \"X\".","clinica":"El síndrome de Hiper-IgM es X-linked recesivo.","sketchy":"Repite el símbolo de la puerta \"X\" para el patrón de herencia X-linked recesivo.","literal":"Hyper-IgM syndrome is X-LINKED recessive"},{"n":"17","nombre":"\"X-GERM\" hand sanitizer","ver":"Un dispensador de gel antibacterial etiquetado \"X-GERM\" en la tienda de cómics.","clinica":"En el síndrome de Hiper-IgM, el tejido linfoide carece de centros GERMINALES (normalmente el sitio de proliferación, diferenciación y cambio de isotipo de células B maduras).","sketchy":"\"GERM\" en \"X-GERM\" es la clave literal directa de \"germinal centers\" (centros germinales).","literal":"in Hyper-IgM syndrome, lymphoid tissue lacks GERMINAL centers (normally the site of mature B cell proliferation, differentiation, and isotype switching)"},{"n":"18","nombre":"SKID marks","ver":"Marcas de derrape (skid marks) en el asfalto tras el choque de autos.","clinica":"Inmunodeficiencia Combinada Severa (SCID) (constelación de síndromes que resultan en inmunodeficiencia primaria combinada severa de células B y T → infecciones virales, fúngicas, bacterianas encapsuladas).","sketchy":"\"SKID marks\" con \"SKID\" resaltado es la clave fonética directa de \"SCID\".","literal":"Severe Combined ImmunoDeficiency (SCID) (constellation of syndromes resulting in severe combined B and T cell primary immunodeficiency → viral, fungal, encapsulated bacterial infections)"},{"n":"19","nombre":"Boy receding behind \"X\" bike","ver":"Un niño retrocediendo detrás de una bicicleta marcada con una \"X\".","clinica":"Mutación X-LINKED recesiva en receptores de citoquinas (incluyendo IL-7) (la causa más común de SCID).","sketchy":"La bicicleta marcada \"X\" y el niño \"retrocediendo\" representan el patrón de herencia X-linked recesivo más común.","literal":"X-LINKED recessive mutation in cytokine receptors (including IL-7) (most common cause of SCID)"},{"n":"20","nombre":"Holding back \"11-7\" soda","ver":"Alguien sosteniendo/reteniendo una lata de soda etiquetada \"11-7\".","clinica":"Las mutaciones en interleucina-7 (IL-7) llevan a DISMINUCIÓN del número de células B y T MADURAS → SCID.","sketchy":"\"11-7\" en la lata es la clave numérica literal directa de \"IL-7\" (interleucina 7), y \"sostenerla\" representa la disminución de su función.","literal":"mutations in interleukin-7 (IL-7) lead to DECREASED numbers of MATURE B and T cells → SCID"},{"n":"21","nombre":"Receding behind car","ver":"Un personaje retrocediendo/escondiéndose detrás del auto accidentado.","clinica":"Mutación AUTOSÓMICA recesiva en ADA (causa SCID).","sketchy":"\"Retroceder\" (receding = recessive) detrás del auto representa el patrón de herencia autosómico recesivo.","literal":"AUTOSOMAL recessive mutation in ADA (causes SCID)"},{"n":"22","nombre":"Beat-up bADAss plate & purine logo","ver":"Una placa de auto dañada que dice \"bADAss\" junto a un logo con forma de purina.","clinica":"Las mutaciones en Adenosina Deaminasa (ADA) llevan a metabolismo ANORMAL de PURINAS → DISMINUCIÓN de células B y T → SCID.","sketchy":"\"bADAss\" con \"ADA\" resaltado es la clave literal directa de \"Adenosine Deaminase\", y el logo de \"purina\" representa el metabolismo de purinas afectado.","literal":"mutations in Adenosine Deaminase (ADA) lead to abnormal PURINE metabolism → DECREASED B and T cells → SCID"},{"n":"23","nombre":"Spilling antibody keys","ver":"Llaves con forma de anticuerpo derramándose en la escena del choque.","clinica":"En SCID, TODOS los tipos de inmunoglobulinas están BAJOS (el SPEP muestra un pico mínimo en la región de gammaglobulina) porque las células B maduras están ausentes.","sketchy":"Las \"llaves de anticuerpo derramándose\" (perdiéndose) representan la ausencia/bajo nivel de todas las inmunoglobulinas.","literal":"in SCID, ALL types of immunoglobulins are LOW (SPEP displays minimal peak in gamma globulin region) because mature B cells are absent"},{"n":"24","nombre":"Scratched-up T-3IRD logo","ver":"El logo del auto \"T-3IRD\" (Thunderbird) rayado/dañado.","clinica":"En SCID, las células T están BAJAS a ausentes (la citometría de flujo muestra un pico mínimo de CD3 [CD3 es marcador de todas las células T maduras]).","sketchy":"\"T-3IRD\" con \"T\" y \"3\" resaltados es la clave literal directa de \"células T\" y \"CD3\", y el logo \"rayado/dañado\" representa su nivel bajo o ausente.","literal":"in SCID, T cells are LOW to absent (flow cytometry displays minimal CD3 peak [CD3 is marker on ALL mature T cells])"},{"n":"25","nombre":"Fallen \"THYME\" cookbook","ver":"Un libro de cocina titulado \"Cooking with Thyme\" caído en el suelo.","clinica":"SCID se presenta con hipoplasia TÍMICA (debido a la ausencia de células T maduras).","sketchy":"\"THYME\" suena fonéticamente similar a \"THYMIC\" (tímica).","literal":"SCID presents with THYMIC hypoplasia (due to absent mature T cells)"},{"n":"26","nombre":"Jolly roger with torn right-sided triangular sail","ver":"Una bandera pirata (Jolly Roger) con una vela triangular rasgada en el lado derecho.","clinica":"SCID se presenta con una sombra tímica AUSENTE en radiografía (normalmente vista en infantes como una \"VELA TRIANGULAR\" a la derecha del mediastino).","sketchy":"La \"vela triangular rasgada/rota\" a la derecha representa literalmente la ausencia de la sombra tímica normal.","literal":"SCID presents with an ABSENT thymic shadow on X-ray (normally seen in infants as a TRIANGULAR SAIL to the right of mediastinum)"},{"n":"27","nombre":"\"X-GERM\" hand sanitizer","ver":"Otro dispensador \"X-GERM\" en la escena del choque.","clinica":"En SCID, el tejido linfoide carece de centros GERMINALES (normalmente el sitio de agregación de células B).","sketchy":"Repite \"GERM\" para los centros germinales, ahora en el contexto de SCID.","literal":"in SCID, lymphoid tissue lacks GERMINAL centers (normally the site of B cell aggregation)"},{"n":"28","nombre":"Tipped over ATM","ver":"Un cajero automático (ATM) volcado/caído en la escena.","clinica":"Ataxia-Telangiectasia (inmunodeficiencia primaria combinada de células B y T → principalmente susceptibilidad a bacterias encapsuladas → infecciones sinopulmonares recurrentes).","sketchy":"\"ATM\" en el cajero es la clave literal directa del gen ATM (Ataxia Telangiectasia Mutated).","literal":"Ataxia-Telangiectasia (combined B and T cell primary immunodeficiency → primarily encapsulated bacteria susceptibility → recurrent sinopulmonary infections)"},{"n":"29","nombre":"Receding behind ATM","ver":"Un personaje retrocediendo/escondiéndose detrás del cajero volcado.","clinica":"La Ataxia-Telangiectasia es causada por una mutación AUTOSÓMICA recesiva en el gen Ataxia Telangiectasia Mutated (ATM).","sketchy":"\"Retroceder\" detrás del ATM representa el patrón de herencia autosómico recesivo.","literal":"Ataxia-Telangiectasia is caused by AUTOSOMAL recessive mutation in Ataxia Telangiectasia Mutated (ATM) gene"},{"n":"30","nombre":"Broken surveillance camera & damaged double helical wires","ver":"Una cámara de seguridad (surveillance camera) rota y cables con forma de doble hélice dañados.","clinica":"Las mutaciones en ATM llevan a vigilancia (surveillance) ALTERADA del daño al ADN → deficiencia de células B y T.","sketchy":"La \"cámara de vigilancia rota\" representa literalmente la vigilancia alterada, y los \"cables de doble hélice dañados\" el ADN dañado.","literal":"mutations in ATM lead to impaired surveillance of DNA damage → B and T cell deficiency"},{"n":"31","nombre":"Unbalanced body","ver":"Un cuerpo/personaje desequilibrado (unbalanced) cayendo en la escena.","clinica":"La Ataxia-Telangiectasia se presenta con ataxia (debido a atrofia cerebelosa).","sketchy":"El \"cuerpo desequilibrado\" representa literalmente la ataxia.","literal":"Ataxia-Telangiectasia presents with ataxia (due to cerebellar atrophy)"},{"n":"32","nombre":"Disorganized red wires","ver":"Cables rojos desorganizados/enredados cerca del cajero.","clinica":"La Ataxia-Telangiectasia se presenta con telangiectasias en la piel (dilataciones capilares anormales).","sketchy":"Los \"cables rojos desorganizados\" representan literalmente las telangiectasias (dilataciones capilares visibles).","literal":"Ataxia-Telangiectasia presents with telangiectasias in the skin (abnormal capillary dilatations)"},{"n":"33","nombre":"Scratched-out \"T\"","ver":"Una letra \"T\" tachada/rayada en la escena.","clinica":"En la Ataxia-Telangiectasia, las células T están BAJAS.","sketchy":"La \"T tachada\" representa directamente el nivel bajo de células T.","literal":"in Ataxia-Telangiectasia, T cells are LOW"},{"n":"34","nombre":"Falling \"A\"","ver":"Una letra \"A\" cayendo en la escena.","clinica":"En la Ataxia-Telangiectasia, la IgA sérica está BAJA (porque las células B son incapaces de cambiar de isotipo a IgA).","sketchy":"La \"A cayendo\" representa directamente el nivel bajo de IgA.","literal":"in Ataxia-Telangiectasia, serum IgA is LOW (because B cells are unable to isotype switch to IgA)"},{"n":"35","nombre":"\"Alf's Fresh Produce\" in high window","ver":"El letrero de la tienda \"Alf's Fresh Produce\" visible en una ventana alta.","clinica":"En la Ataxia-Telangiectasia, la alfa-fetoproteína (AFP) sérica está ELEVADA.","sketchy":"\"Alf's\" suena fonéticamente similar a \"AFP\" (Alpha-FetoProtein), y su posición \"alta\" (high window) representa la elevación del marcador.","literal":"in Ataxia Telangiectasia, serum alpha-fetoprotein (AFP) is ELEVATED"}]}]},{"nombre":"Ginecología","codigo":"gi","temas":[{"slug":"tumores-ovaricos-germinales-estromales","titulo":"Tumores ováricos (células germinales y estromales)","items":[{"n":"1","nombre":"Palpating the ovary basket","ver":"Una mujer palpando/tocando una canasta con forma de ovario.","clinica":"Todos los tipos de tumores ováricos (¡y quistes benignos!) pueden presentarse con una masa anexial palpable.","sketchy":"El gesto de \"palpar\" la canasta-ovario representa literalmente la masa anexial palpable.","literal":"all types of ovarian tumors (and benign cysts!) can present with a palpable adnexal mass"},{"n":"2","nombre":"GERMinating seeds","ver":"Semillas germinando (germinating) en un contenedor etiquetado \"GERMINATING\".","clinica":"Los tumores ováricos de CÉLULAS GERMINALES derivan de células germinales primordiales e incluyen teratomas quísticos, disgerminomas y tumores del saco vitelino.","sketchy":"Las \"semillas germinando\" son la clave literal directa de \"GERM cell\" (célula germinal).","literal":"ovarian GERM CELL tumors derive from primordial germ cells and include cystic teratomas, dysgerminomas, and yolk sac tumors"},{"n":"3","nombre":"Three-layered terrarium","ver":"Un terrario esférico con tres capas visibles (tierra, hierba, dientes/rocas).","clinica":"Los TERATOMAS QUÍSTICOS son usualmente benignos, contienen células de las tres capas germinales (ectodermo, mesodermo y endodermo), y ocurren entre los 10-30 años (TUMOR DE CÉLULAS GERMINALES).","sketchy":"El terrario \"de tres capas\" representa literalmente las tres capas germinales (ectodermo, mesodermo, endodermo).","literal":"CYSTIC TERATOMAS are usually benign, contain cells from three germ layers (ectoderm, mesoderm, and endoderm), and occur in ages 10-30 years (GERM CELL TUMOR)"},{"n":"4","nombre":"Hair grass, glandular tissue, and teeth rocks","ver":"Pasto tipo cabello, tejido glandular y rocas con forma de dientes dentro del terrario.","clinica":"El componente más prominente es el tejido ectodérmico (cabello, glándulas sebáceas y dientes) (en TERATOMAS QUÍSTICOS MADUROS).","sketchy":"El \"pasto-cabello\", el \"tejido glandular\" y las \"rocas-dientes\" representan literalmente los tres tejidos ectodérmicos más prominentes.","literal":"the most prominent component is ectodermal tissue (hair, sebaceous glands, and teeth)(in MATURE CYSTIC TERATOMAS)"},{"n":"5","nombre":"Bright spot","ver":"Un punto brillante visible en el terrario.","clinica":"La calcificación de dientes y hueso causa puntos brillantes en imagenología (en TERATOMAS QUÍSTICOS).","sketchy":"El \"punto brillante\" es la representación literal directa del hallazgo radiológico de calcificación.","literal":"calcification from teeth and bone causes bright spots on imaging (in CYSTIC TERATOMAS)"},{"n":"6","nombre":"Twisting terrarium","ver":"El terrario girando/torciéndose (twisting) sobre su soporte.","clinica":"Los TERATOMAS QUÍSTICOS pueden presentarse con torsión ovárica → dolor abdominal severo.","sketchy":"El terrario \"torciéndose\" representa literalmente la torsión ovárica.","literal":"CYSTIC TERATOMAS can present with ovarian torsion → severe abdominal pain"},{"n":"7","nombre":"\"Shrooma\" ovarii terrarium","ver":"Un terrario etiquetado \"SHROOMA\" con hongos brillantes en su interior.","clinica":"STRUMA OVARII (un subtipo de teratoma quístico) contiene tejido tiroideo funcionante (TUMOR DE CÉLULAS GERMINALES).","sketchy":"\"Shrooma\" suena fonéticamente similar a \"STRUMA\", y los hongos (\"mushrooms\") refuerzan la clave fonética.","literal":"STRUMA OVARII (a cystic teratoma subtype) contain functioning thyroid tissue (GERM CELL TUMOR)"},{"n":"8","nombre":"Hyperthyroid bow tie","ver":"Un gnomo con una corbata de moño (bow tie) en el terrario \"Shrooma\".","clinica":"Los tumores de STRUMA OVARII secretan hormona tiroidea → hipertiroidismo.","sketchy":"El \"bow tie\" alrededor del cuello (zona tiroidea) representa el hipertiroidismo causado por la secreción hormonal.","literal":"STRUMA OVARII tumors secrete thyroid hormone → hyperthyroidism"},{"n":"9","nombre":"Shroom follicles","ver":"Hongos con estructura folicular (follicles) dentro del terrario.","clinica":"En histología, el STRUMA OVARII tiene folículos tiroideos llenos de material eosinofílico.","sketchy":"Los \"folículos de hongo\" representan literalmente los folículos tiroideos vistos en histología.","literal":"on histology, STRUMA OVARII have thyroid follicles filled with eosinophilic material"},{"n":"10","nombre":"Glowing shrooms","ver":"Hongos brillantes/luminosos (glowing) dentro del terrario.","clinica":"El STRUMA OVARII demuestra captación de yodo radioactivo-123.","sketchy":"Los \"hongos brillantes\" representan literalmente la captación de yodo radioactivo (radiactividad = brillo).","literal":"STRUMA OVARII demonstrate uptake of radioactive iodine-123"},{"n":"11","nombre":"Crab terrarium with undifferentiated rocks","ver":"Un terrario con un cangrejo y rocas de aspecto indiferenciado.","clinica":"Los TERATOMAS INMADUROS son malignos y tienen tejidos POBREMENTE DIFERENCIADOS (TUMOR DE CÉLULAS GERMINALES).","sketchy":"El cangrejo (símbolo de cáncer/malignidad) junto a las \"rocas indiferenciadas\" representa el teratoma inmaduro maligno.","literal":"IMMATURE TERATOMAS are malignant and have poorly differentiated tissues (GERM CELL TUMOR)"},{"n":"12","nombre":"DYS-GERMINATOR dishwasher","ver":"Un lavavajillas etiquetado \"DYS-GERMINATOR\" en la cocina.","clinica":"Los DISGERMINOMAS son malignos y ocurren en adolescentes (TUMOR DE CÉLULAS GERMINALES).","sketchy":"\"DYS-GERMINATOR\" con \"GERMIN\" resaltado es la clave literal directa de \"DYSGERMINOMA\".","literal":"DYSGERMINOMAS are malignant and occur in adolescents (GERM CELL TUMOR)"},{"n":"13","nombre":"Sea-man superhero","ver":"Un superhéroe con temática marina (sea-man) en la cocina.","clinica":"Los DISGERMINOMAS son la contraparte de los seminomas testiculares en varones (histología similar).","sketchy":"\"Sea-man\" suena fonéticamente similar a \"SEminoma\", representando la contraparte testicular masculina.","literal":"DYSGERMINOMAS are the counterpart of testicular seminomas in males (similar histology)"},{"n":"14","nombre":"B-hCG babysitter tending yellow flower baby","ver":"Una niñera (babysitter) cuidando a un bebé con cabeza de flor amarilla (girasol).","clinica":"La B-hCG es un marcador tumoral para DISGERMINOMAS.","sketchy":"\"B-hCG babysitter\" es la clave literal directa del marcador tumoral (hCG se usa en pruebas de embarazo, asociado a cuidado de bebés).","literal":"B-hCG is a tumor marker for DYSGERMINOMAS"},{"n":"15","nombre":"Dehydrated LDH milk","ver":"Un envase de leche deshidratada etiquetado \"LDH\" que se vierte en la cocina.","clinica":"La lactato deshidrogenasa (LDH) es un marcador tumoral para DISGERMINOMAS.","sketchy":"El envase etiquetado \"LDH\" es la clave literal directa del marcador tumoral.","literal":"lactate dehydrogenase (LDH) is a tumor marker for DYSGERMINOMAS"},{"n":"16","nombre":"\"Fried eggs\"","ver":"Huevos fritos (fried eggs) en un sartén sobre la estufa.","clinica":"En los DISGERMINOMAS, la histología muestra \"células en huevo frito\" (núcleos centrales grandes con citoplasma claro).","sketchy":"Los \"huevos fritos\" son la representación literal directa del patrón histológico descrito.","literal":"in DYSGERMINOMAS, histology shows \"fried egg cells\" (large central nuclei with clear cytoplasm)"},{"n":"17","nombre":"Egg yolk","ver":"Una yema de huevo (egg yolk) sostenida por una mujer en la cocina.","clinica":"Los tumores del SACO VITELINO (seno endodérmico) son usualmente malignos y ocurren en niñas y mujeres jóvenes (TUMORES DE CÉLULAS GERMINALES).","sketchy":"La \"yema de huevo\" (egg yolk) es la clave literal directa de \"yolk sac\" (saco vitelino).","literal":"YOLK SAC (endodermal sinus) tumors are usually malignant and occur in girls and young women (GERM cell tumors)"},{"n":"18","nombre":"\"Alf's Fresh Produce\"","ver":"El letrero de la tienda \"Alf's Fresh Produce\" con huevos en el mostrador.","clinica":"La alfa-fetoproteína (AFP) es un marcador tumoral para tumores del SACO VITELINO.","sketchy":"\"Alf's\" suena fonéticamente similar a \"AFP\" (Alpha-FetoProtein), símbolo mnemotécnico recurrente.","literal":"α-fetoprotein (AFP) is a tumor marker for YOLK SAC tumors"},{"n":"19","nombre":"Egg chiller","ver":"Un balde etiquetado \"chiller\" lleno de huevos decorados.","clinica":"En los tumores del SACO VITELINO, la histología muestra cuerpos de Schiller-Duval (estructura papilar con un vaso central).","sketchy":"\"Chiller\" suena fonéticamente similar a \"Schiller\", clave directa de los \"cuerpos de Schiller-Duval\".","literal":"in YOLK SAC tumors, histology shows Schiller-Duval bodies (papillary structure with central vessel)"},{"n":"20","nombre":"Egg spots with red center","ver":"Huevos con manchas y un centro rojo (spots with red center) en el balde.","clinica":"Los cuerpos de Schiller-Duval son una estructura papilar con un vaso central.","sketchy":"El \"centro rojo\" (vaso) rodeado de la estructura del huevo representa literalmente la estructura papilar con vaso central.","literal":"Schiller-Duval bodies are papillary structure with a central vessel"},{"n":"21","nombre":"Decorative cords","ver":"Cordones decorativos (decorative cords) colgando en el jardín.","clinica":"Los tumores ováricos del CORDÓN SEXUAL-ESTROMALES incluyen tecoma-fibromas, tumores de células de la granulosa-teca, y tumores de Sertoli-Leydig.","sketchy":"Los \"cordones decorativos\" son la clave literal directa de \"SEX CORD\" (cordón sexual).","literal":"ovarian SEX CORD-STROMAL TUMORS include thecoma-fibromas, granulosa-theca tumors, and sertoli-leydig tumors"},{"n":"22","nombre":"COMBing through hair FIBERS","ver":"Alguien peinando (combing) fibras de cabello en el jardín.","clinica":"Los TECOMA-FIBROMAS son usualmente benignos y se presentan en mujeres perimenopáusicas (TUMOR DE CORDÓN SEXUAL-ESTROMAL).","sketchy":"\"COMBing\" y \"FIBERS\" combinan las claves fonéticas de \"theCOMA-FIBRoma\".","literal":"THECOMA-FIBROMAS are usually benign and present in perimenopausal women (SEX-CORD STROMAL TUMORS)"},{"n":"23","nombre":"\"MY EGGS\"","ver":"Un letrero o expresión que dice \"MY EGGS\" en la escena de decoración de huevos.","clinica":"Los TECOMA-FIBROMAS causan síndrome de Meigs (ascitis, derrame pleural).","sketchy":"\"MY EGGS\" suena fonéticamente similar a \"MEIGS\", clave directa del síndrome.","literal":"THECOMA-FIBROMAS cause Meigs syndrome (ascites, pleural effusion)"},{"n":"24","nombre":"Dilated inner tube","ver":"Un tubo/flotador interior dilatado (dilated inner tube) en la escena.","clinica":"El síndrome de Meigs causa ascitis (TECOMA-FIBROMA).","sketchy":"El \"tubo interior dilatado\" (lleno de líquido) representa literalmente la ascitis.","literal":"Meigs syndrome causes ascites (THECOMA-FIBROMA)"},{"n":"25","nombre":"Wet pleural shirt","ver":"Una camiseta mojada (wet shirt) cerca del pecho de un personaje.","clinica":"El síndrome de Meigs causa derrame pleural (TECOMA-FIBROMA).","sketchy":"La \"camiseta mojada\" (sobre el pecho/pleura) representa literalmente el derrame pleural.","literal":"Meigs syndrome causes pleural effusion (THECOMA-FIBROMA)"},{"n":"26","nombre":"Yellow eggs","ver":"Huevos de color amarillo (yellow eggs) en el mostrador.","clinica":"Los TECOMA-FIBROMAS aparecen amarillos en patología macroscópica debido a las células teca.","sketchy":"Los \"huevos amarillos\" son la representación literal directa del aspecto macroscópico amarillo.","literal":"THECOMA-FIBROMAS appear yellow on gross pathology due to theca cells"},{"n":"27","nombre":"GRANNY","ver":"Una abuela (granny) de pie en la cocina.","clinica":"Los tumores de células de la GRANULOSA-TECA son de bajo grado maligno y pueden ocurrir a cualquier edad (pero usualmente en perimenopausia) (TUMOR DE CORDÓN SEXUAL-ESTROMAL).","sketchy":"\"GRANNY\" suena fonéticamente similar al inicio de \"GRANulosa\", y su edad avanzada representa la perimenopausia.","literal":"GRANULOSA-THECA tumors are low-grade malignant and can occur at any age (but usually in perimenopause) (SEX-CORD STROMAL tumor)"},{"n":"28","nombre":"Estrogen earrings","ver":"Aretes (earrings) que lleva puestos la abuela.","clinica":"Los tumores de GRANULOSA-TECA producen estrógeno (causa pubertad precoz, sangrado, hiperplasia/cáncer endometrial).","sketchy":"Los \"aretes de estrógeno\" representan directamente la producción hormonal del tumor.","literal":"GRANULOSA-THECA tumors produce estrogen (causes precocious puberty, bleeding, endometrial hyperplasia/cancer)"},{"n":"29","nombre":"Young girl with makeup","ver":"Una niña joven maquillándose (with makeup) en la escena.","clinica":"Los tumores de GRANULOSA-TECA pueden causar pubertad precoz debido a la producción de estrógeno.","sketchy":"La \"niña joven maquillándose\" (actuando mayor de su edad) representa literalmente la pubertad precoz.","literal":"GRANULOSA-THECA tumors can cause precocious puberty due to estrogen production"},{"n":"30","nombre":"Spots of red dye on granny","ver":"Manchas de tinte rojo (red dye) en la ropa de la abuela.","clinica":"Los tumores de GRANULOSA-TECA pueden causar sangrado uterino anormal o sangrado posmenopáusico debido a la producción de estrógeno.","sketchy":"Las \"manchas rojas\" en la abuela representan literalmente el sangrado anormal/posmenopáusico.","literal":"GRANULOSA-THECA tumors can cause abnormal uterine bleeding or postmenopausal bleeding due to estrogen production"},{"n":"31","nombre":"Granny INHIBITING inappropriate behavior","ver":"La abuela deteniendo/inhibiendo (inhibiting) el comportamiento de un niño.","clinica":"La INHIBINA es el marcador tumoral para tumores de GRANULOSA-TECA.","sketchy":"\"INHIBITING\" es la clave literal directa de \"INHIBIN\" (inhibina).","literal":"INHIBIN is the tumor marker for GRANULOSA-THECA tumors"},{"n":"32","nombre":"CALLing Exner","ver":"Una nota que dice \"Call Exner\" pegada en la pared de la cocina.","clinica":"En histología, los tumores de GRANULOSA-TECA tienen cuerpos de Call-Exner (células de la granulosa cuboidales en patrón de roseta con centro eosinofílico).","sketchy":"\"CALLing Exner\" es la clave literal directa de \"Call-Exner bodies\".","literal":"on histology, GRANULOSA-THECA tumors have Call-Exner bodies (cuboidal granulosa cells in rosette pattern with eosinophilic center)"},{"n":"33","nombre":"Pink rotary dial with square holes","ver":"Un teléfono de disco rotativo (rotary dial) de color rosa con agujeros cuadrados.","clinica":"Los cuerpos de Call-Exner consisten en tumores de células de la granulosa cuboidales en patrón de roseta con centro eosinofílico.","sketchy":"El \"disco rotativo con agujeros cuadrados\" (patrón de roseta) representa literalmente la disposición celular en roseta.","literal":"Call-Exner bodies consist of cuboidal granulosa tumors in rosette pattern with eosinophilic center"},{"n":"34","nombre":"Coffee cup","ver":"Una taza de café (coffee cup) sostenida por un personaje que llama por teléfono.","clinica":"Las células en los cuerpos de Call-Exner tienen núcleos \"en grano de café\" (en tumores de GRANULOSA-TECA).","sketchy":"La \"taza de café\" (coffee) es la clave literal directa de \"coffee bean nuclei\" (núcleos en grano de café).","literal":"cells in Call-Exner bodies have \"coffee bean\" nuclei (in GRANULOSA-THECA tumors)"},{"n":"35","nombre":"Yellow chick","ver":"Un pollito amarillo (yellow chick) en la escena de la cocina.","clinica":"Los tumores de GRANULOSA-TECA aparecen amarillos en patología macroscópica debido al lípido en las células teca.","sketchy":"El \"pollito amarillo\" representa literalmente el aspecto macroscópico amarillo del tumor.","literal":"GRANULOSA-THECA tumors appear yellow on gross pathology due to lipid in theca cells"},{"n":"36","nombre":"Ladybugs","ver":"Mariquitas (ladybugs) decoradas sobre huevos de Pascua en la mesa.","clinica":"Los tumores de SERTOLI-LEYDIG pueden ser benignos o malignos y ocurren a cualquier edad (pero principalmente en adultos jóvenes) (TUMOR DE CORDÓN SEXUAL ESTROMAL).","sketchy":"\"Ladybugs\" (mariquitas) suena fonéticamente similar al final de \"SERTOLI-LEYDIG\".","literal":"SERTOLI-LEYDIG tumors can be benign or malignant and occur at any age (but primarily in young adults)(SEX-CORD STROMAL tumor)"},{"n":"37","nombre":"Androgen egg holder","ver":"Un sostenedor de huevos (egg holder) sostenido por una mujer.","clinica":"Los tumores de SERTOLI-LEYDIG producen andrógenos (causando hirsutismo, clitoromegalia, cambios de voz).","sketchy":"El \"sostenedor de huevos androgénico\" representa directamente la producción de andrógenos.","literal":"SERTOLI-LEYDIG tumors produce androgens (causing hirsutism, clitoromegaly, voice changes)"},{"n":"38","nombre":"Egg dye mustache","ver":"Un bigote pintado con tinte de huevos (egg dye mustache) en la mujer que decora.","clinica":"Los tumores de SERTOLI-LEYDIG pueden causar hirsutismo debido a la producción de andrógenos.","sketchy":"El \"bigote de tinte\" representa literalmente el hirsutismo (vello facial) causado por los andrógenos.","literal":"SERTOLI-LEYDIG tumors can cause hirsutism due to production of androgens"},{"n":"39","nombre":"TUBULAR egg holders","ver":"Sostenedores de huevos con forma tubular (tubular egg holders) sobre la mesa.","clinica":"En histología, los tumores de SERTOLI-LEYDIG aparecen como estructuras tubulares revestidas por células de Sertoli redondas.","sketchy":"Los \"sostenedores tubulares\" son la representación literal directa de las estructuras tubulares vistas en histología.","literal":"on histology, SERTOLI-LEYDIG tumors appear as tubular structures lined by round Sertoli cells"}]}]},{"nombre":"Parasitología","codigo":"pr","temas":[{"slug":"entamoeba-histolytica","titulo":"Entamoeba histolytica","items":[{"n":"1","nombre":"\"Do not ENTer - HISTorical site\"","ver":"Un cartel de \"Do Not Enter\" y \"Historical Site\" en la entrada de un túnel excavado bajo la ciudad.","clinica":"Entamoeba histolytica (un protozoario intestinal que causa amebiasis).","sketchy":"\"ENTer\" y \"HISTorical\" con las sílabas resaltadas forman fonéticamente \"ENTamoeba HISTolytica\".","literal":"Entamoeba histolytica (an intestinal protozoan that causes amebiasis)"},{"n":"2","nombre":"Bubbles in water","ver":"Burbujas (bubbles) en un charco de agua en la excavación.","clinica":"Entamoeba histolytica existe en dos formas principales: el trofozoíto, que es activo, móvil e invasivo, y el quiste, que es infeccioso, ambientalmente resistente, y se transmite a través de las heces.","sketchy":"Las \"burbujas\" representan las dos formas (activa/quiste) del parásito en el agua.","literal":"Entamoeba histolytica exists in two main forms: the trophozoite, which is active, motile, and invasive, and the cyst, which is infectious, environmentally resistant, and passed through stool"},{"n":"3","nombre":"Drinking bubbly water","ver":"Un excavador bebiendo (drinking) el agua burbujeante (bubbly water) del charco.","clinica":"La amebiasis se adquiere principalmente a través de la ingestión de alimentos o agua contaminados con quistes de Entamoeba histolytica.","sketchy":"El acto de \"beber el agua\" representa directamente la vía de ingestión.","literal":"Amebiasis is primarily acquired through ingestion of food or water contaminated with Entamoeba histolytica cysts"},{"n":"4","nombre":"Holding hands","ver":"Dos excavadores tomados de la mano (holding hands).","clinica":"Entamoeba histolytica puede transmitirse sexualmente a través del contacto anal-oral, ya que el parásito se propaga vía la ruta fecal-oral.","sketchy":"\"Tomarse de las manos\" representa el contacto íntimo/sexual como vía de transmisión.","literal":"Entamoeba histolytica can be transmitted sexually through anal-oral contact, as the parasite is spread via the fecal-oral route"},{"n":"5","nombre":"Right lobe dig site","ver":"Un sitio de excavación (dig site) marcado en el lado derecho de la escena.","clinica":"Una vez dentro del cuerpo, el parásito puede causar amebiasis hepática, siendo la manifestación extraintestinal más común un absceso hepático, típicamente ocurriendo en el lóbulo hepático DERECHO.","sketchy":"El \"sitio de excavación derecho\" representa literalmente el lóbulo hepático derecho afectado.","literal":"Once inside the body, the parasite can cause hepatic amebiasis, with the most common extraintestinal manifestation being a liver abscess, typically occurring in the right hepatic lobe"},{"n":"6","nombre":"Clutching right side","ver":"Un excavador sosteniéndose el lado derecho (clutching right side) del cuerpo con dolor.","clinica":"La presentación clínica de la amebiasis hepática a menudo incluye dolor en cuadrante superior derecho, fiebre, hepatomegalia, malestar general, náuseas, y las pruebas de laboratorio pueden mostrar leucocitosis y enzimas hepáticas elevadas.","sketchy":"El gesto de \"sostenerse el lado derecho\" representa directamente el dolor en cuadrante superior derecho.","literal":"The clinical presentation of hepatic amebiasis often includes right upper quadrant pain, fever, hepatomegaly, malaise, nausea and lab tests may show leukocytosis and elevated liver enzymes"},{"n":"7","nombre":"Anchovy paste truck","ver":"Un camión con un tubo gigante de \"Anchovy Paste\" (pasta de anchoas).","clinica":"Los aspirados de abscesos hepáticos amebianos típicamente tienen una apariencia espesa \"en pasta de anchoas\" (anchovy paste), con el color rojizo-marrón resultante de hepatocitos necróticos; los trofozoítos viables usualmente están ausentes del aspirado y se encuentran en la periferia del absceso.","sketchy":"La \"pasta de anchoas\" es la representación literal directa del aspecto clásico del aspirado del absceso.","literal":"Aspirates from amebic liver abscesses typically have a thick, \"anchovy paste\" appearance, with the reddish-brown color resulting from necrotic hepatocytes; viable trophozoites are usually absent from the aspirate and are found at the periphery of the abscess"},{"n":"8","nombre":"Colon drainage pipe with rust spots","ver":"Una tubería de drenaje con forma de colon (colon drainage pipe) con manchas de óxido (rust spots).","clinica":"La infección por Entamoeba histolytica en el COLON puede causar úlceras que tienen un cuello estrecho en la superficie mucosa y una base más amplia en la submucosa, dándoles su apariencia característica \"en matraz\" (flask); se encuentran más comúnmente en el ciego y colon ascendente pero pueden ocurrir en cualquier parte del intestino grueso.","sketchy":"Las \"manchas de óxido\" en la tubería representan las úlceras en la mucosa colónica.","literal":"Entamoeba histolytica infection in the colon can cause ulcers that have a narrow neck at the mucosal surface and a broader base in the submucosa, giving them their characteristic \"flask\" appearance; most commonly found in the cecum and ascending colon but can occur anywhere in the large intestine"},{"n":"9","nombre":"Flask water bottles","ver":"Botellas de agua con forma de matraz (flask water bottles) sobre la tubería del colon.","clinica":"La presencia de úlceras \"en forma de matraz\" (flask-shaped) es un sello distintivo de la amebiasis invasiva, observable a través de examen histopatológico.","sketchy":"Las \"botellas con forma de matraz\" son la representación literal directa de las úlceras flask-shaped.","literal":"The presence of flask-shaped ulcers is a hallmark of invasive amebiasis, observable through histopathological examination"},{"n":"10","nombre":"Flask in colon pipe","ver":"Un matraz (flask) dentro de la tubería del colon.","clinica":"Una biopsia INTESTINAL puede mostrar lesiones \"en forma de matraz\" (flask-shaped) en la amebiasis intestinal.","sketchy":"El \"matraz dentro de la tubería\" refuerza la lesión flask-shaped en el contexto intestinal.","literal":"Intestinal biopsy may show flask-shaped lesions in intestinal amebiasis"},{"n":"11","nombre":"Red stools","ver":"Heces de color rojo (red stools) en el suelo de la excavación.","clinica":"La diarrea sanguinolenta en amebiasis es el resultado de la ulceración de la mucosa intestinal causada por Entamoeba histolytica, la cual invade la mucosa y submucosa, causando necrosis tisular.","sketchy":"Las \"heces rojas\" son la representación literal directa de la diarrea sanguinolenta.","literal":"Bloody diarrhea in amebiasis is a result of ulceration of the intestinal mucosa caused by Entamoeba histolytica, which invades the mucosa and submucosa, causing tissue necrosis"},{"n":"12","nombre":"\"O&P\" pipe","ver":"Una tubería etiquetada \"O&P\" en la escena de excavación.","clinica":"El diagnóstico de infección por Entamoeba histolytica puede confirmarse identificando quistes (redondos u ovales, conteniendo hasta 4 núcleos, típicamente encontrados en heces formadas) o trofozoítos (etapa móvil y de alimentación, más comúnmente vista en heces líquidas durante infección aguda) en muestras de heces usando un examen de Óvulos y Parásitos (O&P).","sketchy":"\"O&P\" es la clave literal directa del examen \"Ova and Parasite\".","literal":"Diagnosis of Entamoeba histolytica infection can be confirmed by identifying cysts (round or oval, containing up to 4 nuclei, typically found in formed stools) or trophozoites (motile, feeding stage, more commonly seen in liquid stools during acute infection) in stool samples using an Ova and Parasite (O&P) examination"},{"n":"13","nombre":"Trophozoite puddle + red cups","ver":"Un charco (puddle) con vasos rojos (red cups) dispersos alrededor.","clinica":"La presencia de trofozoítos de Entamoeba histolytica conteniendo glóbulos rojos ingeridos en muestras de heces o tejido es diagnóstica de amebiasis invasiva.","sketchy":"Los \"vasos rojos\" representan los glóbulos rojos ingeridos por el trofozoíto, hallazgo diagnóstico de invasión.","literal":"The presence of Entamoeba histolytica trophozoites containing ingested RBCs in stool or tissue samples is diagnostic of invasive amebiasis"},{"n":"14","nombre":"Metro","ver":"Un tren de metro (metro) pasando por el túnel subterráneo.","clinica":"El metronidazol (o tinidazol) es el tratamiento primario para la amebiasis, matando los trofozoítos activos, pero se necesita un agente luminal para eliminar los quistes.","sketchy":"\"Metro\" es la clave fonética directa de \"METROnidazole\".","literal":"Metronidazole (or tinidazole) is the primary treatment for amebiasis, killing active trophozoites, but a luminal agent is needed to clear cysts"},{"n":"15","nombre":"Pair of mice","ver":"Un par de ratones (pair of mice) corriendo cerca del túnel del metro.","clinica":"La paromomicina y el yodoquinol son agentes luminales usados para erradicar los quistes residuales de Entamoeba histolytica del lumen intestinal después del tratamiento con metronidazol o tinidazol.","sketchy":"El \"par de ratones\" (pair) representa los dos agentes luminales (paromomicina y yodoquinol) usados juntos/en combinación.","literal":"Paromomycin and iodoquinol are luminal agents used to eradicate residual Entamoeba histolytica cysts from the intestinal lumen after treatment with metronidazole or tinidazole"},{"n":"16","nombre":"\"Queen Iodo's Tomb\"","ver":"Un letrero que dice \"Queen Iodo's Tomb\" cerca del sitio de excavación.","clinica":"La paromomicina y el yodoquinol son agentes luminales usados para erradicar los quistes residuales de Entamoeba histolytica del lumen intestinal después del tratamiento con metronidazol o tinidazol.","sketchy":"\"Iodo's\" es la clave fonética directa de \"IODOquinol\".","literal":"Paromomycin and iodoquinol are luminal agents used to eradicate residual Entamoeba histolytica cysts from the intestinal lumen after treatment with metronidazole or tinidazole"}]}]}];

const PASOS = [
  ["ver",     "🎨", "Qué se ve"],
  ["clinica", "💡", "Significado clínico"],
  ["sketchy", "🧠", "Cómo lo dice Sketchy"],
  ["literal", "📜", "Texto literal"]
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const plano = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function resaltar(texto, termino) {
  const safe = esc(texto);
  if (!termino) return safe;
  const base = plano(safe), t = plano(termino);
  let out = "", i = 0;
  for (;;) {
    const k = base.indexOf(t, i);
    if (k === -1) { out += safe.slice(i); break; }
    out += safe.slice(i, k) + "<mark>" + safe.slice(k, k + t.length) + "</mark>";
    i = k + t.length;
  }
  return out;
}

const parrafos = (txt, term) =>
  txt.split("\n").filter(Boolean).map(l => `<p>${resaltar(l, term)}</p>`).join("");

function pintarItem(item, termino) {
  const pasos = PASOS.map(([clave, emoji, etiqueta]) => {
    if (!item[clave]) return "";
    const cls = clave === "literal" ? "paso literal" : "paso";
    return `<div class="${cls}"><span class="lbl"><span class="em">${emoji}</span>${etiqueta}</span>${parrafos(item[clave], termino)}</div>`;
  }).join("");
  return `<article class="item" id="it-${esc(item.n)}">
      <div class="item-head"><span class="num">${esc(item.n)}</span><span class="titulo">${resaltar(item.nombre, termino)}</span></div>
      ${pasos}
    </article>`;
}

/* ---------- indice ---------- */

const cont   = document.getElementById("indice");
const chips  = document.getElementById("chips");
const porSlug = {};

DATOS.forEach((parte, i) => {
  const id = "p" + i;

  const a = document.createElement("a");
  a.className = "chip"; a.href = "#" + id; a.dataset.c = parte.codigo;
  a.textContent = parte.nombre;
  chips.appendChild(a);

  const sec = document.createElement("section");
  sec.className = "parte"; sec.id = id; sec.dataset.c = parte.codigo;
  const total = parte.temas.reduce((s, t) => s + t.items.length, 0);
  sec.innerHTML = `<div class="parte-head"><h2>${esc(parte.nombre)}</h2>
      <span class="count">${parte.temas.length} · ${total} elem.</span></div>
    <div class="temas"></div>`;

  const lista = sec.querySelector(".temas");
  parte.temas.forEach(tema => {
    porSlug[tema.slug] = { tema, parte };
    const b = document.createElement("button");
    b.className = "tema-btn";
    b.innerHTML = `<span class="dot"></span>
      <span class="nombre">${esc(tema.titulo)}</span>
      <span class="n">${tema.items.length}</span>
      <span class="ico">${tema.mapa ? "▦" : ""}</span>`;
    b.addEventListener("click", () => abrirTema(tema.slug));
    lista.appendChild(b);
  });

  cont.appendChild(sec);
});

/* ---------- vista de estudio ---------- */

const estudio  = document.getElementById("estudio");
const estTit   = document.getElementById("estTitulo");
const estCnt   = document.getElementById("estCuenta");
const fichas   = document.getElementById("fichas");
const panel    = document.getElementById("panel");
const panelImg = document.getElementById("panelImg");
const seg      = document.getElementById("seg");

let temaActual = null;
let vistaImg = "mapa";
let scrollLista = 0;

function pintarPanel() {
  if (!temaActual) return;
  const hayMapa = !!temaActual.mapa, hayTexto = !!temaActual.texto;
  const botones = seg.querySelectorAll("button");

  botones[0].style.display = hayMapa ? "" : "none";
  botones[1].style.display = hayTexto ? "" : "none";

  if (!hayMapa && !hayTexto) { panel.style.display = "none"; return; }
  panel.style.display = "";

  if (vistaImg === "mapa" && !hayMapa) vistaImg = "texto";
  if (vistaImg === "texto" && !hayTexto) vistaImg = "mapa";

  botones.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === vistaImg)));
  panelImg.src = temaActual[vistaImg];
  panelImg.alt = temaActual.titulo + " — " + (vistaImg === "mapa" ? "mapa numerado" : "hoja de texto");
}

function abrirTema(slug) {
  const reg = porSlug[slug];
  if (!reg) return;
  scrollLista = window.scrollY;
  temaActual = reg.tema;
  vistaImg = reg.tema.mapa ? "mapa" : "texto";

  estudio.dataset.c = reg.parte.codigo;
  estTit.textContent = reg.tema.titulo;
  estCnt.textContent = reg.tema.items.length;
  fichas.innerHTML = reg.tema.items.map(it => pintarItem(it, "")).join("");
  pintarPanel();

  document.body.classList.add("en-estudio");
  document.body.classList.remove("panel-oculto");
  window.scrollTo(0, 0);
  history.pushState({ slug }, "", "#" + slug);
}

function cerrarTema() {
  document.body.classList.remove("en-estudio");
  temaActual = null;
  window.scrollTo(0, scrollLista);
}

document.getElementById("volver").addEventListener("click", () => { history.back(); });

window.addEventListener("popstate", ev => {
  if (ev.state && ev.state.slug) abrirTema(ev.state.slug);
  else cerrarTema();
});

seg.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  vistaImg = b.dataset.k;
  pintarPanel();
});

document.getElementById("btnPlegar").addEventListener("click", ev => {
  const oculto = document.body.classList.toggle("panel-oculto");
  ev.currentTarget.textContent = oculto ? "▼" : "▲";
  ev.currentTarget.title = oculto ? "Mostrar imagen" : "Ocultar imagen";
});

/* ---------- visor ---------- */

const visor = document.getElementById("visor");
const visorImg = document.getElementById("visorImg");

function abrirVisor(src, alt) {
  if (!src) return;
  visorImg.src = src; visorImg.alt = alt || "";
  visor.setAttribute("data-abierto", "");
  document.body.style.overflow = "hidden";
  visor.scrollTop = 0;
  visor.scrollLeft = (visor.scrollWidth - visor.clientWidth) / 2;
}
function cerrarVisor() {
  visor.removeAttribute("data-abierto");
  visorImg.src = "";
  document.body.style.overflow = "";
}

panelImg.addEventListener("click", () => abrirVisor(panelImg.src, panelImg.alt));
document.getElementById("btnZoom").addEventListener("click", () => abrirVisor(panelImg.src, panelImg.alt));
visor.addEventListener("click", ev => {
  if (ev.target === visor || ev.target.id === "visorCerrar") cerrarVisor();
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") {
    if (visor.hasAttribute("data-abierto")) cerrarVisor();
    else if (document.body.classList.contains("en-estudio")) history.back();
  }
});

/* ---------- busqueda ---------- */

const campo  = document.getElementById("q");
const caja   = document.getElementById("wrapBuscar");
const salida = document.getElementById("resultados");

const INDEX = [];
DATOS.forEach(parte => parte.temas.forEach(tema => tema.items.forEach(item => {
  INDEX.push({ parte, tema, item,
    texto: plano([tema.titulo, item.n, item.nombre, item.ver, item.clinica, item.sketchy, item.literal].join(" ")) });
})));

let pendiente;

function buscar() {
  const termino = campo.value.trim();
  caja.classList.toggle("filled", termino.length > 0);

  if (termino.length < 2) {
    salida.hidden = true; salida.innerHTML = "";
    cont.hidden = false; chips.hidden = false;
    return;
  }

  const t = plano(termino);
  const hits = INDEX.filter(e => e.texto.includes(t));
  cont.hidden = true; chips.hidden = true; salida.hidden = false;

  if (!hits.length) {
    salida.innerHTML = `<p class="vacio">Sin resultados para “${esc(termino)}”.</p>`;
    return;
  }

  let html = `<p class="res-info">${hits.length} ${hits.length === 1 ? "elemento" : "elementos"} · ${new Set(hits.map(h => h.tema.slug)).size} temas</p>`;
  let actual = null;
  hits.slice(0, 200).forEach(h => {
    if (h.tema.slug !== actual) {
      actual = h.tema.slug;
      html += `<div class="parte" data-c="${h.parte.codigo}"><p class="res-tema">${esc(h.tema.titulo)}</p></div>`;
    }
    html += `<div class="parte" data-c="${h.parte.codigo}">${pintarItem(h.item, termino)}</div>`;
  });
  if (hits.length > 200) html += `<p class="vacio">…y ${hits.length - 200} más. Afina la búsqueda.</p>`;

  salida.innerHTML = html;
  window.scrollTo({ top: 0 });
}

campo.addEventListener("input", () => { clearTimeout(pendiente); pendiente = setTimeout(buscar, 120); });
document.getElementById("limpiar").addEventListener("click", () => { campo.value = ""; campo.focus(); buscar(); });

/* abrir directo si la URL trae un tema */
const inicial = decodeURIComponent(location.hash.slice(1));
if (inicial && porSlug[inicial]) abrirTema(inicial);
</script>
