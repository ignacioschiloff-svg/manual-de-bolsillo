Nocardia"},{"n":"7","nombre":"Pink acid fast gun","ver":"Un revólver de color rosa sostenido por el vaquero de la izquierda, apuntando a la mesa.","clinica":"Nocardia asteroides tiene ácidos micólicos en su pared celular, que le permiten teñirse parcialmente de rosa/rojo con fucsina básica en la tinción ácido-alcohol resistente; la tinción parcial es más débil que la reacción completa vista en Mycobacterium tuberculosis.","sketchy":"El color rosa de la pistola es la representación literal directa de la tinción \"parcialmente rosa\" (partial acid-fast) característica de Nocardia.","literal":"Nocardia asteroides has mycolic acids (long-chain fatty acids) in its cell wall, which allow it to stain partially pink/red with carbol fuchsin in acid-fast staining, partial staining is weaker than the full acid-fast reaction seen in Mycobacterium tuberculosis, reflecting the lower mycolic acid content in Nocardia"},{"n":"8","nombre":"Catalase cat","ver":"Un gato gris sostenido en brazos por el hombre de la derecha.","clinica":"Nocardia asteroides produce catalasa (es decir, catalasa positivo), una enzima que convierte el peróxido de hidrógeno en agua y oxígeno.","sketchy":"\"Cat\" suena como el inicio de \"catalase\", el mismo símbolo recurrente usado en S. aureus y Pasteurella multocida.","literal":"Nocardia asteroides produces catalase (i.e. catalase positive), an enzyme that converts hydrogen peroxide into water and oxygen"},{"n":"9","nombre":"Ammonia spray","ver":"Un frasco/dispensador etiquetado \"NH₃\" visible en la escena del desierto.","clinica":"Nocardia asteroides produce ureasa (es decir, ureasa positivo), una enzima que hidroliza la urea en dióxido de carbono y amoníaco.","sketchy":"El frasco etiquetado \"NH₃\" (fórmula química del amoníaco) representa directamente el producto de la reacción de la ureasa.","literal":"Nocardia asteroides produces urease (i.e. urease positive), an enzyme that hydrolyzes urea into carbon dioxide and ammonia"},{"n":"10","nombre":"Immunocompromised cane + man","ver":"Un hombre apoyado en un bastón, tosiendo, en el lado derecho de la mesa.","clinica":"La nocardiosis afecta predominantemente a pacientes inmunocomprometidos y es más común en hombres que en mujeres (~2:1-3:1).","sketchy":"El bastón representa a un paciente debilitado/inmunocomprometido, y el hecho de que el personaje sea hombre refuerza la mayor prevalencia masculina.","literal":"Nocardiosis predominantly affects immunocompromised patients and is more common in men than women (~2:1-3:1)"},{"n":"11","nombre":"Dented badge over lungs","ver":"Una insignia/placa abollada sobre el pecho del hombre que tose.","clinica":"La nocardiosis pulmonar puede manifestarse con múltiples nódulos sólidos y cavidades, parecido a la tuberculosis.","sketchy":"La placa abollada (con hendiduras/cavidades) sobre el pecho representa visualmente los nódulos y cavidades pulmonares.","literal":"Pulmonary nocardiosis may manifest with multiple solid nodules and cavities, resembling tuberculosis"},{"n":"12","nombre":"Coughing","ver":"El hombre tosiendo visiblemente, con la mano en el pecho.","clinica":"Los pacientes con nocardiosis pulmonar pueden experimentar síntomas similares a los de neumonía (ej., fiebre, tos, disnea, dolor torácico pleurítico).","sketchy":"El acto de toser es la representación directa del síntoma respiratorio principal.","literal":"Patients with pulmonary nocardiosis may experience symptoms similar to pneumonia (e.g., fever, cough, dyspnea, pleuritic chest pain)"},{"n":"13","nombre":"Tuberculosis cactus","ver":"Un cactus verde en una maceta sobre la mesa.","clinica":"La nocardiosis pulmonar puede manifestarse con múltiples nódulos sólidos y cavidades, semejando tuberculosis.","sketchy":"El cactus, con sus espinas y protuberancias, representa visualmente el parecido radiológico con la tuberculosis.","literal":"Pulmonary nocardiosis may manifest with multiple solid nodules and cavities, resembling tuberculosis"},{"n":"14","nombre":"Hole in hat","ver":"Un agujero visible en el sombrero de vaquero colgado en la barra.","clinica":"La nocardiosis del SNC es una infección rara que puede presentarse con abscesos cerebrales y múltiples lesiones con realce en anillo.","sketchy":"El agujero en el sombrero (que cubre la cabeza) representa directamente el absceso cerebral y la afectación del SNC.","literal":"CNS nocardiosis is a rare infection that may present with brain abscesses and multiple ring-enhancing lesions"},{"n":"15","nombre":"Red cow spots","ver":"Manchas rojas en el chaleco de vaca (cow print) del hombre que tose.","clinica":"La nocardiosis cutánea es una manifestación rara de infección que puede resultar de inoculación directa o secundaria a infección pulmonar diseminada, presentándose de forma variable como nódulos rojos, indurados y sensibles, pústulas o lesiones ulcerativas con inflamación asociada.","sketchy":"Las manchas rojas sobre el estampado representan directamente las lesiones cutáneas rojas de la nocardiosis cutánea.","literal":"Cutaneous nocardiosis is a rare manifestation of infection that can result from direct inoculation or secondary to disseminated pulmonary infection, presenting variably as red, indurated, tender nodules, pustules, or ulcerative lesions with associated inflammation"},{"n":"16","nombre":"Sulfa eggs","ver":"Un frasco de huevos en conserva sobre la barra.","clinica":"Las sulfonamidas, específicamente trimetoprim-sulfametoxazol, son el tratamiento de elección para las infecciones por Nocardia asteroides, al inhibir la síntesis de folato bacteriano, esencial para la producción de ADN y proteínas; los ácidos micólicos de Nocardia difieren de los de Mycobacterium tuberculosis, por lo que la isoniazida es ineficaz, haciendo que el TMP-SMX sea preferido.","sketchy":"Los \"sulfa eggs\" (huevos de azufre) representan directamente las sulfonamidas (TMP-SMX).","literal":"Sulfonamides, specifically trimethoprim-sulfamethoxazole, are the treatment of choice for Nocardia asteroides infections, by inhibiting bacterial folate synthesis, essential for DNA and protein production, nocardia's mycolic acids differ from Mycobacterium tuberculosis, so isoniazid is ineffective, making TMP-SMX preferred"}],"mapa":"imagenes/nocardia-asteroides-mapa.webp","texto":"imagenes/nocardia-asteroides-texto.webp"},{"slug":"staphylococcus-aureus","titulo":"Staphylococcus aureus","items":[{"n":"1","nombre":"Golden staff","ver":"Un bastón/cetro dorado con un símbolo en la parte superior, sostenido junto al Mar Rojo.","clinica":"Staphylococcus aureus (un coco gram-positivo).","sketchy":"\"Golden\" (dorado) suena como \"aureus\" (que significa dorado en latín), siendo el color del bastón la clave mnemotécnica directa del nombre de la bacteria.","literal":"Staphylococcus aureus (a gram-positive coccus)"},{"n":"2","nombre":"Purple robe","ver":"Una túnica/manto de color púrpura que viste el hombre mayor (tipo Moisés) en el centro.","clinica":"Staphylococcus aureus es un coco gram-positivo.","sketchy":"El color púrpura de la túnica refuerza la tinción gram-positiva (violeta/púrpura en la tinción de Gram).","literal":"Staphylococcus aureus is a gram-positive coccus"},{"n":"3","nombre":"Catalase cat","ver":"Un gato negro egipcio sentado junto al personaje principal.","clinica":"Staphylococcus aureus produce catalasa (es decir, catalasa positivo), una enzima que convierte el peróxido de hidrógeno en agua y oxígeno.","sketchy":"\"Cat\" suena como el inicio de \"catalase\" (catalasa), y el gato egipcio recuerda además la prueba de burbujeo con peróxido.","literal":"Staphylococcus aureus produces catalase (i.e. catalase positive), an enzyme that converts hydrogen peroxide into water and oxygen"},{"n":"4","nombre":"Coagulated river","ver":"Un río de color rojo intenso, con textura espesa/coagulada (referencia a la plaga del Nilo convertido en sangre).","clinica":"Staphylococcus aureus produce coagulasa (es decir, coagulasa positivo), una enzima que convierte el fibrinógeno en fibrina → formación de coágulo en muestras de laboratorio; la prueba de coagulasa ayuda a distinguir Staph aureus de otros cocos gram-positivos, catalasa-positivos y coagulasa-negativos.","sketchy":"El río \"coagulado\" es la representación visual literal de la prueba de coagulasa positiva.","literal":"Staphylococcus aureus produces coagulase (i.e. coagulase positive), an enzyme that converts fibrinogen to fibrin → clot formation in test samples; the coagulase test helps distinguish Staph aureus from other gram-positive, catalase-positive, coagulase-negative cocci"},{"n":"5","nombre":"Beta light bulb","ver":"Un frasco/ampolla brillante de color rojo, con forma de bombilla, que sostiene el personaje.","clinica":"La mayoría de las cepas de Staphylococcus aureus demuestran beta-hemólisis, que se refiere a la capacidad de lisar completamente la hemoglobina → zonas claras y transparentes alrededor de las colonias en agar sangre.","sketchy":"El brillo transparente/claro de la ampolla representa la zona clara de lisis completa (beta-hemólisis) alrededor de la colonia.","literal":"Most strains of Staphylococcus aureus demonstrate beta-hemolysis, which refers to the ability to completely lyse hemoglobin → clear, transparent zones around colonies on blood agar"},{"n":"6","nombre":"Tall man in yellow","ver":"Un hombre alto y musculoso vestido de amarillo, con los brazos cruzados.","clinica":"Staphylococcus aureus puede fermentar manitol, lo que hace que el agar manitol salado se vuelva amarillo; el agar manitol salado ayuda a distinguir Staph aureus de estafilococos no patógenos, que típicamente no fermentan manitol.","sketchy":"El color amarillo de la vestimenta representa directamente el cambio de color del agar manitol salado al fermentarse.","literal":"Staphylococcus aureus can ferment mannitol, which causes mannitol salt agar to turn yellow; mannitol salt agar helps distinguish Staph aureus from non-pathogenic staphylococci, which typically do not ferment mannitol"},{"n":"7","nombre":"\"A\" bound to IgG","ver":"Un símbolo dorado en forma de \"A\" en lo alto del bastón, atado con una cuerda al personaje.","clinica":"Un factor de virulencia primario de Staphylococcus aureus es la proteína A, que se une a la región Fc de los anticuerpos IgG, inhibiendo posteriormente la activación del complemento y la fagocitosis.","sketchy":"La letra \"A\" dorada en el bastón representa directamente \"Protein A\", y el hecho de que esté \"atada/unida\" simboliza su unión a la IgG.","literal":"A primary virulence factor of Staphylococcus aureus is protein A, which binds the Fc region of IgG antibodies, subsequently inhibiting complement activation and phagocytosis"},{"n":"8","nombre":"Nose","ver":"Una roca grande con forma de nariz en primer plano.","clinica":"Staphylococcus aureus es parte de la flora normal de las fosas nasales y la piel.","sketchy":"La roca en forma de nariz es la representación literal del sitio de colonización normal (fosas nasales).","literal":"Staphylococcus aureus is part of the normal flora of the nares and skin"},{"n":"9","nombre":"Coughing + patchy cloth","ver":"Un personaje tosiendo, vestido con ropa de tela parchada/irregular.","clinica":"La neumonía causada por Staphylococcus aureus a menudo se manifiesta en radiografía de tórax como infiltrados parchados que pueden progresar a consolidación lobar.","sketchy":"La tela \"parchada\" (patchy) representa directamente el patrón radiológico de infiltrados parchados.","literal":"Pneumonia caused by Staphylococcus aureus often manifests on a chest X-ray as patchy infiltrates that may progress to lobar consolidation"},{"n":"10","nombre":"Icosahedron viral lanterns","ver":"Objetos con forma de icosaedro (como linternas geométricas) colgados sobre el camello.","clinica":"Una infección respiratoria alta, particularmente la influenza, puede predisponer a los individuos a neumonía por Staphylococcus aureus.","sketchy":"La forma icosaédrica es la representación estructural clásica de un virus (influenza), señalando la infección predisponente.","literal":"An upper respiratory infection, particularly influenza, can predispose individuals to Staphylococcus aureus pneumonia"},{"n":"11","nombre":"Joint bandages","ver":"Vendajes/ataduras en las articulaciones del camello.","clinica":"Staphylococcus aureus es la causa más común de artritis séptica, que se presenta como una articulación caliente, hinchada y sensible, junto con líquido purulento en la aspiración.","sketchy":"Los vendajes en las articulaciones representan directamente la afectación articular (artritis séptica).","literal":"Staphylococcus aureus is the most common cause of septic arthritis, which presents as a warm, swollen, and tender joint along with purulent fluid on aspiration"},{"n":"12","nombre":"Inflamed camel humps","ver":"Las jorobas del camello, de aspecto inflamado, con cristales/protuberancias saliendo de ellas.","clinica":"Staphylococcus aureus es conocido por causar una variedad de infecciones de piel y tejidos blandos, incluyendo abscesos, impétigo, furúnculos, carbuncos y celulitis.","sketchy":"Las jorobas inflamadas representan visualmente los abscesos/forúnculos típicos de las infecciones cutáneas.","literal":"Staphylococcus aureus is known to cause a range of skin and soft tissue infections, including abscesses, impetigo, furuncles, carbuncles, and cellulitis"},{"n":"13","nombre":"Hearts on running camel","ver":"Corazones dibujados sobre la montura del camello que corre rápido.","clinica":"La endocarditis infecciosa aguda, una condición que se manifiesta con fiebre de inicio rápido, escalofríos, taquicardia y sepsis, puede ser causada por Staphylococcus aureus, incluso en individuos con válvulas cardíacas previamente sanas.","sketchy":"Los corazones sobre el camello en movimiento rápido representan la endocarditis infecciosa de inicio agudo y rápido.","literal":"Acute infective endocarditis, a condition that manifests as rapid onset fever, chills, tachycardia, and sepsis, can be caused by Staphylococcus aureus, even in individuals with previously undamaged heart valves"},{"n":"14","nombre":"Three pyramids + mortar and pestle","ver":"Tres pirámides de fondo, y un mortero con mano de mortero (mortar and pestle) sostenido por la mujer sobre el camello.","clinica":"La endocarditis infecciosa de la válvula tricúspide (TVIE) causada por Staphylococcus aureus está altamente asociada al uso de drogas IV.","sketchy":"Las \"tres\" pirámides representan la válvula \"TRIcúspide\" (tres cúspides), y el mortero/pestle alude al uso de drogas (preparación de sustancias).","literal":"Tricuspid valve infective endocarditis (TVIE) caused by Staphylococcus aureus is highly associated with IV drug use"},{"n":"15","nombre":"Fish bones","ver":"Esqueletos/espinas de pescado dispersos en la arena.","clinica":"Staphylococcus aureus es la causa principal de osteomielitis, una inflamación o hinchazón del hueso típicamente causada por infección.","sketchy":"Las espinas de pescado representan el hueso (esqueleto), señalando la osteomielitis.","literal":"Staphylococcus aureus is the leading cause of osteomyelitis, an inflammation or swelling of bone typically caused by infection"},{"n":"16","nombre":"Exfoliative burn","ver":"Un personaje tocándose la cara/cabeza como si sintiera una quemadura, con vapor saliendo de su piel.","clinica":"Ciertas cepas de Staphylococcus aureus producen una toxina exfoliativa que puede llevar al síndrome de piel escaldada, una condición caracterizada por descamación cutánea generalizada.","sketchy":"La sensación de \"quemadura/escaldado\" en la piel representa directamente el síndrome de piel escaldada por toxina exfoliativa.","literal":"Certain strains of Staphylococcus aureus produce an exfoliative toxin that can lead to scalded skin syndrome, a condition characterized by widespread skin peeling"},{"n":"17","nombre":"Superhero cape + bolt","ver":"Una capa roja de superhéroe con un rayo/bolt bordado, que viste el personaje.","clinica":"Algunas cepas de Staphylococcus aureus producen una exotoxina superantígeno, resultando en síndrome de shock tóxico (TSS); el TSS se caracteriza por fiebre alta, un rash descamativo y shock (presión arterial baja y/o frecuencia cardíaca muy alta).","sketchy":"La capa de \"superhéroe\" representa el \"superantígeno\", y el rayo simboliza el shock (choque eléctrico = shock tóxico).","literal":"Some strains of Staphylococcus aureus produce a superantigen exotoxin, resulting in toxic shock syndrome (TSS); TSS is characterized by a high fever, a desquamative rash, and shock (low blood pressure and/or very high heart rate)"},{"n":"18","nombre":"Rapid camel running + nausea","ver":"Un camello corriendo rápidamente, con dos personajes montados que se ven con náuseas/malestar.","clinica":"La ingestión de enterotoxina preformada producida por Staphylococcus aureus puede causar una forma de intoxicación alimentaria de inicio rápido (los síntomas usualmente se desarrollan entre 30 min y 8 h), caracterizada por náuseas súbitas, vómito y calambres estomacales.","sketchy":"El camello corriendo \"rápido\" representa el inicio rápido del cuadro de intoxicación alimentaria.","literal":"Ingestion of preformed enterotoxin made by Staphylococcus aureus can cause a rapid-onset form of food poisoning (Sx usually develop within 30 m - 8 h), characterized by a sudden nausea, vomiting, and stomach cramps"},{"n":"19","nombre":"Mayo and meats","ver":"Un frasco de mayonesa y trozos de carne colgando en la montura del camello.","clinica":"La ingestión de alimentos contaminados con enterotoxina de Staphylococcus aureus, notablemente ítems como mayonesa y carnes, puede resultar en enteritis estafilocócica.","sketchy":"La mayonesa y la carne son los alimentos clásicos asociados a este tipo de intoxicación alimentaria, representados literalmente.","literal":"Ingestion of food contaminated with Staphylococcus aureus enterotoxin, notably items like mayonnaise and meats, can result in staphylococcal enteritis"},{"n":"20","nombre":"Merciful pharaoh","ver":"Un faraón egipcio con los brazos extendidos en gesto de \"misericordia/clemencia\".","clinica":"Ciertas cepas de Staphylococcus aureus han desarrollado resistencia a los antibióticos beta-lactámicos, notablemente incluyendo la meticilina (Staphylococcus aureus resistente a meticilina, MRSA).","sketchy":"El faraón \"merciful\" (misericordioso/piadoso) suena similar a \"meticillin\", y su gesto de \"perdonar/resistir\" al ataque representa la resistencia antibiótica.","literal":"Certain strains of Staphylococcus aureus have developed resistance to beta-lactam antibiotics, notably including methicillin (methicillin-resistant Staphylococcus aureus (MRSA))"},{"n":"21","nombre":"Altered builders","ver":"Trabajadores/constructores egipcios con apariencia alterada (de color verde, tipo momia/anubis) construyendo la pirámide.","clinica":"Las cepas de MRSA tienen proteínas de unión a penicilina modificadas, lo que impide la unión de los antibióticos beta-lactámicos a las paredes celulares bacterianas.","sketchy":"Los \"constructores alterados\" representan las proteínas de unión (constructoras de la pared celular) que han sido modificadas/alteradas, impidiendo la unión del antibiótico.","literal":"MRSA strains have modified penicillin-binding proteins, which hinder the binding of beta-lactam antibiotics to bacterial cell walls"},{"n":"22","nombre":"Purple caravan","ver":"Una carreta/caravana con un toldo de tela púrpura.","clinica":"La vancomicina es efectiva contra las infecciones por MRSA.","sketchy":"El color púrpura del toldo es el color mnemotécnico clásico de Sketchy asociado a \"vancomicina\".","literal":"Vancomycin is effective against MRSA infections"},{"n":"23","nombre":"Pencil staff","ver":"Un bastón/cetro con forma de lápiz que sostiene el faraón vestido de azul y blanco.","clinica":"La nafcilina, un antibiótico beta-lactámico, es efectiva contra las infecciones por Staphylococcus aureus no-MRSA.","sketchy":"El \"lápiz\" (pencil) suena fonéticamente similar al inicio de \"nafcillin\", vinculando el objeto con el fármaco.","literal":"Nafcillin, a beta-lactam antibiotic, is effective against non-MRSA Staphylococcus aureus infections"}],"mapa":"imagenes/staphylococcus-aureus-mapa.webp","texto":"imagenes/staphylococcus-aureus-texto.webp"},{"slug":"staphylococcus-epidermidis-saprophyticus","titulo":"Staphylococcus epidermidis & saprophyticus","items":[{"n":"1","nombre":"Plumber","ver":"Un plomero reparando las tuberías bajo el fregadero de la cocina.","clinica":"Staphylococcus epidermidis (un coco gram-positivo).","sketchy":"El plomero, que trabaja en las \"tuberías\" (superficies y conductos), sirve como personaje ancla para \"epidermidis\", relacionado con la piel.","literal":"Staphylococcus epidermidis (a gram-positive coccus)"},{"n":"2","nombre":"Girl sitting on counter","ver":"Una chica sentada sobre la encimera de la cocina.","clinica":"Staphylococcus saprophyticus (un coco gram-positivo).","sketchy":"La chica \"sitting\" (sentada) es la clave fonética para \"saprophyticus\", jugando con el sonido en la escena.","literal":"Staphylococcus saprophyticus (a gram-positive coccus)"},{"n":"3","nombre":"Purple hues","ver":"Tonos púrpura predominantes en las cortinas de la cocina.","clinica":"Staphylococcus epidermidis y saprophyticus son cocos gram-positivos.","sketchy":"El color púrpura refuerza la tinción gram-positiva de ambas especies.","literal":"Staphylococcus epidermidis and saprophyticus are gram-positive cocci"},{"n":"4","nombre":"Catalase cat","ver":"Un gato sentado sobre la encimera, cerca de la ventana.","clinica":"Staphylococcus epidermidis y saprophyticus producen catalasa (es decir, catalasa positivo), una enzima que convierte el peróxido de hidrógeno en agua y oxígeno.","sketchy":"\"Cat\" suena como el inicio de \"catalase\", símbolo recurrente en toda la serie de Staphylococcus.","literal":"Staphylococcus epidermidis and saprophyticus produce catalase (i.e. catalase positive), an enzyme that converts hydrogen peroxide into water and oxygen"},{"n":"5","nombre":"Bowl of jello","ver":"Un tazón rojo con gelatina (jello) sobre la encimera.","clinica":"Staphylococcus epidermidis y saprophyticus NO producen coagulasa (es decir, coagulasa negativo), una enzima que convierte el fibrinógeno en fibrina → sin formación de coágulo; la prueba de coagulasa ayuda a distinguir estas especies de Staphylococcus aureus, que es coagulasa-positivo.","sketchy":"La gelatina sin cuajar en el tazón representa directamente la ausencia de coagulación (coagulasa negativa).","literal":"Staphylococcus epidermidis and saprophyticus do not produce coagulase (i.e. coagulase negative), an enzyme that converts fibrinogen to fibrin → no clot formation; the coagulase test helps distinguish these species from Staphylococcus aureus, which is coagulase-positive"},{"n":"6","nombre":"Moses Gell \"-\" o","ver":"Una caja etiquetada \"Moses GELL-O\" sobre la encimera.","clinica":"Staphylococcus epidermidis y saprophyticus no producen coagulasa (es decir, coagulasa negativo), distinguiéndolos de Staphylococcus aureus, que es coagulasa-positivo.","sketchy":"\"GELL-O\" con el signo \"-\" explícito refuerza literalmente \"coagulase NEGATIVE\" (coagulasa negativa).","literal":"Staphylococcus epidermidis and saprophyticus do not produce coagulase (i.e. coagulase negative), an enzyme that converts fibrinogen to fibrin → no clot formation; the coagulase test helps distinguish these species from Staphylococcus aureus, which is coagulase-positive"},{"n":"7","nombre":"Ammonia spray","ver":"Un frasco etiquetado \"NH₃\" en el fregadero de la cocina.","clinica":"Staphylococcus epidermidis y saprophyticus producen ureasa (es decir, ureasa positivo), una enzima que hidroliza la urea en dióxido de carbono y amoníaco.","sketchy":"El frasco etiquetado \"NH₃\" representa directamente el producto de la reacción de ureasa, mismo símbolo usado en Nocardia.","literal":"Staphylococcus epidermidis and saprophyticus produce urease (i.e. urease positive), an enzyme that hydrolyzes urea into carbon dioxide and ammonia"},{"n":"8","nombre":"Plumber's exposed navel","ver":"El ombligo/vientre expuesto del plomero mientras trabaja debajo del fregadero.","clinica":"Staphylococcus epidermidis es susceptible al antibiótico novobiocina, distinguiéndolo de Staphylococcus saprophyticus, que es resistente a la novobiocina.","sketchy":"El ombligo \"expuesto\" (sin protección) representa la susceptibilidad de epidermidis a la novobiocina.","literal":"Staphylococcus epidermidis is susceptible to the antibiotic novobiocin, distinguishing it from Staphylococcus saprophyticus, which is resistant to novobiocin"},{"n":"9","nombre":"Girl's covered navel","ver":"El ombligo de la chica cubierto por su camiseta rosa.","clinica":"Staphylococcus epidermidis es susceptible a la novobiocina, distinguiéndolo de Staphylococcus saprophyticus, que es resistente a la novobiocina.","sketchy":"El ombligo \"cubierto/protegido\" de la chica representa la resistencia de saprophyticus a la novobiocina.","literal":"Staphylococcus epidermidis is susceptible to the antibiotic novobiocin, distinguishing it from Staphylococcus saprophyticus, which is resistant to novobiocin"},{"n":"10","nombre":"Dirty hands","ver":"Las manos sucias del plomero mientras trabaja bajo el fregadero.","clinica":"Staphylococcus epidermidis es parte de la flora normal, comúnmente encontrada en piel y membranas mucosas.","sketchy":"Las manos sucias representan directamente la colonización cutánea normal de la bacteria.","literal":"Staphylococcus epidermidis is part of the normal flora, commonly found on skin and mucous membranes"},{"n":"11","nombre":"Petri dish pan","ver":"Una olla/sartén roja con forma de placa de Petri en el suelo, bajo el fregadero.","clinica":"Como componente de la flora normal de la piel, Staphylococcus epidermidis es un contaminante común de los hemocultivos.","sketchy":"La sartén con forma de placa de Petri representa directamente el cultivo (hemocultivo) que se ve contaminado.","literal":"As a component of the normal skin flora, Staphylococcus epidermidis is a common contaminant of blood cultures"},{"n":"12","nombre":"Plumbing joints","ver":"Las juntas/articulaciones de las tuberías reparadas por el plomero.","clinica":"Staphylococcus epidermidis es uno de los patógenos más aislados en infecciones de articulaciones protésicas.","sketchy":"Las \"juntas de tuberías\" (plumbing joints) representan literalmente las \"articulaciones protésicas\" (prosthetic joints).","literal":"Staphylococcus epidermidis is one of the most isolated pathogens in prosthetic joint infections"},{"n":"13","nombre":"Tubing","ver":"Tubería flexible que el plomero manipula bajo el fregadero.","clinica":"Staphylococcus epidermidis es una de las principales causas de infecciones asociadas a catéteres.","sketchy":"La tubería representa directamente los catéteres y dispositivos tubulares médicos.","literal":"Staphylococcus epidermidis is one of the leading causes of catheter-associated infections"},{"n":"14","nombre":"Heart valve","ver":"Una válvula con forma de corazón dentro del mecanismo de tuberías.","clinica":"Staphylococcus epidermidis es el agente causal más común de la endocarditis de válvula protésica.","sketchy":"La válvula con forma de corazón representa directamente la válvula cardíaca protésica afectada.","literal":"Staphylococcus epidermidis is the most common causative agent of prosthetic valve endocarditis"},{"n":"15","nombre":"Gunk on pipes and tubes","ver":"Sustancia pegajosa y mugre adherida a las tuberías bajo el fregadero.","clinica":"Staphylococcus epidermidis produce biofilms (matriz extracelular de polisacáridos), permitiendo la adherencia a dispositivos protésicos y catéteres IV.","sketchy":"El \"gunk\" (mugre pegajosa) es la representación visual literal del biofilm adherido a superficies.","literal":"Staphylococcus epidermidis produces biofilms (extracellular polysaccharide matrix), allowing for adherence to prosthetic devices and IV catheters"},{"n":"16","nombre":"Van","ver":"Una furgoneta (van) visible a través de la ventana de la cocina.","clinica":"La vancomicina es el fármaco de elección para las infecciones por Staphylococcus epidermidis, ya que la mayoría de las cepas muestran resistencia a la nafcilina y meticilina debido a su capacidad de producir biofilms.","sketchy":"\"Van\" suena como el inicio de \"vancomycin\", mismo símbolo usado en C. difficile.","literal":"Vancomycin is the drug of choice for Staphylococcus epidermidis infections as most strains show resistance to nafcillin and methicillin due to their ability to produce biofilms"},{"n":"17","nombre":"Bladder cup","ver":"Una copa de cóctel con forma de vejiga que sostiene la chica.","clinica":"Staphylococcus saprophyticus es un patógeno frecuente en infecciones urinarias no complicadas (E. coli y Klebsiella son los agentes causales más frecuentes) y comúnmente causa infecciones urinarias no complicadas en mujeres jóvenes sexualmente activas (también conocida como \"cistitis de luna de miel\").","sketchy":"La copa en forma de vejiga (bladder) representa directamente el tracto urinario como sitio de infección.","literal":"Staphylococcus saprophyticus is an encountered pathogen for uncomplicated urinary tract infections (E. coli and Klebsiella are the most frequent causative agents) and commonly causes uncomplicated urinary tract infections in young, sexually active females (AKA honeymoon cystitis)"},{"n":"18","nombre":"Girl twirling hair","ver":"La chica enroscando su cabello mientras está sentada en la encimera.","clinica":"Staphylococcus saprophyticus es un patógeno frecuente en infecciones urinarias no complicadas y comúnmente causa infecciones urinarias no complicadas en mujeres jóvenes sexualmente activas (AKA \"cistitis de luna de miel\").","sketchy":"El gesto de jugar con el cabello refuerza el contexto de mujer joven, asociado a la \"cistitis de luna de miel\".","literal":"Staphylococcus saprophyticus is an encountered pathogen for uncomplicated urinary tract infections (E. coli and Klebsiella are the most frequent causative agents) and commonly causes uncomplicated urinary tract infections in young, sexually active females (AKA honeymoon cystitis)"}],"mapa":"imagenes/staphylococcus-epidermidis-saprophyticus-mapa.webp","texto":"imagenes/staphylococcus-epidermidis-saprophyticus-texto.webp"}]},{"nombre":"Gram-negativas","codigo":"gn","temas":[{"slug":"haemophilus-influenzae","titulo":"Haemophilus influenzae","items":[{"n":"1","nombre":"Phyllis's chocolates","ver":"El letrero de la tienda \"Phyllis's Chocolate Covered Cherries\".","clinica":"Haemophilus influenzae (un cocobacilo gram-negativo).","sketchy":"\"Phyllis\" suena como \"Haemophilus\", siendo el nombre de la tienda la clave mnemotécnica principal.","literal":"Haemophilus influenzae (a gram-negative coccobacillus)"},{"n":"2","nombre":"Red hues","ver":"Tonos rojos en la fachada del local y el letrero.","clinica":"Haemophilus influenzae es un cocobacilo gram-negativo.","sketchy":"El color rojo refuerza la tinción gram-negativa.","literal":"Haemophilus influenzae is a gram-negative coccobacillus"},{"n":"3","nombre":"Pink oval candies","ver":"Dulces ovalados de color rosa dentro del dispensador.","clinica":"Haemophilus influenzae es un cocobacilo gram-negativo.","sketchy":"La forma ovalada de los dulces refuerza visualmente la morfología de cocobacilo.","literal":"Haemophilus influenzae is a gram-negative coccobacillus"},{"n":"4","nombre":"\"Chocolate\"","ver":"La palabra \"Chocolate\" en el letrero de la tienda.","clinica":"El agar chocolate, enriquecido con células sanguíneas lisadas, es el medio de crecimiento ideal para Haemophilus influenzae, ya que suministra los nutrientes y factores necesarios.","sketchy":"\"Chocolate\" es la clave mnemotécnica directa para el agar chocolate, medio de cultivo específico de esta bacteria.","literal":"Chocolate agar, which is enriched with lysed blood cells, is the ideal growth medium for Haemophilus influenzae, as it supplies necessary nutrients and factors"},{"n":"5","nombre":"\"5¢\"","ver":"Una máquina dispensadora que marca el precio \"5¢\".","clinica":"Haemophilus influenzae requiere NAD⁺ (factor V) y hemina (factor X) para su crecimiento.","sketchy":"El \"5\" representa directamente el \"factor V\" (número romano V = 5) necesario para el crecimiento.","literal":"Haemophilus influenzae requires NAD⁺ (factor V) and hemin (factor X) for growth"},{"n":"6","nombre":"\"10¢\"","ver":"Un cartel que marca el precio \"10¢\" sobre la vitrina de dulces.","clinica":"Haemophilus influenzae requiere NAD⁺ (factor V) y hemina (factor X) para su crecimiento.","sketchy":"El \"10\" representa directamente el \"factor X\" (número romano X = 10) necesario para el crecimiento.","literal":"Haemophilus influenzae requires NAD⁺ (factor V) and hemin (factor X) for growth"},{"n":"7","nombre":"Aerosol spray","ver":"Un aerosol siendo rociado por un personaje hacia unos insectos.","clinica":"Haemophilus influenzae se transmite vía gotitas respiratorias.","sketchy":"El aerosol rociado en el aire representa directamente la transmisión por gotitas respiratorias.","literal":"Haemophilus influenzae is transmitted via respiratory droplets"},{"n":"8","nombre":"Screaming kid + drool","ver":"Un niño gritando con baba y saliva goteando de su boca.","clinica":"La epiglotitis causada por Haemophilus influenzae, afectando principalmente a niños entre 2 y 6 años, se presenta con síntomas como disfagia, babeo y estridor inspiratorio.","sketchy":"El niño gritando y babeando representa directamente los síntomas clásicos de la epiglotitis.","literal":"Epiglottitis caused by Haemophilus influenzae, primarily affecting children between the ages of 2 and 6 years, presents with symptoms such as dysphagia, drooling, and inspiratory stridor"},{"n":"9","nombre":"Cherries","ver":"Cerezas rojas cubriendo el pastel de chocolate.","clinica":"La epiglotitis causada por Haemophilus influenzae a menudo se presenta con una \"epiglotis roja cereza\" debido a su apariencia hinchada e inflamada.","sketchy":"Las cerezas son la representación literal directa de la \"cherry red epiglottis\".","literal":"Epiglottitis caused by Haemophilus influenzae often presents with a \"cherry red epiglottis\" due to its swollen and inflamed appearance"},{"n":"10","nombre":"Plugging ears","ver":"Un soldado tapándose los oídos con las manos.","clinica":"Haemophilus influenzae es una causa común de otitis media aguda y recurrente.","sketchy":"Taparse los oídos representa directamente el problema de otitis media.","literal":"Haemophilus influenzae is a common cause of acute and recurrent otitis media"},{"n":"11","nombre":"Bee + glass capsule","ver":"Una abeja dentro de una cápsula/burbuja de vidrio.","clinica":"Haemophilus influenzae tipo b (Hib) posee una cápsula de polisacárido que ayuda a evadir la respuesta inmune del huésped.","sketchy":"\"Bee\" (abeja) suena como la letra \"b\" de \"type b\" (Hib), y la cápsula de vidrio representa la cápsula bacteriana.","literal":"Haemophilus influenzae type b (Hib) possesses a polysaccharide capsule that aids in evasion of the host immune response"},{"n":"12","nombre":"Meningitis helmet + holding head","ver":"Un personaje con casco protector sosteniéndose la cabeza con dolor.","clinica":"Hib es una causa común de meningitis en adolescentes, que a menudo se presenta con meningismo (cefalea, rigidez de nuca, fotofobia y a menudo náuseas/vómitos).","sketchy":"El casco y el gesto de sostenerse la cabeza representan la meningitis y su síntoma principal.","literal":"Hib is a common cause of meningitis in adolescents, which often presents with meningismus (clinical syndrome of headache, neck stiffness, photophobia, and often nausea/vomiting)"},{"n":"13","nombre":"Sickles","ver":"Hoces/guadañas sostenidas por uno de los personajes con casco.","clinica":"Los pacientes con enfermedad de células falciformes o asplenia son más susceptibles a infecciones por bacterias encapsuladas como cepas encapsuladas de Haemophilus influenzae.","sketchy":"Las \"sickles\" (hoces) son la representación literal directa de la \"sickle cell disease\".","literal":"Patients with sickle cell disease or asplenia are more susceptible to infections from encapsulated bacteria like encapsulated strains of Haemophilus influenzae"},{"n":"14","nombre":"Kid with syringe","ver":"Un niño pequeño sosteniendo una jeringa de color rosa.","clinica":"Los infantes y niños pequeños deben recibir una serie de vacunas Hib para prevenir infecciones graves.","sketchy":"La jeringa sostenida por el niño representa directamente la vacunación Hib en la población pediátrica.","literal":"Infants and toddlers should get an Hib vaccine series to prevent serious infections"},{"n":"15","nombre":"\"Sugar DIPped\"","ver":"Un cartel que dice \"SPECIAL SUGAR DIPped\".","clinica":"El polisacárido capsular de Hib es un inmunógeno pobre en infantes; para mejorar la inmunogenicidad, el polisacárido de Hib se acopla covalentemente a toxoide diftérico.","sketchy":"\"DIP\" en \"DIPped\" es la clave mnemotécnica para \"DIPhtheria toxoid\" (toxoide diftérico).","literal":"The capsular polysaccharide of Hib is a poor immunogen in infants; to enhance immunogenicity, the Hib polysaccharide is covalently coupled to diphtheria toxoid"},{"n":"16","nombre":"\"$2.18\"","ver":"El precio \"$2.18\" en el mismo cartel de \"Special Sugar DIPped\".","clinica":"La vacuna Hib se administra en una serie de inyecciones entre los ~2 y 18 meses de edad.","sketchy":"Los números \"2.18\" representan directamente el rango de edad (2 a 18 meses) del esquema de vacunación.","literal":"The Hib vaccine is administered in a series of injections between the ages of ~2–18 months"},{"n":"17","nombre":"3 axes","ver":"Tres hachas sostenidas por uno de los personajes con casco.","clinica":"Las cefalosporinas de tercera generación, como la ceftriaxona, son los antibióticos iniciales de elección para la meningitis por Hib.","sketchy":"Las \"3 axes\" (tres hachas) representan directamente las cefalosporinas de tercera generación.","literal":"Third-generation cephalosporins, such as ceftriaxone, are the initial antibiotics of choice for Hib meningitis"},{"n":"18","nombre":"Rifle","ver":"Un rifle sostenido por el personaje de la izquierda.","clinica":"La profilaxis con rifampicina se recomienda para contactos cercanos de pacientes con infección Hib invasiva.","sketchy":"\"Rifle\" suena como el inicio de \"rifampin\", vinculando el arma con el fármaco profiláctico.","literal":"Rifampin prophylaxis is recommended for close contacts of patients with invasive Hib infection"}],"mapa":"imagenes/haemophilus-influenzae-mapa.webp","texto":"imagenes/haemophilus-influenzae-texto.webp"},{"slug":"moraxella-catarrhalis","titulo":"Moraxella catarrhalis","items":[{"n":"1","nombre":"Moray eel-cat","ver":"Una criatura híbrida entre morena (moray eel) y gato, con cuerpo largo y cabeza felina.","clinica":"Moraxella catarrhalis es un diplococo gram-negativo.","sketchy":"\"Moray eel-cat\" suena fonéticamente como \"Moraxella catarrhalis\" (moray = Mora-, cat = -catarrhalis), siendo la clave mnemotécnica del nombre completo.","literal":"Moraxella catarrhalis is a gram negative diplococcus"},{"n":"2","nombre":"Glow of red flames","ver":"Un resplandor de llamas rojas iluminando el fondo de la escena submarina.","clinica":"Moraxella catarrhalis es un diplococo gram-negativo.","sketchy":"El resplandor rojo refuerza la tinción gram-negativa.","literal":"Moraxella catarrhalis is a gram negative diplococcus"},{"n":"3","nombre":"Nose of plane","ver":"La nariz/proa de un avión hundido, visible en el escenario submarino.","clinica":"M. catarrhalis puede colonizar la nasofaringe.","sketchy":"La nariz del avión representa directamente la nasofaringe como sitio de colonización.","literal":"M. catarrhalis can colonize the nasopharynx"},{"n":"4","nombre":"Blue gem ring","ver":"Un anillo con una gema azul, flotando en el agua.","clinica":"M. catarrhalis es un aerobio oxidasa positivo; puede formar biofilm, produce beta lactamasa; signo positivo del \"hockey-puck\".","sketchy":"El color azul de la gema representa la prueba de oxidasa positiva, que produce un color azul en la reacción.","literal":"M. catarrhalis is an oxidase positive aerobe; can form a biofilm, produces beta lactamase; positive hockey-puck sign"},{"n":"5","nombre":"Bellows-fish","ver":"Un pez con forma de fuelle (bellows) expulsando burbujas de aire.","clinica":"M. catarrhalis es un aerobio oxidasa positivo; puede formar biofilm, produce beta lactamasa; signo positivo del hockey-puck.","sketchy":"El fuelle que bombea aire representa el carácter aerobio de la bacteria.","literal":"M. catarrhalis is an oxidase positive aerobe; can form a biofilm, produces beta lactamase; positive hockey-puck sign"},{"n":"6","nombre":"Algae","ver":"Algas verdes cubriendo parte de la estructura submarina de la derecha.","clinica":"M. catarrhalis es un aerobio oxidasa positivo; puede formar biofilm (refuerza su resistencia contra ciertos antibióticos), produce beta lactamasa; signo positivo del hockey-puck.","sketchy":"Las algas adheridas a la estructura son la representación visual literal del biofilm.","literal":"M. catarrhalis is an oxidase positive aerobe; can form a biofilm (bolsters its resistance against certain antibiotics), produces beta lactamase; positive hockey-puck sign"},{"n":"7","nombre":"Broken beta-lactam gyroscope","ver":"Un giroscopio dorado roto, flotando cerca de la estructura de la derecha.","clinica":"M. catarrhalis es un aerobio oxidasa positivo; puede formar biofilm, produce beta lactamasa (una enzima que permite la degradación de antibióticos beta-lactámicos, incluyendo penicilinas); signo positivo del hockey puck.","sketchy":"El giroscopio roto representa cómo la beta-lactamasa rompe la estructura del anillo beta-lactámico de los antibióticos.","literal":"M. catarrhalis is an oxidase positive aerobe; can form a biofilm, produces beta lactamase (an enzyme enabling the breakdown of beta-lactam antibiotics, including penicillins); positive hockey puck sign"},{"n":"8","nombre":"Sliding plane wheel","ver":"Una rueda/disco tipo llanta de avión deslizándose por el agua.","clinica":"M. catarrhalis es un aerobio oxidasa positivo; forma biofilms, produce beta lactamasa; signo positivo del hockey puck (indicando el movimiento suave de las colonias a través de superficies de agar).","sketchy":"La rueda deslizándose es la representación literal del \"hockey-puck sign\", el deslizamiento de las colonias en el agar como un disco de hockey.","literal":"M. catarrhalis is an oxidase positive aerobe; forms biofilms, produces beta lactamase; positive hockey puck sign (indicating the smooth movement of colonies across agar surfaces)"},{"n":"9","nombre":"Amelia Ear-hurt","ver":"La mujer aviadora (referencia a Amelia Earhart) nadando, sosteniéndose la oreja.","clinica":"M. catarrhalis es una causa común de otitis media bacteriana (OM) en niños, a menudo afectando a aquellos ya colonizados.","sketchy":"\"Amelia Ear-hurt\" (juego de palabras con Amelia Earhart y \"ear hurt\" = oído dolorido) señala directamente la otitis media.","literal":"M. catarrhalis a common cause of bacterial otitis media (OM) in children, often affecting those already colonized"},{"n":"10","nombre":"Red leaky plane nose","ver":"La nariz del avión hundido, de color rojo, con líquido verdoso goteando de ella.","clinica":"M. catarrhalis es una causa común de sinusitis bacteriana.","sketchy":"La nariz que gotea representa directamente la sinusitis y su secreción.","literal":"M. catarrhalis is a common cause of bacterial sinusitis"},{"n":"11","nombre":"Blue bloater fish","ver":"Un pez globo azul e hinchado en el centro de la escena.","clinica":"M. catarrhalis está asociada con exacerbaciones de la Enfermedad Pulmonar Obstructiva Crónica (EPOC) y bronconeumonía relacionada con EPOC.","sketchy":"El \"blue bloater\" (pez hinchado y azul) es el apodo clásico del fenotipo de bronquitis crónica en la EPOC.","literal":"M. catarrhalis is associated with Chronic Obstructive Pulmonary Disease (COPD) exacerbations and COPD-related bronchopneumonia"},{"n":"12","nombre":"Cephalopod","ver":"Un calamar/pulpo (cefalópodo) en la parte inferior de la escena.","clinica":"M. catarrhalis es sensible a cefalosporinas, amoxicilina-clavulanato, trimetoprim-sulfametoxazol (TMP-SMX) y fluoroquinolonas.","sketchy":"\"Cephalopod\" suena fonéticamente similar al inicio de \"cephalosporins\" (cefalosporinas).","literal":"M. catarrhalis is sensitive to cephalosporins, amoxicillin-clavulanate, trimethoprim-sulfamethoxazole (TMP-SMX), fluoroquinolones"},{"n":"13","nombre":"Box of \"AMMO\" + clarinet harpoon","ver":"Una caja etiquetada \"AMMO\" junto a un arpón con forma de clarinete.","clinica":"Moraxella catarrhalis es sensible a cefalosporinas, amoxicilina-clavulanato, trimetoprim-sulfametoxazol (TMP-SMX) y fluoroquinolonas.","sketchy":"\"AMMO\" suena como el inicio de \"amoxicillin\", y el clarinete acompaña el listado de antibióticos efectivos.","literal":"Moraxella catarrhalis is sensitive to cephalosporins, amoxicillin-clavulanate, trimethoprim-sulfamethoxazole (TMP-SMX), fluoroquinolones"},{"n":"14","nombre":"Rotten sulfa-eggs","ver":"Huevos podridos con manchas verdosas, recordando el olor a azufre.","clinica":"Moraxella catarrhalis es sensible a cefalosporinas, amoxicilina-clavulanato, trimetoprim-sulfametoxazol (TMP-SMX) y fluoroquinolonas.","sketchy":"Los \"sulfa-eggs\" (huevos de azufre) representan directamente \"sulfamethoxazole\", parte del TMP-SMX.","literal":"Moraxella catarrhalis is sensitive to cephalosporins, amoxicillin-clavulanate, trimethoprim-sulfamethoxazole (TMP-SMX), fluoroquinolones"},{"n":"15","nombre":"Flower anemones","ver":"Anémonas con forma de flor púrpura creciendo sobre la roca de la derecha.","clinica":"Moraxella catarrhalis es sensible a cefalosporinas, amoxicilina-clavulanato, trimetoprim-sulfametoxazol (TMP-SMX) y fluoroquinolonas.","sketchy":"Las flores/anémonas (\"flor\" → fluoroquinolonas) cierran el listado de antibióticos efectivos.","literal":"Moraxella catarrhalis is sensitive to cephalosporins, amoxicillin-clavulanate, trimethoprim-sulfamethoxazole (TMP-SMX), fluoroquinolones"}],"mapa":"imagenes/moraxella-catarrhalis-mapa.webp","texto":"imagenes/moraxella-catarrhalis-texto.webp"},{"slug":"proteus-mirabilis","titulo":"Proteus mirabilis","items":[{"n":"1","nombre":"Proteus","ver":"Una criatura mitológica marina, mitad hombre barbudo y mitad pulpo, de pie en un baño público.","clinica":"Proteus mirabilis (un bacilo gram-negativo).","sketchy":"\"Proteus\" es el dios marino griego que da nombre directo a la bacteria, siendo el personaje la clave mnemotécnica principal.","literal":"Proteus mirabilis (a gram-negative bacillus)"},{"n":"2","nombre":"Red hues","ver":"Tonos rojizos y rosados en las puertas y paredes del baño.","clinica":"Proteus mirabilis es un bacilo gram-negativo.","sketchy":"El color rojo refuerza la tinción gram-negativa.","literal":"Proteus mirabilis is a gram-negative bacillus"},{"n":"3","nombre":"Swarming tentacles","ver":"Múltiples tentáculos verdes extendiéndose y expandiéndose por todo el piso del baño.","clinica":"Proteus mirabilis demuestra una notable motilidad en enjambre (swarming motility) en placas de cultivo de agar.","sketchy":"Los tentáculos que se extienden en todas direcciones son la representación visual literal de la motilidad en enjambre sobre el agar.","literal":"Proteus mirabilis demonstrates notable swarming motility on agar culture plates"},{"n":"4","nombre":"Staghorn helmet","ver":"Un casco dorado con astas de ciervo (staghorn) sobre la cabeza del personaje.","clinica":"Las infecciones con bacterias ureasa-positivas como Proteus mirabilis pueden llevar a la formación de cálculos coraliformes (staghorn calculi / cálculos de estruvita) en el tracto urinario, que son cálculos renales que se asemejan a astas de ciervo. Estos cálculos se forman dentro de la pelvis renal, causando dolor renal y daño.","sketchy":"Las astas de ciervo del casco son la representación literal directa de los cálculos \"en asta de ciervo\" (staghorn calculi).","literal":"Infections with urease-positive bacteria like Proteus mirabilis can lead to the formation of staghorn calculi (struvite stones) in the urinary tract, which are kidney stones resembling stag horns. These stones form within the renal pelvis, causing kidney pain and impairment, significantly contributing to Proteus' defense and infection strategies."},{"n":"5","nombre":"Ammonia bottle","ver":"Un frasco rociador amarillo etiquetado \"NH₃\" que sostiene el personaje.","clinica":"Proteus mirabilis produce ureasa (es decir, ureasa positivo), una enzima que hidroliza la urea en dióxido de carbono y amoníaco, elevando el pH urinario y creando un ambiente alcalino que promueve la precipitación de cálculos de fosfato amónico magnésico (estruvita). Estos cálculos pueden causar dolor, daño al tracto urinario y servir como nido para infecciones recurrentes por Proteus.","sketchy":"El frasco etiquetado \"NH₃\" representa directamente el amoníaco producido por la ureasa, símbolo recurrente en las bacterias ureasa-positivas.","literal":"Proteus mirabilis produces urease (i.e. urease positive), an enzyme that hydrolyzes urea into carbon dioxide and ammonia, raising urine pH and creating an alkaline environment that promotes precipitation of magnesium ammonium phosphate (struvite) stones. These stones can cause pain, urinary tract damage, and serve as a nidus for recurrent Proteus infections"},{"n":"6","nombre":"Stone","ver":"Una piedra grande que sostiene el personaje en su mano levantada.","clinica":"Proteus mirabilis produce ureasa (es decir, ureasa positivo), una enzima que hidroliza la urea en dióxido de carbono y amoníaco, elevando el pH urinario y creando un ambiente alcalino que promueve la precipitación de cálculos de fosfato amónico magnésico (estruvita).","sketchy":"La piedra es la representación literal directa de los cálculos de estruvita formados en el ambiente alcalino.","literal":"Proteus mirabilis produces urease (i.e. urease positive), an enzyme that hydrolyzes urea into carbon dioxide and ammonia, raising urine pH and creating an alkaline environment that promotes precipitation of magnesium ammonium phosphate (struvite) stones. These stones can cause pain, urinary tract damage, and serve as a nidus for recurrent Proteus infections"},{"n":"7","nombre":"Peeing","ver":"Una gran mancha en la puerta del cubículo y un urinario a la derecha, con alguien orinando dentro del baño.","clinica":"Proteus mirabilis es un agente causal común de infecciones del tracto urinario, a menudo asociado con casos complicados o tractos urinarios anormales.","sketchy":"El escenario del baño con orina representa directamente el tracto urinario como sitio principal de infección.","literal":"Proteus mirabilis is a common causative agent of urinary tract infections, often associated with complicated cases or abnormal urinary tracts"},{"n":"8","nombre":"Stinky fish","ver":"Varios peces plateados esparcidos entre los tentáculos y por el piso del baño.","clinica":"Proteus mirabilis produce un olor característico a pescado.","sketchy":"Los peces malolientes son la representación literal directa del olor a pescado característico de esta bacteria.","literal":"Proteus mirabilis produces a characteristic fishy odor"},{"n":"9","nombre":"Eggs","ver":"Huevos, algunos rotos, en el piso del baño cerca de los tentáculos.","clinica":"El trimetoprim-sulfametoxazol (una sulfonamida) es activo contra Proteus mirabilis y se usa comúnmente en el tratamiento de infecciones urinarias no complicadas causadas por este organismo.","sketchy":"Los huevos (con su olor a azufre al pudrirse) representan las \"sulfas\", símbolo recurrente de Sketchy para las sulfonamidas.","literal":"Trimethoprim-sulfamethoxazole (a sulfonamide) is active against Proteus mirabilis and commonly used in the treatment of uncomplicated urinary tract infections caused by this organism"}],"mapa":"imagenes/proteus-mirabilis-mapa.webp","texto":"imagenes/proteus-mirabilis-texto.webp"}]},{"nombre":"Virus","codigo":"vi","temas":[{"slug":"poliomavirus-jc-bk","titulo":"Poliomavirus JC y BK (Polyomaviridae)","items":[{"n":"1","nombre":"Cool colors","ver":"Toda la escena del senado romano pintada en tonos fríos: azules, grises y blancos.","clinica":"Los poliomavirus (ej. virus JC, virus BK) son virus ADN ubicuos en la población general; la enfermedad clínica típicamente aparece solo cuando el sistema inmune está debilitado.","sketchy":"Los colores fríos son la convención fija de Sketchy para los virus de ADN (los cálidos marcan los de ARN).","literal":"Polyomaviruses (e.g., JC virus, BK virus) are DNA viruses that are ubiquitous in the general population; clinical disease typically appears only when the immune system is weakened"},{"n":"2","nombre":"Circular room + double stranded DNA design","ver":"Una sala circular con cúpula, decorada con un friso de doble hélice de ADN que recorre las paredes.","clinica":"Los poliomavirus son virus ADN circulares de doble cadena.","sketchy":"La forma circular de la sala marca el genoma circular, y el friso de doble hélice la doble cadena.","literal":"Polyomaviruses are circular, double-stranded DNA viruses"},{"n":"3","nombre":"Statue of David","ver":"Una estatua desnuda tipo David de Miguel Ángel, de pie al fondo de la sala.","clinica":"Los poliomavirus carecen de envoltura, clasificándolos como virus desnudos.","sketchy":"La estatua \"desnuda\" (naked) es la representación literal de un virus sin envoltura.","literal":"Polyomaviruses lack envelopes, classifying them as naked viruses"},{"n":"4","nombre":"Julius Caesar","ver":"Julio César con toga y corona de laurel, en el centro de la escena, siendo apuñalado.","clinica":"Virus JC o virus John Cunningham (un virus ADN de la familia Polyomaviridae).","sketchy":"Las iniciales de \"Julius Caesar\" son J.C., clave mnemotécnica directa del virus JC.","literal":"JC virus or John Cunningham virus (a DNA virus in the Polyomaviridae family)"},{"n":"5","nombre":"Immunocompromised cane","ver":"Un bastón de madera apoyado junto a uno de los senadores.","clinica":"El virus JC afecta predominantemente a individuos inmunocomprometidos, a menudo reactivándose en situaciones como infección por VIH u otras condiciones inmunosupresoras, y se considera una enfermedad definitoria de SIDA cuando ocurre en pacientes infectados por VIH.","sketchy":"El bastón es el símbolo fijo de Sketchy para el paciente inmunocomprometido.","literal":"The JC virus predominantly affects immunocompromised individuals, often reactivating in situations such as HIV infection or other immunosuppressive conditions, and is considered an AIDS-defining illness when it occurs in HIV-infected patients"},{"n":"6","nombre":"AIDS ribbon","ver":"Un lazo rojo prendido en la toga de Julio César.","clinica":"El virus JC afecta predominantemente a individuos inmunocomprometidos, a menudo reactivándose en infección por VIH u otras condiciones inmunosupresoras, y se considera una enfermedad definitoria de SIDA cuando ocurre en pacientes con VIH.","sketchy":"El lazo rojo es el símbolo universal del VIH/SIDA, señalando la condición predisponente clave.","literal":"The JC virus predominantly affects immunocompromised individuals, often reactivating in situations such as HIV infection or other immunosuppressive conditions, and is considered an AIDS-defining illness when it occurs in HIV-infected patients"},{"n":"7","nombre":"\"Senator Count 200\"","ver":"Un cartel colgado en la pared que dice \"SENATOR COUNT 200\".","clinica":"El virus JC tiene más probabilidad de reactivarse en pacientes con VIH que tienen un recuento de CD4+ por debajo de 200.","sketchy":"El \"conteo de senadores\" es el conteo de CD4+, y el número 200 es el umbral exacto de riesgo.","literal":"JC virus is more likely to reactivate in HIV patients who have a CD4+ count below 200"},{"n":"8","nombre":"\"PML\" bust","ver":"Un busto de mármol sobre un pedestal grabado con las letras \"PML\".","clinica":"El virus JC puede causar leucoencefalopatía multifocal progresiva (PML), una enfermedad cerebral rara y a menudo fatal, vista predominantemente en individuos inmunocomprometidos; el nombre refleja la patología: \"progresiva\" porque empeora con el tiempo, \"multifocal\" porque involucra múltiples regiones cerebrales, y \"leucoencefalopatía\" porque afecta la sustancia blanca por desmielinización.","sketchy":"Las letras \"PML\" grabadas en el pedestal son la clave mnemotécnica literal de la enfermedad.","literal":"The JC virus can cause progressive multifocal leukoencephalopathy (PML), a rare and often fatal brain disease predominantly seen in immunocompromised individuals; the name progressive multifocal leukoencephalopathy reflects the pathology seen in the disease: \"progressive\" because it worsens over time, \"multifocal\" because multiple brain regions are involved, and \"leukoencephalopathy\" because it affects the white matter through demyelination"},{"n":"9","nombre":"Peeling table legs","ver":"Las patas de madera de la mesa con la capa exterior descascarándose y pelándose.","clinica":"La PML causa desmielinización por destrucción de oligodendrocitos mediada por el virus JC, alterando la conducción nerviosa y llevando a déficits neurológicos progresivos, afectando a menudo la sustancia blanca parietal y occipital y resultando en hemiparesia, defectos del campo visual y deterioro cognitivo.","sketchy":"Las patas \"peladas\" representan los axones perdiendo su vaina de mielina (la capa que los recubre).","literal":"PML causes demyelination from JC virus–mediated destruction of oligodendrocytes, disrupting nerve conduction and leading to progressive neurological deficits, often affecting parietal and occipital white matter and resulting in hemiparesis, visual field defects, and cognitive impairment"},{"n":"10","nombre":"White laurel leaves","ver":"La corona de laurel de Julio César, de color blanco brillante.","clinica":"La PML, vista en resonancia magnética, se presenta con lesiones desmielinizantes multifocales no realzantes en la sustancia blanca subcortical y periventricular, típicamente sin efecto de masa ni edema; las lesiones aparecen brillantes (blancas) por la desmielinización, pero no realzan porque la barrera hematoencefálica está intacta.","sketchy":"El color blanco brillante de la corona representa las lesiones brillantes en la resonancia, y el hecho de estar sobre la cabeza señala la afectación cerebral.","literal":"PML, as visualized on MRI scans, presents with shows non-enhancing, multifocal demyelinating lesions in the subcortical and periventricular white matter, typically without mass effect or edema; lesions appear bright (white) due to demyelination, but don't enhance because the blood–brain barrier is intact"},{"n":"11","nombre":"Brutus' knife","ver":"Un cuchillo ensangrentado empuñado por un personaje que apuñala a César.","clinica":"Virus BK (un virus ADN de la familia Polyomaviridae).","sketchy":"\"Brutus' Knife\" da las iniciales B.K., clave mnemotécnica directa del virus BK.","literal":"BK virus (a DNA virus in the Polyomaviridae family)"},{"n":"12","nombre":"Flank stab wound","ver":"Una herida sangrante en el costado (flanco) de Julio César.","clinica":"En situaciones de inmunosupresión, el virus BK puede reactivarse y potencialmente llevar a nefropatía asociada a virus BK, que puede presentarse como disfunción renal progresiva y aumento de los niveles de creatinina sérica en receptores de trasplante renal.","sketchy":"La puñalada en el flanco señala la localización de los riñones, marcando la nefropatía por BK.","literal":"In situations of immunosuppression, BK virus can reactivate and potentially lead to BK virus-associated nephropathy; which may present as progressive renal dysfunction and rising serum creatinine levels in kidney transplant recipients"},{"n":"13","nombre":"Crotch blood","ver":"Una estatua de querubín orinando sangre hacia una fuente marcada \"BK\".","clinica":"En pacientes inmunocomprometidos, la infección por virus BK puede llevar a cistitis hemorrágica, una inflamación de la vejiga que causa hematuria y micción dolorosa.","sketchy":"El querubín orinando sangre es la representación literal de la hematuria de la cistitis hemorrágica.","literal":"In immunocompromised patients, BK virus infection can lead to hemorrhagic cystitis, an inflammation of the bladder causing hematuria and painful urination"},{"n":"14","nombre":"Organs","ver":"Órganos (riñones y otros) conservados en una caja con hielo, a la izquierda de la escena.","clinica":"La nefropatía asociada a virus BK ocurre más comúnmente en receptores de trasplante renal por reactivación viral bajo inmunosupresión, llevando a nefritis tubulointersticial y falla del injerto; en pacientes con trasplante de células madre hematopoyéticas (TCMH), el virus BK causa más a menudo cistitis hemorrágica.","sketchy":"Los órganos en hielo representan directamente los órganos de trasplante, contexto principal de esta infección.","literal":"BK virus-associated nephropathy most commonly occurs in kidney transplant recipients due to viral reactivation under immunosuppression, leading to tubulointerstitial nephritis and graft failure; in hematopoietic stem cell transplant (HSCT) patients, BK virus more often causes hemorrhagic cystitis"}],"mapa":"imagenes/poliomavirus-jc-bk-mapa.webp","texto":"imagenes/poliomavirus-jc-bk-texto.webp"}]},{"nombre":"Patología GI","codigo":"pa","temas":[{"slug":"crohn-colitis-ulcerosa","titulo":"Enfermedad de Crohn y Colitis Ulcerosa","items":[{"n":"1","nombre":"Fiery intestines","ver":"Una chispa/llama azul brillante en el centro de la escena de construcción urbana.","clinica":"Enfermedad inflamatoria intestinal (EII) (colitis ulcerosa y enfermedad de Crohn).","sketchy":"La chispa/llama es el símbolo fijo de \"inflamación\" en toda la serie, presentando el tema general de la EII.","literal":"inflammatory bowel disease (IBD) (ulcerative colitis and Crohn disease)"},{"n":"2","nombre":"Young white guy","ver":"Un trabajador joven corriendo con un extintor por la escena.","clinica":"La EII es más común en personas jóvenes de ascendencia caucásica y judía.","sketchy":"El trabajador \"joven\" representa directamente el grupo etario y demográfico de mayor riesgo.","literal":"IBD is most common in young people with Caucasian and Jewish ancestry"},{"n":"3","nombre":"Fiery hat","ver":"Un casco de trabajo con humo/fuego saliendo de él.","clinica":"La EII se presenta con fiebre.","sketchy":"El casco \"en llamas\" representa directamente la fiebre.","literal":"IBD presents with fever"},{"n":"4","nombre":"Thin guy","ver":"Un trabajador delgado corriendo por la escena.","clinica":"La EII se presenta con pérdida de peso.","sketchy":"La delgadez del trabajador representa directamente la pérdida de peso.","literal":"IBD presents with weight loss"},{"n":"5","nombre":"Clutching abdomen","ver":"Un trabajador sosteniéndose el abdomen con dolor.","clinica":"La EII se presenta con dolor abdominal.","sketchy":"El gesto de sostenerse el abdomen representa directamente el dolor abdominal.","literal":"IBD presents with abdominal pain"},{"n":"6","nombre":"Brown puddle","ver":"Un charco de líquido marrón en el suelo.","clinica":"La EII se presenta con diarrea.","sketchy":"El charco marrón es la representación literal directa de la diarrea.","literal":"IBD presents with diarrhea"},{"n":"7","nombre":"Union Cannon","ver":"Un cañón/herramienta de construcción con un letrero de sindicato (union).","clinica":"Colitis Ulcerosa.","sketchy":"\"Union Cannon\" con \"U\" resaltada da la clave literal para \"Ulcerative Colitis\".","literal":"Ulcerative colitis"},{"n":"8","nombre":"Rusty rectal stool","ver":"Un banquito oxidado en el suelo de la escena.","clinica":"La colitis ulcerosa SIEMPRE afecta el recto.","sketchy":"\"Stool\" (banquito/heces) es el juego de palabras fijo de la serie; su ubicación fija representa que SIEMPRE afecta el recto.","literal":"ulcerative colitis ALWAYS affects the rectum"},{"n":"9","nombre":"Rust traveling proximally","ver":"Óxido extendiéndose progresivamente hacia estructuras más alejadas.","clinica":"La colitis ulcerosa se extiende de forma proximal desde el recto (en un patrón CONTINUO).","sketchy":"El óxido \"viajando proximalmente\" representa la extensión continua de la enfermedad.","literal":"ulcerative colitis spreads proximally from rectum (in a CONTINUOUS pattern)"},{"n":"10","nombre":"Smooth end of cannon","ver":"El extremo liso de un tubo/cañón, visible en un cartel publicitario \"Las Vegas\".","clinica":"En la colitis ulcerosa, el colon tiene una apariencia \"en tubo de plomo\" (lead pipe) en el enema de contraste (por pérdida de las proyecciones haustrales normales).","sketchy":"El extremo \"liso\" del tubo representa literalmente la apariencia lisa en tubo de plomo.","literal":"in ulcerative colitis, the colon has a \"lead pipe\" appearance on contrast enema (due to loss of normal haustral projections)"},{"n":"11","nombre":"First responders with perinuclear battle plan","ver":"Trabajadores de emergencia (first responders) alrededor de un plano de batalla.","clinica":"Los pANCA (anticuerpos citoplasmáticos antineutrófilos perinucleares) están elevados en la colitis ulcerosa.","sketchy":"\"Perinuclear\" en el plan de batalla es la clave literal directa de \"perinuclear ANCA\" (pANCA).","literal":"pANCA (PERInuclear anti-neutrophil cytoplasmic antibodies) are elevated in ulcerative colitis"},{"n":"12","nombre":"Eroding through 2 layers","ver":"Un agujero erosionando dos capas de una estructura.","clinica":"En la colitis ulcerosa, la inflamación afecta SOLO la mucosa y submucosa.","sketchy":"La erosión \"de 2 capas\" representa literalmente las dos capas afectadas (mucosa y submucosa).","literal":"in ulcerative colitis, inflammation affects ONLY the mucosa and submucosa"},{"n":"13","nombre":"Dirt islands in hole","ver":"Islas de tierra dentro de un agujero en el pavimento.","clinica":"En la colitis ulcerosa, el colon contiene \"pseudopólipos\" (islas de mucosa normal dentro de tejido ulcerado).","sketchy":"Las \"islas de tierra\" (mucosa normal) rodeadas de agujero (tejido ulcerado) representan los pseudopólipos.","literal":"in ulcerative colitis, the colon contains \"pseudopolyps\" (islands of normal mucosa within ulcerated tissue)"},{"n":"14","nombre":"Inflamed cannonball within wall","ver":"Una bola de cañón inflamada incrustada dentro de una pared.","clinica":"En histología, la colitis ulcerosa muestra abscesos dentro de las criptas colónicas.","sketchy":"La \"bola de cañón inflamada\" dentro de la pared representa el absceso dentro de la cripta.","literal":"on histology, ulcerative colitis displays abscesses within colonic crypts (containing aggregations of macrophages)"},{"n":"15","nombre":"Shrapnel striking left side","ver":"Metralla (shrapnel) golpeando el lado izquierdo de un personaje.","clinica":"La colitis ulcerosa se presenta con dolor abdominal del lado IZQUIERDO (por su localización en recto y colon distal).","sketchy":"El impacto en el lado \"izquierdo\" representa directamente la localización del dolor.","literal":"ulcerative colitis presents with LEFT-sided abdominal pain (due to location in rectum and distal colon)"},{"n":"16","nombre":"Bloody puddle","ver":"Un charco de líquido rojo/sanguinolento en el suelo.","clinica":"La colitis ulcerosa se presenta con diarrea sanguinolenta (frecuente y de bajo volumen, debido a irritación rectal).","sketchy":"El charco \"sanguinolento\" es la representación literal directa de la diarrea con sangre.","literal":"ulcerative colitis presents with bloody diarrhea (frequent and small volume due to rectal irritation)"},{"n":"17","nombre":"MEGA cannon","ver":"Un cañón/haz de luz de gran tamaño (MEGA) proyectado sobre la escena.","clinica":"La colitis ulcerosa puede causar megacolon tóxico (la inflamación se extiende al músculo liso colónico → parálisis del músculo liso → dilatación colónica severa).","sketchy":"\"MEGA\" es la clave literal directa para \"megacolon\".","literal":"ulcerative colitis can cause toxic megacolon (inflammation extends to colonic smooth muscle → smooth muscle paralysis → severe colonic dilation)"},{"n":"18","nombre":"Exploding cannon","ver":"Llamas y explosión cerca del cañón de luz.","clinica":"En la colitis ulcerosa, el megacolon tóxico puede llevar a perforación.","sketchy":"La \"explosión\" representa directamente la perforación intestinal.","literal":"in ulcerative colitis, toxic megacolon can lead to perforation"},{"n":"19","nombre":"Cancer crab belt","ver":"Un cangrejo en un letrero/insignia sobre la casa central de la escena.","clinica":"La colitis ulcerosa aumenta el riesgo de cáncer de colon (mayor factor de riesgo que la enfermedad de Crohn).","sketchy":"El cangrejo (símbolo de cáncer) representa el riesgo aumentado de malignización.","literal":"ulcerative colitis increases the risk of colon cancer (bigger risk factor than Crohn disease)"},{"n":"20","nombre":"Scaly snake flag in biliary tree","ver":"Una bandera con una serpiente escamosa sobre el techo de la casa (que representa el árbol biliar).","clinica":"La colitis ulcerosa está altamente asociada con la colangitis esclerosante primaria (un trastorno autoinmune de los conductos biliares).","sketchy":"La serpiente \"escamosa\" (scaly) representa \"sclerosing\" (esclerosante), y el techo con forma de árbol biliar marca el sitio afectado.","literal":"ulcerative colitis is highly associated with primary sclerosing cholangitis (an autoimmune disorder of the bile ducts)"},{"n":"21","nombre":"Cobblestone patches","ver":"Parches de adoquines (cobblestone) irregulares en el suelo.","clinica":"La enfermedad de Crohn afecta el intestino de forma discontinua, llevando a la formación de \"lesiones salteadas\" (skip lesions) (áreas enfermas con tejido normal entremedio).","sketchy":"Los \"parches de adoquines\" en zonas discontinuas representan literalmente las lesiones salteadas.","literal":"Crohn disease affects the bowel in a discontinuous fashion, leading to formation of \"skip lesions\" (diseased areas with normal bowel in between)"},{"n":"22","nombre":"Cobblestone path from mouth to anus arch","ver":"Un camino de adoquines que se extiende desde un extremo hasta un arco al otro extremo de la escena.","clinica":"La enfermedad de Crohn puede afectar CUALQUIER porción del tracto GI (desde la boca hasta el ano).","sketchy":"El camino continuo \"de un extremo a otro\" representa que la enfermedad puede afectar cualquier tramo del tracto GI.","literal":"Crohn disease can affect ANY portion of the GI tract (from mouth to anus)"},{"n":"23","nombre":"Antibody sac","ver":"Una bolsa/saco cerca de la casa, con estructura tipo anticuerpo.","clinica":"Los anticuerpos anti-Saccharomyces cerevisiae a menudo están presentes en la enfermedad de Crohn.","sketchy":"El \"saco de anticuerpos\" (antibody sac) representa directamente los anticuerpos anti-Saccharomyces.","literal":"anti-saccharomyces cerevisiae antibodies are often present in Crohn disease"},{"n":"24","nombre":"Hit on right waist","ver":"Un golpe/impacto en el lado derecho de la cintura de un personaje.","clinica":"La enfermedad de Crohn se presenta con dolor abdominal en fosa ilíaca derecha (RLQ) (debido a su localización en íleon y ciego).","sketchy":"El golpe en el lado \"derecho\" representa directamente la localización del dolor.","literal":"Crohn disease presents with RLQ abdominal pain (due to location in ileum and cecum)"},{"n":"25","nombre":"Debris-littered brown puddle","ver":"Un charco marrón lleno de escombros y residuos.","clinica":"La enfermedad de Crohn se presenta con malabsorción de grasas y vitaminas liposolubles (la inflamación del íleon distal → mala reabsorción de ácidos biliares → absorción de grasa alterada).","sketchy":"El charco \"lleno de escombros\" representa la malabsorción y el contenido graso no absorbido.","literal":"Crohn disease presents with malabsorption of fats and fat-soluble vitamins (inflammation of distal ileum → poor reabsorption of bile acids → impaired absorption of fat)"},{"n":"26","nombre":"MacroCAGES","ver":"Jaulas (cages) etiquetadas visibles en un contenedor de la escena.","clinica":"La enfermedad de Crohn causa formación de granulomas no caseificantes (que contienen agregaciones de macrófagos).","sketchy":"\"MacroCAGES\" combina \"macrophage\" con \"cages\" (jaulas que agrupan/contienen), representando la agregación de macrófagos en el granuloma.","literal":"Crohn disease causes formation of noncaseating granulomas (containing aggregations of macrophages)"},{"n":"27","nombre":"Broken through all wall layers","ver":"Una estructura rota que atraviesa todas las capas de una pared.","clinica":"La enfermedad de Crohn causa inflamación TRANSMURAL del intestino.","sketchy":"El daño \"a través de todas las capas\" es la representación literal directa de \"transmural\".","literal":"Crohn disease causes TRANSMURAL bowel inflammation"},{"n":"28","nombre":"Tight abdominal gauze","ver":"Una gasa/venda apretada alrededor del abdomen de un personaje.","clinica":"La enfermedad de Crohn puede causar estenosis fibróticas (la inflamación transmural → engrosamiento de la pared intestinal → estrechamiento del lumen).","sketchy":"La gasa \"apretada\" representa directamente el estrechamiento del lumen intestinal.","literal":"Crohn disease can cause fibrotic strictures (transmural inflammation → bowel wall thickening → narrowed lumen)"},{"n":"29","nombre":"Pulling strings","ver":"Cuerdas/cordones tirantes tendidos entre estructuras de la escena.","clinica":"En la enfermedad de Crohn, la radiografía muestra el \"signo de la cuerda\" (string sign) (debido a estenosis).","sketchy":"Las cuerdas tirantes representan literalmente el \"string sign\" radiológico.","literal":"in Crohn disease, X-ray shows \"string sign\" (due to strictures)"},{"n":"30","nombre":"Obstructing rocks","ver":"Rocas/troncos obstruyendo el camino de la escena.","clinica":"En la enfermedad de Crohn, las estenosis pueden causar obstrucción intestinal.","sketchy":"Las rocas \"obstruyendo\" el camino representan directamente la obstrucción intestinal.","literal":"in Crohn disease, strictures can cause bowel obstruction"},{"n":"31","nombre":"Fistulizing trench","ver":"Una zanja/trinchera (trench) profunda conectando dos áreas de la escena.","clinica":"La enfermedad de Crohn puede llevar a fístulas (la inflamación transmural lleva a epitelización a través de la pared intestinal → conexiones entre intestino y vejiga, piel, vagina, u otros segmentos intestinales).","sketchy":"La \"trinchera\" conectando dos puntos representa literalmente el trayecto fistuloso.","literal":"Crohn disease can lead to fistulas (transmural inflammation leads to epithelization across bowel wall → connections between bowel and bladder, skin, vagina, or other bowel segments)"},{"n":"32","nombre":"Pale erosions on mouth arch","ver":"Erosiones pálidas visibles en el arco de una estructura similar a una boca.","clinica":"La enfermedad de Crohn causa úlceras aftosas en la boca y el esófago.","sketchy":"Las erosiones pálidas en el \"arco de la boca\" representan directamente las úlceras aftosas.","literal":"Crohn disease causes aphthous ulcers in the mouth and esophagus"},{"n":"33","nombre":"Wrapped joints","ver":"Articulaciones envueltas/vendadas en uno de los trabajadores.","clinica":"La enfermedad inflamatoria intestinal puede causar artritis (poliartritis migratoria, sacroileítis, espondilitis anquilosante) (a menudo asociada con HLA-B27).","sketchy":"Las articulaciones \"envueltas\" representan directamente la afectación articular (artritis).","literal":"inflammatory bowel disease can cause arthritis (migratory polyarthritis, sacroiliitis, ankylosing spondylitis)(often HLA-B27)"},{"n":"34","nombre":"Red spots on shin columns","ver":"Manchas rojas en las espinillas (shin) de un personaje.","clinica":"La enfermedad inflamatoria intestinal puede causar eritema nodoso (erupción nodular eritematosa dolorosa en las espinillas) (por inflamación de células grasas).","sketchy":"Las manchas rojas en las espinillas son la representación literal directa del eritema nodoso.","literal":"inflammatory bowel disease can cause erythema nodosum (painful erythematous nodular rash on shins)(due to inflammation of fat cells)"},{"n":"35","nombre":"Skin wounds","ver":"Heridas cutáneas visibles en uno de los trabajadores.","clinica":"La enfermedad inflamatoria intestinal puede causar pioderma gangrenoso (úlceras cutáneas por disfunción de neutrófilos) (no infeccioso ni gangrenoso).","sketchy":"Las heridas cutáneas representan directamente las úlceras del pioderma gangrenoso.","literal":"inflammatory bowel disease can cause pyoderma gangrenosum (skin ulcers due to neutrophil dysfunction) (not infectious or gangrenous)"},{"n":"36","nombre":"Shrapnel on kidney tray","ver":"Fragmentos de metralla sobre una bandeja con forma de riñón.","clinica":"La enfermedad inflamatoria intestinal puede causar cálculos renales (por absorción aumentada de oxalato).","sketchy":"Los fragmentos sobre la bandeja-riñón representan directamente los cálculos renales.","literal":"inflammatory bowel disease can cause renal calculi (due to increased absorption of oxalate)"},{"n":"37","nombre":"Red-rimmed goggles","ver":"Gafas de protección con bordes rojos que lleva puestas un personaje.","clinica":"La enfermedad inflamatoria intestinal puede causar enfermedad ocular (uveítis anterior, iritis, epiescleritis) (se presenta con dolor ocular y enrojecimiento).","sketchy":"El borde \"rojo\" de las gafas representa directamente el enrojecimiento ocular.","literal":"inflammatory bowel disease can cause eye disease (anterior uveitis, iritis, episcleritis)(presents with eye pain and redness)"},{"n":"38","nombre":"5-pointed star of USA","ver":"Una estrella de 5 puntas en un cartel/bandera de la escena.","clinica":"La enfermedad inflamatoria intestinal se trata con 5-ASA (sulfasalazina, mesalamina).","sketchy":"La estrella \"de 5 puntas\" es la clave numérica literal directa para \"5-ASA\".","literal":"inflammatory bowel disease is treated with 5-ASA (sulfasalazine, mesalamine)"}]},{"slug":"polipos-colorrectales-cancer","titulo":"Pólipos colorrectales y cáncer","items":[{"n":"1","nombre":"Mushroom caps","ver":"Una gran casa-hongo con sombrero moteado, punto de partida de todo el pueblo \"Lillypolypton Village\".","clinica":"Los pólipos son excrecencias de la mucosa que se encuentran más comúnmente en el colon (pueden ser pedunculados o sésiles) (pueden ser neoplásicos o no neoplásicos).","sketchy":"Los \"sombreros de hongo\" (mushroom caps) son la representación literal directa de los pólipos, excrecencias con forma de hongo sobre la mucosa.","literal":"polyps are outgrowths of mucosa most commonly found in the colon (may be pedunculated or sessile) (may be neoplastic or non-neoplastic)"},{"n":"2","nombre":"Hamartomatous hammer","ver":"Un gnomo sosteniendo un martillo, cerca de la entrada del pueblo.","clinica":"Pólipos HAMARTOMATOSOS (no neoplásicos).","sketchy":"\"Hammer\" (martillo) suena fonéticamente similar al inicio de \"hamartomatous\".","literal":"HAMARTOMATOUS polyps (non-neoplastic)"},{"n":"3","nombre":"Disorganized welcome sign","ver":"Un cartel de madera desordenado que dice \"Welcome to Lillypolypton Village!\".","clinica":"Los pólipos HAMARTOMATOSOS son crecimientos desorganizados de células maduras.","sketchy":"El cartel \"desorganizado\" representa literalmente el crecimiento desorganizado de estos pólipos.","literal":"HAMARTOMATOUS polyps are disorganized growths of mature cells"},{"n":"4","nombre":"Happy old guy","ver":"Un gnomo mayor de aspecto feliz cerca de la entrada.","cl
