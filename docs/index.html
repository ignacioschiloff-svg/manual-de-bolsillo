ing\".","literal":"Inflammation of the peritoneum can lead to long and thin, string-like adhesions that adhere to the capsule of the liver (referred to as 'violin string' adhesions)"},{"n":"18","nombre":"Fallen statue with cracks on one knee","ver":"Una estatua caída (fallen statue) con grietas en una rodilla (cracks on one knee).","clinica":"La infección gonocócica diseminada puede causar poliartritis ASIMÉTRICA, a menudo involucrando la rodilla.","sketchy":"La \"estatua caída con grietas en una sola rodilla\" (asimétrica) representa directamente la poliartritis asimétrica, típicamente en la rodilla.","literal":"Disseminated gonococcal infection can cause asymmetric polyarthritis, often involving the knee"},{"n":"19","nombre":"Quickly covering baby's eyes","ver":"Alguien cubriendo rápidamente los ojos de un bebé (quickly covering baby's eyes).","clinica":"N. gonorrhoeae puede transmitirse a recién nacidos durante el paso por el canal de parto, causando conjuntivitis neonatal purulenta y severa de inicio TEMPRANO (dentro de 5 días) (también conocida como oftalmia neonatorum).","sketchy":"\"Cubrir rápidamente los ojos del bebé\" representa la conjuntivitis neonatal de inicio temprano y su afectación ocular.","literal":"N. gonorrhoeae can be transmitted to newborns during passage through the birth canal, causing early-onset (within 5 days) purulent and severe neonatal conjunctivitis (a.k.a ophthalmia neonatorum)"},{"n":"20","nombre":"Statue with three axes and emblem on wall","ver":"Una estatua con tres hachas (three axes) y un emblema en la pared del bar.","clinica":"La ceftriaxona es un tratamiento de elección para tratar infecciones por Neisseria gonorrhoeae.","sketchy":"Las \"tres hachas\" son la clave numérica literal directa de \"cefalosporina de TERCERA generación\" (ceftriaxona).","literal":"Ceftriaxone is a treatment of choice for treating Neisseria gonorrhoeae infections"},{"n":"21","nombre":"Shell shaped napkins","ver":"Servilletas con forma de concha (shell shaped napkins) sobre la mesa.","clinica":"El tratamiento presuntivo para Chlamydia trachomatis (ej. azitromicina o doxiciclina) se recomienda debido a la frecuente coinfección de gonorrea-clamidia.","sketchy":"Las \"servilletas con forma de concha\" (clam = almeja) representan fonéticamente \"Chlamydia\" (clam-idia).","literal":"Presumptive treatment for Chlamydia trachomatis (e.g., azithromycin or doxycycline) is recommended due to frequent gonorrhea-chlamydia coinfection."}]},{"slug":"proteus-mirabilis","titulo":"Proteus mirabilis","items":[{"n":"1","nombre":"Proteus","ver":"Una criatura mitológica marina, mitad hombre barbudo y mitad pulpo, de pie en un baño público.","clinica":"Proteus mirabilis (un bacilo gram-negativo).","sketchy":"\"Proteus\" es el dios marino griego que da nombre directo a la bacteria, siendo el personaje la clave mnemotécnica principal.","literal":"Proteus mirabilis (a gram-negative bacillus)"},{"n":"2","nombre":"Red hues","ver":"Tonos rojizos y rosados en las puertas y paredes del baño.","clinica":"Proteus mirabilis es un bacilo gram-negativo.","sketchy":"El color rojo refuerza la tinción gram-negativa.","literal":"Proteus mirabilis is a gram-negative bacillus"},{"n":"3","nombre":"Swarming tentacles","ver":"Múltiples tentáculos verdes extendiéndose y expandiéndose por todo el piso del baño.","clinica":"Proteus mirabilis demuestra una notable motilidad en enjambre (swarming motility) en placas de cultivo de agar.","sketchy":"Los tentáculos que se extienden en todas direcciones son la representación visual literal de la motilidad en enjambre sobre el agar.","literal":"Proteus mirabilis demonstrates notable swarming motility on agar culture plates"},{"n":"4","nombre":"Staghorn helmet","ver":"Un casco dorado con astas de ciervo (staghorn) sobre la cabeza del personaje.","clinica":"Las infecciones con bacterias ureasa-positivas como Proteus mirabilis pueden llevar a la formación de cálculos coraliformes (staghorn calculi / cálculos de estruvita) en el tracto urinario, que son cálculos renales que se asemejan a astas de ciervo. Estos cálculos se forman dentro de la pelvis renal, causando dolor renal y daño.","sketchy":"Las astas de ciervo del casco son la representación literal directa de los cálculos \"en asta de ciervo\" (staghorn calculi).","literal":"Infections with urease-positive bacteria like Proteus mirabilis can lead to the formation of staghorn calculi (struvite stones) in the urinary tract, which are kidney stones resembling stag horns. These stones form within the renal pelvis, causing kidney pain and impairment, significantly contributing to Proteus' defense and infection strategies."},{"n":"5","nombre":"Ammonia bottle","ver":"Un frasco rociador amarillo etiquetado \"NH₃\" que sostiene el personaje.","clinica":"Proteus mirabilis produce ureasa (es decir, ureasa positivo), una enzima que hidroliza la urea en dióxido de carbono y amoníaco, elevando el pH urinario y creando un ambiente alcalino que promueve la precipitación de cálculos de fosfato amónico magnésico (estruvita). Estos cálculos pueden causar dolor, daño al tracto urinario y servir como nido para infecciones recurrentes por Proteus.","sketchy":"El frasco etiquetado \"NH₃\" representa directamente el amoníaco producido por la ureasa, símbolo recurrente en las bacterias ureasa-positivas.","literal":"Proteus mirabilis produces urease (i.e. urease positive), an enzyme that hydrolyzes urea into carbon dioxide and ammonia, raising urine pH and creating an alkaline environment that promotes precipitation of magnesium ammonium phosphate (struvite) stones. These stones can cause pain, urinary tract damage, and serve as a nidus for recurrent Proteus infections"},{"n":"6","nombre":"Stone","ver":"Una piedra grande que sostiene el personaje en su mano levantada.","clinica":"Proteus mirabilis produce ureasa (es decir, ureasa positivo), una enzima que hidroliza la urea en dióxido de carbono y amoníaco, elevando el pH urinario y creando un ambiente alcalino que promueve la precipitación de cálculos de fosfato amónico magnésico (estruvita).","sketchy":"La piedra es la representación literal directa de los cálculos de estruvita formados en el ambiente alcalino.","literal":"Proteus mirabilis produces urease (i.e. urease positive), an enzyme that hydrolyzes urea into carbon dioxide and ammonia, raising urine pH and creating an alkaline environment that promotes precipitation of magnesium ammonium phosphate (struvite) stones. These stones can cause pain, urinary tract damage, and serve as a nidus for recurrent Proteus infections"},{"n":"7","nombre":"Peeing","ver":"Una gran mancha en la puerta del cubículo y un urinario a la derecha, con alguien orinando dentro del baño.","clinica":"Proteus mirabilis es un agente causal común de infecciones del tracto urinario, a menudo asociado con casos complicados o tractos urinarios anormales.","sketchy":"El escenario del baño con orina representa directamente el tracto urinario como sitio principal de infección.","literal":"Proteus mirabilis is a common causative agent of urinary tract infections, often associated with complicated cases or abnormal urinary tracts"},{"n":"8","nombre":"Stinky fish","ver":"Varios peces plateados esparcidos entre los tentáculos y por el piso del baño.","clinica":"Proteus mirabilis produce un olor característico a pescado.","sketchy":"Los peces malolientes son la representación literal directa del olor a pescado característico de esta bacteria.","literal":"Proteus mirabilis produces a characteristic fishy odor"},{"n":"9","nombre":"Eggs","ver":"Huevos, algunos rotos, en el piso del baño cerca de los tentáculos.","clinica":"El trimetoprim-sulfametoxazol (una sulfonamida) es activo contra Proteus mirabilis y se usa comúnmente en el tratamiento de infecciones urinarias no complicadas causadas por este organismo.","sketchy":"Los huevos (con su olor a azufre al pudrirse) representan las \"sulfas\", símbolo recurrente de Sketchy para las sulfonamidas.","literal":"Trimethoprim-sulfamethoxazole (a sulfonamide) is active against Proteus mirabilis and commonly used in the treatment of uncomplicated urinary tract infections caused by this organism"}],"mapa":"imagenes/proteus-mirabilis-mapa.webp","texto":"imagenes/proteus-mirabilis-texto.webp"}]},{"nombre":"Virus","codigo":"vi","temas":[{"slug":"poliomavirus-jc-bk","titulo":"Poliomavirus JC y BK (Polyomaviridae)","items":[{"n":"1","nombre":"Cool colors","ver":"Toda la escena del senado romano pintada en tonos fríos: azules, grises y blancos.","clinica":"Los poliomavirus (ej. virus JC, virus BK) son virus ADN ubicuos en la población general; la enfermedad clínica típicamente aparece solo cuando el sistema inmune está debilitado.","sketchy":"Los colores fríos son la convención fija de Sketchy para los virus de ADN (los cálidos marcan los de ARN).","literal":"Polyomaviruses (e.g., JC virus, BK virus) are DNA viruses that are ubiquitous in the general population; clinical disease typically appears only when the immune system is weakened"},{"n":"2","nombre":"Circular room + double stranded DNA design","ver":"Una sala circular con cúpula, decorada con un friso de doble hélice de ADN que recorre las paredes.","clinica":"Los poliomavirus son virus ADN circulares de doble cadena.","sketchy":"La forma circular de la sala marca el genoma circular, y el friso de doble hélice la doble cadena.","literal":"Polyomaviruses are circular, double-stranded DNA viruses"},{"n":"3","nombre":"Statue of David","ver":"Una estatua desnuda tipo David de Miguel Ángel, de pie al fondo de la sala.","clinica":"Los poliomavirus carecen de envoltura, clasificándolos como virus desnudos.","sketchy":"La estatua \"desnuda\" (naked) es la representación literal de un virus sin envoltura.","literal":"Polyomaviruses lack envelopes, classifying them as naked viruses"},{"n":"4","nombre":"Julius Caesar","ver":"Julio César con toga y corona de laurel, en el centro de la escena, siendo apuñalado.","clinica":"Virus JC o virus John Cunningham (un virus ADN de la familia Polyomaviridae).","sketchy":"Las iniciales de \"Julius Caesar\" son J.C., clave mnemotécnica directa del virus JC.","literal":"JC virus or John Cunningham virus (a DNA virus in the Polyomaviridae family)"},{"n":"5","nombre":"Immunocompromised cane","ver":"Un bastón de madera apoyado junto a uno de los senadores.","clinica":"El virus JC afecta predominantemente a individuos inmunocomprometidos, a menudo reactivándose en situaciones como infección por VIH u otras condiciones inmunosupresoras, y se considera una enfermedad definitoria de SIDA cuando ocurre en pacientes infectados por VIH.","sketchy":"El bastón es el símbolo fijo de Sketchy para el paciente inmunocomprometido.","literal":"The JC virus predominantly affects immunocompromised individuals, often reactivating in situations such as HIV infection or other immunosuppressive conditions, and is considered an AIDS-defining illness when it occurs in HIV-infected patients"},{"n":"6","nombre":"AIDS ribbon","ver":"Un lazo rojo prendido en la toga de Julio César.","clinica":"El virus JC afecta predominantemente a individuos inmunocomprometidos, a menudo reactivándose en infección por VIH u otras condiciones inmunosupresoras, y se considera una enfermedad definitoria de SIDA cuando ocurre en pacientes con VIH.","sketchy":"El lazo rojo es el símbolo universal del VIH/SIDA, señalando la condición predisponente clave.","literal":"The JC virus predominantly affects immunocompromised individuals, often reactivating in situations such as HIV infection or other immunosuppressive conditions, and is considered an AIDS-defining illness when it occurs in HIV-infected patients"},{"n":"7","nombre":"\"Senator Count 200\"","ver":"Un cartel colgado en la pared que dice \"SENATOR COUNT 200\".","clinica":"El virus JC tiene más probabilidad de reactivarse en pacientes con VIH que tienen un recuento de CD4+ por debajo de 200.","sketchy":"El \"conteo de senadores\" es el conteo de CD4+, y el número 200 es el umbral exacto de riesgo.","literal":"JC virus is more likely to reactivate in HIV patients who have a CD4+ count below 200"},{"n":"8","nombre":"\"PML\" bust","ver":"Un busto de mármol sobre un pedestal grabado con las letras \"PML\".","clinica":"El virus JC puede causar leucoencefalopatía multifocal progresiva (PML), una enfermedad cerebral rara y a menudo fatal, vista predominantemente en individuos inmunocomprometidos; el nombre refleja la patología: \"progresiva\" porque empeora con el tiempo, \"multifocal\" porque involucra múltiples regiones cerebrales, y \"leucoencefalopatía\" porque afecta la sustancia blanca por desmielinización.","sketchy":"Las letras \"PML\" grabadas en el pedestal son la clave mnemotécnica literal de la enfermedad.","literal":"The JC virus can cause progressive multifocal leukoencephalopathy (PML), a rare and often fatal brain disease predominantly seen in immunocompromised individuals; the name progressive multifocal leukoencephalopathy reflects the pathology seen in the disease: \"progressive\" because it worsens over time, \"multifocal\" because multiple brain regions are involved, and \"leukoencephalopathy\" because it affects the white matter through demyelination"},{"n":"9","nombre":"Peeling table legs","ver":"Las patas de madera de la mesa con la capa exterior descascarándose y pelándose.","clinica":"La PML causa desmielinización por destrucción de oligodendrocitos mediada por el virus JC, alterando la conducción nerviosa y llevando a déficits neurológicos progresivos, afectando a menudo la sustancia blanca parietal y occipital y resultando en hemiparesia, defectos del campo visual y deterioro cognitivo.","sketchy":"Las patas \"peladas\" representan los axones perdiendo su vaina de mielina (la capa que los recubre).","literal":"PML causes demyelination from JC virus–mediated destruction of oligodendrocytes, disrupting nerve conduction and leading to progressive neurological deficits, often affecting parietal and occipital white matter and resulting in hemiparesis, visual field defects, and cognitive impairment"},{"n":"10","nombre":"White laurel leaves","ver":"La corona de laurel de Julio César, de color blanco brillante.","clinica":"La PML, vista en resonancia magnética, se presenta con lesiones desmielinizantes multifocales no realzantes en la sustancia blanca subcortical y periventricular, típicamente sin efecto de masa ni edema; las lesiones aparecen brillantes (blancas) por la desmielinización, pero no realzan porque la barrera hematoencefálica está intacta.","sketchy":"El color blanco brillante de la corona representa las lesiones brillantes en la resonancia, y el hecho de estar sobre la cabeza señala la afectación cerebral.","literal":"PML, as visualized on MRI scans, presents with shows non-enhancing, multifocal demyelinating lesions in the subcortical and periventricular white matter, typically without mass effect or edema; lesions appear bright (white) due to demyelination, but don't enhance because the blood–brain barrier is intact"},{"n":"11","nombre":"Brutus' knife","ver":"Un cuchillo ensangrentado empuñado por un personaje que apuñala a César.","clinica":"Virus BK (un virus ADN de la familia Polyomaviridae).","sketchy":"\"Brutus' Knife\" da las iniciales B.K., clave mnemotécnica directa del virus BK.","literal":"BK virus (a DNA virus in the Polyomaviridae family)"},{"n":"12","nombre":"Flank stab wound","ver":"Una herida sangrante en el costado (flanco) de Julio César.","clinica":"En situaciones de inmunosupresión, el virus BK puede reactivarse y potencialmente llevar a nefropatía asociada a virus BK, que puede presentarse como disfunción renal progresiva y aumento de los niveles de creatinina sérica en receptores de trasplante renal.","sketchy":"La puñalada en el flanco señala la localización de los riñones, marcando la nefropatía por BK.","literal":"In situations of immunosuppression, BK virus can reactivate and potentially lead to BK virus-associated nephropathy; which may present as progressive renal dysfunction and rising serum creatinine levels in kidney transplant recipients"},{"n":"13","nombre":"Crotch blood","ver":"Una estatua de querubín orinando sangre hacia una fuente marcada \"BK\".","clinica":"En pacientes inmunocomprometidos, la infección por virus BK puede llevar a cistitis hemorrágica, una inflamación de la vejiga que causa hematuria y micción dolorosa.","sketchy":"El querubín orinando sangre es la representación literal de la hematuria de la cistitis hemorrágica.","literal":"In immunocompromised patients, BK virus infection can lead to hemorrhagic cystitis, an inflammation of the bladder causing hematuria and painful urination"},{"n":"14","nombre":"Organs","ver":"Órganos (riñones y otros) conservados en una caja con hielo, a la izquierda de la escena.","clinica":"La nefropatía asociada a virus BK ocurre más comúnmente en receptores de trasplante renal por reactivación viral bajo inmunosupresión, llevando a nefritis tubulointersticial y falla del injerto; en pacientes con trasplante de células madre hematopoyéticas (TCMH), el virus BK causa más a menudo cistitis hemorrágica.","sketchy":"Los órganos en hielo representan directamente los órganos de trasplante, contexto principal de esta infección.","literal":"BK virus-associated nephropathy most commonly occurs in kidney transplant recipients due to viral reactivation under immunosuppression, leading to tubulointerstitial nephritis and graft failure; in hematopoietic stem cell transplant (HSCT) patients, BK virus more often causes hemorrhagic cystitis"}],"mapa":"imagenes/poliomavirus-jc-bk-mapa.webp","texto":"imagenes/poliomavirus-jc-bk-texto.webp"}]},{"nombre":"Patología GI","codigo":"pa","temas":[{"slug":"cirrosis-patogenesis-manifestaciones","titulo":"Cirrosis: patogénesis y manifestaciones clínicas","items":[{"n":"1","nombre":"Stone liver","ver":"Un hígado de piedra en el centro de la escena mitológica griega.","clinica":"Cirrosis (fibrosis irreversible del hígado).","sketchy":"El \"hígado de piedra\" representa literalmente la fibrosis irreversible (endurecimiento) del órgano.","literal":"cirrhosis (irreversible fibrosis of the liver)"},{"n":"2","nombre":"Alcoholic","ver":"Un personaje bebiendo alcohol de una botella junto al mar.","clinica":"El uso crónico de alcohol es la causa más común de cirrosis.","sketchy":"El personaje \"alcohólico\" representa directamente la causa más común de cirrosis.","literal":"chronic alcohol use is the most common cause of cirrhosis"},{"n":"3","nombre":"Hippo armor","ver":"Una armadura con motivo de hipopótamo (hippo) en un guerrero de la escena.","clinica":"La hepatitis viral crónica (Hepatitis C y B) puede causar cirrosis.","sketchy":"\"Hippo\" es el símbolo mnemotécnico fijo de Sketchy para \"hepatitis\" (Hepa- = Hippo).","literal":"chronic viral hepatitis (Hep C and B) can cause cirrhosis"},{"n":"4","nombre":"Antibody arrows","ver":"Flechas con forma de anticuerpo (antibody) disparadas por un arquero.","clinica":"Las enfermedades autoinmunes (ej. hepatitis autoinmune, cirrosis biliar primaria, colangitis esclerosante primaria) pueden causar cirrosis.","sketchy":"Las \"flechas con forma de anticuerpo\" representan directamente el ataque autoinmune al hígado.","literal":"autoimmune diseases (e.g. autoimmune hepatitis, primary biliary cirrhosis, primary sclerosing cholangitis) can cause cirrhosis"},{"n":"5","nombre":"AA shears","ver":"Un par de tijeras (shears) marcadas \"AA\" en la escena.","clinica":"La deficiencia de alfa-1 antitripsina (AAT) puede causar cirrosis.","sketchy":"\"AA\" en las tijeras es la clave literal directa de \"Alpha-1 Antitrypsin\", y las tijeras representan la falta de la proteína protectora (recortando/dañando).","literal":"alpha-1 antitrypsin deficiency (AAT) can cause cirrhosis"},{"n":"6","nombre":"Copper Kayser-Fleischer rings","ver":"Anillos de color cobre (copper) alrededor de los ojos de un guerrero.","clinica":"La enfermedad de Wilson puede causar cirrosis.","sketchy":"Los \"anillos de Kayser-Fleischer\" (de cobre, alrededor del iris) son el signo clásico de la enfermedad de Wilson (acumulación de cobre).","literal":"Wilson disease can cause cirrhosis"},{"n":"7","nombre":"Iron weight","ver":"Un peso de hierro (iron weight) marcado \"Fe\" sostenido por un guerrero.","clinica":"La hemocromatosis puede causar cirrosis.","sketchy":"El \"peso de hierro\" (Fe) representa directamente la sobrecarga de hierro de la hemocromatosis.","literal":"hemochromatosis can cause cirrhosis"},{"n":"8","nombre":"\"The Space of Disse\"","ver":"Un cartel que dice \"Beware! The Space of Disse!\" en la escena costera.","clinica":"El espacio perisinusoidal (espacio de Disse) está ubicado entre los sinusoides (compuestos de células endoteliales, que transportan sangre) y los hepatocitos.","sketchy":"El cartel \"The Space of Disse\" es la clave literal directa del espacio perisinusoidal.","literal":"the perisinusoidal space (space of Disse) is located between the sinusoids (composed of endothelial cells, carry blood) and hepatocytes"},{"n":"9","nombre":"Stars in the space","ver":"Estrellas visibles en el cielo nocturno sobre el \"espacio de Disse\".","clinica":"Las células estrelladas (stellate cells) en el espacio perisinusoidal se transforman en miofibroblastos que producen exceso de colágeno, llevando a cirrosis.","sketchy":"Las \"estrellas\" (stars) representan literalmente las células estrelladas (stellate cells).","literal":"stellate cells in the perisinusoidal space transform into myofibroblasts that produce excess collagen, leading to cirrhosis"},{"n":"10","nombre":"Fibrotic shrubbery","ver":"Arbustos fibrosos (shrubbery) alrededor de las fuentes en la escena.","clinica":"Los miofibroblastos (células estrelladas activadas) depositan colágeno desorganizado en el espacio perisinusoidal → fibrosis (en cirrosis).","sketchy":"El \"arbusto fibroso\" representa literalmente el depósito de colágeno desorganizado (fibrosis).","literal":"myofibroblasts (activated stellate cells) deposit disorganized collagen in perisinusoidal space → fibrosis (in cirrhosis)"},{"n":"11","nombre":"Blossoming lilies","ver":"Lirios floreciendo (blossoming) en las fuentes de agua.","clinica":"Las células madre hepáticas crean nuevos hepatocitos en respuesta a la lesión celular (en cirrosis).","sketchy":"Los lirios \"floreciendo\" (nuevos brotes) representan la creación de nuevos hepatocitos.","literal":"liver stem cells create new hepatocytes in response to cell injury (in cirrhosis)"},{"n":"12","nombre":"Regenerative fountains","ver":"Fuentes de agua regenerativas (regenerative fountains) en la escena.","clinica":"Los nódulos regenerativos consisten en islas de hepatocitos proliferantes (en cirrosis).","sketchy":"Las \"fuentes regenerativas\" representan literalmente los nódulos regenerativos.","literal":"regenerative nodules consist of islands of proliferating hepatocytes (in cirrhosis)"},{"n":"13","nombre":"Shrubbery around fountains","ver":"Arbustos rodeando las fuentes regenerativas.","clinica":"El depósito de colágeno en el espacio perisinusoidal → bandas de fibrosis rodean los nódulos regenerativos (en cirrosis).","sketchy":"Los \"arbustos rodeando\" las fuentes representan las bandas de fibrosis rodeando los nódulos regenerativos.","literal":"collagen deposition in perisinusoidal space → bands of fibrosis surround regenerative nodules (in cirrhosis)"},{"n":"14","nombre":"Compressed sinusoidal snake","ver":"Una serpiente comprimida (compressed) serpenteando por la escena.","clinica":"La fibrosis extensa → compresión de los sinusoides → aumento de la presión intrasinusoidal (en cirrosis).","sketchy":"La \"serpiente comprimida\" representa literalmente los sinusoides comprimidos por la fibrosis.","literal":"widespread fibrosis → compression of sinusoids → increased intrasinusoidal pressure (in cirrhosis)"},{"n":"15","nombre":"Cracked PORThole","ver":"Una ventana/portilla (porthole) agrietada en la estructura de piedra.","clinica":"El aumento de la presión intrasinusoidal (debido a fibrosis) → aumento de la presión en el sistema venoso portal (hipertensión portal).","sketchy":"\"PORThole\" con \"PORT\" resaltado es la clave literal directa de \"PORTal hypertension\".","literal":"increased intrasinusoidal pressure (due to fibrosis) → increased pressure in portal venous system (portal hypertension)"},{"n":"16","nombre":"Diamond pattern","ver":"Un patrón de diamantes (diamond pattern) en una estructura de la escena.","clinica":"Los sinusoides normales tienen fenestraciones para el intercambio de solutos entre la sangre y los hepatocitos (facilita la desintoxicación de la sangre).","sketchy":"El \"patrón de diamante\" (con espacios/aberturas) representa las fenestraciones normales de los sinusoides.","literal":"normal sinusoids have fenestrations for exchange of solutes between blood hepatocytes (facilitates detoxification of blood)"},{"n":"17","nombre":"Shrinking diamond pattern","ver":"El patrón de diamante encogiéndose (shrinking) o cerrándose.","clinica":"En cirrosis, la fibrosis crea una matriz extracelular más gruesa → encoge las fenestraciones → disminuye el intercambio de solutos entre sangre y hepatocitos → disminuye la detoxificación de la sangre.","sketchy":"El patrón \"encogiéndose\" representa literalmente el cierre de las fenestraciones por la fibrosis.","literal":"in a cirrhosis, fibrosis creates a thicker extracellular matrix → shrinks fenestrations → decreased exchange of solutes between blood and hepatocytes → ↓ detoxification of blood"},{"n":"18","nombre":"Blood dripping from stone pot","ver":"Sangre goteando (dripping) de una vasija de piedra rota.","clinica":"La cirrosis puede causar coagulopatía (moretones fáciles, sangrado prolongado tras lesión, sangrado en articulaciones, accidente cerebrovascular hemorrágico) debido a la síntesis disminuida de factores de coagulación (función sintética alterada).","sketchy":"La \"sangre goteando\" de la vasija de piedra (hígado) representa la coagulopatía por función sintética alterada.","literal":"cirrhosis can cause coagulopathy (easy bruising, prolonged bleeding after injury, bleeding into joints, hemorrhagic stroke) due to decreased synthesis of clotting factors (impaired synthetic function of liver)"},{"n":"19","nombre":"Raised ParaTrooper","ver":"Un paracaidista (ParaTrooper) elevándose en la escena.","clinica":"La coagulopatía en enfermedad hepática causa un tiempo de protrombina (PT) prolongado y un INR elevado.","sketchy":"\"ParaTrooper\" con \"PT\" resaltado es la clave literal directa del tiempo de protrombina prolongado, mismo símbolo usado en DIC.","literal":"coagulopathy in liver disease causes a prolonged prothrombin time (PT) and elevated INR"},{"n":"20","nombre":"Zeus extrinsically flying into scene","ver":"Zeus volando \"extrínsecamente\" (extrinsically) hacia la escena, sosteniendo un escudo.","clinica":"El PT mide la vía EXTRÍNSECA de coagulación (anormalmente elevada en cirrosis debido a niveles disminuidos de factores de coagulación hepáticos II, VII [vida media más corta], IX y X).","sketchy":"\"Extrinsically\" describe directamente la vía extrínseca medida por el PT.","literal":"PT measures the EXTRINSIC clotting pathway (abnormally elevated in cirrhosis due to decreased levels of HEPATIC coagulation factors II, VII [shortest half-life], IX, and X)"},{"n":"21","nombre":"Falling photo album","ver":"Un álbum de fotos cayendo (falling) al suelo.","clinica":"La cirrosis puede causar hipoalbuminemia (función sintética alterada).","sketchy":"El \"álbum cayendo\" (album = albumin, albúmina) representa la hipoalbuminemia (nivel bajo de albúmina).","literal":"cirrhosis → hypoalbuminemia (impaired synthetic function)"},{"n":"22","nombre":"Poofy pants","ver":"Pantalones hinchados/inflados (poofy pants) que viste un personaje.","clinica":"La cirrosis puede causar edema periférico (la hipoalbuminemia → disminución de la presión oncótica sérica) (marcador TARDÍO de disfunción hepática).","sketchy":"Los \"pantalones hinchados\" representan literalmente el edema periférico.","literal":"cirrhosis can cause peripheral edema (hypoalbuminemia → decreased serum oncotic pressure) (LATE marker of liver dysfunction)"},{"n":"23","nombre":"Falling bones","ver":"Huesos cayendo (falling) en la escena.","clinica":"La cirrosis puede causar disminución de los niveles séricos TOTALES de calcio debido a hipoalbuminemia (disminución del calcio unido a albúmina) con niveles de calcio IONIZADO normales.","sketchy":"Los \"huesos cayendo\" representan la disminución del calcio total (que se une al hueso).","literal":"cirrhosis can cause decreased TOTAL serum calcium levels due to hypoalbuminemia (decreased calcium bound to albumin) with normal IONIZED calcium levels"},{"n":"24","nombre":"\"I\" bone not falling","ver":"Un hueso marcado \"I\" que NO cae, a diferencia de los demás.","clinica":"En cirrosis, el calcio sérico IONIZADO es normal (por lo tanto no hay síntomas de hipocalcemia, a pesar de la disminución del calcio sérico TOTAL).","sketchy":"\"I\" (Ionized = ionizado) en el hueso que \"no cae\" representa que el calcio ionizado permanece normal.","literal":"in cirrhosis, IONIZED serum calcium is normal (therefore no symptoms of hypocalcemia, despite ↓ TOTAL serum calcium)"},{"n":"25","nombre":"Broken sun pots","ver":"Vasijas con forma de sol (sun pots) rotas en el suelo.","clinica":"La cirrosis puede causar deficiencia de vitamina D (síntesis disminuida de 25-hidroxilasa → niveles disminuidos de 25-OH Vitamina D) [función sintética alterada del hígado].","sketchy":"Las \"vasijas de sol rotas\" representan la vitamina D (asociada al sol) deficiente.","literal":"cirrhosis can cause Vitamin D deficiency (decreased synthesis of 25-hydroxylase → decreased levels of 25-OH Vitamin D) [impaired synthetic function of liver]"},{"n":"26","nombre":"Falling candy","ver":"Dulces cayendo (falling candy) en la escena.","clinica":"La cirrosis puede causar hipoglucemia en ayuno (debido a disminución de la glucogenólisis y gluconeogénesis).","sketchy":"Los \"dulces cayendo\" (azúcar/glucosa) representan la hipoglucemia.","literal":"cirrhosis can cause fasting hypoglycemia (due to decreased glycogenolysis and gluconeogenesis)"},{"n":"27","nombre":"Collard billygoat","ver":"Una cabra (billygoat) con collar (collar) en la escena.","clinica":"En cirrosis, la secreción alterada de bilirrubina conjugada hacia la bilis → hiperbilirrubinemia conjugada (función de detoxificación alterada del hígado).","sketchy":"La cabra \"con collar\" (collared = conjugated, conjugada) representa la hiperbilirrubinemia conjugada.","literal":"in cirrhosis, impaired secretion of conjugated bilirubin into bile → conjugated hyperbilirubinemia (impaired detox function of liver)"},{"n":"28","nombre":"Un-collared billygoat","ver":"Otra cabra SIN collar (un-collared) en la escena.","clinica":"En cirrosis severa, la conjugación disminuida de bilirrubina en el hígado → hiperbilirrubinemia NO conjugada (además de la hiperbilirrubinemia conjugada).","sketchy":"La cabra \"sin collar\" (un-collared = unconjugated, no conjugada) representa la hiperbilirrubinemia no conjugada adicional.","literal":"in severe cirrhosis, decreased conjugation of bilirubin in the liver → unconjugated hyperbilirubinemia (in addition to conjugated hyperbilirubinemia)"},{"n":"29","nombre":"Yellow goat","ver":"Una cabra de color amarillento (yellow goat) en la escena.","clinica":"En cirrosis, el aumento de la bilirrubina sérica → ictericia.","sketchy":"La cabra \"amarilla\" es la representación literal directa de la ictericia.","literal":"in cirrhosis, increased serum bilirubin → jaundice"},{"n":"30","nombre":"NH3 spray bottle","ver":"Una botella rociadora etiquetada \"NH3\" en la escena.","clinica":"En cirrosis, ↓ metabolismo del amoníaco vía el ciclo de la urea → ↑ amoníaco sérico y ↓ urea sérica (función de detoxificación alterada).","sketchy":"La botella etiquetada \"NH3\" representa directamente el amoníaco acumulado, símbolo recurrente en la serie.","literal":"in cirrhosis, ↓ metabolism of ammonia via the urea cycle → ↑ serum ammonia and ↓ serum urea (impaired detox function)"},{"n":"31","nombre":"Clutching head","ver":"Un personaje sosteniéndose la cabeza (clutching head) con dolor.","clinica":"En cirrosis, el aumento del amoníaco sérico cruza la barrera hematoencefálica → encefalopatía hepática.","sketchy":"El gesto de \"sostenerse la cabeza\" representa la encefalopatía hepática.","literal":"in cirrhosis, increased serum ammonia crosses blood-brain barrier → hepatic encephalopathy"},{"n":"32","nombre":"Swirly eyes","ver":"Ojos en espiral/mareados (swirly eyes) en un personaje.","clinica":"La encefalopatía hepática puede manifestarse como estado mental alterado, convulsiones, coma, o incluso la muerte.","sketchy":"Los \"ojos en espiral\" representan directamente el estado mental alterado.","literal":"hepatic encephalopathy can manifest as altered mental status, seizures, coma, or even death"},{"n":"33","nombre":"Pegasus's flapping wings","ver":"Las alas aleteando (flapping) de Pegaso en la escena.","clinica":"La encefalopatía hepática puede presentarse con asterixis (temblor de aleteo de las manos).","sketchy":"Las \"alas aleteando\" son la representación literal directa de la asterixis (temblor de aleteo).","literal":"hepatic encephalopathy can present with asterixis (flapping tremor of the hands)"},{"n":"34","nombre":"Aromatic benzene armor","ver":"Una armadura con anillos de benceno (benzene armor) que viste un guerrero.","clinica":"La encefalopatía hepática resulta de la conversión de aminoácidos aromáticos (fenilalanina, triptófano) en falsos neurotransmisores (en lugar de su metabolización a urea).","sketchy":"Los \"anillos de benceno\" representan literalmente los aminoácidos AROMÁTICOS (con estructura de anillo aromático).","literal":"hepatic encephalopathy results from conversion of aromatic amino acids (phenylalanine, tryptophan) into false neurotransmitters (instead of metabolization into urea)"},{"n":"35","nombre":"Female symbol","ver":"Un símbolo femenino (♀) visible en la escena.","clinica":"En cirrosis, el metabolismo alterado de estrógeno y androstenediona (que se aromatiza a estrógeno) lleva a niveles séricos de estrógeno ELEVADOS (función de detoxificación alterada del hígado).","sketchy":"El \"símbolo femenino\" representa directamente el estrógeno elevado.","literal":"in cirrhosis, impaired metabolism of estrogen and androstenedione (which is aromatized to estrogen) leads to elevated serum estrogen levels (impaired detox function of liver)"},{"n":"36","nombre":"Red gloves","ver":"Guantes rojos (red gloves) que lleva puestos un personaje.","clinica":"En cirrosis, el estrógeno sérico elevado causa eritema palmar.","sketchy":"Los \"guantes rojos\" son la representación literal directa del eritema palmar.","literal":"in cirrhosis, elevated serum estrogen causes palmar erythema"},{"n":"37","nombre":"Two round shields","ver":"Dos escudos redondos (round shields) sostenidos por un guerrero.","clinica":"En hombres con cirrosis, el ↑ estrógeno sérico causa ginecomastia.","sketchy":"Los \"dos escudos redondos\" (sobre el pecho) representan literalmente la ginecomastia.","literal":"in men with cirrhosis, ↑ serum estrogen causes gynecomastia"},{"n":"38","nombre":"Floppy sword","ver":"Una espada blanda/caída (floppy sword) sostenida por un guerrero.","clinica":"En hombres con cirrosis, el estrógeno sérico elevado → aumento de la globulina fijadora de hormonas sexuales → disminución de testosterona libre → disfunción eréctil.","sketchy":"La \"espada blanda\" es la representación literal directa de la disfunción eréctil.","literal":"in men with cirrhosis, elevated serum estrogen causes increased sex-hormone binding globulin → decreased free testosterone → erectile dysfunction"},{"n":"39","nombre":"Red spider","ver":"Una araña roja (red spider) con patas extendidas en la escena.","clinica":"En cirrosis, el estrógeno sérico elevado causa telangiectasia vascular (\"angiomas en araña\") en tronco, cara y brazos.","sketchy":"La \"araña roja\" es la representación literal directa de los \"spider angiomas\" (angiomas en araña).","literal":"in cirrhosis, elevated serum estrogen causes vascular telangiectasias (\"spider angiomas\") on trunk, face, and arms"},{"n":"40","nombre":"PORThole in the cave","ver":"Una ventana/portilla (porthole) en la pared de la cueva.","clinica":"El sistema venoso portal se encuentra con el sistema venoso sistémico en sitios de anastomosis portocava (esófago distal, recto distal, venas superficiales de la pared abdominal).","sketchy":"\"PORThole\" repite la clave literal de \"PORTal\", representando el sistema venoso portal.","literal":"the portal venous system meets the systemic venous system at sites of portacaval anastomosis (distal esophagus, distal rectum, superficial veins of abdominal wall)"},{"n":"41","nombre":"Snakes in throat","ver":"Serpientes (snakes) saliendo de la garganta de una estatua.","clinica":"La hipertensión portal puede causar várices esofágicas y gástricas.","sketchy":"Las \"serpientes en la garganta\" (esófago) representan literalmente las várices esofágicas y gástricas.","literal":"portal hypertension can cause esophageal and gastric varices"},{"n":"42","nombre":"Snakes from gluteal pillar","ver":"Serpientes saliendo de un pilar en la zona glútea (gluteal) de la escena.","clinica":"La hipertensión portal puede causar várices rectales.","sketchy":"Las \"serpientes del pilar glúteo\" (recto) representan literalmente las várices rectales.","literal":"portal hypertension can cause rectal varices"},{"n":"43","nombre":"Medusa's head","ver":"La cabeza de Medusa con serpientes como cabello, esculpida en piedra.","clinica":"La hipertensión portal → venas paraumbilicales congestionadas (\"cabeza de medusa\" o \"caput medusae\").","sketchy":"La \"cabeza de Medusa\" es la representación literal directa del signo clínico \"caput medusae\".","literal":"portal HTN → engorged paraumbilical veins (\"caput medusae\")"},{"n":"44","nombre":"Blood spilling from mouth","ver":"Sangre derramándose (spilling) de la boca de una estatua.","clinica":"En hipertensión portal, las várices esofágicas y gástricas pueden romperse → hematemesis masiva.","sketchy":"La \"sangre saliendo de la boca\" es la representación literal directa de la hematemesis masiva.","literal":"in portal hypertension, esophageal and gastric varices can rupture → massive hematemesis"},{"n":"45","nombre":"Large spleen shield","ver":"Un escudo grande con forma de bazo (spleen shield) sostenido por una guerrera.","clinica":"La hipertensión portal → esplenomegalia y disfunción esplénica.","sketchy":"El \"escudo grande con forma de bazo\" representa directamente la esplenomegalia.","literal":"portal hypertension → splenomegaly and splenic dysfunction"},{"n":"46","nombre":"Broken armor plates","ver":"Placas de armadura rotas (broken armor plates) cayendo en la escena.","clinica":"En hipertensión portal, la disfunción esplénica → secuestro de plaquetas → trombocitopenia.","sketchy":"Las \"placas rotas\" (plates = platelets, plaquetas) representan el secuestro y la trombocitopenia.","literal":"in portal hypertension, splenic dysfunction → sequestration of platelets → thrombocytopenia"},{"n":"47","nombre":"Increased midsection pressure","ver":"Presión aumentada visible en la sección media (midsection) de un personaje.","clinica":"La cirrosis puede causar ascitis (el aumento de la presión portal empuja líquido hacia el espacio de Disse → sobrepasa el sistema linfático → el líquido se escapa hacia la cavidad peritoneal).","sketchy":"La \"presión aumentada en la sección media\" (abdomen) representa directamente la ascitis.","literal":"cirrhosis can cause ascites (increased portal pressure squeezes fluid into space of Disse → overwhelms lymphatic system → fluid leaks into peritoneal cavity)"},{"n":"48","nombre":"Inflamed tail around abdomen","ver":"Una cola inflamada (inflamed tail) enrollada alrededor del abdomen de una criatura marina.","clinica":"El líquido rico en proteínas de la ascitis puede infectarse con bacterias entéricas, llevando a peritonitis bacteriana espontánea (SBP), que se presenta con fiebre, dolor abdominal, o estado mental alterado.","sketchy":"La \"cola inflamada alrededor del abdomen\" representa la infección/inflamación de la peritonitis bacteriana espontánea.","literal":"protein-rich fluid in ascites can become infected by enteric bacteria, leading to spontaneous bacterial peritonitis (SBP), which presents with fever, abdominal pain, or altered mental status"},{"n":"49","nombre":"Pink rattle tail","ver":"Una cola de cascabel (rattle tail) de color rosado.","clinica":"La SBP usualmente es causada por E. coli u otros bacilos gram-negativos.","sketchy":"La \"cola rosada\" representa la tinción gram-negativa (rosada) de las bacterias causantes.","literal":"SBP is usually caused by E. coli or other gram negative rods"},{"n":"50","nombre":"Falling helmet","ver":"Un casco cayendo (falling) en la escena.","clinica":"La SBP puede causar estado mental alterado.","sketchy":"El \"casco cayendo\" (de la cabeza) representa el estado mental alterado.","literal":"SBP can cause altered mental status"},{"n":"51","nombre":"Rain umbrella shield","ver":"Un escudo con forma de paraguas (umbrella) protegiendo de la lluvia.","clinica":"La cirrosis → activación del sistema renina-angiotensina-aldosterona (RAAS) (volumen intravascular disminuido → gasto cardíaco disminuido → activación del RAAS) (exacerbado por el hígado incapaz de metabolizar la aldosterona).","sketchy":"El \"paraguas\" (protección contra la lluvia = retención de líquido) representa la activación del sistema RAAS.","literal":"cirrhosis → activation of the renin-angiotensin-aldosterone system (decreased intravascular volume → decreased cardiac output → RAAS activation) (exacerbated by liver unable to metabolize aldosterone)"},{"n":"52","nombre":"Falling bananas","ver":"Plátanos (bananas) cayendo en la escena.","clinica":"La cirrosis puede causar hipopotasemia (el hígado incapaz de metabolizar la aldosterona → aumento del intercambio renal de sodio por potasio → disminución del potasio sérico).","sketchy":"Los \"plátanos cayendo\" (potasio) representan directamente la hipopotasemia.","literal":"cirrhosis can cause hypokalemia (liver unable to metabolize aldosterone → increased renal exchange of sodium for potassium → decreased serum potassium)"},{"n":"53","nombre":"Falling peanuts","ver":"Maní (peanuts) cayendo en la escena.","clinica":"La cirrosis puede causar hiponatremia (volumen intravascular disminuido → secreción de hormona antidiurética [ADH] → la retención de agua diluye el sodio sérico).","sketchy":"Los \"maníes cayendo\" (sal/sodio) representan directamente la hiponatremia.","literal":"cirrhosis can cause hyponatremia (decreased intravascular volume → secretion of antidiuretic hormone [ADH] → water retention dilutes serum sodium)"},{"n":"54","nombre":"Cracked kidney canteen","ver":"Una cantimplora (canteen) con forma de riñón, agrietada (cracked).","clinica":"La cirrosis severa puede causar síndrome hepatorrenal (falla renal sin enfermedad renal primaria).","sketchy":"La \"cantimplora-riñón agrietada\" representa directamente la falla renal del síndrome hepatorrenal.","literal":"severe cirrhosis can cause hepatorenal syndrome (renal failure without primary kidney disease)"},{"n":"55","nombre":"Dilated splanchnic snake","ver":"Una serpiente dilatada (dilated) con temática esplácnica (splanchnic) en la escena.","clinica":"La cirrosis puede causar vasodilatación de las arterias esplácnicas (GI) (en síndrome hepatorrenal).","sketchy":"La \"serpiente dilatada\" representa literalmente la vasodilatación de las arterias esplácnicas.","literal":"cirrhosis can cause vasodilation of splanchnic (GI) arteries (in hepatorenal syndrome)"},{"n":"56","nombre":"Gaseous fog","ver":"Una niebla gaseosa (gaseous fog) cubriendo parte de la escena.","clinica":"La vasodilatación de las arterias esplácnicas se debe al óxido nítrico aumentado (número disminuido de macrófagos de Kupffer en el hígado → niveles más altos de ADN bacteriano en sangre → liberación de óxido nítrico) (en síndrome hepatorrenal).","sketchy":"La \"niebla gaseosa\" representa literalmente el óxido nítrico (gas) causante de la vasodilatación.","literal":"vasodilation of splanchnic arteries is due to increased nitric oxide (decreased number of Kupffer macrophages in the liver → higher levels of bacterial DNA in blood → release of nitric oxide) (in hepatorenal syndrome)"},{"n":"57","nombre":"Rain umbrella","ver":"Otro paraguas (umbrella) en la escena, protegiendo de la lluvia.","clinica":"La cirrosis → activación del RAAS.","sketchy":"Repite el símbolo del paraguas para la activación del sistema RAAS.","literal":"cirrhosis → activation of RAAS"},{"n":"58","nombre":"Angiotensin suspenders","ver":"Tirantes (suspenders) etiquetados con \"angiotensina\" en un personaje.","clinica":"El aumento de la angiotensina II causa vasoconstricción sistémica (incluyendo los vasos renales) → disminución del flujo sanguíneo renal (en síndrome hepatorrenal).","sketchy":"Los \"tirantes\" (que \"aprietan/constriñen\") representan la vasoconstricción sistémica causada por la angiotensina II.","literal":"↑ angiotensin II causes systemic vasoconstriction (including renal vessels) → ↓ renal blood flow (in hepatorenal syndrome)"},{"n":"59","nombre":"Empty kidney canteen","ver":"Una cantimplora con forma de riñón, vacía (empty).","clinica":"La disminución del flujo sanguíneo renal → lesión renal pre-renal (en síndrome hepatorrenal).","sketchy":"La \"cantimplora-riñón vacía\" representa directamente la disminución del flujo sanguíneo renal.","literal":"decreased renal blood flow → pre-renal kidney injury (in hepatorenal syndrome)"},{"n":"60","nombre":"Dilated pulmonary capillary snake","ver":"Una serpiente dilatada con temática pulmonar (pulmonary capillary) al final de la escena.","clinica":"El aumento del óxido nítrico en el síndrome hepatopulmonar causa vasodilatación de los capilares pulmonares y desajuste de ventilación-perfusión.","sketchy":"La \"serpiente pulmonar dilatada\" representa literalmente la vasodilatación de los capilares pulmonares en el síndrome hepatopulmonar.","literal":"↑ nitric oxide in hepatopulmonary syndrome vasodilation of pulmonary capillaries & ventilation-perfusion mismatch"}]},{"slug":"crohn-colitis-ulcerosa","titulo":"Enfermedad de Crohn y Colitis Ulcerosa","items":[{"n":"1","nombre":"Fiery intestines","ver":"Una chispa/llama azul brillante en el centro de la escena de construcción urbana.","clinica":"Enfermedad inflamatoria intestinal (EII) (colitis ulcerosa y enfermedad de Crohn).","sketchy":"La chispa/llama es el símbolo fijo de \"inflamación\" en toda la serie, presentando el tema general de la EII.","literal":"inflammatory bowel disease (IBD) (ulcerative colitis and Crohn disease)"},{"n":"2","nombre":"Young white guy","ver":"Un trabajador joven corriendo con un extintor por la escena.","clinica":"La EII es más común en personas jóvenes de ascendencia caucásica y judía.","sketchy":"El trabajador \"joven\" representa directamente el grupo etario y demográfico de mayor riesgo.","literal":"IBD is most common in young people with Caucasian and Jewish ancestry"},{"n":"3","nombre":"Fiery hat","ver":"Un casco de trabajo con humo/fuego saliendo de él.","clinica":"La EII se presenta con fiebre.","sketchy":"El casco \"en llamas\" representa directamente la fiebre.","literal":"IBD presents with fever"},{"n":"4","nombre":"Thin guy","ver":"Un trabajador delgado corriendo por la escena.","clinica":"La EII se presenta con pérdida de peso.","sketchy":"La delgadez del trabajador representa directamente la pérdida de peso.","literal":"IBD presents with weight loss"},{"n":"5","nombre":"Clutching abdomen","ver":"Un trabajador sosteniéndose el abdomen con dolor.","clinica":"La EII se presenta con dolor abdominal.","sketchy":"El gesto de sostenerse el abdomen representa directamente el dolor abdominal.","literal":"IBD presents with abdominal pain"},{"n":"6","nombre":"Brown puddle","ver":"Un charco de líquido marrón en el suelo.","clinica":"La EII se presenta con diarrea.","sketchy":"El charco marrón es la representación literal directa de la diarrea.","literal":"IBD presents with diarrhea"},{"n":"7","nombre":"Union Cannon","ver":"Un cañón/herramienta de construcción con un letrero de sindicato (union).","clinica":"Colitis Ulcerosa.","sketchy":"\"Union Cannon\" con \"U\" resaltada da la clave literal para \"Ulcerative Colitis\".","literal":"Ulcerative colitis"},{"n":"8","nombre":"Rusty rectal stool","ver":"Un banquito oxidado en el suelo de la escena.","clinica":"La colitis ulcerosa SIEMPRE afecta el recto.","sketchy":"\"Stool\" (banquito/heces) es el juego de palabras fijo de la serie; su ubicación fija representa que SIEMPRE afecta el recto.","literal":"ulcerative colitis ALWAYS affects the rectum"},{"n":"9","nombre":"Rust traveling proximally","ver":"Óxido extendiéndose progresivamente hacia estructuras más alejadas.","clinica":"La colitis ulcerosa se extiende de forma proximal desde el recto (en un patrón CONTINUO).","sketchy":"El óxido \"viajando proximalmente\" representa la extensión continua de la enfermedad.","literal":"ulcerative colitis spreads proximally from rectum (in a CONTINUOUS pattern)"},{"n":"10","nombre":"Smooth end of cannon","ver":"El extremo liso de un tubo/cañón, visible en un cartel publicitario \"Las Vegas\".","clinica":"En la colitis ulcerosa, el colon tiene una apariencia \"en tubo de plomo\" (lead pipe) en el enema de contraste (por pérdida de las proyecciones haustrales normales).","sketchy":"El extremo \"liso\" del tubo representa literalmente la apariencia lisa en tubo de plomo.","literal":"in ulcerative colitis, the colon has a \"lead pipe\" appearance on contrast enema (due to loss of normal haustral projections)"},{"n":"11","nombre":"First responders with perinuclear battle plan","ver":"Trabajadores de emergencia (first responders) alrededor de un plano de batalla.","clinica":"Los pANCA (anticuerpos citoplasmáticos antineutrófilos perinucleares) están elevados en la colitis ulcerosa.","sketchy":"\"Perinuclear\" en el plan de batalla es la clave literal directa de \"perinuclear ANCA\" (pANCA).","literal":"pANCA (PERInuclear anti-neutrophil cytoplasmic antibodies) are elevated in ulcerative colitis"},{"n":"12","nombre":"Eroding through 2 layers","ver":"Un agujero erosionando dos capas de una estructura.","clinica":"En la colitis ulcerosa, la inflamación afecta SOLO la mucosa y submucosa.","sketchy":"La erosión \"de 2 capas\" representa literalmente las dos capas afectadas (mucosa y submucosa).","literal":"in ulcerative colitis, inflammation affects ONLY the mucosa and submucosa"},{"n":"13","nombre":"Dirt islands in hole","ver":"Islas de tierra dentro de un agujero en el pavimento.","clinica":"En la colitis ulcerosa, el colon contiene \"pseudopólipos\" (islas de mucosa normal dentro de tejido ulcerado).","sketchy":"Las \"islas de tierra\" (mucosa normal) rodeadas de agujero (tejido ulcerado) representan los pseudopólipos.","literal":"in ulcerative colitis, the colon contains \"pseudopolyps\" (islands of normal mucosa within ulcerated tissue)"},{"n":"14","nombre":"Inflamed cannonball within wall","ver":"Una bola de cañón inflamada incrustada dentro de una pared.","clinica":"En histología, la colitis ulcerosa muestra abscesos dentro de las criptas colónicas.","sketchy":"La \"bola de cañón inflamada\" dentro de la pared representa el absceso dentro de la cripta.","literal":"on histology, ulcerative colitis displays abscesses within colonic crypts (containing aggregations of macrophages)"},{"n":"15","nombre":"Shrapnel striking left side","ver":"Metralla (shrapnel) golpeando el lado izquierdo de un personaje.","clinica":"La colitis ulcerosa se presenta con dolor abdominal del lado IZQUIERDO (por su localización en recto y colon distal).","sketchy":"El impacto en el lado \"izquierdo\" representa directamente la localización del dolor.","literal":"ulcerative colitis presents with LEFT-sided abdominal pain (due to location in rectum and distal colon)"},{"n":"16","nombre":"Bloody puddle","ver":"Un charco de líquido rojo/sanguinolento en el suelo.","clinica":"La colitis ulcerosa se presenta con diarrea sanguinolenta (frecuente y de bajo volumen, debido a irritación rectal).","sketchy":"El charco \"sanguinolento\" es la representación literal directa de la diarrea con sangre.","literal":"ulcerative colitis presents with bloody diarrhea (frequent and small volume due to rectal irritation)"},{"n":"17","nombre":"MEGA cannon","ver":"Un cañón/haz de luz de gran tamaño (MEGA) proyectado sobre la escena.","clinica":"La colitis ulcerosa puede causar megacolon tóxico (la inflamación se extiende al músculo liso colónico → parálisis del músculo liso → dilatación colónica severa).","sketchy":"\"MEGA\" es la clave literal directa para \"megacolon\".","literal":"ulcerative colitis can cause toxic megacolon (inflammation extends to colonic smooth muscle → smooth muscle paralysis → severe colonic dilation)"},{"n":"18","nombre":"Exploding cannon","ver":"Llamas y explosión cerca del cañón de luz.","clinica":"En la colitis ulcerosa, el megacolon tóxico puede llevar a perforación.","sketchy":"La \"explosión\" representa directamente la perforación intestinal.","literal":"in ulcerative colitis, toxic megacolon can lead to perforation"},{"n":"19","nombre":"Cancer crab belt","ver":"Un cangrejo en un letrero/insignia sobre la casa central de la escena.","clinica":"La colitis ulcerosa aumenta el riesgo de cáncer de colon (mayor factor de riesgo que la enfermedad de Crohn).","sketchy":"El cangrejo (símbolo de cáncer) representa el riesgo aumentado de malignización.","literal":"ulcerative colitis increases the risk of colon cancer (bigger risk factor than Crohn disease)"},{"n":"20","nombre":"Scaly snake flag in biliary tree","ver":"Una bandera con una serpiente escamosa sobre el techo de la casa (que representa el árbol biliar).","clinica":"La colitis ulcerosa está altamente asociada con la colangitis esclerosante primaria (un trastorno autoinmune de los conductos biliares).","sketchy":"La serpiente \"escamosa\" (scaly) representa \"sclerosing\" (esclerosante), y el techo con forma de árbol biliar marca el sitio afectado.","literal":"ulcerative colitis is highly associated with primary sclerosing cholangitis (an autoimmune disorder of the bile ducts)"},{"n":"21","nombre":"Cobblestone patches","ver":"Parches de adoquines (cobblestone) irregulares en el suelo.","clinica":"La enfermedad de Crohn afecta el intestino de forma discontinua, llevando a la formación de \"lesiones salteadas\" (skip lesions) (áreas enfermas con tejido normal entremedio).","sketchy":"Los \"parches de adoquines\" en zonas discontinuas representan literalmente las lesiones salteadas.","literal":"Crohn disease affects the bowel in a discontinuous fashion, leading to formation of \"skip lesions\" (diseased areas with normal bowel in between)"},{"n":"22","nombre":"Cobblestone path from mouth to anus arch","ver":"Un camino de adoquines que se extiende desde un extremo hasta un arco al otro extremo de la escena.","clinica":"La enfermedad de Crohn puede afectar CUALQUIER porción del tracto GI (desde la boca hasta el ano).","sketchy":"El camino continuo \"de un extremo a otro\" representa que la enfermedad puede afectar cualquier tramo del tracto GI.","literal":"Crohn disease can affect ANY portion of the GI tract (from mouth to anus)"},{"n":"23","nombre":"Antibody sac","ver":"Una bolsa/saco cerca de la casa, con estructura tipo anticuerpo.","clinica":"Los anticuerpos anti-Saccharomyces cerevisiae a menudo están presentes en la enfermedad de Crohn.","sketchy":"El \"saco de anticuerpos\" (antibody sac) representa directamente los anticuerpos anti-Saccharomyces.","literal":"anti-saccharomyces cerevisiae antibodies are often present in Crohn disease"},{"n":"24","nombre":"Hit on right waist","ver":"Un golpe/impacto en el lado derecho de la cintura de un personaje.","clinica":"La enfermedad de Crohn se presenta con dolor abdominal en fosa ilíaca derecha (RLQ) (debido a su localización en íleon y ciego).","sketchy":"El golpe en el lado \"derecho\" representa directamente la localización del dolor.","literal":"Crohn disease presents with RLQ abdominal pain (due to location in ileum and cecum)"},{"n":"25","nombre":"Debris-littered brown puddle","ver":"Un charco marrón lleno de escombros y residuos.","clinica":"La enfermedad de Crohn se presenta con malabsorción de grasas y vitaminas liposolubles (la inflamación del íleon distal → mala reabsorción de ácidos biliares → absorción de grasa alterada).","sketchy":"El charco \"lleno de escombros\" representa la malabsorción y el contenido graso no absorbido.","literal":"Crohn disease presents with malabsorption of fats and fat-soluble vitamins (inflammation of distal ileum → poor reabsorption of bile acids → impaired absorption of fat)"},{"n":"26","nombre":"MacroCAGES","ver":"Jaulas (cages) etiquetadas visibles en un contenedor de la escena.","clinica":"La enfermedad de Crohn causa formación de granulomas no caseificantes (que contienen agregaciones de macrófagos).","sketchy":"\"MacroCAGES\" combina \"macrophage\" con \"cages\" (jaulas que agrupan/contienen), representando la agregación de macrófagos en el granuloma.","literal":"Crohn disease causes formation of noncaseating granulomas (containing aggregations of macrophages)"},{"n":"27","nombre":"Broken through all wall layers","ver":"Una estructura rota que atraviesa todas las capas de una pared.","clinica":"La enfermedad de Crohn causa inflamación TRANSMURAL del intestino.","sketchy":"El daño \"a través de todas las capas\" es la representación literal directa de \"transmural\".","literal":"Crohn disease causes TRANSMURAL bowel inflammation"},{"n":"28","nombre":"Tight abdominal gauze","ver":"Una gasa/venda apretada alrededor del abdomen de un personaje.","clinica":"La enfermedad de Crohn puede causar estenosis fibróticas (la inflamación transmural → engrosamiento de la pared intestinal → estrechamiento del lumen).","sketchy":"La gasa \"apretada\" representa directamente el estrechamiento del lumen intestinal.","literal":"Crohn disease can cause fibrotic strictures (transmural inflammation → bowel wall thickening → narrowed lumen)"},{"n":"29","nombre":"Pulling strings","ver":"Cuerdas/cordones tirantes tendidos entre estructuras de la escena.","clinica":"En la enfermedad de Crohn, la radiografía muestra el \"signo de la cuerda\" (string sign) (debido a estenosis).","sketchy":"Las cuerdas tirantes representan literalmente el \"string sign\" radiológico.","literal":"in Crohn disease, X-ray shows \"string sign\" (due to strictures)"},{"n":"30","nombre":"Obstructing rocks","ver":"Rocas/troncos obstruyendo el camino de la escena.","clinica":"En la enfermedad de Crohn, las estenosis pueden causar obstrucción intestinal.","sketchy":"Las rocas \"obstruyendo\" el camino representan directamente la obstrucción intestinal.","literal":"in Crohn disease, strictures can cause bowel obstruction"},{"n":"31","nombre":"Fistulizing trench","ver":"Una zanja/trinchera (trench) profunda conectando dos áreas de la escena.","clinica":"La enfermedad de Crohn puede llevar a fístulas (la inflamación transmural lleva a epitelización a través de la pared intestinal → conexiones entre intestino y vejiga, piel, vagina, u otros segmentos intestinales).","sketchy":"La \"trinchera\" conectando dos puntos representa literalmente el trayecto fistuloso.","literal":"Crohn disease can lead to fistulas (transmural inflammation leads to epithelization across bowel wall → connections between bowel and bladder, skin, vagina, or other bowel segments)"},{"n":"32","nombre":"Pale erosions on mouth arch","ver":"Erosiones pálidas visibles en el arco de una estructura similar a una boca.","clinica":"La enfermedad de Crohn causa úlceras aftosas en la boca y el esófago.","sketchy":"Las erosiones pálidas en el \"arco de la boca\" representan directamente las úlceras aftosas.","literal":"Crohn disease causes aphthous ulcers in the mouth and esophagus"},{"n":"33","nombre":"Wrapped joints","ver":"Articulaciones envueltas/vendadas en uno de los trabajadores.","clinica":"La enfermedad inflamatoria intestinal puede causar artritis (poliartritis migratoria, sacroileítis, espondilitis anquilosante) (a menudo asociada con HLA-B27).","sketchy":"Las articulaciones \"envueltas\" representan directamente la afectación articular (artritis).","literal":"inflammatory bowel disease can cause arthritis (migratory polyarthritis, sacroiliitis, ankylosing spondylitis)(often HLA-B27)"},{"n":"34","nombre":"Red spots on shin columns","ver":"Manchas rojas en las espinillas (shin) de un personaje.","clinica":"La enfermedad inflamatoria intestinal puede causar eritema nodoso (erupción nodular eritematosa dolorosa en las espinillas) (por inflamación de células grasas).","sketchy":"Las manchas rojas en las espinillas son la representación literal directa del eritema nodoso.","literal":"inflammatory bowel disease can cause erythema nodosum (painful erythematous nodular rash on shins)(due to inflammation of fat cells)"},{"n":"35","nombre":"Skin wounds","ver":"Heridas cutáneas visibles en uno de los trabajadores.","clinica":"La enfermedad inflamatoria intestinal puede causar pioderma gangrenoso (úlceras cutáneas por disfunción de neutrófilos) (no infeccioso ni gangrenoso).","sketchy":"Las heridas cutáneas representan directamente las úlceras del pioderma gangrenoso.","literal":"inflammatory bowel disease can cause pyoderma gangrenosum (skin ulcers due to neutrophil dysfunction) (not infectious or gangrenous)"},{"n":"36","nombre":"Shrapnel on kidney tray","ver":"Fragmentos de metralla sobre una bandeja con forma de riñón.","clinica":"La enfermedad inflamatoria intestinal puede causar cálculos renales (por absorción aumentada de oxalato).","sketchy":"Los fragmentos sobre la bandeja-riñón representan directamente los cálculos renales.","literal":"inflammatory bowel disease can cause renal calculi (due to increased absorption of oxalate)"},{"n":"37","nombre":"Red-rimmed goggles","ver":"Gafas de protección con bordes rojos que lleva puestas un personaje.","clinica":"La enfermedad inflamatoria intestinal puede causar enfermedad ocular (uveítis anterior, iritis, epiescleritis) (se presenta con dolor ocular y enrojecimiento).","sketchy":"El borde \"rojo\" de las gafas representa directamente el enrojecimiento ocular.","literal":"inflammatory bowel disease can cause eye disease (anterior uveitis, iritis, episcleritis)(presents with eye pain and redness)"},{"n":"38","nombre":"5-pointed star of USA","ver":"Una estrella de 5 puntas en un cartel/bandera de la escena.","clinica":"La enfermedad inflamatoria intestinal se trata con 5-ASA (sulfasalazina, mesalamina).","sketchy":"La estrella \"de 5 puntas\" es la clave numérica literal directa para \"5-ASA\".","literal":"inflammatory bowel disease is treated with 5-ASA (sulfasalazine, mesalamine)"}]},{"slug":"dismotilidad-cancer-esofagico","titulo":"Dismotilidad esofágica y cáncer","items":[{"n":"1","nombre":"Hooked at the throat","ver":"Un hombre enganchado por el cuello (hooked at the throat) con un bastón, en la escena de un teatro.","clinica":"El cáncer esofágico y los trastornos de motilidad se presentan todos con disfagia (dificultad para tragar).","sketchy":"El \"gancho en la garganta\" representa literalmente la dificultad para tragar (disfagia).","literal":"Esophageal cancer and motility disorders all present with dysphagia (difficulty swallowing)"},{"n":"2","nombre":"Cancer crabs in bear den","ver":"Cangrejos de cáncer (cancer crabs) dentro de una cueva de oso (bear den).","clinica":"El ADENOCARCINOMA esofágico es la neoplasia maligna esofágica más común en Estados Unidos.","sketchy":"Los \"cangrejos\" (símbolo de cáncer) dentro de la \"guarida de oso\" marcan el adenocarcinoma como el tumor más frecuente en la escena.","literal":"Esophageal ADENOCARCINOMA is the most common esophageal malignancy in the US"},{"n":"3","nombre":"Glandular fluff","ver":"Pelaje glandular (glandular fluff) visible en uno de los personajes disfrazados de oso.","clinica":"El adenocarcinoma esofágico tiene características GLANDULARES en histología (similar a otros adenocarcinomas).","sketchy":"El \"pelaje glandular\" representa literalmente las características glandulares en histología.","literal":"Esophageal ADENOCARCINOMA has gland-like features on histology (similar to other adenocarcinomas)"},{"n":"4","nombre":"Barrett's bears","ver":"Personajes disfrazados de oso llamados \"Barrett's bears\".","clinica":"El esófago de Barrett puede causar adenocarcinoma esofágico (vía progresión a displasia → cáncer).","sketchy":"\"Barrett's bears\" es la clave literal directa del \"esófago de Barrett\".","literal":"Barrett's esophagus can cause esophageal adenocarcinoma (via progression to dysplasia → cancer)"},{"n":"5","nombre":"Metal intestines","ver":"Intestinos metálicos (metal intestines) visibles en la escena.","clinica":"El esófago de Barrett es una metaplasia desde el epitelio escamoso estratificado normal hacia epitelio columnar intestinal.","sketchy":"Los \"intestinos\" representan literalmente el epitelio columnar intestinal de la metaplasia.","literal":"Barrett's esophagus is metaplasia from normal stratified squamous epithelium to intestinal columnar epithelium"},{"n":"6","nombre":"Smoking","ver":"Un hombre fumando (smoking) en el teatro.","clinica":"El tabaquismo aumenta el riesgo de ADENOCARCINOMA esofágico (especialmente si hay esófago de Barrett preexistente).","sketchy":"El \"fumador\" representa directamente el factor de riesgo del tabaquismo.","literal":"Smoking increases the risk of esophageal ADENOCARCINOMA (especially if pre-existing Barrett's esophagus)"},{"n":"7","nombre":"Distal velvety curtains","ver":"Cortinas de terciopelo (velvety curtains) en la parte distal del escenario.","clinica":"El adenocarcinoma esofágico afecta primariamente el TERCIO DISTAL del esófago (incluyendo la unión gastroesofágica; misma área que el ERGE y el esófago de Barrett).","sketchy":"Las \"cortinas distales\" representan la localización distal del tumor.","literal":"Esophageal ADENOCARCINOMA primarily affects the distal third of the esophagus (including the GE junction; same area as GERD and Barrett's esophagus)"},{"n":"8","nombre":"Stuck solid guy with liquid passing by","ver":"Un hombre atascado (stuck) mientras líquido pasa a su lado (liquid passing by) en el escenario.","clinica":"El adenocarcinoma esofágico se presenta con disfagia (inicialmente para sólidos, luego progresa a líquidos).","sketchy":"El personaje \"atascado con sólidos\" mientras el líquido pasa representa la progresión típica de la disfagia.","literal":"Esophageal ADENOCARCINOMA presents with dysphagia (initially for solids, then progresses to liquids)"},{"n":"9","nombre":"Thin bear","ver":"Un oso delgado (thin bear) en la escena.","clinica":"El adenocarcinoma esofágico se presenta con pérdida de peso.","sketchy":"El \"oso delgado\" representa directamente la pérdida de peso.","literal":"Esophageal ADENOCARCINOMA presents with weight loss"},{"n":"10","nombre":"Swallowing burning hot pizza","ver":"Un personaje tragando una pizza ardiente (burning hot pizza).","clinica":"El adenocarcinoma esofágico se presenta con odinofagia (deglución dolorosa).","sketchy":"La pizza \"ardiente\" al tragar representa directamente el dolor al tragar (odinofagia).","literal":"Esophageal ADENOCARCINOMA presents with odynophagia (painful swallowing)"},{"n":"11","nombre":"Cancer crab on squamous tablecloth","ver":"Un cangrejo de cáncer sobre un mantel con textura escamosa (squamous tablecloth) en la mesa del banquete.","clinica":"El carcinoma de CÉLULAS ESCAMOSAS esofágico (el tipo más común de cáncer esofágico a nivel mundial).","sketchy":"El \"mantel escamoso\" representa el epitelio escamoso, y el cangrejo el carcinoma que surge de él.","literal":"Esophageal SQUAMOUS CELL CARCINOMA (the most common type of esophageal cancer worldwide)"},{"n":"12","nombre":"Cured foods","ver":"Alimentos curados (cured foods) servidos en la mesa del banquete.","clinica":"Los alimentos que contienen compuestos N-nitroso (vegetales encurtidos, carnes procesadas) son un factor de riesgo para el carcinoma de CÉLULAS ESCAMOSAS (debido al efecto irritante).","sketchy":"Los \"alimentos curados\" representan directamente los compuestos N-nitroso.","literal":"Foods containing N-nitroso compounds (pickled vegetables, preserved meats) are a risk factor for SQUAMOUS CELL CARCINOMA (due to irritant effect)"},{"n":"13","nombre":"Hot tea","ver":"Té caliente (hot tea) servido en la mesa, con vapor visible.","clinica":"Las bebidas calientes son un factor de riesgo para el carcinoma de CÉLULAS ESCAMOSAS esofágico (debido al efecto irritante).","sketchy":"El \"té caliente\" representa directamente el factor de riesgo de bebidas calientes.","literal":"Hot beverages are a risk factor for esophageal SQUAMOUS CELL CARCINOMA (due to irritant effect)"},{"n":"14","nombre":"Chewable nut","ver":"Una nuez masticable (chewable nut) sobre la mesa.","clinica":"Las nueces de betel son un factor de riesgo para el carcinoma de CÉLULAS ESCAMOSAS esofágico (debido al efecto irritante).","sketchy":"La \"nuez\" representa directamente la nuez de betel (betel nut).","literal":"Betel nuts are a risk factor for esophageal SQUAMOUS CELL CARCINOMA (due to irritant effect)"},{"n":"15","nombre":"Alcohol","ver":"Copas de alcohol (alcohol) servidas en el banquete.","clinica":"El alcohol es un factor de riesgo para el carcinoma de CÉLULAS ESCAMOSAS esofágico (debido al efecto irritante).","sketchy":"Las \"copas de alcohol\" representan directamente el factor de riesgo.","literal":"Alcohol is a risk factor for esophageal SQUAMOUS CELL CARCINOMA (due to irritant effect)"},{"n":"16","nombre":"Smoking","ver":"Un personaje fumando (smoking) cerca del banquete.","clinica":"El humo del tabaco es un factor de riesgo para el carcinoma de CÉLULAS ESCAMOSAS esofágico (debido al efecto irritante).","sketchy":"El \"humo de tabaco\" representa directamente el factor de riesgo.","literal":"Tobacco smoke is a risk factor for esophageal SQUAMOUS CELL CARCINOMA (due to irritant effect)"},{"n":"17","nombre":"Mid-body tutu","ver":"Un tutú (tutu) en la sección media del cuerpo de una bailarina.","clinica":"El carcinoma de CÉLULAS ESCAMOSAS esofágico usualmente ocurre en el TERCIO MEDIO del esófago.","sketchy":"El \"tutú en la sección media\" representa la localización en el tercio medio del esófago.","literal":"Esophageal SQUAMOUS CELL CARCINOMA usually occurs in the middle third of the esophagus"},{"n":"18","nombre":"Stuck in door by solid props with liquid passing by","ver":"Un personaje atascado en una puerta (stuck in door) mientras pasa líquido a su lado.","clinica":"El carcinoma de CÉLULAS ESCAMOSAS esofágico se presenta con disfagia (inicialmente para sólidos, luego también para líquidos).","sketchy":"Repite el símbolo del personaje atascado con sólidos, ahora en la puerta, para la disfagia progresiva.","literal":"Esophageal SQUAMOUS CELL CARCINOMA presents with dysphagia (initially for solids, then also liquids)"},{"n":"19","nombre":"Clutching throat","ver":"Un personaje sosteniéndose la garganta (clutching throat).","clinica":"El carcinoma de CÉLULAS ESCAMOSAS esofágico causa odinofagia (deglución dolorosa).","sketchy":"\"Sostenerse la garganta\" representa directamente la deglución dolorosa.","literal":"Esophageal SQUAMOUS CELL CARCINOMA causes odynophagia (painful swallowing)"},{"n":"20","nombre":"Thin actress","ver":"Una actriz delgada (thin actress) en el escenario.","clinica":"El carcinoma de CÉLULAS ESCAMOSAS esofágico causa pérdida de peso.","sketchy":"La \"actriz delgada\" representa directamente la pérdida de peso.","literal":"Esophageal SQUAMOUS CELL CARCINOMA causes weight loss"},{"n":"21","nombre":"Raised flat area","ver":"Un área plana y elevada (raised flat area) en el escenario.","clinica":"El carcinoma de CÉLULAS ESCAMOSAS esofágico aparece como placas elevadas con ulceración.","sketchy":"El \"área plana elevada\" representa literalmente las placas elevadas con ulceración.","literal":"Esophageal SQUAMOUS CELL CARCINOMA appears as raised plaques with ulceration"},{"n":"22","nombre":"Pearl necklace","ver":"Un collar de perlas (pearl necklace) que lleva puesto un personaje.","clinica":"En histología, el carcinoma de CÉLULAS ESCAMOSAS esofágico muestra \"perlas de queratina\" (keratin pearls) y puentes intercelulares (similar a otras formas de carcinoma de células escamosas).","sketchy":"El \"collar de perlas\" es la representación literal directa de las perlas de queratina.","literal":"On histology esophageal SQUAMOUS CELL CARCINOMA displays keratin pearls and intercellular bridging (similar to other forms of squamous cell carcinoma)"},{"n":"23","nombre":"Plumber","ver":"Un plomero (plumber) trabajando en la escena.","clinica":"Síndrome de Plummer-Vinson (tríada de disfagia, anemia ferropénica y membranas esofágicas).","sketchy":"\"Plumber\" (plomero) suena fonéticamente similar al inicio de \"PLUMMER\".","literal":"Plummer-Vinson syndrome (triad of dysphagia, iron deficiency anemia, and esophageal webs)"},{"n":"24","nombre":"Falling iron tools","ver":"Herramientas de hierro cayendo (falling iron tools) de la mano del plomero.","clinica":"El síndrome de PLUMMER-VINSON es causado por deficiencia crónica de hierro.","sketchy":"Las \"herramientas de hierro cayendo\" (perdiéndose) representan la deficiencia de hierro.","literal":"PLUMMER-VINSON syndrome is caused by chronic iron deficiency"},{"n":"25","nombre":"Cobwebs","ver":"Telarañas (cobwebs) colgando en la escena.","clinica":"El síndrome de PLUMMER-VINSON causa membranas ,{"n":"30","nombre":"Squeezing lower esophageal harness","ver":"Un arnés inferior (lower esophageal harness) siendo apretado (squeezing) en la maquinaria del teatro.","clinica":"La ACALASIA es un trastorno de dismotilidad esofágica causado por relajación alterada del EEI → obstrucción esofágica funcional.","sketchy":"El \"arnés apretándose\" representa literalmente el esfínter esofágico inferior (EEI) que no se relaja.","literal":"ACHALASIA is an esophageal dysmotility disorder caused by impaired relaxation of the LES → functional esophageal obstruction"},{"n":"31","nombre":"Loss of safety plexus","ver":"Un cartel de \"Safety Plexus\" perdido/dañado (loss) en la escena de maquinaria.","clinica":"La ACALASIA es causada por la pérdida de relajación del EEI debido a la pérdida del plexo mientérico (de Auerbach).","sketchy":"El cartel \"Safety Plexus\" perdido representa la pérdida del plexo mientérico (Auerbach).","literal":"ACHALASIA is caused by impaired relaxation of the LES due to loss of the myenteric (Auerbach) plexus"},{"n":"32","nombre":"Rusty nitric oxide exhaust & falling VIP pass","ver":"Un escape de óxido nítrico oxidado (rusty nitric oxide exhaust) y un pase \"VIP\" cayendo (falling VIP pass).","clinica":"En ACALASIA, la pérdida del plexo mientérico (de Auerbach) → disminución de la producción de NO y VIP → relajación alterada del EEI.","sketchy":"El \"escape oxidado de óxido nítrico\" y el \"pase VIP cayendo\" representan literalmente la disminución de NO y VIP.","literal":"In ACHALASIA, loss of the myenteric (Auerbach) plexus → decreased production of NO and VIP → impaired relaxation of the LES smooth muscle"},{"n":"33","nombre":"\"Idiot\"","ver":"Un letrero que dice \"IDIOT\" colgado en la escena.","clinica":"La ACALASIA usualmente es idiopática.","sketchy":"\"IDIOT\" suena fonéticamente similar al inicio de \"IDIOpathic\".","literal":"ACHALASIA is usually idiopathic"},{"n":"34","nombre":"Che's gas","ver":"Un personaje etiquetado \"Che\" expulsando gas ombre":"Refluxed acid","ver":"Ácido refluido (refluxed acid) visible bajo el escenario (\"Lower Stage\").","clinica":"En el síndrome CREST, el tono esofágico disminuido puede llevar a ERGE (aumentando el riesgo de esófago de Barrett).","sketchy":"El \"ácido refluido\" representa directamente el ERGE resultante del tono esofágico disminuido.","literal":"In CREST syndrome, decreased esophageal tone can lead to GERD (increasing risk of Barrett's esophagus)"}]},{"slug":"dismotilidad-cancer-gastrico","titulo":"Dismotilidad gástrica y cáncer","items":[{"n":"1","nombre":"Broken gastric rickshaw","ver":"Un rickshaw roto (broken gastric rickshaw) con forma de estómago en la calle.","clinica":"Gastroparesia (vaciamiento gástrico retardado SIN obstrucción mecánica).","sketchy":"El \"rickshaw roto\" (que no avanza) representa literalmente el vaciamiento gástrico retardado.","literal":"gastroparesis (delayed gastric emptying WITHOUT mechanical obstruction)"},{"n":"2","nombre":"Nauseated rickshaw passenger","ver":"Un pasajero con náuseas (nauseated) dentro del rickshaw.","clinica":"La gastroparesia se presenta con náuseas y vómitos.","sketchy":"El \"pasajero con náuseas\" representa directamente el síntoma.","literal":"gastroparesis presents with nausea and vomiting"},{"n":"3","nombre":"Rickshaw passenger holding abdomen","ver":"El pasajero sosteniéndose el abdomen (holding abdomen).","clinica":"La gastroparesia se presenta con dolor abdominal y saciedad temprana.","sketchy":"\"Sostenerse el abdomen\" representa directamente el dolor abdominal y la saciedad temprana.","literal":"gastroparesis presents with abdominal pain and early satiety"},{"n":"4","nombre":"Broken \"VEGAS\" sign","ver":"Un letrero roto (broken) que dice \"VEGAS\".","clinica":"La gastroparesia es causada por disfunción del nervio vago (sistema nervioso parasimpático) → peristalsis alterada del alimento a través del estómago.","sketchy":"\"VEGAS\" suena fonéticamente similar a \"VAGus\", y el letrero \"roto\" representa la disfunción.","literal":"gastroparesis is caused by dysfunction of the vagus nerve (parasympathetic nervous system) → impaired peristalsis of food through stomach"},{"n":"5","nombre":"Severed wire","ver":"Un cable cortado (severed wire) en la escena.","clinica":"Los efectos iatrogénicos (ej. lesión quirúrgica al nervio vago) pueden causar gastroparesia.","sketchy":"El \"cable cortado\" representa literalmente la lesión quirúrgica al nervio vago.","literal":"iatrogenic effects (e.g. surgical injury to the vagus nerve) can cause gastroparesis"},{"n":"6","nombre":"\"IDIOT\"","ver":"Un letrero que dice \"IDIOT\" en la escena.","clinica":"La gastroparesia es más comúnmente idiopática.","sketchy":"\"IDIOT\" suena fonéticamente similar al inicio de \"IDIOpathic\".","literal":"gastroparesis is most commonly idiopathic"},{"n":"7","nombre":"Elevated candy","ver":"Dulces elevados (elevated candy) en la escena.","clinica":"La diabetes puede causar gastroparesia.","sketchy":"Los \"dulces elevados\" (azúcar alta) representan directamente la diabetes.","literal":"diabetes can cause gastroparesis"},{"n":"8","nombre":"Mortar and pestle","ver":"Un mortero con mano de mortero (mortar and pestle) en la escena.","clinica":"Los medicamentos (ej. bloqueadores de canales de calcio, antidepresivos tricíclicos) pueden causar gastroparesia.","sketchy":"El \"mortero\" (preparación de medicamentos) representa directamente los medicamentos como causa.","literal":"medications (e.g. calcium channel blockers, tricyclic antidepressants) can cause gastroparesis"},{"n":"9","nombre":"\"raMEN TRy It\"","ver":"Un cartel de \"RaMEN Try It\" en un puesto de comida.","clinica":"La enfermedad de Ménétrier (hipertrofia de los pliegues rugales del estómago debido a hiperplasia de células secretoras de mucus).","sketchy":"\"raMEN\" con \"MEN\" resaltado es la clave fonética directa de \"MENetrier's disease\".","literal":"Menetrier's disease (hypertrophy of stomach rugal folds due to hyperplasia of muc
