xofítica\" (con forma de masa protuberante) ubicada a la \"derecha\" representa la masa exofítica del cáncer derecho.","literal":"RIGHT-sided colon cancer (proximal ascending colon) presents as an exophytic mass (usually NON-obstructive despite extension into the lumen)"},{"n":"58","nombre":"Occult watchman dropping iron tools","ver":"Un gnomo dejando caer herramientas de hierro cerca de la coliflor.","clinica":"El cáncer del lado DERECHO a menudo se presenta con anemia ferropénica (por sangrado GI oculto).","sketchy":"Las herramientas \"de hierro\" cayendo representan directamente la anemia ferropénica (deficiencia de hierro).","literal":"RIGHT-sided colon cancer often presents with iron deficiency anemia (from occult GI bleeding)"},{"n":"59","nombre":"\"Path Obstructed\" on LEFT","ver":"Un cartel que dice \"Path Obstructed\" en el lado izquierdo de la escena.","clinica":"El cáncer de colon del lado IZQUIERDO (colon descendente) puede presentarse con obstrucción colónica (por estrechamiento luminal por lesiones ulcerativas infiltrantes) llevando a cambios en el hábito intestinal.","sketchy":"El cartel \"camino obstruido\" es la clave literal directa de la obstrucción colónica del cáncer izquierdo.","literal":"LEFT-sided colon cancer (descending colon) may present with colonic obstruction (due to luminal narrowing from infiltrative ulcerative lesions) leading to changes in bowel habits"},{"n":"60","nombre":"Apple core on left","ver":"Una forma tipo hoja/almohadón roja, con aspecto de \"corazón de manzana\" mordido, en el lado izquierdo.","clinica":"El cáncer del lado IZQUIERDO puede presentarse con una lesión \"en corazón de manzana\" (apple core) en estudios de imagen (por estrechamiento luminal).","sketchy":"La forma \"mordida\" es la representación literal directa de la lesión en corazón de manzana.","literal":"LEFT-sided colon cancer can present with an \"apple core\" lesion on imaging (due to luminal narrowing)"},{"n":"61","nombre":"Sitting in red puddle","ver":"Un gnomo bebé sentado en un charco rojo.","clinica":"El cáncer del lado IZQUIERDO se presenta con hematoquecia.","sketchy":"El \"charco rojo\" representa directamente la hematoquecia (sangre en heces).","literal":"LEFT-sided colon cancer presents with hematochezia"},{"n":"62","nombre":"Periscope","ver":"Un periscopio sostenido por un gnomo guerrero.","clinica":"La colonoscopía es el estándar de oro para el tamizaje y diagnóstico del cáncer de colon (la detección temprana y remoción de ADENOMAS puede prevenir el cáncer).","sketchy":"El periscopio (instrumento para \"ver dentro\") representa directamente la colonoscopía.","literal":"colonoscopy is the gold standard for screening and diagnosis of colon cancer (early detection and removal of ADENOMAS can prevent cancer)"},{"n":"63","nombre":"Fibrous hat","ver":"Un sombrero fibroso que lleva puesto uno de los gnomos guerreros.","clinica":"Una dieta alta en fibra disminuye el riesgo de cáncer de colon.","sketchy":"El sombrero \"fibroso\" representa literalmente la dieta alta en fibra.","literal":"a high-fiber diet decreases the risk of colon cancer"},{"n":"64","nombre":"Aspirin umpire guard","ver":"Un gnomo guerrero con armadura tipo árbitro (umpire), sosteniendo una lanza.","clinica":"El uso regular de aspirina disminuye el riesgo de cáncer de colon.","sketchy":"El \"guardia árbitro\" con protección representa el efecto protector regular de la aspirina.","literal":"regular aspirin use decreases the risk of colon cancer"},{"n":"65","nombre":"\"CEA\"","ver":"Un objeto etiquetado \"CEA\" sostenido por el gnomo guerrero.","clinica":"El antígeno carcinoembrionario (CEA) puede usarse para monitorear la progresión o recurrencia del cáncer de colon (demasiado inespecífico para el diagnóstico de cáncer).","sketchy":"Las letras \"CEA\" son la clave literal directa del marcador tumoral.","literal":"carcinoembryonic antigen (CEA) can be used to monitor progression or recurrence of colon cancer (too nonspecific for cancer diagnosis)"},{"n":"66","nombre":"Lynch inchworm","ver":"Una oruga/gusano verde con forma de serpiente (inchworm), enroscada en la escena.","clinica":"El síndrome de Lynch (cáncer colorrectal hereditario no polipósico [HNPCC]) es la causa familiar más común de cáncer colorrectal (SIN pólipos adenomatosos).","sketchy":"\"Inchworm\" (gusano medidor) es el símbolo mnemotécnico fijo de Sketchy para \"Lynch syndrome\".","literal":"Lynch syndrome (hereditary non-polyposis colorectal cancer [HNPCC]) is the most common familial cause of colorectal cancer (NO adenomatous polyps)"},{"n":"67","nombre":"Domino bridge","ver":"Fichas de dominó formando un puente cerca del gusano.","clinica":"El síndrome de Lynch es autosómico DOMINANTE.","sketchy":"El dominó vuelve a representar \"autosomal dominant\".","literal":"Lynch syndrome is autosomal DOMINANT"},{"n":"68","nombre":"Mismatched colors","ver":"Fichas de dominó con colores que no coinciden (mismatched) entre sí.","clinica":"El síndrome de Lynch es causado por mutaciones germinales en genes de reparación de emparejamiento erróneo (mismatch repair) (MSH2 y MLH1).","sketchy":"Los colores \"no coincidentes\" (mismatched) representan literalmente los genes \"mismatch repair\".","literal":"Lynch syndrome is caused by germline mutations in mismatch repair genes (MSH2 and MLH1)"},{"n":"69","nombre":"Cancer fighting ribbon","ver":"Un listón rosado de lucha contra el cáncer cerca del gusano.","clinica":"Los genes de reparación de emparejamiento erróneo (MSH2, MLH1) son genes supresores tumorales.","sketchy":"El listón representa el papel de estos genes como supresores tumorales.","literal":"mismatch repair genes (MSH2, MLH1) are tumor suppressor genes"},{"n":"70","nombre":"One falling antennae","ver":"Una sola antena cayendo del gusano.","clinica":"El síndrome de Lynch es causado por la herencia de una mutación germinal (la segunda mutación se adquiere durante la vida de la persona).","sketchy":"La \"única\" antena cayendo representa la primera mutación heredada, análogo al \"single pulled carrot\" de la FAP.","literal":"Lynch syndrome is caused by inheritance of one germline mutation (second mutation is acquired during person's lifetime)"},{"n":"71","nombre":"Crab belt buckle","ver":"Una hebilla de cinturón con forma de cangrejo.","clinica":"El síndrome de Lynch también se asocia con un riesgo aumentado de otros cánceres abdominales/pélvicos (endometrial, ovárico, gástrico, intestino delgado, hepatobiliar).","sketchy":"La hebilla con forma de cangrejo (cáncer), ubicada en la zona abdominal/pélvica del cinturón, representa el riesgo de cánceres en esa región.","literal":"Lynch syndrome is also associated with increased risk of other abdominal/pelvic cancers (endometrial, ovarian, stomach, small bowel, hepatobiliary)"}]},{"slug":"trastornos-gi-congenitos","titulo":"Trastornos GI congénitos","items":[{"n":"1","nombre":"Pinched stomach bottle","ver":"Un biberón/botella \"pellizcada\" (pinched) sostenida por el hombre que carga al bebé.","clinica":"Estenosis pilórica.","sketchy":"La botella \"pellizcada\" en su salida representa literalmente el estrechamiento (estenosis) del canal pilórico.","literal":"pyloric stenosis"},{"n":"2","nombre":"#1 baby boy","ver":"Un bebé varón identificado como \"#1\" en brazos del hombre.","clinica":"La estenosis pilórica es más común en varones (especialmente primogénitos).","sketchy":"El \"#1\" en el bebé varón representa directamente la mayor frecuencia en varones primogénitos.","literal":"pyloric stenosis is more common in males (especially first-born males)"},{"n":"3","nombre":"Vomiting white milk","ver":"El bebé vomitando leche blanca.","clinica":"La estenosis pilórica típicamente se presenta con emesis \"en proyectil\", NO biliosa (no biliosa porque la obstrucción es proximal a los conductos biliares en el duodeno).","sketchy":"El vómito \"blanco\" (leche, sin bilis) representa directamente la emesis no biliosa.","literal":"Pyloric stenosis typically presents with \"projectile,\" NON-bilious emesis (NON-bilious because obstruction is proximal to bile ducts in duodenum)"},{"n":"4","nombre":"One month calendar","ver":"Un calendario en la pared marcando un mes.","clinica":"La estenosis pilórica se presenta ~1 mes después del nacimiento (4ta-5ta semana de vida).","sketchy":"El calendario \"de un mes\" representa directamente la edad típica de presentación.","literal":"pyloric stenosis presents ~ 1 month after birth (4th-5th week of life)"},{"n":"5","nombre":"Muscular babysitter","ver":"El hombre musculoso cuidando al bebé (babysitter).","clinica":"La estenosis pilórica es causada por hipertrofia del esfínter pilórico (toma ~1 mes en desarrollarse).","sketchy":"El cuidador \"musculoso\" (muscular) representa directamente la hipertrofia muscular del esfínter.","literal":"pyloric stenosis is caused by hypertrophy of the pyloric sphincter (takes ~ 1 month to develop)"},{"n":"6","nombre":"Round bottle nipple","ver":"La tetina redonda del biberón.","clinica":"La estenosis pilórica puede presentarse con una masa palpable \"en forma de oliva\" (periumbilical).","sketchy":"La tetina \"redonda\" representa la masa palpable en forma de oliva.","literal":"pyloric stenosis may present with a palpable \"olive-shaped\" mass at the pylorus (periumbilical)"},{"n":"7","nombre":"Schisis string next to umbilicus","ver":"Una cuerda/cordón cerca del ombligo de uno de los niños.","clinica":"Gastrosquisis (herniación paraumbilical del contenido abdominal a través de la pared abdominal ventral).","sketchy":"\"Schisis\" es la clave literal directa para \"gastroSCHISIS\", y la ubicación cerca del ombligo marca la localización paraumbilical.","literal":"gastroschisis (paraumbilical herniation of the abdominal contents through the ventral abdominal wall)"},{"n":"8","nombre":"Uncovered string","ver":"El cordón visible, sin cubrir por ninguna membrana.","clinica":"En la gastrosquisis, los órganos abdominales herniados NO están cubiertos por peritoneo.","sketchy":"El cordón \"descubierto\" (uncovered) representa directamente la ausencia de cobertura peritoneal.","literal":"in gastroschisis, the herniated abdominal organs are NOT covered by peritoneum"},{"n":"9","nombre":"Elephant seal","ver":"Un personaje con máscara de foca elefante (elephant seal).","clinica":"Onfalocele (falla del contenido GI en regresar a la cavidad abdominal durante el desarrollo embriológico).","sketchy":"\"Elephant seal\" suena fonéticamente similar a \"omphalocele\".","literal":"omphalocele (failure of GI contents to return to the abdominal cavity during embryologic development)"},{"n":"10","nombre":"Elephant seal collar","ver":"Un collar en el disfraz de foca elefante.","clinica":"El onfalocele es una hernia umbilical verdadera (a través del anillo umbilical).","sketchy":"El \"collar\" alrededor del cuello representa el anillo umbilical verdadero por donde ocurre la hernia.","literal":"omphalocele is a true umbilical hernia (through the umbilical ring)"},{"n":"11","nombre":"Hand covered by puppet","ver":"Una mano cubierta por un títere/marioneta.","clinica":"En el onfalocele, los órganos abdominales herniados SÍ están cubiertos por peritoneo.","sketchy":"La mano \"cubierta\" por el títere representa directamente la cobertura peritoneal presente (a diferencia de la gastrosquisis).","literal":"in omphalocele, the herniated abdominal organs ARE covered by peritoneum"},{"n":"12","nombre":"Trisomy triplets with chromosome waistbands","ver":"Un grupo de tres niñas (trillizas) con bandas/cinturones tipo cromosoma.","clinica":"Los onfaloceles se asocian con trisomías (ej. trisomía 18, 13) y otros defectos congénitos (ej. anormalidades cardíacas, defectos del tubo neural).","sketchy":"Las \"trillizas\" (triplets) con bandas cromosómicas representan directamente las trisomías asociadas.","literal":"omphaloceles are associated with trisomies (e.g. trisomy 18, 13) and other congenital defects (e.g. cardiac abnormalities, neural tube defects)"},{"n":"13","nombre":"Intestines springing out of box","ver":"Intestinos saliendo/brotando de una caja sorpresa (jack-in-the-box).","clinica":"Hernia diafragmática congénita (CDH) (los órganos abdominales se hernian a través del hemidiafragma izquierdo hacia el tórax).","sketchy":"Los intestinos \"brotando hacia arriba\" representan la herniación de contenido abdominal hacia el tórax.","literal":"congenital diaphragmatic hernia (CDH) (abdominal organs herniate through the left hemidiaphragm and into the thorax)"},{"n":"14","nombre":"Scrunched up lung shirt","ver":"Una camiseta con estampado de pulmón, arrugada/comprimida (scrunched up).","clinica":"La hernia diafragmática congénita puede causar hipoplasia pulmonar e hipertensión pulmonar (debido a la compresión de los pulmones por los órganos abdominales).","sketchy":"El pulmón \"comprimido/arrugado\" en la camiseta representa la hipoplasia pulmonar por compresión.","literal":"congenital diaphragmatic hernia can cause pulmonary hypoplasia and pulmonary hypertension (due to compression of the lungs by abdominal organs)"},{"n":"15","nombre":"Skull and X bones","ver":"Un símbolo de calavera y huesos cruzados en forma de \"X\" en la caja.","clinica":"La radiografía de tórax puede usarse para diagnosticar la hernia diafragmática congénita (gas intestinal y órganos abdominales por encima del diafragma).","sketchy":"Los huesos en \"X\" representan la radiografía (X-ray) usada para el diagnóstico.","literal":"chest X-ray can be used to diagnose congenital diaphragmatic hernia (bowel gas and abdominal organs above the diaphragm)"},{"n":"16","nombre":"Broken tracheal and esophageal slide","ver":"Un tobogán roto/quebrado con forma de tráquea y esófago.","clinica":"Fístula traqueoesofágica (TEF).","sketchy":"El tobogán \"roto\" con forma de tráquea-esófago representa literalmente la conexión anormal (fístula) entre ambas estructuras.","literal":"tracheoesophageal fistula (TEF)"},{"n":"17","nombre":"\"SEPTEMBER\"","ver":"Un cartel que dice \"Back to School September 4th-5th\".","clinica":"Las fístulas TE son resultado de una falla de SEPTACIÓN del tubo traqueoesofágico.","sketchy":"\"SEPTEMBER\" con \"SEPT\" resaltado es la clave literal directa de \"SEPTation\" (septación).","literal":"TE fistulas are a result of failure of SEPTATION of the tracheoesophageal tube"},{"n":"18","nombre":"\"4th and 5th\"","ver":"Las fechas \"4th-5th\" en el mismo cartel de regreso a clases.","clinica":"La septación traqueoesofágica ocurre normalmente a las 4-5 semanas de gestación.","sketchy":"Las fechas \"4th and 5th\" son la clave numérica literal directa de las semanas de gestación.","literal":"tracheoesophageal septation normally occurs at 4-5 weeks of gestation"},{"n":"19","nombre":"Tube-slide connection","ver":"Un tubo conectando dos toboganes transparentes.","clinica":"La fístula TE pura (tráquea y esófago conectados por un puente) (rara).","sketchy":"La \"conexión de tubo\" entre ambos toboganes representa literalmente el puente fistuloso entre tráquea y esófago.","literal":"pure TE fistula (trachea and esophagus are connected by a bridge) (rare)"},{"n":"20","nombre":"Stuck in tube","ver":"Un bebé atascado dentro de un tubo transparente vertical.","clinica":"Atresia esofágica (tráquea normal).","sketchy":"El bebé \"atascado\" en el tubo (sin poder pasar) representa literalmente la atresia (obstrucción completa) esofágica.","literal":"esophageal atresia (normal trachea)"},{"n":"21","nombre":"Crooked slide","ver":"Un tobogán torcido/desviado (crooked) cerca de los otros toboganes.","clinica":"La fístula TE tipo C se forma cuando el esófago proximal termina como una bolsa ciega y el esófago distal crece desde la tráquea.","sketchy":"El tobogán \"torcido\" representa la conexión anormal y desviada característica del tipo C.","literal":"type-C TE fistula forms when the proximal esophagus ends as a blind pouch and the distal esophagus grows from the trachea"},{"n":"22","nombre":"Vomiting white while stuck on esophageal ring","ver":"Un bebé vomitando líquido blanco mientras está atrapado en una estructura circular tipo esófago.","clinica":"La fístula TE tipo C causa emesis NO biliosa (el esófago proximal termina en bolsa ciega → el alimento nunca llega a los intestinos).","sketchy":"El vómito \"blanco\" (no bilioso) representa que el alimento nunca alcanza los intestinos.","literal":"type-C TE fistula causes non-bilious emesis (proximal esophagus ends in blind pouch → food never reaches intestines)"},{"n":"23","nombre":"Distended belly stuck in tube","ver":"Un bebé con el vientre distendido, atrapado dentro de un tubo.","clinica":"La fístula TE tipo C causa distensión abdominal (debido al flujo de aire desde la tráquea hacia el estómago).","sketchy":"El vientre \"distendido\" representa directamente la distensión abdominal por el paso de aire.","literal":"type-C TE fistula causes abdominal distention (due to flow of air from trachea into stomach)"},{"n":"24","nombre":"Refluxing onto lung shirt","ver":"Reflujo de líquido cayendo sobre una camiseta con estampado de pulmón.","clinica":"La fístula TE tipo C causa neumonitis recurrente y neumonía por aspiración (debido al reflujo de contenido gástrico ácido hacia los pulmones).","sketchy":"El reflujo \"cayendo sobre el pulmón\" representa directamente la aspiración de contenido ácido.","literal":"type-C TE fistula causes recurrent pneumonitis and aspiration pneumonia (due to reflux of acidic stomach contents into lungs)"},{"n":"25","nombre":"Wet baby doll","ver":"Una muñeca de bebé mojada en el suelo.","clinica":"La fístula TE tipo C causa polihidramnios in utero (debido a que el feto no puede tragar líquido amniótico).","sketchy":"La muñeca \"mojada\" representa el exceso de líquido amniótico (polihidramnios).","literal":"type-C TE fistula causes polyhydramnios in utero (due to fetus unable to swallow amniotic fluid)"},{"n":"26","nombre":"Abnormal doll","ver":"Una muñeca de aspecto anormal tirada en el suelo.","clinica":"La fístula TE puede asociarse con otras anomalías congénitas, incluyendo la asociación VACTERL.","sketchy":"La muñeca \"anormal\" representa las otras anomalías congénitas asociadas (VACTERL).","literal":"TE fistula can be associated with other congenital anomalies, including VACTERL association"},{"n":"27","nombre":"\"C\" curved tube","ver":"Un tubo curvado con forma de \"C\".","clinica":"Duodeno.","sketchy":"La curvatura en \"C\" representa literalmente la forma anatómica del duodeno.","literal":"duodenum"},{"n":"28","nombre":"Collapsed C tube","ver":"El tubo en forma de \"C\" colapsado en un segmento.","clinica":"La atresia duodenal ocurre cuando la segunda porción del duodeno falla en recanalizarse.","sketchy":"El tubo \"colapsado\" en un punto representa la falla de recanalización.","literal":"duodenal atresia occurs when second portion of duodenum fails to recanalize"},{"n":"29","nombre":"Green vomit","ver":"Un niño vomitando líquido verde.","clinica":"La atresia duodenal se presenta con emesis BILIOSA (debido a obstrucción distal a la Ampolla de Vater).","sketchy":"El vómito \"verde\" (bilioso) representa directamente la emesis biliosa.","literal":"duodenal atresia presents with BILIOUS emesis (due to obstruction distal to Ampulla of Vater)"},{"n":"30","nombre":"Two fun domes with skull and X bones","ver":"Dos cúpulas/toboganes redondos (\"domes\") con calaveras y huesos en \"X\".","clinica":"En radiografía, la atresia duodenal causa el signo de \"doble burbuja\" (una burbuja de aire en el estómago y otra en el duodeno proximal).","sketchy":"Las \"dos cúpulas\" (domes) representan literalmente las dos burbujas del signo radiológico \"double bubble\".","literal":"on X-ray, duodenal atresia causes the \"double bubble\" sign (one bubble of air in stomach and one in proximal duodenum)"},{"n":"31","nombre":"Obstructing end of tube","ver":"El extremo de un tobogán/tubo obstruido, con un niño atrapado dentro.","clinica":"Atresia intestinal distal (yeyuno o íleon).","sketchy":"El extremo \"obstruido\" del tubo representa la atresia (obstrucción) en la porción distal del intestino.","literal":"distal intestinal atresia (jejunum or ileum)"},{"n":"32","nombre":"Compressing red vascular hair","ver":"Un cabello/hilo rojo comprimido, con textura vascular.","clinica":"La atresia intestinal distal es causada por un accidente vascular in utero (disminución del flujo sanguíneo al intestino → disminución del aporte de nutrientes y oxígeno → crecimiento intestinal alterado).","sketchy":"El \"hilo vascular rojo comprimido\" representa el accidente vascular que interrumpe el flujo sanguíneo.","literal":"distal intestinal atresia is caused by in-utero vascular accident (decreased blood flow to intestine → decreased delivery of nutrients and oxygen → impaired intestinal growth)"},{"n":"33","nombre":"Green vomit","ver":"Otro niño vomitando líquido verde dentro del tobogán tubular.","clinica":"La atresia intestinal distal se presenta con emesis biliosa (debido a obstrucción distal a la Ampolla de Vater).","sketchy":"Repite el vómito verde para marcar la emesis biliosa, ahora en la atresia distal.","literal":"distal intestinal atresia presents with bilious emesis (due to obstruction distal to Ampulla of Vater)"},{"n":"34","nombre":"Distended belly","ver":"Un niño con el vientre distendido dentro del tubo tobogán.","clinica":"La atresia intestinal distal se presenta con distensión abdominal (debido a la acumulación de aire proximal a la obstrucción).","sketchy":"El vientre \"distendido\" representa la acumulación de aire proximal a la obstrucción.","literal":"distal intestinal atresia presents with abdominal distension (due to accumulation of air proximal to obstruction)"},{"n":"35","nombre":"Violinist","ver":"Un niño tocando el violín.","clinica":"Conducto vitelino (conducto onfalomesentérico, conecta el íleon con el saco vitelino durante la vida fetal).","sketchy":"\"Violinist\" suena fonéticamente similar a \"VITELLine\" (conducto vitelino).","literal":"vitelline duct (omphalomesenteric duct, connects ileum to yolk sac during fetal life)"},{"n":"36","nombre":"Meckel hecklers","ver":"Niños \"abucheando\" (hecklers) al violinista.","clinica":"El divertículo de Meckel (divertículo verdadero en el íleon) se forma si el conducto vitelino falla en obliterarse.","sketchy":"\"Hecklers\" suena fonéticamente similar al final de \"MECKEL's\", asociados al violinista (conducto vitelino).","literal":"Meckel diverticulum (true diverticulum in the ileum) forms if vitelline duct fails to obliterate"},{"n":"37","nombre":"Gastric violin","ver":"Un violín con forma de estómago.","clinica":"Los divertículos de Meckel pueden contener mucosa gástrica (lo más común) y otro tejido ectópico (pancreático, endometrial, etc.).","sketchy":"El violín \"con forma de estómago\" (gastric) representa directamente la mucosa gástrica ectópica.","literal":"Meckel diverticula can contain gastric mucosa (most common) and other ectopic tissue (pancreatic, endometrial, etc.)"},{"n":"38","nombre":"Tarry black paint","ver":"Pintura negra alquitranada (tarry) derramada en el suelo.","clinica":"Los divertículos de Meckel pueden presentarse con melena indolora (tejido ectópico funcional → ulceración y sangrado).","sketchy":"La pintura \"negra alquitranada\" es la representación literal directa de la melena.","literal":"Meckel diverticula can present with painless melena (functional ectopic gastric tissue → ulceration and bleeding)"},{"n":"39","nombre":"\"2\" signs","ver":"Carteles con el número \"2\" sostenidos por varios niños.","clinica":"El divertículo de Meckel ocurre en el 2% de la población, existe a 2 pies proximal a la válvula ileocecal, mide 2 pulgadas de longitud, se presenta ~2 años de edad, tiene proporción 2:1 hombre:mujer.","sketchy":"Los carteles con el número \"2\" son la clave numérica literal de la \"regla de los 2\" del divertículo de Meckel.","literal":"Meckel diverticulum occurs in 2% of population, exists 2 feet proximal to ileocecal valve, 2 inches in length, presents ~ 2 years of age, has 2:1 male:female ratio"},{"n":"40","nombre":"Technique book","ver":"Un libro titulado \"TECHNIQUE\" en el suelo.","clinica":"El divertículo de Meckel puede diagnosticarse con un escaneo de pertecnetato-tecnecio-99m (la mucosa gástrica capta tecnecio-99m).","sketchy":"\"TECHNIQUE\" resaltado es la clave literal fonética para \"TECHNEtium\".","literal":"Meckel diverticulum can be diagnosed with a technetium-99m pertechnetate scan (gastric mucosa takes up technetium-99m)"},{"n":"41","nombre":"HORSE-SPRING ride","ver":"Un caballito de resorte (horse spring ride) de juegos infantiles.","clinica":"Enfermedad de Hirschsprung.","sketchy":"\"HORSE-SPRING\" suena fonéticamente similar a \"HIRSCHSPRUNG\".","literal":"Hirschsprung's disease"},{"n":"42","nombre":"Migrating CREST border","ver":"Un escudo con una cresta (crest) que \"migra\" en el caballito.","clinica":"La enfermedad de Hirschsprung se desarrolla debido a una falla en la migración de células de la cresta neural (que normalmente migran desde el ectodermo embrionario hacia los órganos).","sketchy":"La \"cresta\" (crest) migrando representa literalmente las células de la cresta neural.","literal":"Hirschsprung's develops due to failed neural crest cell migration (normally migrate from the embryonic ectoderm into organs)"},{"n":"43","nombre":"Disconnected plug","ver":"Un cable/enchufe desconectado cerca del caballito de resorte.","clinica":"En la enfermedad de Hirschsprung, la migración alterada de células de la cresta neural lleva a inervación ausente (sin ganglios neurales) del colon distal (SIEMPRE involucrando el recto).","sketchy":"El enchufe \"desconectado\" representa directamente la ausencia de inervación (conexión neural).","literal":"in Hirschsprung's disease, impaired migration of neural crest cells leads to absent innervation (no neural ganglia) of the distal colon (ALWAYS involving the rectum)"},{"n":"44","nombre":"Tightly wound rectum spring","ver":"Un resorte fuertemente enrollado (tightly wound) en la base del caballito.","clinica":"En ausencia de inervación, los músculos rectales permanecen contraídos.","sketchy":"El resorte \"fuertemente enrollado\" representa la contracción sostenida del músculo rectal.","literal":"in the absence of innervation, the rectal muscles remain contracted"},{"n":"45","nombre":"Dilating \"S\" slinky","ver":"Un resorte tipo \"slinky\" con forma de \"S\" dilatándose/expandiéndose.","clinica":"En la enfermedad de Hirschsprung, el colon proximal a la constricción (usualmente el colon sigmoide) se llena de heces y se dilata (formando \"megacolon\").","sketchy":"La forma \"S\" del slinky representa el colon Sigmoide, y su dilatación el megacolon.","literal":"in Hirschsprung's disease, colon proximal to the constriction (usually sigmoid colon) fills with stool and dilates (forming \"megacolon\")"},{"n":"46","nombre":"Blackened stool stuck in spring","ver":"Heces oscuras/ennegrecidas atascadas en el resorte.","clinica":"La enfermedad de Hirschsprung se presenta con falla en pasar meconio dentro de las 48 horas tras el nacimiento.","sketchy":"Las heces \"atascadas\" (ennegrecidas = meconio) representan la retención de meconio.","literal":"Hirschsprung's disease presents with failure to pass meconium within 48 hours after birth"},{"n":"47","nombre":"Yo-yo not rotating","ver":"Un yo-yo que no rota correctamente en manos de un niño.","clinica":"Malrotación intestinal (falla en experimentar la rotación normal de 270 grados en sentido antihorario durante el desarrollo fetal).","sketchy":"El yo-yo \"sin rotar\" representa literalmente la falla de rotación intestinal.","literal":"intestinal malrotation (failure to undergo normal 270 degree counterclockwise rotation during fetal development)"},{"n":"48","nombre":"Yo-yo in RUQ pocket","ver":"El yo-yo guardado en el bolsillo derecho (RUQ, cuadrante superior derecho) del niño.","clinica":"En la malrotación intestinal, el ciego está localizado en el cuadrante superior derecho.","sketchy":"El yo-yo \"en el bolsillo derecho superior\" representa la ubicación anómala del ciego.","literal":"in intestinal malrotation, the cecum is located in right upper quadrant"},{"n":"49","nombre":"String compressing belly","ver":"Una cuerda comprimiendo el vientre de un niño.","clinica":"La malrotación intestinal puede causar obstrucción duodenal (debido a bandas fibrosas [\"bandas de Ladd\"] que conectan el ciego mal ubicado con el retroperitoneo).","sketchy":"La cuerda \"comprimiendo\" representa literalmente las bandas fibrosas de Ladd.","literal":"intestinal malrotation can cause duodenal obstruction (due to fibrous bands [\"Ladd's bands\"] that connect abnormally located cecum to retroperitoneum)"},{"n":"50","nombre":"Distended belly & green face","ver":"Un niño con el vientre distendido y el rostro verdoso (vomitando).","clinica":"En la malrotación intestinal, la obstrucción duodenal puede llevar a distensión abdominal y vómito.","sketchy":"El vientre distendido y el rostro verde representan ambos síntomas combinados.","literal":"in intestinal malrotation, duodenal obstruction can lead to abdominal distension and vomiting"},{"n":"51","nombre":"Knot in waist sweater","ver":"Un suéter/prenda anudada alrededor de la cintura de un niño.","clinica":"En la malrotación intestinal, la torsión alrededor de las bandas de Ladd puede causar vólvulo del intestino medio (emergencia quirúrgica por riesgo de necrosis intestinal).","sketchy":"El \"nudo en la cintura\" representa literalmente la torsión del vólvulo intestinal.","literal":"in intestinal malrotation, twisting around Ladd's bands can cause midgut volvulus (surgical emergency due to risk of bowel necrosis)"},{"n":"52","nombre":"Death metal baby","ver":"Un bebé vestido con estilo \"death metal\" (calavera en la ropa).","clinica":"Enterocolitis necrotizante (NEC).","sketchy":"\"Death\" (muerte) representa la palabra \"NECrotizing\" (necrotizante) por asociación temática de muerte tisular.","literal":"necrotizing enterocolitis (NEC)"},{"n":"53","nombre":"Small emaciated baby","ver":"Un bebé pequeño y de apariencia delgada/emaciada.","clinica":"La enterocolitis necrotizante (NEC) se desarrolla en infantes prematuros y de bajo peso.","sketchy":"El bebé \"pequeño y emaciado\" representa directamente la prematuridad y el bajo peso.","literal":"necrotizing enterocolitis (NEC) develops in premature and underweight infants"},{"n":"54","nombre":"Baby bottle","ver":"Un biberón sostenido cerca del bebé.","clinica":"La enterocolitis necrotizante comienza cuando un infante empieza a alimentarse (las bacterias introducidas al intestino sobrepasan el sistema inmune gastrointestinal inmaduro).","sketchy":"El biberón representa directamente el inicio de la alimentación como desencadenante.","literal":"necrotizing enterocolitis begins when an infant starts feeding (bacteria introduced into the gut overpowers the immature gastrointestinal immune system)"},{"n":"55","nombre":"Inner layer of bacterial wallpaper","ver":"Un papel tapiz con patrón de bacterias en la pared del cuarto del bebé.","clinica":"En la enterocolitis necrotizante, las bacterias invaden la pared intestinal.","sketchy":"El \"papel tapiz bacteriano\" en la \"capa interna\" representa la invasión bacteriana de la pared intestinal.","literal":"in necrotizing enterocolitis, bacteria invade the bowel wall"},{"n":"56","nombre":"Big belly & red diaper","ver":"Un bebé con vientre grande y un pañal manchado de rojo.","clinica":"La enterocolitis necrotizante se presenta con distensión abdominal y heces sanguinolentas.","sketchy":"El vientre \"grande\" y el pañal \"rojo\" representan ambos síntomas combinados.","literal":"necrotizing enterocolitis presents with abdominal distention and bloody stools"},{"n":"57","nombre":"Black outlines","ver":"Contornos/líneas negras delineando estructuras en la escena.","clinica":"La enterocolitis necrotizante causa neumatosis intestinal (bolsillos de gas en la pared intestinal, causa contornos negros del lumen intestinal en radiografía).","sketchy":"Los \"contornos negros\" son la representación literal directa del hallazgo radiológico de neumatosis intestinal.","literal":"necrotizing enterocolitis causes pneumatosis intestinalis (pockets of gas in bowel wall, causes black outlines of bowel lumen on X-ray)"},{"n":"58","nombre":"Skull shirt","ver":"Una camiseta con estampado de calavera que viste el bebé \"death metal\".","clinica":"La enterocolitis necrotizante puede causar necrosis intestinal extensa y muerte.","sketchy":"La \"calavera\" en la camiseta representa directamente el riesgo de muerte por necrosis extensa.","literal":"necrotizing enterocolitis can cause extensive bowel necrosis and death"}]}]},{"nombre":"Hematología","codigo":"he","temas":[{"slug":"defectos-coagulacion-adquiridos","titulo":"Defectos de coagulación adquiridos","items":[{"n":"1","nombre":"DICe","ver":"Un dado (dice) marcado en la escena de sala de estar.","clinica":"Coagulación intravascular diseminada (DIC) (una coagulopatía adquirida).","sketchy":"\"DICe\" con \"DIC\" resaltado es la clave literal directa del acrónimo DIC.","literal":"disseminated intravascular coagulation (DIC) (an acquired coagulopathy)"},{"n":"2","nombre":"Thrombotic trees","ver":"Árboles con ramificaciones tipo trombo en la pantalla del videojuego.","clinica":"El DIC lleva a coagulación excesiva (debido a activación del sistema de coagulación).","sketchy":"Los árboles \"trombóticos\" representan literalmente la coagulación excesiva.","literal":"DIC leads to excessive clotting (due to activation of the coagulation system)"},{"n":"3","nombre":"Hemorrhaging red drink","ver":"Una bebida roja derramándose/hemorrágica cerca del sillón.","clinica":"El DIC lleva a sangrado excesivo (debido a activación del sistema fibrinolítico).","sketchy":"La bebida \"hemorrágica\" representa literalmente el sangrado excesivo.","literal":"DIC leads to excessive bleeding (due to activation of the fibrinolytic system)"},{"n":"4","nombre":"\"SEPTIC\"","ver":"Un cartel que dice \"SEPTIC KEEP OUT\" sobre la mesa del juego de mesa.","clinica":"La sepsis puede causar DIC.","sketchy":"\"SEPTIC\" es la clave literal directa de la sepsis como causa.","literal":"sepsis can cause DIC"},{"n":"5","nombre":"Pink gravestones","ver":"Lápidas rosadas dispuestas en el tablero de juego.","clinica":"La sepsis por gram-negativos (Neisseria meningitidis, etc.) es la causa más común de DIC (las proteínas bacterianas y lipopolisacáridos activan la coagulación).","sketchy":"Las lápidas \"rosadas\" representan la tinción gram-negativa (rosa) de las bacterias causantes.","literal":"gram-negative sepsis (Neisseria meningitidis, etc) is the most common cause of DIC (bacterial proteins and lipopolysaccharides activate coagulation)"},{"n":"6","nombre":"Thrombotic trees","ver":"Más árboles trombóticos ramificándose en el tablero de juego.","clinica":"En el DIC, la exposición a sustancias procoagulantes lleva a la activación de la cascada de coagulación.","sketchy":"Los árboles trombóticos repiten el símbolo de la activación de la cascada de coagulación.","literal":"in DIC, exposure to procoagulant substances leads to activation of the coagulation cascade"},{"n":"7","nombre":"Cancer crab","ver":"Un cangrejo rojo en el tablero de juego.","clinica":"La malignidad (especialmente la leucemia promielocítica aguda) puede causar DIC.","sketchy":"El cangrejo (símbolo de cáncer) representa la malignidad como causa de DIC.","literal":"malignancy (esp. acute promyelocytic leukemia) can cause DIC"},{"n":"8","nombre":"Cast","ver":"Un yeso (cast) en el brazo de uno de los personajes.","clinica":"El trauma puede causar DIC.","sketchy":"El \"yeso\" representa directamente el trauma como causa de DIC.","literal":"trauma can cause DIC"},{"n":"9","nombre":"Pregnant mom","ver":"Una mujer embarazada de pie en la sala.","clinica":"Las complicaciones obstétricas pueden causar DIC.","sketchy":"La mujer \"embarazada\" representa directamente las complicaciones obstétricas.","literal":"obstetric complications can cause DIC"},{"n":"10","nombre":"Losing coagulation fighters","ver":"Figuras de acción/luchadores perdiendo/cayendo en el videojuego.","clinica":"El DIC causa depleción tanto de componentes pro- como anticoagulantes (debido a la activación excesiva de la cascada de coagulación) (\"COAGULOPATÍA CONSUNTIVA\").","sketchy":"Los \"luchadores perdiendo\" representan la depleción de los componentes de coagulación que son \"consumidos\" en la batalla.","literal":"DIC causes depletion of both pro- and anti-coagulant components (due to excessive activation of coagulation cascade) (\"CONSUMPTIVE COAGULOPATHY\")"},{"n":"11","nombre":"Broken plates","ver":"Platos rotos esparcidos por el suelo.","clinica":"El DIC causa consumo de plaquetas (debido a coagulación excesiva).","sketchy":"Los \"platos rotos\" (plates = platelets, plaquetas) representan el consumo de plaquetas.","literal":"DIC causes consumption of platelets (due to excessive clotting)"},{"n":"12","nombre":"Red arm spots & bleeding from spear entry points","ver":"Manchas rojas en el brazo de un personaje y sangrado en los puntos de entrada de una lanza/arma.","clinica":"El DIC causa sangrado \"tipo plaquetario\" (petequias, equimosis, sangrado mucocutáneo, supuración de vías IV o arteriales).","sketchy":"Las manchas rojas en el brazo y el sangrado de los \"puntos de entrada\" representan el sangrado tipo plaquetario (petequias, sitios de punción).","literal":"DIC causes \"platelet\" type bleeding (petechiae, ecchymoses, mucocutaneous bleeding, oozing from IVs or arterial lines)"},{"n":"13","nombre":"Head bleeding","ver":"Sangrado visible en la cabeza de un personaje.","clinica":"El DIC causa sangrado \"tipo coagulopatía\" (GI, genitourinario, o hemorragias cerebrales).","sketchy":"El \"sangrado de cabeza\" representa la hemorragia cerebral del sangrado tipo coagulopatía.","literal":"DIC causes \"coagulopathy\" type bleeding (GI, genitourinary, or cerebral hemorrhages)"},{"n":"14","nombre":"Clot in \"ILIOFEMORAL\" river and lung tree","ver":"Un coágulo en un río etiquetado \"ILIOFEMORAL\" y en un árbol con forma de pulmón en la pantalla de televisión.","clinica":"El DIC puede causar trombos venosos (más comúnmente TVP en venas ilio-femorales +/- émbolos pulmonares).","sketchy":"El río \"ILIOFEMORAL\" y el árbol pulmonar son la clave literal directa de la ubicación de los trombos venosos y émbolos pulmonares.","literal":"DIC can cause venous thrombi (most commonly DVTs in iliofemoral veins +/- pulmonary emboli)"},{"n":"15","nombre":"Red skull lagoon","ver":"Una laguna con una calavera roja en la pantalla del videojuego de guerra.","clinica":"El DIC puede causar infarto tisular y de órganos (debido a trombos arteriales).","sketchy":"La \"calavera\" en la laguna roja representa la muerte tisular (infarto) por trombos arteriales.","literal":"DIC can cause tissue and organ infarction (due to arterial thrombi)"},{"n":"16","nombre":"ParaTrooper","ver":"Un paracaidista (paratrooper) en la escena del videojuego.","clinica":"El DIC lleva a PT prolongado (debido al consumo de factores de coagulación en la vía EXTRÍNSECA).","sketchy":"\"ParaTrooper\" con \"PT\" resaltado es la clave literal directa del tiempo de protrombina prolongado.","literal":"DIC leads to prolonged PT (due to consumption of coagulation factors in EXTRINSIC pathway)"},{"n":"17","nombre":"\"PTTTT\"","ver":"Un teléfono etiquetado \"PTTTT\" en la escena de la sala.","clinica":"El DIC lleva a aPTT prolongado (debido al consumo de factores de coagulación en la vía INTRÍNSECA).","sketchy":"\"PTTTT\" es la clave literal directa del aPTT prolongado.","literal":"DIC leads to prolonged aPTT (due to consumption of coagulation factors in INTRINSIC pathway)"},{"n":"18","nombre":"Bloody clock","ver":"Un reloj manchado de sangre en la pared.","clinica":"El DIC lleva a tiempo de sangrado prolongado (debido a trombocitopenia por consumo de plaquetas).","sketchy":"El \"reloj ensangrentado\" representa literalmente el tiempo de sangrado prolongado.","literal":"DIC leads to prolonged bleeding time (due to thrombocytopenia from platelet consumption)"},{"n":"19","nombre":"Raised D&D guide","ver":"Un libro/guía de juego de rol (D&D) levantado en la escena.","clinica":"El DIC causa D-dímero elevado (un producto de degradación de la fibrina).","sketchy":"\"D&D\" con las letras \"D\" resaltadas es la clave literal directa del \"D-dimer\" (D-dímero).","literal":"DIC causes elevated D-dimer (a fibrin degradation product)"},{"n":"20","nombre":"Half-eaten pepperoni","ver":"Una pizza de pepperoni a medio comer en el suelo.","clinica":"El DIC causa formación de esquistocitos (los glóbulos rojos se aprietan a través de pequeñas arterias llenas de coágulos de fibrina → daño mecánico a la membrana del glóbulo rojo).","sketchy":"Los pedazos \"mordidos/fragmentados\" de pepperoni representan literalmente los esquistocitos (glóbulos rojos fragmentados).","literal":"DIC causes formation of schistocytes (RBCs squeeze through small arteries full of fibrin clots → mechanical damage to RBC membrane)"},{"n":"21","nombre":"Empty \"Kill Korps\" case","ver":"Un estuche vacío etiquetado \"Kill Korps\" en el suelo.","clinica":"Deficiencia de vitamina K (una coagulopatía adquirida).","sketchy":"\"Kill Korps\" con \"K\" resaltado es la clave fonética directa de \"Vitamin K\".","literal":"Vitamin K deficiency (an acquired coagulopathy)"},{"n":"22","nombre":"Brigades 2, 7, 9, 10","ver":"Soldados/brigadas numeradas 2, 7, 9, 10 en la pantalla del videojuego.","clinica":"Factores 2, 7, 9, 10 (factores dependientes de vitamina K).","sketchy":"Los números de las brigadas son la clave numérica literal directa de los factores dependientes de vitamina K.","literal":"factors 2, 7, 9, 10 (vitamin K-dependent factors)"},{"n":"23","nombre":"\"C\" captain & \"S\" sergeant","ver":"Un capitán marcado con \"C\" y un sargento marcado con \"S\" en la escena militar.","clinica":"Proteína C y S (factores dependientes de vitamina K).","sketchy":"Las letras \"C\" y \"S\" en los rangos militares son la clave literal directa de las proteínas C y S.","literal":"protein C and S (vitamin K-dependent factors)"},{"n":"24","nombre":"Colonic chair","ver":"Una silla con forma de colon en la escena.","clinica":"La vitamina K es sintetizada por bacterias colónicas (a partir de precursores en vegetales de hoja verde, aceite de oliva y soya).","sketchy":"La \"silla colónica\" representa el colon, sitio de síntesis bacteriana de vitamina K.","literal":"Vitamin K is synthesized by colonic bacteria (from precursors in green leafy vegetables, olive and soybean)"},{"n":"25","nombre":"Liver VKOR console powering K controllers","ver":"Una consola de videojuego con forma de hígado, etiquetada \"VKOR\", alimentando controles marcados \"K\".","clinica":"La vitamina K es ACTIVADA por la enzima hepática epóxido reductasa (VKOR).","sketchy":"La consola \"VKOR\" con forma de hígado representa directamente la enzima hepática epóxido reductasa que activa la vitamina K.","literal":"Vitamin K is activated by the liver enzyme epoxide reductase (VKOR)"},{"n":"26","nombre":"Gamma bandages","ver":"Vendas etiquetadas \"gamma\" en la escena.","clinica":"La vitamina K es un cofactor para la gamma-glutamil carboxilasa (activa los factores dependientes de vitamina K).","sketchy":"Las vendas \"gamma\" son la clave literal directa de la \"gamma-glutamyl carboxylase\".","literal":"Vitamin K is a cofactor for gamma-glutamyl carboxylase (activates Vitamin K-dependent factors)"},{"n":"27","nombre":"Baby fumbling with K controller","ver":"Un bebé jugando torpemente (fumbling) con un control de videojuego marcado \"K\".","clinica":"Los recién nacidos tienen mayor riesgo de deficiencia de vitamina K (parcialmente debido a que el tracto GI carece de flora intestinal que sintetiza vitamina K; parcialmente debido a utilización disminuida de vitamina K por el hígado).","sketchy":"El \"bebé\" jugando torpemente con el control \"K\" representa directamente el riesgo neonatal de deficiencia de vitamina K.","literal":"newborns are at increased risk of Vitamin K deficiency (partially due to GI tract lacking intestinal flora that synthesize Vitamin K; partially due to decreased utilization of Vitamin K by the liver)"},{"n":"28","nombre":"Broken breast-shaped bottle","ver":"Un biberón con forma de pecho, roto o vacío.","clinica":"La leche materna contiene muy poca vitamina K (contribuye al riesgo aumentado de deficiencia de vitamina K en recién nacidos).","sketchy":"El biberón \"roto/vacío\" con forma de pecho representa la escasa cantidad de vitamina K en la leche materna.","literal":"breast milk contains very little Vitamin K (contributes to increased risk of Vitamin K deficiency in newborns)"},{"n":"29","nombre":"Red hair streaks","ver":"Mechones rojos en el cabello de un personaje.","clinica":"La deficiencia de vitamina K en infantes se presenta con enfermedad hemorrágica del recién nacido (hemorragia intracraneal, sangrado retroperitoneal, muerte).","sketchy":"Los \"mechones rojos\" representan el sangrado (hemorragia) de la enfermedad hemorrágica del recién nacido.","literal":"Vitamin K deficiency in infants presents with hemorrhagic disease of the newborn (intracranial hemorrhage, retroperitoneal bleeding, death)"},{"n":"30","nombre":"Syringe rattle toy","ver":"Un sonajero de bebé con forma de jeringa.","clinica":"A los recién nacidos se les da rutinariamente una inyección de vitamina K para disminuir el riesgo de deficiencia de vitamina K.","sketchy":"El \"sonajero-jeringa\" representa directamente la inyección profiláctica de vitamina K.","literal":"newborns are routinely given a Vitamin K injection to decrease the risk of Vitamin K deficiency"},{"n":"31","nombre":"House blocks","ver":"Bloques de construcción con forma de casa en la escena.","clinica":"El parto en casa (home birth) es un factor de riesgo para la deficiencia de vitamina K en recién nacidos (debido a la ausencia de la inyección de vitamina K).","sketchy":"Los \"bloques de casa\" representan directamente el parto domiciliario.","literal":"home birth is a risk factor for Vitamin K deficiency in newborns (due to absence of Vitamin K injection)"},{"n":"32","nombre":"Leaking debris","ver":"Escombros/desechos derramándose en la escena.","clinica":"Las enfermedades que causan malabsorción (enfermedad inflamatoria intestinal, pancreatitis crónica, etc.) pueden causar deficiencia de vitamina K.","sketchy":"Los \"escombros derramándose\" (leaking) representan la malabsorción de nutrientes.","literal":"diseases that cause malabsorption (inflammatory bowel disease, chronic pancreatitis, etc) can cause Vitamin K deficiency"},{"n":"33","nombre":"Fish antibiotics","ver":"Un frasco de antibióticos etiquetado para peces (fish antibiotics) en el acuario.","clinica":"Los antibióticos pueden causar deficiencia de vitamina K (al matar bacterias GI que sintetizan vitamina K).","sketchy":"Los \"antibióticos para peces\" en el acuario representan directamente el efecto de los antibióticos sobre la flora intestinal.","literal":"antibiotics can cause Vitamin K deficiency (by killing GI bacteria that synthesize Vitamin K)"},{"n":"34","nombre":"Liver rock","ver":"Una roca con forma de hígado dentro del acuario.","clinica":"La cirrosis puede causar deficiencia de vitamina K (al alterar la activación de vitamina K por la epóxido reductasa en el hígado).","sketchy":"La \"roca de hígado\" representa directamente la cirrosis hepática.","literal":"cirrhosis can cause Vitamin K deficiency (by impairing Vitamin K activation by epoxide reductase in the liver)"},{"n":"35","nombre":"Red stream out of gun & bloody nose","ver":"Una corriente roja saliendo de una pistola de juguete y sangrado nasal en un personaje.","clinica":"En adultos, la deficiencia de vitamina K causa sangrado \"tipo coagulopático\" (si es leve: moretones fáciles, epistaxis, sangrado prolongado tras lesión) (si es severo: sangrado GI y genitourinario).","sketchy":"La corriente roja de la pistola y la nariz sangrante representan el sangrado leve (epistaxis) tipo coagulopático.","literal":"in adults, Vitamin K deficiency causes \"coagulopathic\" type bleeding (if mild: easy bruising, epistaxis, prolonged bleeding after injury) (if severe: GI and genitourinary bleeding)"},{"n":"36","nombre":"ParaTrooper","ver":"Otro paracaidista en la escena del videojuego.","clinica":"La deficiencia de vitamina K causa PT prolongado (factor 7 reducido → activación disminuida de la vía EXTRÍNSECA).","sketchy":"Repite el símbolo del \"paratrooper\" (PT) para el tiempo de protrombina prolongado, ahora en deficiencia de vitamina K.","literal":"Vitamin K causes prolonged PT (reduced factor 7 → decreased activation of EXTRINSIC pathway)"},{"n":"37","nombre":"FFP fighter jets","ver":"Aviones de combate (fighter jets) etiquetados \"FFP\" en la pantalla del videojuego.","clinica":"La deficiencia de vitamina K puede tratarse con plasma fresco congelado (FFP) (contiene todos los factores dependientes de vitamina K).","sketchy":"Los \"aviones FFP\" son la clave literal directa del plasma fresco congelado.","literal":"Vitamin K deficiency can be treated with fresh frozen plasma (FFP)(contains all Vitamin K-dependent factors)"},{"n":"38","nombre":"\"K\" controller","ver":"Un control de videojuego marcado con la letra \"K\".","clinica":"La deficiencia leve de vitamina K puede tratarse con suplementación de vitamina K.","sketchy":"El control marcado \"K\" representa directamente la suplementación de vitamina K como tratamiento.","literal":"mild Vitamin K deficiency can be treated with Vitamin K supplementation"}]},{"slug":"linfoma-no-hodgkin","titulo":"Linfoma no-Hodgkin","items":[{"n":"1","nombre":"Chess board with b-cell archers","ver":"Un tablero de ajedrez con arqueros con forma de célula B (b-cell archers) en una habitación oscura tipo taller mágico.","clinica":"Linfoma (tumores que se originan en el tejido linfoide) (dividido en tipos Hodgkin y no-Hodgkin).","sketchy":"Los \"arqueros célula B\" en el tablero representan las células de origen del linfoma.","literal":"lymphoma (tumors that originate in the lymphoid tissue)(divided into Hodgkin and non-Hodgkin types)"},{"n":"2","nombre":"Crossed out Hodgwig owl","ver":"Un búho llamado \"Hodgwig\" tachado (crossed out).","clinica":"Linfoma NO-Hodgkin (NHL).","sketchy":"El búho \"Hodgwig\" tachado representa literalmente \"NO-Hodgkin\".","literal":"non-Hodgkin lymphoma (NHL)"},{"n":"3","nombre":"Adult archer pieces","ver":"Piezas de ajedrez adultas con forma de arquero (adult archer pieces).","clinica":"El NHL es más comúnmente el resultado de proliferación de linfocitos B MADUROS.","sketchy":"Las piezas \"adultas\" (maduras) representan directamente los linfocitos B maduros.","literal":"NHL is most commonly a result of proliferation of MATURE B lymphocytes"},{"n":"4","nombre":"Bone box","ver":"Una caja con textura de hueso (bone box).","clinica":"La médula ósea es un órgano linfoide PRIMARIO (donde las células B se originan y comienzan el proceso de maduración).","sketchy":"La \"caja de hueso\" representa literalmente la médula ósea.","literal":"the bone marrow is a PRIMARY lymphoid organ (where B-cells originate and begin the maturation process)"},{"n":"5","nombre":"Archers heading into SPLEEN sac","ver":"Arqueros dirigiéndose hacia un saco etiquetado \"SPLEEN\" (spleen sac).","clinica":"Las células B inmaduras MIGRAN hacia el BAZO, donde ganan la capacidad de producir IgD (además de IgM).","sketchy":"El \"saco SPLEEN\" es la clave literal directa del bazo.","literal":"immature B-cells migrate to the SPLEEN, where they gain the ability to make IgD (in addition to IgM)"},{"n":"6","nombre":"Archers heading to chessboard","ver":"Arqueros dirigiéndose hacia el tablero de ajedrez (chessboard).","clinica":"Las células B MADURAS migran hacia órganos linfoides SECUNDARIOS (bazo, ganglios linfáticos, amígdalas, tejido especializado en tracto GI y respiratorio).","sketchy":"El \"tablero de ajedrez\" representa los órganos linfoides secundarios como destino de migración.","literal":"mature B-cells migrate to SECONDARY lymphoid organs (spleen, lymph nodes, tonsils, specialized tissue in GI and respiratory tracts)"},{"n":"7","nombre":"Shooting IgM arrows","ver":"Flechas etiquetadas \"IgM\" siendo disparadas (shooting IgM arrows).","clinica":"Algunas células B maduras se convierten en células plasmáticas productoras de IgM (independientes de células T) → secretan IgM desde la médula ósea.","sketchy":"Las \"flechas IgM\" representan directamente la secreción de este anticuerpo.","literal":"some mature B-cells become IgM-producing plasma cells (T-cell independent) → secrete IgM from the bone marrow"},{"n":"8","nombre":"Shooting IgG arrows","ver":"Flechas etiquetadas \"IgG\" siendo disparadas (shooting IgG arrows).","clinica":"Algunas células B maduras (aquellas activadas por células T) se convierten en células plasmáticas especializadas (secretan IgG, IgA, IgE desde la médula ósea).","sketchy":"Las \"flechas IgG\" representan directamente la secreción de estos anticuerpos.","literal":"some mature B-cells (those activated by T-cells) become specialized plasma cells (secrete IgG, IgA, IgE from the bone marrow)"},{"n":"9","nombre":"\"XIX\" & \"XX\" stitching","ver":"Bordados con números romanos \"XIX\" y \"XX\" en la vestimenta de los personajes.","clinica":"En el linfoma no-Hodgkin, las células neoplásicas (células B MADURAS) expresan los marcadores de células B CD19 y CD20.","sketchy":"\"XIX\" (19) y \"XX\" (20) son la clave numérica literal directa de CD19 y CD20.","literal":"in non-Hodgkin lymphoma, the neoplastic cells (MATURE B-cells) express the B-cell markers CD19 and CD20"},{"n":"10","nombre":"Crossed out owl's eyes","ver":"Los ojos de un búho tachados (crossed out owl's eyes).","clinica":"El linfoma no-Hodgkin (NHL) NO tiene células de Reed-Sternberg (a diferencia del linfoma de Hodgkin).","sketchy":"Los \"ojos de búho tachados\" (las células de Reed-Sternberg se describen clásicamente como \"ojos de búho\") representan su ausencia en el NHL.","literal":"non-Hodgkin lymphoma (NHL) does not have Reed-Sternberg cells (unlike Hodgkin lymphoma)"},{"n":"11","nombre":"Sporadic bat nodes","ver":"Murciélagos dispersos esporádicamente (sporadic bat nodes) colgando del techo.","clinica":"El NHL usualmente afecta MÚLTIPLES ganglios linfáticos en una distribución NO CONTIGUA (a diferencia de la propagación contigua en el linfoma de Hodgkin).","sketchy":"Los \"murciélagos esporádicos\" (dispersos, no contiguos) representan la distribución no contigua del NHL.","literal":"NHL usually affects multiple lymph nodes in a NON-contiguous distribution (unlike contiguous spread in Hodgkin lymphoma)"},{"n":"12","nombre":"Scattered chess pieces","ver":"Piezas de ajedrez dispersas (scattered chess pieces) en la mesa.","clinica":"El NHL comúnmente involucra tejidos linfoides secundarios EXTRA-nodales (bazo, amígdalas, tracto GI, tejido respiratorio) y tejidos NO linfoides (SNC) (a diferencia del linfoma de Hodgkin).","sketchy":"Las \"piezas dispersas\" (fuera del tablero central) representan la afectación extra-nodal.","literal":"NHL commonly involves EXTRA-nodal secondary lymphoid tissues (spleen, tonsils, GI tract, respiratory tract) and NON-lymphoid tissues (CNS) (unlike Hodgkin lymphoma)"},{"n":"13","nombre":"\"Burkitt\" sign","ver":"Un letrero que dice \"Burkitt\" en la escena.","clinica":"Linfoma de BURKITT (un linfoma de células B agresivo).","sketchy":"El letrero \"Burkitt\" es la clave literal directa del nombre del linfoma.","literal":"BURKITT lymphoma (an aggressive B-cell lymphoma)"},{"n":"14","nombre":"\"Translocating cabinet\"","ver":"Un gabinete etiquetado \"Translocating Cabinet\" en el taller.","clinica":"El linfoma de Burkitt t(8;14), el linfoma folicular t(14;18), el linfoma de células del manto t(11;14), y el linfoma extra de zona marginal t(11;18) están asociados con translocaciones genéticas específicas.","sketchy":"El \"gabinete translocante\" es la clave literal directa de las \"translocations\" genéticas.","literal":"Burkitt t(8;14), follicular t(14;18), mantle cell t(11;14), and extra marginal zone lymphoma t(11;18) are associated with specific gene translocations"},{"n":"15","nombre":"\"8\" door above \"14\" candelabra","ver":"Una puerta marcada \"8\" sobre un candelabro marcado \"14\".","clinica":"El linfoma de BURKITT es causado por una translocación entre el cromosoma 8 y el 14 t(8;14).","sketchy":"La \"puerta 8\" sobre el \"candelabro 14\" representa literalmente la translocación t(8;14).","literal":"BURKITT lymphoma is caused by a translocation between chromosome 8 to 14 t(8;14)"},{"n":"16","nombre":"MYC mice","ver":"Ratones etiquetados \"MYC\" (MYC mice) en el taller.","clinica":"En el linfoma de BURKITT, la translocación t(8;14) lleva a sobreexpresión del oncogén c-MYC.","sketchy":"Los \"ratones MYC\" son la clave literal directa del oncogén \"c-MYC\".","literal":"in BURKITT lymphoma, the t(8;14) translocation leads to overexpression of the c-MYC oncogene"},{"n":"17","nombre":"MYC mice growing in size","ver":"Los ratones \"MYC\" creciendo de tamaño (growing in size) en el taller.","clinica":"En el linfoma de BURKITT, la sobreexpresión del oncogén c-MYC lleva a crecimiento celular DESREGULADO → expansión tumoral RÁPIDA (c-MYC codifica un factor de transcripción estimulador del crecimiento).","sketchy":"Los ratones \"creciendo de tamaño\" representan el crecimiento celular desregulado y la rápida expansión tumoral.","literal":"in BURKITT lymphoma, overexpression of the c-MYC oncogene leads to unregulated cell growth → RAPID tumor expansion (c-MYC codes for a growth-stimulating transcription factor)"},{"n":"18","nombre":"Raising \"Ki-67\" broom","ver":"Una escoba etiquetada \"Ki-67\" siendo levantada (raising).","clinica":"El linfoma de BURKITT tiene una fracción Ki-67 ALTA debido a su rápido crecimiento (Ki-67 es una proteína presente durante la replicación celular).","sketchy":"La \"escoba Ki-67\" es la clave literal directa del marcador de proliferación.","literal":"BURKITT lymphoma has a high Ki-67 fraction because of its rapid growth (Ki-67 is a protein present during cellular replication)"},{"n":"19","nombre":"Dividing broom fibers","ver":"Fibras de escoba dividiéndose (dividing broom fibers).","clinica":"El linfoma de BURKITT muestra figuras mitóticas abundantes (células en proceso de división) (debido a la rápida división celular).","sketchy":"Las \"fibras de escoba dividiéndose\" representan literalmente las figuras mitóticas abundantes.","literal":"BURKITT lymphoma displays abundant mitotic figures (cells in the process of dividing) (due to rapid cell division)"},{"n":"20","nombre":"\"Starry sky\" cloak","ver":"Una capa con estampado de \"cielo estrellado\" (starry sky cloak).","clinica":"El linfoma de BURKITT muestra una apariencia \"de cielo estrellado\" (macrófagos rodeados de espacios claros, entremezclados dentro de sábanas de células tumorales azules).","sketchy":"La \"capa de cielo estrellado\" es la representación literal directa del patrón histológico.","literal":"BURKITT lymphoma displays a \"starry sky\" appearance (macrophages surrounded by clear spaces, interspaced within sheets of blue tumor cells)"},{"n":"21","nombre":"\"Africa\" cauldron","ver":"Un caldero etiquetado \"Africa\" en el taller.","clinica":"El linfoma de BURKITT ENDÉMICO es más común en el África ecuatorial y Nueva Guinea.","sketchy":"El caldero \"Africa\" es la clave literal directa de la región endémica.","literal":"ENDEMIC BURKITT lymphoma is most common in equatorial Africa and New Guinea"},{"n":"22","nombre":"Respirator mouthpiece","ver":"Una boquilla de respirador (respirator mouthpiece) en la escena.","clinica":"El linfoma de BURKITT ENDÉMICO se presenta con un tumor mandibular grande.","sketchy":"La \"boquilla\" (en la zona de la mandíbula) representa el tumor mandibular grande.","literal":"ENDEMIC BURKITT lymphoma presents as a large jaw tumor"},{"n":"23","nombre":"Kid shopper","ver":"Un niño comprador (kid shopper) en la escena.","clinica":"El linfoma de BURKITT ocurre primariamente en NIÑOS (tanto en formas ENDÉMICAS como NO-ENDÉMICAS).","sketchy":"El \"niño\" representa directamente el grupo etario afectado.","literal":"BURKITT lymphoma primarily occurs in children (in both ENDEMIC and NON-ENDEMIC forms)"},{"n":"24","nombre":"Holding potion mid-belly","ver":"Un personaje sosteniendo una poción a mitad del vientre (holding potion mid-belly).","clinica":"El linfoma de BURKITT NO-ENDÉMICO se presenta con una masa ABDOMINAL de rápido crecimiento (intestino, ovario, o tejidos retroperitoneales).","sketchy":"Sostener la poción \"en el vientre\" representa la masa abdominal de rápido crecimiento.","literal":"NON-ENDEMIC BURKITT lymphoma presents with a rapidly growing ABDOMINAL mass (bowel, ovary, or retroperitoneal tissues)"},{"n":"25","nombre":"Crutch","ver":"Una muleta (crutch) en la escena.","clinica":"El linfoma de BURKITT puede deberse a INMUNODEFICIENCIA.","sketchy":"La \"muleta\" (necesidad de soporte, debilidad) representa la inmunodeficiencia.","literal":"BURKITT lymphoma can be due to IMMUNODEFICIENCY"},{"n":"26","nombre":"Old store owner","ver":"Un dueño de tienda mayor (old store owner) en la escena.","clinica":"El linfoma de BURKITT relacionado con INMUNODEFICIENCIA ocurre en adultos MAYORES.","sketchy":"El \"dueño mayor\" representa el grupo etario afectado en esta variante.","literal":"IMMUNODEFICIENCY-related BURKITT lymphoma occurs in older adults"},{"n":"27","nombre":"Lymph node necklace","ver":"Un collar con forma de ganglios linfáticos (lymph node necklace).","clinica":"El linfoma de BURKITT relacionado con INMUNODEFICIENCIA se presenta con LINFADENOPATÍA.","sketchy":"El \"collar de ganglios linfáticos\" es la representación literal directa de la linfadenopatía.","literal":"IMMUNODEFICIENCY-related BURKITT lymphoma presents with LYMPHADENOPATHY"},{"n":"28","nombre":"Wizard hat","ver":"Un sombrero de mago (wizard hat) en la escena.","clinica":"El linfoma de BURKITT relacionado con INMUNODEFICIENCIA usualmente ocurre en pacientes con VIH.","sketchy":"El \"sombrero de mago\" es el símbolo fijo de Sketchy para VIH (evocando el personaje \"White wizard\" asociado a esta infección en otras series).","literal":"IMMUNODEFICIENCY-related BURKITT lymphoma usually occurs in HIV-infected patients"},{"n":"29","nombre":"Epstein's bar","ver":"Un cartel \"Epstein's Bar\" en la escena.","clinica":"El linfoma de BURKITT ENDÉMICO y NO-ENDÉMICO están ambos asociados con infección por EBV.","sketchy":"\"Epstein's Bar\" es la clave literal directa del virus de Epstein-Barr.","literal":"ENDEMIC and NON-ENDEMIC BURKITT lymphoma are associated with EBV infection"},{"n":"30","nombre":"\"Falling\" sash","ver":"Una banda/faja cayendo (falling sash) en la escena.","clinica":"Linfoma FOLICULAR (un NHL).","sketchy":"\"Falling\" (cayendo) suena fonéticamente similar al inicio de \"FOLLicular\".","literal":"FOLLicular lymphoma (a NHL)"},{"n":"31","nombre":"Sash from \"14\" candle to 18\" fire tool","ver":"Una faja (sash) conectando una vela marcada \"14\" con una herramienta de fuego marcada \"18\".","clinica":"El linfoma FOLICULAR es causado por una translocación entre el cromosoma 14 y el 18 t(14;18).","sketchy":"La faja \"conectando 14 y 18\" representa literalmente la translocación t(14;18).","literal":"FOLLICULAR lymphoma is caused by a translocation between chromosome 14 and 18 t(14;18)"},{"n":"32","nombre":"Double \"invincibility\" BRACelet","ver":"Un brazalete doble de \"invencibilidad\" (double invincibility bracelet).","clinica":"En el linfoma FOLICULAR, la translocación t(14;18) resulta en sobreexpresión del BCL2 (gen del linfoma de células B-2) (inhibe la apoptosis) (también en algunos linfomas DIFUSOS de células B grandes).","sketchy":"El \"brazalete de invencibilidad\" (BRACelet con \"BCL\" implícito) representa BCL2 y su capacidad de inhibir la muerte celular (invencibilidad = anti-apoptosis).","literal":"in FOLLICULAR lymphoma, the t(14;18) translocation results in overexpression of the BCL2 (B-cell lymphoma-2) gene oncogene (inhibits apoptosis) (also in some DIFFUSE LARGE B-cell lymphomas)"},{"n":"33","nombre":"Nodular fire","ver":"Fuego nodular (nodular fire) en la escena de la chimenea.","clinica":"El linfoma FOLICULAR muestra nódulos hipercelulares redondos (que parecen similares a los FOLÍCULOS y centros germinales dentro de ganglios linfáticos normales) (se origina de células B mutadas en el CENTRO GERMINAL).","sketchy":"El \"fuego nodular\" representa literalmente los nódulos hipercelulares redondos.","literal":"FOLLICULAR lymphoma displays round hypercellular nodules (appear similar to the FOLLICLES and germinal centers within normal lymph nodes)(originates from mutated B-cells within the GERMINAL CENTER)"},{"n":"34","nombre":"Waxing and waning moon centerpiece","ver":"Un centro de mesa con fases lunares (waxing and waning moon centerpiece).","clinica":"El linfoma FOLICULAR se presenta con linfadenopatía generalizada que fluctúa (waxing and waning).","sketchy":"Las \"fases lunares crecientes y menguantes\" representan literalmente la linfadenopatía fluctuante.","literal":"FOLLICULAR lymphoma presents with generalized waxing and waning lymphadenopathy"},{"n":"35","nombre":"Transforming into DIFFUSELY LARGE patron","ver":"Un cliente (patron) transformándose (transforming) en una figura difusamente grande (diffusely large).","clinica":"El linfoma FOLICULAR puede TRANSFORMARSE en linfoma DIFUSO de células B GRANDES.","sketchy":"La \"transformación en figura difusamente grande\" representa literalmente la transformación a linfoma difuso de células B grandes.","literal":"FOLLICULAR lymphoma can transform into DIFFUSE LARGE B-cell lymphoma"},{"n":"36","nombre":"LARGE antibody archer","ver":"Un arquero grande con forma de anticuerpo (LARGE antibody archer).","clinica":"Linfoma DIFUSO de células B GRANDES (un NHL).","sketchy":"El \"arquero anticuerpo grande\" representa directamente el linfoma difuso de células B grandes.","literal":"DIFFUSE LARGE B-cell lymphoma (a NHL)"},{"n":"37","nombre":"Pointing with \"1\" finger","ver":"Un dedo señalando con el número \"1\" (pointing with 1 finger).","clinica":"El linfoma DIFUSO de células B grandes es el linfoma MÁS COMÚN en adultos.","sketchy":"El \"1\" señalado representa directamente el ranking de linfoma más común en adultos.","literal":"DIFFUSE LARGE B-cell lymphoma is the most common lymphoma in adults"},{"n":"38","nombre":"Hexagon bracelet","ver":"Un brazalete hexagonal (hexagon bracelet).","clinica":"Algunos linfomas DIFUSOS de células B grandes muestran alteraciones (reordenamientos genéticos, mutaciones en la región promotora) en el gen BCL-6 (regula la transcripción de ADN).","sketchy":"El \"brazalete hexagonal\" (6 lados) es la clave numérica literal directa de \"BCL-6\".","literal":"some DIFFUSE LARGE B-cell lymphomas display alterations (gene rearrangements, mutations in the promoter region) in the BCL-6 gene (regulates DNA transcription)"},{"n":"39","nombre":"Large jars","ver":"Frascos grandes (large jars) en el taller.","clinica":"El linfoma DIFUSO de células B grandes muestra sábanas de células B grandes.","sketchy":"Los \"frascos grandes\" representan literalmente las células B grandes.","literal":"DIFFUSE LARGE B-cell lymphoma displays sheets of large B cells"},{"n":"40","nombre":"Wizard drinking \"Epstein's bar\" beer","ver":"Un mago bebiendo cerveza de \"Epstein's Bar\" (wizard drinking Epstein's bar beer).","clinica":"La coinfección de EBV y VIH puede causar linfoma DIFUSO de células B grandes.","sketchy":"El \"mago\" (VIH) bebiendo en \"Epstein's Bar\" (EBV) representa la coinfección de ambos virus.","literal":"EBV and HIV co-infection can cause DIFFUSE LARGE B-cell lymphoma"},{"n":"41","nombre":"White wizard hat","ver":"Un sombrero blanco de mago (white wizard hat).","clinica":"En pacientes infectados con VIH, el linfoma es una condición definitoria de SIDA.","sketchy":"El \"sombrero blanco de mago\" es el símbolo fijo de VIH en toda la serie.","literal":"in HIV infected patients, lymphoma is an AIDS-defining condition"},{"n":"42","nombre":"HERMES statue with \"8\" staff","ver":"Una estatua de Hermes con un bastón marcado \"8\" (HERMES statue with \"8\" staff).","clinica":"La coinfección de VHH-8 y VIH puede causar linfoma de EFUSIÓN PRIMARIA (un NHL) (se presenta en pleura, peritoneo, o espacios pericárdicos).","sketchy":"\"HERMES\" con \"HH\" suena fonéticamente similar a \"HHV\" y el \"8\" en el bastón completa \"HHV-8\".","literal":"HHV-8 and HIV co-infection can cause PRIMARY EFFUSION lymphoma (a NHL) (presents in the pleura, peritoneum, or pericardial spaces)"},{"n":"43","nombre":"Brain jar","ver":"Un frasco con forma de cerebro (brain jar) en el taller.","clinica":"El NHL puede presentarse como linfoma primario del SNC (usualmente del tipo difuso de células B grandes).","sketchy":"El \"frasco de cerebro\" representa directamente el linfoma primario del SNC.","literal":"NHL can present as a primary CNS lymphoma (usually DIFFUSE LARGE B-cell type)"},{"n":"44","nombre":"Mantle","ver":"Una capa/manto (mantle) en el taller.","clinica":"Linfoma de células del MANTO (un NHL de células B) (se origina de células en las zonas del manto de los folículos linfoides) (patrón folicular nodular en histología).","sketchy":"El \"manto\" es la clave literal directa de \"mantle cell lymphoma\".","literal":"MANTLE cell lymphoma (a B-cell NHL)(originates from cells in the MANTLE zones of lymphoid follicles)(nodular follicular pattern on histology)"},{"n":"45","nombre":"Connecting \"11\" and \"14\" candles","ver":"Velas conectadas marcadas \"11\" y \"14\" (connecting 11 and 14 candles).","clinica":"El linfoma de células del MANTO ocurre como resultado de una translocación entre los cromosomas 11 y 14 t(11;14).","sketchy":"Las velas \"conectando 11 y 14\" representan literalmente la translocación t(11;14).","literal":"MANTLE cell lymphoma occurs as a result of a translocation between chromosomes 11 and 14 t(11;14)"},{"n":"46","nombre":"Cell cycle clock","ver":"Un reloj con temática de ciclo celular (cell cycle clock).","clinica":"En el linfoma de células del MANTO, la translocación t(11;14) resulta en sobreexpresión de Ciclina D1 (promueve la transición de la fase G1 a S → división celular incontrolada).","sketchy":"El \"reloj del ciclo celular\" representa literalmente la Ciclina D1 y su papel en el ciclo celular.","literal":"in MANTLE cell lymphoma, the t(11;14) translocation results in overexpression of Cyclin D1 (promotes transition from G1 to S phase → uncontrolled cell division)"},{"n":"47","nombre":"Skinny, sweaty, and flaming bandana","ver":"Un personaje delgado (skinny), sudoroso (sweaty), con una bandana en llamas (flaming bandana).","clinica":"El NHL puede presentarse con síntomas \"B\" (pérdida de peso, fiebre, sudores nocturnos).","sketchy":"\"Delgado, sudoroso, y con bandana en llamas\" representa directamente los tres síntomas B (pérdida de peso, sudores nocturnos, fiebre).","literal":"NHL can present with \"B\" symptoms (weight loss, fever, night sweats)"}]}]},{"nombre":"Farmacología","codigo":"fa","temas":[{"slug":"aminopenicilinas-penicilinas-espectro-extendido","titulo":"Ampicilina, Amoxicilina, Piperacilina, Ticarcilina","items":[{"n":"1","nombre":"Amino's Space Cantina","ver":"El letrero de una cantina espacial \"Amino's Space Cantina\", escenario tipo Star Wars.","clinica":"La amoxicilina y la ampicilina son aminopenicilinas.","sketchy":"\"Amino's\" es la clave literal directa del nombre de clase \"aminopenicillins\".","literal":"Amoxicillin and ampicillin are aminopenicillins"},{"n":"2","nombre":"Ringed planet","ver":"Un planeta con anillos, enmarcado en un cuadro en la parte superior de la escena.","clinica":"Las aminopenicilinas y las penicilinas de espectro extendido son antibióticos beta-lactámicos (contienen anillo beta-lactámico).","sketchy":"El planeta \"con anillo\" (ringed) representa literalmente el anillo beta-lactámico.","literal":"Aminopenicillins and extended-spectrum penicillins are beta-lactam antibiotics (contain beta-lactam ring)"},{"n":"3","nombre":"Unfinished Death Coccus","ver":"Una estación espacial esférica tipo \"Estrella de la Muerte\" inacabada, con grafiti \"D-ALA\" repetido.","clinica":"Las aminopenicilinas y las penicilinas de espectro extendido se unen a las PBP, deteniendo la síntesis de la pared de peptidoglicano.","sketchy":"La estación \"inacabada\" (unfinished) representa la síntesis de pared celular detenida a mitad de proceso.","literal":"Aminopenicillins and extended-spectrum penicillins bind PBPs, halting peptidoglycan wall synthesis"},{"n":"4","nombre":"Purple coccoid space stations","ver":"Pequeñas estaciones espaciales redondas de color púrpura flotando en el espacio.","clinica":"Las aminopenicilinas y las penicilinas de espectro extendido tienen actividad contra organismos gram-positivos (ej. Staph y Strep).","sketchy":"La forma \"coccoide\" y el color púrpura de las estaciones representan la morfología cocoide gram-positiva.","literal":"Aminopenicillins and extended-spectrum penicillins have activity against gram-positive organisms (e.g. Staph and Strep)"},{"n":"5","nombre":"Red color","ver":"Tonos rojizos predominantes en la iluminación de la cantina.","clinica":"Las aminopenicilinas y las penicilinas de espectro extendido tienen actividad mejorada contra bacterias gram-negativas.","sketchy":"El color rojo refuerza la cobertura gram-negativa adicional de este grupo de fármacos.","literal":"Aminopenicillins and extended-spectrum penicillins have improved activity against gram-negative bacteria"},{"n":"6","nombre":"Prism","ver":"Un prisma colgante que dispersa un haz de luz en un arcoíris.","clinica":"Las aminopenicilinas y las penicilinas de espectro extendido son antibióticos de amplio espectro.","sketchy":"El prisma dispersando luz en \"todo el espectro\" (arcoíris) representa literalmente el amplio espectro de cobertura.","literal":"Aminopenicillins and extended-spectrum penicillins are broad-spectrum antibiotics"},{"n":"7","nombre":"Ammo box","ver":"Una caja etiquetada \"AMMO\" en la mesa de la cantina.","clinica":"La amoxicilina es una aminopenicilina.","sketchy":"\"AMMO\" suena fonéticamente similar al inicio de \"AMOxicillin\".","literal":"Amoxicillin is an aminopenicillin"},{"n":"8","nombre":"Open mouth","ver":"Un personaje con la boca abierta, gritando o cantando.","clinica":"La amoxicilina tiene biodisponibilidad oral.","sketchy":"La \"boca abierta\" representa directamente la vía oral de administración.","literal":"Amoxicillin has oral bioavailability"},{"n":"9","nombre":"Red bandana","ver":"Un pañuelo rojo (bandana) alrededor del cuello de uno de los personajes cantando.","clinica":"Las aminopenicilinas (ej. amoxicilina y ampicilina) tratan la faringitis estreptocócica (strep throat) causada por Streptococcus pyogenes.","sketchy":"El pañuelo rojo \"alrededor de la garganta\" representa la faringitis (garganta inflamada) tratada.","literal":"Aminopenicillins (e.g. amoxicillin and ampicillin) treat streptococcal pharyngitis (strep throat) caused by Strep pyogenes"},{"n":"10","nombre":"Plugged ears","ver":"Un personaje alienígena tapándose los oídos con las manos.","clinica":"La amoxicilina trata la otitis media y sinusitis causadas por Strep pneumoniae, Haemophilus influenzae y Moraxella catarrhalis.","sketchy":"Taparse los oídos representa directamente la otitis media tratada.","literal":"Amoxicillin treats otitis media and sinusitis caused by Strep pneumoniae, Haemophilus influenzae, Moraxella catarrhalis"},{"n":"11","nombre":"Rusty chest plate","ver":"Un peto/armadura oxidada sobre el pecho de uno de los personajes.","clinica":"Las aminopenicilinas (ej. amoxicilina y ampicilina) tratan la neumonía causada por Strep pneumoniae, Haemophilus influenzae.","sketchy":"El peto sobre el pecho representa la afectación pulmonar (neumonía), mismo símbolo usado en Macrólidos.","literal":"Aminopenicillins (e.g. amoxicillin and ampicillin) treat pneumonia caused by Strep pneumoniae, Haemophilus influenzae"},{"n":"12","nombre":"H wing ship","ver":"Una nave espacial antigua tipo biplano volando en el fondo estrellado.","clinica":"Las aminopenicilinas (ej. amoxicilina, ampicilina) tienen actividad contra Haemophilus influenzae.","sketchy":"\"H wing\" (con \"H\" resaltada) es la clave literal directa para \"Haemophilus\".","literal":"Aminopenicillins (e.g. amoxicillin, ampicillin) have activity against Haemophilus influenzae"},{"n":"13","nombre":"Helicopter","ver":"Un helicóptero volando en la parte derecha de la escena.","clinica":"La amoxicilina es parte de la terapia triple (con claritromicina y un IBP) para la infección por Helicobacter pylori.","sketchy":"El helicóptero es la clave fonética fija de Sketchy para \"Helicobacter\".","literal":"Amoxicillin is part of the triple therapy (with clarithromycin and a PPI) for Helicobacter pylori infection"},{"n":"14","nombre":"Robin of Ixodes","ver":"Un cartel de \"se busca\" (Wanted) con la imagen de \"Robin of Ixodes\".","clinica":"La amoxicilina trata la enfermedad de Lyme causada por Borrelia burgdorferi.","sketchy":"\"Ixodes\" es el género de la garrapata vector de Lyme, y \"Robin Hood\" evoca el bosque (hábitat de la garrapata).","literal":"Amoxicillin treats Lyme disease caused by Borrelia burgdorferi"},{"n":"15","nombre":"Amp","ver":"Un amplificador de sonido (amp) en el escenario de la banda.","clinica":"La ampicilina es una aminopenicilina.","sketchy":"\"Amp\" es la clave fonética directa para \"AMPicillin\".","literal":"Ampicillin is an aminopenicillin"},{"n":"16","nombre":"Ivy","ver":"Hiedra (ivy) creciendo cerca del escenario.","clinica":"La ampicilina puede administrarse por vía IV.","sketchy":"\"Ivy\" suena idéntico a \"IV\", clave fonética fija de la vía intravenosa.","literal":"Ampicillin can be administered IV"},{"n":"17","nombre":"Gas mask","ver":"Una máscara de gas que lleva puesta el guitarrista de la banda.","clinica":"La ampicilina trata infecciones anaeróbicas (ej. neumonía por aspiración).","sketchy":"La máscara de gas representa el ambiente sin oxígeno (anaeróbico).","literal":"Ampicillin treats anaerobic infections (e.g. aspiration pneumonia)"},{"n":"18","nombre":"Diplococcus rock drums","ver":"Un juego de tambores púrpura con forma de par de cocos (diplococo).","clinica":"La ampicilina trata infecciones por Enterococcus.","sketchy":"Los dos tambores emparejados representan la disposición en pares (diplococos) de Enterococcus, mismo símbolo usado en Vancomicina.","literal":"Ampicillin treats Enterococcus infections"},{"n":"19","nombre":"Knocked over amp","ver":"Un amplificador derribado/volcado en el suelo del escenario.","clinica":"Las cepas de Enterococcus productoras de beta-lactamasa son resistentes a la ampicilina.","sketchy":"El amplificador \"derribado\" representa la resistencia (el fármaco es vencido) a la ampicilina.","literal":"Beta-lactamase producing strains of Enterococcus are resistant to ampicillin"},{"n":"20","nombre":"Set LIST","ver":"Una lista de canciones (\"Set List\") pegada en la pared cerca del escenario.","clinica":"La ampicilina trata la meningitis causada por Listeria monocytogenes.","sketchy":"\"LIST\" resaltado en \"Set List\" es la clave literal directa para \"LISTeria\".","literal":"Ampicillin treats meningitis caused by Listeria monocytogenes"},{"n":"21","nombre":"Intestinal tubes","ver":"Tubos apilados con forma de intestino detrás de la barra.","clinica":"Las aminopenicilinas (ej. ampicilina, amoxicilina) tienen actividad contra bacilos gram-negativos gastrointestinales y del tracto urinario (ej. E. coli).","sketchy":"Los tubos \"intestinales\" representan directamente el tracto GI, sitio de acción contra E. coli.","literal":"Aminopenicillins (e.g. ampicillin, amoxicil
