us-secreting cells)"},{"n":"10","nombre":"Thick ramen noodles","ver":"Fideos ramen gruesos (thick ramen noodles) servidos en el puesto.","clinica":"En la enfermedad de Ménétrier, la hipertrofia de los pliegues rugales inhibe la peristalsis del alimento a través del estómago.","sketchy":"Los \"fideos gruesos\" representan literalmente los pliegues rugales hipertróficos.","literal":"in Menetrier's disease, hypertrophy of rugal folds inhibits peristalsis of food through the stomach"},{"n":"11","nombre":"Excessive mucus","ver":"Moco excesivo (excessive mucus) visible en el puesto de ramen.","clinica":"En la enfermedad de Ménétrier, la hiperplasia de células secretoras de mucus resulta en un número disminuido de glándulas gástricas secretoras de ácido → digestión proteica disminuida.","sketchy":"El \"moco excesivo\" representa literalmente la hiperplasia de células secretoras de mucus.","literal":"in Menetrier's disease, hyperplasia of mucus-secreting cells results in decreased number of acid-secreting gastric glands → decreased protein digestion"},{"n":"12","nombre":"Nauseated ramen bar guy","ver":"Un hombre con náuseas (nauseated) en el bar de ramen.","clinica":"La enfermedad de Ménétrier y el cáncer gástrico se presentan con náuseas y vómitos.","sketchy":"El \"hombre con náuseas\" representa directamente el síntoma compartido.","literal":"Menetrier's disease & gastric cancer present with nausea and vomiting"},{"n":"13","nombre":"Ramen bar guy holding abdomen","ver":"El mismo hombre sosteniéndose el abdomen (holding abdomen).","clinica":"La enfermedad de Ménétrier y el cáncer gástrico se presentan con dolor abdominal y saciedad temprana.","sketchy":"\"Sostenerse el abdomen\" representa el dolor abdominal y la saciedad temprana.","literal":"Menetrier's disease & gastric cancer present with abdominal pain and early satiety"},{"n":"14","nombre":"Tarry black broth","ver":"Un caldo negro alquitranado (tarry black broth) servido en el bar.","clinica":"La enfermedad de Ménétrier y el cáncer gástrico pueden causar melena y hematemesis (síntomas de sangrado GI superior).","sketchy":"El \"caldo negro alquitranado\" es la representación literal directa de la melena.","literal":"Menetrier's disease & gastric cancer can cause melena and hematemesis (symptoms of upper GI bleeding)"},{"n":"15","nombre":"Losing meat chunks","ver":"Trozos de carne perdiéndose/cayendo (losing meat chunks) del tazón.","clinica":"La enfermedad de Ménétrier es una \"enteropatía perdedora de proteínas\" (debido al aumento de la permeabilidad de las células mucosas del estómago).","sketchy":"Los \"trozos de carne perdiéndose\" (proteína perdida) representan literalmente la enteropatía perdedora de proteínas.","literal":"Menetrier's disease is a \"protein-losing enteropathy\" (due to increased permeability of stomach mucosal cells)"},{"n":"16","nombre":"Thin girl","ver":"Una chica delgada (thin girl) en la escena.","clinica":"La enfermedad de Ménétrier se presenta con pérdida de peso, desgaste muscular, hipoalbuminemia, edema periférico (debido a pérdida de proteínas).","sketchy":"La \"chica delgada\" representa la pérdida de peso y el desgaste muscular.","literal":"Menetrier's disease presents with weight loss, muscle wasting, hypoalbuminemia, peripheral edema (due to protein loss)"},{"n":"17","nombre":"Cancer crab","ver":"Un cangrejo de cáncer (cancer crab) en la escena.","clinica":"La enfermedad de Ménétrier es un factor de riesgo para el adenocarcinoma gástrico.","sketchy":"El \"cangrejo\" (símbolo de cáncer) representa el riesgo aumentado de adenocarcinoma gástrico.","literal":"Menetrier's disease is a risk factor for gastric adenocarcinoma"},{"n":"18","nombre":"Giant cancer crab","ver":"Un cangrejo de cáncer gigante (giant cancer crab) en el letrero \"Donburi\".","clinica":"Adenocarcinoma gástrico (la neoplasia maligna más común del estómago, más común en países del este asiático).","sketchy":"El cangrejo \"gigante\" representa la neoplasia maligna más común del estómago.","literal":"gastric adenocarcinoma (the most common malignancy of stomach, more common in East Asian countries)"},{"n":"19","nombre":"Hanging intestines","ver":"Intestinos colgando (hanging intestines) en el puesto de mariscos.","clinica":"El adenocarcinoma gástrico de tipo INTESTINAL (el adenocarcinoma gástrico más común).","sketchy":"Los \"intestinos colgando\" representan literalmente el tipo \"intestinal\" de adenocarcinoma.","literal":"intestinal-type gastric adenocarcinoma (the most common gastric adenocarcinoma)"},{"n":"20","nombre":"Grandfather clock","ver":"Un reloj de pie (grandfather clock) en la escena.","clinica":"La gastritis atrófica CRÓNICA metaplásica es el mayor factor de riesgo para el adenocarcinoma gástrico de tipo intestinal.","sketchy":"El \"reloj de pie\" (que marca el paso del tiempo/cronicidad) representa la naturaleza crónica de la gastritis.","literal":"chronic atrophic metaplastic gastritis is the biggest risk factor for intestinal-type gastric adenocarcinoma"},{"n":"21","nombre":"Helicopter fan","ver":"Un ventilador con forma de helicóptero (helicopter fan) en la escena.","clinica":"La gastritis crónica mediada por H. PYLORI es un factor de riesgo para el adenocarcinoma gástrico de tipo intestinal.","sketchy":"El \"ventilador-helicóptero\" es la clave fonética directa de \"Helicobacter pylori\".","literal":"H. pylori-mediated chronic gastritis is a risk factor for intestinal-type gastric adenocarcinoma"},{"n":"22","nombre":"Antibody on gastric pot","ver":"Un anticuerpo (antibody) sobre una olla con forma de estómago (gastric pot).","clinica":"La gastritis AUTOINMUNE es un factor de riesgo para el adenocarcinoma gástrico de tipo intestinal.","sketchy":"El \"anticuerpo sobre la olla-estómago\" representa directamente la gastritis autoinmune.","literal":"autoimmune gastritis is a risk factor for intestinal-type gastric adenocarcinoma"},{"n":"23","nombre":"Hanging meats","ver":"Carnes colgando (hanging meats) en el puesto de \"Donburi\".","clinica":"El consumo de alimentos preservados con SAL y alimentos preservados con NITROSAMINAS son factores de riesgo para el adenocarcinoma gástrico.","sketchy":"Las \"carnes colgando\" (curadas/preservadas) representan directamente los alimentos preservados como factor de riesgo.","literal":"consumption of salt-preserved foods and nitrosamine-preserved foods are risk factors for gastric adenocarcinoma"},{"n":"24","nombre":"Smoking & drinking","ver":"Personajes fumando y bebiendo (smoking & drinking) en la calle.","clinica":"El tabaquismo y el consumo de alcohol son factores de riesgo para el adenocarcinoma gástrico.","sketchy":"\"Fumar y beber\" representa directamente ambos factores de riesgo.","literal":"smoking and drinking are risk factors for gastric adenocarcinoma"},{"n":"25","nombre":"\"Epstein's Bar\"","ver":"Un letrero que dice \"Ebstein's Sake Bar\" en la calle.","clinica":"La infección por el virus de Epstein-Barr (EBV) es un factor de riesgo para el adenocarcinoma gástrico.","sketchy":"\"Ebstein's Bar\" suena fonéticamente similar a \"Epstein-Barr\", clave directa del virus.","literal":"Epstein-Barr virus (EBV) infection is a risk factor for gastric adenocarcinoma"},{"n":"26","nombre":"Cauliflower","ver":"Una coliflor (cauliflower) en el puesto de mariscos.","clinica":"El adenocarcinoma gástrico de tipo intestinal forma una masa exofítica voluminosa (bulky exophytic mass) (ocurre en la curvatura menor del antro y el píloro).","sketchy":"La \"coliflor\" (con forma de masa protuberante) representa literalmente la masa exofítica voluminosa.","literal":"intestinal-type gastric adenocarcinoma forms a bulky exophytic mass (occurs in lesser curvature of the antrum and pylorus)"},{"n":"27","nombre":"Oozing red sauce","ver":"Salsa roja rezumando (oozing red sauce) en el puesto de comida.","clinica":"El adenocarcinoma gástrico de tipo intestinal puede causar sangrado y ulceraciones.","sketchy":"La \"salsa roja rezumando\" es la representación literal directa del sangrado.","literal":"intestinal-type gastric adenocarcinoma may cause bleeding and ulcerations"},{"n":"28","nombre":"Mucinous rice","ver":"Arroz mucinoso/viscoso (mucinous rice) servido en el puesto.","clinica":"En histología, el adenocarcinoma gástrico de tipo intestinal muestra estructuras glandulares llenas de mucina.","sketchy":"El \"arroz mucinoso\" representa literalmente las estructuras glandulares llenas de mucina.","literal":"on histology, intestinal-type gastric adenocarcinoma displays glandular structures filled with mucin"},{"n":"29","nombre":"\"Claw-adhering\" rubber band","ver":"Una banda de goma \"adherente de garra\" (claw-adhering rubber band) sobre cangrejos.","clinica":"E-cadherina (una molécula de adhesión intercelular).","sketchy":"\"Claw-adhering\" (garra adherente) es la clave fonética/conceptual directa de \"E-CADherin\" (cadherin = adherencia).","literal":"E-cadherin (an intercellular adhesion molecule)"},{"n":"30","nombre":"Losing \"claw-adhering\" band","ver":"Cangrejos perdiendo la banda \"adherente\" (losing claw-adhering band) e infiltrándose por la pared.","clinica":"En el adenocarcinoma gástrico de tipo DIFUSO, la pérdida de proteínas E-cadherina normales resulta en conexiones intercelulares disminuidas → crecimiento celular desorganizado.","sketchy":"\"Perder la banda adherente\" representa la pérdida de la proteína E-cadherina y sus conexiones.","literal":"in diffuse-type gastric adenocarcinoma, loss of normal E-cadherin proteins results in decreased intercellular connections → disorganized cell growth"},{"n":"31","nombre":"Crabs infiltrating along wall","ver":"Cangrejos infiltrándose (infiltrating) a lo largo de la pared del tanque de mariscos.","clinica":"En el adenocarcinoma gástrico de tipo DIFUSO, el crecimiento celular desorganizado lleva a invasión difusa a través del estómago (\"patrón de crecimiento infiltrativo\").","sketchy":"Los \"cangrejos infiltrándose por la pared\" representan literalmente el patrón de crecimiento infiltrativo difuso.","literal":"in diffuse-type gastric adenocarcinoma, disorganized cells growth leads to diffuse invasion throughout stomach (\"infiltrative growth pattern\")"},{"n":"32","nombre":"Leather stomach purse","ver":"Un bolso de cuero con forma de estómago (leather stomach purse).","clinica":"El adenocarcinoma gástrico de tipo DIFUSO causa una reacción desmoplásica fibrosante → linitis plástica (\"estómago en botella de cuero\").","sketchy":"El \"bolso de cuero con forma de estómago\" es la representación literal directa del \"leather bottle stomach\".","literal":"diffuse-type gastric adenocarcinoma causes a fibrosing desmoplastic reaction → linitis plastica (\"leather bottle\" stomach)"},{"n":"33","nombre":"Ring jewelry","ver":"Joyería con forma de anillo (ring jewelry) que se vende en el puesto.","clinica":"En histología, las células del adenocarcinoma gástrico de tipo DIFUSO muestran \"anillos de sello\" (signet rings) (vacuolas conteniendo mucina que desplazan el núcleo hacia la membrana celular).","sketchy":"Los \"anillos\" (ring jewelry) son la representación literal directa de las \"signet ring cells\".","literal":"on histology, diffuse-type gastric adenocarcinoma cells display \"signet rings\" (mucin-containing vacuoles displace nucleus to cell membrane)"},{"n":"34","nombre":"Rings on liver purse, lapels, and pockets","ver":"Anillos (rings) sobre el bolso-hígado, las solapas y los bolsillos de varios personajes.","clinica":"Los adenocarcinomas gástricos (tipos intestinal y difuso) metastatizan más comúnmente a HÍGADO, PULMONES y OVARIOS.","sketchy":"Los \"anillos\" dispersos sobre hígado, solapas (pulmones/pecho) y bolsillos (ovarios) representan las tres localizaciones metastásicas más comunes.","literal":"gastric adenocarcinomas (intestinal and diffuse types) most commonly metastasize to liver, lungs, and ovaries"},{"n":"35","nombre":"Chess board with white T knights & B antibody archers","ver":"Un tablero de ajedrez con caballeros blancos \"T\" y arqueros \"B\" con forma de anticuerpo.","clinica":"Los linfomas gástricos primarios (de células T o B).","sketchy":"Los \"caballeros T\" y \"arqueros B\" representan directamente los linfomas de células T y B.","literal":"primary gastric lymphomas (T or B-cell)"},{"n":"36","nombre":"Grandfather clock","ver":"Otro reloj de pie (grandfather clock) en la escena.","clinica":"La gastritis atrófica metaplásica crónica es un factor de riesgo para el linfoma gástrico.","sketchy":"Repite el \"reloj de pie\" para la cronicidad de la gastritis, ahora en el contexto del linfoma.","literal":"chronic atrophic metaplastic gastritis is a risk factor for gastric lymphoma"},{"n":"37","nombre":"Helicopter-like fan","ver":"Otro ventilador tipo helicóptero (helicopter-like fan) en la escena.","clinica":"La gastritis crónica mediada por H. pylori es un factor de riesgo para el linfoma gástrico.","sketchy":"Repite el \"ventilador-helicóptero\" para H. pylori, ahora en el contexto del linfoma.","literal":"H. pylori-mediated chronic gastritis is a risk factor for gastric lymphoma"},{"n":"38","nombre":"Pile of blue lymphoid tissues","ver":"Un montón de tejidos linfoides azules (pile of blue lymphoid tissues) en el bar.","clinica":"La gastritis crónica mediada por H. pylori induce MALT, que puede progresar a linfoma gástrico.","sketchy":"El \"montón de tejido linfoide\" representa literalmente el tejido linfoide asociado a mucosa (MALT).","literal":"H. pylori-mediated chronic gastritis induces MALT which can progress to gastric lymphoma"},{"n":"39","nombre":"Ebstein's Sake Bar","ver":"El bar \"Ebstein's Sake Bar\" completo.","clinica":"La infección por EBV puede causar linfoma gástrico.","sketchy":"Repite \"Ebstein's Bar\" (Epstein-Barr) para el linfoma gástrico.","literal":"EBV infection can cause gastric lymphoma"},{"n":"40","nombre":"Marginalized B archers & large B archers","ver":"Arqueros \"B\" marginados (marginalized) y arqueros \"B\" grandes (large) en el juego de ajedrez.","clinica":"Los linfomas gástricos son más comúnmente linfoma de células B de la zona marginal o linfoma difuso de células B grandes.","sketchy":"Los \"arqueros B marginados\" y \"arqueros B grandes\" representan literalmente los dos subtipos de linfoma de células B.","literal":"gastric lymphomas are most commonly marginal zone B cell or diffuse large B cell lymphoma"},{"n":"41","nombre":"\"GIST\" arcade hall","ver":"Un letrero grande que dice \"GIST Arcade Hall\".","clinica":"Tumor estromal GI (GIST - tumor mesenquimal, derivado de las células intersticiales de Cajal).","sketchy":"\"GIST\" es la clave literal directa del acrónimo \"GI Stromal Tumor\".","literal":"GI stromal tumor (GIST - mesenchymal tumor, derived from interstitial cells of Cajal)"},{"n":"42","nombre":"Rhythm game","ver":"Un juego de ritmo (rhythm game) dentro del salón de arcade.","clinica":"El GIST se deriva de las células intersticiales de Cajal (células \"marcapasos\" del tracto GI, responsables de la peristalsis).","sketchy":"El \"juego de ritmo\" representa literalmente el papel \"marcapasos\" (pacemaker/ritmo) de las células de Cajal.","literal":"GIST is derived from the interstitial cells of Cajal (GI \"pacemaker\" cells, responsible for peristalsis)"},{"n":"43","nombre":"Tool kit","ver":"Un kit de herramientas (tool kit) llamado \"C-Kit\" en el salón de arcade.","clinica":"El GIST es causado por mutaciones de ganancia de función en el oncogén c-KIT.","sketchy":"\"Tool Kit\" con \"C-Kit\" resaltado es la clave literal directa del oncogén c-KIT.","literal":"GIST is caused by gain-of-function mutations in the c-KIT oncogene"},{"n":"44","nombre":"Tire swing game","ver":"Un juego de columpio de llanta (tire swing game) en el salón de arcade.","clinica":"C-kit es una tirosina quinasa.","sketchy":"El \"columpio de llanta\" (tire = tyrosine) es el símbolo fijo de Sketchy para \"tyrosine kinase\".","literal":"C-kit is a tyrosine kinase"},{"n":"45","nombre":"Under mucosal door","ver":"Una puerta con textura mucosa (mucosal door) en el salón de arcade.","clinica":"Los GIST forman masas submucosas bien circunscritas y carnosas.","sketchy":"La \"puerta bajo la mucosa\" representa literalmente las masas submucosas.","literal":"GISTs form well-circumscribed, fleshy, submucosal masses"}]},{"slug":"enfermedad-celiaca-malabsorcion","titulo":"Enfermedad celíaca y malabsorción","items":[{"n":"1","nombre":"Seal on platform","ver":"Una foca de pie sobre una plataforma roja en el show del acuario.","clinica":"La enfermedad celíaca = enfermedad inflamatoria intestinal de mecanismo inmune del intestino delgado causada por sensibilidad al gluten.","sketchy":"La foca (seal) es el personaje ancla de toda la escena, personificando el \"Seal show\" del acuario para introducir la enfermedad celíaca.","literal":"Celiac disease = immune-mediated inflammatory disease of the small intestine caused by a sensitivity to gluten"},{"n":"2","nombre":"Mother + adolescent daughter","ver":"Una madre junto a su hija adolescente observando el show.","clinica":"La enfermedad celíaca típicamente se presenta en la adolescencia o adultez (entre los 10 y 40 años).","sketchy":"La hija \"adolescente\" representa directamente el rango etario típico de presentación.","literal":"Celiac disease typically presents in adolescence or adulthood (between 10 and 40 years old)"},{"n":"3","nombre":"Mother + daughter","ver":"La misma pareja de madre e hija en la escena.","clinica":"La enfermedad celíaca es dos veces más común en mujeres que en hombres.","sketchy":"El hecho de que ambas figuras sean mujeres representa la mayor prevalencia femenina.","literal":"Celiac disease is twice as common in females than in males"},{"n":"4","nombre":"\"High risk\" sign + Seal w/ antibody arrow","ver":"Un cartel amarillo que dice \"HIGH RISK\" cerca de una foca con una flecha con forma de anticuerpo.","clinica":"Grupos de alto riesgo para enfermedad celíaca = aquellos con enfermedades autoinmunes, síndrome de Down, síndrome de Turner, o antecedentes familiares positivos.","sketchy":"El cartel \"HIGH RISK\" y la flecha con forma de anticuerpo representan directamente los grupos de riesgo autoinmune.","literal":"Celiac disease high risk groups = those w/ autoimmune diseases, Down's syndrome, Turner's syndrome, or a positive family history"},{"n":"5","nombre":"Downtown decoration + Turning X-shaped pinwheel","ver":"Un molinillo (pinwheel) con forma de \"X\" que sostiene la niña, con una ciudad (\"downtown\") de fondo en el acuario.","clinica":"Grupos de alto riesgo de enfermedad celíaca = aquellos con enfermedades autoinmunes, síndrome de Down, síndrome de Turner, o antecedentes familiares positivos.","sketchy":"\"Downtown\" suena fonéticamente similar a \"Down syndrome\", y el molinillo en \"X\" representa el cariotipo X0 del síndrome de Turner.","literal":"Celiac disease high risk groups = those w/ autoimmune diseases, Down's syndrome, Turner's syndrome, or a positive family hx"},{"n":"6","nombre":"Brown puddle + skinny trainer","ver":"Un charco marrón en el suelo cerca de una entrenadora delgada del acuario.","clinica":"La enfermedad celíaca típicamente se presenta en niños pequeños con diarrea, pérdida de peso y falla de crecimiento.","sketchy":"El charco marrón representa la diarrea, y la entrenadora \"delgada\" (skinny) la pérdida de peso.","literal":"Celiac disease typically presents in young kids w/ diarrhea, weight loss, and failure to thrive"},{"n":"7","nombre":"Falling milk bottle","ver":"Un biberón/botella de leche cayendo al suelo.","clinica":"La enfermedad celíaca típicamente se presenta en niños pequeños con diarrea, pérdida de peso y falla de crecimiento.","sketchy":"La botella \"cayendo\" (falling to thrive = failure to thrive, juego de palabras visual) representa la falla de crecimiento.","literal":"Celiac disease typically presents in young kids w/ diarrhea, weight loss, and failure to thrive"},{"n":"8","nombre":"Plunger + green face","ver":"Un destapador (plunger) sostenido por la entrenadora, quien tiene el rostro verdoso.","clinica":"La enfermedad celíaca también puede presentarse con estreñimiento, vómito, dolor abdominal y distensión/hinchazón abdominal.","sketchy":"El \"destapador\" representa el estreñimiento, y el rostro \"verde\" el vómito.","literal":"Celiac disease may also present w/ constipation, vomiting, abdominal pain, and abdominal bloating/distention"},{"n":"9","nombre":"Stomach pain lines + distended seal belly","ver":"Líneas de dolor y un vientre distendido en la foca sobre la plataforma.","clinica":"La enfermedad celíaca también puede presentarse con estreñimiento, vómito, dolor abdominal y distensión/hinchazón abdominal.","sketchy":"Las líneas de dolor y el vientre \"distendido\" de la foca representan directamente el dolor y la distensión abdominal.","literal":"Celiac disease may also present w/ constipation, vomiting, abdominal pain, and abdominal bloating/distention"},{"n":"10","nombre":"Skinny trainer + bucket of chunky yellow fat","ver":"Un balde con grumos amarillentos de grasa sostenido por la entrenadora delgada.","clinica":"Estar atento a signos de malabsorción (es decir, pérdida de peso inexplicada y esteatorrea) en niños con enfermedad celíaca.","sketchy":"El balde \"de grasa amarillenta grumosa\" es la representación literal directa de la esteatorrea.","literal":"Be on the lookout for signs of malabsorption (i.e. unexplained weight loss & steatorrhea) in kids with celiac disease"},{"n":"11","nombre":"Short gnome + falling milk bottle","ver":"Una figura pequeña de baja estatura (gnome) cerca de una botella de leche cayendo.","clinica":"La presentación inicial de la enfermedad celíaca puede incluir crecimiento limitado en forma de falla de crecimiento o talla baja, y retraso del desarrollo.","sketchy":"La figura \"de baja estatura\" (short gnome) representa directamente la talla baja.","literal":"Initial presentation of celiac disease may include limited growth in the form of failure to thrive or short stature, and developmental delay"},{"n":"12","nombre":"\"Seal show delayed\" sign","ver":"Un cartel que dice \"Seal Show DELAYED Today!\".","clinica":"La presentación inicial de la enfermedad celíaca puede incluir crecimiento limitado en forma de falla de crecimiento o talla baja, y retraso del desarrollo.","sketchy":"\"DELAYED\" en el cartel es la clave literal directa del \"retraso\" (delay) del desarrollo.","literal":"Initial presentation of celiac disease may include limited growth in the form of failure to thrive or short stature, and developmental delay"},{"n":"13","nombre":"Falling brain hat","ver":"Un objeto con forma de cerebro cayendo cerca de la entrenadora.","clinica":"Los niños con enfermedad celíaca también pueden exhibir síntomas neuro y conductuales (ansiedad, depresión, agresión, problemas de sueño, TDAH).","sketchy":"El \"cerebro cayendo\" representa directamente los síntomas neurológicos y conductuales.","literal":"Kids with celiac disease may also exhibit behavioral and neuro symptoms (anxiety, depression, aggression, sleep problems, ADHD)"},{"n":"14","nombre":"Mouth-like tunnel w/ erosions","ver":"Un túnel/entrada con forma de boca, con erosiones visibles en sus bordes.","clinica":"Los pacientes celíacos también pueden presentar úlceras aftosas y osteomalacia/osteopenia.","sketchy":"El \"túnel con forma de boca\" con erosiones representa literalmente las úlceras aftosas orales.","literal":"Celiac patients may also present w/ aphthous ulcers and osteomalacia/osteopenia"},{"n":"15","nombre":"Chewed up bone toys","ver":"Huesos de juguete mordisqueados/desgastados en el agua.","clinica":"Los pacientes celíacos también pueden presentar úlceras aftosas y osteomalacia/osteopenia.","sketchy":"Los huesos \"desgastados/masticados\" representan la osteomalacia/osteopenia (debilitamiento óseo).","literal":"Celiac patients may also present w/ aphthous ulcers and osteomalacia/osteopenia"},{"n":"16","nombre":"Seal family","ver":"Una familia de focas agrupadas.","clinica":"Un antecedente familiar de enfermedad celíaca (parientes de 1er y 2do grado) es un factor de riesgo significativo.","sketchy":"La \"familia de focas\" representa directamente el antecedente familiar como factor de riesgo.","literal":"A family history of celiac disease (1st and 2nd degree relatives) is a significant risk factor"},{"n":"17","nombre":"Double helix ring","ver":"Un aro dorado con forma de doble hélice a través del cual salta un delfín/foca.","clinica":"La enfermedad celíaca conlleva una fuerte predisposición genética con HLA DR3-DQ2 y DR4-DQ8.","sketchy":"El aro con forma de \"doble hélice\" representa literalmente la predisposición genética (ADN).","literal":"Celiac disease carries a strong genetic predisposition with HLA DR3-DQ2 and DR4-DQ8"},{"n":"18","nombre":"Whole wheat seal biscuits","ver":"Un carrito con galletas/panes de trigo integral (whole wheat) siendo alimentados a una foca.","clinica":"El factor de riesgo más significativo para la enfermedad celíaca es la exposición al gluten.","sketchy":"Las \"galletas de trigo integral\" representan directamente la exposición al gluten.","literal":"The most significant risk factor for celiac disease is exposure to gluten"},{"n":"19","nombre":"Spotted seal","ver":"Una foca con manchas visibles en su piel, en el tanque inferior.","clinica":"La manifestación cutánea más común de la enfermedad celíaca = dermatitis herpetiforme (rash pruriginoso, papular y vesicular en codos, rodillas, cuero cabelludo y glúteos).","sketchy":"Las \"manchas\" en la piel de la foca representan literalmente el rash de la dermatitis herpetiforme.","literal":"Most common skin manifestation of celiac disease = dermatitis herpetiformis (pruritic, papular, vesicular rash on the elbows, knees, scalp & buttocks)"},{"n":"20","nombre":"Sinking \"Seal Vitamins\"","ver":"Un frasco de \"Seal Vitamins\" hundiéndose en el agua del tanque.","clinica":"Sospechar enfermedad celíaca → estar atento a signos de deficiencias de nutrientes y vitaminas.","sketchy":"El frasco de vitaminas \"hundiéndose\" representa directamente las deficiencias vitamínicas.","literal":"Suspect celiac disease → lookout for signs of nutrient and vitamin deficiencies"},{"n":"21","nombre":"Pitted walrus tusks","ver":"Una morsa (walrus) con colmillos que muestran hendiduras/picaduras (pitted).","clinica":"Sospechar enfermedad celíaca → estar atento a defectos del esmalte dental (opacidades, surcos horizontales, hoyuelos superficiales).","sketchy":"Los colmillos \"con hoyuelos\" (pitted) representan directamente los defectos del esmalte dental.","literal":"Suspect celiac disease → lookout for dental enamel defects (i.e. opacities, horizontal grooves, shallow pits)"},{"n":"22","nombre":"Kid w/ floaties around joints","ver":"Un niño nadando con flotadores (floaties) alrededor de sus articulaciones.","clinica":"Las manifestaciones extraintestinales de la enfermedad celíaca incluyen mialgias y artralgias.","sketchy":"Los flotadores \"en las articulaciones\" representan directamente las artralgias.","literal":"Celiac disease extraintestinal manifestations include myalgias & arthralgias"},{"n":"23","nombre":"\"tTG\" cart w/ IgA handle","ver":"Un carrito etiquetado con símbolos \"tTG\" y un asa marcada \"IgA\".","clinica":"El anticuerpo tTG-IgA es altamente sensible y específico para la enfermedad celíaca.","sketchy":"El carrito \"tTG\" con asa \"IgA\" es la clave literal directa de la prueba tTG-IgA.","literal":"tTG-IgA antibody testing is highly sensitive and specific for celiac disease"},{"n":"24","nombre":"Broken IgA shovel","ver":"Una pala etiquetada \"IgA\" quebrada en el carrito.","clinica":"Si tienes alta sospecha clínica de enfermedad celíaca pero una prueba de anticuerpo tTG negativa → considerar deficiencia de IgA.","sketchy":"La pala \"IgA rota\" representa directamente la deficiencia de IgA (herramienta inutilizable = prueba no confiable).","literal":"If you have a high clinical suspicion for celiac disease but a negative tTG antibody test → consider IgA deficiency"},{"n":"25","nombre":"IgE pitchfork","ver":"Un tridente/horca (pitchfork) etiquetado \"IgE\" en el carrito.","clinica":"Si se sospecha enfermedad celíaca → descartar alergia al trigo mediada por IgE.","sketchy":"El tridente \"IgE\" representa directamente la prueba de alergia mediada por IgE.","literal":"If suspect celiac disease → rule out IgE-mediated wheat allergy"},{"n":"26","nombre":"Grabber tool + atrophied sea anemone","ver":"Una herramienta con gancho (grabber) cerca de una anémona marina atrofiada/marchita.","clinica":"El diagnóstico de enfermedad celíaca puede requerir biopsias duodenales que muestren atrofia vellositaria e hiperplasia de criptas.","sketchy":"La anémona \"atrofiada\" (con sus tentáculos marchitos, similares a vellosidades) representa la atrofia vellositaria.","literal":"Diagnosis of celiac disease may require duodenal biopsies that show villous atrophy & crypt hyperplasia"},{"n":"27","nombre":"Liver buoy w/ LFT-like chain","ver":"Una boya con forma de hígado y una cadena colgante.","clinica":"En el momento del diagnóstico, los pacientes celíacos comúnmente tienen pruebas de función hepática (LFT) elevadas.","sketchy":"La \"boya de hígado\" representa directamente las pruebas de función hepática elevadas.","literal":"At the time of diagnosis, celiac patients commonly have elevated LFT's"},{"n":"28","nombre":"Sinking iron dumbbells","ver":"Mancuernas (dumbbells) de hierro hundiéndose en el agua.","clinica":"Los niños con enfermedad celíaca tienen un riesgo aumentado de anemia ferropénica.","sketchy":"Las \"mancuernas de hierro\" representan directamente la anemia por deficiencia de hierro.","literal":"Kids w/ celiac disease have an ↑ risk of iron deficiency anemia"},{"n":"29","nombre":"\"Save the wHLAes\" sign","ver":"Un cartel que dice \"Save the wHLAes\" (juego con \"whales\" = ballenas).","clinica":"La prueba de HLA a menudo es innecesaria, pero puede ser útil para descartar enfermedad celíaca.","sketchy":"\"wHLAes\" con \"HLA\" resaltado dentro de \"whales\" es la clave literal directa de la prueba HLA.","literal":"HLA testing is often unnecessary, but may be helpful in ruling out celiac disease"},{"n":"30","nombre":"Celiac disease DDx","ver":"Una tabla/pizarra que dice \"DDx\" (diagnóstico diferencial) colgada en la pared.","clinica":"Considerar fibrosis quística, síndrome de Shwachman-Diamond, hipertiroidismo, síndrome de intestino irritable, enfermedad inflamatoria intestinal, intolerancia a la lactosa, sensibilidad al gluten no celíaca (NCGS).","sketchy":"La pizarra \"DDx\" es la clave literal directa del diagnóstico diferencial a considerar.","literal":"Consider cystic fibrosis, Shwachman-Diamond syndrome, hyperthyroidism, irritable bowel syndrome, inflammatory bowel disease, lactose intolerance, non-celiac gluten insensitivity (NCGS)"},{"n":"31","nombre":"Crossed out wheat","ver":"Un símbolo de trigo tachado (crossed out) en un cartel de advertencia.","clinica":"La enfermedad celíaca requiere una dieta libre de gluten de por vida.","sketchy":"El trigo \"tachado\" es la representación literal directa de la dieta libre de gluten.","literal":"Celiac disease requires a gluten-free diet for life"},{"n":"32","nombre":"\"Seal Feeding Specialist Wanted\" sign","ver":"Un cartel de \"se busca\" que dice \"Seal Feeding Specialist Wanted\".","clinica":"Un dietista puede ayudar a los niños con enfermedad celíaca a comenzar y mantener una dieta libre de gluten.","sketchy":"El \"especialista en alimentación\" (feeding specialist) representa directamente al dietista.","literal":"A dietician can help kids with celiac disease start and maintain a gluten-free diet"},{"n":"33","nombre":"Deputy on stage","ver":"Un empleado/oficial (deputy) de pie en el escenario del acuario.","clinica":"La dapsona puede usarse para la resolución rápida de los síntomas de dermatitis herpetiforme.","sketchy":"\"Deputy\" suena fonéticamente similar al inicio de \"DAPsone\".","literal":"Dapsone can be used for rapid resolution of dermatitis herpetiformis symptoms"},{"n":"34","nombre":"\"Seal Attack Crisis Hotline\" sign","ver":"Un cartel que dice \"Seal Attack Crisis Hotline\" con un número.","clinica":"La crisis celíaca/shock por gliadina = diarrea fulminante → deshidratación, acidosis, otros disturbios metabólicos → shock.","sketchy":"\"Seal Attack Crisis\" es la clave literal directa de \"celiac crisis\" (crisis celíaca), representando la urgencia del cuadro.","literal":"Celiac crisis/gliadin shock = fulminant diarrhea → dehydration, acidosis, other metabolic disturbances → shock"},{"n":"35","nombre":"Cancer crab on colon-like hose","ver":"Un cangrejo sobre una manguera/estructura con forma de colon, sostenida por un personaje musculoso.","clinica":"La enfermedad celíaca puede conllevar un riesgo aumentado de cánceres GI y linfoma no-Hodgkin.","sketchy":"El cangrejo (símbolo de cáncer) sobre la estructura \"con forma de colon\" representa el riesgo de cánceres GI.","literal":"Celiac disease may carry an ↑ risk of GI cancers and non-Hodgkin lymphoma"},{"n":"36","nombre":"Sinking \"Seal Vitamins\" + chewed up bone toys","ver":"El mismo frasco de vitaminas hundiéndose, junto a los huesos de juguete desgastados.","clinica":"La malabsorción de la enfermedad celíaca puede llevar a deficiencias nutricionales y mala salud ósea.","sketchy":"Ambos símbolos combinados (vitaminas hundiéndose + huesos desgastados) representan las deficiencias nutricionales y óseas resultantes de la malabsorción.","literal":"Malabsorption of celiac disease can lead to nutritional deficiencies and poor bone health"},{"n":"37","nombre":"Seal w/ antibody arrow","ver":"Una foca con una flecha con forma de anticuerpo en la parte inferior de la escena.","clinica":"Los niños con enfermedad celíaca tienen un riesgo aumentado de enfermedades autoinmunes asociadas (es decir, DM1, tiroiditis autoinmune).","sketchy":"La flecha \"con forma de anticuerpo\" representa directamente el riesgo de enfermedades autoinmunes asociadas.","literal":"Kids w/ celiac disease are at an ↑ risk for associated autoimmune diseases (i.e. DM1, autoimmune thyroiditis)"},{"n":"38","nombre":"Mortality sticker","ver":"Un símbolo de advertencia con calavera y huesos cruzados en un cartel de peligro.","clinica":"Aquellos con enfermedad celíaca tienen una mortalidad general más alta comparados con la población general.","sketchy":"La \"calavera y huesos\" es la representación literal directa del aumento de mortalidad.","literal":"Those with celiac disease have a higher overall mortality when compared to the general population"}]},{"slug":"higado-graso-alcoholico-no-alcoholico","titulo":"Enfermedad hepática grasa alcohólica y no alcohólica","items":[{"n":"1","nombre":"Acetaldehyde stool after alcohol","ver":"Un banquito (stool) en la barra, cerca de las bebidas alcohólicas.","clinica":"El etanol se metaboliza a acetaldehído en el hígado.","sketchy":"El banquito (\"stool\") ubicado justo después del alcohol representa el paso metabólico siguiente: la formación de acetaldehído.","literal":"ethanol is metabolized to acetaldehyde in the liver"},{"n":"2","nombre":"Wiping-up ethanol","ver":"Un bartender limpiando alcohol derramado en la barra.","clinica":"La alcohol deshidrogenasa convierte el etanol en acetaldehído en el hígado.","sketchy":"\"Limpiar\" (wiping up) el etanol representa la conversión/eliminación del etanol por la enzima.","literal":"alcohol dehydrogenase converts ethanol to acetaldehyde in the liver"},{"n":"3","nombre":"NAD+ electrolyte drink","ver":"Una bebida energética/electrolítica etiquetada, sostenida por un personaje.","clinica":"La conversión de etanol a acetaldehído involucra oxidación, la cual requiere NAD+ (reducido a NADH).","sketchy":"La bebida \"NAD+\" es la clave literal directa del cofactor requerido en la reacción de oxidación.","literal":"conversion of ethanol to acetaldehyde involves oxidation, which requires NAD+ (reduced to NADH)"},{"n":"4","nombre":"Cracked beta fish-tank","ver":"Una pecera agrietada con un pez betta dentro, sobre la barra.","clinica":"El consumo excesivo de alcohol resulta en depleción de NAD+ → NAD+ insuficiente para la beta-oxidación de ácidos grasos → oxidación alterada de ácidos grasos en el hígado.","sketchy":"La pecera \"agrietada\" (cracked) representa la depleción/falla del NAD+, y \"beta fish\" evoca la \"beta-oxidación\".","literal":"excessive alcohol intake results in depletion of NAD+ → insufficient NAD+ for fatty acid beta oxidation → impaired oxidation of fatty acids in the liver"},{"n":"5","nombre":"Overweight patrons","ver":"Clientes con sobrepeso sentados en la barra, observando.","clinica":"En el uso crónico de alcohol, la oxidación alterada de ácidos grasos lleva a la acumulación de grasa en el hígado.","sketchy":"Los clientes con \"sobrepeso\" representan directamente la acumulación de grasa resultante.","literal":"in heavy alcohol use, impaired oxidation of fatty acids leads to buildup of fatty acids in the liver"},{"n":"6","nombre":"Hung over on seat","ver":"Un cliente con resaca, con la cabeza apoyada en las manos sobre la barra.","clinica":"Una \"resaca\" (dolor de cabeza, náuseas, etc.) es causada por la acumulación de acetaldehído.","sketchy":"El personaje \"con resaca\" es la representación literal directa del síntoma.","literal":"a \"hangover\" (headache, nausea, etc) is caused by the buildup of acetaldehyde"},{"n":"7","nombre":"Acetate stool under NAD+","ver":"Otro banquito ubicado bajo el cartel/bebida de NAD+.","clinica":"La acetaldehído deshidrogenasa convierte el acetaldehído en acetato (vía oxidación, requiere NAD+ → NADH).","sketchy":"El banquito \"de acetato\" bajo el NAD+ representa el siguiente paso metabólico, dependiente del mismo cofactor.","literal":"acetaldehyde dehydrogenase converts acetaldehyde to acetate (via oxidation, requires NAD+ → NADH)"},{"n":"8","nombre":"Chubby lounge singer on liver piano","ver":"Una cantante robusta recostada sobre un piano con forma de hígado.","clinica":"La ingestión repetida de etanol resulta en una escasez crónica de NAD+ → los ácidos grasos se acumulan en el hígado → cambio graso (esteatosis).","sketchy":"La cantante \"robusta\" (chubby) sobre el piano-hígado representa la acumulación grasa (esteatosis) en el órgano.","literal":"repeated ingestion of ethanol results in a chronic shortage of NAD+ → fatty acids build up in the liver → fatty change (steatosis)"},{"n":"9","nombre":"Polka dots","ver":"Un vestido de lunares (polka dots) que viste la cantante.","clinica":"En histología, la esteatosis causa que los hepatocitos se llenen de vesículas de grasa (esteatosis MICROvesicular si son pequeños glóbulos de grasa, MACROvesicular si son glóbulos grandes que desplazan el núcleo).","sketchy":"Los \"lunares\" (polka dots) representan literalmente las vesículas de grasa dentro de los hepatocitos.","literal":"on histology, steatosis causes hepatocytes to fill with vesicles of fat (MICROvesicular steatosis if small globules of fat, MACROvesicular steatosis if large globules of fat displacing nucleus)"},{"n":"10","nombre":"\"III\" course dessert in center","ver":"Un postre elegante servido en el centro de la mesa, con un cartel \"III\".","clinica":"La zona 3 (la zona centrolobulillar) es la primera área en desarrollar cambio graso (también la más sensible a isquemia y toxinas metabólicas).","sketchy":"El número romano \"III\" en el postre servido \"al centro\" es la clave literal directa de la zona 3 centrolobulillar.","literal":"zone 3 (the centrilobular zone) is the first area to develop fatty change (also the most sensitive to ischemia and metabolic toxins)"},{"n":"11","nombre":"Sending back order","ver":"Un mesero devolviendo un plato/orden a la cocina.","clinica":"El hígado graso (esteatosis) es reversible (con el cese del alcohol).","sketchy":"\"Devolver el pedido\" (sending back) representa literalmente la reversibilidad del proceso.","literal":"fatty liver (steatosis) is reversible (cessation of alcohol)"},{"n":"12","nombre":"Flaming liver piano","ver":"Llamas ardiendo en la base del piano-hígado.","clinica":"La esteatosis persistente puede llevar a esteatohepatitis (especies reactivas de oxígeno, efecto tóxico directo del etanol/acetaldehído).","sketchy":"Las \"llamas\" (flaming) representan la inflamación de la esteatohepatitis.","literal":"persistent steatosis can lead to steatohepatitis (reactive oxygen species, direct toxic effect of ethanol/acetaldehyde)"},{"n":"13","nombre":"CytoCOINS","ver":"Monedas (\"CytoCOINS\") esparcidas cerca del piano en llamas.","clinica":"El daño a los hepatocitos → liberación de citoquinas → infiltrado inflamatorio (hepatitis alcohólica).","sketchy":"\"CytoCOINS\" (monedas de cito-) es la clave fonética directa para \"cytokine\" (citoquina).","literal":"hepatocyte damage → cytokine release → inflammatory infiltrate (alcoholic hepatitis)"},{"n":"14","nombre":"First responders","ver":"Un grupo de personal de emergencia (first responders) llegando a la escena.","clinica":"Ocurre un influjo de neutrófilos en la hepatitis alcohólica.","sketchy":"Los \"primeros en responder\" (first responders) representan los neutrófilos, primeras células en llegar a la inflamación.","literal":"an influx of neutrophils occurs in alcoholic hepatitis"},{"n":"15","nombre":"Filamentous lace","ver":"Encaje filamentoso en el vestido de la cantante.","clinica":"La hepatitis alcohólica daña los filamentos intermedios → clumping (agrupación) filamentoso.","sketchy":"El encaje \"filamentoso\" representa literalmente los filamentos intermedios del citoesqueleto celular.","literal":"alcoholic hepatitis damages intermediate filaments→ filament clumping"},{"n":"16","nombre":"Eosinophilic splotches of wax","ver":"Manchas rosadas de cera derretida en las velas de la mesa.","clinica":"Los filamentos intermedios agrupados aparecen como densidades rosadas (\"cuerpos de Mallory\") dentro de los hepatocitos (en la hepatitis alcohólica).","sketchy":"Las manchas \"rosadas de cera\" representan literalmente los cuerpos de Mallory eosinofílicos.","literal":"clumped intermediate filaments appear as pink densities (\"Mallory bodies\") within hepatocytes (in alcoholic hepatitis)"},{"n":"17","nombre":"Balloons","ver":"Globos rosados flotando en la escena.","clinica":"El daño a los hepatocitos puede causar que se \"inflen como globo\" (balloon) en la hepatitis alcohólica.","sketchy":"Los globos son la representación literal directa del \"ballooning\" hepatocelular.","literal":"damage to hepatocytes can cause them to balloon (in alcoholic hepatitis)"},{"n":"18","nombre":"Popped balloon","ver":"Un globo reventado cerca del cartel \"One Night Only: The Mallory Sisters\".","clinica":"Los hepatocitos hinchados y dañados pueden progresar a necrosis hepatocelular.","sketchy":"El globo \"reventado\" (popped) representa directamente la necrosis (destrucción) celular.","literal":"damaged ballooned hepatocytes can progress to hepatocyte necrosis (in alcoholic hepatitis)"},{"n":"19","nombre":"Fibrous plant around central column","ver":"Una planta fibrosa/enredadera enroscada alrededor de una columna central azul.","clinica":"La fibrosis comienza cerca de la vena central del hígado (en la zona 3, el mismo sitio donde inicia la esteatosis) (ocurre en la hepatitis alcohólica).","sketchy":"La planta \"fibrosa\" enredada en la columna \"central\" representa la fibrosis alrededor de la vena central.","literal":"fibrosis starts near the central vein of the liver (in zone 3, the same location as the start of steatosis) (occurs in alcoholic hepatitis)"},{"n":"20","nombre":"Midsection and hair on fire","ver":"Un personaje con la sección media del cuerpo y el cabello en llamas.","clinica":"La hepatitis alcohólica puede presentarse con un hígado grande y doloroso, y fiebre/leucocitosis.","sketchy":"La \"sección media\" (abdomen, hígado) en llamas y el cabello ardiendo (fiebre) representan ambos síntomas combinados.","literal":"alcoholic hepatitis can present with a large painful liver and fever/leukocytosis"},{"n":"21","nombre":"\"toAST\" 2 glasses","ver":"Dos copas brindando (\"toast\") en la escena.","clinica":"En la hepatitis alcohólica, los hepatocitos filtran enzimas → AST y ALT elevadas (relación AST > ALT, 2:1).","sketchy":"\"toAST\" con \"AST\" resaltado es la clave literal, y las \"2 copas\" representan la proporción 2:1 de AST sobre ALT.","literal":"in alcoholic hepatitis, hepatocytes leak enzymes → elevated AST and ALT (AST > ALT, 2:1 ratio)"},{"n":"22","nombre":"Gadget knife","ver":"Un cuchillo tipo navaja multiusos (gadget) sostenido por un personaje.","clinica":"La gamma glutamil transpeptidasa (GGT) está elevada en el uso crónico de alcohol (incluyendo la hepatitis alcohólica).","sketchy":"\"Gadget\" suena fonéticamente similar a \"GGT\" (gamma-glutamyl transpeptidase).","literal":"gamma glutamyl transpeptidase (GGT) is elevated in chronic alcohol use (including alcoholic hepatitis)"},{"n":"23","nombre":"Dousing liver flame","ver":"Alguien apagando (dousing) las llamas del piano-hígado.","clinica":"La hepatitis alcohólica es generalmente reversible.","sketchy":"\"Apagar el fuego\" (dousing) representa directamente la reversibilidad de la condición.","literal":"alcoholic hepatitis is generally reversible"},{"n":"24","nombre":"Scarred liver coral","ver":"Un coral con textura cicatrizada dentro del acuario de la pared.","clinica":"La hepatitis alcohólica puede progresar a cirrosis (cicatrización que forma septos y nódulos, generalmente irreversible).","sketchy":"El coral \"cicatrizado\" (scarred) representa literalmente la fibrosis/cicatrización de la cirrosis.","literal":"alcoholic hepatitis may progress to cirrhosis (scarring that forms septa and nodules, generally irreversible)"},{"n":"25","nombre":"Cancer crab","ver":"Un cangrejo rojo dentro del acuario.","clinica":"La cirrosis puede causar carcinoma hepatocelular.","sketchy":"El cangrejo (símbolo de cáncer) representa directamente el riesgo de HCC.","literal":"cirrhosis can cause hepatocellular carcinoma"},{"n":"26","nombre":"Sober lounge singer","ver":"Una segunda cantante, de aspecto sobrio (sin alcohol), sobre el otro piano.","clinica":"La enfermedad hepática grasa no alcohólica (NAFLD) es similar a la enfermedad hepática grasa alcohólica, y puede progresar a esteatohepatitis y cirrosis.","sketchy":"La cantante \"sobria\" (sober) marca el paralelismo con la primera escena, pero sin el componente de alcohol.","literal":"non-alcoholic fatty liver disease (NAFLD) is similar to alcoholic fatty liver disease, and can progress to steatohepatitis and cirrhosis"},{"n":"27","nombre":"Polka dots","ver":"El mismo vestido de lunares en la segunda cantante.","clinica":"En histología, la esteatosis causa que los hepatocitos se llenen de vesículas de grasa (MICROvesicular si hay poca grasa, MACROvesicular si hay mucha grasa desplazando el núcleo).","sketchy":"Repite el símbolo de los lunares para las vesículas de grasa, ahora en el contexto de NAFLD.","literal":"on histology, steatosis causes hepatocytes to fill with vesicles of fat (MICROvesicular steatosis if small amount of fat, MACROvesicular steatosis if large amount of fat displacing nucleus)"},{"n":"28","nombre":"Extra-chubby singer","ver":"La cantante con un aspecto notablemente más robusto que antes.","clinica":"El tejido adiposo visceral excesivo es probablemente la causa de la NASH (adiposo visceral → resistencia a la insulina → metabolismo de ácidos grasos alterado → el hígado retiene más ácidos grasos).","sketchy":"El aspecto \"extra robusto\" (extra-chubby) representa el exceso de tejido adiposo visceral.","literal":"excessive visceral adipose tissue is likely the cause of NASH (visceral adipose → insulin resistance → altered fatty acid metabolism → liver retains more fatty acids)"},{"n":"29","nombre":"Flaming liver with first responders","ver":"El segundo piano-hígado en llamas, con personal de emergencia llegando.","clinica":"La esteatohepatitis no alcohólica (NASH) es similar a la esteatohepatitis alcohólica (ambas son condiciones inflamatorias con infiltración de neutrófilos).","sketchy":"Repite el símbolo de las llamas y los primeros respondedores para marcar el paralelismo inflamatorio con la hepatitis alcohólica.","literal":"nonalcoholic steatohepatitis (NASH) is similar to alcoholic steatohepatitis (both inflammatory conditions with neutrophil infiltration)"},{"n":"30","nombre":"Hepatocyte ballooning","ver":"Más globos rosados flotando cerca de la segunda cantante.","clinica":"La NASH puede causar que los hepatocitos se \"inflen como globo\" (similar a la hepatitis alcohólica).","sketchy":"Los globos repiten el símbolo del \"ballooning\" hepatocelular, ahora en NASH.","literal":"NASH can cause hepatocytes to balloon (similar to alcoholic hepatitis)"},{"n":"31","nombre":"Eosinophilic splotches of wax","ver":"Manchas de cera rosada en las velas cerca de la segunda cantante.","clinica":"La NASH puede causar densidades rosadas (\"cuerpos de Mallory\") dentro de los hepatocitos (similar a la hepatitis alcohólica).","sketchy":"Repite el símbolo de la cera rosada para los cuerpos de Mallory, ahora en NASH.","literal":"NASH can cause pink densities (\"Mallory bodies\") within hepatocytes (similar to alcoholic hepatitis)"},{"n":"32","nombre":"Metabolic brownies","ver":"Brownies servidos en un plato cerca de la segunda cantante.","clinica":"El síndrome metabólico (al menos 2 de: obesidad, resistencia a la insulina, dislipidemia, hipertensión) es un factor de riesgo para la progresión de NAFLD a NASH a fibrosis hepática.","sketchy":"Los \"brownies metabólicos\" representan directamente el síndrome metabólico como factor de riesgo.","literal":"metabolic syndrome (at least 2 of obesity, insulin resistance, dyslipidemia, hypertension) is a risk factor for progression of NAFLD to NASH to liver fibrosis"},{"n":"33","nombre":"\"mALT\" shake","ver":"Un batido de malta (malt shake) etiquetado \"MALT\" sostenido por un personaje.","clinica":"En la NASH, tanto la ALT como la AST están elevadas (usualmente ALT mayor que AST).","sketchy":"\"mALT\" con \"ALT\" resaltado es la clave literal directa de la enzima elevada predominante en NASH.","literal":"In NASH, both ALT and AST are elevated (usually ALT greater than AST)"},{"n":"34","nombre":"Scarred liver coral, again","ver":"El mismo coral cicatrizado del acuario, visto nuevamente.","clinica":"La esteatohepatitis no alcohólica puede progresar a cirrosis (cicatrización que forma septos y nódulos, generalmente irreversible) (similar a la hepatitis alcohólica).","sketchy":"Repite el coral cicatrizado para marcar el mismo desenlace de cirrosis, ahora vía NASH.","literal":"non-alcoholic steatohepatitis may progress to cirrhosis (scarring that forms septa and nodules, generally irreversible)(similar to alcoholic hepatitis)"},{"n":"35","nombre":"Rays of sun","ver":"Rayos de sol brillando desde el letrero \"House of the Rising Sun\".","clinica":"Síndrome de Reye (tríada de encefalopatía, cambio graso microvesicular hepático y elevación de transaminasas séricas) en niños que toman aspirina.","sketchy":"\"Rising Sun\" evoca el nombre \"Reye's\" fonéticamente, marcando el inicio del segundo tema de la escena.","literal":"Reye's syndrome (triad of encephalopathy, liver microvesicular fatty change, and elevated serum transaminases) in children who take aspirin"},{"n":"36","nombre":"Aspirin umpire and viral lanterns","ver":"Un guardia tipo árbitro (umpire) con equipo de protección, y linternas colgantes con forma viral.","clinica":"El síndrome de Reye se asocia con la administración de aspirina a niños jóvenes con una infección viral (ej. varicela, infección respiratoria alta).","sketchy":"El \"guardia de aspirina\" y las \"linternas virales\" representan los dos factores combinados: aspirina + infección viral.","literal":"Reye's syndrome is associated with aspirin administration to young children with a viral infection (e.g chicken pox, upper respiratory infection)"},{"n":"37","nombre":"Blowing nose","ver":"Un niño sonándose la nariz cerca de la entrada.","clinica":"El síndrome de Reye puede estar precedido por síntomas de enfermedad viral.","sketchy":"\"Sonarse la nariz\" representa directamente los síntomas de infección viral previa.","literal":"Reye's syndrome may be preceded by symptoms of viral illness"},{"n":"38","nombre":"Cracked mitochondrial window","ver":"Una ventana agrietada con forma de mitocondria, siendo limpiada por un empleado.","clinica":"El síndrome de Reye es resultado de daño mitocondrial → beta-oxidación alterada de ácidos grasos → acumulación de ácidos grasos, inflamación, transaminasas elevadas.","sketchy":"La ventana \"agrietada con forma de mitocondria\" es la representación literal directa del daño mitocondrial.","literal":"Reye's syndrome is a result of mitochondrial damage → impaired β-oxidation of fatty acids → accumulation of fatty acids, inflammation, elevated transaminases"},{"n":"39","nombre":"Little droplets on liver mat","ver":"Pequeñas gotas visibles en una alfombra/tapete con forma de hígado en la entrada.","clinica":"El síndrome de Reye causa cambios grasos MICROvesiculares (pequeños glóbulos de grasa en el citoplasma del hepatocito).","sketchy":"Las \"pequeñas gotas\" representan literalmente el patrón microvesicular (glóbulos pequeños) de grasa.","literal":"Reye's syndrome causes MICROvesicular fatty changes (small globules of fat in hepatocyte cytoplasm)"},{"n":"40","nombre":"\"mALT\" shake","ver":"Otro batido \"MALT\" sostenido cerca de la entrada de \"House of the Rising Sun\".","clinica":"En el síndrome de Reye, el daño hepatocelular lleva a ALT y AST elevadas.","sketchy":"Repite el símbolo del batido \"mALT\" para la enzima elevada, ahora en el contexto del síndrome de Reye.","literal":"in Reye's syndrome, hepatocyte damage leads to elevated ALT and AST"},{"n":"41","nombre":"NH3 spray","ver":"Un aerosol/spray etiquetado \"NH3\" sostenido por un personaje cerca de la puerta.","clinica":"En el síndrome de Reye, la lesión mitocondrial → ciclo de la urea alterado → metabolismo disminuido de amoníaco → niveles séricos elevados de amoníaco.","sketchy":"El spray etiquetado \"NH3\" es la clave literal directa del amoníaco acumulado.","literal":"in Reye's syndrome, mitochondrial injury → impaired urea cycle → decreased metabolism of ammonia → elevated serum ammonia levels"},{"n":"42","nombre":"Hitting kid in the brain hat","ver":"Un personaje golpeando/tocando el sombrero con forma de cerebro que lleva un niño.","clinica":"El síndrome de Reye causa encefalopatía (inicialmente somnolencia, regresión del desarrollo motor) debido a niveles séricos elevados de amoníaco.","sketchy":"El \"sombrero de cerebro\" golpeado representa la afectación encefalopática causada por el amoníaco.","literal":"Reye's syndrome causes encephalopathy (initially somnolence, regression of motor development) due to elevated serum ammonia levels"},{"n":"43","nombre":"Wet head","ver":"Un personaje con la cabeza mojada, cerca de la entrada.","clinica":"En el síndrome de Reye, puede desarrollarse edema cerebral y empeoramiento de la encefalopatía (convulsiones, vómitos, signos de neurona motora superior).","sketchy":"La \"cabeza mojada/hinchada\" (wet head) representa directamente el edema cerebral.","literal":"in Reye's syndrome, cerebral edema and worsening encephalopathy may develop (seizures, vomiting, upper motor neuron signs)"}]},{"slug":"polipos-colorrectales-cancer","titulo":"Pólipos colorrectales y cáncer","items":[{"n":"1","nombre":"Mushroom caps","ver":"Una gran casa-hongo con sombrero moteado, punto de partida de todo el pueblo \"Lillypolypton Village\".","clinica":"Los pólipos son excrecencias de la mucosa que se encuentran más comúnmente en el colon (pueden ser pedunculados o sésiles) (pueden ser neoplásicos o no neoplásicos).","sketchy":"Los \"sombreros de hongo\" (mushroom caps) son la representación literal directa de los pólipos, excrecencias con forma de hongo sobre la mucosa.","literal":"polyps are outgrowths of mucosa most commonly found in the colon (may be pedunculated or sessile) (may be neoplastic or non-neoplastic)"},{"n":"2","nombre":"Hamartomatous hammer","ver":"Un gnomo sosteniendo un martillo, cerca de la entrada del pueblo.","clinica":"Pólipos HAMARTOMATOSOS (no neoplásicos).","sketchy":"\"Hammer\" (martillo) suena fonéticamente similar al inicio de \"hamartomatous\".","literal":"HAMARTOMATOUS polyps (non-neoplastic)"},{"n":"3","nombre":"Disorganized welcome sign","ver":"Un cartel de madera desordenado que dice \"Welcome to Lillypolypton Village!\".","clinica":"Los pólipos HAMARTOMATOSOS son crecimientos desorganizados de células maduras.","sketchy":"El cartel \"desorganizado\" representa literalmente el crecimiento desorganizado de estos pólipos.","literal":"HAMARTOMATOUS polyps are disorganized growths of mature cells"},{"n":"4","nombre":"Happy old guy","ver":"Un gnomo mayor de aspecto feliz cerca de la entrada.","clinica":"Los pólipos HAMARTOMATOSOS son maduros y benignos.","sketchy":"El anciano \"feliz\" (benigno en carácter) representa la naturaleza benigna y madura de estos pólipos.","literal":"HAMARTOMATOUS polyps are MATURE and BENIGN"},{"n":"5","nombre":"Peutz-pop","ver":"Un gnomo sosteniendo una paleta/dulce (pop).","clinica":"El síndrome de Peutz-Jeghers se presenta con pólipos hamartomatosos en el tracto GI (más común en duodeno, también puede ocurrir en colon).","sketchy":"\"Peutz-pop\" (paleta) es la clave mnemotécnica fonética directa para \"Peutz-Jeghers\".","literal":"Peutz-Jeghers syndrome presents with hamartomatous polyps in the GI tract (most common in duodenum, can also occur in colon)"},{"n":"6","nombre":"Domino","ver":"Una ficha de dominó grande apoyada en el camino del pueblo.","clinica":"El síndrome de Peutz-Jeghers y el síndrome de poliposis juvenil (causas familiares de pólipos HAMARTOMATOSOS) son autosómicos dominantes.","sketchy":"El dominó es la clave mnemotécnica fonética fija de Sketchy para \"autosomal dominant\".","literal":"Peutz-Jeghers and juvenile polyposis syndromes (familial causes of HAMARTOMATOUS polyps) are autosomal dominant"},{"n":"7","nombre":"Pigmented juice spots","ver":"Un gnomo con manchas pigmentadas alrededor de la boca.","clinica":"El síndrome de Peutz-Jeghers se presenta con máculas pigmentadas alrededor de boca, labios, palmas y genitales (hiperpigmentación mucocutánea).","sketchy":"Las manchas de \"jugo\" pigmentado alrededor de la boca representan directamente la hiperpigmentación mucocutánea.","literal":"Peutz-Jeghers syndrome presents with pigmented macules around mouth, lips, palms, and genitalia (mucocutaneous hyperpigmentation)"},{"n":"8","nombre":"Infant with hammer","ver":"Un gnomo bebé sosteniendo un martillo, cerca del grupo de hongos.","clinica":"El síndrome de POLIPOSIS JUVENIL (más común en niños menores de 5 años) se presenta con pólipos HAMARTOMATOSOS.","sketchy":"El bebé sosteniendo el martillo (hamartomatoso) representa directamente el grupo etario pediátrico afectado.","literal":"JUVENILE POLYPOSIS syndrome (most common in children < 5 years of age) presents with HAMARTOMATOUS polyps"},{"n":"9","nombre":"Mushroom emerging from the behind","ver":"Un pequeño hongo emergiendo detrás de uno de los gnomos.","clinica":"Los pólipos JUVENILES son más comunes en el recto y pueden prolapsar a través del esfínter anal.","sketchy":"El hongo emergiendo \"por detrás\" representa directamente la localización rectal y el prolapso a través del esfínter anal.","literal":"JUVENILE polyps are most common in the RECTUM and may prolapse through the anal sphincter"},{"n":"10","nombre":"Bleeding mushroom","ver":"Un hongo con manchas rojas de sangre en el suelo cerca de él.","clinica":"Los pólipos JUVENILES se presentan con sangrado GI bajo (hematoquecia).","sketchy":"El hongo \"sangrante\" es la representación literal directa de la hematoquecia.","literal":"JUVENILE polyps present with lower GI bleeding (hematochezia)"},{"n":"11","nombre":"Little mushroom spots","ver":"Pequeñas manchas/puntos en la superficie de un hongo pequeño.","clinica":"Los pólipos JUVENILES muestran pequeños espacios quísticos (glándulas llenas de mucina y detritos).","sketchy":"Las pequeñas manchas puntiformes representan los espacios quísticos vistos en histología.","literal":"JUVENILE polyps display small cystic spaces (glands filled with mucin and debris)"},{"n":"12","nombre":"Creeping crab beetle","ver":"Un escarabajo grande arrastrándose cerca del grupo de hongos.","clinica":"El síndrome de POLIPOSIS JUVENIL se asocia con un riesgo aumentado de cáncer de colon (a pesar de que los pólipos son benignos).","sketchy":"El escarabajo \"arrastrándose\" (símbolo de cáncer en Sketchy) representa el riesgo maligno asociado.","literal":"JUVENILE POLYPOSIS syndrome is associated with an increased risk of colon cancer (despite polyps being benign)"},{"n":"13","nombre":"Big hyperplastic mushroom","ver":"Un hongo grande de color púrpura con manchas blancas.","clinica":"Pólipo HIPERPLÁSICO (proliferación epitelial no neoplásica).","sketchy":"El tamaño \"grande\" del hongo representa la proliferación epitelial (hiperplasia = crecimiento aumentado).","literal":"HYPERPLASTIC polyp (non-neoplastic epithelial proliferation)"},{"n":"14","nombre":"Happy lilipolyps","ver":"Pequeños gnomos-hongo de aspecto feliz alrededor del hongo grande.","clinica":"Los pólipos HIPERPLÁSICOS son BENIGNOS.","sketchy":"Los gnomos \"felices\" representan la naturaleza benigna de estos pólipos.","literal":"HYPERPLASTIC polyps are BENIGN"},{"n":"15","nombre":"Mucous-y goblet shrooms","ver":"Hongos delgados y alargados con aspecto viscoso/mucoso.","clinica":"Los pólipos HIPERPLÁSICOS son proliferaciones epiteliales que contienen abundantes células caliciformes (goblet cells).","sketchy":"El aspecto \"mucoso\" de los hongos representa las células caliciformes productoras de moco.","literal":"HYPERPLASTIC polyps are epithelial proliferations that contain abundant goblet cells"},{"n":"16","nombre":"Sawing near the surface","ver":"Un gnomo serruchando cerca de la superficie de un hongo, sin cortar profundo.","clinica":"Los pólipos HIPERPLÁSICOS tienen arquitectura serrada solo en la SUPERFICIE (las criptas mantienen forma lisa).","sketchy":"El serruchado \"solo cerca de la superficie\" representa literalmente que el patrón serrado se limita a la superficie.","literal":"HYPERPLASTIC polyps have serrated architecture only at the SURFACE (crypts retain smooth shape)"},{"n":"17","nombre":"Sawing on stalk-less mushroom cap","ver":"Un gnomo serruchando un hongo que no tiene tallo (stalk-less).","clinica":"Pólipo SESIL SERRADO (lesión plana premaligna del colon).","sketchy":"El hongo \"sin tallo\" (stalk-less) representa literalmente la naturaleza sésil (plana, sin pedúnculo) de este pólipo.","literal":"SESSILE SERRATED polyp (premalignant flat lesion of the colon)"},{"n":"18","nombre":"Sawing all the way through","ver":"El gnomo serruchando completamente a través del hongo sésil.","clinica":"Los pólipos SÉSILES SERRADOS tienen arquitectura serrada A TRAVÉS DE TODO (incluyendo las criptas).","sketchy":"El serruchado \"a través de todo\" representa que el patrón serrado incluye las criptas, no solo la superficie.","literal":"SESSILE SERRATED polyps have serrated architecture THROUGHOUT (crypts included)"},{"n":"19","nombre":"Creeping crab beetle","ver":"Un escarabajo grande arrastrándose cerca de los hongos serrados.","clinica":"Los PÓLIPOS SERRADOS Y ADENOMAS tienen el potencial de transformarse en cáncer.","sketchy":"El escarabajo (símbolo de cáncer) representa el potencial de transformación maligna.","literal":"SERRATED POLYPS & ADENOMAS have the potential to transform into cancer"},{"n":"20","nombre":"ADDing shingles to mushroom house","ver":"Un gnomo añadiendo tejas a una casa-hongo.","clinica":"Los pólipos ADENOMATOSOS (ADENOMAS) son el tipo más común de pólipo de colon.","sketchy":"\"ADDing\" (añadiendo) suena fonéticamente como el inicio de \"ADenoma\".","literal":"ADENOMATOUS polyps (ADENOMAS) are the most common type of colon polyp"},{"n":"21","nombre":"Creeping crab beetle","ver":"Otro escarabajo arrastrándose cerca de la casa-hongo.","clinica":"Los PÓLIPOS SERRADOS Y ADENOMAS tienen el potencial de transformarse en cáncer.","sketchy":"El escarabajo repite el símbolo de riesgo de malignización.","literal":"SERRATED POLYPS & ADENOMAS have the potential to transform into cancer"},{"n":"22","nombre":"Oversized mushroom next to crab beetle","ver":"Un hongo de gran tamaño junto al escarabajo.","clinica":"Los ADENOMAS más grandes tienen mayor probabilidad de transformarse en cáncer.","sketchy":"El tamaño \"sobredimensionado\" del hongo representa directamente el mayor tamaño del adenoma.","literal":"larger ADENOMAS are more likely to transform into cancer"},{"n":"23","nombre":"\"1\" horn","ver":"Un cuerno con el número \"1\" grabado.","clinica":"Los adenomas mayores de 1 cm tienen más probabilidad de transformarse en cáncer que los pólipos más pequeños.","sketchy":"El \"1\" en el cuerno es la clave numérica directa del umbral de 1 cm.","literal":"adenomas >1 cm are more likely to transform into cancer than smaller polyps"},{"n":"24","nombre":"Increasingly disorganized purple weeds next to crab beetle","ver":"Hierbas moradas cada vez más desordenadas junto al escarabajo.","clinica":"Los ADENOMAS con mayor grado de displasia (epitelio más hipercromático, elongado y estratificado) tienen más probabilidad de transformarse en cáncer.","sketchy":"Las hierbas \"cada vez más desordenadas\" representan el aumento progresivo del grado de displasia.","literal":"ADENOMAS with a greater degree of dysplasia (more hyperchromatic, elongated, and stratified epithelium) are more likely to transform into cancer"},{"n":"25","nombre":"TUBULAR horn","ver":"Un cuerno con forma tubular sostenido por un gnomo.","clinica":"ADENOMAS TUBULARES (pólipos pequeños pedunculados compuestos de células mucosas displásicas que forman glándulas con forma de tubo).","sketchy":"La forma \"tubular\" del cuerno es la representación literal directa del adenoma tubular.","literal":"TUBULAR ADENOMAS (small pedunculated polyps composed of dysplastic mucosal cells that form tube-shaped glands)"},{"n":"26","nombre":"Tubular perforations","ver":"Perforaciones/agujeros redondos en una de las casas-hongo.","clinica":"Los ADENOMAS TUBULARES muestran secciones transversales de glándulas tubulares redondas en histología.","sketchy":"Las perforaciones redondas representan los cortes transversales de las glándulas tubulares vistas al microscopio.","literal":"TUBULAR ADENOMAS display round tubular gland cross sections on histology"},{"n":"27","nombre":"Finger-like stalk-less fungus","ver":"Hongos delgados con forma de dedos, sin tallo definido.","clinica":"ADENOMAS VELLOSOS (sésiles, más grandes que los adenomas tubulares, con glándulas largas con proyecciones tipo vellosidades).","sketchy":"Las proyecciones \"en forma de dedo\" representan literalmente las vellosidades del adenoma velloso.","literal":"VILLOUS ADENOMAS (sessile, larger than tubular adenomas, long glands with villi-like projections)"},{"n":"28","nombre":"Villus fungus next to crab beetle","ver":"Un hongo con proyecciones vellosas junto al escarabajo.","clinica":"Los ADENOMAS VELLOSOS tienen más probabilidad de transformarse en cáncer (comparados con los adenomas tubulares).","sketchy":"El hongo velloso junto al escarabajo de cáncer representa el mayor riesgo relativo de malignización.","literal":"VILLOUS ADENOMAS are more likely to transform into cancer (compared to TUBULAR ADENOMAS)"},{"n":"29","nombre":"Polyp family","ver":"Una familia completa de gnomos-hongo agrupados frente a una casa.","clinica":"Poliposis Adenomatosa Familiar (FAP) (síndrome hereditario que causa miles de pólipos adenomatosos desde temprana edad).","sketchy":"La \"familia\" de pólipos representa literalmente el carácter familiar y múltiple de la FAP.","literal":"Familial adenomatous polyposis (FAP) (inherited syndrome that causes thousands of adenomatous polyps early in life)"},{"n":"30","nombre":"Domino","ver":"Una ficha de dominó negra apoyada cerca de la casa familiar.","clinica":"La FAP es autosómica DOMINANTE.","sketchy":"El dominó es el símbolo fijo de Sketchy para \"autosomal dominant\".","literal":"FAP is autosomal DOMINANT"},{"n":"31","nombre":"\"A Pulled Carrot\"","ver":"Una zanahoria siendo arrancada del suelo por un gnomo.","clinica":"La poliposis adenomatosa familiar (FAP) es causada por una mutación germinal en el gen APC.","sketchy":"\"A Pulled\" suena fonéticamente como \"APC\", y la zanahoria \"arrancada\" representa la mutación del gen.","literal":"familial adenomatous polyposis (FAP) is caused by a germline mutation in the APC gene"},{"n":"32","nombre":"Cancer-fighting ribbon","ver":"Un lazo rosado (cancer-fighting ribbon) atado cerca de la zanahoria.","clinica":"APC es un gen supresor tumoral.","sketchy":"El lazo \"de lucha contra el cáncer\" representa el papel protector/supresor tumoral del gen APC.","literal":"APC is a tumor suppressor gene"},{"n":"33","nombre":"A single pulled carrot stalk","ver":"Un solo tallo de zanahoria siendo arrancado por un gnomo.","clinica":"En la FAP, solo un alelo APC tiene una mutación germinal (la segunda mutación ocurre durante la vida de la persona) (\"segundo golpe\").","sketchy":"El \"único\" tallo arrancado representa el primer alelo mutado, dejando el segundo intacto hasta el \"segundo hit\".","literal":"in FAP, only one APC allele has a germline mutation (the second mutation occurs during person's lifetime) (\"second hit\")"},{"n":"34","nombre":"Abundant mushrooms","ver":"Una abundancia de pequeños hongos agrupados en el suelo.","clinica":"La FAP puede presentarse con miles de pólipos en el colon (visualizados por colonoscopía).","sketchy":"La \"abundancia\" de hongos representa literalmente los miles de pólipos característicos de la FAP.","literal":"FAP can present with thousands of polyps in the colon (as visualized by colonoscopy)"},{"n":"35","nombre":"Family crab beetle","ver":"Un gran escarabajo cerca de la casa familiar de hongos.","clinica":"La FAP progresa a cáncer de colon en casi el 100% de los casos (el tratamiento es colectomía profiláctica).","sketchy":"El escarabajo (cáncer) ubicado junto a la familia representa la progresión casi segura a malignidad.","literal":"FAP progresses to colon cancer in nearly 100% of cases (treatment is prophylactic colectomy)"},{"n":"36","nombre":"Gardner within mushroom field","ver":"Una figura tipo jardinero (gardener) dentro de un campo cercado de hongos pequeños.","clinica":"El síndrome de GARDNER (variante de FAP) (trastorno hereditario que se presenta con pólipos adenomatosos y tumores de TEJIDO BLANDO).","sketchy":"\"Gardner\" (jardinero) es la clave mnemotécnica fonética directa del síndrome de Gardner.","literal":"GARDNER syndrome (FAP variant) (inherited disorder presenting with adenomatous polyps and SOFT TISSUE TUMORS)"},{"n":"37","nombre":"Bone garden fence","ver":"Una cerca hecha de huesos alrededor del campo del jardinero.","clinica":"El síndrome de GARDNER se presenta con osteomas (tumores óseos benignos).","sketchy":"La cerca \"de hueso\" representa directamente los osteomas.","literal":"GARDNER syndrome presents with osteomas (benign bone tumor)"},{"n":"38","nombre":"Skin rash on gardner","ver":"Una erupción cutánea visible en la piel del jardinero.","clinica":"El síndrome de GARDNER se presenta con lesiones cutáneas.","sketchy":"La erupción cutánea representa directamente las lesiones dermatológicas asociadas.","literal":"GARDNER syndrome presents with cutaneous lesions"},{"n":"39","nombre":"Overgrown sunglasses on gardner","ver":"Unas gafas de sol sobrecrecidas/agrandadas que lleva puestas el jardinero.","clinica":"El síndrome de GARDNER se presenta con hipertrofia del epitelio pigmentario retiniano.","sketchy":"Las gafas \"sobrecrecidas\" (overgrown) representan la hipertrofia ocular.","literal":"GARDNER syndrome presents with hypertrophy of retinal pigment epithelium"},{"n":"40","nombre":"Tooth gardening stool","ver":"Un banco de jardinería con forma de diente.","clinica":"El síndrome de GARDNER se presenta con anormalidades dentales (dientes impactados y supernumerarios).","sketchy":"El banco con forma de \"diente\" (tooth) representa directamente las anormalidades dentales.","literal":"GARDNER syndrome presents with dental abnormalities (impacted and supernumerary teeth)"},{"n":"41","nombre":"Elder lilipolyp wearing turban","ver":"Un gnomo mayor con turbante, cerca de una casa-hongo grande.","clinica":"El síndrome de TURCOT (variante de FAP) se presenta con adenomas de colon y tumores CEREBRALES (meduloblastomas).","sketchy":"El \"turbante\" (turban) suena fonéticamente similar al inicio de \"TURCOT\".","literal":"TURCOT syndrome (FAP variant) presents with colon adenomas and BRAIN tumors (medulloblastomas)"},{"n":"42","nombre":"Crab beetle attacking Lilipolyp Village","ver":"Un gran escarabajo negro atacando la aldea de gnomos-hongo (Lilipolyp Village).","clinica":"Cáncer colorrectal (más comúnmente adenocarcinoma; 3er cáncer más común y 2da causa más común de muerte por cáncer).","sketchy":"El escarabajo \"atacando\" toda la aldea representa el cáncer colorrectal invadiendo el colon (representado por el pueblo entero).","literal":"colorectal cancer (most commonly adenocarcinoma - 3rd most common cancer and 2nd most common cause of cancer death)"},{"n":"43","nombre":"Old man lilipolyp riding crab beetle","ver":"Un gnomo mayor montado sobre el escarabajo negro.","clinica":"La incidencia máxima del cáncer colorrectal es entre los 60-70 años de edad, con los hombres afectados ligeramente más que las mujeres.","sketchy":"El gnomo \"mayor\" montando el escarabajo de cáncer representa el grupo etario de mayor incidencia.","literal":"peak incidence of colorectal cancer is 60-70 years of age, with men affected slightly more than women"},{"n":"44","nombre":"Family photo","ver":"Un marco de fotografía con una niña y un niño, en el fondo de la escena.","clinica":"La historia familiar es un factor de riesgo para el cáncer colorrectal (incluso en ausencia de un síndrome familiar conocido).","sketchy":"La \"foto familiar\" representa directamente el factor de riesgo de historia familiar.","literal":"family history is a risk factor for colorectal cancer (even in the absence of a known familial syndrome)"},{"n":"45","nombre":"Smoker","ver":"Brotes/hierbas cerca de la corriente de agua, con aspecto de humo cercano.","clinica":"El tabaquismo es un factor de riesgo para el cáncer colorrectal.","sketchy":"El elemento \"fumador\" representa directamente el factor de riesgo del tabaquismo.","literal":"smoking is a risk factor for colorectal cancer"},{"n":"46","nombre":"Alcohol bottle","ver":"Un tocón de árbol con una marca \"XX\" (etiqueta de alcohol).","clinica":"El consumo de alcohol es un factor de riesgo para el cáncer colorrectal.","sketchy":"La marca \"XX\" (símbolo clásico de licor fuerte) representa el consumo de alcohol.","literal":"alcohol use is a risk factor for colorectal cancer"},{"n":"47","nombre":"Round lilipolyp","ver":"Un gnomo-hongo de forma redondeada montado sobre el escarabajo.","clinica":"La obesidad es un factor de riesgo para el cáncer colorrectal.","sketchy":"La forma \"redonda\" del gnomo representa directamente la obesidad.","literal":"obesity is a risk factor for colorectal cancer"},{"n":"48","nombre":"Fiery intestines","ver":"Una fogata ardiendo con forma de intestino retorcido.","clinica":"La enfermedad inflamatoria intestinal es un factor de riesgo para el cáncer colorrectal.","sketchy":"El \"intestino en llamas\" representa directamente la inflamación intestinal crónica.","literal":"inflammatory bowel disease is a risk factor for colorectal cancer"},{"n":"49","nombre":"\"A Pulled Carrot\"","ver":"Otra zanahoria siendo arrancada, cerca del rollo de listón rosado.","clinica":"Las mutaciones en el gen APC llevan al crecimiento inicial de pequeños pólipos ADENOMATOSOS (ADENOMAS).","sketchy":"La zanahoria arrancada repite el símbolo de la mutación de APC, ahora en el contexto de la secuencia adenoma-carcinoma.","literal":"mutations in the APC gene lead to the initial growth of small ADENOMATOUS POLYPS (ADENOMAS)"},{"n":"50","nombre":"Carrots","ver":"Un montón de zanahorias apiladas junto al lazo rosado.","clinica":"El producto del gen APC controla las concentraciones de beta-catenina e interactúa con E-caderina.","sketchy":"Las zanahorias representan el producto proteico del gen APC en su función reguladora normal.","literal":"the APC gene product controls the concentrations of beta-CATENIN and interacts with E-CADHERIN"},{"n":"51","nombre":"Cancer-fighting ribbon","ver":"Un rollo de listón rosado (cancer-fighting ribbon) junto a las zanahorias.","clinica":"APC es un gen supresor tumoral.","sketchy":"El listón repite el símbolo del gen supresor tumoral APC.","literal":"APC is a tumor suppressor gene"},{"n":"52","nombre":"Cancerous rat","ver":"Una rata grande en el camino del pueblo.","clinica":"Las mutaciones en el protooncogén K-RAS llevan a división celular imparable (K-RAS codifica una proteína que regula el ciclo celular).","sketchy":"\"Rat\" suena fonéticamente similar al final de \"K-RAS\", siendo la rata la clave mnemotécnica.","literal":"mutations in the K-RAS proto-oncogene leads to unstoppable cell division (K-RAS encodes for a protein that regulates the cell cycle)"},{"n":"53","nombre":"Mushrooms increasing in size","ver":"Un gnomo montado sobre la rata, con hongos que aumentan de tamaño alrededor.","clinica":"Los ADENOMAS aumentan de tamaño como resultado de mutaciones en K-RAS.","sketchy":"El aumento de tamaño de los hongos representa directamente el crecimiento del adenoma tras la mutación de K-RAS.","literal":"ADENOMAS increase in size as a result of mutations in K-RAS"},{"n":"54","nombre":"Broken city wall","ver":"Una estructura tipo muralla rota junto al camino.","clinica":"La invasión de la membrana basal marca la transformación maligna de un adenoma en un adenocarcinoma.","sketchy":"La \"muralla rota\" es la representación literal directa de la invasión de la membrana basal.","literal":"basement membrane invasion marks malignant transformation of an ADENOMA into an ADENOCARCINOMA"},{"n":"55","nombre":"Broken checkpoint","ver":"Un bastón de caramelo (candy cane) roto, tipo barrera de control.","clinica":"La mutación en el gen p53 (gen supresor tumoral que controla la transición de fase G1 a S) contribuye a la transformación maligna de pólipos en cáncer colorrectal.","sketchy":"El \"checkpoint roto\" (punto de control roto) representa directamente la falla del punto de control del ciclo celular regulado por p53.","literal":"mutation in the p53 gene (tumor suppressor gene that controls G1 to S phase transitioning) contributes to malignant transformation of polyps into colorectal cancer"},{"n":"56","nombre":"Broken \"Don't CCross\"","ver":"Un cartel roto que dice \"Don't CCross\".","clinica":"La pérdida del gen Deleted in Colon Cancer (DCC) (gen supresor tumoral que normalmente induce apoptosis) contribuye a la transformación maligna de pólipos en cáncer colorrectal.","sketchy":"\"CCross\" con las letras \"CC\" resaltadas es la clave literal directa para \"DCC\" (Deleted in Colon Cancer), y el cartel roto marca su pérdida funcional.","literal":"loss of the Deleted in Colon Cancer (DCC) gene (tumor suppressor gene that normally induces apoptosis) contributes to malignant transformation of polyps into colorectal cancer"},{"n":"57","nombre":"Cauliflower on the RIGHT","ver":"Una coliflor grande de color blanco en el lado derecho de la escena.","clinica":"El cáncer de colon del lado DERECHO (colon ascendente proximal) se presenta como una masa exofítica (usualmente NO obstructiva a pesar de la extensión hacia el lumen).","sketchy":"La coliflor \"e
