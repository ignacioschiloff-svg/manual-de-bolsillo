<title>Manual de Bolsillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,600;1,6..72,400&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root {
  --ground:      #FAF8FB;
  --surface:     #FFFFFF;
  --surface-alt: #F3EFF7;
  --ink:         #231D2B;
  --ink-soft:    #4B4356;
  --muted:       #6E6579;
  --line:        #E6DFEC;
  --line-soft:   #F0EAF4;

  --violet:      #6B3FA0;
  --violet-bg:   #F0E9F8;
  --safranin:    #C0355F;
  --safranin-bg: #FBE8EE;
  --slate:       #35646F;
  --slate-bg:    #E4EFF1;

  --h-top: 58px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #15121A;
    --surface:     #1D1924;
    --surface-alt: #262032;
    --ink:         #EBE5F1;
    --ink-soft:    #C6BED2;
    --muted:       #948BA1;
    --line:        #322B3D;
    --line-soft:   #272130;

    --violet:      #B491E4;
    --violet-bg:   #2A1F3C;
    --safranin:    #F08BAB;
    --safranin-bg: #3A1F2B;
    --slate:       #7FBAC7;
    --slate-bg:    #1B2E33;
  }
}

:root[data-theme="dark"] {
  --ground:      #15121A;
  --surface:     #1D1924;
  --surface-alt: #262032;
  --ink:         #EBE5F1;
  --ink-soft:    #C6BED2;
  --muted:       #948BA1;
  --line:        #322B3D;
  --line-soft:   #272130;

  --violet:      #B491E4;
  --violet-bg:   #2A1F3C;
  --safranin:    #F08BAB;
  --safranin-bg: #3A1F2B;
  --slate:       #7FBAC7;
  --slate-bg:    #1B2E33;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: "Source Sans 3", ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

button { font: inherit; }

/* ================= VISTA LISTA ================= */

.top {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--ground);
  border-bottom: 1px solid var(--line);
}

.top-inner {
  max-width: 760px;
  margin: 0 auto;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.brand {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.brand h1 {
  margin: 0;
  font-family: Newsreader, Georgia, serif;
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -.01em;
}

.tally {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.search { position: relative; display: flex; }

.search input {
  width: 100%;
  font-size: 16px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 38px 10px 13px;
  outline: none;
}

.search input::placeholder { color: var(--muted); }
.search input:focus { border-color: var(--violet); box-shadow: 0 0 0 3px var(--violet-bg); }

.search .clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 30px; height: 30px; border: 0; background: none;
  color: var(--muted); font-size: 19px; line-height: 1; cursor: pointer;
  border-radius: 8px; display: none;
}
.search.filled .clear { display: block; }

.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 90px; }

.chips {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  margin: 18px 0 4px; padding-bottom: 2px;
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  flex: none;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
  text-decoration: none; color: var(--ink-soft);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 11px; white-space: nowrap;
}
.chip[data-c="gp"] { color: var(--violet); border-color: var(--violet-bg); background: var(--violet-bg); }
.chip[data-c="gn"] { color: var(--safranin); border-color: var(--safranin-bg); background: var(--safranin-bg); }
.chip[data-c="rk"] { color: var(--safranin); }

.parte { margin-top: 28px; scroll-margin-top: 116px; }

.parte-head {
  display: flex; align-items: baseline; gap: 10px;
  padding-bottom: 8px; margin-bottom: 10px;
  border-bottom: 1px solid var(--line);
}

.parte-head h2 {
  margin: 0; font-family: Newsreader, Georgia, serif;
  font-size: 18px; font-weight: 600; color: var(--tone, var(--ink));
}

.parte-head .count {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
}

.parte[data-c="gp"], .estudio[data-c="gp"] { --tone: var(--violet); --tone-bg: var(--violet-bg); }
.parte[data-c="gn"], .estudio[data-c="gn"],
.parte[data-c="rk"], .estudio[data-c="rk"] { --tone: var(--safranin); --tone-bg: var(--safranin-bg); }
.parte[data-c="vi"], .parte[data-c="pa"],
.parte[data-c="he"], .parte[data-c="fa"],
.estudio[data-c="vi"], .estudio[data-c="pa"],
.estudio[data-c="he"], .estudio[data-c="fa"] { --tone: var(--slate); --tone-bg: var(--slate-bg); }

.temas { display: flex; flex-direction: column; gap: 7px; }

.tema-btn {
  width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 11px; padding: 13px 15px;
  display: flex; align-items: center; gap: 11px; color: inherit;
}
.tema-btn:hover { border-color: var(--tone, var(--violet)); }
.tema-btn:focus-visible { outline: 2px solid var(--tone, var(--violet)); outline-offset: 2px; }

.dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--tone, var(--muted)); }
.parte[data-c="rk"] .dot { opacity: .5; }

.tema-btn .nombre {
  flex: 1; font-family: Newsreader, Georgia, serif;
  font-size: 17px; font-weight: 600; line-height: 1.3; text-wrap: balance;
}

.tema-btn .n {
  flex: none; font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
}

.tema-btn .ico {
  flex: none; font-size: 11px; color: var(--muted);
  font-family: "IBM Plex Mono", ui-monospace, monospace;
}

/* ================= VISTA ESTUDIO ================= */

.estudio { display: none; }
body.en-estudio .lista-vista { display: none; }
body.en-estudio .estudio { display: block; }

.est-top {
  position: sticky; top: 0; z-index: 30;
  background: var(--ground); border-bottom: 1px solid var(--line);
  height: var(--h-top);
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px;
}

.volver {
  flex: none; display: flex; align-items: center; gap: 6px;
  background: none; border: 0; cursor: pointer;
  color: var(--tone, var(--violet)); padding: 8px 6px;
  font-size: 14px; border-radius: 8px;
}
.volver:focus-visible { outline: 2px solid var(--tone, var(--violet)); }

.est-titulo {
  flex: 1; min-width: 0;
  font-family: Newsreader, Georgia, serif;
  font-size: 16px; font-weight: 600; line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.est-cuenta {
  flex: none; font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
}

.est-cuerpo { max-width: 1240px; margin: 0 auto; }

/* --- panel de imagen --- */

.panel {
  position: sticky;
  top: var(--h-top);
  z-index: 20;
  background: var(--ground);
  border-bottom: 1px solid var(--line);
  padding: 8px 12px 10px;
}

.panel-barra {
  display: flex; align-items: center; gap: 6px; margin-bottom: 7px;
}

.seg {
  display: flex; gap: 2px; padding: 2px;
  background: var(--surface-alt); border-radius: 8px;
}

.seg button {
  border: 0; background: none; cursor: pointer;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); padding: 5px 10px; border-radius: 6px;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--tone, var(--violet)); }
.seg button:focus-visible { outline: 2px solid var(--tone, var(--violet)); }

.panel-espacio { flex: 1; }

.icon-btn {
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  color: var(--muted); width: 30px; height: 28px; border-radius: 7px;
  display: grid; place-items: center; font-size: 13px; line-height: 1;
}
.icon-btn:hover { color: var(--tone, var(--violet)); border-color: var(--tone, var(--violet)); }
.icon-btn:focus-visible { outline: 2px solid var(--tone, var(--violet)); }

.panel-img {
  display: block; width: 100%;
  max-height: 48vh; object-fit: contain; object-position: center;
  background: var(--surface-alt); border-radius: 9px;
  cursor: zoom-in;
}

/* en horizontal el alto escasea: la imagen manda y el texto se lee debajo */
@media (max-height: 520px) and (orientation: landscape) {
  .panel-img { max-height: 74vh; }
}

body.panel-oculto .panel-img { display: none; }
body.panel-oculto .panel { padding-bottom: 8px; }

/* --- fichas --- */

.fichas { padding: 4px 16px 90px; }

.item { padding: 17px 0; border-bottom: 1px solid var(--line-soft); scroll-margin-top: calc(var(--h-top) + 56vh); }
.item:last-child { border-bottom: 0; }

.item-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 11px; }

.item-head .num {
  flex: none; min-width: 26px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px; font-weight: 500; color: var(--tone, var(--violet));
  font-variant-numeric: tabular-nums; padding-top: 2px;
}

.item-head .titulo { font-size: 16px; font-weight: 600; line-height: 1.35; text-wrap: balance; }

.paso { padding-left: 36px; margin-bottom: 11px; }
.paso:last-child { margin-bottom: 0; }

.paso .lbl {
  display: block; font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 3px;
}
.paso .lbl .em { font-family: initial; letter-spacing: 0; margin-right: 4px; }

.paso p { margin: 0 0 5px; color: var(--ink-soft); font-size: 15.5px; }
.paso p:last-child { margin-bottom: 0; }

.paso.literal {
  background: var(--surface-alt); border-radius: 9px;
  padding: 11px 13px; margin-left: 36px; margin-top: 13px;
}
.paso.literal p {
  font-family: Newsreader, Georgia, serif; font-style: italic;
  font-size: 15px; line-height: 1.55; color: var(--ink-soft);
}

/* --- lado a lado en pantalla ancha --- */

@media (min-width: 950px) {
  .est-cuerpo {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 460px;
    gap: 0 28px;
    align-items: start;
    padding: 0 20px;
  }
  .panel {
    grid-column: 2; grid-row: 1;
    position: sticky; top: calc(var(--h-top) + 14px);
    border-bottom: 0; padding: 14px 0 0;
    background: none;
  }
  .panel-img { max-height: calc(100vh - var(--h-top) - 90px); }
  .fichas { grid-column: 1; grid-row: 1; padding: 6px 0 100px; }
  .item { scroll-margin-top: calc(var(--h-top) + 20px); }
  body.panel-oculto .est-cuerpo { grid-template-columns: minmax(0, 1fr); }
  body.panel-oculto .panel { grid-column: 1; }
}

/* ================= BUSQUEDA ================= */

.res-info {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px; color: var(--muted); margin: 20px 0 12px;
  font-variant-numeric: tabular-nums;
}

.res-tema {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--tone, var(--muted)); margin: 22px 0 6px; padding-left: 36px;
}

.vacio { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 15px; }

mark { background: var(--tone-bg, var(--violet-bg)); color: inherit; border-radius: 2px; padding: 0 1px; }

.pie {
  margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--muted); line-height: 1.65;
}

/* ================= VISOR ================= */

.visor {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(12, 9, 16, .95);
  display: none; overflow: auto; overscroll-behavior: contain;
}
.visor[data-abierto] { display: block; }
.visor img { display: block; min-width: 100%; width: 190%; max-width: none; height: auto; margin: 0 auto; }

.visor-cerrar {
  position: fixed; top: 12px; right: 12px; z-index: 91;
  width: 40px; height: 40px; border: 0; border-radius: 50%;
  background: rgba(255, 255, 255, .18); color: #FFF;
  font-size: 22px; line-height: 1; cursor: pointer;
}

.visor-nota {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 91;
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 10px;
  letter-spacing: .06em; color: rgba(255, 255, 255, .65);
  background: rgba(20, 16, 26, .75); padding: 5px 11px; border-radius: 999px;
  pointer-events: none;
}
</style>

<!-- ---------- LISTA ---------- -->
<div class="lista-vista">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>Manual de Bolsillo</h1>
        <span class="tally">22 temas · 489 elementos</span>
      </div>
      <div class="search" id="wrapBuscar">
        <input id="q" type="search" placeholder="Buscar: catalasa, esporas, doxiciclina…"
               autocomplete="off" autocorrect="off" spellcheck="false"
               aria-label="Buscar en todos los temas">
        <button class="clear" id="limpiar" aria-label="Limpiar búsqueda">×</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="chips" id="chips" aria-label="Ir a una parte"></nav>
    <div id="indice"></div>
    <div id="resultados" hidden></div>
    <p class="pie">
      Cuatro pasos por elemento: qué se ve → qué significa → cómo lo dice Sketchy → texto literal.
      El color marca la tinción: violeta cristal para Gram-positivas, rosa safranina para Gram-negativas.
    </p>
  </main>
</div>

<!-- ---------- ESTUDIO ---------- -->
<div class="estudio" id="estudio">
  <div class="est-top">
    <button class="volver" id="volver">← Temas</button>
    <span class="est-titulo" id="estTitulo"></span>
    <span class="est-cuenta" id="estCuenta"></span>
  </div>
  <div class="est-cuerpo">
    <div class="panel" id="panel">
      <div class="panel-barra">
        <div class="seg" id="seg">
          <button data-k="mapa" aria-pressed="true">Mapa</button>
          <button data-k="texto" aria-pressed="false">Texto</button>
        </div>
        <span class="panel-espacio"></span>
        <button class="icon-btn" id="btnZoom" aria-label="Ampliar imagen" title="Ampliar">⤢</button>
        <button class="icon-btn" id="btnPlegar" aria-label="Ocultar imagen" title="Ocultar imagen">▲</button>
      </div>
      <img class="panel-img" id="panelImg" alt="">
    </div>
    <div class="fichas" id="fichas"></div>
  </div>
</div>

<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Imagen ampliada">
  <button class="visor-cerrar" id="visorCerrar" aria-label="Cerrar">×</button>
  <img id="visorImg" alt="">
  <span class="visor-nota">Pellizca para acercar · desliza para mover</span>
</div>

la mandíbula y mejilla del soldado.","clinica":"Actinomyces israelii es típicamente un miembro inofensivo de la flora oral, pero puede llevar a actinomicosis cervicofacial en casos donde ocurre lesión mucosa en las áreas orales o de la mandíbula, notablemente durante procedimientos dentales; tiene progresión lenta, comenzando con un bulto mandibular no doloroso y eventualmente formando un absceso.","sketchy":"El vendaje envuelto específicamente en la mandíbula (\"jaw wrap\") señala directamente la actinomicosis cervicofacial y su localización típica.","literal":"Actinomyces israelii is a typically a harmless member of the oral flora, but can lead to cervicofacial actinomycosis in cases where mucosal injury occurs in the oral or jaw areas, notably during dental procedures, has a slow progression, beginning with a non-tender jaw lump and eventually forming an abscess"},{"n":"6","nombre":"Storm drain","ver":"Un desagüe/alcantarilla del que sale un líquido azulado, a la derecha de la escena.","clinica":"En la actinomicosis cervicofacial, las lesiones frecuentemente forman trayectos fistulosos (sinus tracts) que se extienden hacia la piel, emitiendo una secreción purulenta.","sketchy":"El desagüe con líquido drenando hacia afuera representa directamente los trayectos fistulosos que drenan secreción hacia la piel.","literal":"In cervicofacial actinomycosis, lesions often form sinus tracts extending to the skin, emitting a purulent discharge containing hard, yellowish \"sulfur granules\""},{"n":"7","nombre":"Yellow rocks","ver":"Rocas y piedras de color amarillento dispersas por el suelo del desierto.","clinica":"En la actinomicosis cervicofacial, las lesiones a menudo forman trayectos fistulosos que se extienden hacia la piel, emitiendo una secreción purulenta que contiene \"gránulos de azufre\" duros y amarillentos.","sketchy":"Las rocas amarillas dispersas son la representación literal de los característicos \"gránulos de azufre\" (sulfur granules) hallados en la secreción.","literal":"In cervicofacial actinomycosis, lesions often form sinus tracts extending to the skin, emitting a purulent discharge containing hard, yellowish \"sulfur granules\""},{"n":"8","nombre":"Purple pencil","ver":"Un lápiz de color púrpura que sostiene el soldado mientras escribe una carta.","clinica":"La penicilina G es el antibiótico preferido para tratar las infecciones por Actinomyces israelii, a menudo requiriendo una duración extendida de tratamiento para resolución completa; en casos más complicados, puede necesitarse drenaje quirúrgico.","sketchy":"\"Pencil\" (lápiz) suena fonéticamente similar al inicio de \"penicillin\", vinculando el objeto sostenido con el fármaco de elección.","literal":"Penicillin G is the preferred antibiotic for treating Actinomyces israelii infections, often requiring extended treatment duration for complete resolution, in more complicated cases, surgical drainage might be needed"}],"mapa":"imagenes/actinomyces-israelii-mapa.webp","texto":"imagenes/actinomyces-israelii-texto.webp"},{"slug":"clostridioides-difficile","titulo":"Clostridioides difficile","items":[{"n":"1","nombre":"Different cluster candies","ver":"Un cartel publicitario de \"Cluster Candies with different flavors!!!\" con un personaje tipo Willy Wonka mostrando unos dulces marrones.","clinica":"Clostridioides difficile.","sketchy":"\"Cluster\" suena como \"Clostridioides\" y \"different\" como \"difficile\", formando juntos el nombre completo de la bacteria.","literal":"Clostridioides difficile"},{"n":"2","nombre":"Purple rod-shaped candy","ver":"Dulces alargados de color púrpura, con forma de bastón, esparcidos por el suelo de la fábrica.","clinica":"C. difficile es un bacilo gram-positivo.","sketchy":"La forma de bastón marca la morfología de bacilo y el color púrpura la tinción gram-positiva.","literal":"C. difficile is a gram-positive bacillus"},{"n":"3","nombre":"Gas mask","ver":"Un trabajador con máscara de gas puesta, a la izquierda de la escena.","clinica":"C. difficile es un anaerobio obligado.","sketchy":"La máscara de gas representa el ambiente sin oxígeno que la bacteria necesita.","literal":"C. difficile is an obligate anaerobe"},{"n":"4","nombre":"Walnuts","ver":"Nueces doradas esparcidas por el suelo, cerca del río de chocolate.","clinica":"C. difficile forma esporas; las esporas bacterianas están metabólicamente dormidas y son resistentes al calor, la radiación y muchos agentes químicos.","sketchy":"Las nueces con su cáscara dura son el símbolo fijo de las esporas en toda la familia Clostridium.","literal":"C. difficile forms spores; bacterial spores are metabolically dormant and resistant to heat, radiation, and many chemical agents"},{"n":"5","nombre":"Normal flowers","ver":"Flores blancas y moradas de aspecto normal creciendo entre las rocas.","clinica":"Tanto las cepas toxigénicas como las no toxigénicas de C. difficile pueden colonizar el intestino como parte de la flora normal.","sketchy":"Las flores (\"flora\") de aspecto normal representan literalmente la flora intestinal normal donde la bacteria puede vivir sin causar daño.","literal":"Both toxigenic and nontoxigenic strains of C. difficile can colonize the gut as part of normal flora"},{"n":"6","nombre":"Eating chocolate walnuts","ver":"Un hombre inclinado sobre el río de chocolate, comiendo las nueces bañadas en chocolate.","clinica":"C. difficile se transmite por la ruta fecal-oral, específicamente a través de la ingestión de esporas bacterianas.","sketchy":"Comer las nueces (esporas) sacadas del chocolate (heces) es la representación literal de la transmisión fecal-oral.","literal":"C. difficile is transmitted via the fecal-oral route, specifically through ingestion of bacterial spores"},{"n":"7","nombre":"First-aid kit","ver":"Un botiquín blanco con cruz roja etiquetado \"FIRST AID\" sobre el bote.","clinica":"C. difficile es principalmente una infección nosocomial (adquirida en el hospital), aunque un número creciente de casos son adquiridos en la comunidad.","sketchy":"El botiquín representa el entorno sanitario/hospitalario donde se adquiere típicamente la infección.","literal":"C. difficile is primarily a nosocomial (hospital-acquired) infection (increasing # of cases are community acquired)"},{"n":"8","nombre":"\"Hand wash\"","ver":"Un lavamanos con espuma y un cartel que dice \"Hand Wash\" con grifos de agua fría y caliente.","clinica":"Las esporas de C. difficile son resistentes a los desinfectantes de manos a base de alcohol → hay que lavarse las manos con agua y jabón.","sketchy":"El lavamanos con agua y jabón, en lugar de un dispensador de gel, marca la diferencia clave: el alcohol no mata estas esporas.","literal":"C. difficile spores are resistant to alcohol-based hand sanitizers → wash hands with soap and water instead"},{"n":"9","nombre":"Gown and gloves","ver":"Un trabajador con bata y guantes puestos, junto al lavamanos.","clinica":"Para prevenir la transmisión de esporas, los casos de infección por C. difficile se colocan en precauciones de contacto (uso de bata no estéril y guantes mientras se está en la habitación del paciente).","sketchy":"La bata y los guantes representan directamente las precauciones de contacto.","literal":"To prevent transmission of spores, cases of C. difficile infection are placed on contact precautions (use of non-sterile gown and gloves while in patient room)"},{"n":"10","nombre":"Abx candy disrupting worker","ver":"Un gran envase de \"ABX Candy\" derramando cápsulas rosadas y azules que golpean y derriban a los trabajadores.","clinica":"La mayoría de las infecciones por C. difficile son precipitadas por exposición a antibióticos (alteran el microbioma intestinal al matar bacterias comensales → permiten que C. difficile crezca sin control).","sketchy":"Las cápsulas de antibiótico derribando a los trabajadores representan la destrucción de la flora comensal que normalmente mantiene a raya a C. difficile.","literal":"Most C. difficile infections are precipitated by exposure to antibiotics (disrupts the gut microbiome by killing commensal gut bacteria → allows C. difficile to grow unchecked)"},{"n":"11","nombre":"\"Keep CLEAN\"","ver":"Un cartel junto al lago que dice \"Candy Lake keep CLEAN\".","clinica":"Los antibióticos notorios por causar infección por C. difficile incluyen clindamicina, fluoroquinolonas, cefalosporinas y penicilinas.","sketchy":"\"CLEAN\" suena como el inicio de \"clindamycin\", siendo la clave mnemotécnica del primer antibiótico culpable.","literal":"Antibiotics notorious for causing C. difficile infection include clindamycin, fluoroquinolones, cephalosporins, and penicillins"},{"n":"12","nombre":"Flower","ver":"Una flor rosada grande creciendo junto al lago de dulces.","clinica":"Los antibióticos notorios por causar infección por C. difficile incluyen clindamicina, fluoroquinolonas, cefalosporinas y penicilinas.","sketchy":"La flor (\"flower\") es el símbolo fijo de las fluoroquinolonas en toda la serie.","literal":"Antibiotics notorious for causing C. difficile infection include clindamycin, fluoroquinolones, cephalosporins, and penicillins"},{"n":"13","nombre":"Cephalopod","ver":"Un calamar rosado (cefalópodo) saliendo del lago de dulces.","clinica":"Los antibióticos notorios por causar infección por C. difficile incluyen clindamicina, fluoroquinolonas, cefalosporinas y penicilinas.","sketchy":"\"Cephalopod\" es el símbolo fijo de las cefalosporinas, por el sonido compartido.","literal":"Antibiotics notorious for causing C. difficile infection include clindamycin, fluoroquinolones, cephalosporins, and penicillins"},{"n":"14","nombre":"Purple pencil","ver":"Un lápiz púrpura clavado junto al lago, cerca de la flor.","clinica":"Los antibióticos notorios por causar infección por C. difficile incluyen clindamicina, fluoroquinolonas, cefalosporinas y penicilinas.","sketchy":"\"Pencil\" es el símbolo fijo de las penicilinas, cerrando la lista de los cuatro antibióticos culpables.","literal":"Antibiotics notorious for causing C. difficile infection include clindamycin, fluoroquinolones, cephalosporins, and penicillins"},{"n":"15","nombre":"Prazole parasol","ver":"Una sombrilla/parasol morada abierta junto al lago.","clinica":"Los inhibidores de la bomba de protones (IBP) son un factor de riesgo para la infección por C. difficile (menor acidez gástrica → ↑ germinación de esporas hacia la forma vegetativa).","sketchy":"\"Parasol\" suena como \"-prazol\", la terminación de todos los IBP (omeprazol, pantoprazol).","literal":"Proton pump inhibitors (PPIs) are a risk factor for C. difficile infection (decreased stomach acidity → ↑ germination of spores into vegetative form)"},{"n":"16","nombre":"Toxin kid \"A\"","ver":"Un niño con sudadera verde y símbolo de riesgo biológico, el más pequeño de los dos.","clinica":"Las cepas toxigénicas de C. difficile producen toxina A (TcdA) y toxina B (TcdB, más virulenta).","sketchy":"El niño con el símbolo de riesgo biológico representa la toxina A; su menor tamaño anticipa que es la menos virulenta.","literal":"Toxigenic strains of C. difficile produce toxin A (TcdA) and toxin B (TcdB, more virulent)"},{"n":"17","nombre":"Larger toxin kid \"B\"","ver":"Un segundo niño con la misma sudadera verde de riesgo biológico, notablemente más grande.","clinica":"Las cepas toxigénicas de Clostridioides difficile producen toxina A (TcdA) y toxina B (TcdB, más virulenta).","sketchy":"El mayor tamaño de este niño representa directamente que la toxina B es la más virulenta de las dos.","literal":"Toxigenic strains of Clostridioides difficile produce toxin A (TcdA) and toxin B (TcdB, more virulent)"},{"n":"18","nombre":"Gummy bears","ver":"Ositos de goma (gummy bears) rosados siendo atacados por los dos niños tóxicos.","clinica":"Las toxinas A y B de C. difficile actúan sobre las células de la mucosa colónica.","sketchy":"Los ositos de goma representan las células de la mucosa del colon, blanco de ambas toxinas.","literal":"C. difficile toxins A & B act on colonic mucosal cells"},{"n":"19","nombre":"Destroying licorice skeleton","ver":"Uno de los niños destruyendo la estructura interna de regaliz de un osito de goma.","clinica":"Las toxinas A y B de C. difficile alteran el citoesqueleto (mediante inactivación de las proteínas Rho).","sketchy":"El \"esqueleto\" de regaliz destruido representa literalmente el citoesqueleto celular desarmado.","literal":"C. difficile toxins A & B disrupt the cytoskeleton (via inactivation of Rho proteins)"},{"n":"20","nombre":"Destruction of gummy junctions","ver":"Los ositos de goma siendo separados unos de otros, rompiendo las uniones que los mantenían pegados.","clinica":"Las toxinas A y B de C. difficile alteran las uniones estrechas intercelulares (mediante inactivación de las proteínas Rho) → ↑ permeabilidad paracelular.","sketchy":"La separación de los ositos representa la ruptura de las uniones estrechas entre células, que deja pasar líquido entre ellas.","literal":"C. difficile toxins A & B disrupt intercellular tight junctions (via inactivation of Rho proteins) → ↑ paracellular permeability"},{"n":"21","nombre":"Pseudomembrane wrapping","ver":"Un osito de goma grande envuelto en una película plástica amarillenta sobre una mesa.","clinica":"La infección por C. difficile causa clásicamente colitis pseudomembranosa (exudados amarillo-blanquecinos sobre la superficie de las células mucosas colónicas).","sketchy":"La envoltura amarillenta sobre la célula es la representación literal de la pseudomembrana.","literal":"C. difficile infection classically causes pseudomembranous colitis (yellow-white exudates on surface of colonic mucosal cells)"},{"n":"22","nombre":"Smelly chocolate waterfall","ver":"Una cascada de chocolate marrón cayendo con líneas de mal olor saliendo de ella.","clinica":"La infección por C. difficile típicamente se presenta con diarrea acuosa de alto volumen que tiene un olor fétido característico.","sketchy":"La cascada abundante representa el alto volumen, y las líneas de olor el característico olor fétido.","literal":"C. difficile infection typically presents with high-volume watery diarrhea that has a characteristic foul odor"},{"n":"23","nombre":"White birds","ver":"Varias aves blancas (malvaviscos con forma de pájaro) volando sobre las rocas.","clinica":"La infección por C. difficile también puede presentarse con leucocitosis y fiebre.","sketchy":"Las aves blancas representan los glóbulos blancos aumentados (leucocitosis).","literal":"C. difficile infection may also present with leukocytosis and fever"},{"n":"24","nombre":"Toasting mallow bird","ver":"Una de las aves de malvavisco siendo tostada sobre una fogata.","clinica":"La infección por C. difficile también puede presentarse con leucocitosis y fiebre.","sketchy":"El malvavisco tostándose sobre el fuego representa la fiebre que acompaña a la leucocitosis.","literal":"C. difficile infection may also present with leukocytosis and fever"},{"n":"25","nombre":"Giant colon pipe","ver":"Un tubo rosado enorme con forma de colon recorriendo la parte superior de la fábrica.","clinica":"La infección por C. difficile puede complicarse con megacolon tóxico.","sketchy":"El tamaño gigantesco del tubo-colon es la representación literal del megacolon tóxico.","literal":"C. difficile infection can be complicated by toxic megacolon"},{"n":"26","nombre":"Gnaats detecting toxin kid in chocolate","ver":"Un enjambre de mosquitos (gnats) detectando al niño tóxico escondido en el río de chocolate.","clinica":"El diagnóstico de infección por C. difficile se hace analizando heces para cepas productoras de toxina, usando NAAT (amplificación de ácidos nucleicos, usualmente PCR, que detecta los genes que codifican la toxina) o EIA.","sketchy":"\"Gnats\" suena como \"NAAT\", y el hecho de que detecten al niño-toxina en el chocolate (heces) representa la prueba en muestra fecal.","literal":"Diagnose C. difficile infection by testing stool for toxin-producing strains using NAAT (nucleic acid amplification, usually PCR, detects toxin-encoding genes) or EIA"},{"n":"27","nombre":"Antibody stick detecting toxin kid in chocolate","ver":"Un trabajador usando un palo con forma de anticuerpo para pescar al niño tóxico del río de chocolate.","clinica":"El diagnóstico de infección por C. difficile se hace analizando heces para cepas productoras de toxina, usando NAAT o EIA (inmunoensayo enzimático, que usa anticuerpos para detectar toxinas).","sketchy":"El palo con forma de anticuerpo representa directamente el EIA, que usa anticuerpos para atrapar la toxina.","literal":"Diagnose C. difficile infection by testing stool for toxin-producing strains using NAAT or EIA (enzyme immunoassay, uses antibodies to detect toxins)"},{"n":"28","nombre":"Gluten-free mystery box","ver":"Una caja amarilla con signos de interrogación que dice \"Gluten Free Candy ???\".","clinica":"El análisis de heces para glutamato deshidrogenasa mediante EIA detecta todas las cepas de C. difficile (no distingue toxigénicas de no toxigénicas).","sketchy":"\"Gluten\" suena como \"glutamato\" (deshidrogenasa), y los signos de interrogación representan que la prueba no dice si la cepa es toxigénica o no.","literal":"Stool testing for glutamate dehydrogenase via EIA detects all strains of C. difficile (does not distinguish toxigenic vs nontoxigenic)"},{"n":"29","nombre":"Van with tongue ramp","ver":"Una furgoneta (\"Candy Van\") con una rampa roja que sale como una lengua desde su interior.","clinica":"La vancomicina oral es la terapia de primera línea para la infección por Clostridioides difficile.","sketchy":"\"Van\" es el símbolo fijo de vancomicina, y la rampa en forma de lengua marca que se administra por vía oral.","literal":"Oral vancomycin is first-line therapy for Clostridioides difficile infection"},{"n":"30","nombre":"Fiddler","ver":"Un trabajador tocando un violín (fiddle) junto a la furgoneta.","clinica":"La fidaxomicina es efectiva para la infección por Clostridioides difficile.","sketchy":"\"Fiddler\" (violinista) suena como el inicio de \"fidaxomicin\", siendo la clave mnemotécnica del fármaco.","literal":"Fidaxomicin is effective for Clostridioides difficile infection"},{"n":"31","nombre":"Metro with ivy","ver":"Un vagón de metro cubierto de hiedra (ivy) atravesando la parte superior derecha.","clinica":"El metronidazol IV es efectivo contra la infección severa por Clostridioides difficile.","sketchy":"\"Metro\" es la clave de \"metronidazole\" e \"ivy\" suena como \"IV\", combinando fármaco y vía de administración en un solo elemento.","literal":"IV metronidazole is effective against severe Clostridioides difficile infection"},{"n":"32","nombre":"Bacterial plants in colon pipe","ver":"Plantas con forma de bacterias siendo sembradas dentro de una sección del tubo-colon.","clinica":"El trasplante de microbiota fecal se usa en casos de infección recurrente por Clostridioides difficile.","sketchy":"Sembrar plantas-bacteria dentro del colon representa literalmente el repoblamiento de la flora mediante trasplante fecal.","literal":"Fecal microbiota transplant is used in cases of recurrent Clostridioides difficile infection"}],"mapa":"imagenes/clostridioides-difficile-mapa.webp","texto":"imagenes/clostridioides-difficile-texto.webp"},{"slug":"clostridium-botulinum","titulo":"Clostridium botulinum","items":[{"n":"1","nombre":"Robots","ver":"Varios robots metálicos plateados en la escena de laboratorio.","clinica":"Clostridium botulinum (un bacilo gram-positivo).","sketchy":"Los robots, rígidos y de movimientos mecánicos, anclan el tema de la parálisis flácida y la rigidez del botulismo.","literal":"Clostridium botulinum (a gram-positive bacillus)"},{"n":"2","nombre":"Purple hues","ver":"Un fondo de tonos púrpura y violeta en toda la escena.","clinica":"Clostridium botulinum es un bacilo gram-positivo.","sketchy":"El color púrpura de fondo refuerza la tinción gram-positiva.","literal":"Clostridium botulinum is a gram-positive bacillus"},{"n":"3","nombre":"Tin can","ver":"Un robot con cuerpo en forma de lata de conserva (\"tin can\").","clinica":"Las condiciones anaeróbicas en alimentos enlatados de forma inadecuada pueden promover la germinación y crecimiento de esporas de Clostridium botulinum.","sketchy":"La lata de conserva es la representación literal directa del alimento enlatado como fuente de contaminación.","literal":"The anaerobic conditions in improperly canned food can promote the germination and growth of Clostridium botulinum spores"},{"n":"4","nombre":"Nuts","ver":"Tuercas metálicas (nuts) esparcidas por el suelo.","clinica":"Clostridium botulinum puede formar esporas metabólicamente inactivas, resistentes a diversos estreses ambientales, incluyendo calor, radiación y químicos.","sketchy":"Las tuercas son objetos duros y resistentes, aludiendo a las esporas resistentes; juega además con \"nuts\" (nueces), símbolo de esporas en toda la serie Clostridium.","literal":"Clostridium botulinum can form metabolically inactive spores, which are resistant to various environmental stresses, including heat, radiation, and chemicals"},{"n":"5","nombre":"Anaerobic gas mask","ver":"Una máscara de gas sostenida por uno de los robots.","clinica":"Clostridium botulinum es una bacteria obligadamente anaeróbica.","sketchy":"La máscara de gas representa el ambiente sin oxígeno necesario para la bacteria.","literal":"Clostridium botulinum is an obligately anaerobic bacterium"},{"n":"6","nombre":"Limp neck","ver":"Un robot con el cuello caído y flácido hacia un lado.","clinica":"El botulismo típicamente comienza con disfunción de nervios craneales, a menudo referida como \"síntomas bulbares\", y progresa a debilidad descendente simétrica que afecta tronco, extremidades y músculos lisos, culminando en parálisis flácida.","sketchy":"El cuello caído representa la debilidad muscular flácida que comienza en la región cervical y bulbar.","literal":"Botulism typically starts with cranial nerve dysfunction, often referred to as \"bulbar symptoms,\" and progresses to symmetrical descending weakness affecting the trunk, limbs, and smooth muscles, culminating in flaccid paralysis"},{"n":"7","nombre":"Droopy eyelids","ver":"Los párpados caídos de uno de los robots.","clinica":"El botulismo típicamente comienza con disfunción de nervios craneales, manifestándose como \"síntomas bulbares\" como ptosis (caída de los párpados) y diplopía (visión doble).","sketchy":"Los párpados caídos son la representación visual directa de la ptosis.","literal":"Botulism typically starts with cranial nerve dysfunction, manifesting as \"bulbar symptoms\" like ptosis (drooping of the eyelids) and diplopia (double vision)"},{"n":"8","nombre":"Cutting ACh current","ver":"Un robot cortando con tijeras un cable etiquetado \"ACh\" que lleva corriente eléctrica.","clinica":"La toxina botulínica es una proteasa que ataca las proteínas SNARE → inhibición de la liberación de acetilcolina desde las neuronas motoras presinápticas → parálisis flácida.","sketchy":"Cortar el cable de ACh representa literalmente cómo la toxina interrumpe la liberación de acetilcolina.","literal":"Botulinum toxin is a protease that targets SNARE proteins → inhibition of acetylcholine release from presynaptic motor neurons → flaccid paralysis"},{"n":"9","nombre":"Floppy baby robot","ver":"Un pequeño robot-bebé con el cuerpo completamente flácido, casi derritiéndose.","clinica":"El botulismo infantil, a menudo referido como \"síndrome del bebé flácido\", resulta de la ingestión de esporas que colonizan el tracto GI subdesarrollado de los infantes, llevando a producción de toxina; en contraste, los adultos usualmente contraen botulismo por consumo de toxina preformada.","sketchy":"El robot-bebé flácido es la representación directa del \"floppy baby syndrome\".","literal":"Infant botulism, often referred to as \"floppy baby syndrome,\" results from the ingestion of spores that colonize the underdeveloped GI tract of infants, leading to toxin production; in contrast, adults usually contract botulism from consuming preformed toxin"},{"n":"10","nombre":"Nuts in honey","ver":"Tuercas mezcladas dentro de un charco de sustancia dorada tipo miel.","clinica":"La miel puede contener esporas de Clostridium botulinum, por lo cual se recomienda evitar dar miel a infantes menores de 12 meses.","sketchy":"Las tuercas (esporas resistentes) mezcladas en la miel dorada representan directamente la contaminación de este alimento con esporas.","literal":"Honey can contain Clostridium botulinum spores, which is why it's recommended to avoid giving honey to infants younger than 12 months of age"}],"mapa":"imagenes/clostridium-botulinum-mapa.webp","texto":"imagenes/clostridium-botulinum-texto.webp"},{"slug":"clostridium-perfringens","titulo":"Clostridium perfringens","items":[{"n":"1","nombre":"Private Ringen","ver":"Un soldado recostado en el suelo, vestido con uniforme militar de época.","clinica":"Clostridium perfringens (un bacilo gram-positivo).","sketchy":"\"Ringen\" suena fonéticamente parecido a \"perfringens\", siendo el apellido del soldado la clave mnemotécnica.","literal":"Clostridium perfringens (a gram-positive bacillus)"},{"n":"2","nombre":"Purple hues","ver":"Tonos púrpura en las pinzas de ropa y elementos de la escena.","clinica":"Clostridium perfringens es un bacilo gram-positivo.","sketchy":"El color púrpura refuerza la tinción gram-positiva.","literal":"Clostridium perfringens is a gram-positive bacillus"},{"n":"3","nombre":"Wounded soldier","ver":"El soldado con heridas visibles en el uniforme, sentado en el suelo.","clinica":"Las infecciones por Clostridium perfringens pueden ocurrir en varios tipos de heridas, especialmente aquellas contaminadas con tierra o materia fecal; históricamente se han asociado con heridas sufridas en entornos de combate militar.","sketchy":"El soldado herido, en ambiente militar, representa directamente el escenario clásico de contaminación de heridas.","literal":"Clostridium perfringens infections can occur in various wound types, especially those contaminated with soil or fecal matter; they have historically been associated with wounds sustained in military combat settings"},{"n":"4","nombre":"Spored walnuts","ver":"Nueces (walnuts) esparcidas por el suelo cerca del soldado.","clinica":"Clostridium perfringens puede formar esporas metabólicamente inactivas, resistentes a diversos estreses ambientales, incluyendo calor, radiación y químicos.","sketchy":"Las nueces con su cáscara dura representan visualmente las esporas resistentes.","literal":"Clostridium perfringens can form metabolically inactive spores, which are resistant to various environmental stresses, including heat, radiation, and chemicals"},{"n":"5","nombre":"Soil","ver":"Barriles derramando tierra y polvo por el suelo de la escena.","clinica":"Las esporas de Clostridium perfringens se encuentran en el suelo, persistiendo debido a su resistencia al calor, radiación, desecación y desinfectantes.","sketchy":"La tierra derramada representa el reservorio ambiental principal de las esporas.","literal":"The spores of Clostridium perfringens are found in soil, persisting due to resistance to heat, radiation, desiccation, and disinfectants"},{"n":"6","nombre":"Anaerobic gas mask","ver":"Una máscara de gas tirada en el suelo cerca del soldado.","clinica":"Clostridium perfringens se clasifica como anaerobio obligado o anaerobio aerotolerante.","sketchy":"La máscara de gas representa el ambiente sin oxígeno necesario o tolerado por la bacteria.","literal":"Clostridium perfringens is classified as either an obligate anaerobe or aerotolerant anaerobe"},{"n":"7","nombre":"Gas vapor","ver":"Una nube de vapor gris en el centro de la escena.","clinica":"Las infecciones por Clostridium perfringens pueden llevar a condiciones necrotizantes de piel y tejidos blandos, potencialmente progresando a gangrena gaseosa (mionecrosis).","sketchy":"El vapor/gas visible es la representación literal de la \"gangrena gaseosa\".","literal":"Infections by Clostridium perfringens can lead to necrotizing skin and soft tissue conditions, potentially progressing to gas gangrene (myonecrosis)"},{"n":"8","nombre":"Alpha flag + phospholipid clothespins","ver":"Una bandera con el símbolo \"α\" (alfa) y pinzas de ropa colgadas de cables.","clinica":"La toxina alfa de Clostridium perfringens es una lecitinasa que ataca y cliva fosfolípidos de lecitina en las membranas celulares → hemólisis de glóbulos rojos → falla en el suministro de oxígeno a los tejidos.","sketchy":"La bandera alfa marca la toxina alfa, y las pinzas colgantes representan los fosfolípidos de la membrana, objetivo de la lecitinasa.","literal":"The alpha toxin of Clostridium perfringens is a lecithinase that targets and cleaves lecithin phospholipids in cell membranes → RBC hemolysis → failure to supply oxygen to tissues"},{"n":"9","nombre":"Lysed tomatoes","ver":"Tomates aplastados y reventados esparcidos por el suelo.","clinica":"La toxina alfa de Clostridium perfringens es una lecitinasa que ataca y cliva fosfolípidos de lecitina en las membranas celulares → hemólisis de glóbulos rojos → falla en el suministro de oxígeno a los tejidos.","sketchy":"Los tomates reventados, de color rojo como los glóbulos rojos, representan visualmente la hemólisis de los eritrocitos.","literal":"The alpha toxin of Clostridium perfringens is a lecithinase that targets and cleaves lecithin phospholipids in cell membranes → RBC hemolysis → failure to supply oxygen to tissues"},{"n":"10","nombre":"\"DOUBLE fine zone\"","ver":"Un cartel rojo que dice \"DOUBLE FINE ZONE\" junto al puesto de tomates.","clinica":"Clostridium perfringens muestra una zona doble distintiva de hemólisis en placas de agar sangre, debido a la actividad hemolítica de sus toxinas alfa y theta (hemólisis completa de la zona interna por toxina theta y hemólisis incompleta de la zona externa por toxina alfa).","sketchy":"La palabra \"DOUBLE\" en el cartel es la clave mnemotécnica directa para la doble zona de hemólisis.","literal":"Clostridium perfringens displays a distinctive double zone of hemolysis on blood agar plates due to the hemolytic activity of both its alpha and theta toxins (complete hemolysis of inner zone due to theta toxin and incomplete hemolysis of outer zone due to alpha toxin)"},{"n":"11","nombre":"Purple pencil","ver":"Un lápiz púrpura que sostiene la vendedora del puesto de tomates.","clinica":"El manejo efectivo de infecciones de tejidos causadas por Clostridium perfringens involucra desbridamiento quirúrgico junto con terapia antimicrobiana, siendo la penicilina G una elección comúnmente preferida.","sketchy":"\"Pencil\" suena fonéticamente similar al inicio de \"penicillin\", vinculando el objeto con el fármaco de elección.","literal":"Effective management of tissue infections caused by Clostridium perfringens involves surgical debridement coupled with antimicrobial therapy, with penicillin G being a commonly preferred choice"},{"n":"12","nombre":"\"Slow\" sign in muddy water","ver":"Un cartel amarillo con la palabra \"SLOW\" apoyado sobre un charco de agua fangosa.","clinica":"Clostridium perfringens puede causar intoxicación alimentaria, asociada principalmente con la ingestión de su toxina preformada en alimentos mal cocidos o almacenados, llevando a síntomas como diarrea acuosa; los síntomas usualmente se presentan lentamente, dentro de 2-12 horas.","sketchy":"La palabra \"SLOW\" representa directamente el inicio lento de los síntomas de intoxicación alimentaria.","literal":"Clostridium perfringens can cause food poisoning primarily associated with ingestion of its preformed toxin in improperly cooked or stored foods, leading to symptoms like watery diarrhea; symptoms usually present slowly, within 2-12 hours"}],"mapa":"imagenes/clostridium-perfringens-mapa.webp","texto":"imagenes/clostridium-perfringens-texto.webp"},{"slug":"clostridium-tetani","titulo":"Clostridium tetani","items":[{"n":"1","nombre":"Monkey testing lab","ver":"Un laboratorio de pruebas con monos (\"G&G Labs\") rodeado de jaulas.","clinica":"Clostridium tetani (un bacilo gram-positivo).","sketchy":"El laboratorio con monos es el escenario base donde se desarrollan todos los elementos del tétanos.","literal":"Clostridium tetani (a gram-positive bacillus)"},{"n":"2","nombre":"Purple hues","ver":"Tonos púrpura en el letrero \"G&G Labs\" y en los guantes de los personajes.","clinica":"Clostridium tetani es un bacilo gram-positivo.","sketchy":"El color púrpura refuerza la tinción gram-positiva.","literal":"Clostridium tetani is a gram-positive bacillus"},{"n":"3","nombre":"Anaerobic gas mask","ver":"Una máscara de gas puesta en el investigador principal de la escena.","clinica":"Clostridium tetani es una bacteria obligadamente anaeróbica.","sketchy":"La máscara de gas representa el ambiente sin oxígeno necesario para la bacteria.","literal":"Clostridium tetani is an obligately anaerobic bacterium"},{"n":"4","nombre":"Spored walnuts","ver":"Nueces esparcidas por el suelo del laboratorio.","clinica":"Clostridium tetani puede formar esporas metabólicamente inactivas, resistentes a diversos estreses ambientales, incluyendo calor, radiación y químicos.","sketchy":"Las nueces, con su cáscara dura, representan visualmente las esporas resistentes, igual que en el resto de la familia Clostridium.","literal":"Clostridium tetani can form metabolically inactive spores, which are resistant to various environmental stresses, including heat, radiation, and chemicals"},{"n":"5","nombre":"Barbed wire","ver":"Alambre de púas rodeando la parte superior de las jaulas.","clinica":"La infección por Clostridium tetani está clásicamente asociada con heridas punzantes por clavos oxidados y alambre de púas.","sketchy":"El alambre de púas es la representación literal directa de la fuente clásica de la herida punzante.","literal":"Clostridium tetani infection is classically associated with puncture wounds from rusty nails and barbed wire"},{"n":"6","nombre":"Rusty nails","ver":"Un clavo oxidado visible en el suelo del laboratorio.","clinica":"La infección por Clostridium tetani está clásicamente asociada con heridas punzantes por clavos oxidados y alambre de púas.","sketchy":"El clavo oxidado complementa al alambre de púas como segunda fuente clásica de herida punzante.","literal":"Clostridium tetani infection is classically associated with puncture wounds from rusty nails and barbed wire"},{"n":"7","nombre":"Soil","ver":"Macetas de tierra apiladas en la esquina del laboratorio.","clinica":"Las esporas de Clostridium tetani están ampliamente distribuidas en el suelo.","sketchy":"Las macetas de tierra representan el reservorio ambiental de las esporas.","literal":"Clostridium tetani spores are widely distributed in soil"},{"n":"8","nombre":"Evil grin","ver":"Un mono grande con una sonrisa exagerada y forzada de dientes apretados.","clinica":"Las manifestaciones clínicas clásicas del tétanos incluyen trismus, una parálisis espástica de los músculos de la mandíbula (trismo), y risus sardonicus, una contracción sostenida de los músculos faciales que resulta en apariencia de \"sonrisa malévola\".","sketchy":"La sonrisa forzada y siniestra del mono es la representación directa del \"risus sardonicus\".","literal":"The classic clinical manifestations of tetanus include trismus, a spastic paralysis of the jaw muscles (lockjaw), and risus sardonicus, a sustained contraction of the facial muscles that results in an \"evil smile\" appearance"},{"n":"9","nombre":"Arched back","ver":"Un mono con la espalda arqueada hacia atrás de forma exagerada.","clinica":"Las contracciones espasmódicas en el tétanos pueden involucrar cuello y espalda, llevando a opistótonos, caracterizado por arqueo hacia atrás de cabeza, cuello y columna.","sketchy":"La espalda arqueada representa directamente el opistótonos.","literal":"Spasmodic contractions in tetanus can involve the neck and back, leading to opisthotonos, characterized by backward arching of the head, neck, and spine"},{"n":"10","nombre":"Retrograde pulley","ver":"Una polea por la que un mono trepa hacia atrás, en reversa.","clinica":"La toxina tetánica, tetanospasmina, es transportada de forma retrógrada a lo largo de los axones hacia la médula espinal y el tronco encefálico.","sketchy":"La polea \"retrógrada\" representa el transporte axonal retrógrado de la toxina.","literal":"The tetanus toxin, tetanospasmin, is transported retrogradely along axons to the spinal cord and the brainstem"},{"n":"11","nombre":"Cutting SNARE trap","ver":"Unas tijeras cortando una trampa/red púrpura colgante (SNARE trap).","clinica":"La tetanospasmina funciona como una proteasa que ataca las proteínas SNARE, esenciales para la fusión de vesículas sinápticas con la membrana neuronal y la liberación de neurotransmisores.","sketchy":"Cortar la trampa (SNARE trap) representa literalmente cómo la toxina cliva las proteínas SNARE.","literal":"Tetanospasmin functions as a protease that targets SNARE proteins, which are essential for the fusion of synaptic vesicles with the neuronal membrane and neurotransmitter release"},{"n":"12","nombre":"Trapped \"G&G\" researcher","ver":"Un investigador con máscara de gas atrapado dentro de una jaula esférica con las letras \"G&G\".","clinica":"La tetanospasmina cliva proteínas SNARE en las células de Renshaw (interneuronas inhibitorias en la médula espinal) → reducción de liberación de GABA y glicina (neurotransmisores inhibitorios) → espasmos musculares, parálisis espástica e hiperreflexia.","sketchy":"\"G&G\" representa GABA y Glicina, y estar atrapado simboliza su liberación bloqueada.","literal":"Tetanospasmin cleaves SNARE proteins in Renshaw cells (inhibitory interneurons in the spinal cord) → reduced release of GABA and glycine (inhibitory neurotransmitters) → muscle spasms, spastic paralysis, and hyperreflexia"},{"n":"13","nombre":"Wrench and saw","ver":"Un mono sosteniendo una llave inglesa (wrench) y una sierra (saw).","clinica":"La tetanospasmina cliva proteínas SNARE en las células de Renshaw (interneuronas inhibitorias en la médula espinal) → reducción de liberación de GABA y glicina → espasmos musculares, parálisis espástica e hiperreflexia.","sketchy":"\"Wrench and saw\" (llave y sierra) suena como \"Renshaw\", siendo la clave mnemotécnica de las células de Renshaw.","literal":"Tetanospasmin cleaves SNARE proteins in Renshaw cells (inhibitory interneurons in the spinal cord) → reduced release of GABA and glycine (inhibitory neurotransmitters) → muscle spasms, spastic paralysis, and hyperreflexia"},{"n":"14","nombre":"Orange toxoid syringe","ver":"Una jeringa de color naranja sostenida por el investigador con la mano enguantada.","clinica":"La prevención del tétanos involucra la administración de la vacuna antitetánica, compuesta de una forma inactivada de la toxina tetánica; esta vacuna a menudo se co-administra con toxoide diftérico y vacuna acelular contra pertussis como DTaP para infantes y niños pequeños, y Tdap para niños mayores y adultos.","sketchy":"La jeringa representa directamente la administración de la vacuna (toxoide inactivado).","literal":"Tetanus prevention involves the administration of the tetanus vaccine, which is composed of an inactivated form of the tetanus toxin; this vaccine is often co-administered with diphtheria toxoid and acellular pertussis vaccine as DTaP for infants and young children and Tdap for older children and adults"}],"mapa":"imagenes/clostridium-tetani-mapa.webp","texto":"imagenes/clostridium-tetani-texto.webp"},{"slug":"corynebacterium-diphtheriae","titulo":"Corynebacterium diphtheriae","items":[{"n":"1","nombre":"Bull","ver":"Un toro marrón en el centro de una plaza de toros, enfrentando al torero.","clinica":"Corynebacterium diphtheriae (un bacilo gram-positivo).","sketchy":"El toro es el personaje ancla de toda la escena y prepara el signo clásico del \"cuello de toro\" (bull neck) de la difteria.","literal":"Corynebacterium diphtheriae (a gram-positive bacillus)"},{"n":"2","nombre":"Purple hues","ver":"Tonos púrpura en las gradas y estructuras de la plaza de toros.","clinica":"Corynebacterium diphtheriae es un bacilo gram-positivo.","sketchy":"El color púrpura refuerza la tinción gram-positiva.","literal":"Corynebacterium diphtheriae is a gram-positive bacillus"},{"n":"3","nombre":"V + Y design on maracas","ver":"Maracas con diseños en forma de \"V\" e \"Y\" sostenidas por los espectadores.","clinica":"Corynebacterium diphtheriae típicamente forma una forma de garrote (club shape) en cadenas con forma de V o Y, debido a su división por chasquido (snapping division) única durante la replicación celular.","sketchy":"La forma de la maraca representa el \"club shape\" (garrote), y los diseños \"V\" e \"Y\" son la clave literal de la disposición en cadenas.","literal":"Corynebacterium diphtheriae typically forms a club shape in a V- or Y-shaped chains due to its unique snapping division during cellular replication"},{"n":"4","nombre":"Red and blue maracas","ver":"Maracas pintadas de rojo y azul sostenidas por el hombre del sombrero.","clinica":"El citoplasma de Corynebacterium diphtheriae contiene gránulos metacromáticos que demuestran un patrón de tinción característico con colorantes de anilina: los gránulos aparecen rojos, mientras que el resto del bacilo se tiñe de azul.","sketchy":"La combinación de rojo y azul en la misma maraca representa literalmente el patrón bicolor de los gránulos metacromáticos.","literal":"The cytoplasm of Corynebacterium diphtheriae contains metachromatic granules that demonstrate a characteristic staining pattern with aniline dyes: the granules appear red, while the remainder of the bacillus stains blue"},{"n":"5","nombre":"Bowtie + elongated accordion","ver":"Un hombre tocando un acordeón estirado, con una corbata de moño (bowtie) verde.","clinica":"La toxina diftérica producida por Corynebacterium diphtheriae emplea un mecanismo de ribosilación de ADP para inhibir el factor de elongación 2 (EF-2), inhibiendo la síntesis proteica; este mecanismo es compartido por la exotoxina A producida por Pseudomonas aeruginosa.","sketchy":"El acordeón \"elongado\" (estirado) representa el factor de elongación 2 (EF-2), y el bowtie alude a la ribosilación de ADP.","literal":"The diphtheria toxin produced by Corynebacterium diphtheriae employs a mechanism of ADP ribosylation to inhibit elongation factor-2 (EF-2), inhibiting protein synthesis; this mechanism is shared by exotoxin A produced by Pseudomonas aeruginosa"},{"n":"6","nombre":"Grey cotton candy + plastic wrap","ver":"Algodones de azúcar de color gris envueltos en plástico, sostenidos por los espectadores.","clinica":"La exposición a la toxina diftérica lleva a necrosis celular y a la formación de una pseudomembrana densa y gris sobre las amígdalas y el área faríngea.","sketchy":"El algodón de azúcar gris y denso, envuelto en plástico, es la representación visual literal de la pseudomembrana gris característica.","literal":"Exposure to the diphtheria toxin leads to cell necrosis and the formation of a dense, grey pseudomembrane over the tonsils and pharyngeal area"},{"n":"7","nombre":"Bull's neck","ver":"El cuello grueso e hinchado del toro en el centro de la plaza.","clinica":"La difteria laríngea severa puede resultar en edema cervical y linfadenopatía cervical, dando lugar a la característica apariencia de \"cuello de toro\" (bull neck).","sketchy":"El cuello grueso del toro es la representación literal directa del signo \"bull neck\".","literal":"Severe laryngeal diphtheria can result in cervical edema and cervical lymphadenopathy, giving rise to the characteristic \"bull neck\" appearance"},{"n":"8","nombre":"Water droplets","ver":"Gotitas de agua/vapor saliendo del toro y flotando en el aire de la plaza.","clinica":"Corynebacterium diphtheriae se transmite principalmente vía gotitas respiratorias.","sketchy":"Las gotitas suspendidas representan directamente la transmisión por gotitas respiratorias.","literal":"Corynebacterium diphtheriae is primarily transmitted via respiratory droplets"},{"n":"9","nombre":"Heart cape","ver":"Una capa rosada con forma de corazón que sostiene el torero frente al toro.","clinica":"La absorción sistémica de la toxina diftérica puede resultar en toxicidad cardíaca significativa, manifestándose más comúnmente como miocarditis y arritmias.","sketchy":"La capa con forma de corazón representa directamente la afectación cardíaca (miocarditis).","literal":"Systemic absorption of the diphtheria toxin can result in significant cardiac toxicity, most commonly manifesting as myocarditis and arrhythmias"},{"n":"10","nombre":"Myelin sausages + back of throat","ver":"Un hombre comiendo una brocheta de salchichas, con la boca abierta mostrando el fondo de la garganta.","clinica":"La toxina diftérica puede inducir daño nervioso, llevando a desmielinización y a una parálisis que generalmente comienza en la pared faríngea posterior y el paladar blando.","sketchy":"Las salchichas encadenadas representan la vaina de mielina (segmentos), y el fondo de la garganta señala dónde comienza la parálisis.","literal":"The diphtheria toxin can induce nerve damage, leading to demyelination and a paralysis that generally begins in the posterior pharyngeal wall and soft palate"},{"n":"11","nombre":"Black \"TELE\"","ver":"Una pantalla grande con la palabra \"TELE\" en letras negras sobre el marco.","clinica":"El agar telurito es un medio selectivo que permite el crecimiento de Corynebacterium diphtheriae, la cual forma colonias grises/negras debido a la reducción del telurito.","sketchy":"\"TELE\" es la clave mnemotécnica directa para \"tellurite agar\", y el color negro de las letras representa las colonias negras que forma.","literal":"Tellurite agar is a selective medium that allows the growth of Corynebacterium diphtheriae, which forms gray/black colonies due to the reduction of tellurite"},{"n":"12","nombre":"Laughing","ver":"Un niño riéndose a carcajadas en las gradas mientras señala hacia la arena.","clinica":"Corynebacterium diphtheriae puede cultivarse en medio de Loeffler, que se usa principalmente para realzar las características morfológicas de la bacteria, facilitando su identificación.","sketchy":"\"Laughing\" (riendo) suena fonéticamente similar a \"Loeffler\", siendo la risa del niño la clave mnemotécnica del medio de cultivo.","literal":"Corynebacterium diphtheriae can be cultivated on Loeffler's medium, which is used primarily to enhance the bacterium's morphological features, facilitating easier identification"},{"n":"13","nombre":"Tongue lick","ver":"El toro sacando la lengua roja y lamiéndose el hocico.","clinica":"La prueba ELEK se utiliza para diferenciar cepas toxigénicas de no toxigénicas de Corynebacterium diphtheriae.","sketchy":"El gesto de lamer (\"lick\") suena fonéticamente como \"ELEK\", siendo la clave mnemotécnica de la prueba diagnóstica.","literal":"The ELEK test is utilized to differentiate toxigenic from non-toxigenic strains of Corynebacterium diphtheriae"},{"n":"14","nombre":"Toxoid syringes","ver":"Jeringas verdes clavadas en el cuerpo del toro y sostenidas en la escena.","clinica":"La vacuna contra Corynebacterium diphtheriae consiste en una forma inactivada de la exotoxina diftérica y a menudo se administra en combinación con el toxoide tetánico y la vacuna acelular contra pertussis (las vacunas DTaP, DT, Tdap y Td proveen distintos niveles de protección contra difteria, tétanos y pertussis, adaptándose a diferentes grupos de edad y necesidades médicas).","sketchy":"Las jeringas representan directamente la vacunación con el toxoide diftérico inactivado.","literal":"The vaccine against Corynebacterium diphtheriae consists of an inactivated form of the diphtheria exotoxin and is often given in combination with the tetanus toxoid and acellular pertussis vaccine (DTaP, DT, Tdap, and Td vaccines provide varying levels of protection against diphtheria, tetanus, and pertussis, catering to different age groups and medical needs)"}],"mapa":"imagenes/corynebacterium-diphtheriae-mapa.webp","texto":"imagenes/corynebacterium-diphtheriae-texto.webp"},{"slug":"enterococcus-faecium-faecalis","titulo":"Enterococcus faecium & faecalis","items":[{"n":"1","nombre":"\"Caucus\"","ver":"Un letrero grande en el edificio de gobierno que dice \"CALIFORNIA CAUCUS\".","clinica":"Enterococcus spp. (cocos gram-positivos).","sketchy":"\"Caucus\" suena fonéticamente similar al final de \"Enterococcus\", siendo el evento político la clave mnemotécnica base de toda la escena.","literal":"Enterococcus spp. (gram-positive cocci)"},{"n":"2","nombre":"Purple hues","ver":"Tonos púrpura predominantes en la fachada del edificio.","clinica":"Las bacterias Enterococcus faecium y Enterococcus faecalis son gram-positivas.","sketchy":"El color púrpura del edificio refuerza la tinción gram-positiva.","literal":"Enterococcus faecium and Enterococcus faecalis bacteria are gram-positive"},{"n":"3","nombre":"\"Resist the 6.5% N.Ca\"","ver":"Un cartel de protesta que dice \"RESIST THE 6.5% N.CA\".","clinica":"Enterococcus faecium y Enterococcus faecalis pueden crecer en salino hipertónico al 6.5%, distinguiéndolos de la mayoría de los otros cocos gram-positivos.","sketchy":"\"6.5% N.Ca\" es la clave mnemotécnica literal: \"6.5%\" es la concentración de sal y \"N.Ca\" (NaCl) representa el salino hipertónico.","literal":"Enterococcus faecium and Enterococcus faecalis can grow in 6.5% hypertonic saline, distinguishing them from most other gram-positive cocci"},{"n":"4","nombre":"Green bile boots","ver":"Botas de color verde que lleva puestas el manifestante en primer plano.","clinica":"Enterococcus faecium y Enterococcus faecalis pueden hidrolizar esculina en presencia de bilis (es decir, son resistentes a la bilis), distinguiéndolos de la mayoría de los otros cocos gram-positivos.","sketchy":"El color verde de las botas evoca la bilis, y el hecho de llevarlas puestas sin problema representa la resistencia a la bilis.","literal":"Enterococcus faecium and Enterococcus faecalis can hydrolyze esculin in the presence of bile (i.e. bile-resistant), distinguishing them from most other gram-positive cocci"},{"n":"5","nombre":"\"Stop the FEES\" + less people","ver":"Un cartel que dice \"STOP THE FEES\" sostenido por un grupo más pequeño de manifestantes a la izquierda.","clinica":"Enterococcus faecium típicamente representa la minoría de las infecciones enterocócicas.","sketchy":"\"FEES\" suena fonéticamente como el inicio de \"faecium\", y el grupo más pequeño de manifestantes representa que es la especie minoritaria en infecciones.","literal":"Enterococcus faecium typically accounts for the minority of enterococcal infections"},{"n":"6","nombre":"\"CALIfornia caucus\" + more people","ver":"El grupo más grande y numeroso de manifestantes frente al edificio, bajo el letrero \"California Caucus\".","clinica":"Enterococcus faecalis es típicamente responsable de la mayoría de las infecciones enterocócicas.","sketchy":"\"CALI\" suena fonéticamente como el final de \"faecalis\", y el grupo más numeroso representa que es la especie mayoritaria en infecciones.","literal":"Enterococcus faecalis is typically responsible for the majority of enterococcal infections"},{"n":"7","nombre":"\"Do U ♥ trees?\"","ver":"Una pancarta que dice \"DO U ♥ TREES?\" con un corazón y un árbol dibujados.","clinica":"Las infecciones atribuidas a Enterococcus faecium y Enterococcus faecalis abarcan un rango de condiciones, como ITU (cistitis, pielonefritis), endocarditis e infecciones del árbol biliar.","sketchy":"El corazón representa la endocarditis y el árbol representa el \"árbol biliar\" (biliary tree), combinando dos infecciones clave en un solo cartel.","literal":"Infections attributed to Enterococcus faecium and Enterococcus faecalis encompass a range of conditions, such as UTIs (cystitis, pyelonephritis), endocarditis, and biliary tree infections"},{"n":"8","nombre":"Resisting entering van","ver":"Un manifestante resistiéndose físicamente, pateando, mientras es llevado hacia una camioneta policial.","clinica":"Algunas cepas de Enterococcus faecium y Enterococcus faecalis han desarrollado resistencia a numerosos antibióticos, siendo el enterococo resistente a vancomicina (VRE) particularmente significativo.","sketchy":"Resistirse a entrar en el vehículo (\"van\" = vancomicina) representa literalmente la resistencia bacteriana a la vancomicina.","literal":"Some strains of Enterococcus faecium and Enterococcus faecalis have evolved resistance to numerous antibiotics, with vancomycin-resistant enterococci (VRE) being particularly significant"},{"n":"9","nombre":"Police line","ver":"Cinta amarilla de \"POLICE LINE\" delimitando la escena.","clinica":"Para las infecciones enterocócicas resistentes a vancomicina (VRE), el linezolid es una opción de tratamiento efectiva.","sketchy":"La \"línea\" policial (\"line\" = linezolid) que contiene a los manifestantes resistentes representa cómo el linezolid logra contener a las bacterias VRE.","literal":"For vancomycin-resistant enterococcal (VRE) infections, linezolid serves as an effective treatment option"},{"n":"10","nombre":"Tiger stripes","ver":"Una barrera con rayas de tigre (naranja y negro) en primer plano.","clinica":"La tigeciclina posee actividad contra algunas cepas de VRE y podría considerarse como una opción de tratamiento en escenarios clínicos específicos.","sketchy":"Las rayas de tigre son la clave mnemotécnica directa para \"tigecycline\" (tigeciclina).","literal":"Tigecycline possesses activity against some VRE strains and might be considered as a treatment option in specific clinical scenarios"}],"mapa":"imagenes/enterococcus-faecium-faecalis-mapa.webp","texto":"imagenes/enterococcus-faecium-faecalis-texto.webp"},{"slug":"listeria-monocytogenes","titulo":"Listeria monocytogenes","items":[{"n":"1","nombre":"Santa's list","ver":"Un pergamino/lista larga que sostiene Santa Claus.","clinica":"Listeria monocytogenes (un bacilo gram-positivo).","sketchy":"\"List\" (lista) suena fonéticamente como el inicio de \"Listeria\", siendo la lista de Santa la clave mnemotécnica principal.","literal":"Listeria monocytogenes (a gram-positive bacillus)"},{"n":"2","nombre":"Purple rod-shaped ornaments","ver":"Adornos púrpura con forma de bastón colgando del árbol de Navidad.","clinica":"Listeria monocytogenes es un bacilo gram-positivo.","sketchy":"La forma de bastón de los adornos representa la morfología de bacilo, y su color púrpura refuerza la tinción gram-positiva.","literal":"Listeria monocytogenes is a gram-positive bacillus"},{"n":"3","nombre":"Beta light bulb","ver":"Una bombilla roja brillante en la punta del árbol de Navidad.","clinica":"Listeria monocytogenes es beta-hemolítica, pero a menudo produce zonas de hemólisis muy estrechas en agar sangre.","sketchy":"El brillo de la bombilla representa la beta-hemólisis, y su tamaño pequeño alude a las zonas estrechas de hemólisis.","literal":"Listeria monocytogenes is beta-hemolytic, but often produce very narrow zones of hemolysis on blood agar"},{"n":"4","nombre":"Tumbling ornaments","ver":"Adornos cayendo y rodando del árbol hacia el suelo.","clinica":"En cultivos de caldo, Listeria monocytogenes exhibe una motilidad distintiva \"en volteretas\" (tumbling motility).","sketchy":"Los adornos cayendo y rodando son la representación visual literal de la motilidad tipo \"tumbling\".","literal":"In broth cultures, Listeria monocytogenes exhibits a distinctive tumbling motility"},{"n":"5","nombre":"Rocket","ver":"Un cohete/juguete espacial tirado en el suelo cerca del bebé.","clinica":"Listeria monocytogenes puede formar \"colas de cohete\" (rocket tails) de actina dentro de las células huésped, facilitando el movimiento intracelular y la propagación célula a célula.","sketchy":"El cohete es la representación literal directa de las \"colas de cohete\" de actina.","literal":"Listeria monocytogenes can form actin \"rocket tails\" in host cells, facilitating intracellular movement and cell-to-cell spread"},{"n":"6","nombre":"Rocket in bag","ver":"Un objeto en forma de cohete asomando desde la bolsa roja de regalos de Santa.","clinica":"Listeria monocytogenes es un patógeno intracelular facultativo, capaz de vivir tanto dentro como fuera de las células huésped.","sketchy":"El cohete \"dentro de la bolsa\" (dentro/fuera) representa la capacidad facultativa de estar dentro o fuera de la célula.","literal":"Listeria monocytogenes is a facultative intracellular pathogen, capable of living both inside and outside host cells"},{"n":"7","nombre":"Catalase cat","ver":"Un gato gris sentado cerca de la mesa, junto a Santa.","clinica":"Listeria monocytogenes produce catalasa (es decir, catalasa positivo), una enzima que convierte el peróxido de hidrógeno en agua y oxígeno.","sketchy":"\"Cat\" suena como el inicio de \"catalase\", símbolo recurrente en varias bacterias de esta serie.","literal":"Listeria monocytogenes produces catalase (i.e. catalase positive), an enzyme that converts hydrogen peroxide into water and oxygen"},{"n":"8","nombre":"Icicles","ver":"Carámbanos de hielo colgando en la ventana, detrás del árbol.","clinica":"Listeria monocytogenes puede sobrevivir y multiplicarse a temperaturas frías, contribuyendo a su supervivencia y propagación en alimentos refrigerados.","sketchy":"Los carámbanos representan directamente el frío y la refrigeración donde la bacteria sobrevive, similar al símbolo usado en Yersinia enterocolitica.","literal":"Listeria monocytogenes can survive and multiply in cold temperatures, contributing to its survival and spread in refrigerated foods"},{"n":"9","nombre":"Milk","ver":"Un vaso de leche sobre la mesa a la derecha.","clinica":"Los brotes de listeriosis se han asociado frecuentemente con el consumo de productos lácteos como leche, quesos blandos y helado.","sketchy":"El vaso de leche representa directamente uno de los alimentos clásicos asociados a la transmisión.","literal":"Outbreaks of listeriosis have been frequently associated with consumption of dairy products such as milk, soft cheeses, and ice cream"},{"n":"10","nombre":"Soft cheese","ver":"Un queso blando junto con galletas sobre la mesa.","clinica":"Los brotes de listeriosis se han asociado frecuentemente con el consumo de productos lácteos como leche, quesos blandos y helado.","sketchy":"El queso blando complementa a la leche como segundo alimento clásico de transmisión.","literal":"Outbreaks of listeriosis have been frequently associated with consumption of dairy products such as milk, soft cheeses, and ice cream"},{"n":"11","nombre":"Pregnant woman","ver":"Una mujer embarazada de pie a la izquierda de la escena.","clinica":"Las mujeres embarazadas son significativamente más susceptibles a la listeriosis en comparación con la población general, debido a cambios inmunológicos durante el embarazo.","sketchy":"La mujer embarazada representa directamente el grupo de mayor riesgo para esta infección.","literal":"Pregnant women are significantly more susceptible to listeriosis compared to the general population due to immunological changes during pregnancy"},{"n":"12","nombre":"Baby in meningitis helmet","ver":"Un bebé sentado en el suelo con un gorro/casco protector en la cabeza.","clinica":"Listeria monocytogenes es una causa significativa de meningitis neonatal.","sketchy":"El casco en la cabeza del bebé representa directamente la meningitis neonatal.","literal":"Listeria monocytogenes is a significant cause of neonatal meningitis"},{"n":"13","nombre":"Old Santa Claus","ver":"Santa Claus, representado como un hombre mayor, sosteniendo la lista y el saco de regalos.","clinica":"Listeria monocytogenes es una causa significativa de meningitis en adultos mayores de 60 años e individuos inmunocomprometidos, debido a su capacidad de evadir y explotar defensas inmunes debilitadas.","sketchy":"La edad avanzada de Santa representa directamente el grupo etario de riesgo (mayores de 60 años).","literal":"Listeria monocytogenes is a significant cause of meningitis in adults over 60 years and immunocompromised individuals due to its ability to evade and exploit weakened immune defenses"},{"n":"14","nombre":"Amp","ver":"Un amplificador de guitarra (\"amp\") negro junto al árbol de Navidad.","clinica":"La ampicilina sigue siendo el antibiótico principal para tratar las infecciones por Listeria monocytogenes.","sketchy":"\"Amp\" (amplificador) es la clave mnemotécnica fonética directa para \"Ampicillin\" (ampicilina).","literal":"Ampicillin remains the primary antibiotic for treating Listeria monocytogenes infections"}],"mapa":"imagenes/listeria-monocytogenes-mapa.webp","texto":"imagenes/listeria-monocytogenes-texto.webp"},{"slug":"nocardia-asteroides","titulo":"Nocardia asteroides","items":[{"n":"1","nombre":"NO limit CARD game","ver":"Un juego de cartas de póker \"sin límite\" (NO limit) sobre la mesa del salón.","clinica":"Nocardia asteroides (un bacilo gram-positivo).","sketchy":"\"NO limit CARD\" suena fonéticamente como \"Nocardia\", combinando las palabras del juego de cartas para formar el nombre bacteriano.","literal":"Nocardia asteroides (a gram-positive bacillus)"},{"n":"2","nombre":"Purple hues","ver":"Tonos púrpura en la decoración del salón (paredes, muebles).","clinica":"Nocardia asteroides es un bacilo gram-positivo.","sketchy":"El color púrpura refuerza la tinción gram-positiva.","literal":"Nocardia asteroides is a gram-positive bacillus"},{"n":"3","nombre":"Branching tree","ver":"Un árbol seco y ramificado visible en el cuadro/ventana del fondo.","clinica":"Nocardia asteroides se caracteriza por su estructura única de bacilos filamentosos y ramificados.","sketchy":"El árbol con ramas delgadas es la representación visual literal de la morfología filamentosa y ramificada, igual que en Actinomyces israelii.","literal":"Nocardia asteroides is characterized by its unique filamentous, branching bacilli structure"},{"n":"4","nombre":"Aerobic bellows","ver":"Un fuelle de cuero (bellows) colgado en la barra.","clinica":"Nocardia asteroides es un organismo aeróbico obligado, que requiere oxígeno para su supervivencia y crecimiento.","sketchy":"El fuelle que bombea aire representa el requerimiento estricto de oxígeno de la bacteria.","literal":"Nocardia asteroides is an obligate aerobic organism, requiring oxygen for its survival and growth"},{"n":"5","nombre":"Soil","ver":"Tierra derramada debajo de la maceta con el cactus, visible cerca de la mesa.","clinica":"Nocardia asteroides se encuentra predominantemente en el suelo, donde sobrevive como saprófito; la exposición por inhalación o inoculación traumática de la piel puede llevar a infección.","sketchy":"La tierra derramada representa el reservorio ambiental natural de la bacteria.","literal":"Nocardia asteroides is predominantly found in soil, where it survives as a saprophyte; exposure through inhalation or traumatic skin inoculation can lead to infection"},{"n":"6","nombre":"Mycolic acid tassels","ver":"Flecos y borlas de cuero colgando de la funda de pistola del vaquero de la izquierda.","clinica":"Nocardia asteroides tiene ácidos micólicos (ácidos grasos de cadena larga) en su pared celular, que le permiten teñirse parcialmente de rosa/rojo con fucsina básica en la tinción ácido-alcohol resistente; la tinción parcial es más débil que la reacción completa vista en Mycobacterium tuberculosis, reflejando el menor contenido de ácido micólico en Nocardia.","sketchy":"Los flecos colgantes representan visualmente las cadenas largas de los ácidos micólicos en la pared celular.","literal":"Nocardia asteroides has mycolic acids (long-chain fatty acids) in its cell wall, which allow it to stain partially pink/red with carbol fuchsin in acid-fast staining, partial staining is weaker than the full acid-fast reaction seen in Mycobacterium tuberculosis, reflecting the lower mycolic acid content in
