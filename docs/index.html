notauro (hombre-toro) enorme y furioso a la derecha de la escena.","clinica":"La eritromicina se usa con antitoxina para tratar la infección por Corynebacterium diphtheriae.","sketchy":"El toro es el símbolo fijo de Corynebacterium diphtheriae (por el signo del \"cuello de toro\").","literal":"Erythromycin is used with antitoxin to treat Corynebacterium diphtheriae infection"},{"n":"15","nombre":"MAC mockingbird","ver":"Un pájaro gris dentro de una jaula dorada etiquetada \"M. Avium\".","clinica":"Los macrólidos están indicados para infecciones micobacterianas (complejo Mycobacterium avium, MAC).","sketchy":"El pájaro (\"avium\" = ave) dentro de la jaula etiquetada representa directamente el complejo M. avium.","literal":"Macrolides are indicated for mycobacterial infections (Mycobacterium avium complex)"},{"n":"16","nombre":"…50 calendar","ver":"Un calendario abierto en el suelo con el número \"50\" visible.","clinica":"La azitromicina previene infecciones por MAC (profilaxis MAC) en VIH-SIDA (recuento de CD4 < 50).","sketchy":"El \"50\" del calendario es la clave numérica directa del umbral de CD4 para iniciar profilaxis.","literal":"Azithromycin prevents MAC infections (MAC prophylaxis) in HIV-AIDS (CD4 count<50)"},{"n":"17","nombre":"\"Art History A-Z\" + clam lady","ver":"Libros etiquetados \"Art History A-Z\" junto al cuadro de la mujer en la concha marina.","clinica":"La azitromicina trata la uretritis y cervicitis causadas por Chlamydia trachomatis.","sketchy":"La dama de la concha (\"clam\") marca Chlamydia, y \"A-Z\" es la clave fija de azitromicina.","literal":"Azithromycin treats urethritis and cervicitis caused by Chlamydia trachomatis"},{"n":"18","nombre":"Red crow goop + baby","ver":"Un cuervo rojo sobre un cuadro que muestra a una mujer sosteniendo un bebé.","clinica":"La eritromicina previene la oftalmía neonatal.","sketchy":"El cuervo \"rojo\" (erythro- = rojo) marca la eritromicina, y el bebé señala la profilaxis ocular del recién nacido.","literal":"Erythromycin prevents ophthalmia neonatorum"},{"n":"19","nombre":"Crow + \"Keep Clear\" + helicopter model","ver":"Un cuervo junto a un cartel que dice \"Keep Clear\" y un modelo de helicóptero colgando del techo.","clinica":"La claritromicina es parte del régimen de tratamiento de primera línea contra las infecciones por Helicobacter pylori.","sketchy":"\"Clear\" es la clave de claritromicina y el \"helicóptero\" la de Helicobacter, combinando fármaco y bacteria.","literal":"Clarithromycin is part of the first-line treatment regimen against Helicobacter pylori infections"},{"n":"20","nombre":"Fiddle + dilapidated colon tunnel","ver":"Un violín (fiddle) colgado en la pared, junto a un túnel deteriorado con forma de colon.","clinica":"La fidaxomicina es un potente antibiótico oral usado en el tratamiento de la colitis por C. difficile.","sketchy":"El violín (\"fiddle\") es la clave de fidaxomicina y el túnel-colon deteriorado señala la colitis.","literal":"Fidaxomicin is a potent oral antibiotic used in the treatment of C. difficile colitis"},{"n":"21","nombre":"Injured liver","ver":"Un plato con trozos de hígado crudo y lastimado sobre la mesa.","clinica":"Los macrólidos son hepatotóxicos (incluye desde daño leve del conducto biliar intrahepático hasta lesión hepatocelular severa e insuficiencia hepática).","sketchy":"El hígado dañado en el plato es la representación literal de la hepatotoxicidad.","literal":"Macrolides are hepatotoxic (includes mild damage to intrahepatic bile duct or severe hepatocellular injury and liver failure)"},{"n":"22","nombre":"Yellow skin","ver":"El personaje sentado a la mesa (Edgar Allan Poe) con la piel de un tono amarillento marcado.","clinica":"Los macrólidos pueden causar lesión del conducto biliar intrahepático → obstrucción biliar → hepatitis colestásica aguda → ictericia.","sketchy":"La piel amarilla es la representación literal directa de la ictericia.","literal":"Macrolides can cause intrahepatic biliary duct injury → biliary obstruction → acute cholestatic hepatitis → jaundice"},{"n":"23","nombre":"Telltale heart + EKG strip","ver":"Un corazón latiendo bajo las tablas del suelo, con una tira de electrocardiograma saliendo de él.","clinica":"Los macrólidos prolongan el intervalo Q-T, lo que aumenta el riesgo de arritmia fatal (ej. torsades de pointes).","sketchy":"El \"corazón delator\" de Poe con la tira de ECG representa directamente la prolongación del QT y el riesgo de arritmia.","literal":"Macrolides prolong the Q-T interval, which increases the risk for fatal dysrhythmia (e.g., torsades de pointes)"},{"n":"24","nombre":"Red mask","ver":"Una máscara roja de demonio colgando cerca de la ventana.","clinica":"Los macrólidos pueden causar reacciones cutáneas de hipersensibilidad retardada, raras pero severas (DRESS, SJS).","sketchy":"La máscara roja alude a \"La máscara de la muerte roja\" de Poe y representa las reacciones cutáneas graves.","literal":"Macrolides can cause rare severe delayed hypersensitivity skin reactions (DRESS, SJS)"},{"n":"25","nombre":"Broken chrome bumper","ver":"Un parachoques cromado roto de un automóvil antiguo, a la derecha de la escena.","clinica":"Los macrólidos inhiben el citocromo P450.","sketchy":"\"Chrome\" es la clave de \"citocromo\", el parachoques lleva la etiqueta P450 y el hecho de estar roto marca la inhibición.","literal":"Macrolides inhibit cytochrome P450"},{"n":"26","nombre":"Broken bike pump","ver":"Una bomba de bicicleta rota junto al automóvil.","clinica":"Los macrólidos son inhibidores potentes de la bomba de eflujo Pgp en humanos (la Pgp se expresa abundantemente en las células epiteliales intestinales).","sketchy":"La bomba rota representa literalmente la bomba de eflujo Pgp inhibida.","literal":"Macrolides are strong inhibitors of Pgp efflux pump in humans (Pgp is highly expressed on intestinal epithelial cells)"}],"mapa":"imagenes/macrolidos-mapa.webp","texto":"imagenes/macrolidos-texto.webp"},{"slug":"vancomicina","titulo":"Vancomicina","items":[{"n":"1","nombre":"Purple coccoid temples","ver":"Estructuras redondeadas de color púrpura, como cúpulas o templos, coronando las colinas del fondo.","clinica":"Actividad contra bacterias gram-positivas (ej. Staph, Strep).","sketchy":"La forma redondeada (coccoide) y el color púrpura combinan las dos claves: cocos y tinción gram-positiva.","literal":"Activity against gram positive bacteria (e.g. Staph, Strep)"},{"n":"2","nombre":"No mercy pharaoh","ver":"Una gran esfinge/faraón de piedra con expresión severa, junto a un cartel que dice \"NO MERCY\".","clinica":"La vancomicina tiene actividad contra Staphylococcus aureus resistente a meticilina (MRSA).","sketchy":"El faraón \"merciful\" es el símbolo de meticilina en toda la serie; aquí aparece como \"NO MERCY\", indicando que la vancomicina sí vence al MRSA.","literal":"Vancomycin has activity against Methicillin-resistant Staph aureus (MRSA)"},{"n":"3","nombre":"Golden staff","ver":"Un bastón dorado sostenido en alto por el explorador que se columpia.","clinica":"Staphylococcus aureus (cocos gram-positivos).","sketchy":"\"Golden staff\" es el símbolo mnemotécnico fijo de Staphylococcus aureus (\"aureus\" = dorado).","literal":"Staphylococcus aureus (gram-positive cocci)"},{"n":"4","nombre":"Van","ver":"Una furgoneta verde grande estacionada en el centro-derecha de la escena.","clinica":"Vancomicina (antibiótico glicopéptido).","sketchy":"\"Van\" (furgoneta) es la clave mnemotécnica fija de \"vancomycin\" en toda la serie.","literal":"Vancomycin (glycopeptide antibiotic)"},{"n":"5","nombre":"Temple wall hieroglyphs","ver":"Jeroglíficos que dicen \"D-ALA\" repetidos por todo el muro del templo.","clinica":"Inhibición de la síntesis de la pared celular al unirse directamente a los oligopéptidos D-alanil-D-alanina.","sketchy":"Los bloques \"D-ALA\" que forman literalmente la pared del templo representan los oligopéptidos D-Ala-D-Ala de la pared celular bacteriana.","literal":"inhibition of cell wall synthesis by directly binding D-alanyl-Dalanine oligopeptides"},{"n":"6","nombre":"Altered wall builder","ver":"Un constructor de apariencia alterada trabajando en la pared del templo, a la izquierda.","clinica":"Proteínas de unión a penicilina (PBPs) alteradas, resistentes a los beta-lactámicos.","sketchy":"El \"constructor alterado\" es el símbolo recurrente de las PBPs modificadas, ya visto en MRSA.","literal":"altered penicillin binding proteins (PBPs) resistant to beta-lactams"},{"n":"7","nombre":"Ineffective altered wall builder","ver":"El constructor alterado derribado en el suelo, incapaz de seguir construyendo.","clinica":"Las PBPs alteradas del MRSA son ineficaces contra la vancomicina.","sketchy":"El constructor caído representa que ese mecanismo de resistencia no le sirve al MRSA frente a la vancomicina, porque ésta no actúa sobre las PBPs.","literal":"MRSA's altered PBPs are ineffective against vancomycin"},{"n":"8","nombre":"Ineffective beta guard","ver":"Un guardia con casco derrotado, dándose la vuelta, incapaz de detener el ataque.","clinica":"Las beta-lactamasas son ineficaces contra la vancomicina.","sketchy":"El guardia vencido representa la beta-lactamasa inútil, ya que la vancomicina no es un beta-lactámico y no tiene ese anillo que romper.","literal":"Beta-lactamases are ineffective against vancomycin"},{"n":"9","nombre":"Ivy","ver":"Hiedra verde (ivy) trepando por la columna del templo.","clinica":"Administración IV (intravenosa).","sketchy":"\"Ivy\" suena idéntico a \"IV\" en inglés, siendo la clave mnemotécnica de la vía intravenosa.","literal":"IV administration"},{"n":"10","nombre":"Meningitis mohawk","ver":"Un casco con cresta roja tipo mohawk sobre la cabeza de un personaje.","clinica":"La vancomicina (con cefepime, ceftazidima o meropenem) puede usarse como tratamiento empírico de la meningitis adquirida en el hospital (ej. Strep pneumo resistente a penicilina - PRSP).","sketchy":"El casco/cresta sobre la cabeza es el símbolo recurrente de meningitis en toda la serie.","literal":"vancomycin (with cefepime, ceftazidime, or meropenem) can be used as empiric treatment of healthcare-acquired meningitis (e.g. penicillin-resistant Strep pneumo - PRSP)"},{"n":"11","nombre":"Fish bones","ver":"Esqueletos de pescado esparcidos en el suelo arenoso.","clinica":"La vancomicina trata la osteomielitis por MRSA.","sketchy":"Las espinas de pescado representan el hueso, símbolo fijo de osteomielitis en toda la serie.","literal":"Vancomycin treats MRSA osteomyelitis"},{"n":"12","nombre":"Coughing nurse","ver":"Una enfermera con uniforme blanco y cofia, tosiendo junto a la furgoneta.","clinica":"La vancomicina tiene actividad contra infecciones nosocomiales por MRSA (ej. neumonía adquirida en el hospital).","sketchy":"La enfermera representa el ambiente hospitalario (nosocomial) y la tos señala la neumonía.","literal":"Vancomycin has activity against nosocomial MRSA infections (e.g. hospital acquired pneumonia)"},{"n":"13","nombre":"Biofilm on lines and valves","ver":"Un trabajador tendido bajo la furgoneta, junto a mangueras y válvulas cubiertas de una sustancia pegajosa.","clinica":"La vancomicina tiene actividad contra infecciones por Staphylococcus epidermidis (ej. endocarditis).","sketchy":"El biofilm sobre líneas y válvulas es el símbolo fijo de S. epidermidis, que se adhiere a catéteres y válvulas protésicas.","literal":"Vancomycin has activity against Staph epidermidis infections (e.g. endocarditis)"},{"n":"14","nombre":"Heart shaped headpiece","ver":"Un tocado dorado con una gema roja en forma de corazón en lo alto del bastón.","clinica":"La vancomicina se usa como tratamiento empírico de la endocarditis.","sketchy":"La forma de corazón señala directamente la afectación cardíaca (endocarditis).","literal":"Vancomycin is used as an empiric treatment of endocarditis"},{"n":"15","nombre":"Diplococcus rock drums","ver":"Un personaje sentado en lo alto del templo golpeando dos rocas púrpuras emparejadas, como tambores.","clinica":"La vancomicina tiene actividad contra infecciones por Enterococcus.","sketchy":"Las dos rocas emparejadas representan la disposición en pares (diplococos) de los enterococos.","literal":"Vancomycin has activity against Enterococcus infections"},{"n":"16","nombre":"D-LAC hieroglyph","ver":"Un bloque de piedra suelto grabado con \"D-LAC\", separado del resto del muro \"D-ALA\".","clinica":"D-ALA-D-LAC confiere resistencia a la vancomicina (ej. VRE).","sketchy":"El cambio de \"D-ALA\" a \"D-LAC\" en los bloques es la representación literal de la mutación que impide que la vancomicina se una a la pared.","literal":"D-ALA-D-LAC confers resistance to vancomycin (e.g. VRE)"},{"n":"17","nombre":"Temple of flowing chocolate","ver":"Una estatua de piedra de cuya boca brota chocolate líquido hacia una fuente circular.","clinica":"La vancomicina oral trata las infecciones por Clostridioides difficile (ej. colitis pseudomembranosa).","sketchy":"El chocolate que fluye desde la boca es el símbolo fijo de la diarrea de C. difficile, y el hecho de salir por la boca marca la vía oral del tratamiento.","literal":"Oral vancomycin treats Clostridioides difficile infections (e.g. pseudomembranous colitis)"},{"n":"18","nombre":"Red statue","ver":"Una gran estatua de Anubis de color rojo intenso a la derecha de la escena.","clinica":"La vancomicina puede causar rubor por liberación de histamina, conocido como síndrome de rubor por vancomicina (antes llamado \"síndrome del hombre rojo\").","sketchy":"La estatua completamente roja es la representación literal del enrojecimiento generalizado de este efecto adverso.","literal":"Vancomycin can cause flushing due to histamine release, known as vancomycin flushing syndrome (formerly \"red man syndrome\")"},{"n":"19","nombre":"Beehive","ver":"Una colmena de abejas colgando cerca de la estatua roja.","clinica":"La activación de mastocitos por la vancomicina desencadena la liberación de histamina.","sketchy":"La abeja/colmena es el símbolo fijo de histamina en toda la serie (por la reacción a la picadura).","literal":"Mast cell activation from vancomycin triggers histamine release"},{"n":"20","nombre":"Blue venous vines","ver":"Enredaderas azules recorriendo la base de la fuente, como venas.","clinica":"La administración de vancomicina puede causar tromboflebitis.","sketchy":"Las enredaderas azules representan las venas inflamadas por la infusión del fármaco.","literal":"Vancomycin administration can cause thrombophlebitis"},{"n":"21","nombre":"Ototoxic gong","ver":"Un personaje golpeando un gong dorado en la parte alta derecha de la escena.","clinica":"La vancomicina puede causar ototoxicidad.","sketchy":"El estruendo del gong representa directamente el daño al oído (ototoxicidad).","literal":"Vancomycin can cause ototoxicity"},{"n":"22","nombre":"Falling kidney","ver":"Un objeto dorado con forma de riñón cayendo desde la estatua roja.","clinica":"La vancomicina puede causar nefrotoxicidad.","sketchy":"El riñón cayendo representa directamente el deterioro de la función renal.","literal":"Vancomycin can cause nephrotoxicity"},{"n":"23","nombre":"Slingshot native in dress","ver":"Una persona con vestido de lunares sosteniendo una honda (slingshot), en la esquina inferior derecha.","clinica":"Reacción a fármaco con eosinofilia y síntomas sistémicos (síndrome DRESS).","sketchy":"\"Dress\" (vestido) es la clave mnemotécnica literal del síndrome DRESS, y la honda alude al ataque sistémico eosinofílico.","literal":"drug reaction with eosinophilia and systemic symptoms (DRESS) syndrome"}],"mapa":"imagenes/vancomicina-mapa.webp","texto":"imagenes/vancomicina-texto.webp"}]}];

const PASOS = [
  ["ver",     "🎨", "Qué se ve"],
  ["clinica", "💡", "Significado clínico"],
  ["sketchy", "🧠", "Cómo lo dice Sketchy"],
  ["literal", "📜", "Texto literal"]
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const plano = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function resaltar(texto, termino) {
  const safe = esc(texto);
  if (!termino) return safe;
  const base = plano(safe), t = plano(termino);
  let out = "", i = 0;
  for (;;) {
    const k = base.indexOf(t, i);
    if (k === -1) { out += safe.slice(i); break; }
    out += safe.slice(i, k) + "<mark>" + safe.slice(k, k + t.length) + "</mark>";
    i = k + t.length;
  }
  return out;
}

const parrafos = (txt, term) =>
  txt.split("\n").filter(Boolean).map(l => `<p>${resaltar(l, term)}</p>`).join("");

function pintarItem(item, termino) {
  const pasos = PASOS.map(([clave, emoji, etiqueta]) => {
    if (!item[clave]) return "";
    const cls = clave === "literal" ? "paso literal" : "paso";
    return `<div class="${cls}"><span class="lbl"><span class="em">${emoji}</span>${etiqueta}</span>${parrafos(item[clave], termino)}</div>`;
  }).join("");
  return `<article class="item" id="it-${esc(item.n)}">
      <div class="item-head"><span class="num">${esc(item.n)}</span><span class="titulo">${resaltar(item.nombre, termino)}</span></div>
      ${pasos}
    </article>`;
}

/* ---------- indice ---------- */

const cont   = document.getElementById("indice");
const chips  = document.getElementById("chips");
const porSlug = {};

DATOS.forEach((parte, i) => {
  const id = "p" + i;

  const a = document.createElement("a");
  a.className = "chip"; a.href = "#" + id; a.dataset.c = parte.codigo;
  a.textContent = parte.nombre;
  chips.appendChild(a);

  const sec = document.createElement("section");
  sec.className = "parte"; sec.id = id; sec.dataset.c = parte.codigo;
  const total = parte.temas.reduce((s, t) => s + t.items.length, 0);
  sec.innerHTML = `<div class="parte-head"><h2>${esc(parte.nombre)}</h2>
      <span class="count">${parte.temas.length} · ${total} elem.</span></div>
    <div class="temas"></div>`;

  const lista = sec.querySelector(".temas");
  parte.temas.forEach(tema => {
    porSlug[tema.slug] = { tema, parte };
    const b = document.createElement("button");
    b.className = "tema-btn";
    b.innerHTML = `<span class="dot"></span>
      <span class="nombre">${esc(tema.titulo)}</span>
      <span class="n">${tema.items.length}</span>
      <span class="ico">${tema.mapa ? "▦" : ""}</span>`;
    b.addEventListener("click", () => abrirTema(tema.slug));
    lista.appendChild(b);
  });

  cont.appendChild(sec);
});

/* ---------- vista de estudio ---------- */

const estudio  = document.getElementById("estudio");
const estTit   = document.getElementById("estTitulo");
const estCnt   = document.getElementById("estCuenta");
const fichas   = document.getElementById("fichas");
const panel    = document.getElementById("panel");
const panelImg = document.getElementById("panelImg");
const seg      = document.getElementById("seg");

let temaActual = null;
let vistaImg = "mapa";
let scrollLista = 0;

function pintarPanel() {
  if (!temaActual) return;
  const hayMapa = !!temaActual.mapa, hayTexto = !!temaActual.texto;
  const botones = seg.querySelectorAll("button");

  botones[0].style.display = hayMapa ? "" : "none";
  botones[1].style.display = hayTexto ? "" : "none";

  if (!hayMapa && !hayTexto) { panel.style.display = "none"; return; }
  panel.style.display = "";

  if (vistaImg === "mapa" && !hayMapa) vistaImg = "texto";
  if (vistaImg === "texto" && !hayTexto) vistaImg = "mapa";

  botones.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === vistaImg)));
  panelImg.src = temaActual[vistaImg];
  panelImg.alt = temaActual.titulo + " — " + (vistaImg === "mapa" ? "mapa numerado" : "hoja de texto");
}

function abrirTema(slug) {
  const reg = porSlug[slug];
  if (!reg) return;
  scrollLista = window.scrollY;
  temaActual = reg.tema;
  vistaImg = reg.tema.mapa ? "mapa" : "texto";

  estudio.dataset.c = reg.parte.codigo;
  estTit.textContent = reg.tema.titulo;
  estCnt.textContent = reg.tema.items.length;
  fichas.innerHTML = reg.tema.items.map(it => pintarItem(it, "")).join("");
  pintarPanel();

  document.body.classList.add("en-estudio");
  document.body.classList.remove("panel-oculto");
  window.scrollTo(0, 0);
  history.pushState({ slug }, "", "#" + slug);
}

function cerrarTema() {
  document.body.classList.remove("en-estudio");
  temaActual = null;
  window.scrollTo(0, scrollLista);
}

document.getElementById("volver").addEventListener("click", () => { history.back(); });

window.addEventListener("popstate", ev => {
  if (ev.state && ev.state.slug) abrirTema(ev.state.slug);
  else cerrarTema();
});

seg.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  vistaImg = b.dataset.k;
  pintarPanel();
});

document.getElementById("btnPlegar").addEventListener("click", ev => {
  const oculto = document.body.classList.toggle("panel-oculto");
  ev.currentTarget.textContent = oculto ? "▼" : "▲";
  ev.currentTarget.title = oculto ? "Mostrar imagen" : "Ocultar imagen";
});

/* ---------- visor ---------- */

const visor = document.getElementById("visor");
const visorImg = document.getElementById("visorImg");

function abrirVisor(src, alt) {
  if (!src) return;
  visorImg.src = src; visorImg.alt = alt || "";
  visor.setAttribute("data-abierto", "");
  document.body.style.overflow = "hidden";
  visor.scrollTop = 0;
  visor.scrollLeft = (visor.scrollWidth - visor.clientWidth) / 2;
}
function cerrarVisor() {
  visor.removeAttribute("data-abierto");
  visorImg.src = "";
  document.body.style.overflow = "";
}

panelImg.addEventListener("click", () => abrirVisor(panelImg.src, panelImg.alt));
document.getElementById("btnZoom").addEventListener("click", () => abrirVisor(panelImg.src, panelImg.alt));
visor.addEventListener("click", ev => {
  if (ev.target === visor || ev.target.id === "visorCerrar") cerrarVisor();
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") {
    if (visor.hasAttribute("data-abierto")) cerrarVisor();
    else if (document.body.classList.contains("en-estudio")) history.back();
  }
});

/* ---------- busqueda ---------- */

const campo  = document.getElementById("q");
const caja   = document.getElementById("wrapBuscar");
const salida = document.getElementById("resultados");

const INDEX = [];
DATOS.forEach(parte => parte.temas.forEach(tema => tema.items.forEach(item => {
  INDEX.push({ parte, tema, item,
    texto: plano([tema.titulo, item.n, item.nombre, item.ver, item.clinica, item.sketchy, item.literal].join(" ")) });
})));

let pendiente;

function buscar() {
  const termino = campo.value.trim();
  caja.classList.toggle("filled", termino.length > 0);

  if (termino.length < 2) {
    salida.hidden = true; salida.innerHTML = "";
    cont.hidden = false; chips.hidden = false;
    return;
  }

  const t = plano(termino);
  const hits = INDEX.filter(e => e.texto.includes(t));
  cont.hidden = true; chips.hidden = true; salida.hidden = false;

  if (!hits.length) {
    salida.innerHTML = `<p class="vacio">Sin resultados para “${esc(termino)}”.</p>`;
    return;
  }

  let html = `<p class="res-info">${hits.length} ${hits.length === 1 ? "elemento" : "elementos"} · ${new Set(hits.map(h => h.tema.slug)).size} temas</p>`;
  let actual = null;
  hits.slice(0, 200).forEach(h => {
    if (h.tema.slug !== actual) {
      actual = h.tema.slug;
      html += `<div class="parte" data-c="${h.parte.codigo}"><p class="res-tema">${esc(h.tema.titulo)}</p></div>`;
    }
    html += `<div class="parte" data-c="${h.parte.codigo}">${pintarItem(h.item, termino)}</div>`;
  });
  if (hits.length > 200) html += `<p class="vacio">…y ${hits.length - 200} más. Afina la búsqueda.</p>`;

  salida.innerHTML = html;
  window.scrollTo({ top: 0 });
}

campo.addEventListener("input", () => { clearTimeout(pendiente); pendiente = setTimeout(buscar, 120); });
document.getElementById("limpiar").addEventListener("click", () => { campo.value = ""; campo.focus(); buscar(); });

/* abrir directo si la URL trae un tema */
const inicial = decodeURIComponent(location.hash.slice(1));
if (inicial && porSlug[inicial]) abrirTema(inicial);
</script>
