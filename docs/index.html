lin) have activity against gastrointestinal and urinary tract gram-negative rods (e.g. E. coli)"},{"n":"22","nombre":"Beta bouncer","ver":"Un alienígena robusto tipo \"guardia de seguridad\" (bouncer) con una insignia \"β\" en el pecho.","clinica":"Las bacterias productoras de beta-lactamasa (ej. Enterococcus) son resistentes a las aminopenicilinas y penicilinas de espectro extendido.","sketchy":"El \"guardia\" (bouncer) que impide el paso representa la resistencia bacteriana bloqueando el acceso del fármaco.","literal":"Beta-lactamase producing bacteria (e.g. Enterococcus) are resistant to aminopenicillins and extended spectrum penicillins"},{"n":"23","nombre":"Distracting clarinet","ver":"Un alienígena tocando un clarinete/trompeta que distrae al guardia.","clinica":"El clavulanato (un inhibidor de beta-lactamasa a menudo combinado con amoxicilina y ticarcilina) distrae/inhibe la beta-lactamasa.","sketchy":"El instrumento \"distrayendo\" al guardia (beta-lactamasa) representa cómo el clavulanato la inhibe, dejando pasar al antibiótico.","literal":"Clavulanate (a beta-lactamase inhibitor often combined with amoxicillin and ticarcillin)"},{"n":"24","nombre":"Back to back tambourines","ver":"Dos panderetas tocadas espalda con espalda por los músicos ambulantes.","clinica":"El sulbactam y el tazobactam son inhibidores de beta-lactamasa a menudo combinados con ampicilina y piperacilina.","sketchy":"Las dos panderetas \"espalda con espalda\" representan los dos inhibidores adicionales de beta-lactamasa.","literal":"Sulbactam and tazobactam are beta-lactamase inhibitors often combined with ampicillin and piperacillin"},{"n":"25","nombre":"Spleen hole","ver":"Un agujero/hueco con forma de bazo en la escena.","clinica":"La amoxicilina se usa como profilaxis contra bacterias encapsuladas (ej. Strep pneumoniae y Haemophilus influenzae) en pacientes asplénicos.","sketchy":"El \"hueco\" con forma de bazo representa directamente la ausencia de bazo (asplenia).","literal":"Amoxicillin is used as prophylaxis against encapsulated bacteria (e.g. Strep pneumoniae and Haemophilus influenzae) in asplenic patients"},{"n":"26","nombre":"Bloody tooth","ver":"Un diente ensangrentado visible en la escena de pelea.","clinica":"La amoxicilina se usa como profilaxis antes de procedimientos dentales en pacientes con alto riesgo de endocarditis.","sketchy":"El \"diente\" ensangrentado representa directamente el procedimiento dental.","literal":"Amoxicillin is used as prophylaxis before dental procedures in patients at high risk for endocarditis"},{"n":"27","nombre":"Trampled liver spot","ver":"Una criatura con forma de hígado siendo pisoteada en el suelo durante la pelea.","clinica":"Las aminopenicilinas (ej. amoxicilina) pueden causar lesión hepática inducida por fármacos.","sketchy":"El hígado \"pisoteado/trampled\" (dañado) representa directamente la lesión hepática.","literal":"Aminopenicillins (e.g. amoxicillin) can cause drug-induced liver injury"},{"n":"28","nombre":"Red mask sloughing off","ver":"Una máscara/piel roja desprendiéndose de la cara de uno de los personajes en la pelea.","clinica":"Las aminopenicilinas (ej. amoxicilina y ampicilina) pueden causar síndrome de Stevens-Johnson/necrólisis epidérmica tóxica (SJS/TEN).","sketchy":"La piel \"desprendiéndose\" (sloughing off) representa directamente el SJS/TEN.","literal":"Aminopenicillins (e.g. amoxicillin and ampicillin) can cause Stevens-Johnson syndrome/toxic epidermal necrolysis (SJS/TEN)"},{"n":"29","nombre":"Red spots at Ebstein's Bar","ver":"Manchas rojas en una criatura sentada en la barra llamada \"Ebstein's Bar\".","clinica":"Las aminopenicilinas (ej. amoxicilina, ampicilina) pueden causar rash en el contexto de enfermedad viral (ej. virus de Epstein-Barr - mononucleosis infecciosa).","sketchy":"\"Ebstein's Bar\" suena fonéticamente como \"Epstein-Barr\", y las manchas rojas representan el rash.","literal":"Aminopenicillins (e.g. amoxicillin, ampicillin) can cause rash in the setting of viral illness (e.g. Epstein-Barr virus - infectious mononucleosis)"},{"n":"30","nombre":"Piper","ver":"Un personaje con máscara de gas tocando un instrumento tipo flauta/gaita (piper).","clinica":"La piperacilina es una penicilina de espectro extendido.","sketchy":"\"Piper\" es la clave fonética directa para \"PIPERacillin\".","literal":"Piperacillin is an extended-spectrum penicillin"},{"n":"31","nombre":"Tiger stripes","ver":"Un personaje con vestimenta de rayas de tigre junto al que toca la flauta.","clinica":"La ticarcilina es una penicilina de espectro extendido.","sketchy":"\"TIger stripes\" suena fonéticamente como el inicio de \"TIcarcillin\".","literal":"Ticarcillin is an extended-spectrum penicillin"},{"n":"32","nombre":"Gas mask","ver":"Una segunda máscara de gas que lleva puesta uno de los músicos con cuernos.","clinica":"Las penicilinas de espectro extendido (ej. piperacilina, ticarcilina) tratan infecciones anaeróbicas.","sketchy":"La máscara de gas repite el símbolo del ambiente anaeróbico.","literal":"Extended-spectrum penicillins (e.g. piperacillin, ticarcillin) treat anaerobic infections"},{"n":"33","nombre":"Mona Lisa","ver":"Un retrato tipo \"Mona Lisa\" con rostro alienígena, colgado en la pared de la cantina.","clinica":"Las penicilinas de espectro extendido (ej. piperacilina, ticarcilina) tratan infecciones por Pseudomonas.","sketchy":"El cuadro de la \"Mona Lisa\" (PSEUDO-arte, una reproducción) representa a \"PSEUDOmonas\" mediante el juego conceptual de la falsificación/imitación.","literal":"Extended-spectrum penicillins (e.g. piperacillin, ticarcillin) treat Pseudomonas infections"}]},{"slug":"antagonistas-muscarinicos","titulo":"Antagonistas muscarínicos","items":[{"n":"1","nombre":"Motorcycle parking spots","ver":"Espacios de estacionamiento para motocicletas marcados M1, M2, M3.","clinica":"Los receptores muscarínicos de acetilcolina (M1, M2, M3).","sketchy":"Los espacios \"M1, M2, M3\" son la clave literal directa de los tres subtipos de receptor muscarínico.","literal":"muscarinic acetylcholine receptors (M1, M2, M3)"},{"n":"2","nombre":"Reversing into motorcycle parking spot","ver":"Un vehículo retrocediendo (reversing) hacia el espacio de estacionamiento.","clinica":"Los antagonistas muscarínicos bloquean reversiblemente los receptores muscarínicos.","sketchy":"El acto de \"retroceder\" (reversing) representa el bloqueo reversible de los receptores.","literal":"muscarinic antagonists reversibly block muscarinic receptors"},{"n":"3","nombre":"Blocked tweedleDUMBBELLS","ver":"Un personaje levantando pesas (dumbbells) bloqueado en su movimiento.","clinica":"Los antagonistas muscarínicos bloquean los efectos muscarínicos de diarrea, micción, miosis, broncoespasmo, bradicardia, lagrimeo y salivación.","sketchy":"\"tweedleDUMBBELLS\" con las letras resaltadas D-U-M-B-B-E-L-S deletrea el acrónimo mnemotécnico DUMBBELS (diarrea, urination, miosis, bradicardia, bronchospasm, excitation, lacrimation, salivation).","literal":"muscarinic antagonists block the muscarinic effects of diarrhea, urination, miosis, bradycardia, bronchospasm, lacrimation, salivation"},{"n":"4","nombre":"Blocked acetyl-cola bottle","ver":"Una botella de refresco \"Acetyl-Cola\" bloqueada.","clinica":"Los antagonistas muscarínicos bloquean la acción de la acetilcolina en los receptores M.","sketchy":"\"Acetyl-Cola\" suena como \"acetylcholine\", siendo la botella bloqueada la clave mnemotécnica.","literal":"antimuscarinics block the action of acetylcholine at M receptors"},{"n":"5","nombre":"Alice","ver":"El personaje de Alicia sentada en la mesa del té.","clinica":"Atropina (antimuscarínico).","sketchy":"\"Alice\" es el nombre elegido como clave mnemotécnica del personaje central de Alicia en el País de las Maravillas, escenario base de \"atropina\" (relacionada con Atropa belladonna).","literal":"atropine (antimuscarinic)"},{"n":"6","nombre":"Alice holding belladonna flower","ver":"Alicia sosteniendo una flor.","clinica":"La atropina y alcaloides antimuscarínicos relacionados se encuentran en la flor Atropa belladonna (\"Deadly Nightshade\").","sketchy":"La flor sostenida por Alicia representa literalmente la planta Atropa belladonna, origen de la atropina.","literal":"Atropine and related antimuscarinic alkaloids are found in the flower Atropa belladonna ('Deadly Nightshade')"},{"n":"7","nombre":"Jimson Weed Tea","ver":"Una etiqueta de té que dice \"Jimson Weed Tea\" sobre la mesa.","clinica":"La atropina y alcaloides antimuscarínicos relacionados se encuentran en la planta Datura stramonium (\"Jimsonweed\").","sketchy":"La etiqueta \"Jimson Weed\" es la clave literal directa de la planta Datura stramonium.","literal":"Atropine and related antimuscarinic alkaloids are found in the plant Datura stramonium ('Jimsonweed')"},{"n":"8","nombre":"Large pupil gazing into the distance","ver":"Un personaje con una pupila muy dilatada mirando a la distancia.","clinica":"Los antimuscarínicos causan dilatación pupilar (midriasis) y cicloplejia (incapacidad de acomodar el cristalino para visión cercana).","sketchy":"La pupila grande \"mirando a la distancia\" (incapaz de enfocar cerca) representa la midriasis y cicloplejia.","literal":"antimuscarinics cause pupillary dilation (mydriasis) and cycloplegia (inability to accommodate the lens for near vision)"},{"n":"9","nombre":"TeleSCOPE","ver":"Un telescopio (SCOPE) sostenido por un personaje.","clinica":"Escopolamina (antimuscarínico).","sketchy":"\"TeleSCOPE\" con \"SCOPE\" resaltado es la clave literal directa de \"SCOPolamine\".","literal":"scopolamine (antimuscarinic)"},{"n":"10","nombre":"Seasick sailor outfit","ver":"Un traje de marinero mareado (seasick).","clinica":"La escopolamina se usa para tratar el mareo por movimiento (náusea vestibular).","sketchy":"El traje de \"marinero mareado\" representa directamente la náusea vestibular tratada.","literal":"scopolamine is used to treat motion sickness (vestibular nausea)"},{"n":"11","nombre":"Eyepatch","ver":"Un parche colocado detrás de la oreja de un personaje.","clinica":"El parche transdérmico de escopolamina se usa para tratar el mareo por movimiento.","sketchy":"El parche detrás de la oreja representa directamente la vía transdérmica de administración.","literal":"scopolamine transdermal patch is used to treat motion sickness"},{"n":"12","nombre":"CNS hat","ver":"Un sombrero etiquetado \"CNS\" que lleva puesto un personaje.","clinica":"Los antimuscarínicos (ej. escopolamina) cruzan la barrera hematoencefálica e inhiben los receptores M1 centrales.","sketchy":"El sombrero \"CNS\" (sobre la cabeza) representa directamente el sistema nervioso central.","literal":"antimuscarinics (e.g., scopolamine) cross the blood-brain barrier and inhibits central M1 receptors"},{"n":"13","nombre":"Heart with jewel nodes","ver":"Un corazón con nodos brillantes tipo joya.","clinica":"Los antimuscarínicos bloquean la activación parasimpática de los receptores M2 en los nodos SA y AV (aumento de frecuencia cardíaca, aumento de conducción AV).","sketchy":"Los nodos brillantes en el corazón representan los nodos SA y AV, sitios de acción de los receptores M2.","literal":"antimuscarinics block parasympathetic activation of M2 receptors on the SA and AV nodes (increased heart rate, increased AV conduction)"},{"n":"14","nombre":"Elevated heart watch","ver":"Un reloj con forma de corazón elevado.","clinica":"Los antimuscarínicos (ej. atropina) aumentan la frecuencia cardíaca (útil en el tratamiento de bradicardia).","sketchy":"El reloj \"elevado\" representa el aumento de la frecuencia cardíaca (medida en el tiempo).","literal":"antimuscarinics (e.g. atropine) increase heart rate (useful in the treatment of bradycardia)"},{"n":"15","nombre":"Heart shield","ver":"Un escudo con forma de corazón.","clinica":"Bloqueo cardíaco (bloqueo auriculoventricular).","sketchy":"El \"escudo\" (shield) sobre el corazón representa literalmente el \"heart block\".","literal":"heart block (atrioventricular block)"},{"n":"16","nombre":"Falling heart shields","ver":"Escudos con forma de corazón cayendo.","clinica":"Los antimuscarínicos (ej. atropina) aumentan la conducción AV (útil en el tratamiento del bloqueo cardíaco).","sketchy":"Los escudos \"cayendo\" representan la resolución del bloqueo cardíaco.","literal":"antimuscarinics (e.g. atropine) increase AV conduction (useful in the treatment of heart block)"},{"n":"17","nombre":"Cat-ipra-tio-tropillar","ver":"Una oruga (caterpillar) fumando una pipa de agua, sentada en un hongo.","clinica":"Ipratropio y tiotropio (antagonistas muscarínicos M3).","sketchy":"\"Cat-IPRA-TIO-tropillar\" combina \"caterpillar\" (oruga) con las sílabas \"IPRA\" y \"TIO\", deletreando ambos fármacos: ipratropIO y tiotropIO.","literal":"ipratropium and tiotropium (M3 muscarinic antagonists)"},{"n":"18","nombre":"Puffing","ver":"La oruga expulsando humo/vapor de la pipa.","clinica":"El ipratropio y el tiotropio son broncodilatadores antimuscarínicos inhalados.","sketchy":"El \"soplar/inhalar\" (puffing) humo representa directamente la vía inhalada de administración.","literal":"ipratropium and tiotropium are inhaled antimuscarinic bronchodilators"},{"n":"19","nombre":"Blue bloater with pink puffer","ver":"Dos personajes: uno azulado e hinchado, otro rosado con dificultad respiratoria.","clinica":"El ipratropio y el tiotropio son útiles en el manejo de la EPOC (antagonizan receptores M3 → broncodilatación, secreciones disminuidas).","sketchy":"\"Blue bloater\" y \"pink puffer\" son los apodos clásicos de los dos fenotipos de EPOC.","literal":"ipratropium and tiotropium are useful in the management of COPD (antagonize M3 receptors → bronchodilation, decreased secretions)"},{"n":"20","nombre":"Long lasting TIO smoke rings","ver":"Anillos de humo (smoke rings) etiquetados \"TIO\" que duran mucho tiempo en el aire.","clinica":"El tiotropio se disocia más lentamente del receptor M3 (acción broncodilatadora más prolongada).","sketchy":"Los anillos de humo \"de larga duración\" representan la disociación más lenta y el efecto prolongado del tiotropio.","literal":"tiotropium dissociates more slowly from the M3 receptor (longer bronchodilator action)"},{"n":"21","nombre":"Ox butler","ver":"Un buey vestido de mayordomo (butler) sirviendo en la mesa.","clinica":"Oxibutinina (antagonista muscarínico M3).","sketchy":"\"Ox butler\" (buey mayordomo) suena fonéticamente como \"oxybutynin\".","literal":"oxybutynin (M3 muscarinic antagonist)"},{"n":"22","nombre":"Turning off bladder","ver":"Un mayordomo apagando/cerrando un recipiente con forma de vejiga.","clinica":"La oxibutinina y la tolterodina tratan la incontinencia (antagonizan receptores M3 → relajan el músculo liso en uréteres y pared vesical).","sketchy":"\"Apagar la vejiga\" representa la relajación del músculo liso vesical que trata la incontinencia.","literal":"oxybutynin and tolterodine treat incontinence (antagonize M3 receptors → relax smooth muscle in ureters and bladder wall)"},{"n":"23","nombre":"Turtle butler","ver":"Una tortuga vestida de mayordomo sirviendo en la mesa.","clinica":"Tolterodina (antagonista muscarínico M3).","sketchy":"\"Turtle\" (tortuga) suena fonéticamente similar al inicio de \"tolterodine\".","literal":"tolterodine (M3 muscarinic antagonist)"},{"n":"24","nombre":"CENTER over M1","ver":"Un cartel \"Parking Center\" ubicado sobre el espacio marcado M1.","clinica":"Los receptores M1 muscarínicos se encuentran en el sistema nervioso central (SNC).","sketchy":"\"CENTER\" sobre el espacio M1 representa el sistema nervioso \"central\".","literal":"M1 muscarinic receptors are found in the CNS"},{"n":"25","nombre":"PARKING over M1","ver":"El cartel \"Parking Center\" completo sobre el espacio M1.","clinica":"Los antagonistas del receptor M1 pueden reducir el temblor y la rigidez en la enfermedad de Parkinson.","sketchy":"\"PARKING\" suena fonéticamente como \"Parkinson\", clave mnemotécnica directa.","literal":"M1 receptor antagonists can reduce tremors and rigidity in Parkinson's disease"},{"n":"26","nombre":"Benz parked in M1","ver":"Un auto marca \"BENZ\" estacionado en el espacio M1.","clinica":"Benztropina (antagonista muscarínico M1 de acción central).","sketchy":"\"Benz\" es la clave fonética directa para \"benztropine\".","literal":"benztropine (centrally acting M1 muscarinic antagonist)"},{"n":"27","nombre":"Tri-hex car parked in M1","ver":"Un auto etiquetado \"TRI HEX\" estacionado en el espacio M1.","clinica":"Trihexifenidilo (antagonista muscarínico M1 de acción central).","sketchy":"\"Tri-Hex\" es la clave fonética directa para \"triHEXyphenidyl\".","literal":"trihexyphenidyl (centrally acting M1 muscarinic antagonist)"},{"n":"28","nombre":"Shaking antenna","ver":"Una antena temblorosa sobre uno de los vehículos.","clinica":"Los antimuscarínicos de acción central (ej. benztropina, trihexifenidilo) tratan el temblor y la rigidez en el Parkinson (bloquean la actividad colinérgica excesiva).","sketchy":"La antena \"temblando\" representa directamente el temblor parkinsoniano.","literal":"centrally acting antimuscarinics (e.g., benztropine, trihexyphenidyl) treat tremor and rigidity in Parkinson's (block excess cholinergic activity)"},{"n":"29","nombre":"Cogwheel","ver":"Un engranaje/rueda dentada (cogwheel) en el cartel del estacionamiento.","clinica":"La activación excesiva de M1 se asocia con rigidez en rueda dentada (cogwheel rigidity) en el Parkinson.","sketchy":"La rueda dentada es la representación literal directa de la \"cogwheel rigidity\".","literal":"excessive M1 activation is associated with cogwheel rigidity in Parkinson's disease"},{"n":"30","nombre":"Falling \"extra parking\" cone","ver":"Un cono de \"Extra Parking\" cayendo.","clinica":"Los antimuscarínicos tratan los efectos secundarios extrapiramidales causados por antipsicóticos (ej. distonía, acatisia, parkinsonismo; reestablecen el balance dopaminérgico-colinérgico).","sketchy":"\"EXTRA\" en el cono es la clave literal directa para \"EXTRApyramidal\", y su caída marca la resolución del efecto adverso.","literal":"antimuscarinics treat extrapyramidal side effects caused by antipsychotics: e.g. dystonia, akathisia, parkinsonism (re-establish dopaminergic-cholinergic balance)"},{"n":"31","nombre":"Hot as a hare","ver":"Un conejo (hare) con aspecto acalorado en la mesa del té.","clinica":"Los antimuscarínicos inhiben los receptores M3 en las glándulas sudoríparas → disminución de la sudoración → hipertermia.","sketchy":"\"Hot as a hare\" es la mnemotecnia clásica del toxíndrome anticolinérgico, representada literalmente por la liebre acalorada.","literal":"antimuscarinics inhibit M3 receptors on sweat glands → decreased sweating → hyperthermia"},{"n":"32","nombre":"Dry as a cracker","ver":"Galletas secas (crackers) sobre la mesa del té.","clinica":"Los antimuscarínicos disminuyen la salivación y el lagrimeo → boca y ojos secos.","sketchy":"\"Dry as a cracker\" (seco como una galleta) es la variante mnemotécnica de \"dry as a bone\", representada por las galletas secas.","literal":"antimuscarinics decrease salivation and lacrimation → dry mouth and eyes"},{"n":"33","nombre":"Blind as a bat","ver":"Un murciélago (bat) volando cerca de la mesa del té.","clinica":"Los antimuscarínicos causan midriasis y cicloplejia → visión borrosa.","sketchy":"\"Blind as a bat\" (ciego como un murciélago) es la mnemotecnia clásica del toxíndrome anticolinérgico.","literal":"antimuscarinics cause mydriasis and cycloplegia → blurred vision"},{"n":"34","nombre":"High-pressure as a kettle","ver":"Una tetera (kettle) hirviendo bajo presión sobre la mesa.","clinica":"Los antimuscarínicos causan midriasis → disminución del drenaje del humor acuoso → glaucoma agudo de ángulo cerrado.","sketchy":"La tetera \"a alta presión\" representa el aumento de presión intraocular del glaucoma de ángulo cerrado.","literal":"antimuscarinics cause mydriasis → decreased outflow of aqueous humor → acute angle closure glaucoma"},{"n":"35","nombre":"Mad as a hatter","ver":"El Sombrerero Loco (Mad Hatter) en la mesa del té.","clinica":"Los antimuscarínicos cruzan la barrera hematoencefálica y antagonizan los receptores M1 centrales → sedación, agitación, alucinaciones, coma (especialmente en pacientes ancianos).","sketchy":"\"Mad as a hatter\" (loco como un sombrerero) es la mnemotecnia clásica final del toxíndrome anticolinérgico, personificada literalmente.","literal":"antimuscarinics cross the BBB and antagonize central M1 receptors → sedation, agitation, hallucination, coma (especially in elderly patients)"}]},{"slug":"anticuerpos-monoclonales","titulo":"Terapia con anticuerpos monoclonales","items":[{"n":"1","nombre":"Coronation ritual","ver":"Un obispo coronando a un rey arrodillado en el centro del salón medieval.","clinica":"Rituximab (anticuerpo monoclonal antitumoral).","sketchy":"El \"ritual\" de coronación suena como el inicio de \"rituximab\", siendo la ceremonia la clave mnemotécnica del fármaco.","literal":"rituximab (antitumor monoclonal antibody)"},{"n":"2","nombre":"Chimera sigil","ver":"Un estandarte con el emblema de una quimera (león mezclado con otras bestias) sobre la capa del rey.","clinica":"El rituximab y el cetuximab son anticuerpos monoclonales quiméricos.","sketchy":"La quimera, criatura hecha de partes de distintos animales, representa literalmente el anticuerpo quimérico (parte ratón, parte humano).","literal":"rituximab and cetuximab are chimeric monoclonal antibodies"},{"n":"3","nombre":"Pulling down antibody archer","ver":"Un soldado tirando hacia abajo a un arquero que lleva el símbolo de anticuerpo en su uniforme.","clinica":"El rituximab depleta células B (se une a CD20).","sketchy":"Los arqueros (que disparan flechas = anticuerpos) representan las células B; derribarlos marca la depleción.","literal":"rituximab depletes B cells (binds CD20)"},{"n":"4","nombre":"Grabbing \"XX\" straps","ver":"Un soldado agarrando las correas cruzadas en forma de \"XX\" del pecho del arquero.","clinica":"El rituximab se une a CD20 en las células B.","sketchy":"\"XX\" son 20 en números romanos, siendo la clave numérica directa de CD20.","literal":"rituximab binds CD20 on B-cells"},{"n":"5","nombre":"Chronic tapestry with antibody archers and T knights","ver":"Un tapiz colgado que muestra arqueros con símbolo de anticuerpo y caballeros con cruces en el escudo.","clinica":"El rituximab trata la leucemia linfocítica crónica (LLC).","sketchy":"El tapiz antiguo representa lo \"crónico\", y los arqueros (células B) junto a los caballeros T marcan los linfocitos implicados.","literal":"rituximab treats chronic lymphocytic leukemia (CLL)"},{"n":"6","nombre":"Rheumatic lantern","ver":"Una linterna roja colgante con la forma de una articulación deformada.","clinica":"El rituximab trata la artritis reumatoide (fármaco antirreumático modificador de la enfermedad - DMARD).","sketchy":"La articulación deformada e inflamada en la linterna representa directamente la artritis reumatoide.","literal":"rituximab treats rheumatoid arthritis (disease modifying antirheumatic drug - DMARD)"},{"n":"7","nombre":"Torn antibody","ver":"Una linterna con el símbolo de anticuerpo (Y) roto o desgarrado.","clinica":"El rituximab es útil para terapia inmunosupresora (ej. poliangeítis microscópica, granulomatosis de Wegener).","sketchy":"El anticuerpo roto representa la supresión de la respuesta inmune mediada por anticuerpos.","literal":"Rituximab is useful for immunosuppressive therapy (e.g. microscopic polyangiitis, Wegener's granulomatosis)"},{"n":"8","nombre":"Immunosuppressed cane","ver":"Un bastón sostenido por una figura encorvada junto al rey.","clinica":"El rituximab puede causar inmunosupresión y aumento del riesgo de infección.","sketchy":"El bastón es el símbolo fijo de Sketchy para el paciente inmunocomprometido.","literal":"Rituximab can cause immunosuppression and increased risk of infection"},{"n":"9","nombre":"White laurel leaves","ver":"Una corona de laurel blanca sobre la cabeza del rey coronado.","clinica":"El rituximab puede asociarse con un riesgo aumentado de leucoencefalopatía multifocal progresiva (PML).","sketchy":"El laurel blanco sobre la cabeza es el mismo símbolo usado en el Sketchy de poliomavirus JC para las lesiones blancas cerebrales de la PML.","literal":"rituximab may be associated with a higher risk of progressive multifocal leukoencephalopathy (PML)"},{"n":"10","nombre":"Swollen cherub with ivy","ver":"Un querubín hinchado y enrojecido, rodeado de hiedra, en el vitral de la ventana.","clinica":"Los anticuerpos monoclonales pueden causar reacción a la infusión (ej. cefalea, fiebre, rash cutáneo, prurito, disnea, hipotensión).","sketchy":"La hiedra (\"ivy\") suena como \"IV\" y el querubín hinchado y rojo representa la reacción a la infusión intravenosa.","literal":"monoclonal antibodies can cause an infusion reaction (e.g. headache, fever, skin rash, pruritus, dyspnea, hypotension)"},{"n":"11","nombre":"Delayed onset poisoning","ver":"El rey tocándose el pecho con gesto de malestar tardío tras beber.","clinica":"Los anticuerpos quiméricos (ej. rituximab) pueden causar enfermedad del suero (ej. fiebre, rash, artralgia dentro de 7-10 días).","sketchy":"El envenenamiento \"de inicio tardío\" representa la latencia de 7-10 días de la enfermedad del suero.","literal":"chimeric antibodies (e.g. rituximab) can cause serum sickness (e.g. fever, rash, arthralgia within 7-10 days)"},{"n":"12","nombre":"Tusks","ver":"Un elefante grande con colmillos prominentes en el centro-derecha de la escena.","clinica":"Cetuximab (anticuerpo monoclonal antitumoral).","sketchy":"\"Tusks\" (colmillos) suena como el final de \"cetuximab\", siendo el elefante la clave mnemotécnica.","literal":"cetuximab (monoclonal antitumor antibody)"},{"n":"13","nombre":"Giraffe","ver":"Jirafas bordadas en la manta que cubre el lomo del elefante.","clinica":"El cetuximab se une al receptor del factor de crecimiento epidérmico (EGFR).","sketchy":"La jirafa, con su cuello largo que \"crece\", es el símbolo fijo de Sketchy para el factor de crecimiento epidérmico (EGFR).","literal":"cetuximab binds the epidermal growth factor receptor (EGFR)"},{"n":"14","nombre":"Tire swing","ver":"Un columpio hecho con una llanta colgando de una cuerda, junto al elefante.","clinica":"El EGFR es un receptor tirosina quinasa.","sketchy":"\"Tire\" (llanta) suena como el inicio de \"tyrosine\", siendo el columpio la clave mnemotécnica de la tirosina quinasa.","literal":"EGFR is a receptor tyrosine kinase"},{"n":"15","nombre":"Cracked crab","ver":"Un cangrejo cocido y agrietado servido en un plato sobre la mesa del banquete.","clinica":"El cetuximab trata tumores sólidos (ej. cáncer colorrectal, carcinoma de células escamosas).","sketchy":"El cangrejo es el símbolo universal de cáncer en Sketchy, y estar \"agrietado/roto\" marca el tumor tratado.","literal":"cetuximab treats solid tumors (e.g. colorectal cancer, squamous cell carcinoma)"},{"n":"16","nombre":"Red spots","ver":"Manchas rojas salpicadas sobre la manta de jirafas del elefante.","clinica":"El cetuximab puede causar un rash acneiforme papulopustular.","sketchy":"Las manchas rojas representan directamente el rash acneiforme característico de este fármaco.","literal":"cetuximab can cause a papulopustular acneiform rash"},{"n":"17","nombre":"Delayed onset poisoning","ver":"Una copa dorada siendo servida junto al elefante, con gesto de malestar posterior.","clinica":"Los anticuerpos quiméricos (raramente el cetuximab) pueden causar enfermedad del suero (ej. fiebre, rash, artralgia dentro de 7-10 días).","sketchy":"El mismo símbolo del envenenamiento tardío se repite aquí para el cetuximab, por ser también quimérico.","literal":"chimeric antibodies (rarely cetuximab) can cause serum sickness (e.g. fever, rash, arthralgia within 7-10 days)"},{"n":"18","nombre":"Beverage lady","ver":"Una mujer revolviendo un caldero de líquido rojo en la cocina, a la izquierda.","clinica":"Bevacizumab (anticuerpo monoclonal antitumoral).","sketchy":"\"Beverage\" (bebida) suena como el inicio de \"bevacizumab\", siendo la mujer de las bebidas la clave mnemotécnica.","literal":"bevacizumab (monoclonal antitumor antibody)"},{"n":"19","nombre":"Chopped vegetables","ver":"Verduras picadas sobre una tabla de cortar en la cocina.","clinica":"El bevacizumab se une a VEGF.","sketchy":"\"Vegetables\" (verduras) suena como el inicio de \"VEGF\", siendo el picado la clave mnemotécnica.","literal":"bevacizumab binds VEGF"},{"n":"20","nombre":"Chopping vessels","ver":"Un cocinero cortando alimentos con forma de vasos sanguíneos tubulares.","clinica":"El bevacizumab inhibe el crecimiento de vasos sanguíneos en los tumores (se une a VEGF).","sketchy":"Cortar los \"vasos\" representa literalmente la inhibición de la formación de vasos sanguíneos tumorales.","literal":"bevacizumab inhibits growth of blood vessels in tumors (binds VEGF)"},{"n":"21","nombre":"Cracked crab","ver":"Un cangrejo rojo agrietado sobre la mesa de la cocina.","clinica":"El bevacizumab trata tumores metastásicos (ej. cáncer colorrectal, cáncer de pulmón).","sketchy":"El cangrejo, símbolo de cáncer, marca los tumores tratados por este fármaco.","literal":"bevacizumab treats metastatic tumors (e.g. colorectal cancer, lung cancer)"},{"n":"22","nombre":"Wet center of retina pillow","ver":"Una persona sosteniendo un pan/almohada redonda con el centro húmedo y hundido.","clinica":"El bevacizumab trata la degeneración macular húmeda.","sketchy":"El centro húmedo de la forma redonda (retina) representa la degeneración macular \"húmeda\" (wet).","literal":"bevacizumab treats wet macular degeneration"},{"n":"23","nombre":"Blood spatter","ver":"Salpicaduras de sangre sobre el delantal blanco del cocinero.","clinica":"El bevacizumab puede causar sangrado.","sketchy":"Las salpicaduras de sangre son la representación literal del efecto adverso hemorrágico.","literal":"bevacizumab can cause bleeding"},{"n":"24","nombre":"Ice clots","ver":"Una jarra con líquido rosado y trozos de hielo flotando dentro.","clinica":"El bevacizumab aumenta el riesgo de eventos trombóticos.","sketchy":"Los trozos de hielo dentro del líquido representan los coágulos formándose en el torrente sanguíneo.","literal":"bevacizumab increases the risk for thrombotic events"},{"n":"25","nombre":"Perforating colon bag","ver":"Una ristra de embutidos con forma de colon, perforada y goteando.","clinica":"El bevacizumab puede causar perforación gastrointestinal.","sketchy":"El embutido-colon perforado es la representación literal de la perforación GI.","literal":"bevacizumab can cause GI perforation"},{"n":"26","nombre":"Alms","ver":"Un mendigo sosteniendo un cuenco con la palabra \"ALMS\" (limosnas) escrita.","clinica":"Alemtuzumab (anticuerpo monoclonal antitumoral).","sketchy":"\"Alms\" suena como el inicio de \"alemtuzumab\", siendo el cuenco de limosnas la clave mnemotécnica.","literal":"alemtuzumab (monoclonal antitumor antibody)"},{"n":"27","nombre":"Pulling down antibody archer and T knight","ver":"Un soldado derribando tanto a un arquero con símbolo de anticuerpo como a un caballero con cruz.","clinica":"El alemtuzumab depleta células B y T (se une a CD52).","sketchy":"A diferencia del rituximab (solo arqueros/células B), aquí caen ambos: arquero y caballero T, marcando la depleción doble.","literal":"alemtuzumab depletes B and T cells (binds CD52)"},{"n":"28","nombre":"52 pattern","ver":"Un patrón de naipes con el número 52 en el uniforme del soldado.","clinica":"El alemtuzumab se une a CD52 en células B y T.","sketchy":"El 52 (como las cartas de una baraja) es la clave numérica directa de CD52.","literal":"alemtuzumab binds CD52 on B and T cells"},{"n":"29","nombre":"Chronic tapestry with antibody archers and T knights","ver":"Un segundo tapiz colgado a la derecha con arqueros de anticuerpo y caballeros T.","clinica":"El alemtuzumab trata la leucemia linfocítica crónica (LLC).","sketchy":"El mismo tapiz \"crónico\" del rituximab se repite, marcando que ambos fármacos tratan la LLC.","literal":"alemtuzumab treats chronic lymphocytic leukemia (CLL)"},{"n":"30","nombre":"Tapestry weaver","ver":"Una mujer sentada tejiendo un tapiz en un telar, a la derecha de la escena.","clinica":"Trastuzumab (anticuerpo monoclonal antitumoral).","sketchy":"\"Tapestry\" (tapiz) suena como el inicio de \"trastuzumab\", siendo la tejedora la clave mnemotécnica.","literal":"trastuzumab (monoclonal antitumor antibody)"},{"n":"31","nombre":"Her 2 babies","ver":"Dos bebés asomando dentro de un columpio de llanta, junto a la tejedora.","clinica":"El trastuzumab se une al receptor 2 del factor de crecimiento epidérmico (HER2, c-erbB2).","sketchy":"\"Her 2 babies\" (sus 2 bebés) es la clave mnemotécnica literal de HER2.","literal":"trastuzumab binds epidermal growth factor receptor 2 (HER2, c-erbB2)"},{"n":"32","nombre":"Tire swing","ver":"El columpio de llanta del que cuelgan los dos bebés.","clinica":"El HER2 es un receptor tirosina quinasa.","sketchy":"La llanta (\"tire\") vuelve a marcar \"tyrosine kinase\", igual que con el EGFR.","literal":"HER2 is a receptor tyrosine kinase"},{"n":"33","nombre":"Crab bra","ver":"La tejedora vistiendo un corpiño con forma de cangrejo sobre el pecho.","clinica":"El trastuzumab trata el cáncer de mama HER2 positivo.","sketchy":"El cangrejo (cáncer) situado sobre el pecho marca directamente el cáncer de mama.","literal":"trastuzumab treats HER2 positive breast cancer"},{"n":"34","nombre":"Unraveling heart","ver":"Un corazón tejido deshilachándose y desarmándose en el borde del tapiz.","clinica":"El trastuzumab puede causar cardiotoxicidad (ej. disminución de la FEVI, insuficiencia cardíaca).","sketchy":"El corazón que se deshace representa directamente el deterioro de la función cardíaca.","literal":"trastuzumab can cause cardiotoxicity (e.g. decreased LVEF, heart failure)"}],"mapa":"imagenes/anticuerpos-monoclonales-mapa.webp","texto":"imagenes/anticuerpos-monoclonales-texto.webp"},{"slug":"antiemeticos","titulo":"Antieméticos","items":[{"n":"1","nombre":"Solitary track runner","ver":"Un corredor solitario en la pista de atletismo.","clinica":"El núcleo del tracto solitario (NTS, o centro del vómito) se ubica en el bulbo raquídeo, y recibe entradas del tracto GI, el sistema vestibular y el área postrema.","sketchy":"\"Solitary\" (solitario) es la clave mnemotécnica literal para \"nucleus tractus SOLITARIUS\".","literal":"the nucleus tractus solitarius (NTS, or vomiting center) located in the medulla, receives inputs from the GI tract, vestibular system, and area postrema"},{"n":"2","nombre":"Vomiting on track","ver":"Un corredor vomitando sobre la pista.","clinica":"El NTS proyecta neuronas hacia otros núcleos bulbares para coordinar la respuesta del vómito.","sketchy":"El vómito literal sobre la pista representa la respuesta emética coordinada por el NTS.","literal":"the NTS projects neurons to other medullary nuclei to coordinate the vomiting response"},{"n":"3","nombre":"Stomach hammer throw area","ver":"El área de lanzamiento de martillo, con forma de estómago.","clinica":"El tracto GI se comunica directamente con el núcleo del tracto solitario (NTS) vía el nervio vago (nervio craneal X), sin cruzar la barrera hematoencefálica, a través de vías neurales.","sketchy":"El área con forma de \"estómago\" en la zona de lanzamiento de martillo (vago = \"vagabundo\" que recorre distancia) representa la comunicación directa vía el nervio vago.","literal":"GI tract communicates directly with the nucleus tractus solitarius (NTS) via the vagus nerve (cranial nerve X), bypassing the blood-brain barrier through neural pathways"},{"n":"4","nombre":"Vegas sign at the stomach area","ver":"El cartel de \"Welcome to Fabulous Las Vegas\" ubicado en la zona del estómago.","clinica":"Las aferencias vagales desde el tracto GI se comunican con el NTS.","sketchy":"\"Vegas\" suena fonéticamente como \"vagal\", siendo el cartel la clave mnemotécnica directa.","literal":"vagal afferents from the GI tract communicate with the NTS"},{"n":"5","nombre":"Smiley hammer at the stomach area","ver":"Un grupo de pelotas con caritas felices (smiley) apiladas cerca del área de lanzamiento de martillo.","clinica":"La irritación GI (debido a infección, quimioterapia, distensión) causa liberación de serotonina de la mucosa.","sketchy":"Las caritas \"felices\" (smiley) representan la serotonina, hormona asociada a la felicidad, símbolo recurrente de Sketchy.","literal":"GI irritation (due to infection, chemotherapy, distension) causes mucosal serotonin release"},{"n":"6","nombre":"\"1-2-3\" Hammer Throw!","ver":"Un cartel que dice \"1-2-3 Hammer Throws\" junto al atleta lanzando el martillo.","clinica":"La serotonina activa los receptores 5HT-3 en las aferencias vagales.","sketchy":"El conteo \"1-2-3\" es la clave numérica directa para el receptor \"5HT-3\".","literal":"serotonin activates 5HT-3 receptors on the vagal afferents"},{"n":"7","nombre":"Semicircular canal","ver":"Un cartel elevado que dice \"Semicircular Canal\".","clinica":"Los canales semicirculares del sistema vestibular envían información vía el nervio vestibular (una rama del nervio craneal VIII) hacia los núcleos vestibulares en el tronco encefálico.","sketchy":"El cartel literal \"Semicircular Canal\" nombra directamente la estructura vestibular.","literal":"semicircular canals of the vestibular system send information via the vestibular nerve (a branch of CN VIII) to the vestibular nuclei in the brainstem"},{"n":"8","nombre":"Vests at the semicircular canal","ver":"Remeros con chalecos (vests) navegando bajo el cartel del canal semicircular.","clinica":"El nervio vestibulococlear (CN VIII) desde el sistema vestibular se comunica con el NTS.","sketchy":"Los \"vests\" (chalecos) suenan como \"vestibular/vestibulococlear\", clave fonética del nervio craneal VIII.","literal":"the vestibulocochlear nerve (CN VIII) from the vestibular system communicates with the NTS"},{"n":"9","nombre":"Seasick at the canal","ver":"Los remeros con aspecto de mareo (seasick) navegando por el canal.","clinica":"El sistema vestibular es responsable del vértigo y la náusea por movimiento (motion sickness).","sketchy":"El \"mareo marino\" (seasick) de los remeros representa directamente la náusea vestibular.","literal":"the vestibular system is responsible for vertigo and motion sickness (vestibular nausea)"},{"n":"10","nombre":"Extreme postures on the pommel horse next to the track","ver":"Un gimnasta en posturas extremas sobre un potro con forma de estómago, junto a un cartel \"Extreme Posture\".","clinica":"El área postrema (zona gatillo quimiorreceptora) se ubica adyacente al NTS (fuera de la barrera hematoencefálica en el cuarto ventrículo) y responde a sustancias emetógenas (agentes quimioterapéuticos).","sketchy":"Las posturas \"extremas\" fuera de lo normal representan estar \"fuera\" de la barrera hematoencefálica.","literal":"the area postrema (chemoreceptor trigger zone) is located adjacent to the NTS (outside the BBB in the 4th ventricle) and responds to emetogenic substances (chemotherapeutic agents)"},{"n":"11","nombre":"Ribbon dancer blocking the hammer throw","ver":"Una gimnasta con cinta (ribbon) bloqueando el área de lanzamiento de martillo.","clinica":"El ondansetrón antagoniza el receptor 5-HT3 en las aferencias vagales del tracto GI (trata el vómito inducido por quimioterapia o posoperatorio).","sketchy":"La cinta \"bloqueando\" el lanzamiento representa el antagonismo del receptor 5-HT3.","literal":"Ondansetron antagonizes 5-HT3 receptor on vagal afferents in the GI tract (treats chemo-induced or post-op vomiting)"},{"n":"12","nombre":"Hammer tightening gut","ver":"Un martillo apretando/estrechando una estructura con forma de intestino.","clinica":"El ondansetrón puede causar estreñimiento.","sketchy":"El \"apretar\" el intestino con el martillo representa directamente el estreñimiento.","literal":"ondansetron can cause constipation"},{"n":"13","nombre":"Hammer hitting head","ver":"Un martillo golpeando la cabeza de un personaje.","clinica":"El ondansetrón puede causar cefalea y mareo.","sketchy":"El golpe del martillo en la cabeza representa directamente la cefalea.","literal":"Ondansetron can cause headache and dizziness"},{"n":"14","nombre":"Twisted torsade's streamer","ver":"Una cinta/serpentina retorcida ondeando en el aire.","clinica":"El ondansetrón puede prolongar el intervalo QT e inducir torsades de pointes.","sketchy":"La cinta \"retorcida\" (twisted) es la representación literal de \"torsades\" (torsión).","literal":"ondansetron can prolong the QT interval and induce torsades"},{"n":"15","nombre":"Pile of smiley faces","ver":"Un montón de pelotas con caritas felices apiladas.","clinica":"El ondansetrón puede causar síndrome serotoninérgico (síntomas incluyen rigidez, temblor, hipertermia, confusión).","sketchy":"El montón de \"caritas felices\" (serotonina) representa el exceso serotoninérgico causante del síndrome.","literal":"Ondansetron can cause serotonin syndrome (symptoms include rigidity, tremor, hyperthermia, confusion)"},{"n":"16","nombre":"Allergy inducing, Q shaped dandelions","ver":"Dientes de león con forma de \"Q\" que provocan alergia (estornudos).","clinica":"El sistema vestibular contiene receptores de histamina H1 (acoplados a Gq).","sketchy":"Los dientes de león \"que provocan alergia\" representan la histamina, y la forma \"Q\" marca la proteína Gq acoplada.","literal":"the vestibular system contains H1 histamine receptors (coupled to Gq)"},{"n":"17","nombre":"Bee swatters","ver":"Matamoscas usados contra abejas.","clinica":"Los bloqueadores H1 de primera generación (difenhidramina, meclizina) tratan la náusea vestibular (mareo por movimiento).","sketchy":"\"Bee\" (abeja = histamina) siendo \"golpeada/bloqueada\" (swatter) representa el bloqueo de los receptores H1.","literal":"1st generation H1 receptor blockers (diphenhydramine, meclizine) treat vestibular nausea (motion sickness)"},{"n":"18","nombre":"M1 motorcycle parking","ver":"Motocicletas estacionadas en un espacio marcado \"M1\".","clinica":"El sistema vestibular contiene receptores muscarínicos M1.","sketchy":"El estacionamiento marcado \"M1\" es la clave directa del receptor muscarínico M1.","literal":"the vestibular system contains M1 muscarinic receptors"},{"n":"19","nombre":"Telescope","ver":"Un catalejo/telescopio sostenido por uno de los atletas.","clinica":"La escopolamina (agonista muscarínico) trata la náusea vestibular (mareo por movimiento).","sketchy":"\"Telescope\" suena fonéticamente similar al inicio de \"scopolamine\".","literal":"scopolamine (muscarinic agonist) treats vestibular nausea (motion sickness)"},{"n":"20","nombre":"Seasick Sailor outfits","ver":"Trajes de marinero mareado que visten los remeros.","clinica":"El mareo por movimiento (náusea vestibular) se trata con antagonistas H1 de primera generación (difenhidramina) y escopolamina.","sketchy":"El traje de \"marinero mareado\" representa directamente el mareo por movimiento tratado.","literal":"motion sickness (vestibular nausea) is treated with 1st generation H1 antagonists (diphenhydramine) and scopolamine"},{"n":"21","nombre":"Extreme posture 2 D-Ring ropes","ver":"Dos cuerdas con anillas en forma de \"D\" en el área de posturas extremas.","clinica":"El área postrema contiene receptores D2.","sketchy":"Las anillas en forma de \"D\" son la clave literal directa del receptor D2.","literal":"the area postrema contains D2 receptors"},{"n":"22","nombre":"Tickler blocking the D-rings","ver":"Un objeto/personaje bloqueando las anillas en forma de D.","clinica":"La metoclopramida antagoniza los receptores D2 en el área postrema (trata el vómito inducido por quimioterapia).","sketchy":"El bloqueo de las anillas \"D\" representa directamente el antagonismo del receptor D2.","literal":"metoclopramide antagonizes D2 receptors in the area postrema (treats chemotherapy induced vomiting)"},{"n":"23","nombre":"Contracted stomach","ver":"Un estómago contraído/apretado en la escena.","clinica":"La metoclopramida tiene efectos procinéticos en el tracto GI superior (aumento de peristalsis esofágica, disminución de presión del esfínter esofágico inferior y vaciamiento gástrico mejorado) (útil en tratamiento de vaciamiento gástrico retardado por trastornos posquirúrgicos y gastroparesia diabética).","sketchy":"El estómago \"contraído\" representa el efecto procinético que aumenta la motilidad gástrica.","literal":"metoclopramide has upper GI prokinetic effects (increased esophageal peristalsis, decreased lower esophagus sphincter pressure, and enhanced gastric emptying) (useful for treatment of delayed gastric emptying due to post-surgical disorders and diabetic gastroparesis)"},{"n":"24","nombre":"\"Do not obstruct\"","ver":"Un cartel que dice \"Do not obstruct\" (Landing Area).","clinica":"La metoclopramida (antagonista D2) está contraindicada en obstrucción de intestino delgado.","sketchy":"El cartel \"no obstruir\" es la clave literal directa de la contraindicación.","literal":"metoclopramide (D2 Antagonist) is contraindicated in small bowel obstruction"},{"n":"25","nombre":"Mud puddle","ver":"Un charco de lodo en el suelo.","clinica":"La metoclopramida puede causar diarrea (efectos procinéticos).","sketchy":"El \"charco de lodo\" representa directamente la diarrea.","literal":"metoclopramide can cause diarrhea (prokinetic effects)"},{"n":"26","nombre":"Sleeping judge","ver":"Un juez durmiendo en el área de \"judging\" (jueces).","clinica":"La metoclopramida puede causar somnolencia, especialmente en ancianos.","sketchy":"El juez \"durmiendo\" representa la somnolencia como efecto adverso.","literal":"Metoclopramide can cause drowsiness, especially in the elderly"},{"n":"27","nombre":"Crying coach","ver":"Un entrenador/juez llorando en la escena.","clinica":"La metoclopramida puede causar depresión (bloqueo D2 central).","sketchy":"El llanto representa directamente la depresión.","literal":"metoclopramide can cause depression (central D2 blockade)"},{"n":"28","nombre":"EXTRA pyramidal newspaper hat","ver":"Un sombrero de papel periódico con la etiqueta \"EXTRA\" en la cabeza de uno de los personajes.","clinica":"La metoclopramida puede causar efectos extrapiramidales debido al bloqueo D2 central (distonía, acatisia, parkinsonismo).","sketchy":"\"EXTRA\" en el sombrero es la clave literal directa para \"EXTRApyramidal\".","literal":"metoclopramide can cause extrapyramidal effects due to central D2 blockade (dystonia, akathisia, parkinsonian features)"},{"n":"29","nombre":"Sticking out tongue","ver":"Un personaje sacando la lengua de forma involuntaria y repetitiva.","clinica":"La metoclopramida puede causar discinesia tardía con uso crónico (bloqueo D2 central), especialmente en ancianos.","sketchy":"El movimiento involuntario de la lengua representa directamente la discinesia tardía.","literal":"metoclopramide can cause tardive dyskinesia with chronic use (central D2 blockade), especially in the elderly"},{"n":"30","nombre":"Now More Spicy chicken","ver":"Un cartel de comida rápida \"Now More Spicy\" con un pollo.","clinica":"La metoclopramida (agonista D2, sic) puede causar síndrome neuroléptico maligno (síntomas incluyen fiebre, rigidez, cambios de estado mental, inestabilidad autonómica, rabdomiólisis).","sketchy":"Lo \"picante\" (spicy) representa la fiebre del síndrome neuroléptico maligno.","literal":"metoclopramide (D2 agonist) can cause neuroleptic malignant syndrome (symptoms include fever, rigidity, mental status changes, autonomic instability, rhabdomyolysis)"},{"n":"31","nombre":"Elevated milk release","ver":"Leche derramándose/elevándose en la escena.","clinica":"La metoclopramida puede causar niveles elevados de prolactina (bloqueo D2 central), llevando a ginecomastia, amenorrea y disminución del deseo sexual.","sketchy":"La \"leche\" elevada representa directamente la hiperprolactinemia.","literal":"metoclopramide can cause elevated prolactin levels (central D2 blockade), leading to gynecomastia, amenorrhea, and decreased sexual drive"},{"n":"32","nombre":"Twisted torsade's streamer","ver":"Una segunda cinta retorcida ondeando en el aire.","clinica":"La metoclopramida puede causar prolongación del QT e inducir torsades de pointes.","sketchy":"Mismo símbolo de la cinta retorcida usado para el ondansetrón, ahora aplicado a metoclopramida.","literal":"metoclopramide can cause QT prolongation and induce torsades"},{"n":"33","nombre":"plaNK1 pommel horse","ver":"Un potro de gimnasia con la etiqueta \"plaNK1\".","clinica":"El área postrema contiene receptores de neurokinina 1 (NK1) (activados por sustancia P).","sketchy":"\"NK1\" resaltado en \"plaNK1\" es la clave literal directa del receptor NK1.","literal":"the area postrema contains neurokinin 1 (NK1) receptors (activated by substance P)"},{"n":"34","nombre":"Substance Pee check","ver":"Un cartel que dice \"All Participants Substance Pee Check\".","clinica":"La sustancia P se une a los receptores NK1 en el área postrema.","sketchy":"\"Substance Pee\" suena como \"Substance P\", clave fonética directa.","literal":"substance P binds to the NK1 receptors in the area postrema"},{"n":"35","nombre":"\"participants\"","ver":"El grupo de \"participantes\" reunidos en la zona de control de sustancias.","clinica":"El aprepitant antagoniza los receptores NK1 en el área postrema (trata el vómito inducido por quimioterapia).","sketchy":"\"Participants\" (participantes) suena fonéticamente similar a \"aprepitant\".","literal":"aprepitant antagonizes the NK1 receptors in the area postrema (treats chemotherapy induced vomiting)"}]},{"slug":"cloranfenicol","titulo":"Cloranfenicol","items":[{"n":"1","nombre":"Ribosomal typewriter","ver":"Una máquina de escribir (typewriter) con temática ribosomal, que usa una mujer en la piscina.","clinica":"El cloranfenicol actúa sobre la subunidad ribosomal bacteriana 50S, inhibiendo la formación del enlace peptídico y deteniendo la traducción.","sketchy":"La \"máquina de escribir\" (que forma palabras/enlaces letra por letra) representa la formación del enlace peptídico detenida.","literal":"Chloramphenicol acts on bacterial 50S ribosomal subunit, inhibiting peptide bond formation and halting translation"},{"n":"2","nombre":"Meningitis space helmet","ver":"Un casco tipo espacial (space helmet) que lleva puesto un niño en la piscina.","clinica":"El cloranfenicol puede usarse como tratamiento empírico para la meningitis en países en desarrollo (ej. Strep pneumoniae, Haemophilus influenzae, Neisseria meningitidis).","sketchy":"El casco (sobre la cabeza) representa la meningitis, mismo símbolo usado en otras series.","literal":"Chloramphenicol can be used as empiric treatment for meningitis in developing countries (e.g. Strep pneumoniae, Haemophilus influenzae, Neisseria meningitidis)"},{"n":"3","nombre":"Earth ball","ver":"Un globo terráqueo (Earth ball) flotando sobre la piscina.","clinica":"El cloranfenicol se usa en países en desarrollo.","sketchy":"El \"globo terráqueo\" representa el uso global/mundial en países en desarrollo.","literal":"Chloramphenicol is used in developing countries"},{"n":"4","nombre":"Spotted hand and foot rock climber","ver":"Una niña escalando un muro de roca, con manchas en manos y pies (spotted hand and foot).","clinica":"El cloranfenicol es un agente alternativo en infecciones rickettsiales severas (ej. fiebre manchada de las Montañas Rocosas, enfermedad transmitida por garrapatas causada por Rickettsia rickettsii).","sketchy":"Las \"manchas en manos y pies\" representan literalmente el rash de la fiebre manchada de las Montañas Rocosas (afecta palmas y plantas).","literal":"Chloramphenicol is an alternative agent in serious rickettsial infections (e.g. Rocky Mountain spotted fever - tick borne disease caused by Rickettsia rickettsii)"},{"n":"5","nombre":"Deflated inner tubes","ver":"Flotadores/salvavidas desinflados (deflated inner tubes) en el suelo de la piscina.","clinica":"El cloranfenicol puede causar anemia debido a supresión reversible relacionada con la dosis de la producción de glóbulos rojos.","sketchy":"Los flotadores \"desinflados\" representan la producción disminuida (desinflada) de glóbulos rojos.","literal":"Chloramphenicol can cause anemia due to dose related reversible suppression of RBC production"},{"n":"6","nombre":"Plastic bone","ver":"Un hueso de plástico (plastic bone) flotando en la piscina.","clinica":"El cloranfenicol puede causar anemia aplásica (condición en la cual la médula ósea falla en producir glóbulos rojos, blancos y plaquetas, llevando a pancitopenia).","sketchy":"El hueso \"de plástico\" (falso/no funcional, sin producir nada) representa la médula ósea fallando en producir células (anemia aplásica).","literal":"Chloramphenicol can cause aplastic anemia (condition in which the bone marrow fails to produce red cells, white cells, and platelets, leading to pancytopenia)"},{"n":"7","nombre":"Grey baby","ver":"Un bebé de color gris (grey baby) flotando en un flotador rojo.","clinica":"La acumulación de cloranfenicol en recién nacidos (debido a un sistema de conjugación de ácido glucurónico ineficaz) causa flacidez, hipotermia y shock (\"síndrome del bebé gris\").","sketchy":"El \"bebé gris\" es la representación literal directa del \"grey baby syndrome\".","literal":"Accumulation of chloramphenicol in newborns (due to ineffective glucuronic acid conjugation system) causes flaccidity, hypothermia, and shock (\"grey baby syndrome\")"},{"n":"8","nombre":"Paper jam","ver":"Un atasco de papel (paper jam) en la máquina de escribir.","clinica":"El cloranfenicol es bacteriostático.","sketchy":"El \"atasco de papel\" (que detiene pero no destruye la máquina) representa el efecto bacteriostático (frena, no mata).","literal":"Chloramphenicol is bacteriostatic"}]},{"slug":"inhibidores-acetilcolinesterasa","titulo":"Inhibidores de la acetilcolinesterasa","items":[{"n":"1","nombre":"Indirect view of Acetyl-cola® mime","ver":"Un mimo bebiendo de una botella de refresco \"Acetyl-cola\", visto de forma indirecta a través de una ventana.","clinica":"Colinomiméticos indirectos (inhiben la acetilcolinesterasa).","sketchy":"La vista \"indirecta\" (a través del vidrio) representa el mecanismo indirecto: no imitan a la acetilcolina, sino que impiden su degradación.","literal":"indirect cholinomimetics (inhibit acetylcholinesterase)"},{"n":"2","nombre":"Dumpster of acetyl-cola bottles","ver":"Un contenedor de basura lleno de botellas de \"Acetyl-cola\".","clinica":"La acetilcolinesterasa degrada la acetilcolina (ACh).","sketchy":"El contenedor de basura representa la degradación/descarte de la acetilcolina por la enzima.","literal":"acetylcholinesterase degrades acetylcholine (ACh)"},{"n":"3","nombre":"Knocked-over dumpster with acetyl-cola spilling out","ver":"El contenedor de basura volcado, derramando botellas de \"Acetyl-cola\" por la calle.","clinica":"Los inhibidores de la acetilcolinesterasa aumentan las concentraciones sinápticas de ACh.","sketchy":"El derrame de botellas fuera del contenedor representa el aumento de acetilcolina disponible al no ser degradada.","literal":"acetylcholinesterase inhibitors increase synaptic concentrations of ACh"},{"n":"4","nombre":"ANTI-ESTablishment","ver":"Un grafiti que dice \"ANTI-ESTablishment\" en la pared.","clinica":"Anti-colinesterasa, también conocido como inhibidor de la acetilcolinesterasa.","sketchy":"\"ANTI-EST\" resaltado deletrea \"anti-esterasa\" (anti-cholinesterase), clave literal del término.","literal":"anti-cholinesterase, a.k.a. acetylcholinesterase inhibitor"},{"n":"5","nombre":"STIGMA","ver":"Un grafiti que dice \"STIGMA\" en una pared o contenedor.","clinica":"El sufijo \"-stigmine\" de los fármacos es característico de los inhibidores de la acetilcolinesterasa.","sketchy":"\"STIGMA\" es la clave literal directa del sufijo compartido \"-stigmine\" (neostigmina, piridostigmina, fisostigmina).","literal":"\"-stigmine\" drug suffix of acetylcholinesterase inhibitors"},{"n":"6","nombre":"Skeletal muscle brick wall","ver":"Una pared de ladrillo cerca de una cabina telefónica.","clinica":"Los inhibidores de la acetilcolinesterasa potencian los efectos de la ACh en la unión neuromuscular (NMJ) (aumentan la actividad de los receptores nicotínicos de ACh).","sketchy":"La pared de \"músculo esquelético\" (ladrillos) representa el músculo esquelético en la unión neuromuscular.","literal":"acetylcholinesterase inhibitors enhance effects of ACh at the NMJ (increase activity of NICOTINIC ACh receptors)"},{"n":"7","nombre":"Electrical end plate","ver":"Un panel/caja eléctrica en la pared de ladrillo.","clinica":"Placa terminal motora (en la NMJ).","sketchy":"El panel eléctrico representa literalmente la \"placa terminal\" (end plate) donde ocurre la transmisión eléctrica/química.","literal":"motor endplate (at the NMJ)"},{"n":"8","nombre":"GRAVIS graffiti","ver":"Grafitis que dicen \"GRAVIS\" en la pared.","clinica":"Miastenia gravis (MG) → anticuerpos contra los receptores nicotínicos de ACh en la placa terminal motora (músculo esquelético).","sketchy":"\"GRAVIS\" es la clave literal directa de \"myasthenia GRAVIS\".","literal":"myasthenia gravis (MG) → antibodies against nicotinic ACh receptors at motor endplate (skeletal muscle NMJ)"},{"n":"9","nombre":"Graffiti covering electrical end plates","ver":"Grafiti cubriendo los paneles eléctricos de la pared.","clinica":"La MG causa debilidad proximal progresiva, ptosis, diplopía (receptores nicotínicos de ACh inactivados en la placa terminal motora).","sketchy":"El grafiti \"cubriendo\" los paneles eléctricos representa los receptores bloqueados/inactivados por los anticuerpos.","literal":"MG causes progressive proximal weakness, ptosis, diplopia (inactivated nicotinic ACh receptors at motor endplate)"},{"n":"10","nombre":"Community PRIDE","ver":"Un hombre sosteniendo un cartel/bastón con la palabra \"PRIDE\" (orgullo comunitario).","clinica":"Piridostigmina (inhibidor de la acetilcolinesterasa usado como tratamiento a largo plazo para MG).","sketchy":"\"PRIDE\" suena fonéticamente similar al inicio de \"PYRIDostigmine\".","literal":"PYRIDostigmine (acetylcholinesterase inhibitor used as long-term treatment for MG)"},{"n":"11","nombre":"Removing graffiti on end plates","ver":"Un hombre limpiando/removiendo el grafiti de los paneles eléctricos con una manguera.","clinica":"Los inhibidores de la acetilcolinesterasa aumentan la ACh en la placa terminal neuromuscular para superar en competencia a los anticuerpos de MG.","sketchy":"\"Remover el grafiti\" (los anticuerpos bloqueando) representa cómo el exceso de ACh desplaza competitivamente a los anticuerpos.","literal":"acetylcholinesterase inhibitors increase ACh at NMJ endplate to outcompete MG antibodies"},{"n":"12","nombre":"Neon sign STIGMA","ver":"Un letrero de neón que dice \"STIGMA\" sobre una tienda.","clinica":"Neostigmina (inhibidor de la acetilcolinesterasa usado como tratamiento para MG).","sketchy":"\"STIGMA\" en el letrero de neón (NEON sign) es la clave fonética directa de \"NEOstigmine\".","literal":"neostigmine (acetylcholinesterase inhibitor used as treatment for MG)"},{"n":"13","nombre":"Phone booth","ver":"Una cabina telefónica (phone booth) en la calle.","clinica":"Edrofonio (inhibidor de la acetilcolinesterasa que revierte transitoriamente los síntomas de MG).","sketchy":"\"Phone\" suena fonéticamente similar a \"-phonium\", clave del final de \"edroPHONIUM\".","literal":"edrophonium (acetylcholinesterase inhibitor that transiently reverses symptoms of MG)"},{"n":"14","nombre":"Quarters only","ver":"Un cartel en la cabina telefónica que dice \"Quarters only\" (solo monedas de 25 centavos).","clinica":"La piridostigmina, la neostigmina y el edrofonio son aminas cuaternarias y no penetran el SNC.","sketchy":"\"Quarters\" (monedas de 25 centavos = \"cuartos\") es la clave literal directa para \"quaternary amines\" (aminas cuaternarias).","literal":"pyridostigmine, neostigmine and edrophonium are quaternary amines and do not penetrate the CNS"},{"n":"15","nombre":"Phone in working order","ver":"Una cabina telefónica funcionando correctamente, con alguien usándola.","clinica":"El edrofonio REVIERTE la debilidad muscular en MG no tratada (prueba de tensilón POSITIVA).","sketchy":"El teléfono \"en funcionamiento\" representa la reversión positiva de la debilidad muscular (prueba positiva).","literal":"edrophonium REVERSES muscle weakness in untreated MG patients (POSITIVE tension test)"},{"n":"16","nombre":"Phone out of order, with anti-esterase graffiti","ver":"Una cabina telefónica \"fuera de servicio\" con grafiti \"ANTI-ESTablishment\" cerca.","clinica":"El edrofonio FALLA en revertir la debilidad muscular durante la crisis colinérgica (prueba de tensilón NEGATIVA).","sketchy":"El teléfono \"fuera de servicio\" representa el fallo en revertir la debilidad (prueba negativa) durante una crisis colinérgica (exceso de anticolinesterasa).","literal":"edrophonium FAILS to reverse muscle weakness during cholinergic crisis (NEGATIVE tension test)"},{"n":"17","nombre":"CURARE crayons stuck in end plate","ver":"Crayones etiquetados \"CURARE\" atascados en uno de los paneles eléctricos.","clinica":"Los agentes bloqueadores neuromusculares no despolarizantes (ej. tubocurarina, pancuronio, cisatracurio) inhiben los receptores nicotínicos de ACh en la placa terminal de la NMJ.","sketchy":"\"CURARE\" en los crayones es la clave literal directa para \"tuboCURArine\" y la clase de bloqueadores no despolarizantes.","literal":"nondepolarizing neuromuscular blocking agents (e.g. tubocurarine, pancuronium, cisatracurium) inhibit nicotinic ACh receptors at NMJ endplate"},{"n":"18","nombre":"Neon sign store owner kicking out CURARE crayon kid","ver":"El dueño de la tienda con el letrero de neón \"STIGMA\" echando al niño de los crayones \"CURARE\".","clinica":"Los inhibidores de la acetilcolinesterasa (ej. neostigmina) revierten el bloqueo neuromuscular no despolarizante.","sketchy":"\"Echar\" (kicking out) al bloqueador no despolarizante representa la reversión de su efecto por el inhibidor.","literal":"acetylcholinesterase inhibitors (e.g. neostigmine) reverse nondepolarizing neuromuscular blockade"},{"n":"19","nombre":"SUCKS","ver":"Un grafiti que dice \"SUCKS\" en la pared.","clinica":"La succinilcolina es un agente bloqueador neuromuscular despolarizante (agonista del receptor nicotínico de ACh).","sketchy":"\"SUCKS\" suena fonéticamente similar al inicio de \"SUCCinylcholine\".","literal":"succinylcholine is a depolarizing neuromuscular blocking agent (nicotinic ACh receptor AGONIST)"},{"n":"20","nombre":"Bladder hose","ver":"Una manguera conectada cerca de una estructura con forma de vejiga.","clinica":"Los inhibidores de la acetilcolinesterasa pueden usarse para tratar la retención urinaria (activación muscarínica).","sketchy":"La \"manguera de vejiga\" representa el vaciado urinario facilitado por la activación muscarínica.","literal":"acetylcholinesterase inhibitors can be used to treat urinary retention (muscarinic activation)"},{"n":"21","nombre":"PHYS ED center","ver":"Un letrero grande que dice \"PHYS ED Community Rec Center\".","clinica":"Fisostigmina (inhibidor de la acetilcolinesterasa con efectos CENTRALES).","sketchy":"\"PHYS ED\" suena fonéticamente como el inicio de \"PHYSostigmine\", y el centro comunitario representa el sistema nervioso \"central\".","literal":"PHYSostigmine (acetylcholinesterase inhibitor with CENTRAL effects)"},{"n":"22","nombre":"Atropine in Wonderland","ver":"Un mural/grafiti de Alicia en el País de las Maravillas cerca del centro comunitario.","clinica":"La sobredosis de atropina → \"loco como sombrerero, caliente como liebre, ciego como murciélago\" (revertida por fisostigmina).","sketchy":"El escenario de \"Wonderland\" (Alicia) evoca directamente la mnemotecnia clásica del toxíndrome anticolinérgico por atropina.","literal":"atropine overdose → \"mad as a hatter, hot as a hare, blind as a bat\" (reversed by physostigmine)"},{"n":"23","nombre":"Deadly nightshade","ver":"Una figura del mural con apariencia de planta venenosa (\"Deadly Nightshade\").","clinica":"La flor belladona es una forma natural de atropina (la sobredosis se revierte con fisostigmina).","sketchy":"\"Deadly nightshade\" es el nombre común de la belladona, representada directamente en el mural.","literal":"belladonna flower is a naturally occurring form of atropine (overdose reversed by physostigmine)"},{"n":"24","nombre":"GYM weeds","ver":"Malezas cerca del letrero \"GYM\" (gimnasio).","clinica":"La hierba Jimson (Jimson weed) es una forma natural de atropina (la sobredosis se revierte con fisostigmina).","sketchy":"\"GYM weeds\" suena fonéticamente como \"JiMson weed\".","literal":"Jimson weed is a naturally occurring form of atropine (overdose reversed by physostigmine)"},{"n":"25","nombre":"PHYS ED teacher reprimanding atropine \"artist\"","ver":"Un maestro de educación física (PHYS ED) regañando al \"artista\" que pintó el grafiti de atropina/Wonderland.","clinica":"La fisostigmina revierte la sobredosis de atropina (efectos periféricos y CENTRALES).","sketchy":"El maestro \"PHYS ED\" (fisostigmina) reprendiendo/corrigiendo al artista representa la reversión de la sobredosis.","literal":"physostigmine reverses atropine overdose (peripheral and CENTRAL effects)"},{"n":"26","nombre":"\"Your brain on drugs\"","ver":"Un cartel que muestra un cerebro con la leyenda \"Your brain on drugs\".","clinica":"La fisostigmina (y los organofosforados) entran al SNC para causar efectos colinérgicos centrales.","sketchy":"El cartel del cerebro \"en drogas\" representa directamente el ingreso al sistema nervioso central.","literal":"physostigmine (and organophosphates) enters CNS to cause central cholinergic effects"},{"n":"27","nombre":"DUMBBELLS","ver":"Un hombre haciendo ejercicio con mancuernas (dumbbells) en el gimnasio.","clinica":"Toxicidad por inhibidores de la acetilcolinesterasa (Diarrea, Urination, Miosis, Bronchospasm, Bradycardia, Lacrimation, Salivation).","sketchy":"\"DUMBBELLS\" con las letras resaltadas deletrea el acrónimo mnemotécnico DUMBBELS de la toxicidad colinérgica.","literal":"acetylcholinesterase inhibitor toxicity (Diarrhea, Urination, Miosis, Bronchospasm, Bradycardia, Lacrimation, Salivation)"},{"n":"28","nombre":"Weak nicotine kid","ver":"Un niño de aspecto débil cerca del gimnasio, sudando.","clinica":"La toxicidad del inhibidor de la acetilcolinesterasa incluye parálisis flácida (por sobreactivación del receptor nicotínico de ACh en la NMJ).","sketchy":"El niño \"débil\" representa la parálisis flácida por exceso de estimulación nicotínica.","literal":"acetylcholinesterase inhibitor toxicity includes flaccid paralysis (NMJ nicotinic ACh receptor over-activation)"},{"n":"29","nombre":"THIOL spray","ver":"Un aerosol/spray con etiqueta relacionada a \"THIOL\" siendo rociado por un trabajador.","clinica":"Los insecticidas (paratión, malatión, ecotiofato) son organofosforados, un tipo de inhibidor de la acetilcolinesterasa (también incluye agentes nerviosos y herbicidas).","sketchy":"El spray de insecticida representa directamente la exposición a organofosforados.","literal":"insecticides (parathion, malathion, echothiophate) are organophosphates, a type of acetylcholinesterase inhibitor (also includes nerve agents and herbicides)"},{"n":"30","nombre":"Green fumes","ver":"Vapores verdes tóxicos elevándose de un contenedor cerca del gimnasio.","clinica":"Los organofosforados son una causa mayor de toxicidad colinérgica aguda (DUMBBELS).","sketchy":"Los vapores verdes tóxicos representan la exposición aguda a organofosforados causante del síndrome DUMBBELS.","literal":"organophosphates are a major cause of acute cholinergic toxicity (DUMBBELS)"},{"n":"31","nombre":"\"Your brain on drugs\"","ver":"El mismo cartel del cerebro cerca del hombre con síntomas.","clinica":"La fisostigmina (y los organofosforados) entran al SNC para causar efectos colinérgicos centrales.","sketchy":"Repite el símbolo del cerebro \"en drogas\" para reforzar el ingreso al SNC, ahora en el contexto de organofosforados.","literal":"physostigmine (and organophosphates) enters CNS to cause central cholinergic effects"},{"n":"32","nombre":"Closing LID on TOXIC spray","ver":"Un hombre cerrando la tapa (LID) de un contenedor etiquetado \"Toxic Waste\" con un letrero \"Put a lid on toxic waste\".","clinica":"La pralidoxima revierte la toxicidad por organofosforados (DUMBBELS).","sketchy":"\"praLIDoxime\" con \"LID\" resaltado, representado por el acto literal de \"poner una tapa\" (lid) al veneno.","literal":"praLIDoxime reverses organophosphate toxicity (DUMBBELS)"},{"n":"33","nombre":"New toxic waste dumpsters","ver":"Contenedores nuevos de desechos tóxicos junto al hombre que cierra la tapa.","clinica":"La pralidoxima regenera la acetilcolinesterasa en los receptores muscarínicos y NICOTÍNICOS (revierte la toxicidad colinérgica INCLUYENDO la parálisis flácida).","sketchy":"Los contenedores \"nuevos\" (regenerados/reemplazados) representan la regeneración de la enzima acetilcolinesterasa.","literal":"pralidoxime regenerates acetylcholinesterase at muscarinic and NICOTINIC receptors (reverses cholinergic toxicity INCLUDING FLACCID PARALYSIS)"},{"n":"34","nombre":"Atropine Alice is in your head","ver":"El personaje de Alicia dibujado saliendo/dentro de la cabeza de una persona en el mural.","clinica":"La atropina revierte tanto la toxicidad muscarínica periférica como CENTRAL por organofosforados (la pralidoxima es solo periférica).","sketchy":"Alicia \"dentro de la cabeza\" representa el efecto central de la atropina, en contraste con la pralidoxima que actúa solo en la periferia.","literal":"atropine reverses both peripheral and CENTRAL muscarinic toxicity from organophosphate poisoning (pralidoxime is peripheral only)"},{"n":"35","nombre":"Old pest-control man","ver":"Un hombre mayor con equipo de control de plagas rociando cerca del contenedor.","clinica":"El \"envejecimiento\" (aging) del complejo organofosforado-colinesterasa lleva a una unión irreversible.","sketchy":"El hombre \"viejo\" (old) de control de plagas representa literalmente el fenómeno de \"aging\" del complejo enzimático.","literal":"\"aging\" of the organophosphate-cholinesterase complex leads to irreversible binding"},{"n":"36","nombre":"Corroded dumpster","ver":"Un contenedor de basura corroído/oxidado en la escena.","clinica":"La pralidoxima es ineficaz una vez que ha ocurrido el \"aging\" del complejo organofosforado-colinesterasa.","sketchy":"El contenedor \"corroído\" representa el complejo enzimático ya envejecido/dañado permanentemente, que la pralidoxima no puede revertir.","literal":"pralidoxime is ineffective once aging of the organophosphatecholinesterase complex has occurred"},{"n":"37","nombre":"Alzheimer's GALA","ver":"Un cartel/pancarta que anuncia una \"Alzheimer's Gala\" con ancianos sentados en mesas.","clinica":"Galantamina (inhibidor de la acetilcolinesterasa usado para tratar la enfermedad de Alzheimer).","sketchy":"\"GALA\" es la clave literal directa para \"GALAntamine\".","literal":"galantamine (acetylcholinesterase inhibitor used to treat Alzheimer's disease)"},{"n":"38","nombre":"REVERSE the STIGMA","ver":"Un cartel que dice \"REVERSE the STIGMA\" en la escena de la gala.","clinica":"Rivastigmina (inhibidor de la acetilcolinesterasa usado para tratar la enfermedad de Alzheimer).","sketchy":"\"RIvastigmine\" se forma combinando \"REVERSE\" (RI-) con \"STIGMA\" (-stigmine), ambos resaltados en el cartel.","literal":"rivastigmine (acetylcholinesterase inhibitor used to treat Alzheimer's disease)"},{"n":"39","nombre":"Done with brain puzzle","ver":"Un anciano terminando un rompecabezas con forma de cerebro sobre la mesa.","clinica":"Donepezilo (inhibidor de la acetilcolinesterasa usado para tratar la enfermedad de Alzheimer).","sketchy":"\"Done\" (terminado) suena fonéticamente similar al inicio de \"DONEpezil\".","literal":"donepezil (acetylcholinesterase inhibitor used to treat Alzheimer's disease)"},{"n":"40","nombre":"Brain puzzle","ver":"El rompecabezas con forma de cerebro completo sobre la mesa.","clinica":"La galantamina, rivastigmina y donepezilo penetran el SNC.","sketchy":"El rompecabezas \"de cerebro\" representa directamente la penetración al sistema nervioso central de estos tres fármacos.","literal":"galantamine, rivastigmine, and donepezil penetrate the CNS"}]},{"slug":"macrolidos","titulo":"Macrólidos","items":[{"n":"1","nombre":"Crow","ver":"Un cuervo negro posado sobre la armadura, en el centro de la escena gótica.","clinica":"Macrólidos (ej. eritromicina, azitromicina, claritromicina y fidaxomicina).","sketchy":"El cuervo (\"crow\") es el símbolo fijo de los macrólidos en toda la serie, y la escena entera es un homenaje a Edgar Allan Poe.","literal":"Macrolides (e.g., erythromycin, azithromycin, clarithromycin, and fidaxomicin)"},{"n":"2","nombre":"Ribosomal typewriters","ver":"Máquinas de escribir antiguas colocadas sobre la mesa y cajas de la escena.","clinica":"Los macrólidos se unen a la subunidad ribosomal 50S → previenen la translocación ribosomal → inhiben la síntesis proteica.","sketchy":"La máquina de escribir representa el ribosoma \"escribiendo\" proteínas; bloquearla detiene la síntesis proteica.","literal":"Macrolides bind the 50S ribosomal subunit → prevent ribosomal translocation → inhibit protein synthesis"},{"n":"3","nombre":"Paper jam","ver":"Papel atascado y arrugado saliendo de la máquina de escribir.","clinica":"Los macrólidos son antibióticos bacterioSTÁTICOS (excepto la fidaxomicina, que es bactericida).","sketchy":"El atasco de papel detiene la máquina sin destruirla: representa el efecto bacteriostático (frena el crecimiento, no mata).","literal":"Macrolides are bacterioSTATIC antibiotics (except for fidaxomicin, which is bactericidal)"},{"n":"4","nombre":"Candle snuffer","ver":"Un apagavelas dorado sobre la mesa, apagando la llama de una vela.","clinica":"Los macrólidos disminuyen la inflamación respiratoria, lo que los hace agentes útiles para prevenir exacerbaciones y/o infecciones en enfermedad pulmonar crónica (ej. EPOC, fibrosis quística y bronquiectasias).","sketchy":"Apagar la llama representa apagar la inflamación (el fuego es el símbolo fijo de inflamación en Sketchy).","literal":"Macrolides decrease respiratory inflammation, which makes them useful agents for preventing flare-ups and/or infections in chronic lung disease (e.g., COPD, CF, and bronchiectasis)"},{"n":"5","nombre":"Poopy puddle","ver":"Un charco marrón en el suelo de madera, cerca de la silla.","clinica":"Los macrólidos aumentan la motilidad gastrointestinal (es decir, son agentes procinéticos GI).","sketchy":"El charco representa el efecto procinético: aceleran el tránsito intestinal, con diarrea como efecto adverso.","literal":"Macrolides increase gastrointestinal motility (i.e., GI prokinetic agent)"},{"n":"6","nombre":"Rainbow spectrum","ver":"Un arcoíris entrando por la ventana gótica e iluminando la habitación.","clinica":"Los macrólidos son antimicrobianos de amplio espectro (incluyendo gram-positivos, gram-negativos y atípicos).","sketchy":"El arcoíris (\"spectrum\") es la representación literal del amplio espectro de cobertura.","literal":"Macrolides are broad spectrum antimicrobials (including gram-positives, gram-negatives, and atypicals)"},{"n":"7","nombre":"Rusty chest plate","ver":"Una armadura medieval con el peto oxidado y manchado, de pie junto a la ventana.","clinica":"La azitromicina y la claritromicina tratan la neumonía adquirida en la comunidad (causada por Streptococcus pneumoniae, Haemophilus influenzae, Moraxella catarrhalis).","sketchy":"El peto (chest plate) oxidado sobre el tórax representa la infección pulmonar (neumonía).","literal":"Azithromycin and clarithromycin treat community acquired pneumonia (caused by Streptococcus pneumoniae, Haemophilus influenzae, Moraxella catarrhalis)"},{"n":"8","nombre":"Legion of ships + Clam Lady","ver":"Barcos visibles a través de la ventana y una mujer de pie sobre una concha marina, tipo el nacimiento de Venus.","clinica":"La azitromicina trata la neumonía atípica causada por Legionella y Chlamydia.","sketchy":"La \"legión\" de barcos es la clave de Legionella, y la dama de la concha (\"clam\") la de Chlamydia.","literal":"Azithromycin treats atypical pneumonia caused by Legionella and Chlamydia"},{"n":"9","nombre":"Mycoplasma mic","ver":"Un hombre sosteniendo un micrófono antiguo cerca de la ventana.","clinica":"La azitromicina trata Mycoplasma pneumoniae (neumonía atípica o \"walking pneumonia\").","sketchy":"\"Mic\" (micrófono) es la clave mnemotécnica fija de Mycoplasma.","literal":"Azithromycin treats Mycoplasma pneumonia (walking pneumonia)"},{"n":"10","nombre":"Pertussi board","ver":"Un tablero de juego sobre la mesa etiquetado \"Pertussi\".","clinica":"Los macrólidos están indicados para el tratamiento de Bordetella pertussis (tos ferina).","sketchy":"El nombre \"Pertussi\" en el tablero es la clave literal de Bordetella pertussis.","literal":"Macrolides are indicated for treatment of Bordetella pertussis (whooping cough)"},{"n":"11","nombre":"PPX shield on pertussi board","ver":"Un escudo con las letras \"PPX\" en el centro del tablero de Pertussi.","clinica":"Los macrólidos pueden usarse como profilaxis para Bordetella pertussis en contactos cercanos.","sketchy":"\"PPX\" es la abreviatura de \"prophylaxis\", y el escudo refuerza la idea de protección preventiva.","literal":"Macrolides can be used for prophylaxis for Bordetella pertussis in close contacts"},{"n":"12","nombre":"Bart the leopard","ver":"Un leopardo disecado junto a la chimenea, a la izquierda de la escena.","clinica":"La azitromicina se usa para tratar infecciones por Bartonella henselae (enfermedad por arañazo de gato).","sketchy":"\"Bart\" (el leopardo) es la clave de Bartonella, y al ser un felino recuerda el arañazo de gato.","literal":"Azithromycin is used to treat Bartonella henselae infections (cat-scratch fever)"},{"n":"13","nombre":"Babe the vampiress ghost","ver":"Un fantasma femenino con colmillos de vampiro flotando en el centro de la escena.","clinica":"La azitromicina se usa con atovacuona para tratar la infección por Babesia.","sketchy":"\"Babe\" es la clave de Babesia, y los colmillos de vampiro aluden a que este parásito destruye glóbulos rojos.","literal":"Azithromycin is used with atovaquone to treat Babesia infection"},{"n":"14","nombre":"Minotaur bull","ver":"Un minotauro (hombre-toro) enorme y furioso a la derecha de la escena.","clinica":"La eritromicina se usa con antitoxina para tratar la infección por Corynebacterium diphtheriae.","sketchy":"El toro es el símbolo fijo de Corynebacterium diphtheriae (por el signo del \"cuello de toro\").","literal":"Erythromycin is used with antitoxin to treat Corynebacterium diphtheriae infection"},{"n":"15","nombre":"MAC mockingbird","ver":"Un pájaro gris dentro de una jaula dorada etiquetada \"M. Avium\".","clinica":"Los macrólidos están indicados para infecciones micobacterianas (complejo Mycobacterium avium, MAC).","sketchy":"El pájaro (\"avium\" = ave) dentro de la jaula etiquetada representa directamente el complejo M. avium.","literal":"Macrolides are indicated for mycobacterial infections (Mycobacterium avium complex)"},{"n":"16","nombre":"…50 calendar","ver":"Un calendario abierto en el suelo con el número \"50\" visible.","clinica":"La azitromicina previene infecciones por MAC (profilaxis MAC) en VIH-SIDA (recuento de CD4 < 50).","sketchy":"El \"50\" del calendario es la clave numérica directa del umbral de CD4 para iniciar profilaxis.","literal":"Azithromycin prevents MAC infections (MAC prophylaxis) in HIV-AIDS (CD4 count<50)"},{"n":"17","nombre":"\"Art History A-Z\" +
