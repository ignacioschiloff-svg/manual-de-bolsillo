Nocardia"},{"n":"7","nombre":"Pink acid fast gun","ver":"Un revólver de color rosa sostenido por el vaquero de la izquierda, apuntando a la mesa.","clinica":"Nocardia asteroides tiene ácidos micólicos en su pared celular, que le permiten teñirse parcialmente de rosa/rojo con fucsina básica en la tinción ácido-alcohol resistente; la tinción parcial es más débil que la reacción completa vista en Mycobacterium tuberculosis.","sketchy":"El color rosa de la pistola es la representación literal directa de la tinción \"parcialmente rosa\" (partial acid-fast) característica de Nocardia.","literal":"Nocardia asteroides has mycolic acids (long-chain fatty acids) in its cell wall, which allow it to stain partially pink/red with carbol fuchsin in acid-fast staining, partial staining is weaker than the full acid-fast reaction seen in Mycobacterium tuberculosis, reflecting the lower mycolic acid content in Nocardia"},{"n":"8","nombre":"Catalase cat","ver":"Un gato gris sostenido en brazos por el hombre de la derecha.","clinica":"Nocardia asteroides produce catalasa (es decir, catalasa positivo), una enzima que convierte el peróxido de hidrógeno en agua y oxígeno.","sketchy":"\"Cat\" suena como el inicio de \"catalase\", el mismo símbolo recurrente usado en S. aureus y Pasteurella multocida.","literal":"Nocardia asteroides produces catalase (i.e. catalase positive), an enzyme that converts hydrogen peroxide into water and oxygen"},{"n":"9","nombre":"Ammonia spray","ver":"Un frasco/dispensador etiquetado \"NH₃\" visible en la escena del desierto.","clinica":"Nocardia asteroides produce ureasa (es decir, ureasa positivo), una enzima que hidroliza la urea en dióxido de carbono y amoníaco.","sketchy":"El frasco etiquetado \"NH₃\" (fórmula química del amoníaco) representa directamente el producto de la reacción de la ureasa.","literal":"Nocardia asteroides produces urease (i.e. urease positive), an enzyme that hydrolyzes urea into carbon dioxide and ammonia"},{"n":"10","nombre":"Immunocompromised cane + man","ver":"Un hombre apoyado en un bastón, tosiendo, en el lado derecho de la mesa.","clinica":"La nocardiosis afecta predominantemente a pacientes inmunocomprometidos y es más común en hombres que en mujeres (~2:1-3:1).","sketchy":"El bastón representa a un paciente debilitado/inmunocomprometido, y el hecho de que el personaje sea hombre refuerza la mayor prevalencia masculina.","literal":"Nocardiosis predominantly affects immunocompromised patients and is more common in men than women (~2:1-3:1)"},{"n":"11","nombre":"Dented badge over lungs","ver":"Una insignia/placa abollada sobre el pecho del hombre que tose.","clinica":"La nocardiosis pulmonar puede manifestarse con múltiples nódulos sólidos y cavidades, parecido a la tuberculosis.","sketchy":"La placa abollada (con hendiduras/cavidades) sobre el pecho representa visualmente los nódulos y cavidades pulmonares.","literal":"Pulmonary nocardiosis may manifest with multiple solid nodules and cavities, resembling tuberculosis"},{"n":"12","nombre":"Coughing","ver":"El hombre tosiendo visiblemente, con la mano en el pecho.","clinica":"Los pacientes con nocardiosis pulmonar pueden experimentar síntomas similares a los de neumonía (ej., fiebre, tos, disnea, dolor torácico pleurítico).","sketchy":"El acto de toser es la representación directa del síntoma respiratorio principal.","literal":"Patients with pulmonary nocardiosis may experience symptoms similar to pneumonia (e.g., fever, cough, dyspnea, pleuritic chest pain)"},{"n":"13","nombre":"Tuberculosis cactus","ver":"Un cactus verde en una maceta sobre la mesa.","clinica":"La nocardiosis pulmonar puede manifestarse con múltiples nódulos sólidos y cavidades, semejando tuberculosis.","sketchy":"El cactus, con sus espinas y protuberancias, representa visualmente el parecido radiológico con la tuberculosis.","literal":"Pulmonary nocardiosis may manifest with multiple solid nodules and cavities, resembling tuberculosis"},{"n":"14","nombre":"Hole in hat","ver":"Un agujero visible en el sombrero de vaquero colgado en la barra.","clinica":"La nocardiosis del SNC es una infección rara que puede presentarse con abscesos cerebrales y múltiples lesiones con realce en anillo.","sketchy":"El agujero en el sombrero (que cubre la cabeza) representa directamente el absceso cerebral y la afectación del SNC.","literal":"CNS nocardiosis is a rare infection that may present with brain abscesses and multiple ring-enhancing lesions"},{"n":"15","nombre":"Red cow spots","ver":"Manchas rojas en el chaleco de vaca (cow print) del hombre que tose.","clinica":"La nocardiosis cutánea es una manifestación rara de infección que puede resultar de inoculación directa o secundaria a infección pulmonar diseminada, presentándose de forma variable como nódulos rojos, indurados y sensibles, pústulas o lesiones ulcerativas con inflamación asociada.","sketchy":"Las manchas rojas sobre el estampado representan directamente las lesiones cutáneas rojas de la nocardiosis cutánea.","literal":"Cutaneous nocardiosis is a rare manifestation of infection that can result from direct inoculation or secondary to disseminated pulmonary infection, presenting variably as red, indurated, tender nodules, pustules, or ulcerative lesions with associated inflammation"},{"n":"16","nombre":"Sulfa eggs","ver":"Un frasco de huevos en conserva sobre la barra.","clinica":"Las sulfonamidas, específicamente trimetoprim-sulfametoxazol, son el tratamiento de elección para las infecciones por Nocardia asteroides, al inhibir la síntesis de folato bacteriano, esencial para la producción de ADN y proteínas; los ácidos micólicos de Nocardia difieren de los de Mycobacterium tuberculosis, por lo que la isoniazida es ineficaz, haciendo que el TMP-SMX sea preferido.","sketchy":"Los \"sulfa eggs\" (huevos de azufre) representan directamente las sulfonamidas (TMP-SMX).","literal":"Sulfonamides, specifically trimethoprim-sulfamethoxazole, are the treatment of choice for Nocardia asteroides infections, by inhibiting bacterial folate synthesis, essential for DNA and protein production, nocardia's mycolic acids differ from Mycobacterium tuberculosis, so isoniazid is ineffective, making TMP-SMX preferred"}],"mapa":"imagenes/nocardia-asteroides-mapa.webp","texto":"imagenes/nocardia-asteroides-texto.webp"},{"slug":"staphylococcus-aureus","titulo":"Staphylococcus aureus","items":[{"n":"1","nombre":"Golden staff","ver":"Un bastón/cetro dorado con un símbolo en la parte superior, sostenido junto al Mar Rojo.","clinica":"Staphylococcus aureus (un coco gram-positivo).","sketchy":"\"Golden\" (dorado) suena como \"aureus\" (que significa dorado en latín), siendo el color del bastón la clave mnemotécnica directa del nombre de la bacteria.","literal":"Staphylococcus aureus (a gram-positive coccus)"},{"n":"2","nombre":"Purple robe","ver":"Una túnica/manto de color púrpura que viste el hombre mayor (tipo Moisés) en el centro.","clinica":"Staphylococcus aureus es un coco gram-positivo.","sketchy":"El color púrpura de la túnica refuerza la tinción gram-positiva (violeta/púrpura en la tinción de Gram).","literal":"Staphylococcus aureus is a gram-positive coccus"},{"n":"3","nombre":"Catalase cat","ver":"Un gato negro egipcio sentado junto al personaje principal.","clinica":"Staphylococcus aureus produce catalasa (es decir, catalasa positivo), una enzima que convierte el peróxido de hidrógeno en agua y oxígeno.","sketchy":"\"Cat\" suena como el inicio de \"catalase\" (catalasa), y el gato egipcio recuerda además la prueba de burbujeo con peróxido.","literal":"Staphylococcus aureus produces catalase (i.e. catalase positive), an enzyme that converts hydrogen peroxide into water and oxygen"},{"n":"4","nombre":"Coagulated river","ver":"Un río de color rojo intenso, con textura espesa/coagulada (referencia a la plaga del Nilo convertido en sangre).","clinica":"Staphylococcus aureus produce coagulasa (es decir, coagulasa positivo), una enzima que convierte el fibrinógeno en fibrina → formación de coágulo en muestras de laboratorio; la prueba de coagulasa ayuda a distinguir Staph aureus de otros cocos gram-positivos, catalasa-positivos y coagulasa-negativos.","sketchy":"El río \"coagulado\" es la representación visual literal de la prueba de coagulasa positiva.","literal":"Staphylococcus aureus produces coagulase (i.e. coagulase positive), an enzyme that converts fibrinogen to fibrin → clot formation in test samples; the coagulase test helps distinguish Staph aureus from other gram-positive, catalase-positive, coagulase-negative cocci"},{"n":"5","nombre":"Beta light bulb","ver":"Un frasco/ampolla brillante de color rojo, con forma de bombilla, que sostiene el personaje.","clinica":"La mayoría de las cepas de Staphylococcus aureus demuestran beta-hemólisis, que se refiere a la capacidad de lisar completamente la hemoglobina → zonas claras y transparentes alrededor de las colonias en agar sangre.","sketchy":"El brillo transparente/claro de la ampolla representa la zona clara de lisis completa (beta-hemólisis) alrededor de la colonia.","literal":"Most strains of Staphylococcus aureus demonstrate beta-hemolysis, which refers to the ability to completely lyse hemoglobin → clear, transparent zones around colonies on blood agar"},{"n":"6","nombre":"Tall man in yellow","ver":"Un hombre alto y musculoso vestido de amarillo, con los brazos cruzados.","clinica":"Staphylococcus aureus puede fermentar manitol, lo que hace que el agar manitol salado se vuelva amarillo; el agar manitol salado ayuda a distinguir Staph aureus de estafilococos no patógenos, que típicamente no fermentan manitol.","sketchy":"El color amarillo de la vestimenta representa directamente el cambio de color del agar manitol salado al fermentarse.","literal":"Staphylococcus aureus can ferment mannitol, which causes mannitol salt agar to turn yellow; mannitol salt agar helps distinguish Staph aureus from non-pathogenic staphylococci, which typically do not ferment mannitol"},{"n":"7","nombre":"\"A\" bound to IgG","ver":"Un símbolo dorado en forma de \"A\" en lo alto del bastón, atado con una cuerda al personaje.","clinica":"Un factor de virulencia primario de Staphylococcus aureus es la proteína A, que se une a la región Fc de los anticuerpos IgG, inhibiendo posteriormente la activación del complemento y la fagocitosis.","sketchy":"La letra \"A\" dorada en el bastón representa directamente \"Protein A\", y el hecho de que esté \"atada/unida\" simboliza su unión a la IgG.","literal":"A primary virulence factor of Staphylococcus aureus is protein A, which binds the Fc region of IgG antibodies, subsequently inhibiting complement activation and phagocytosis"},{"n":"8","nombre":"Nose","ver":"Una roca grande con forma de nariz en primer plano.","clinica":"Staphylococcus aureus es parte de la flora normal de las fosas nasales y la piel.","sketchy":"La roca en forma de nariz es la representación literal del sitio de colonización normal (fosas nasales).","literal":"Staphylococcus aureus is part of the normal flora of the nares and skin"},{"n":"9","nombre":"Coughing + patchy cloth","ver":"Un personaje tosiendo, vestido con ropa de tela parchada/irregular.","clinica":"La neumonía causada por Staphylococcus aureus a menudo se manifiesta en radiografía de tórax como infiltrados parchados que pueden progresar a consolidación lobar.","sketchy":"La tela \"parchada\" (patchy) representa directamente el patrón radiológico de infiltrados parchados.","literal":"Pneumonia caused by Staphylococcus aureus often manifests on a chest X-ray as patchy infiltrates that may progress to lobar consolidation"},{"n":"10","nombre":"Icosahedron viral lanterns","ver":"Objetos con forma de icosaedro (como linternas geométricas) colgados sobre el camello.","clinica":"Una infección respiratoria alta, particularmente la influenza, puede predisponer a los individuos a neumonía por Staphylococcus aureus.","sketchy":"La forma icosaédrica es la representación estructural clásica de un virus (influenza), señalando la infección predisponente.","literal":"An upper respiratory infection, particularly influenza, can predispose individuals to Staphylococcus aureus pneumonia"},{"n":"11","nombre":"Joint bandages","ver":"Vendajes/ataduras en las articulaciones del camello.","clinica":"Staphylococcus aureus es la causa más común de artritis séptica, que se presenta como una articulación caliente, hinchada y sensible, junto con líquido purulento en la aspiración.","sketchy":"Los vendajes en las articulaciones representan directamente la afectación articular (artritis séptica).","literal":"Staphylococcus aureus is the most common cause of septic arthritis, which presents as a warm, swollen, and tender joint along with purulent fluid on aspiration"},{"n":"12","nombre":"Inflamed camel humps","ver":"Las jorobas del camello, de aspecto inflamado, con cristales/protuberancias saliendo de ellas.","clinica":"Staphylococcus aureus es conocido por causar una variedad de infecciones de piel y tejidos blandos, incluyendo abscesos, impétigo, furúnculos, carbuncos y celulitis.","sketchy":"Las jorobas inflamadas representan visualmente los abscesos/forúnculos típicos de las infecciones cutáneas.","literal":"Staphylococcus aureus is known to cause a range of skin and soft tissue infections, including abscesses, impetigo, furuncles, carbuncles, and cellulitis"},{"n":"13","nombre":"Hearts on running camel","ver":"Corazones dibujados sobre la montura del camello que corre rápido.","clinica":"La endocarditis infecciosa aguda, una condición que se manifiesta con fiebre de inicio rápido, escalofríos, taquicardia y sepsis, puede ser causada por Staphylococcus aureus, incluso en individuos con válvulas cardíacas previamente sanas.","sketchy":"Los corazones sobre el camello en movimiento rápido representan la endocarditis infecciosa de inicio agudo y rápido.","literal":"Acute infective endocarditis, a condition that manifests as rapid onset fever, chills, tachycardia, and sepsis, can be caused by Staphylococcus aureus, even in individuals with previously undamaged heart valves"},{"n":"14","nombre":"Three pyramids + mortar and pestle","ver":"Tres pirámides de fondo, y un mortero con mano de mortero (mortar and pestle) sostenido por la mujer sobre el camello.","clinica":"La endocarditis infecciosa de la válvula tricúspide (TVIE) causada por Staphylococcus aureus está altamente asociada al uso de drogas IV.","sketchy":"Las \"tres\" pirámides representan la válvula \"TRIcúspide\" (tres cúspides), y el mortero/pestle alude al uso de drogas (preparación de sustancias).","literal":"Tricuspid valve infective endocarditis (TVIE) caused by Staphylococcus aureus is highly associated with IV drug use"},{"n":"15","nombre":"Fish bones","ver":"Esqueletos/espinas de pescado dispersos en la arena.","clinica":"Staphylococcus aureus es la causa principal de osteomielitis, una inflamación o hinchazón del hueso típicamente causada por infección.","sketchy":"Las espinas de pescado representan el hueso (esqueleto), señalando la osteomielitis.","literal":"Staphylococcus aureus is the leading cause of osteomyelitis, an inflammation or swelling of bone typically caused by infection"},{"n":"16","nombre":"Exfoliative burn","ver":"Un personaje tocándose la cara/cabeza como si sintiera una quemadura, con vapor saliendo de su piel.","clinica":"Ciertas cepas de Staphylococcus aureus producen una toxina exfoliativa que puede llevar al síndrome de piel escaldada, una condición caracterizada por descamación cutánea generalizada.","sketchy":"La sensación de \"quemadura/escaldado\" en la piel representa directamente el síndrome de piel escaldada por toxina exfoliativa.","literal":"Certain strains of Staphylococcus aureus produce an exfoliative toxin that can lead to scalded skin syndrome, a condition characterized by widespread skin peeling"},{"n":"17","nombre":"Superhero cape + bolt","ver":"Una capa roja de superhéroe con un rayo/bolt bordado, que viste el personaje.","clinica":"Algunas cepas de Staphylococcus aureus producen una exotoxina superantígeno, resultando en síndrome de shock tóxico (TSS); el TSS se caracteriza por fiebre alta, un rash descamativo y shock (presión arterial baja y/o frecuencia cardíaca muy alta).","sketchy":"La capa de \"superhéroe\" representa el \"superantígeno\", y el rayo simboliza el shock (choque eléctrico = shock tóxico).","literal":"Some strains of Staphylococcus aureus produce a superantigen exotoxin, resulting in toxic shock syndrome (TSS); TSS is characterized by a high fever, a desquamative rash, and shock (low blood pressure and/or very high heart rate)"},{"n":"18","nombre":"Rapid camel running + nausea","ver":"Un camello corriendo rápidamente, con dos personajes montados que se ven con náuseas/malestar.","clinica":"La ingestión de enterotoxina preformada producida por Staphylococcus aureus puede causar una forma de intoxicación alimentaria de inicio rápido (los síntomas usualmente se desarrollan entre 30 min y 8 h), caracterizada por náuseas súbitas, vómito y calambres estomacales.","sketchy":"El camello corriendo \"rápido\" representa el inicio rápido del cuadro de intoxicación alimentaria.","literal":"Ingestion of preformed enterotoxin made by Staphylococcus aureus can cause a rapid-onset form of food poisoning (Sx usually develop within 30 m - 8 h), characterized by a sudden nausea, vomiting, and stomach cramps"},{"n":"19","nombre":"Mayo and meats","ver":"Un frasco de mayonesa y trozos de carne colgando en la montura del camello.","clinica":"La ingestión de alimentos contaminados con enterotoxina de Staphylococcus aureus, notablemente ítems como mayonesa y carnes, puede resultar en enteritis estafilocócica.","sketchy":"La mayonesa y la carne son los alimentos clásicos asociados a este tipo de intoxicación alimentaria, representados literalmente.","literal":"Ingestion of food contaminated with Staphylococcus aureus enterotoxin, notably items like mayonnaise and meats, can result in staphylococcal enteritis"},{"n":"20","nombre":"Merciful pharaoh","ver":"Un faraón egipcio con los brazos extendidos en gesto de \"misericordia/clemencia\".","clinica":"Ciertas cepas de Staphylococcus aureus han desarrollado resistencia a los antibióticos beta-lactámicos, notablemente incluyendo la meticilina (Staphylococcus aureus resistente a meticilina, MRSA).","sketchy":"El faraón \"merciful\" (misericordioso/piadoso) suena similar a \"meticillin\", y su gesto de \"perdonar/resistir\" al ataque representa la resistencia antibiótica.","literal":"Certain strains of Staphylococcus aureus have developed resistance to beta-lactam antibiotics, notably including methicillin (methicillin-resistant Staphylococcus aureus (MRSA))"},{"n":"21","nombre":"Altered builders","ver":"Trabajadores/constructores egipcios con apariencia alterada (de color verde, tipo momia/anubis) construyendo la pirámide.","clinica":"Las cepas de MRSA tienen proteínas de unión a penicilina modificadas, lo que impide la unión de los antibióticos beta-lactámicos a las paredes celulares bacterianas.","sketchy":"Los \"constructores alterados\" representan las proteínas de unión (constructoras de la pared celular) que han sido modificadas/alteradas, impidiendo la unión del antibiótico.","literal":"MRSA strains have modified penicillin-binding proteins, which hinder the binding of beta-lactam antibiotics to bacterial cell walls"},{"n":"22","nombre":"Purple caravan","ver":"Una carreta/caravana con un toldo de tela púrpura.","clinica":"La vancomicina es efectiva contra las infecciones por MRSA.","sketchy":"El color púrpura del toldo es el color mnemotécnico clásico de Sketchy asociado a \"vancomicina\".","literal":"Vancomycin is effective against MRSA infections"},{"n":"23","nombre":"Pencil staff","ver":"Un bastón/cetro con forma de lápiz que sostiene el faraón vestido de azul y blanco.","clinica":"La nafcilina, un antibiótico beta-lactámico, es efectiva contra las infecciones por Staphylococcus aureus no-MRSA.","sketchy":"El \"lápiz\" (pencil) suena fonéticamente similar al inicio de \"nafcillin\", vinculando el objeto con el fármaco.","literal":"Nafcillin, a beta-lactam antibiotic, is effective against non-MRSA Staphylococcus aureus infections"}],"mapa":"imagenes/staphylococcus-aureus-mapa.webp","texto":"imagenes/staphylococcus-aureus-texto.webp"},{"slug":"staphylococcus-epidermidis-saprophyticus","titulo":"Staphylococcus epidermidis & saprophyticus","items":[{"n":"1","nombre":"Plumber","ver":"Un plomero reparando las tuberías bajo el fregadero de la cocina.","clinica":"Staphylococcus epidermidis (un coco gram-positivo).","sketchy":"El plomero, que trabaja en las \"tuberías\" (superficies y conductos), sirve como personaje ancla para \"epidermidis\", relacionado con la piel.","literal":"Staphylococcus epidermidis (a gram-positive coccus)"},{"n":"2","nombre":"Girl sitting on counter","ver":"Una chica sentada sobre la encimera de la cocina.","clinica":"Staphylococcus saprophyticus (un coco gram-positivo).","sketchy":"La chica \"sitting\" (sentada) es la clave fonética para \"saprophyticus\", jugando con el sonido en la escena.","literal":"Staphylococcus saprophyticus (a gram-positive coccus)"},{"n":"3","nombre":"Purple hues","ver":"Tonos púrpura predominantes en las cortinas de la cocina.","clinica":"Staphylococcus epidermidis y saprophyticus son cocos gram-positivos.","sketchy":"El color púrpura refuerza la tinción gram-positiva de ambas especies.","literal":"Staphylococcus epidermidis and saprophyticus are gram-positive cocci"},{"n":"4","nombre":"Catalase cat","ver":"Un gato sentado sobre la encimera, cerca de la ventana.","clinica":"Staphylococcus epidermidis y saprophyticus producen catalasa (es decir, catalasa positivo), una enzima que convierte el peróxido de hidrógeno en agua y oxígeno.","sketchy":"\"Cat\" suena como el inicio de \"catalase\", símbolo recurrente en toda la serie de Staphylococcus.","literal":"Staphylococcus epidermidis and saprophyticus produce catalase (i.e. catalase positive), an enzyme that converts hydrogen peroxide into water and oxygen"},{"n":"5","nombre":"Bowl of jello","ver":"Un tazón rojo con gelatina (jello) sobre la encimera.","clinica":"Staphylococcus epidermidis y saprophyticus NO producen coagulasa (es decir, coagulasa negativo), una enzima que convierte el fibrinógeno en fibrina → sin formación de coágulo; la prueba de coagulasa ayuda a distinguir estas especies de Staphylococcus aureus, que es coagulasa-positivo.","sketchy":"La gelatina sin cuajar en el tazón representa directamente la ausencia de coagulación (coagulasa negativa).","literal":"Staphylococcus epidermidis and saprophyticus do not produce coagulase (i.e. coagulase negative), an enzyme that converts fibrinogen to fibrin → no clot formation; the coagulase test helps distinguish these species from Staphylococcus aureus, which is coagulase-positive"},{"n":"6","nombre":"Moses Gell \"-\" o","ver":"Una caja etiquetada \"Moses GELL-O\" sobre la encimera.","clinica":"Staphylococcus epidermidis y saprophyticus no producen coagulasa (es decir, coagulasa negativo), distinguiéndolos de Staphylococcus aureus, que es coagulasa-positivo.","sketchy":"\"GELL-O\" con el signo \"-\" explícito refuerza literalmente \"coagulase NEGATIVE\" (coagulasa negativa).","literal":"Staphylococcus epidermidis and saprophyticus do not produce coagulase (i.e. coagulase negative), an enzyme that converts fibrinogen to fibrin → no clot formation; the coagulase test helps distinguish these species from Staphylococcus aureus, which is coagulase-positive"},{"n":"7","nombre":"Ammonia spray","ver":"Un frasco etiquetado \"NH₃\" en el fregadero de la cocina.","clinica":"Staphylococcus epidermidis y saprophyticus producen ureasa (es decir, ureasa positivo), una enzima que hidroliza la urea en dióxido de carbono y amoníaco.","sketchy":"El frasco etiquetado \"NH₃\" representa directamente el producto de la reacción de ureasa, mismo símbolo usado en Nocardia.","literal":"Staphylococcus epidermidis and saprophyticus produce urease (i.e. urease positive), an enzyme that hydrolyzes urea into carbon dioxide and ammonia"},{"n":"8","nombre":"Plumber's exposed navel","ver":"El ombligo/vientre expuesto del plomero mientras trabaja debajo del fregadero.","clinica":"Staphylococcus epidermidis es susceptible al antibiótico novobiocina, distinguiéndolo de Staphylococcus saprophyticus, que es resistente a la novobiocina.","sketchy":"El ombligo \"expuesto\" (sin protección) representa la susceptibilidad de epidermidis a la novobiocina.","literal":"Staphylococcus epidermidis is susceptible to the antibiotic novobiocin, distinguishing it from Staphylococcus saprophyticus, which is resistant to novobiocin"},{"n":"9","nombre":"Girl's covered navel","ver":"El ombligo de la chica cubierto por su camiseta rosa.","clinica":"Staphylococcus epidermidis es susceptible a la novobiocina, distinguiéndolo de Staphylococcus saprophyticus, que es resistente a la novobiocina.","sketchy":"El ombligo \"cubierto/protegido\" de la chica representa la resistencia de saprophyticus a la novobiocina.","literal":"Staphylococcus epidermidis is susceptible to the antibiotic novobiocin, distinguishing it from Staphylococcus saprophyticus, which is resistant to novobiocin"},{"n":"10","nombre":"Dirty hands","ver":"Las manos sucias del plomero mientras trabaja bajo el fregadero.","clinica":"Staphylococcus epidermidis es parte de la flora normal, comúnmente encontrada en piel y membranas mucosas.","sketchy":"Las manos sucias representan directamente la colonización cutánea normal de la bacteria.","literal":"Staphylococcus epidermidis is part of the normal flora, commonly found on skin and mucous membranes"},{"n":"11","nombre":"Petri dish pan","ver":"Una olla/sartén roja con forma de placa de Petri en el suelo, bajo el fregadero.","clinica":"Como componente de la flora normal de la piel, Staphylococcus epidermidis es un contaminante común de los hemocultivos.","sketchy":"La sartén con forma de placa de Petri representa directamente el cultivo (hemocultivo) que se ve contaminado.","literal":"As a component of the normal skin flora, Staphylococcus epidermidis is a common contaminant of blood cultures"},{"n":"12","nombre":"Plumbing joints","ver":"Las juntas/articulaciones de las tuberías reparadas por el plomero.","clinica":"Staphylococcus epidermidis es uno de los patógenos más aislados en infecciones de articulaciones protésicas.","sketchy":"Las \"juntas de tuberías\" (plumbing joints) representan literalmente las \"articulaciones protésicas\" (prosthetic joints).","literal":"Staphylococcus epidermidis is one of the most isolated pathogens in prosthetic joint infections"},{"n":"13","nombre":"Tubing","ver":"Tubería flexible que el plomero manipula bajo el fregadero.","clinica":"Staphylococcus epidermidis es una de las principales causas de infecciones asociadas a catéteres.","sketchy":"La tubería representa directamente los catéteres y dispositivos tubulares médicos.","literal":"Staphylococcus epidermidis is one of the leading causes of catheter-associated infections"},{"n":"14","nombre":"Heart valve","ver":"Una válvula con forma de corazón dentro del mecanismo de tuberías.","clinica":"Staphylococcus epidermidis es el agente causal más común de la endocarditis de válvula protésica.","sketchy":"La válvula con forma de corazón representa directamente la válvula cardíaca protésica afectada.","literal":"Staphylococcus epidermidis is the most common causative agent of prosthetic valve endocarditis"},{"n":"15","nombre":"Gunk on pipes and tubes","ver":"Sustancia pegajosa y mugre adherida a las tuberías bajo el fregadero.","clinica":"Staphylococcus epidermidis produce biofilms (matriz extracelular de polisacáridos), permitiendo la adherencia a dispositivos protésicos y catéteres IV.","sketchy":"El \"gunk\" (mugre pegajosa) es la representación visual literal del biofilm adherido a superficies.","literal":"Staphylococcus epidermidis produces biofilms (extracellular polysaccharide matrix), allowing for adherence to prosthetic devices and IV catheters"},{"n":"16","nombre":"Van","ver":"Una furgoneta (van) visible a través de la ventana de la cocina.","clinica":"La vancomicina es el fármaco de elección para las infecciones por Staphylococcus epidermidis, ya que la mayoría de las cepas muestran resistencia a la nafcilina y meticilina debido a su capacidad de producir biofilms.","sketchy":"\"Van\" suena como el inicio de \"vancomycin\", mismo símbolo usado en C. difficile.","literal":"Vancomycin is the drug of choice for Staphylococcus epidermidis infections as most strains show resistance to nafcillin and methicillin due to their ability to produce biofilms"},{"n":"17","nombre":"Bladder cup","ver":"Una copa de cóctel con forma de vejiga que sostiene la chica.","clinica":"Staphylococcus saprophyticus es un patógeno frecuente en infecciones urinarias no complicadas (E. coli y Klebsiella son los agentes causales más frecuentes) y comúnmente causa infecciones urinarias no complicadas en mujeres jóvenes sexualmente activas (también conocida como \"cistitis de luna de miel\").","sketchy":"La copa en forma de vejiga (bladder) representa directamente el tracto urinario como sitio de infección.","literal":"Staphylococcus saprophyticus is an encountered pathogen for uncomplicated urinary tract infections (E. coli and Klebsiella are the most frequent causative agents) and commonly causes uncomplicated urinary tract infections in young, sexually active females (AKA honeymoon cystitis)"},{"n":"18","nombre":"Girl twirling hair","ver":"La chica enroscando su cabello mientras está sentada en la encimera.","clinica":"Staphylococcus saprophyticus es un patógeno frecuente en infecciones urinarias no complicadas y comúnmente causa infecciones urinarias no complicadas en mujeres jóvenes sexualmente activas (AKA \"cistitis de luna de miel\").","sketchy":"El gesto de jugar con el cabello refuerza el contexto de mujer joven, asociado a la \"cistitis de luna de miel\".","literal":"Staphylococcus saprophyticus is an encountered pathogen for uncomplicated urinary tract infections (E. coli and Klebsiella are the most frequent causative agents) and commonly causes uncomplicated urinary tract infections in young, sexually active females (AKA honeymoon cystitis)"}],"mapa":"imagenes/staphylococcus-epidermidis-saprophyticus-mapa.webp","texto":"imagenes/staphylococcus-epidermidis-saprophyticus-texto.webp"}]},{"nombre":"Gram-negativas","codigo":"gn","temas":[{"slug":"borrelia-burgdorferi","titulo":"Borrelia burgdorferi","items":[{"n":"1","nombre":"Bow","ver":"Un arco (bow) sostenido por un arquero en una competencia de tiro con arco en el bosque.","clinica":"Borrelia burgdorferi (una bacteria espiroqueta).","sketchy":"\"Bow\" (arco) suena fonéticamente similar al inicio de \"BOrrelia\", mismo símbolo usado en B. recurrentis.","literal":"Borrelia burgdorferi (a spirochete bacterium)"},{"n":"2","nombre":"Spiraled arrow","ver":"Una flecha con forma espiral (spiraled arrow) clavada en la diana.","clinica":"Borrelia burgdorferi es una bacteria espiroqueta.","sketchy":"La \"flecha en espiral\" representa literalmente la forma espiroqueta.","literal":"Borrelia burgdorferi is a spirochete bacterium"},{"n":"3","nombre":"\"Northeast archery competition\"","ver":"Un cartel que anuncia una \"Northeast Archery Competition\".","clinica":"B. burgdorferi es primariamente endémica en el NORESTE de Estados Unidos, aunque se está volviendo más prevalente en otras regiones de EE.UU.","sketchy":"\"Northeast\" en el cartel es la clave literal directa de la región endémica.","literal":"B. burgdorferi is primarily endemic to the Northeastern United States, although it's becoming more prevalent in other US regions"},{"n":"4","nombre":"Robin of Ixodes + tick","ver":"Un personaje tipo \"Robin Hood\" llamado \"Robin of Ixodes\" con una garrapata (tick) en su escudo.","clinica":"Borrelia burgdorferi se transmite principalmente por la garrapata de patas negras (Ixodes scapularis).","sketchy":"\"Robin of Ixodes\" es la clave literal directa del vector \"Ixodes scapularis\", y la garrapata en el escudo lo refuerza.","literal":"Borrelia burgdorferi is primarily transmitted by the blacklegged tick (Ixodes scapularis)"},{"n":"5","nombre":"White-footed mouse","ver":"Un ratón de patas blancas (white-footed mouse) en el bosque.","clinica":"El ratón de patas blancas sirve como reservorio primario de Borrelia burgdorferi y es el huésped de los estadios larval y ninfal de las garrapatas Ixodes scapularis.","sketchy":"El \"ratón de patas blancas\" es la representación literal directa del reservorio primario.","literal":"The white-footed mouse serves as a primary reservoir for Borrelia burgdorferi and is the host for the larval and nymphal stages of Ixodes scapularis ticks"},{"n":"6","nombre":"White-tailed deer","ver":"Un ciervo de cola blanca (white-tailed deer) en el bosque.","clinica":"El ciervo de cola blanca es el huésped obligatorio de las garrapatas adultas Ixodes scapularis.","sketchy":"El \"ciervo de cola blanca\" es la representación literal directa del huésped de la garrapata adulta.","literal":"The white-tailed deer is the obligatory host of adult Ixodes scapularis ticks"},{"n":"7","nombre":"Sir Wright","ver":"Un personaje llamado \"Sir Wright\" en la competencia de arquería.","clinica":"Borrelia burgdorferi capta mal la tinción de Gram, pero puede visualizarse usando tinción de Wright o Giemsa.","sketchy":"\"Sir Wright\" es la clave literal directa de la tinción \"Wright\".","literal":"Borrelia burgdorferi takes up the stains used in the Gram stain technique poorly, but can be visualized using Wright's or Giemsa stain"},{"n":"8","nombre":"Sir Giemsa","ver":"Un segundo personaje llamado \"Sir Giemsa\" en la competencia.","clinica":"Borrelia burgdorferi capta mal la tinción de Gram, pero puede visualizarse usando tinción de Wright o Giemsa.","sketchy":"\"Sir Giemsa\" es la clave literal directa de la tinción \"Giemsa\".","literal":"Borrelia burgdorferi takes up the stains used in the Gram stain technique poorly, but can be visualized using Wright's or Giemsa stain"},{"n":"9","nombre":"Lyme-green outfits in front of three stages","ver":"Trajes de color verde lima (lyme-green outfits) frente a tres etapas (three stages) marcadas en el bosque.","clinica":"Borrelia burgdorferi, la bacteria responsable de la enfermedad de Lyme, puede causar tres etapas distintas de enfermedad: localizada temprana, diseminada temprana, y diseminada tardía.","sketchy":"El color \"verde lima\" (Lyme-green) es la clave fonética directa de \"Lyme disease\", y las \"tres etapas\" representan las tres fases de la enfermedad.","literal":"Borrelia burgdorferi, the bacterium responsible for Lyme disease, can cause three distinct stages of illness: early localized, early disseminated, and late disseminated"},{"n":"10","nombre":"Stage 1 + bullseye","ver":"Un cartel de \"Stage 1\" con una diana (bullseye) marcada por una flecha.","clinica":"La etapa localizada temprana (stage 1) de la enfermedad de Lyme a menudo se marca por la aparición de eritema migrans, un rash rojo y expansivo con aclaramiento central que forma una apariencia característica \"en diana\" (bull's-eye) o de tiro al blanco, a menudo comenzando en el sitio de la mordida de garrapata.","sketchy":"La \"diana\" (bullseye) es la representación literal directa del eritema migrans en \"diana\".","literal":"Early localized (stage 1) of Lyme disease is often marked by the appearance of erythema migrans, a red, expanding rash with central clearing that forms a characteristic \"bull's-eye\" or target-like appearance, often starting at the tick bite site"},{"n":"11","nombre":"Stage 1 + sweat","ver":"Gotas de sudor (sweat) visibles en el personaje de \"Sir Wright\" en la etapa 1.","clinica":"La etapa localizada temprana (stage 1) de la enfermedad de Lyme puede presentarse con síntomas tipo gripe, incluyendo fiebre, escalofríos y mialgias.","sketchy":"El \"sudor\" representa directamente los síntomas tipo gripe (fiebre, escalofríos).","literal":"Early localized (stage 1) of Lyme disease may present with flu-like symptoms, including fever, chills, and myalgias"},{"n":"12","nombre":"Stage 2 + heart shield","ver":"Un cartel de \"Stage 2\" con un escudo con forma de corazón (heart shield).","clinica":"La enfermedad de Lyme diseminada temprana (stage 2) puede involucrar complicaciones cardíacas, incluyendo miocarditis que lleva a bloqueo cardíaco.","sketchy":"El \"escudo con forma de corazón\" representa directamente las complicaciones cardíacas.","literal":"Early disseminated (stage 2) Lyme disease can involve cardiac complications, including myocarditis leading to heart block"},{"n":"13","nombre":"Stage 2 + bilateral bells","ver":"Dos campanas (bilateral bells) colgando a ambos lados de la etapa 2.","clinica":"La enfermedad de Lyme diseminada temprana (stage 2) puede resultar en parálisis de Bell BILATERAL (parálisis facial de ambos lados debido a la afectación del nervio craneal VII) y otras formas de parálisis facial.","sketchy":"Las \"campanas bilaterales\" son la clave literal directa de la \"Bell's palsy\" (parálisis de Bell) bilateral.","literal":"Early disseminated (stage 2) Lyme disease may result in bilateral Bell's palsy (facial paralysis of both sides due to cranial nerve VII involvement) and other forms of facial paralysis"},{"n":"14","nombre":"Stage 3 + moving dummy","ver":"Un cartel de \"Stage 3\" con un maniquí de práctica (moving dummy) atado a un árbol.","clinica":"La enfermedad de Lyme diseminada tardía (stage 3) puede manifestarse como poliartritis MIGRATORIA, típicamente afectando articulaciones grandes (ej. rodilla).","sketchy":"El maniquí \"en movimiento\" (moving) representa la naturaleza \"migratoria\" de la poliartritis.","literal":"Late disseminated (stage 3) Lyme disease can manifest as migratory polyarthritis, typically affecting large joints (e.g., knee)"},{"n":"15","nombre":"Stage 3 + arrow in knee","ver":"Una flecha clavada en la rodilla (arrow in knee) del maniquí.","clinica":"La enfermedad de Lyme diseminada tardía (stage 3) puede manifestarse como poliartritis migratoria, típicamente afectando articulaciones grandes (ej. rodilla).","sketchy":"La \"flecha en la rodilla\" es la representación literal directa de la articulación grande afectada.","literal":"Late disseminated (stage 3) Lyme disease can manifest as migratory polyarthritis, typically affecting large joints (e.g., knee)"},{"n":"16","nombre":"Stage 3 + arrow in head","ver":"Una flecha clavada en la cabeza (arrow in head) del maniquí.","clinica":"La enfermedad de Lyme diseminada tardía (stage 3) puede presentarse con complicaciones neurológicas como encefalopatía (disfunción cognitiva, pérdida de memoria, cambios de humor, problemas de sueño) y encefalomielitis.","sketchy":"La \"flecha en la cabeza\" representa directamente las complicaciones neurológicas.","literal":"Late disseminated (stage 3) Lyme disease may present with neurological complications such as encephalopathy (cognitive dysfunction, memory loss, mood changes, sleep problems), polyneuropathy, and encephalomyelitis"},{"n":"17","nombre":"Unicycle","ver":"Un monociclo (unicycle) montado por uno de los personajes en el bosque.","clinica":"La doxiciclina se recomienda para el tratamiento de la enfermedad de Lyme en etapa temprana.","sketchy":"El \"monociclo\" (una sola rueda) es el símbolo fijo de Sketchy para \"doxiciclina\" (por asociación con la rueda).","literal":"Doxycycline is recommended for the treatment of early-stage Lyme disease"},{"n":"18","nombre":"3 axes shield","ver":"Un escudo con tres hachas (3 axes shield) sostenido por \"Robin of Ixodes\".","clinica":"La ceftriaxona se usa para el tratamiento de la enfermedad de Lyme en etapa tardía o casos severos.","sketchy":"Las \"3 hachas\" son la clave numérica literal directa de \"cefalosporina de tercera generación\" (ceftriaxona).","literal":"Ceftriaxone is used for the treatment of late-stage or severe cases of Lyme disease"}]},{"slug":"borrelia-recurrentis","titulo":"Borrelia recurrentis","items":[{"n":"1","nombre":"Bow","ver":"Un arco (bow) sostenido por un arquero en una habitación infantil de noche.","clinica":"Borrelia recurrentis (una bacteria espiroqueta).","sketchy":"\"Bow\" (arco) suena fonéticamente similar al inicio de \"BOrrelia\".","literal":"Borrelia recurrentis (a spirochete bacterium)"},{"n":"2","nombre":"Recurring nightmare","ver":"Un póster que muestra una pesadilla recurrente (recurring nightmare) en la pared.","clinica":"Borrelia recurrentis causa fiebre recurrente transmitida por piojos (LBRF).","sketchy":"\"Recurring nightmare\" (pesadilla recurrente) es la clave literal directa de \"RECURRENTis\" y \"relapsing fever\" (fiebre recurrente).","literal":"Borrelia recurrentis causes louse-borne relapsing fever (LBRF)"},{"n":"3","nombre":"Spiral-shaped bed posts","ver":"Postes de la cama con forma espiral (spiral-shaped bed posts).","clinica":"Borrelia recurrentis es una espiroqueta con forma espiral.","sketchy":"Los \"postes en espiral\" representan literalmente la forma espiral de la espiroqueta.","literal":"Borrelia recurrentis is a spiral-shaped spirochete"},{"n":"4","nombre":"Illuminating stars + dark ceiling","ver":"Estrellas iluminadas (illuminating stars) en el techo oscuro (dark ceiling) de la habitación.","clinica":"Borrelia recurrentis puede visualizarse usando microscopía de campo oscuro (dark-field microscopy) como espiroquetas delgadas, helicoidales y móviles.","sketchy":"Las \"estrellas en el techo oscuro\" son la clave literal directa de \"dark-field microscopy\".","literal":"Borrelia recurrentis can be visualized using dark-field microscopy as thin, helical, motile spirochetes"},{"n":"5","nombre":"Sir Wright + Sir Giemsa","ver":"Un póster con dos personajes tipo \"Sir Wright\" y \"Sir Giemsa\" haciendo gestos de karate.","clinica":"Borrelia recurrentis puede visualizarse en un frotis de sangre periférica usando una tinción de Wright o Wright-Giemsa.","sketchy":"\"Sir Wright\" y \"Sir Giemsa\" son la clave literal directa de las tinciones \"Wright\" y \"Giemsa\".","literal":"Borrelia recurrentis can be visualized on a peripheral blood smear using a Wright or Wright-Giemsa stain"},{"n":"6","nombre":"Variable color lights","ver":"Luces de colores variables (variable color lights) en el móvil colgante sobre la cama.","clinica":"Borrelia recurrentis tiene antígenos superficiales variables en su membrana externa que ayudan a evadir la detección del sistema inmune.","sketchy":"Las \"luces de colores variables\" representan literalmente los antígenos superficiales variables.","literal":"Borrelia recurrentis has variable surface antigens in its outer membrane that help evade immune system detection"},{"n":"7","nombre":"Pile of stuffed animals","ver":"Un montón de animales de peluche (pile of stuffed animals) en el suelo de la habitación.","clinica":"Los factores de riesgo para desarrollar fiebre recurrente transmitida por piojos = vivir en países de escasos recursos afectados por hacinamiento (ej. campos de refugiados), guerra y hambruna.","sketchy":"El \"montón hacinado de peluches\" representa literalmente el hacinamiento (overcrowding) como factor de riesgo.","literal":"Risk factors for developing louse-borne relapsing fever = living in poor resource countries affected by overcrowding (e.g. refugee camps), war, and famine"},{"n":"8","nombre":"Louse stuffed toy","ver":"Un peluche con forma de piojo (louse stuffed toy) entre los animales de peluche.","clinica":"Vector = Pediculus humanus corporis (piojo corporal humano).","sketchy":"El \"peluche de piojo\" es la representación literal directa del vector.","literal":"Vector = Pediculus humanus corporis (human body louse)"},{"n":"9","nombre":"Scratching / Rubbing eyes","ver":"Un niño rascándose (scratching) y frotándose los ojos (rubbing eyes).","clinica":"Los piojos infectados pueden transmitir Borrelia recurrentis a través de una mordida o cuando alguien aplasta un piojo al rascarse la piel o frotarse los ojos.","sketchy":"El \"rascarse y frotarse los ojos\" representa directamente los mecanismos de transmisión al aplastar al piojo.","literal":"Infected lice can transmit Borrelia recurrentis through a bite or when someone crushes a louse by scratching their skin or rubbing their eyes"},{"n":"11","nombre":"Person suffering recurring nightmare","ver":"La misma persona sufriendo la pesadilla recurrente en la cama.","clinica":"Huésped reservorio = humanos.","sketchy":"La \"persona\" en la pesadilla representa directamente al humano como reservorio.","literal":"Reservoir host = humans"},{"n":"12","nombre":"Flame bandana hanging from spinning mobile","ver":"Un pañuelo con llama (flame bandana) colgando de un móvil giratorio (spinning mobile).","clinica":"Borrelia recurrentis causa fiebre recurrente, caracterizada por episodios cíclicos de fiebre alta junto con una variedad de síntomas: cefalea, escalofríos, sudores, mialgia, artralgia y náuseas, seguidos por una fase de crisis en 2 partes.","sketchy":"El pañuelo \"en llamas\" (flame) representa la fiebre, y el móvil \"giratorio/cíclico\" (spinning) representa el patrón cíclico de la fiebre recurrente.","literal":"Borrelia recurrentis causes relapsing fever, which is characterized by cyclical high febrile episodes along with a range of symptoms—headache, chills, sweats, myalgia, arthralgia, and nausea—followed by a 2 part crisis phase"},{"n":"13","nombre":"\"Crisis Part 1 - Fire Frenzy\"","ver":"Un póster que dice \"Crisis Part 1 - Fire Frenzy\" con un volcán en erupción.","clinica":"Fase de crisis #1 = signos/síntomas \"calientes\" (hipertermia, taquicardia, hipertensión).","sketchy":"\"Fire Frenzy\" (frenesí de fuego) representa literalmente los signos \"calientes\" de la fase 1 de crisis.","literal":"Crisis part #1 = \"hot\" signs/symptoms (e.g., hyperthermia, tachycardia, hypertension)"},{"n":"14","nombre":"\"Crisis Part 2 - Cold Crash\"","ver":"Un póster que dice \"Crisis Part 2 - Cold Crash\" con un iceberg.","clinica":"Fase de crisis #2 = signos/síntomas \"fríos\" (hipotermia, hipotensión).","sketchy":"\"Cold Crash\" (colapso frío) representa literalmente los signos \"fríos\" de la fase 2 de crisis.","literal":"Crisis phase #2 = \"cold\" signs/symptoms (hypothermia, hypotension)"},{"n":"15","nombre":"Yellow pajamas","ver":"Un pijama de color amarillo (yellow pajamas) que lleva puesto el niño.","clinica":"La fiebre recurrente transmitida por piojos se presenta con ictericia debido a hemólisis y afectación hepática durante la espiroquetemia recurrente.","sketchy":"El \"pijama amarillo\" es la representación literal directa de la ictericia.","literal":"Louse-borne relapsing fever presents with jaundice due to hemolysis and hepatic involvement during recurrent spirochetemia"},{"n":"16","nombre":"Fallen white plates","ver":"Platos blancos caídos (fallen white plates) en el suelo de la habitación.","clinica":"La fiebre recurrente transmitida por piojos se presenta con trombocitopenia debido a supresión de la médula ósea y aumento de la destrucción periférica durante la espiroquetemia.","sketchy":"Los \"platos caídos\" (plates = platelets, plaquetas) representan la trombocitopenia.","literal":"Louse-borne relapsing fever presents with thrombocytopenia due to bone marrow suppression and increased peripheral destruction during spirochetemia"},{"n":"17","nombre":"Purple pencil","ver":"Un lápiz púrpura (purple pencil) en el suelo cerca de la bicicleta.","clinica":"Tratamiento = Penicilina G o doxiciclina; monitorear de cerca al paciente por reacción de Jarisch-Herxheimer (una reacción febril aguda [fiebre, escalofríos, mialgias, hipotensión] que típicamente ocurre dentro de horas de iniciar la terapia debido a la lisis rápida de espiroquetas).","sketchy":"\"Pencil\" es la clave fonética directa de \"penicillin\".","literal":"Treatment = Penicillin G or doxycycline; closely monitor patient for Jarisch-Herxheimer reaction (an acute febrile reaction [fever, chills, myalgias, hypotension] that typically occurs within hours of initiating therapy due to rapid lysis of spirochetes)"},{"n":"18","nombre":"Bicycle","ver":"Una bicicleta (bicycle) apoyada en el armario de la habitación.","clinica":"Tratamiento = Penicilina G o doxiciclina; monitorear de cerca al paciente por reacción de Jarisch-Herxheimer.","sketchy":"La \"bicicleta\" (rueda) es el símbolo fijo de Sketchy para \"doxiciclina\".","literal":"Treatment = Penicillin G or doxycycline; closely monitor patient for Jarisch-Herxheimer reaction (an acute febrile reaction [fever, chills, myalgias, hypotension] that typically occurs within hours of initiating therapy due to rapid lysis of spirochetes)"}]},{"slug":"haemophilus-influenzae","titulo":"Haemophilus influenzae","items":[{"n":"1","nombre":"Phyllis's chocolates","ver":"El letrero de la tienda \"Phyllis's Chocolate Covered Cherries\".","clinica":"Haemophilus influenzae (un cocobacilo gram-negativo).","sketchy":"\"Phyllis\" suena como \"Haemophilus\", siendo el nombre de la tienda la clave mnemotécnica principal.","literal":"Haemophilus influenzae (a gram-negative coccobacillus)"},{"n":"2","nombre":"Red hues","ver":"Tonos rojos en la fachada del local y el letrero.","clinica":"Haemophilus influenzae es un cocobacilo gram-negativo.","sketchy":"El color rojo refuerza la tinción gram-negativa.","literal":"Haemophilus influenzae is a gram-negative coccobacillus"},{"n":"3","nombre":"Pink oval candies","ver":"Dulces ovalados de color rosa dentro del dispensador.","clinica":"Haemophilus influenzae es un cocobacilo gram-negativo.","sketchy":"La forma ovalada de los dulces refuerza visualmente la morfología de cocobacilo.","literal":"Haemophilus influenzae is a gram-negative coccobacillus"},{"n":"4","nombre":"\"Chocolate\"","ver":"La palabra \"Chocolate\" en el letrero de la tienda.","clinica":"El agar chocolate, enriquecido con células sanguíneas lisadas, es el medio de crecimiento ideal para Haemophilus influenzae, ya que suministra los nutrientes y factores necesarios.","sketchy":"\"Chocolate\" es la clave mnemotécnica directa para el agar chocolate, medio de cultivo específico de esta bacteria.","literal":"Chocolate agar, which is enriched with lysed blood cells, is the ideal growth medium for Haemophilus influenzae, as it supplies necessary nutrients and factors"},{"n":"5","nombre":"\"5¢\"","ver":"Una máquina dispensadora que marca el precio \"5¢\".","clinica":"Haemophilus influenzae requiere NAD⁺ (factor V) y hemina (factor X) para su crecimiento.","sketchy":"El \"5\" representa directamente el \"factor V\" (número romano V = 5) necesario para el crecimiento.","literal":"Haemophilus influenzae requires NAD⁺ (factor V) and hemin (factor X) for growth"},{"n":"6","nombre":"\"10¢\"","ver":"Un cartel que marca el precio \"10¢\" sobre la vitrina de dulces.","clinica":"Haemophilus influenzae requiere NAD⁺ (factor V) y hemina (factor X) para su crecimiento.","sketchy":"El \"10\" representa directamente el \"factor X\" (número romano X = 10) necesario para el crecimiento.","literal":"Haemophilus influenzae requires NAD⁺ (factor V) and hemin (factor X) for growth"},{"n":"7","nombre":"Aerosol spray","ver":"Un aerosol siendo rociado por un personaje hacia unos insectos.","clinica":"Haemophilus influenzae se transmite vía gotitas respiratorias.","sketchy":"El aerosol rociado en el aire representa directamente la transmisión por gotitas respiratorias.","literal":"Haemophilus influenzae is transmitted via respiratory droplets"},{"n":"8","nombre":"Screaming kid + drool","ver":"Un niño gritando con baba y saliva goteando de su boca.","clinica":"La epiglotitis causada por Haemophilus influenzae, afectando principalmente a niños entre 2 y 6 años, se presenta con síntomas como disfagia, babeo y estridor inspiratorio.","sketchy":"El niño gritando y babeando representa directamente los síntomas clásicos de la epiglotitis.","literal":"Epiglottitis caused by Haemophilus influenzae, primarily affecting children between the ages of 2 and 6 years, presents with symptoms such as dysphagia, drooling, and inspiratory stridor"},{"n":"9","nombre":"Cherries","ver":"Cerezas rojas cubriendo el pastel de chocolate.","clinica":"La epiglotitis causada por Haemophilus influenzae a menudo se presenta con una \"epiglotis roja cereza\" debido a su apariencia hinchada e inflamada.","sketchy":"Las cerezas son la representación literal directa de la \"cherry red epiglottis\".","literal":"Epiglottitis caused by Haemophilus influenzae often presents with a \"cherry red epiglottis\" due to its swollen and inflamed appearance"},{"n":"10","nombre":"Plugging ears","ver":"Un soldado tapándose los oídos con las manos.","clinica":"Haemophilus influenzae es una causa común de otitis media aguda y recurrente.","sketchy":"Taparse los oídos representa directamente el problema de otitis media.","literal":"Haemophilus influenzae is a common cause of acute and recurrent otitis media"},{"n":"11","nombre":"Bee + glass capsule","ver":"Una abeja dentro de una cápsula/burbuja de vidrio.","clinica":"Haemophilus influenzae tipo b (Hib) posee una cápsula de polisacárido que ayuda a evadir la respuesta inmune del huésped.","sketchy":"\"Bee\" (abeja) suena como la letra \"b\" de \"type b\" (Hib), y la cápsula de vidrio representa la cápsula bacteriana.","literal":"Haemophilus influenzae type b (Hib) possesses a polysaccharide capsule that aids in evasion of the host immune response"},{"n":"12","nombre":"Meningitis helmet + holding head","ver":"Un personaje con casco protector sosteniéndose la cabeza con dolor.","clinica":"Hib es una causa común de meningitis en adolescentes, que a menudo se presenta con meningismo (cefalea, rigidez de nuca, fotofobia y a menudo náuseas/vómitos).","sketchy":"El casco y el gesto de sostenerse la cabeza representan la meningitis y su síntoma principal.","literal":"Hib is a common cause of meningitis in adolescents, which often presents with meningismus (clinical syndrome of headache, neck stiffness, photophobia, and often nausea/vomiting)"},{"n":"13","nombre":"Sickles","ver":"Hoces/guadañas sostenidas por uno de los personajes con casco.","clinica":"Los pacientes con enfermedad de células falciformes o asplenia son más susceptibles a infecciones por bacterias encapsuladas como cepas encapsuladas de Haemophilus influenzae.","sketchy":"Las \"sickles\" (hoces) son la representación literal directa de la \"sickle cell disease\".","literal":"Patients with sickle cell disease or asplenia are more susceptible to infections from encapsulated bacteria like encapsulated strains of Haemophilus influenzae"},{"n":"14","nombre":"Kid with syringe","ver":"Un niño pequeño sosteniendo una jeringa de color rosa.","clinica":"Los infantes y niños pequeños deben recibir una serie de vacunas Hib para prevenir infecciones graves.","sketchy":"La jeringa sostenida por el niño representa directamente la vacunación Hib en la población pediátrica.","literal":"Infants and toddlers should get an Hib vaccine series to prevent serious infections"},{"n":"15","nombre":"\"Sugar DIPped\"","ver":"Un cartel que dice \"SPECIAL SUGAR DIPped\".","clinica":"El polisacárido capsular de Hib es un inmunógeno pobre en infantes; para mejorar la inmunogenicidad, el polisacárido de Hib se acopla covalentemente a toxoide diftérico.","sketchy":"\"DIP\" en \"DIPped\" es la clave mnemotécnica para \"DIPhtheria toxoid\" (toxoide diftérico).","literal":"The capsular polysaccharide of Hib is a poor immunogen in infants; to enhance immunogenicity, the Hib polysaccharide is covalently coupled to diphtheria toxoid"},{"n":"16","nombre":"\"$2.18\"","ver":"El precio \"$2.18\" en el mismo cartel de \"Special Sugar DIPped\".","clinica":"La vacuna Hib se administra en una serie de inyecciones entre los ~2 y 18 meses de edad.","sketchy":"Los números \"2.18\" representan directamente el rango de edad (2 a 18 meses) del esquema de vacunación.","literal":"The Hib vaccine is administered in a series of injections between the ages of ~2–18 months"},{"n":"17","nombre":"3 axes","ver":"Tres hachas sostenidas por uno de los personajes con casco.","clinica":"Las cefalosporinas de tercera generación, como la ceftriaxona, son los antibióticos iniciales de elección para la meningitis por Hib.","sketchy":"Las \"3 axes\" (tres hachas) representan directamente las cefalosporinas de tercera generación.","literal":"Third-generation cephalosporins, such as ceftriaxone, are the initial antibiotics of choice for Hib meningitis"},{"n":"18","nombre":"Rifle","ver":"Un rifle sostenido por el personaje de la izquierda.","clinica":"La profilaxis con rifampicina se recomienda para contactos cercanos de pacientes con infección Hib invasiva.","sketchy":"\"Rifle\" suena como el inicio de \"rifampin\", vinculando el arma con el fármaco profiláctico.","literal":"Rifampin prophylaxis is recommended for close contacts of patients with invasive Hib infection"}],"mapa":"imagenes/haemophilus-influenzae-mapa.webp","texto":"imagenes/haemophilus-influenzae-texto.webp"},{"slug":"leptospira-interrogans","titulo":"Leptospira interrogans","items":[{"n":"1","nombre":"Spiral wave","ver":"Una ola en espiral (spiral wave) sobre la que surfea un personaje en un ambiente tropical.","clinica":"Leptospira interrogans (una bacteria espiroqueta).","sketchy":"La \"ola en espiral\" representa literalmente la forma espiroqueta de la bacteria.","literal":"Leptospira interrogans (a spirochete bacterium)"},{"n":"2","nombre":"Question mark + spiral leash","ver":"Un signo de interrogación (question mark) formado por la correa en espiral (spiral leash) de la tabla de surf.","clinica":"Leptospira interrogans tiene una forma helicoidal o en espiral única, que se asemeja a un signo de interrogación o una espiral apretada cuando se observa con microscopía de campo oscuro.","sketchy":"El \"signo de interrogación\" es la clave literal directa del apellido \"interrogans\" y de la apariencia microscópica descrita.","literal":"Leptospira interrogans has a unique helical or spiral-shape resembling a question mark or a tight coil when observed under dark-field microscopy"},{"n":"3","nombre":"Tropical oasis + yellow water","ver":"Un oasis tropical (tropical oasis) con agua de tono amarillento (yellow water).","clinica":"Leptospira es endémica en regiones TROPICALES y comúnmente se encuentra en animales como roedores y perros, se excreta en la ORINA, y se transmite a humanos cuando nadan en agua CONTAMINADA.","sketchy":"El \"oasis tropical\" representa la región endémica, y el \"agua amarillenta\" representa la contaminación por orina.","literal":"Leptospira is endemic in tropical regions and is commonly found in animals like rodents and dogs, excreted in urine, and transmitted to humans when they swim in contaminated water"},{"n":"4","nombre":"Sweat","ver":"Gotas de sudor (sweat) visibles en el rostro del surfista.","clinica":"La fiebre es un síntoma inicial típico de la leptospirosis, a menudo acompañada de otros síntomas inespecíficos tipo gripe (ej. cefalea, mialgia y malestar general).","sketchy":"El \"sudor\" es la representación literal directa de la fiebre.","literal":"Fever is a typical initial symptom of leptospirosis, often accompanied by other nonspecific flu-like symptoms (e.g., headache, myalgia, and malaise)"},{"n":"5","nombre":"Pink glasses","ver":"Gafas de color rosa (pink glasses) que lleva puestas el surfista.","clinica":"La sufusión conjuntival, caracterizada por enrojecimiento de la conjuntiva sin exudados inflamatorios (es decir, conjuntivitis no supurativa), se observa frecuentemente en las etapas tempranas de la leptospirosis.","sketchy":"Las \"gafas rosas\" representan literalmente el enrojecimiento conjuntival (conjunctival suffusion).","literal":"Conjunctival suffusion, characterized by redness of the conjunctiva without inflammatory exudates (i.e., non-suppurative conjunctivitis), is frequently observed in the early stages of leptospirosis"},{"n":"6","nombre":"Whale","ver":"Una ballena (whale) saltando en el océano cerca del surfista.","clinica":"La enfermedad de Weil es una manifestación seria y potencialmente mortal de la leptospirosis, caracterizada por ictericia, hemorragia, falla renal y dificultad respiratoria.","sketchy":"La \"ballena\" (Weil suena similar a \"whale\" en la mnemotecnia visual) representa la enfermedad de Weil.","literal":"Weil's disease is a serious and potentially life-threatening manifestation of leptospirosis, characterized by jaundice, hemorrhage, renal failure, and respiratory distress"},{"n":"7","nombre":"Disseminated red floaties","ver":"Flotadores rojos diseminados (disseminated red floaties) por todo el escenario.","clinica":"La leptospirosis puede diseminarse de forma hematógena, lo cual involucra que la bacteria viaje a través del torrente sanguíneo, llevando a afectación multiorgánica.","sketchy":"Los \"flotadores rojos diseminados\" (glóbulos rojos) representan literalmente la diseminación hematógena.","literal":"Leptospirosis can disseminate hematogenously, which involves the bacteria traveling through the bloodstream, leading to multi-organ involvement"},{"n":"8","nombre":"Kidney dinghy","ver":"Un bote inflable con forma de riñón (kidney dinghy) flotando en el agua.","clinica":"Tanto la falla renal aguda (puede presentarse como azotemia [BUN y creatinina elevados], disturbios electrolíticos, gasto urinario reducido, y proteinuria o hematuria) como la falla hepática son complicaciones significativas asociadas con la enfermedad de Weil.","sketchy":"El \"bote con forma de riñón\" representa directamente la falla renal aguda.","literal":"Both acute kidney failure (may present as azotemia [elevated BUN and creatinine], electrolyte disturbances, reduced urine output, and proteinuria or hematuria) and liver failure are significant complications associated with Weil's disease"},{"n":"9","nombre":"Yellow wetsuit","ver":"Un traje de neopreno de color amarillo (yellow wetsuit) que lleva puesto el surfista.","clinica":"Tanto la falla renal aguda como la falla hepática (puede presentarse como ictericia, bilirrubina elevada, y elevación leve a moderada de transaminasas) son complicaciones significativas asociadas con la enfermedad de Weil.","sketchy":"El \"traje de neopreno amarillo\" es la representación literal directa de la ictericia.","literal":"Both acute kidney failure and liver failure (may present as jaundice, elevated bilirubin, and mild to moderate transaminase elevation) are significant complications associated with Weil's disease"}]},{"slug":"moraxella-catarrhalis","titulo":"Moraxella catarrhalis","items":[{"n":"1","nombre":"Moray eel-cat","ver":"Una criatura híbrida entre morena (moray eel) y gato, con cuerpo largo y cabeza felina.","clinica":"Moraxella catarrhalis es un diplococo gram-negativo.","sketchy":"\"Moray eel-cat\" suena fonéticamente como \"Moraxella catarrhalis\" (moray = Mora-, cat = -catarrhalis), siendo la clave mnemotécnica del nombre completo.","literal":"Moraxella catarrhalis is a gram negative diplococcus"},{"n":"2","nombre":"Glow of red flames","ver":"Un resplandor de llamas rojas iluminando el fondo de la escena submarina.","clinica":"Moraxella catarrhalis es un diplococo gram-negativo.","sketchy":"El resplandor rojo refuerza la tinción gram-negativa.","literal":"Moraxella catarrhalis is a gram negative diplococcus"},{"n":"3","nombre":"Nose of plane","ver":"La nariz/proa de un avión hundido, visible en el escenario submarino.","clinica":"M. catarrhalis puede colonizar la nasofaringe.","sketchy":"La nariz del avión representa directamente la nasofaringe como sitio de colonización.","literal":"M. catarrhalis can colonize the nasopharynx"},{"n":"4","nombre":"Blue gem ring","ver":"Un anillo con una gema azul, flotando en el agua.","clinica":"M. catarrhalis es un aerobio oxidasa positivo; puede formar biofilm, produce beta lactamasa; signo positivo del \"hockey-puck\".","sketchy":"El color azul de la gema representa la prueba de oxidasa positiva, que produce un color azul en la reacción.","literal":"M. catarrhalis is an oxidase positive aerobe; can form a biofilm, produces beta lactamase; positive hockey-puck sign"},{"n":"5","nombre":"Bellows-fish","ver":"Un pez con forma de fuelle (bellows) expulsando burbujas de aire.","clinica":"M. catarrhalis es un aerobio oxidasa positivo; puede formar biofilm, produce beta lactamasa; signo positivo del hockey-puck.","sketchy":"El fuelle que bombea aire representa el carácter aerobio de la bacteria.","literal":"M. catarrhalis is an oxidase positive aerobe; can form a biofilm, produces beta lactamase; positive hockey-puck sign"},{"n":"6","nombre":"Algae","ver":"Algas verdes cubriendo parte de la estructura submarina de la derecha.","clinica":"M. catarrhalis es un aerobio oxidasa positivo; puede formar biofilm (refuerza su resistencia contra ciertos antibióticos), produce beta lactamasa; signo positivo del hockey-puck.","sketchy":"Las algas adheridas a la estructura son la representación visual literal del biofilm.","literal":"M. catarrhalis is an oxidase positive aerobe; can form a biofilm (bolsters its resistance against certain antibiotics), produces beta lactamase; positive hockey-puck sign"},{"n":"7","nombre":"Broken beta-lactam gyroscope","ver":"Un giroscopio dorado roto, flotando cerca de la estructura de la derecha.","clinica":"M. catarrhalis es un aerobio oxidasa positivo; puede formar biofilm, produce beta lactamasa (una enzima que permite la degradación de antibióticos beta-lactámicos, incluyendo penicilinas); signo positivo del hockey puck.","sketchy":"El giroscopio roto representa cómo la beta-lactamasa rompe la estructura del anillo beta-lactámico de los antibióticos.","literal":"M. catarrhalis is an oxidase positive aerobe; can form a biofilm, produces beta lactamase (an enzyme enabling the breakdown of beta-lactam antibiotics, including penicillins); positive hockey puck sign"},{"n":"8","nombre":"Sliding plane wheel","ver":"Una rueda/disco tipo llanta de avión deslizándose por el agua.","clinica":"M. catarrhalis es un aerobio oxidasa positivo; forma biofilms, produce beta lactamasa; signo positivo del hockey puck (indicando el movimiento suave de las colonias a través de superficies de agar).","sketchy":"La rueda deslizándose es la representación literal del \"hockey-puck sign\", el deslizamiento de las colonias en el agar como un disco de hockey.","literal":"M. catarrhalis is an oxidase positive aerobe; forms biofilms, produces beta lactamase; positive hockey puck sign (indicating the smooth movement of colonies across agar surfaces)"},{"n":"9","nombre":"Amelia Ear-hurt","ver":"La mujer aviadora (referencia a Amelia Earhart) nadando, sosteniéndose la oreja.","clinica":"M. catarrhalis es una causa común de otitis media bacteriana (OM) en niños, a menudo afectando a aquellos ya colonizados.","sketchy":"\"Amelia Ear-hurt\" (juego de palabras con Amelia Earhart y \"ear hurt\" = oído dolorido) señala directamente la otitis media.","literal":"M. catarrhalis a common cause of bacterial otitis media (OM) in children, often affecting those already colonized"},{"n":"10","nombre":"Red leaky plane nose","ver":"La nariz del avión hundido, de color rojo, con líquido verdoso goteando de ella.","clinica":"M. catarrhalis es una causa común de sinusitis bacteriana.","sketchy":"La nariz que gotea representa directamente la sinusitis y su secreción.","literal":"M. catarrhalis is a common cause of bacterial sinusitis"},{"n":"11","nombre":"Blue bloater fish","ver":"Un pez globo azul e hinchado en el centro de la escena.","clinica":"M. catarrhalis está asociada con exacerbaciones de la Enfermedad Pulmonar Obstructiva Crónica (EPOC) y bronconeumonía relacionada con EPOC.","sketchy":"El \"blue bloater\" (pez hinchado y azul) es el apodo clásico del fenotipo de bronquitis crónica en la EPOC.","literal":"M. catarrhalis is associated with Chronic Obstructive Pulmonary Disease (COPD) exacerbations and COPD-related bronchopneumonia"},{"n":"12","nombre":"Cephalopod","ver":"Un calamar/pulpo (cefalópodo) en la parte inferior de la escena.","clinica":"M. catarrhalis es sensible a cefalosporinas, amoxicilina-clavulanato, trimetoprim-sulfametoxazol (TMP-SMX) y fluoroquinolonas.","sketchy":"\"Cephalopod\" suena fonéticamente similar al inicio de \"cephalosporins\" (cefalosporinas).","literal":"M. catarrhalis is sensitive to cephalosporins, amoxicillin-clavulanate, trimethoprim-sulfamethoxazole (TMP-SMX), fluoroquinolones"},{"n":"13","nombre":"Box of \"AMMO\" + clarinet harpoon","ver":"Una caja etiquetada \"AMMO\" junto a un arpón con forma de clarinete.","clinica":"Moraxella catarrhalis es sensible a cefalosporinas, amoxicilina-clavulanato, trimetoprim-sulfametoxazol (TMP-SMX) y fluoroquinolonas.","sketchy":"\"AMMO\" suena como el inicio de \"amoxicillin\", y el clarinete acompaña el listado de antibióticos efectivos.","literal":"Moraxella catarrhalis is sensitive to cephalosporins, amoxicillin-clavulanate, trimethoprim-sulfamethoxazole (TMP-SMX), fluoroquinolones"},{"n":"14","nombre":"Rotten sulfa-eggs","ver":"Huevos podridos con manchas verdosas, recordando el olor a azufre.","clinica":"Moraxella catarrhalis es sensible a cefalosporinas, amoxicilina-clavulanato, trimetoprim-sulfametoxazol (TMP-SMX) y fluoroquinolonas.","sketchy":"Los \"sulfa-eggs\" (huevos de azufre) representan directamente \"sulfamethoxazole\", parte del TMP-SMX.","literal":"Moraxella catarrhalis is sensitive to cephalosporins, amoxicillin-clavulanate, trimethoprim-sulfamethoxazole (TMP-SMX), fluoroquinolones"},{"n":"15","nombre":"Flower anemones","ver":"Anémonas con forma de flor púrpura creciendo sobre la roca de la derecha.","clinica":"Moraxella catarrhalis es sensible a cefalosporinas, amoxicilina-clavulanato, trimetoprim-sulfametoxazol (TMP-SMX) y fluoroquinolonas.","sketchy":"Las flores/anémonas (\"flor\" → fluoroquinolonas) cierran el listado de antibióticos efectivos.","literal":"Moraxella catarrhalis is sensitive to cephalosporins, amoxicillin-clavulanate, trimethoprim-sulfamethoxazole (TMP-SMX), fluoroquinolones"}],"mapa":"imagenes/moraxella-catarrhalis-mapa.webp","texto":"imagenes/moraxella-catarrhalis-texto.webp"},{"slug":"neisseria-gonorrhoeae","titulo":"Neisseria gonorrhoeae","items":[{"n":"1","nombre":"Gonzo's Bar","ver":"El letrero de un bar llamado \"Gonzo's Bar\" con un escudo y hachas cruzadas.","clinica":"Neisseria gonorrhoeae: diplococos gram-negativos, causa de gonorrea, oxidasa-positivo, patógeno humano estricto, crece en agar chocolate o agar Thayer-Martin, evade la inmunidad vía variación antigénica de pili, normalmente eliminada por el complejo de ataque de membrana (MAC); la deficiencia de C5-C9 aumenta la susceptibilidad.","sketchy":"\"Gonzo's\" es la clave fonética directa de \"gonorrhoeae\", siendo el nombre del bar el ancla mnemotécnica principal.","literal":"Neisseria gonorrhoeae: gram-negative diplococci, cause of gonorrhea, oxidase-positive, strict human pathogen, grows on chocolate agar or Thayer-Martin agar, evades immunity via pili antigenic variation, normally cleared by the membrane attack complex (MAC); C5–C9 deficiency increases susceptibility."},{"n":"2","nombre":"Red room","ver":"Tonos rojos predominantes en la decoración del bar.","clinica":"Neisseria gonorrhoeae: diplococos GRAM-NEGATIVOS, causa de gonorrea.","sketchy":"El color rojo del salón refuerza la tinción gram-negativa.","literal":"Neisseria gonorrhoeae: gram-negative diplococci, cause of gonorrhea, oxidase-positive, strict human pathogen, grows on chocolate agar or Thayer-Martin agar, evades immunity via pili antigenic variation, normally cleared by MAC; C5–C9 deficiency increases susceptibility."},{"n":"3","nombre":"Chocolate bar","ver":"Una barra de chocolate (chocolate bar) sobre la barra del establecimiento.","clinica":"N. gonorrhoeae crece en agar CHOCOLATE o agar Thayer-Martin.","sketchy":"La \"barra de chocolate\" es la clave literal directa del medio de cultivo \"chocolate agar\".","literal":"Neisseria gonorrhoeae: gram-negative diplococci, cause of gonorrhea, oxidase-positive, strict human pathogen, grows on chocolate agar or Thayer-Martin agar, evades immunity via pili antigenic variation, normally cleared by MAC; C5–C9 deficiency increases susceptibility."},{"n":"4","nombre":"\"MAC\" the private eye","ver":"Un detective privado llamado \"MAC\" (private eye) en la barra.","clinica":"N. gonorrhoeae normalmente es eliminada por el complejo de ataque de membrana (MAC); la deficiencia de C5-C9 aumenta la susceptibilidad.","sketchy":"\"MAC\" es la clave literal directa del \"Membrane Attack Complex\".","literal":"Neisseria gonorrhoeae: gram-negative diplococci, cause of gonorrhea, oxidase-positive, strict human pathogen, grows on chocolate agar or Thayer-Martin agar, evades immunity via pili antigenic variation, normally cleared by the membrane attack complex (MAC); C5–C9 deficiency increases susceptibility."},{"n":"5","nombre":"Ace card","ver":"Una carta de \"As\" (Ace card) en la mano de un jugador de la barra.","clinica":"Neisseria gonorrhoeae produce proteasa de IgA.","sketchy":"El \"As\" (Ace) es la clave fonética directa para \"IgA\".","literal":"Neisseria gonorrhoeae produces IgA protease"},{"n":"6","nombre":"\"MAC\" the private eye flirting at the bar","ver":"El detective \"MAC\" coqueteando con una mujer en la barra.","clinica":"La gonorrea es una infección de transmisión sexual (ITS) (reportable).","sketchy":"El \"coqueteo\" en el bar representa directamente la naturaleza de transmisión sexual.","literal":"Gonorrhea is a (reportable) sexually transmitted infection (STI)"},{"n":"7","nombre":"2 red pillows","ver":"Dos almohadas rojas (2 red pillows) sobre los sillones blancos.","clinica":"N. gonorrhoeae (diplococos gram-negativos) son intracelulares facultativos dentro de leucocitos polimorfonucleares (PMN).","sketchy":"Las \"dos almohadas\" representan la disposición en pares (diplococos) dentro de la célula.","literal":"N. gonorrhoeae (gram-negative diplococci) are facultative intracellular within polymorphonuclear leukocytes (PMNs)"},{"n":"8","nombre":"Seats with the high back white chairs + reflective spots","ver":"Sillas blancas de respaldo alto con manchas reflectantes (reflective spots).","clinica":"N. gonorrhoeae (diplococos gram-negativos) son intracelulares facultativos dentro de leucocitos polimorfonucleares (PMN).","sketchy":"Las manchas \"reflectantes\" en las sillas blancas (PMN) representan los diplococos dentro de estas células.","literal":"N. gonorrhoeae (gram-negative diplococci) are facultative intracellular within polymorphonuclear leukocytes (PMNs)"},{"n":"9","nombre":"Broken glass","ver":"Una copa de vidrio rota (broken glass) en el suelo.","clinica":"Neisseria gonorrhoeae NO está encapsulada.","sketchy":"El \"vidrio roto\" (sin cápsula intacta) representa la ausencia de cápsula bacteriana.","literal":"Neisseria gonorrhoeae are not encapsulated"},{"n":"10","nombre":"Male detective \"MAC\"","ver":"El detective masculino \"MAC\" en primer plano de la barra.","clinica":"La gonorrea puede presentarse como uretritis en HOMBRES, a menudo asintomática pero puede mostrar leucocitos en la orina (piuria) sin disuria. Cuando es sintomática, la uretritis causa disuria y secreción purulenta. La infección puede ascender e involucrar la próstata (prostatitis) o testículos (orquitis).","sketchy":"El \"detective masculino\" representa directamente la presentación en hombres.","literal":"Gonorrhea can present as urethritis in men, often asymptomatic but may show WBCs in urine (pyuria) without dysuria. When symptomatic, urethritis causes dysuria and purulent discharge. Infection can ascend to involve the prostate (prostatitis) or testes (orchitis)."},{"n":"11","nombre":"Lady at the bar","ver":"Una mujer sentada en la barra (lady at the bar).","clinica":"En MUJERES, N. gonorrhoeae puede causar cervicitis (infección cervical, a menudo asintomática con secreción o sangrado) o uretritis (infección uretral, a veces causando disuria o piuria). Ambas pueden progresar a enfermedad inflamatoria pélvica si no se tratan.","sketchy":"La \"dama en la barra\" representa directamente la presentación en mujeres.","literal":"In women, N. gonorrhoeae can cause cervicitis (cervical infection, often asymptomatic with discharge or bleeding) or urethritis (urethral infection, sometimes causing dysuria or pyuria). Both can progress to pelvic inflammatory disease if untreated"},{"n":"12","nombre":"Chandelier with lighted candles","ver":"Un candelabro (chandelier) con velas encendidas colgando del techo.","clinica":"La enfermedad inflamatoria pélvica (PID) puede involucrar las trompas de Falopio (salpingitis) u ovarios (absceso tubo-ovárico), presentándose a menudo con secreción vaginal blanca purulenta, y puede llevar a embarazo ectópico e infertilidad.","sketchy":"El \"candelabro\" representa las trompas de Falopio ramificadas, y las velas la inflamación (PID).","literal":"Pelvic inflammatory disease (PID) can involve the fallopian tubes (salpingitis) or ovaries (tubo-ovarian abscess), often presenting with white, purulent vaginal discharge, and may lead to ectopic pregnancy and infertility."},{"n":"13","nombre":"Chandelier arms","ver":"Los brazos del candelabro (chandelier arms) extendidos.","clinica":"La PID puede involucrar las trompas de Falopio (salpingitis) u ovarios (absceso tubo-ovárico), presentándose con secreción vaginal blanca purulenta, y puede llevar a embarazo ectópico e infertilidad.","sketchy":"Los \"brazos del candelabro\" representan literalmente las trompas de Falopio.","literal":"PID can involve the fallopian tubes (salpingitis) or ovaries (tubo-ovarian abscess), often presenting with white, purulent vaginal discharge, and may lead to ectopic pregnancy and infertility."},{"n":"14","nombre":"Chandelier curved ends","ver":"Los extremos curvados del candelabro (curved ends).","clinica":"La PID puede involucrar las trompas de Falopio (salpingitis) u ovarios (absceso tubo-ovárico), presentándose con secreción vaginal blanca purulenta, y puede llevar a embarazo ectópico e infertilidad.","sketchy":"Los \"extremos curvados\" representan los ovarios en los extremos de las trompas.","literal":"PID can involve the fallopian tubes (salpingitis) or ovaries (tubo-ovarian abscess), often presenting with white, purulent vaginal discharge, and may lead to ectopic pregnancy and infertility."},{"n":"15","nombre":"Chandelier leaking candle wax","ver":"Cera goteando (leaking candle wax) del candelabro.","clinica":"La PID puede involucrar las trompas de Falopio (salpingitis) u ovarios (absceso tubo-ovárico), presentándose con secreción vaginal blanca purulenta, y puede llevar a embarazo ectópico e infertilidad.","sketchy":"La \"cera goteando\" representa la secreción vaginal purulenta blanca.","literal":"PID can involve the fallopian tubes (salpingitis) or ovaries (tubo-ovarian abscess), often presenting with white, purulent vaginal discharge, and may lead to ectopic pregnancy and infertility."},{"n":"16","nombre":"Fitz, Hugh, & Curtis Band","ver":"Una banda musical llamada \"Fitz Hugh Curtis Band\" tocando en el escenario.","clinica":"El síndrome de Fitz-Hugh-Curtis, una complicación de la PID, ocurre cuando la infección gonocócica se disemina al hígado y peritoneo.","sketchy":"\"Fitz, Hugh, & Curtis Band\" es la clave literal directa del síndrome del mismo nombre.","literal":"Fitz-Hugh-Curtis syndrome, a complication of PID, occurs when gonococcal infection spreads to the liver and peritoneum"},{"n":"17","nombre":"Violin strings","ver":"Cuerdas de violín (violin strings) visibles en el instrumento de la banda.","clinica":"La inflamación del peritoneo puede llevar a adherencias largas y delgadas tipo cordón que se adhieren a la cápsula del hígado (referidas como adherencias \"en cuerda de violín\").","sketchy":"Las \"cuerdas de violín\" son la representación literal directa de las adherencias \"violin str
